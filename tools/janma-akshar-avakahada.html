<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>जन्म अक्षर व अवकहड़ा चक्र कैलकुलेटर v1.5</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
* { box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Noto Sans Devanagari", "Mangal", system-ui, sans-serif; background: #fdf6ec; color: #3b2f1e; margin: 0; padding: 16px; }
.app { max-width: 780px; margin: 0 auto; background: #fffdf8; border: 2px solid #d4a017; border-radius: 14px; padding: 20px; box-shadow: 0 4px 18px rgba(180,130,20,.15); }
h1 { text-align: center; color: #9a5b00; margin: 4px 0; font-size: 1.6rem; }
.sub { text-align: center; color: #8a6d3b; font-size: .9rem; margin-bottom: 18px; }
form { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.full { grid-column: 1 / -1; }
label { font-size: .85rem; font-weight: 600; color: #6b4e12; display: block; margin-bottom: 4px; }
input, select { width: 100%; padding: 9px 10px; border: 1.5px solid #d9b45b; border-radius: 8px; font-size: 1rem; background: #fff; font-family: inherit; }
button.calc { grid-column: 1 / -1; background: linear-gradient(180deg,#e8a812,#c07f00); color: #fff; border: none; border-radius: 10px; padding: 13px; font-size: 1.15rem; font-weight: 700; cursor: pointer; font-family: inherit; margin-top: 6px; }
button.calc:disabled { opacity: .55; cursor: wait; }
button.small { background: none; border: 1px dashed #c07f00; color: #9a5b00; border-radius: 8px; padding: 6px 12px; font-size: .85rem; cursor: pointer; font-family: inherit; }
button.tabbtn { border: 1.5px solid #d9b45b; background: #fff; color: #6b4e12; border-radius: 10px; padding: 10px; font-size: 1rem; font-weight: 700; cursor: pointer; font-family: inherit; }
button.tabbtn.on { background: #9a5b00; color: #fff; }
#loading { text-align: center; color: #9a5b00; padding: 14px; display: none; }
#result { display: none; margin-top: 18px; }
.card { border: 1.5px solid #e3c878; border-radius: 10px; padding: 14px; margin-bottom: 14px; background: #fff; }
.card h2 { margin: 0 0 10px; font-size: 1.15rem; color: #9a5b00; border-bottom: 1px solid #f0dcae; padding-bottom: 6px; }
.card h3 { margin: 14px 0 6px; font-size: 1rem; color: #6b4e12; }
table { width: 100%; border-collapse: collapse; font-size: .92rem; }
th, td { border: 1px solid #ecd9a8; padding: 7px 6px; text-align: left; }
th { background: #f7e8c3; color: #6b4e12; }
.big-akshar { font-size: 4.2rem; font-weight: 800; color: #9a5b00; text-align: center; line-height: 1.1; }
.small-akshar { text-align: center; color: #6b4e12; font-size: .95rem; margin-top: 6px; }
.name-group h4 { margin: 14px 0 4px; color: #6b4e12; font-size: 1rem; }
.name-group ol { margin: 4px 0 10px; padding-left: 22px; }
.name-group li { padding: 3px 0; }
.puranic { color: #9a5b00; font-size: .8rem; font-weight: 700; }
.foot { font-size: .78rem; color: #a08c5b; text-align: center; margin-top: 10px; line-height: 1.5; }
.ashubh { color: #b00020; border-color: #e57373; }
.ashubh h2 { color: #b00020; }
.ashubh p { color: #b00020; font-weight: 700; margin: 6px 0; }
.err { color: #b00020; background: #fdecea; border: 1px solid #f5c6cb; padding: 10px; border-radius: 8px; margin-top: 10px; display: none; }
@media (max-width: 520px) { form { grid-template-columns: 1fr; } .big-akshar { font-size: 3.4rem; } }
</style>
</head>
<body>
<div class="app" id="capture">
<h1>🔮 जन्म अक्षर व अवकहड़ा चक्र</h1>
<p class="sub">Swiss Ephemeris आधारित • लाहिड़ी अयनांश • हिंदी</p>
<form id="kform">
<div class="full"><label>Astro Code</label>
<div style="display:flex;gap:8px">
<input id="astroCode" type="text" placeholder="AS1-..." style="flex:1">
<button type="button" class="small" id="fillCodeBtn" style="white-space:nowrap">📥 भरो</button>
<button type="button" class="small" id="genCodeBtn" style="white-space:nowrap">🔗 बनाएं</button>
</div></div>
<div class="full"><label>नाम (वैकल्पिक)</label><input id="fname" type="text" placeholder="नाम लिखें"></div>
<div class="full"><label>लिंग (वैकल्पिक)</label><select id="fling"><option value=""></option><option value="Male">पुरुष</option><option value="Female">स्त्री</option></select></div>
<div><label>जन्म तिथि *</label><input id="fdate" type="date" required></div>
<div><label>जन्म समय *</label><input id="ftime" type="time" required></div>
<div><label>समय क्षेत्र</label>
<div style="display:flex;gap:6px;align-items:center">
<button type="button" id="tzSign" data-val="+" style="min-width:36px;font-weight:bold;cursor:pointer">+</button>
<input id="tzHh" type="number" min="0" max="14" value="5" style="width:60px">
<span>:</span>
<input id="tzMm" type="number" min="0" max="59" value="30" style="width:60px">
</div><div style="font-size:11px;color:#666;margin-top:2px">(DST लागू हो तो उसी के अनुसार भरें)</div></div>
<div class="full"><label>जन्म स्थान (शहर/गांव का नाम)</label><input id="fplace" type="text" placeholder="शहर English में लिखें — worldwide search" autocomplete="off">
<div id="place-results" style="display:none"></div></div>
<div class="full" style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
<div><label>अक्षांश (Latitude °N, ऋणात्मक = दक्षिण)</label><input id="flat" type="number" step="0.0001"></div>
<div><label>देशांतर (Longitude °E, ऋणात्मक = पश्चिम)</label><input id="flon" type="number" step="0.0001"></div>
</div>
<button class="calc" id="calcBtn" type="submit" disabled>⏳ Engine लोड हो रहा है…</button>

</form>
<div id="loading">🪐 गणना हो रही है…</div>
<div class="err" id="err"></div>
<div id="result"></div>
<p class="foot">गणना: Swiss Ephemeris (WebAssembly build) + लाहिड़ी अयनांश।<br>जन्म समय जितना सटीक होगा, परिणाम उतना ही सटीक होगा।</p>
</div>
<script>
(function(){
var place=document.getElementById('fplace'), box=document.getElementById('place-results'),
lat=document.getElementById('flat'), lon=document.getElementById('flon');
var timer=null;
function closeBox(){ box.style.display='none'; box.innerHTML=''; }
function pick(label, la, lo){ clearTimeout(timer); place.value=label; lat.value=la.toFixed(4); lon.value=lo.toFixed(4); closeBox(); }
function render(items){
if(!items.length){ box.innerHTML='<div style="padding:8px;color:#888">कोई शहर नहीं मिला — lat/long manual भरें</div>'; }
else{ box.innerHTML=items.map(function(it,i){ return '<div class="pr-item" data-i="'+i+'" style="padding:8px;cursor:pointer;border-bottom:1px solid #eee">'+it.label+'</div>'; }).join('');
Array.prototype.forEach.call(box.querySelectorAll('.pr-item'), function(el){ el.addEventListener('mousedown', function(e){ e.preventDefault(); var it=items[+el.getAttribute('data-i')]; pick(it.label, it.lat, it.lon); }); }); }
box.style.display='block'; box.style.cssText='display:block;border:1px solid #ccc;border-radius:6px;max-height:180px;overflow-y:auto;background:#fff;position:relative;z-index:10'; }
async function apiSearch(q){
var providers=[
{ url:'https://geocoding-api.open-meteo.com/v1/search?name='+encodeURIComponent(q)+'&count=8&language=en&format=json', parse:function(j){ return (j.results||[]).map(function(g){ var parts=[g.name]; if(g.admin1) parts.push(g.admin1); if(g.country) parts.push(g.country); return {label:parts.join(', '), lat:+g.latitude, lon:+g.longitude}; }); } },
{ url:'https://photon.komoot.io/api/?q='+encodeURIComponent(q)+'&limit=8&lang=en', parse:function(j){ return (j.features||[]).map(function(f){ var p=f.properties||{}, parts=[p.name]; if(p.state) parts.push(p.state); if(p.country) parts.push(p.country); var c=f.geometry&&f.geometry.coordinates; return c?{label:parts.join(', '), lat:c[1], lon:c[0]}:null; }).filter(Boolean); } } ];
for(var i=0;i<providers.length;i++){ try{ var r=await fetch(providers[i].url); if(!r.ok) continue; var items=providers[i].parse(await r.json()); if(items.length) return items; }catch(e){} }
return []; }
place.addEventListener('input', function(){ clearTimeout(timer); var q=place.value.trim(); if(q.length<2){ closeBox(); return; } timer=setTimeout(async function(){ render(await apiSearch(q)); }, 400); });
document.addEventListener('click', function(e){ if(e.target!==place && !box.contains(e.target)) closeBox(); });
document.getElementById('tzSign').addEventListener('click', function(){ var v = this.dataset.val === '+' ? '-' : '+'; this.dataset.val = v; this.textContent = v; });
var p2c = function(n){ return String(n).padStart(2,'0'); };
function showFormErr(msg){ var e=document.getElementById('err'); e.style.display='block'; e.textContent=msg; }
document.getElementById('genCodeBtn').addEventListener('click', function(){
var dv = document.getElementById('fdate').value.split('-').map(Number);
var tv = document.getElementById('ftime').value.split(':').map(Number);
var tzSign = document.getElementById('tzSign').dataset.val;
var tzH = parseInt(document.getElementById('tzHh').value||'0',10);
var tzM = parseInt(document.getElementById('tzMm').value||'0',10);
var la = parseFloat(document.getElementById('flat').value);
var lo = parseFloat(document.getElementById('flon').value);
if(!dv[0] || isNaN(tv[0]) || isNaN(la) || isNaN(lo)){ showFormErr('पहले तिथि/समय/स्थान भरें'); return; }
var laD = Math.floor(Math.abs(la)), laM = Math.round((Math.abs(la)-laD)*60);
var loD = Math.floor(Math.abs(lo)), loM = Math.round((Math.abs(lo)-loD)*60);
var code = 'AS1-'+dv[0]+p2c(dv[1])+p2c(dv[2])+'-'+p2c(tv[0])+p2c(tv[1])+'00-'+tzSign+p2c(tzH)+p2c(tzM)+'-'+p2c(laD)+p2c(laM)+(la>=0?'N':'S')+'-'+String(loD).padStart(3,'0')+p2c(loM)+(lo>=0?'E':'W');
document.getElementById('astroCode').value = code; document.getElementById('err').style.display='none';
});
document.getElementById('fillCodeBtn').addEventListener('click', function(){
var m = /^AS1-(\d{8})-(\d{6})-([+-]\d{4})-(\d{4})([NS])-(\d{5})([EW])$/.exec(document.getElementById('astroCode').value.trim());
if(!m){ showFormErr('Astro Code सही नहीं है'); return; }
var d8=m[1], t6=m[2], tz=m[3];
var Y=+d8.slice(0,4), mo=+d8.slice(4,6), dy=+d8.slice(6,8);
var h24=+t6.slice(0,2), mi=+t6.slice(2,4);
var tzH=+tz.slice(1,3), tzM=+tz.slice(3,5);
if(mo<1||mo>12||dy<1||dy>31||h24>23||mi>59||tzH>14||tzM>59){ showFormErr('Astro Code में मान गलत हैं'); return; }
document.getElementById('fdate').value = Y+'-'+p2c(mo)+'-'+p2c(dy);
document.getElementById('ftime').value = p2c(h24)+':'+p2c(mi);
var ts=document.getElementById('tzSign'); ts.dataset.val=tz[0]; ts.textContent=tz[0];
document.getElementById('tzHh').value = tzH; document.getElementById('tzMm').value = tzM;
var laD=+m[4].slice(0,2), laM=+m[4].slice(2,4), loD=+m[6].slice(0,3), loM=+m[6].slice(3,5);
document.getElementById('flat').value = ((laD+laM/60)*(m[5]==='S'?-1:1)).toFixed(4);
document.getElementById('flon').value = ((loD+loM/60)*(m[7]==='W'?-1:1)).toFixed(4);
document.getElementById('err').style.display='none';
});
})();
</script>

function selectNames(padaSyl, nakIdx, pada, moonSign, gender){

function addGroup(label, sylList, useFirstLetter){
var seen = groups.flatMap(function(g){ return g.names.map(function(n){ return n[0]; }); });
var out = [];
sylList.forEach(function(syl){
var pool = [];
Object.keys(NAMES).forEach(function(letter){
NAMES[letter][gender].forEach(function(nm){
var match = useFirstLetter ? (firstLetter(nm[0])===firstLetter(syl)) : nm[0].startsWith(syl);
if(match) pool.push(nm);
});
});
pool.forEach(function(nm){ if(!seen.includes(nm[0]) && !out.some(function(x){ return x[0]===nm[0]; })) out.push(nm); });
});
if(out.length) groups.push({label: label, names: out});
}

var rashiSyl = RASHI_SYL[moonSign];

addGroup('उसी नक्षत्र के अन्य पदों से', otherPadas, false);
addGroup('चंद्र राशि के अक्षरों से', rashiSyl, false);
addGroup('उसी प्रथम अक्षर से', [padaSyl], true);
addGroup('अन्य पदों के प्रथम अक्षरों से', otherPadas, true);
addGroup('राशि अक्षरों के प्रथम अक्षरों से', rashiSyl, true);
var total = groups.reduce(function(a,g){ return a+g.names.length; }, 0);

}
