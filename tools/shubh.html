            const nakIdx = Math.floor(moonLon / (360 / 27)); // 0-26
            const karIdx = Math.floor(elong / 6); // 0-59
            const paksha = tithiIdx < 15 ? "Shukla" : "Krishna";

            const scan = scanPanchangEnds(swe, SEP, jd0);
            const tEnd = scan.res.tEndJD !== null ? jdToISThm(scan.res.tEndJD, jd0) : null;
            const nEnd = scan.res.nEndJD !== null ? jdToISThm(scan.res.nEndJD, jd0) : null;
            const karanas = [{ name: karanaName(karIdx), ...(scan.res.karanaEnds[0] ? jdToISThm(scan.res.karanaEnds[0].endJD, jd0) : {}) }];
            for (let i = 0; i < Math.min(3, scan.res.karanaEnds.length - 1); i++) {
                const ke = scan.res.karanaEnds[i + 1];
                karanas.push({ name: karanaName((karIdx + i + 1) % 60), ...jdToISThm(ke.endJD, jd0) });
            }

            // Rahu Kalam: standard weekday segment of daytime (sunrise->sunset)/8
            const ss = sunRiseSetNOAA(yr, mo, da, LAT, LON);
            const weekday = new Date(yr, mo - 1, da).getDay(); // 0=Sun
            const RAHU_SEG = { 0: 8, 1: 2, 2: 7, 3: 5, 4: 6, 5: 4, 6: 3 };
            let rahu_kalam = null;
            if (ss) {
                const segLen = (ss.set - ss.rise) / 8;
                const seg = RAHU_SEG[weekday];
                const rs = ss.rise + (seg - 1) * segLen, re = ss.rise + seg * segLen;
                rahu_kalam = {
                    start: { hour: Math.floor(rs / 60), minute: Math.round(rs % 60) },
                    end: { hour: Math.floor(re / 60), minute: Math.round(re % 60) }
                };
            }
            const WEEKDAYS_EN = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
            const apiData = {
                day: { name: WEEKDAYS_EN[weekday] },
                tithi: Object.assign({ name: TITHI_EN[tithiIdx], paksha: paksha }, tEnd || {}),
                nakshatra: Object.assign({ name: NAK_EN[nakIdx] }, nEnd || {}),
                rahu_kalam: rahu_kalam,
                karanas: karanas,
                sun_sign: { sign_id: Math.floor(sunLon / 30) + 1, degree: +(sunLon % 30).toFixed(2) }
            };
            return { apiData: apiData, rawDate: dateStr };
        } catch (e) {
            return { isError: true, error: "Swiss Ephemeris त्रुटि: " + e.message };
        }
    }

    function generateAnalysisData(apiData, dateStr) {
        let var_day = translateToHi(apiData.day ? apiData.day.name : new Date(dateStr).toLocaleDateString('en-US', {weekday: 'long'}));
        let t1 = translateToHi(apiData.tithi.name); let n1 = translateToHi(apiData.nakshatra.name);
        let t2 = getNextTithi(t1); let n2 = getNextNak(n1);
        
        let p1 = apiData.tithi?.paksha || "Shukla";
        let p2 = p1;
        if (t1 === "पूर्णिमा") p2 = "Krishna";
        if (t1 === "अमावस्या" || t1 === "अमावास्या") p2 = "Shukla";

        let tEndMins = toMins(extractTime(apiData.tithi)); let nEndMins = toMins(extractTime(apiData.nakshatra));
        
        let events = [];
        if(tEndMins < 1440) events.push({ type: 'tithi', mins: tEndMins });
        if(nEndMins < 1440) events.push({ type: 'nak', mins: nEndMins });
        events.sort((a, b) => a.mins - b.mins);

        let slots = [];
        if (events.length === 0) {
            slots.push({ title: "पूरे दिन", startMins: 360, endMins: 1440, varDay: var_day, tithi: t1, nak: n1, paksha: p1 });
        } else if (events.length === 1) {
            let e = events[0];
            slots.push({ title: `सूर्योदय से - ${toSlotTimeStr(e.mins)} तक`, startMins: 360, endMins: e.mins, varDay: var_day, tithi: t1, nak: n1, paksha: p1 });
            slots.push({ title: `${toSlotTimeStr(e.mins)} से - अगले सूर्योदय तक`, startMins: e.mins, endMins: 1440, varDay: var_day, tithi: e.type==='tithi' ? t2 : t1, nak: e.type==='nak' ? n2 : n1, paksha: e.type==='tithi' ? p2 : p1 });
        } else {
            let e1 = events[0]; let e2 = events[1];
            slots.push({ title: `सूर्योदय से - ${toSlotTimeStr(e1.mins)} तक`, startMins: 360, endMins: e1.mins, varDay: var_day, tithi: t1, nak: n1, paksha: p1 });
            slots.push({ title: `${toSlotTimeStr(e1.mins)} से - ${toSlotTimeStr(e2.mins)} तक`, startMins: e1.mins, endMins: e2.mins, varDay: var_day, tithi: e1.type==='tithi' ? t2 : t1, nak: e1.type==='nak' ? n2 : n1, paksha: e1.type==='tithi' ? p2 : p1 });
            slots.push({ title: `${toSlotTimeStr(e2.mins)} से - अगले सूर्योदय तक`, startMins: e2.mins, endMins: 1440, varDay: var_day, tithi: t2, nak: n2, paksha: p2 });
        }
        
        let rahu = null;
        if(apiData.rahu_kalam) {
            let rs = toMins(parseTimeObj(apiData.rahu_kalam.start));
            let re = toMins(parseTimeObj(apiData.rahu_kalam.end));
            if(rs !== 9999 && re !== 9999) rahu = { start: rs, end: re, str: `${toSlotTimeStr(rs).replace(' बजे','')} से ${toSlotTimeStr(re)}` };
        }
        
        let bhadra = null;
        if(apiData.karanas) {
            apiData.karanas.forEach(k => {
                if(k.name && (k.name.toLowerCase() === "vishti" || k.name.toLowerCase() === "bhadra")) {
                    let endMins = toMins(extractTime(k));
                    if(endMins < 1440) bhadra = { endStr: toSlotTimeStr(endMins) };
                }
            });
        }

        // Fetch Sun Sign for Dwar Sthapan dynamically
        let sunSign = null;
        if(apiData.request_time_panchang && apiData.request_time_panchang.sun_sign) {
            sunSign = apiData.request_time_panchang.sun_sign;
        } else if(apiData.sun_sign) {
            sunSign = apiData.sun_sign;
        }

        return { var_day, t1, n1, t2, n2, tEndMins, nEndMins, slots, rahu, bhadra, sunSign, isError: false };
    }

    function evaluateState(karya, nak, tithi, varDay, paksha, direction, slotMins, rahu, bhadra, sunSign) {
        let rules = rulesDB[karya];
        if(!rules) return { score: 0, nTxt: nak, tTxt: tithi, vTxt: varDay, yTxt: "-" };

        let tNum = tithi_map[tithi];
        
        let nScore = 0, tScore = 0, vScore = 0;
        let isNVarjit = false, isTVarjit = false, isVVarjit = false;

        // --- SPECIFIC SURYABALA MATH FOR DWAR STHAPAN (Suryabala) ---
        let sunNakPosText = "";
        if(karya === "द्वार स्थापन" && sunSign) {
            let signId = sunSign.sign_id;
            let deg = sunSign.degree;
            if(signId && deg !== undefined) {
                let totalLong = (signId - 1) * 30 + deg;
                let sunNakIdx = Math.floor(totalLong / 13.33333333); // 0 to 26
                let moonNakIdx = seq_naks.indexOf(nak);
                
                if(moonNakIdx !== -1) {
                    let dist = (moonNakIdx - sunNakIdx + 27) % 27 + 1; // 1 to 27
                    sunNakPosText = ` (सूर्य से ${dist}वीं स्थिति)`;
                    
                    let isShubhDist = [1, 2, 3, 4, 13, 14, 15, 16, 17, 18, 19, 20, 24, 25, 26, 27].includes(dist);
                    let isVarjitDist = [5, 6, 7, 8, 9, 10, 11, 12, 21, 22, 23].includes(dist);
                    
                    if(isVarjitDist) { nScore = -50; isNVarjit = true; }
                    else if(isShubhDist) { nScore = 50; }
                }
            }
        } else {
            // General Nakshatra Calculation for other tasks
            if(rules.varjitNak.includes(nak)) { nScore = -50; isNVarjit = true; }
            else if(rules.shubhNak.includes(nak)) { nScore = 50; }
        }

        // 2. Tithi (-35 / +35) + Paksha Logic
        let effTVarjit = rules.varjitTithi.includes(tNum);
        let effTShubh = rules.shubhTithi.includes(tNum);

        if(karya === "यात्रा प्रस्थान") {
            if(tNum === 1 && paksha === "Shukla") { effTVarjit = true; effTShubh = false; }
            if(tNum === 1 && paksha === "Krishna") { effTVarjit = false; effTShubh = true; }
        }
        if(karya === "देव प्रतिष्ठा" && paksha === "Krishna") { effTVarjit = true; effTShubh = false; }

        if(effTVarjit) { tScore = -35; isTVarjit = true; }
        else if(effTShubh) { tScore = 35; }

        // 3. Vaar (-15 / +15) + Disha Shool
        let effVVarjit = rules.varjitVaar.includes(varDay);
        let effVShubh = rules.shubhVaar.includes(varDay);

        if(karya === "यात्रा प्रस्थान" && direction) {
            if(direction === "पूर्व" && ["सोमवार", "शनिवार"].includes(varDay)) { effVVarjit = true; effVShubh = false; }
            if(direction === "दक्षिण" && ["गुरुवार"].includes(varDay)) { effVVarjit = true; effVShubh = false; }
            if(direction === "पश्चिम" && ["रविवार", "शुक्रवार"].includes(varDay)) { effVVarjit = true; effVShubh = false; }
            if(direction === "उत्तर" && ["मंगलवार", "बुधवार"].includes(varDay)) { effVVarjit = true; effVShubh = false; }
        }
        if(karya === "रत्न धारण करना") { effVShubh = rules.shubhVaar.includes(varDay); effVVarjit = rules.varjitVaar.includes(varDay); }

        if(effVVarjit) { vScore = -15; isVVarjit = true; }
        else if(effVShubh) { vScore = 15; }

        // Yogas
        let yogas = [];
        for (const y in special_yogas) { if (special_yogas[y][varDay]?.includes(nak)) yogas.push(y); }
        let tk = ["रविवार", "मंगलवार", "शनिवार"].includes(varDay) && ["द्वितीया", "सप्तमी", "द्वादशी"].includes(tithi);
        if(tk && ["कृत्तिका", "पुनर्वसु", "विशाखा", "उत्तरा फाल्गुनी", "उत्तराषाढ़ा", "उत्तरा भाद्रपद"].includes(nak)) yogas.push("त्रिपुष्कर योग");
        if(tk && ["मृगशिरा", "चित्रा", "धनिष्ठा"].includes(nak)) yogas.push("द्विपुष्कर योग");

        let hasYoga = yogas.length > 0;
        let doshParihaarApplied = false;

        // DOSH PARIHAAR
        if(hasYoga) {
            if(isTVarjit) { tScore = 0; doshParihaarApplied = true; }
            if(isVVarjit) { vScore = 0; doshParihaarApplied = true; }
        }

        let rawScore = nScore + tScore + vScore;
        let finalScore = rawScore < 0 ? 0 : rawScore;
        if(isNVarjit) finalScore = 0;

        let fTxt = (txt, isS, isV, extra = "") => {
            if(isV) return `<span class="varjit-text">${txt}${extra} (वर्जित)</span>`;
            if(isS) return `<span class="shubh">${txt}${extra} (शुभ)</span>`;
            return `<span class="samanya">${txt}${extra} (सामान्य)</span>`;
        };

        let yTxtFinal = hasYoga ? yogas.join(', ') : "-";
        if(doshParihaarApplied) yTxtFinal += `<br><span class="parihaar-text">(दोष परिहार)</span>`;

        if(finalScore >= 50 && slotMins) {
            let warns = [];
            if(rahu && Math.max(slotMins.startMins, rahu.start) < Math.min(slotMins.endMins, rahu.end)) {
                warns.push(`राहुकाल: ${rahu.str}`);
            }
            if(bhadra && slotMins.startMins < 1440) {
                warns.push(`भद्रा दोष: ${bhadra.endStr} तक`);
            }
            if(warns.length > 0) yTxtFinal += `<br><span class="warning-text">⚠️ (${warns.join(' | ')})</span>`;
        }

        return { score: finalScore, nTxt: fTxt(nak + " नक्षत्र", nScore>0, isNVarjit, sunNakPosText), tTxt: fTxt(tithi + " तिथि", tScore>0, isTVarjit), vTxt: fTxt(varDay, vScore>0, isVVarjit), yTxt: yTxtFinal };
    }

    // --- Main Calculation Core (Safe Loop) ---
    calcBtn.addEventListener('click', async () => {
        const karya = taskSelect.value;
        if(!karya) return alert("कृपया पहले अपना कार्य चुनें!");
        
        const direction = directionSelect.value;
        if(karya === "यात्रा प्रस्थान" && !direction) return alert("कृपया यात्रा की दिशा चुनें!");

        let dates = [];
        for(let i=1; i<=5; i++) { let v = document.getElementById(`date${i}`).value; if(v) dates.push(v); }
        if(!dates.length) return alert("कृपया कम से कम एक तारीख चुनें!");

        calcBtn.disabled = true; container.innerHTML = ""; finalConclusion.innerHTML = "";
        document.getElementById('results-section').style.display = 'none';
        loadingContainer.style.display = 'block'; statusDiv.innerHTML = "";

        // UI Rules Box (Dual Format)
        let rDB = rulesDB[karya];
        let tNames = rDB.shubhTithi.map(t => tithi_name_map[t]).join(', ');
        let vNames = rDB.varjitTithi.map(t => tithi_name_map[t]).join(', ');
        
        let shubhNakText = rDB.shubhNak.join(', ');
        let varjitNakText = rDB.varjitNak.join(', ') || "कोई नहीं";
        
        if(karya === "द्वार स्थापन") {
            shubhNakText = "सूर्य नक्षत्र से गिनने पर: प्रारम्भ के 4 नक्षत्र (1-4), 13वें से 20वें तक के 8 नक्षत्र (13-20), और 24वें से 27वें तक के 4 नक्षत्र (24-27)।";
            varjitNakText = "सूर्य नक्षत्र से गिनने पर: 5वें से 12वें तक के 8 नक्षत्र (5-12), और 21वें, 22वें, 23वें नक्षत्र (21-23)।";
        }

        let extraRuleHtml = "";
        if(karya === "यात्रा प्रस्थान") extraRuleHtml = `<p><strong>विशेष (दिशा शूल):</strong> पूर्व (सोम, शनि), दक्षिण (गुरु), पश्चिम (रवि, शुक्र), उत्तर (मंगल, बुध) वर्जित हैं। शुक्ल प्रतिपदा वर्जित, कृष्ण प्रतिपदा शुभ।</p>`;
        if(karya === "रत्न धारण करना") extraRuleHtml = `<p><strong>विशेष:</strong> रवि (माणिक्य), सोम (मोती), मंगल (मूंगा), बुध (पन्ना), गुरु (पुखराज), शुक्र (हीरा/ओपल), शनि (नीलम/गोमेद/लहसुनिया) हेतु शुभ है।</p>`;
        if(karya === "देव प्रतिष्ठा") extraRuleHtml = `<p><strong>विशेष:</strong> सम्पूर्ण कृष्ण पक्ष वर्जित है।</p>`;

        rulesDiv.innerHTML = `
            <div class="rule-box rule-shubh">
                <h3>✔ शुभ नियम ('${karya}')</h3>
                <p><strong>नक्षत्र:</strong> ${shubhNakText}</p>
                <p><strong>तिथियां:</strong> ${tNames || "-"}</p>
                <p><strong>वार:</strong> ${rDB.shubhVaar.join(', ') || "-"}</p>
            </div>
            <div class="rule-box rule-varjit">
                <h3>✖ वर्जित/निषेध नियम</h3>
                <p><strong>नक्षत्र:</strong> ${varjitNakText}</p>
                <p><strong>तिथियां:</strong> ${vNames || "कोई नहीं"}</p>
                <p><strong>वार:</strong> ${rDB.varjitVaar.join(', ') || "कोई नहीं"}</p>
                ${extraRuleHtml}
            </div>
        `;

        let grandBestScore = -1;
        let grandBestText = [];

        for(let i=0; i<dates.length; i++) {
            let fDate = "अज्ञात";
            try {
                let dObj = new Date(dates[i]);
                fDate = `${String(dObj.getDate()).padStart(2,'0')}-${String(dObj.getMonth()+1).padStart(2,'0')}-${dObj.getFullYear()}`;
                statusDiv.innerHTML = `<p>⏳ ${fDate} का विश्लेषण जारी, कृपया कुछ सेकंड प्रतीक्षा करे...</p>`;
                
                let req = await getPanchangSwiss(dates[i]);
                
                let html = `<div class="daily-block"><h2 class="daily-title">तारीख: ${fDate} का पंचांग :</h2>`;

                if(req.isError) {
                    html += `<div class="error-box">त्रुटि: ${req.error}</div></div>`;
                    container.innerHTML += html; continue;
                }

                let data = generateAnalysisData(req.apiData, req.rawDate);

                let getBaseStat = (arrV, arrS, val) => arrV.includes(val) ? 'वर्जित' : (arrS.includes(val) ? 'शुभ' : 'सामान्य');
                let vStat = getBaseStat(rDB.varjitVaar, rDB.shubhVaar, data.var_day);
                let t1Stat = getBaseStat(rDB.varjitTithi, rDB.shubhTithi, tithi_map[data.t1]);
                
                let n1Stat = getBaseStat(rDB.varjitNak, rDB.shubhNak, data.n1);
                // Exception for Dwar Sthapan: Nakshatra status depends on dynamic math, calculated inside evaluateState
                if(karya === "द्वार स्थापन" && data.sunSign) {
                    let sNak = getSunNakName(data.sunSign);
                    if(sNak) {
                        let sunNakIdx = seq_naks.indexOf(sNak);
                        let moonNakIdx = seq_naks.indexOf(data.n1);
                        if(sunNakIdx !== -1 && moonNakIdx !== -1) {
                            let dist = (moonNakIdx - sunNakIdx + 27) % 27 + 1;
                            n1Stat = [5,6,7,8,9,10,11,12,21,22,23].includes(dist) ? 'वर्जित' : ([1,2,3,4,13,14,15,16,17,18,19,20,24,25,26,27].includes(dist) ? 'शुभ' : 'सामान्य');
                        }
                    }
                }

                let formatBase = (txt, stat) => `<span class="${stat==='शुभ'?'shubh':(stat==='वर्जित'?'varjit-text':'samanya')}">${txt} (${stat})</span>`;

                let vSpan = formatBase(data.var_day, vStat);
                let tStr = formatBase(data.t1, t1Stat);
                if(data.tEndMins !== 9999) {
                    let t2Stat = getBaseStat(rDB.varjitTithi, rDB.shubhTithi, tithi_map[data.t2]);
                    if(rDB.varjitTithi.includes(tithi_map[data.t2])) t2Stat = 'वर्जित';
                    tStr += ` ${toSummaryTimeStr(data.tEndMins)}, उसके बाद ${formatBase(data.t2, t2Stat)}`;
                } else { tStr += ` (पूरे दिन)`; }

                let nStr = formatBase(data.n1, n1Stat);
                if(data.nEndMins !== 9999) {
                    let n2Stat = getBaseStat(rDB.varjitNak, rDB.shubhNak, data.n2);
                    if(karya === "द्वार स्थापन" && data.sunSign) {
                        let sNak = getSunNakName(data.sunSign);
                        let sunNakIdx = seq_naks.indexOf(sNak);
                        let moonNakIdx = seq_naks.indexOf(data.n2);
                        if(sunNakIdx !== -1 && moonNakIdx !== -1) {
                            let dist = (moonNakIdx - sunNakIdx + 27) % 27 + 1;
                            n2Stat = [5,6,7,8,9,10,11,12,21,22,23].includes(dist) ? 'वर्जित' : ([1,2,3,4,13,14,15,16,17,18,19,20,24,25,26,27].includes(dist) ? 'शुभ' : 'सामान्य');
                        }
                    } else {
                        if(rDB.varjitNak.includes(data.n2)) n2Stat = 'वर्जित';
                    }
                    nStr += ` ${toSummaryTimeStr(data.nEndMins)}, उसके बाद ${formatBase(data.n2, n2Stat)}`;
                } else { nStr += ` (पूरे दिन)`; }

                let sunNakLine = "";
                if(karya === "द्वार स्थापन" && data.sunSign) {
                    let sNak = getSunNakName(data.sunSign);
                    if(sNak) {
                        sunNakLine = `<div class="panchang-line"><span class="panchang-label">सूर्य गोचर:</span> <span class="panchang-value"><span class="shubh">${sNak} नक्षत्र में</span></span></div>`;
                    }
                }

                html += `<div class="panchang-details">
                    <div class="panchang-line"><span class="panchang-label">वार:</span> <span class="panchang-value">${vSpan}</span></div>
                    <div class="panchang-line"><span class="panchang-label">तिथि:</span> <span class="panchang-value">${tStr}</span></div>
                    <div class="panchang-line"><span class="panchang-label">नक्षत्र:</span> <span class="panchang-value">${nStr}</span></div>
                    ${sunNakLine}
                </div>`;

                html += `<div class="results-table-wrapper"><table class="results-table">
                        <thead><tr><th>समय-खंड</th><th>नक्षत्र</th><th>तिथि</th><th>वार</th><th>शुभता (%)</th><th>विशेष योग / चेतावनी</th></tr></thead><tbody>`;
                
                data.slots.forEach(slot => {
                    let ev = evaluateState(karya, slot.nak, slot.tithi, slot.varDay, slot.paksha, direction, slot, data.rahu, data.bhadra, data.sunSign);
                    html += `<tr>
                        <td style="font-weight:600; white-space:nowrap;">${slot.title}</td>
                        <td>${ev.nTxt}</td><td>${ev.tTxt}</td><td>${ev.vTxt}</td>
                        <td><span class="score-box" style="color: ${ev.score >= 85 ? '#27ae60' : (ev.score >= 50 ? '#f39c12' : '#c0392b')}">${ev.score}%</span></td>
                        <td>${ev.yTxt}</td>
                    </tr>`;
                    
                    // Fixed Colon replacement bug (.replace(':', '')) in the Grand Best label logic
                    let cleanTitle = slot.title.trim().replace('से - ', '').replace(/:$/, '');
                    let slotFullTitle = `${fDate} (${cleanTitle})`;
                    if(ev.score > grandBestScore) { grandBestScore = ev.score; grandBestText = [slotFullTitle]; }
                    else if(ev.score === grandBestScore && ev.score > 0) { grandBestText.push(slotFullTitle); }
                });

                html += `</tbody></table></div></div>`;
                container.innerHTML += html;

            } catch (globalErr) {
                console.error("Critical Loop Error:", globalErr);
                let html = `<div class="daily-block"><h2 class="daily-title">तारीख: ${fDate}</h2>`;
                html += `<div class="error-box">सॉफ्टवेयर त्रुटि: डेटा को प्रोसेस नहीं किया जा सका। (${globalErr.message})</div></div>`;
                container.innerHTML += html;
            }
            if(i < dates.length - 1) await new Promise(r => setTimeout(r, 1200));
        }

        loadingContainer.style.display = 'none'; calcBtn.disabled = false;

        if(grandBestScore > 0) {
            finalConclusion.innerHTML = `अंतिम निष्कर्ष : आपके द्वारा चुनी गयी तारीखों मे से, <strong>${grandBestText.join(', ')}</strong> सबसे शुभ <strong>(${grandBestScore}%)</strong> हैं।`;
        } else {
            finalConclusion.innerHTML = "चुनी गई तारीखों में से कोई भी शुभ डेट/समय नहीं मिला। (या सभी वर्जित हैं)";
        }
        document.getElementById('results-section').style.display = 'block';
        document.getElementById('results-section').scrollIntoView({ behavior: 'smooth' });
    });
    
    // Soft Reset Function (Fixes white-flash bug)
    document.getElementById('reset-btn').addEventListener('click', () => {
        taskSelect.selectedIndex = 0;
        directionGroup.style.display = 'none'; directionSelect.value = '';
        for(let i=1; i<=5; i++) document.getElementById(`date${i}`).value = '';
        document.getElementById('results-section').style.display = 'none';
        loadingContainer.style.display = 'none';
        window.scrollTo({ top: 0, behavior: 'smooth' });
    });
})();
</script>

</body>
</html>
