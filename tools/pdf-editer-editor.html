<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro PDF Editor - Ultimate Perfect Align</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * { box-sizing: border-box; font-family: 'Poppins', sans-serif; margin: 0; padding: 0; }

        body { background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%); height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; overflow: hidden; }
        .header { text-align: center; margin-bottom: 20px; color: #fff; text-shadow: 1px 1px 5px rgba(0,0,0,0.2); }
        .header h1 { font-size: 32px; font-weight: 700; }
        .header p { font-size: 15px; }

        .app-container { background: #ffffff; width: 100%; max-width: 1200px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); display: flex; flex-direction: column; flex: 1; overflow: hidden; }

        .upload-area { border: 2px dashed #4facfe; border-radius: 12px; padding: 60px 20px; text-align: center; background-color: #f1f8ff; cursor: pointer; transition: 0.3s; margin: 40px; }
        .upload-area.dragover { background-color: #e0f0ff; transform: scale(1.02); }
        .upload-area i { font-size: 50px; color: #4facfe; margin-bottom: 15px; }
        #fileInput { display: none; }

        .toolbar { display: none; background: #f8f9fa; padding: 12px 20px; display: flex; gap: 15px; flex-wrap: wrap; align-items: center; border-bottom: 1px solid #dee2e6; z-index: 10; }
        .tool-group { display: flex; align-items: center; gap: 8px; }
        .tool-group label { font-size: 13px; color: #495057; font-weight: 500; }
        select, input[type="number"], input[type="color"] { padding: 6px; border: 1px solid #ced4da; border-radius: 6px; outline: none; }

        .btn { padding: 8px 15px; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; transition: 0.2s; color: white; display: flex; align-items: center; gap: 8px; font-size: 14px; }
        .btn-add { background: #4facfe; }
        .btn-add:hover { background: #00f2fe; }
        .btn-bold { background: #e9ecef; color: #333; padding: 8px 12px; }
        .btn-bold.active { background: #343a40; color: white; }
        .btn-save { background: #28a745; margin-left: auto; }
        .btn-save:hover { background: #218838; }

        /* Workspace Fixes: Horizontal Scroll Allowed, Max-width Removed */
        .workspace { display: none; background: #525659; flex: 1; overflow: auto; padding: 30px; text-align: center; }
        #pdf-document { display: flex; flex-direction: column; align-items: center; gap: 25px; min-width: max-content; }

        .page-wrapper { position: relative; background: #ffffff url('https://i.gifer.com/ZZ5H.gif') center center no-repeat; background-size: 30px; box-shadow: 0 5px 15px rgba(0,0,0,0.3); display: block; margin: 0 auto; }

        /* CANVAS FIX: max-width 100% हटाया ताकि पन्ना और टेक्स्ट हमेशा सिंक रहें */
        canvas { display: block; transition: opacity 0.3s; opacity: 0; }
        canvas.loaded { opacity: 1; }

        /* Text Box FIX: line-height 1 !important किया गया है */
        .draggable-text {
            position: absolute;
            min-width: 20px;
            padding: 0px !important;
            margin: 0px !important;
            outline: 1px dashed transparent;
            cursor: move;
            white-space: nowrap;
            user-select: none;
            line-height: 1 !important; /* यह सबसे जरुरी है */
            z-index: 100;
            transform-origin: top left;
        }
        .draggable-text.active { outline-color: #4facfe; background: rgba(79, 172, 254, 0.1); }
        .draggable-text:focus { outline: none; outline-color: #ff4757; cursor: text; background: rgba(255, 255, 255, 0.8); }

        .delete-icon { position: absolute; top: -15px; right: -15px; background: #ff4757; color: white; width: 22px; height: 22px; border-radius: 50%; display: none; text-align: center; line-height: 22px; font-size: 11px; cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .draggable-text.active .delete-icon { display: block; }
    </style>
</head>
<body>

    <div class="header">
        <h1>PDF <span>Editor</span> Pro</h1>
        <p>अब आपका टेक्स्ट बाल-बराबर भी नहीं खिसकेगा! (100% Guaranteed) 🔥</p>
    </div>

    <div class="app-container">

        <div class="upload-area" id="dropArea" onclick="document.getElementById('fileInput').click()">
            <i class="fas fa-file-pdf"></i>
            <h3 id="uploadText">PDF फाइल यहाँ खींचें (Drag & Drop)</h3>
            <p>या क्लिक करके अपलोड करें</p>
            <input type="file" id="fileInput" accept=".pdf">
        </div>

        <div class="toolbar" id="toolbar">
            <button class="btn btn-add" onclick="addTextToVisiblePage()"><i class="fas fa-plus"></i> Add Text</button>
            <span style="font-size: 13px; color: #28a745; font-weight: 500; margin-left: 10px;"><i class="fas fa-info-circle"></i> Double-Click करके टेक्स्ट जोड़ें!</span>

            <div style="flex: 1;"></div>

            <div class="tool-group">
                <select id="fontFamily" onchange="updateActiveText()">
                    <option value="Helvetica">Helvetica</option>
                    <option value="TimesRoman">Times Roman</option>
                    <option value="Courier">Courier</option>
                </select>
            </div>

            <div class="tool-group">
                <input type="number" id="fontSize" value="30" min="10" max="150" onchange="updateActiveText()" style="width: 70px;">
            </div>

            <div class="tool-group">
                <input type="color" id="fontColor" value="#ff0000" onchange="updateActiveText()">
            </div>

            <button class="btn btn-bold" id="boldBtn" onclick="toggleBold()"><i class="fas fa-bold"></i></button>
            <button class="btn btn-save" onclick="savePDF()"><i class="fas fa-download"></i> Save PDF</button>
        </div>

        <div class="workspace" id="workspace">
            <div id="pdf-document"></div>
        </div>
    </div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

        let originalPdfBytes = null;
        let activeElement = null;
        let globalPdfDoc = null;

        const dropArea = document.getElementById('dropArea');
        const fileInput = document.getElementById('fileInput');
        const workspace = document.getElementById('workspace');
        const toolbar = document.getElementById('toolbar');
        const pdfDocumentDiv = document.getElementById('pdf-document');

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting && entry.target.dataset.rendered === "false") {
                    renderPage(entry.target);
                }
            });
        }, { root: workspace, rootMargin: '300px' });

        dropArea.addEventListener('dragover', (e) => { e.preventDefault(); dropArea.classList.add('dragover'); });
        dropArea.addEventListener('dragleave', () => dropArea.classList.remove('dragover'));
        dropArea.addEventListener('drop', (e) => { e.preventDefault(); if (e.dataTransfer.files[0]) loadPDF(e.dataTransfer.files[0]); });
        fileInput.addEventListener('change', (e) => { if(e.target.files[0]) loadPDF(e.target.files[0]); });

        async function loadPDF(file) {
            document.getElementById('uploadText').innerHTML = "<i class='fas fa-spinner fa-spin'></i> लोड हो रहा है...";

            const arrayBuffer = await file.arrayBuffer();
            originalPdfBytes = arrayBuffer;

            const loadingTask = pdfjsLib.getDocument(new Uint8Array(arrayBuffer));
            globalPdfDoc = await loadingTask.promise;

            pdfDocumentDiv.innerHTML = '';

            for (let pageNum = 1; pageNum <= globalPdfDoc.numPages; pageNum++) {
                const page = await globalPdfDoc.getPage(pageNum);
                const viewport = page.getViewport({ scale: 1.5 }); // High Quality Scale

                const wrapper = document.createElement('div');
                wrapper.className = 'page-wrapper';
                wrapper.dataset.pageNum = pageNum;
                wrapper.dataset.rendered = "false";
                wrapper.dataset.pageIndex = pageNum - 1;

                // Fixed Dimensions so canvas doesn't shrink responsively
                wrapper.style.width = `${viewport.width}px`;
                wrapper.style.height = `${viewport.height}px`;

                const canvas = document.createElement('canvas');
                canvas.width = viewport.width;
                canvas.height = viewport.height;
                wrapper.appendChild(canvas);
                pdfDocumentDiv.appendChild(wrapper);

                wrapper.addEventListener('dblclick', (e) => {
                    if (e.target === canvas || e.target === wrapper) {
                        createTextBox(wrapper, e.offsetX, e.offsetY);
                    }
                });

                observer.observe(wrapper);
            }

            dropArea.style.display = 'none';
            toolbar.style.display = 'flex';
            workspace.style.display = 'block';
        }

        async function renderPage(wrapper) {
            wrapper.dataset.rendered = "true";
            const pageNum = parseInt(wrapper.dataset.pageNum);
            const page = await globalPdfDoc.getPage(pageNum);
            const viewport = page.getViewport({ scale: 1.5 });

            const canvas = wrapper.querySelector('canvas');
            const context = canvas.getContext('2d');

            await page.render({ canvasContext: context, viewport: viewport }).promise;
            canvas.classList.add('loaded');
        }

        function addTextToVisiblePage() {
            const wrappers = document.querySelectorAll('.page-wrapper');
            let visibleWrapper = wrappers[0];
            for (let w of wrappers) {
                const rect = w.getBoundingClientRect();
                if (rect.top >= 0 || rect.bottom >= window.innerHeight / 2) { visibleWrapper = w; break; }
            }
            createTextBox(visibleWrapper, 50, 50);
        }

        function createTextBox(parentWrapper, x, y) {
            const textDiv = document.createElement('div');
            textDiv.className = 'draggable-text active';
            textDiv.contentEditable = "true";
            textDiv.innerText = "Type here";

            textDiv.style.fontFamily = document.getElementById('fontFamily').value;
            textDiv.style.fontSize = document.getElementById('fontSize').value + 'px';
            textDiv.style.color = document.getElementById('fontColor').value;
            textDiv.style.fontWeight = document.getElementById('boldBtn').classList.contains('active') ? 'bold' : 'normal';

            textDiv.style.left = `${x}px`;
            textDiv.style.top = `${y}px`;

            const delIcon = document.createElement('div');
            delIcon.className = 'delete-icon';
            delIcon.innerHTML = '<i class="fas fa-times"></i>';
            delIcon.contentEditable = "false";
            delIcon.onclick = () => parentWrapper.removeChild(textDiv);
            textDiv.appendChild(delIcon);

            parentWrapper.appendChild(textDiv);
            setActiveElement(textDiv);

            let isDragging = false, offsetX, offsetY;

            textDiv.addEventListener('mousedown', (e) => {
                if (e.target.closest('.delete-icon')) return;
                isDragging = true;
                const rect = textDiv.getBoundingClientRect();
                // Get offset relative to wrapper (fixes scrolling bugs)
                offsetX = e.clientX - rect.left;
                offsetY = e.clientY - rect.top;
                setActiveElement(textDiv);
            });

            document.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                const wrapperRect = parentWrapper.getBoundingClientRect();
                let newX = e.clientX - wrapperRect.left - offsetX;
                let newY = e.clientY - wrapperRect.top - offsetY;
                textDiv.style.left = `${newX}px`;
                textDiv.style.top = `${newY}px`;
            });

            document.addEventListener('mouseup', () => isDragging = false);
            textDiv.focus();
        }

        function setActiveElement(el) {
            if (activeElement) activeElement.classList.remove('active');
            activeElement = el;
            activeElement.classList.add('active');

            document.getElementById('fontSize').value = parseInt(el.style.fontSize);
            document.getElementById('fontColor').value = rgbToHex(el.style.color);
            document.getElementById('fontFamily').value = el.style.fontFamily.replace(/['"]/g, '');

            const boldBtn = document.getElementById('boldBtn');
            if(el.style.fontWeight === 'bold') boldBtn.classList.add('active');
            else boldBtn.classList.remove('active');
        }

        document.addEventListener('click', (e) => {
            if(!e.target.classList.contains('draggable-text') && !e.target.closest('.toolbar') && !e.target.closest('.delete-icon')) {
                if (activeElement) { activeElement.classList.remove('active'); activeElement = null; }
            }
        });

        function updateActiveText() {
            if (!activeElement) return;
            activeElement.style.fontFamily = document.getElementById('fontFamily').value;
            activeElement.style.fontSize = document.getElementById('fontSize').value + 'px';
            activeElement.style.color = document.getElementById('fontColor').value;
        }

        function toggleBold() {
            const btn = document.getElementById('boldBtn');
            btn.classList.toggle('active');
            if (activeElement) activeElement.style.fontWeight = btn.classList.contains('active') ? 'bold' : 'normal';
        }

        function rgbToHex(rgb) {
            if(!rgb.startsWith('rgb')) return '#000000';
            const rgbArr = rgb.replace(/[^\d,]/g, '').split(',');
            return "#" + (1 << 24 | rgbArr[0] << 16 | rgbArr[1] << 8 | rgbArr[2]).toString(16).slice(1);
        }

        function hexToRgbPdf(hex) {
            let r = 0, g = 0, b = 0;
            if (hex.length == 7) { r = parseInt(hex.substring(1,3), 16)/255; g = parseInt(hex.substring(3,5), 16)/255; b = parseInt(hex.substring(5,7), 16)/255; }
            return {r, g, b};
        }

        async function savePDF() {
            if (!originalPdfBytes) return;

            const saveBtn = document.querySelector('.btn-save');
            saveBtn.innerHTML = "<i class='fas fa-spinner fa-spin'></i> Saving...";
            saveBtn.disabled = true;

            try {
                const { PDFDocument, rgb, StandardFonts } = PDFLib;
                const pdfDoc = await PDFDocument.load(originalPdfBytes);
                const pages = pdfDoc.getPages();
                const wrappers = document.querySelectorAll('.page-wrapper');

                for (let wrapper of wrappers) {
                    const pageIndex = parseInt(wrapper.dataset.pageIndex);
                    const pdfPage = pages[pageIndex];
                    const { width, height } = pdfPage.getSize();

                    // NEW MATH: Direct mapping from DOM rect to PDF points
                    const wrapperRect = wrapper.getBoundingClientRect();
                    const scaleX = width / wrapperRect.width;
                    const scaleY = height / wrapperRect.height;

                    const textElements = wrapper.querySelectorAll('.draggable-text');

                    for (let el of textElements) {

                        let text = "";
                        for (let node of el.childNodes) {
                            if (node.nodeType === Node.TEXT_NODE) text += node.nodeValue;
                        }

                        if (!text || text.trim() === "") continue;

                        const elRect = el.getBoundingClientRect();
                        const isBold = el.style.fontWeight === 'bold';
                        let fontType = el.style.fontFamily;

                        let embedFont;
                        if (fontType === 'TimesRoman') embedFont = isBold ? StandardFonts.TimesRomanBold : StandardFonts.TimesRoman;
                        else if (fontType === 'Courier') embedFont = isBold ? StandardFonts.CourierBold : StandardFonts.Courier;
                        else embedFont = isBold ? StandardFonts.HelveticaBold : StandardFonts.Helvetica;

                        const pdfFont = await pdfDoc.embedFont(embedFont);

                        // X, Y calculation precisely relative to wrapper rects (Immune to scroll/zoom issues)
                        const domX = elRect.left - wrapperRect.left;
                        const domY = elRect.top - wrapperRect.top;

                        const pdfX = domX * scaleX;

                        const htmlFontSize = parseFloat(el.style.fontSize);
                        const pdfFontSize = htmlFontSize * scaleY;

                        // THE GOLDEN RATIO: 0.72 is exactly the Cap Height offset for web fonts (Helvetica/Arial)
                        const baselineOffset = htmlFontSize * 0.72;
                        const pdfY = height - ((domY + baselineOffset) * scaleY);

                        const colorHex = rgbToHex(el.style.color);
                        const {r, g, b} = hexToRgbPdf(colorHex);

                        pdfPage.drawText(text, {
                            x: pdfX,
                            y: pdfY,
                            size: pdfFontSize,
                            font: pdfFont,
                            color: rgb(r, g, b),
                        });
                    }
                }

                const pdfBytes = await pdfDoc.save();

                const blob = new Blob([pdfBytes], { type: "application/pdf" });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = "Viraj_Perfect_Align.pdf";
                link.click();
            } catch (error) {
                console.error(error);
                alert("कुछ एरर आ गया है।");
            } finally {
                saveBtn.innerHTML = "<i class='fas fa-download'></i> Save PDF";
                saveBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
