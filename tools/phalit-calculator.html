<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>फलित कैलकुलेटर v1.1</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
body{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen-Sans, Ubuntu, Cantarell, "Helvetica Neue", sans-serif;background:#f7f2ea;margin:0;padding:18px;color:#2b2118}
.wrap{max-width:950px;margin:0 auto;background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 2px 14px rgba(0,0,0,.12)}
.header{background:linear-gradient(135deg,#6d0f1b,#93242f 55%,#b8860b);color:#fff;text-align:center;padding:26px 16px}
.header h1{margin:0;font-size:30px}.header p{margin:6px 0 0;font-size:15px;opacity:.92}
.parthead{background:#6d0f1b;color:#ffe9a8;font-size:23px;font-weight:700;text-align:center;padding:12px;margin-top:18px}
.section{padding:14px 22px 6px}
.shead{font-size:22px;font-weight:700;color:#6d0f1b;border-bottom:3px solid #d9a441;padding-bottom:6px;margin:14px 0 4px}
.posline{font-size:14px;color:#7a6a4f;margin-bottom:12px}
.charttitle{text-align:center;font-size:17px;font-weight:700;color:#6d0f1b;margin-top:8px}
.entry{background:#fdf9f2;border:1px solid #ecd9b0;border-left:5px solid #b8860b;border-radius:8px;padding:12px 16px;margin-bottom:12px}
.etitle{font-size:17.5px;font-weight:700;color:#8a1c26;margin-bottom:6px}
.etext{font-size:15.5px;line-height:1.75;text-align:justify;white-space:pre-wrap}
.enote{font-size:13.5px;color:#8a6d1c;background:#fdf6dd;border-radius:6px;padding:7px 10px;margin-top:8px}
.note{font-size:14.5px;background:#eef6ee;border:1px solid #b9d8b9;border-radius:8px;padding:10px 14px;margin-bottom:14px}
table{width:100%;border-collapse:collapse;font-size:15px;margin-bottom:10px}
th{background:#6d0f1b;color:#fff;padding:8px}
td{border:1px solid #d8c49a;padding:7px;text-align:center}
tr:nth-child(even) td{background:#faf3e3}
.panel{padding:16px 22px;border-bottom:1px solid #eee}
.panel label{font-weight:600;font-size:15px}
#astro-code-in{width:100%;box-sizing:border-box;padding:10px;font-size:15px;font-family:monospace;border:1.5px solid #c9a86a;border-radius:8px;margin:8px 0}
.btn{border:none;border-radius:8px;padding:10px 18px;font-weight:700;cursor:pointer;font-size:15px;color:#fff}
.btn-fill{background:#6a1b9a}.btn-txt{background:#1565c0}.btn-shot{background:#2e7d32}
#ephem-status{font-size:.9em;color:#e65100;margin-top:8px}
#ephem-status.ok{color:#2e7d32}
.error-msg{color:#c62828;font-size:14px;margin-top:6px;white-space:pre-wrap}
#report-status{font-size:15px;font-weight:700;color:#6d0f1b;padding:10px 22px 0}
.tgl-row{display:flex;flex-wrap:wrap;gap:18px;align-items:center;margin:6px 0 12px}
.tgl{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600}
.sw{position:relative;width:52px;height:28px;display:inline-block;flex:none}
.sw input{opacity:0;width:0;height:0}
.sl{position:absolute;inset:0;background:#ccc;border-radius:28px;transition:.2s;cursor:pointer}
.sl:before{content:'';position:absolute;width:22px;height:22px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.sw input:checked + .sl{background:#2e9e4f}
.sw input:checked + .sl:before{transform:translateX(24px)}
.empty-note{padding:22px;text-align:center;color:#8a6d1c;font-size:15.5px}
</style>
</head>
<body>
<div class="wrap">
  <div class="header"><h1>🔮 फलित कैलकुलेटर</h1><p>v1.1 - Astro Code से पूरी फलित report (ग्रह विचार + भाव विचार)</p></div>
  <div class="panel">
    <label for="astro-code-in">Astro Code डालें</label>
    <input type="text" id="astro-code-in" placeholder="AS1-..." autocomplete="off">
    <button type="button" id="btn-applycode" class="btn btn-fill">📥 भरो</button>
    <div id="code-error" class="error-msg"></div>
    <div id="ephem-status">⏳ Engine लोड हो रहा है…</div>
    <div id="ephem-error" class="error-msg"></div>
  </div>
  <div class="panel">
    <div class="tgl-row">
      <span class="tgl"><label class="sw"><input type="checkbox" id="tgl-summary" checked><span class="sl"></span></label> कुंडली सारांश</span>
      <span class="tgl"><label class="sw"><input type="checkbox" id="tgl-graha" checked><span class="sl"></span></label> ग्रह विचार</span>
      <span class="tgl"><label class="sw"><input type="checkbox" id="tgl-bhava" checked><span class="sl"></span></label> भाव विचार</span>
    </div>
    <button type="button" id="btn-txt" class="btn btn-txt">💾 TXT</button>
    <button type="button" id="btn-shot" class="btn btn-shot">📸 Screenshot</button>
  </div>
  <div id="report-status"></div>
  <div id="report"><div class="empty-note">पहले ऊपर Astro Code डालकर "📥 भरो" दबाएं - पूरी फलित report यहां बनेगी।</div></div>
</div>
<script>const LIB = {"bhava|सूर्य|1": "लग्न में सूर्य होने पर जातक का शरीर चतुरस्र (वर्गाकार), सिर के बाल कम और पित्त प्रकृति प्रधान होती है। जातक प्रतापी, शूरवीर, स्वाभिमानी किंतु क्रोधी व अधीर स्वभाव का होता है। यदि सूर्य स्वराशि या उच्च (मेष) में हो तो उत्तम स्वास्थ्य देता है, किंतु साधारण स्थिति में नेत्रों में उष्णता या अल्प दृष्टि की संभावना रहती है।", "bhava|सूर्य|2": "द्वितीय भाव में सूर्य स्थित होने से जातक को विद्या और धन अर्जित करने के लिए अत्यधिक कठोर परिश्रम करना पड़ता है। वाणी में कठोरता और कुटुंब के सदस्यों के साथ वैचारिक मतभेद उत्पन्न हो सकते हैं। जातक का धन राजकीय दंड या मुख/नेत्र संबंधी व्याधियों में व्यय हो सकता है।", "bhava|सूर्य|3": "तृतीय भाव (उपचय स्थान) में प्रतापी सूर्य का बैठना अत्यंत शुभ माना गया है। जातक परम साहसी, बलवान, क्षमाशील, शूरवीर और शत्रुओं का दमन करने वाला होता है। हालांकि, यह स्थिति अनुज (छोटे भाइयों) के लिए कष्टकारी या उनसे मनमुटाव पैदा करने वाली होती है।", "bhava|सूर्य|4": "चतुर्थ भाव में सूर्य की स्थिति जातक को बंधु-बांधवों के सुख से वंचित करती है। जातक को वाहन, गृह और पैतृक संपत्ति के उपभोग में विघ्न झेलने पड़ते हैं। यह स्थिति माता के स्वास्थ्य के लिए चिंताजनक होती है और जातक को मानसिक अशांति प्रदान करती है।", "bhava|सूर्य|5": "पंचम भाव में सूर्य जातक को तीक्ष्ण बुद्धि और शास्त्र ज्ञान तो देता है, किंतु यह स्थान अग्नि तत्व ग्रह के कारण संतान सुख में विलंब अथवा बाधा पैदा करता है। जातक को उदर (पेट) में पित्त विकार या पाचन की समस्या हो सकती है।", "bhava|सूर्य|6": "षष्ठ भाव (उपचय व दुस्थान) में सूर्य का होना जातक को अति प्रतापी बनाता है। जातक अपने शत्रुओं का समूल नाश करता है, मुकदमों में विजय पाता है और रोगों से मुक्त रहता है। राजा या प्रशासनिक अधिकारियों के माध्यम से उसे धन और सम्मान प्राप्त होता है।", "bhava|सूर्य|7": "सप्तम भाव में सूर्य की उपस्थिति दांपत्य जीवन में उष्णता और अहंकार के कारण तनाव उत्पन्न करती है। जीवनसाथी का स्वभाव उग्र हो सकता है। व्यापारिक साझेदारी में मतभेद और मान-हानि की आशंका बनी रहती है।", "bhava|सूर्य|8": "अष्टम भाव में सूर्य जातक के नेत्रों को दुर्बल कर सकता है। जातक को शरीर में अग्नि या पित्त जनित विकारों का सामना करना पड़ता है। पिता को कष्ट संभव है और जातक का आत्मबल विषम परिस्थितियों में डगमगा सकता है।", "bhava|सूर्य|9": "नवम (त्रिकोण) भाव में सूर्य जातक को धर्मपरायण, देव-ब्राह्मणों का भक्त और तीर्थयात्रा करने वाला बनाता है। यदि सूर्य शुभ प्रभाव में हो तो पिता से पूर्ण सहयोग और समाज में यश मिलता है, अन्यथा पिता से मतभेद संभव हैं।", "bhava|सूर्य|10": "दशम भाव में सूर्य दिग्बली होकर राजयोग का निर्माण करता है। ऐसा जातक उच्च पद, प्रशासनिक अधिकार, राजसेवा में अपार सफलता, वाहन सुख और समाज में अप्रतिम प्रतिष्ठा प्राप्त करता है। जातक अपने कर्मक्षेत्र में निपुण होता है।", "bhava|सूर्य|11": "एकादश भाव (उपचय) में सूर्य जातक को चिरस्थायी धन-संपत्ति, उच्चाधिकारियों से लाभ और महासमृद्धि प्रदान करता है। जातक के शत्रु निष्प्रभावी रहते हैं और उसकी समस्त इच्छाएँ पूर्ण होती हैं।", "bhava|सूर्य|12": "द्वादश भाव में सूर्य धन का अपव्यय कराता है। यह बाएँ नेत्र में दुर्बलता, पिता से दूरी अथवा पैतृक संपत्ति के क्षय की ओर संकेत करता है। जातक को सिरदर्द अथवा पित्त जनित रोगों का सामना करना पड़ सकता है।\n\nसूर्य के इस प्रतापी विवेचन के पश्चात, आइए अब मन, जल और चेतना के शीतल कारक 'चंद्रमा' के द्वादश भाव फल का अध्ययन करते हैं।", "bhava|चंद्र|1": "लग्न में चंद्रमा होने पर जातक का शरीर सुंदर, नेत्र आकर्षक और वाणी अति मृदु होती है। यदि चंद्रमा पूर्ण (पक्षबली) हो तो जातक अति स्वस्थ, दीर्घायु, कांतिमान और मानसिक रूप से सुदृढ़ होता है। इसके विपरीत, क्षीण चंद्र होने पर शरीर कृश और स्वास्थ्य चंचल रहता है।", "bhava|चंद्र|2": "द्वितीय भाव में चंद्रमा जातक को मिष्टभाषी, विद्यावान, धनी और बड़े कुटुंब वाला बनाता है। जातक को चांदी, मोती, जल या तरल पदार्थों के व्यापार से अकूत लाभ होता है।", "bhava|चंद्र|3": "तृतीय भाव में स्थित चंद्रमा जातक को पराक्रमी, प्रसन्नचित्त, बंधुप्रेमी और कलाप्रिय बनाता है। जातक को अपने भाई-बहनों, विशेषकर भगिनी (बहनों) से उत्तम सुख और सहयोग मिलता है।", "bhava|चंद्र|4": "चतुर्थ भाव (जल व सुख स्थान) में चंद्रमा दिग्बली होकर परम श्रेष्ठ फल देता है। जातक को माता का असीम स्नेह, सुंदर भवन, लग्जरी वाहन, मानसिक शांति और तीर्थ स्नान का आनंद प्राप्त होता है।", "bhava|चंद्र|5": "पंचम भाव में चंद्रमा जातक को तीव्र स्मरण शक्ति, उत्तम बुद्धि, मंत्र-शास्त्र ज्ञान और योग्य संतान (विशेषकर कन्या संतान) का सुख प्रदान करता है। जातक कुशल परामर्शदाता बनता है।", "bhava|चंद्र|6": "षष्ठ भाव में चंद्रमा होने पर जातक को कफ व वात जनित रोग, उदर विकार या जल संबंधी भय हो सकता है। जातक का मन शत्रुओं के कारण चिंतित रहता है और उसे मानसिक क्लेश (आधि) झेलना पड़ता है।", "bhava|चंद्र|7": "सप्तम भाव में चंद्रमा जातक को परम सुंदर, सुशीला और प्रियवादिनी पत्नी/पति प्रदान करता है। जातक स्वयं भी कामुक, लोकप्रिय और जलयात्राओं या विदेश व्यापार से लाभ कमाने वाला होता है।", "bhava|चंद्र|8": "अष्टम भाव में चंद्रमा जातक को मानसिक रूप से चंचल, दुखी और अल्पायु योग (यदि क्षीण व पाप पीड़ित हो) प्रदान कर सकता है। जातक को जल से भय और मानसिक बीमारियों का जोखिम रहता है।", "bhava|चंद्र|9": "नवम भाव में चंद्रमा जातक को अत्यंत भाग्यशाली, धर्मपरायण, तीर्थयात्री, दयालु और संततिवान बनाता है। जातक को अपने पिता और गुरुजनों का पूर्ण आशीर्वाद मिलता है।", "bhava|चंद्र|10": "दशम भाव में चंद्रमा जातक को अपने कार्यक्षेत्र में अपार सफलता और यश दिलाता है। जातक जन-सेवा, परोपकार, औषधि, कृषि अथवा जल संबंधी व्यवसायों में शीर्ष स्थान प्राप्त करता है।", "bhava|चंद्र|11": "एकादश भाव में चंद्रमा जातक को बहुविध माध्यमों से धन लाभ कराता है। जातक संपत्तिवान, दीर्घायु, बहु-संतान से युक्त और समाज में अत्यधिक लोकप्रिय होता है।", "bhava|चंद्र|12": "द्वादश भाव में चंद्रमा जातक को एकांतप्रिय, अत्यधिक खर्च करने वाला, क्रोधी और बायीं आँख में विकार देने वाला हो सकता है। क्षीण चंद्र यहाँ मानसिक अशांति और बंधन का कारक बनता है।\n\nचंद्रमा के इस शीतल और कफ-वात प्रधान विश्लेषण के उपरांत, आइए अब अग्नि तत्व और ऊर्जा के प्रतीक 'मंगल' के द्वादश भाव फल की ओर बढ़ते हैं।", "bhava|मंगल|1": "लग्न में बलवान मंगल जातक को शूरवीर, साहसी और सेनापति के समान तेजस्वी बनाता है। परंतु यदि मंगल दुर्बल या पाप पीड़ित हो, तो जातक उग्र, क्रोधी, चेहरे पर चोट/घाव के निशान वाला और 'कुंजड़ों की सी लड़ाई' (व्यर्थ का कलह) लड़ने वाला होता है।", "bhava|मंगल|2": "द्वितीय भाव में मंगल वाणी में कठोरता और उग्रता लाता है। धन संचय में बाधाएं, कुटुंब में कलह और भोजन में अपाच्य वस्तुओं का सेवन संभव है। जातक को विद्या प्राप्ति में विघ्न आ सकते हैं।", "bhava|मंगल|3": "तृतीय भाव में मंगल जातक को अत्यंत पराक्रमी, निर्भीक, धैर्यवान और प्रतापी बनाता है। युद्ध या प्रतियोगिता में जातक सदैव विजयी होता है, यद्यपि अनुज (छोटे भाइयों) से मतभेद या उनके सुख में कमी आ सकती है।", "bhava|मंगल|4": "चतुर्थ भाव में मंगल भूमि और मकान तो दे सकता है, किंतु गृह-सुख और माता के स्वास्थ्य के लिए प्रतिकूल रहता है। घर का वातावरण तनावपूर्ण रहता है और जातक को बंधु-बांधवों से क्लेश मिलता है।", "bhava|मंगल|5": "पंचम भाव में मंगल तीक्ष्ण बुद्धि देता है, परंतु संतान प्राप्ति में विलंब या कष्ट उत्पन्न करता है। उदर में जलन, पित्त विकार या पेट की शल्य चिकित्सा (सर्जरी) की संभावना रहती है।", "bhava|मंगल|6": "षष्ठ भाव (उपचय व दुस्थान) में मंगल परम शुभ फलदायी माना गया है। यह शत्रुओं का पूर्ण नाश करता है, मुकदमों में विजय दिलाता है और जातक को अद्भुत रोग-प्रतिरोधक क्षमता तथा धन-धान्य प्रदान करता है।", "bhava|मंगल|7": "सप्तम भाव में उग्र मंगल दांपत्य जीवन में कलह, जीवनसाथी के स्वास्थ्य को कष्ट और साझेदारी के व्यापार में विवाद का कारण बनता है। जातक कामुक और उग्र स्वभाव का होता है।", "bhava|मंगल|8": "अष्टम भाव (दुस्थान) में मंगल जातक को शारीरिक कष्ट और दुर्घटना की आशंका देता है। फलदीपिका के प्रथम अध्याय (पृष्ठ 27 पर व्याख्या टिप्पणी अनुसार) में अष्टम मंगल का विशिष्ट फलित लक्षण उद्धृत है:  \"अष्टम में मंगल प्रायः बवासीर का रोग करता है।\"  यह रक्त विकार और अस्त्र-शस्त्र से चोट भी दे सकता है।", "bhava|मंगल|9": "नवम भाव में मंगल जातक को धर्म के प्रति उग्र दृष्टिकोण देता है। पिता के साथ वैचारिक मतभेद हो सकते हैं, किंतु जातक अपने पुरुषार्थ और बाहुबल से भाग्य का निर्माण करता है।", "bhava|मंगल|10": "दशम भाव में मंगल कुलदीपक योग बनाता है। जातक प्रशासनिक सेवाओं, पुलिस, सेना, या तकनीकी क्षेत्रों में उच्च पद प्राप्त करता है। ऐसा व्यक्ति प्रतापी और अपने कुल में श्रेष्ठ होता है।", "bhava|मंगल|11": "एकादश भाव में मंगल जातक को भूमि, संपत्ति और साहसिक कार्यों से अपार धन लाभ कराता है। जातक निर्भीक, नीरोगी और धन-धान्य से पूर्ण रहता है।", "bhava|मंगल|12": "द्वादश भाव में मंगल अत्यधिक क्रोध, व्यर्थ का व्यय, बायीं आँख में चोट, शयन सुख में कमी और नेत्र विकार पैदा कर सकता है।\n\nमंगल के इस उग्र और पराक्रमी विवेचन के पश्चात, आइए अब बुद्धि, वाणी और व्यापार के कारक 'बुध' का विश्लेषण करते हैं।", "bhava|बुध|1": "लग्न में बुध जातक को सुडौल अंग, नवीन दूब के समान कांति, तीव्र बुद्धि, हास्यरुचि (मजाकपसंद) और विद्वता प्रदान करता है। यदि बुध पाप पीड़ित हो तो त्वचा रोग और तंत्रिका तंत्र में खराबी (नर्वस सिस्टम की बीमारी) हो सकती है।", "bhava|बुध|2": "द्वितीय भाव में बुध जातक को अत्यंत चतुर वक्ता, मिष्टभाषी, गणितज्ञ, विद्वान और व्यापार के माध्यम से प्रचुर धन कमाने वाला बनाता है। जातक का कुटुंब समृद्ध और सुखी रहता है।", "bhava|बुध|3": "तृतीय भाव में बुध जातक को लेखन, शिल्पकला, व्यापार और संचार माध्यमों में निपुण बनाता है। जातक के भाई-बहन विद्वान और सहयोगी होते हैं।", "bhava|बुध|4": "चतुर्थ भाव में बुध जातक को उत्तम शिक्षा, सुंदर गृह, मित्र सुख, वाहन और माता का पूर्ण सहयोग दिलाता है। जातक विद्वानों की सभा में आदर पाता है।", "bhava|बुध|5": "पंचम भाव में बुध जातक को असाधारण मेधा, मंत्र सिद्धि, काव्य रचना की क्षमता और योग्य संतान प्रदान करता है। जातक उच्च कोटि का सलाहकार और तंत्र-शास्त्र का ज्ञाता बनता है।", "bhava|बुध|6": "षष्ठ भाव में बुध जातक को अपने चातुर्य और तर्कशक्ति से शत्रुओं पर विजय दिलाता है। हालांकि, यदि बुध पीड़ित हो तो वात, पित्त या कफ जनित त्रिदोष रोग और त्वचा के विकार हो सकते हैं।", "bhava|बुध|7": "सप्तम भाव में बुध जातक को चतुर, बुद्धिमान और सुंदर जीवनसाथी दिलाता है। व्यापारिक साझेदारियों और लेन-देन में जातक को भारी सफलता मिलती है।", "bhava|बुध|8": "अष्टम भाव में बुध जातक को दीर्घायु, गुप्त विद्याओं का ज्ञानी और प्रसिद्ध बनाता है। यदि बुध यहाँ सुस्थ हो तो जातक राजा के समान सुख भोगता है और न्यायधीश/प्रशासक बनता है।", "bhava|बुध|9": "नवम भाव में बुध जातक को परम धार्मिक, वेदों व शास्त्रों का ज्ञाता, तीर्थयात्री और अत्यंत भाग्यशाली बनाता है। जातक अपने ज्ञान से ख्याति पाता है।", "bhava|बुध|10": "दशम भाव में बुध जातक को व्यापार, ज्योतिष, गणित, पठन-पाठन और राजकीय कार्यों में शीर्ष स्थान पर पहुँचाता है। जातक के कर्म अत्यंत पवित्र होते हैं।", "bhava|बुध|11": "एकादश भाव में बुध जातक को निरंतर धन लाभ, बहु-आयामी आय के स्रोत, विद्वान मित्रों का साथ और दीर्घायु प्रदान करता है।", "bhava|बुध|12": "द्वादश भाव में बुध जातक को धर्म और विद्या के कार्यों में व्यय करने वाला बनाता है। पीड़ित होने पर यह पढ़ाई में आलस्य, मान-हानि या तंत्रिका संबंधी तनाव दे सकता है।\n\nबुध के इस बौद्धिक और व्यावहारिक विश्लेषण के उपरांत, आइए अब ज्ञान, धर्म और देवकृपा के परम कारक 'बृहस्पति (गुरु)' के भाव फल की ओर चलते हैं।", "bhava|गुरु|1": "लग्न में बलवान गुरु जातक को अत्यंत बुद्धिमान, विद्वान, विशाल व पुष्ट शरीर, ऊंची छाती और सात्विक आचरण प्रदान करता है। जातक दीर्घायु, निर्भीक और समाज में पूज्य होता है।", "bhava|गुरु|2": "द्वितीय भाव में गुरु जातक को शास्त्रज्ञ, मिष्टभाषी, अपार धन-संपत्ति का स्वामी और समृद्ध कुटुंब वाला बनाता है। जातक की वाणी में प्रगाढ़ विशुद्धता होती है।", "bhava|गुरु|3": "तृतीय भाव में गुरु जातक को धर्मपरायण और सन्मार्गी बनाता है। हालांकि जातक स्वयं थोड़ा संतोषी या कम महत्वाकांक्षी हो सकता है, किंतु उसके भ्राता उच्च स्थान प्राप्त करते हैं।", "bhava|गुरु|4": "चतुर्थ भाव में गुरु जातक को गृह, भूमि, वाहन, माता का सुख और राजकीय मान-सम्मान प्रदान करता है। घर में निरंतर धार्मिक अनुष्ठान होते रहते हैं।", "bhava|गुरु|5": "पंचम भाव में गुरु जातक को असाधारण मेधा, वेद-शास्त्र ज्ञान, राजकीय मंत्री पद और उत्तम पुत्र संतान का सुख देता है।", "bhava|गुरु|6": "षष्ठ भाव में गुरु शत्रुओं को शांत करता है। किंतु स्रोत ग्रंथ (अध्याय 2, श्लोक 25) के अनुसार, यदि गुरु यहाँ पीड़ित या दुर्बल हो तो आकाश तत्व और श्रवणेन्द्रिय का अधिपति होने के कारण जातक को  बधिरता (बहरापन या कम सुनना)  तथा कफ संबंधी विकार हो सकते हैं।", "bhava|गुरु|7": "सप्तम भाव में गुरु जातक को अत्यंत ज्ञानवती, पतिव्रता/गुणी पत्नी और सुखद दांपत्य जीवन प्रदान करता है। जातक के विचार अत्यंत पवित्र और उदार होते हैं।", "bhava|गुरु|8": "अष्टम भाव में गुरु जातक को दीर्घायु और शांतिपूर्ण जीवन देता है। यदि गुरु यहाँ पीड़ित हो तो श्रवणेन्द्रिय दोष (बहरापन) की प्रबल आशंका ग्रंथ में रेखांकित की गई है।", "bhava|गुरु|9": "नवम भाव में गुरु जातक को परम धार्मिक, तपस्वी, आचार्य, देवता व ब्राह्मणों का भक्त और अत्यंत भाग्यशाली बनाता है। जातक का जीवन निष्कलंक होता है।", "bhava|गुरु|10": "दशम भाव में गुरु जातक को उच्च पद, मंत्री, न्यायाधीश, धर्माधिकारी या महान विचारक बनाता है। उसके कार्य समाज के लिए परम कल्याणकारी होते हैं।", "bhava|गुरु|11": "एकादश भाव में गुरु जातक को बिना विशेष परिश्रम के भी प्रचुर धन, खजाना, वाहन और दीर्घकालिक लाभ प्रदान करता है।", "bhava|गुरु|12": "द्वादश भाव में गुरु जातक को धार्मिक कार्यों, यज्ञ और परोपकार में धन व्यय करने वाला बनाता है। जातक देहावसान के पश्चात सद्गति प्राप्त करता है।\n\nगुरु के इस पावन और शुभ विवेचन के बाद, आइए अब सौंदर्य, कला और सांसारिक सुख के कारक 'शुक्र' के प्रभावों का मूल्यांकन करते हैं।", "bhava|शुक्र|1": "लग्न में शुक्र जातक को अत्यंत सुंदर, आकर्षक नेत्र, चेहरे पर दिव्य कांति, कलात्मक निपुणता और दीर्घायु प्रदान करता है। जातक उत्तम वस्त्रों और आभूषणों का शौकीन होता है।", "bhava|शुक्र|2": "द्वितीय भाव में शुक्र जातक को अपार धन, मिष्टान्न भोजन, कवित्व शक्ति और सुंदर वाणी देता है। जातक का पारिवारिक जीवन वैभवशाली होता है।", "bhava|शुक्र|3": "तृतीय भाव में शुक्र जातक को चित्रकला, संगीत, नृत्य और नाट्य कला में निपुण बनाता है। जातक को भगिनी (बहन) सुख उत्तम प्राप्त होता है।", "bhava|शुक्र|4": "चतुर्थ भाव में शुक्र जातक को आलीशान भवन, लग्जरी वाहन, इत्र-सुगंध और माता का अपार स्नेह प्रदान करता है।", "bhava|शुक्र|5": "पंचम भाव में शुक्र जातक को उच्च बुद्धि, काव्य रचना क्षमता, कन्या संतान का सुख और राजकीय मामलों में सफलता दिलाता है।", "bhava|शुक्र|6": "षष्ठ भाव में शुक्र होने पर जातक को शत्रुओं से सतर्क रहना चाहिए। यह गुप्त रोगों, प्रमेह या मूत्र संबंधी विकारों की संभावना पैदा कर सकता है।", "bhava|शुक्र|7": "सप्तम भाव में शुक्र जातक को अत्यंत सुंदर, गुणवती और प्रियवादिनी पत्नी/पति दिलाता है। दांपत्य जीवन सुखों और विलास से परिपूर्ण रहता है।", "bhava|शुक्र|8": "अष्टम भाव में शुक्र जातक को दीर्घायु, अकस्मात धन लाभ और सुखी जीवन देता है। जातक राजा के समान जीवन व्यतीत करता है।", "bhava|शुक्र|9": "नवम भाव में शुक्र जातक को धार्मिक, तीर्थसेवी, दानवीर और स्त्रियों/जीवनसाथी के सहयोग से भाग्यशाली बनाता है।", "bhava|शुक्र|10": "दशम भाव में शुक्र जातक को कला, संगीत, सिनेमा, वस्त्र, आभूषण या सौंदर्य प्रसाधनों के क्षेत्र में अपार ख्याति और धन दिलाता है।", "bhava|शुक्र|11": "एकादश भाव में शुक्र जातक को विभिन्न स्रोतों से धन, वाहन सुख और स्त्री पक्ष से विशेष लाभ प्रदान करता है।", "bhava|शुक्र|12": "द्वादश भाव में शुक्र ज्योतिष शास्त्र का एक अनूठा अपवाद है जहाँ यह अत्यधिक शुभ माना जाता है। यह जातक को उत्तम शयन सुख, विलास और प्रचुर वैभव देता है।\n\nशुक्र के इस आनंदमयी और विलासपूर्ण विवेचन के पश्चात, आइए अब न्यायप्रिय और मंद गति वाले ग्रह 'शनि' के गंभीर प्रभावों का विश्लेषण करते हैं।", "bhava|शनि|1": "लग्न में शनि जातक को कृश (दुबला) शरीर, वात रोग, आलसी स्वभाव और प्रारंभिक जीवन में कठोर संघर्ष देता है। यदि शनि उच्च (तुला) या स्वराशि (मकर/कुंभ) में हो तो जातक को ग्राम या नगर का प्रधान बनाता है।", "bhava|शनि|2": "द्वितीय भाव में शनि धन संचय में भारी बाधाएं, कुटुंब में दूरी और कठोर वाणी देता है। जातक को जीवन के उत्तरार्ध में कठिन परिश्रम के बाद धन प्राप्त होता है।", "bhava|शनि|3": "तृतीय भाव (उपचय) में शनि अत्यंत शुभ होता है। जातक अत्यंत साहसी, शत्रुओं का दमन करने वाला, बुद्धिमान और स्थिर विचारों वाला होता है।", "bhava|शनि|4": "चतुर्थ भाव में शनि गृह-सुख में कमी, माता को कष्ट, वाहन से समस्या और मानसिक चिंताएं दे सकता है। जातक को पैतृक निवास छोड़ना पड़ता है।", "bhava|शनि|5": "पंचम भाव में शनि बुद्धि को गंभीर बनाता है, किंतु संतान प्राप्ति में विलंब या चिंता पैदा करता है। जातक के विचार कुछ गूढ़ और कूटनीतिक होते हैं।", "bhava|शनि|6": "षष्ठ भाव (उपचय) में शनि अत्यंत बलवान फल देता है। जातक शत्रुओं का समूल नाश करता है, मुकदमों में जीतता है और नौकरी/दास्य कर्म में उच्च पद पाता है।", "bhava|शनि|7": "सप्तम भाव में शनि विवाह में अत्यधिक विलंब, परिपक्व या ढलती उम्र के जीवनसाथी की प्राप्ति और दांपत्य में नीरसता ला सकता है।", "bhava|शनि|8": "अष्टम भाव में शनि स्थित होना ज्योतिष शास्त्र के प्रसिद्ध  'कारको भावनाशाय'  (कारक ग्रह अपने भाव का नाश करता है) नियम का एक महान शास्त्रीय अपवाद प्रस्तुत करता है। शनि स्वयं आयु का कारक ग्रह होकर जब अष्टम (आयु भाव) में बैठता है, तो यह आयु का नाश करने के बजाय  जातक की आयु में भारी वृद्धि (दीर्घायु)  करता है। हालांकि, यह वात रोग या पैर में कष्ट दे सकता है।", "bhava|शनि|9": "नवम भाव में शनि जातक के भाग्य को विलंब से चमकाता है। जातक वैराग्य अनुरागी या कठोर नियमों का पालन करने वाला धार्मिक व्यक्ति होता है।", "bhava|शनि|10": "दशम भाव (उपचय) में शनि जातक को कठिन परिश्रम के पश्चात राजनीति, प्रशासनिक सेवा या निर्माण कार्यों में सर्वोच्च स्थान और अधिकार दिलाता है।", "bhava|शनि|11": "एकादश भाव (उपचय) में शनि जातक को अचल संपत्ति, लोहा, कृषि और सेवकों के माध्यम से अकूत धन-धान्य और दीर्घकालिक लाभ देता है।", "bhava|शनि|12": "द्वादश भाव में शनि व्यर्थ के खर्चों, बायीं आँख या पैर में चोट, निर्धनता और बंधन (जेल) का जोखिम पैदा कर सकता है।\n\nशनि के इस गंभीर विश्लेषण के पश्चात, आइए अब अप्रत्याशित छाया ग्रह 'राहु' के भाव फल की ओर बढ़ते हैं।", "bhava|राहु|1": "लग्न में राहु जातक को चंचल बुद्धि, स्वार्थी दृष्टिकोण और शरीर में खुजली या चर्म रोग दे सकता है। जातक कूटनीति और राजनीति में निपुण होता है।", "bhava|राहु|2": "द्वितीय भाव में राहु वाणी में असत्यता या कठोरता लाता है। जातक दूसरों की निंदा (चुगलखोरी) करने वाला हो सकता है जिसके कारण धन हानि और मान-हानि होती है।", "bhava|राहु|3": "तृतीय भाव (उपचय) में राहु जातक को अत्यधिक पराक्रमी, निर्भीक, शत्रुओं पर विजय प्राप्त करने वाला और प्रचुर धनवान बनाता है।", "bhava|राहु|4": "चतुर्थ भाव में राहु मानसिक अशांति, माता के स्वास्थ्य में कष्ट और गृह में कलह का वातावरण पैदा कर सकता है।", "bhava|राहु|5": "पंचम भाव में राहु बुद्धि में भ्रम, संतान संबंधी समस्याएं और पेट के रोग उत्पन्न कर सकता है। जातक की सोच अपरंपरागत होती है।", "bhava|राहु|6": "षष्ठ भाव (उपचय) में राहु जातक को शत्रुओं पर पूर्ण विजय दिलाता है। ऐसा जातक किसी भी गुप्त षड्यंत्र को विफल करने में सिद्धहस्त होता है।", "bhava|राहु|7": "सप्तम भाव में राहु जीवनसाथी से वैचारिक दूरी, अपरंपरागत विवाह या व्यापारिक साझेदारी में अचानक धोखा दे सकता है।", "bhava|राहु|8": "अष्टम भाव में राहु जातक को गुप्त बीमारियां, अचानक संकट, अपमान या मानसिक घबराहट दे सकता है।", "bhava|राहु|9": "नवम भाव में राहु जातक को पारंपरिक धर्म से दूर कर सकता है। विदेशी संबंधों या विदेश यात्रा से भाग्य वृद्धि संभव होती है।", "bhava|राहु|10": "दशम भाव (उपचय) में राहु जातक को राजनीति, कूटनीति और विदेशी व्यापार में अपार ख्याति और उच्च पद दिलाता है।", "bhava|राहु|11": "एकादश भाव (उपचय) में राहु अकस्मात धन लाभ, अकूत संपत्ति और समाज में भारी प्रभाव प्रदान करता है।", "bhava|राहु|12": "द्वादश भाव में राहु गुप्त शत्रुओं, अत्यधिक व्यय, अनिद्रा और गुप्त शारीरिक कष्टों का कारण बनता है।\n\nराहु के उपरांत, आइए अब अंतिम छाया ग्रह और मोक्ष के कारक 'केतु' के भाव फल को समझते हैं।", "bhava|केतु|1": "लग्न में केतु जातक को पतला (कृश) शरीर, चिड़चिड़ा स्वभाव, शरीर पर घाव/चोट के निशान (व्रण) और वैराग्य की भावना देता है।", "bhava|केतु|2": "द्वितीय भाव में केतु के फल के विषय में 'फलदीपिका' के द्वितीय अध्याय (पृष्ठ 51) का स्पष्ट कथन है कि जातक विषैली व कठोर भाषा बोलने वाला (कटुभाषी) होता है, जिसके कारण धन और कुटुंब का क्षय होता है।", "bhava|केतु|3": "तृतीय भाव (उपचय) में केतु जातक को महान पराक्रमी, साहसी, शत्रुओं का नाश करने वाला और स्थिर बुद्धि प्रदान करता है।", "bhava|केतु|4": "चतुर्थ भाव में केतु मानसिक सुख में कमी, माता से दूरी और भूमि-जायदाद से संबंधित विवाद पैदा करता है।", "bhava|केतु|5": "पंचम भाव में केतु संतान चिंता, पेट में चोट/रोग और गुप्त विद्याओं या तंत्र-मंत्र में रुचि देता है।", "bhava|केतु|6": "षष्ठ भाव (उपचय) में केतु शत्रुओं का सफाया करता है और जातक को किसी भी कठिन परिस्थिति से बाहर निकालता है।", "bhava|केतु|7": "सप्तम भाव में केतु दांपत्य जीवन में उदासीनता, जीवनसाथी के स्वास्थ्य को कष्ट और यात्राओं में परेशानी देता है।", "bhava|केतु|8": "अष्टम भाव में केतु अस्त्र-शस्त्र या विष से चोट/घाव (व्रण), गुप्त रोग और दुर्घटनाओं की आशंका उत्पन्न करता है।", "bhava|केतु|9": "नवम भाव में केतु जातक को धार्मिक, तीर्थाटन करने वाला और मोक्ष मार्ग का अनुगामी बनाता है।", "bhava|केतु|10": "दशम भाव में केतु जातक के कर्मक्षेत्र में अचानक परिवर्तन लाता है। आध्यात्मिक या गुप्त शोध कार्यों में जातक नाम कमाता है।", "bhava|केतु|11": "एकादश भाव (उपचय) में केतु जातक को अकस्मात वित्तीय लाभ, सफलता और संपत्ति प्रदान करता है।", "bhava|केतु|12": "द्वादश भाव में केतु 'मोक्ष' का परम कारक माना गया है। यह जातक को सांसारिक बंधनों से मुक्त कर आध्यात्मिक परम पद दिलाता है।\n\nउपर्युक्त नवग्रहों के द्वादश भावगत पृथक-पृथक शास्त्रीय परिणामों का विवेचन करने के उपरांत, अब फलित ज्योतिष के व्यावहारिक अनुप्रयोग, ग्रहीय बल की अवस्थाओं (सुस्थ व दुस्थ) तथा अंतिम निर्णय के सार्वभौमिक सिद्धांतों का समीक्षात्मक संश्लेषण प्रस्तुत किया जा रहा है।", "bhavesh|लग्नेश|1": "शारीरिक पुष्टता एवं स्व-प्रतिष्ठा:  लग्नेश का स्वक्षेत्री होकर प्रथम भाव (लग्न) में स्थित होना जातक को उत्तम  आरोग्य ,  सुंदर व आकर्षक देह ,  दीर्घायु  और अदम्य  आत्मबल  प्रदान करता है। जातक स्वतंत्र विचारों वाला, आत्म-निर्भर और अपने पुरुषार्थ से समाज में उच्च मान-प्रतिष्ठा अर्जित करने वाला होता है।", "bhavesh|लग्नेश|2": "धन संचय एवं विद्या अर्जन:  लग्नेश जब द्वितीय भाव में स्थित होता है, तो जातक अपनी कार्यकुशलता से  धन-धान्य का संचय  करता है। वह  शास्त्रज्ञ व विद्वान , सुवक्ता, उत्तम  कुटुंब का सुख  भोगने वाला तथा खान-पान के प्रति रुचि रखने वाला समृद्ध व्यक्ति बनता है।", "bhavesh|लग्नेश|3": "पराक्रम एवं भ्रातृ सुख:  तृतीय स्थान (दुश्चिक्य) में लग्नेश का गमन जातक को  अत्यंत साहसी , धैर्यवान, संगीत व कला में प्रवीण तथा सैन्य या सांगठनिक क्षमता से युक्त बनाता है। जातक अपने  छोटे भाई-बहनों (सहोदर)  का प्रिय होता है तथा स्वयं के बाहुबल से सफलता अर्जित करता है।", "bhavesh|लग्नेश|4": "गृह-वाहन सुख एवं मातृ कृपा:  चतुर्थ स्थान (हिबुक) में लग्नेश की स्थिति जातक को  माता का पूर्ण सुख ,  उत्तम गृह (मकान) ,  कृषि भूमि/क्षेत्र ,  सवारी/वाहन  तथा सुगंधित पदार्थों व वस्त्रों का ऐश्वर्य प्रदान करती है। जातक का पारिवारिक जीवन मानसिक शांति से परिपूर्ण होता है।", "bhavesh|लग्नेश|5": "बौद्धिक प्रखरता एवं संतान सुख:  पंचम भाव (शुभ त्रिकोण) में लग्नेश की स्थिति जातक को  तीक्ष्ण बुद्धि ,  भविष्य ज्ञान ,  श्रुति व स्मृति (शास्त्र ज्ञान)  में निष्णात,  संतान सुख  से युक्त तथा राजकीय मामलों में  मंत्रित्व क्षमता  व सम्मान प्रदान करती है।", "bhavesh|लग्नेश|6": "रोग-ऋण विचार एवं शत्रु दमन:  षष्ठ भाव (दुःस्थान) में लग्नेश स्थित होने पर यद्यपि शरीर के कृश या  रोगग्रस्त  होने की संभावना रहती है, किंतु 'फलदीपिका' के अध्याय १५ के नियम अनुसार लग्नेश षष्ठ भाव की वृद्धि भी करता है। अतः यदि लग्नेश बलवान हो तो जातक  प्रतिस्पर्धियों व शत्रुओं पर विजय  प्राप्त करता है, सैन्य या चिकित्सा क्षेत्र में सफल होता है, किंतु कमजोर होने पर  ऋण व शत्रुओं से पीड़ित  रहता है।", "bhavesh|लग्नेश|7": "दाम्पत्य आकर्षण एवं जन-संपर्क:  सप्तम स्थान (जामित्र/द्यून) में लग्नेश का विराजमान होना जातक को  गुणवती व सुंदर पत्नी/पति  का सुख देता है। जातक कामुक,  व्यापार में निपुण ,  जन-सामान्य (लोक)  में प्रसिद्ध तथा यात्राओं से लाभ कमाने वाला होता है।", "bhavesh|लग्नेश|8": "आधि-व्याधि एवं गूढ़ विद्या:  अष्टम भाव (रंध्र स्थान) में लग्नेश की स्थिति शरीर के लिए क्लेशकारी हो सकती है, जिससे जातक  मानसिक चिंता (आधि) ,  शारीरिक कष्ट  या  बाधाओं  से प्रभावित हो सकता है। परंतु लग्नेश इस भाव की वृद्धि भी करता है, अतः शुभ दृष्ट होने पर जातक को  गूढ़/रहस्यमयी विद्याओं का ज्ञान ,  अचानक पैतृक धन  और  दीर्घायु  प्राप्त होती है।", "bhavesh|लग्नेश|9": "भाग्योदय एवं धार्मिक निष्ठा:  नवम भाव (उत्कृष्ट त्रिकोण/शुभ स्थान) में लग्नेश जातक को परम  भाग्यशाली ,  धार्मिक ,  गुरु व पिता का भक्त ,  सत्कर्मी  और समाज में सर्वत्र पूजित बनाता है। जातक का जीवन अल्प प्रयास से भी उन्नति की ओर अग्रसर होता है।", "bhavesh|लग्नेश|10": "उच्च पद एवं आजीविका सिद्धि:  दशम स्थान (मेषूरण/आज्ञा स्थान) में लग्नेश की उपस्थिति जातक को अपने कर्मक्षेत्र में  सर्वोच्च पद (हुकूमत्) ,  व्यापारिक सफलता ,  अखंड यश-कीर्ति  और राजकीय संरक्षण प्रदान करती है। जातक सदाचारी व प्रभावशाली व्यक्तित्व का धनी होता है।", "bhavesh|लग्नेश|11": "सतत लाभ एवं सर्व-इच्छा पूर्ति:  एकादश भाव में लग्नेश का होना  आय के प्रचुर स्रोतों ,  अपरिमित लाभ ,  वैभव ,  सर्व-मनोरथ सिद्धि  तथा  ज्येष्ठ भ्राता  के सहयोग का निर्माण करता है। जातक जो भी कार्य हाथ में लेता है, उसमें आर्थिक सफलता प्राप्त करता है।", "bhavesh|लग्नेश|12": "व्ययिक दबाव एवं विदेश प्रवास:  द्वादश भाव (व्यय/रिःफ स्थान) में लग्नेश स्थित होने से जातक  धन का अपव्यय  करने वाला, शारीरिक रूप से दुबला,  असंतोषी  तथा जन्मभूमि त्यागकर  विदेश या दूरस्थ स्थानों में निवास  करने वाला होता है। हालांकि, लग्नेश यहाँ स्थित होकर मोक्ष व आध्यात्मिक चिंतन की दिशा में वृद्धि करता है।\n\nलग्नेश के इस शारीरिक एवं देह-केंद्रित विश्लेषण के उपरांत, यह अध्ययन स्वाभाविक रूप से द्वितीयेश—अर्थात धन, वाणी, विद्या और कुटुंब के स्वामी के विविध भावगत प्रभावों के परीक्षण की ओर संचरण करता है।", "bhavesh|द्वितीयेश|1": "जातक  स्व-प्रयासों एवं बुद्धिबल  से प्रचुर धन अर्जित करता है। उसकी  वाणी प्रभावशाली व ओजस्वी  होती है, वह कुटुंब का प्रिय,  विद्वान  तथा समाज में धनी व्यक्ति के रूप में प्रतिष्ठा प्राप्त करता है।", "bhavesh|द्वितीयेश|2": "धनेश का अपने ही भाव (स्वक्षेत्र) में बैठना जातक को  अथाह धन-धान्य ,  स्थाई पैतृक संपत्ति , सुंदर  चेहरा व दाहिना नेत्र , उत्तम भोजन का सुख तथा  सरस वाणी  प्रदान करता है।", "bhavesh|द्वितीयेश|3": "धन का अर्जन जातक के  साहस ,  कला , संगीत, सैन्य कार्य अथवा  छोटे भाई-बहनों (सहोदर) के सहयोग  से होता है। जातक पराक्रम से अपनी आर्थिक स्थिति सुदृढ़ करता है।", "bhavesh|द्वितीयेश|4": "जातक को  माता ,  भूमि (खेत) ,  भवनों ,  वाहन (सवारी)  तथा पैतृक संपत्ति के माध्यम से  प्रचुर आर्थिक लाभ  प्राप्त होता है।", "bhavesh|द्वितीयेश|5": "सट्टे/शेयर ,  मंत्र/सलाहकारिता (मंत्रित्व) ,  उच्च विद्या  तथा  संतान के भाग्य  से धन संचय का सुंदर योग बनता है। जातक विवेकपूर्ण निवेश से धनी बनता है।", "bhavesh|द्वितीयेश|6": "धनेश का दुःस्थान गमन  आर्थिक हानि ,  ऋण (कर्ज) ,  शत्रुओं के कारण धन का क्षय ,  मुख/दाहिने नेत्र में रोग  तथा पारिवारिक विवादों को जन्म देता है।", "bhavesh|द्वितीयेश|7": "धन अर्जन में  विवाह/जीवनसाथी  या  व्यापारिक साझेदारों (पार्टनरशिप)  की मुख्य भूमिका होती है। जातक को ससुराल पक्ष से भी वित्तीय सहयोग प्राप्त होता है।", "bhavesh|द्वितीयेश|8": "धनेश का अष्टम (रंध्र) भाव में जाना धन संचय में  अचानक रुकावटें ,  पैतृक संपत्ति में विवाद ,  दरिद्रता ,  दाहिने नेत्र में विकार  तथा अपमानजनक आर्थिक स्थितियों का सृजन करता है।", "bhavesh|द्वितीयेश|9": "जातक  परम धनी ,  धर्म-कर्म से लाभ कमाने वाला , गुरुजनों का प्रिय और  भाग्योदय से निरंतर समृद्ध  होने वाला होता है।", "bhavesh|द्वितीयेश|10": "जातक  व्यापार ,  राजकीय सेवा  या अपने  सदाचार व उत्कृष्ट कर्मों  के बल पर विशाल धन तथा उच्च सामाजिक प्रतिष्ठा अर्जित करता है।", "bhavesh|द्वितीयेश|11": "धनेश का लाभ भाव में जाना  अपरिमित धन लाभ , व्यापार में निरंतर वृद्धि, आय के विविध स्रोतों का विकास तथा  ऐश्वर्यपूर्ण जीवन  सुनिश्चित करता है।", "bhavesh|द्वितीयेश|12": "कुटुंब से दूरी,  धन का व्यर्थ क्षय (अत्यधिक खर्चा) , विद्या अर्जन में विघ्न,  दाहिने नेत्र में कष्ट  तथा आर्थिक विषमताओं का सामना करना पड़ता है।", "bhavesh|तृतीयेश|1": "जातक  स्वयं के बाहुबल से भाग्य का निर्माण करने वाला , अत्यधिक  साहसी ,  शारीरिक रूप से बलवान  तथा कला, संगीत या सैन्य/शस्त्र विषयों में विशेष रुचि रखने वाला होता है। जातक अपने स्वाभिमान से कभी समझौता नहीं करता।", "bhavesh|तृतीयेश|2": "जातक की वाणी में  दृढ़ता एवं साहस  झलकता है। वह  भाई-बहनों के सहयोग से धन  प्राप्त करता है अथवा संगीत, गायन व कलात्मक वाक्-शक्ति के माध्यम से संपत्ति अर्जित करता है।", "bhavesh|तृतीयेश|3": "बलि तृतीयेश का अपनी ही राशि (तृतीय भाव) में होना जातक को  अद्भुत वीरता ,  अदम्य साहस ,  उत्तम दाहिना कान (श्रवण शक्ति) , उत्कृष्ट सेना/संगठन क्षमता तथा  सहोदरों का अखंड सुख  प्रदान करता है।", "bhavesh|तृतीयेश|4": "जातक को  बंधु-बांधवों ,  मित्रों  तथा  माता के माध्यम से सुख  प्राप्त होता है। पराक्रम के बल पर वह अचल संपत्ति, गृह व वाहनों का निर्माण करता है तथा घर में सुख शांति बनी रहती है।", "bhavesh|तृतीयेश|5": "जातक अपनी  बुद्धि, विवेक और पराक्रम के समन्वय से सफलता  प्राप्त करता है। उसकी संतान साहसी, कर्मठ तथा कला-कौशल में निपुण होती है। जातक शास्त्रों का व्यावहारिक ज्ञान रखता है।", "bhavesh|तृतीयेश|6": "तृतीयेश का ६ठे भाव (दुःस्थान/लीन स्थान) में जाना  भाई-बहनों से वैमनस्य व शत्रुता ,  छाती में विकार ,  दाहिने कान में दोष  अथवा साहस के गलत दिशा में प्रयोग (अहंकार) का संकेत देता है।", "bhavesh|तृतीयेश|7": "जातक का जीवनसाथी साहसी, स्वाभिमानी तथा कर्मठ होता है। जातक को  यात्राओं ,  जन-संपर्क  तथा व्यावसायिक साझेदारियों के माध्यम से प्रचुर लाभ एवं ख्याति प्राप्त होती है।", "bhavesh|तृतीयेश|8": "पराक्रम का ह्रास,  भ्रातृ नाश या छोटे भाइयों को कष्ट ,  दाहिने कान में गंभीर रोग , मानसिक क्लेश तथा असफलता का भय बना रहता है। जातक के प्रयास अंतिम समय में विफल हो सकते हैं।", "bhavesh|तृतीयेश|9": "जातक का  भाग्योदय उसके स्वयं के पराक्रम एवं परिश्रम पर निर्भर  करता है। वह पिता व गुरुजनों का आदर करने वाला होता है तथा धार्मिक यात्राओं के माध्यम से ख्याति अर्जित करता है।", "bhavesh|तृतीयेश|10": "जातक अपने  साहसिक कार्यों , सेना, पुलिस, खेलकूद या स्वतंत्र व्यापार के माध्यम से  उच्च पद व प्रतिष्ठा  प्राप्त करता है। जातक का कर्मक्षेत्र उसके पराक्रम से दीप्तिमान रहता है।", "bhavesh|तृतीयेश|11": "व्यापारिक उद्यमों एवं साहसिक कार्यों से  प्रचुर लाभ  होता है। जातक को  ज्येष्ठ व कनिष्ठ भ्राताओं का पूर्ण सहयोग  मिलता है तथा उसकी समाज में श्लाघ्यता (प्रशंसा) होती है।", "bhavesh|तृतीयेश|12": "जातक के  प्रयास निष्फल  हो सकते हैं,  छोटे भाई-बहनों से वियोग  या मतभेद रहता है, यात्राओं में भारी धन व्यय होता है तथा जातक का साहस विषम परिस्थितियों में डगमगा सकता है।", "bhavesh|चतुर्थेश|1": "जातक को  माता का पूर्ण सुख ,  उत्तम विद्या ,  गृह व वाहन का सहज सुख  तथा बंधु-बांधवों का सहयोग प्राप्त होता है। जातक का स्वभाव उदार, शांत तथा सुखप्रिय होता है।", "bhavesh|चतुर्थेश|2": "भूमि, खेत, मकान या पैतृक संपत्ति के क्रय-विक्रय व प्रबंधन से जातक को  विशाल धन लाभ  होता है। कुटुंब में सुख-शांति बनी रहती है।", "bhavesh|चतुर्थेश|3": "बंधु-बांधवों व मित्रों का सहयोग  मिलता है तथा जातक अपने पराक्रम व बाहुबल के माध्यम से अचल संपत्ति व वाहनों का संचय करता है।", "bhavesh|चतुर्थेश|4": "स्वक्षेत्री चतुर्थेश जातक को  अथाह अचल संपत्ति (खेत/मकान) ,  उत्तम सवारियाँ ,  अखंड मातृ-कृपा ,  मातुल-भागिनेय सुख , वस्त्र-आभूषण तथा  अक्षय मानसिक शांति  प्रदान करता है।", "bhavesh|चतुर्थेश|5": "जातक  उच्च शिक्षित ,  राजकीय मंत्रियों/शासकों का प्रिय ,  संतान-सुखी , तीक्ष्ण बुद्धि वाला और सर्व-सुख संपन्न जीवन व्यतीत करता है।", "bhavesh|चतुर्थेश|6": "चतुर्थेश का दुःस्थान में होना  मातृ-कष्ट ,  मातुल (मामा) से विवाद/शत्रुता ,  भूमि-वाहन संबंधी मुकदमेबाज़ी व ऋण , तथा  गंभीर मानसिक अशांति  पैदा करता है।", "bhavesh|चतुर्थेश|7": "सुंदर, सुशील व गुणवती पत्नी/पति की प्राप्ति होती है। जातक को  उत्तम गृहस्थ सुख , श्रेष्ठ वाहन तथा व्यापारिक सहयोग मिलता है।", "bhavesh|चतुर्थेश|8": "गृह/वाहन का नाश या दुर्घटना ,  मातृ-वियोग या माता को गंभीर कष्ट ,  मानसिक क्लेश/आधि  तथा संपत्ति संबंधी कानूनी बाधाएँ व हानि होती है।", "bhavesh|चतुर्थेश|9": "जातक को  माता व पिता दोनों का पूर्ण सुख ,  तीव्र भाग्योदय , धार्मिक स्थलों/आश्रमों का निर्माण तथा तीर्थयात्राओं का आनंद प्राप्त होता है।", "bhavesh|चतुर्थेश|10": "जातक  राज्य/सरकार द्वारा सम्मानित ,  उच्च राजकीय पदधारी , विशाल भवनों व राजकीय वाहनों का सुख भोगने वाला यशस्वी व्यक्ति बनता है।", "bhavesh|चतुर्थेश|11": "अचल संपत्ति, भवनों, कृषि/भूमि तथा पशु-धन से  निरंतर प्रचुर आय  प्राप्त होती है। मित्रों व बंधुओं से सदा लाभ होता है।", "bhavesh|चतुर्थेश|12": "गृहहीनता ,  मातृ-कष्ट ,  वाहन हानि या दुर्घटना , मानसिक असंतोष तथा जातक को अपनी जन्मभूमि व स्वदेश का त्याग करना पड़ता है।", "bhavesh|पंचमेश|1": "जातक  अत्यंत कुशाग्र बुद्धि ,  शास्त्रज्ञ ,  दूरदर्शी ,  मंत्र-विद्या में सिद्ध , संतान से युक्त तथा समाज में विद्वान के रूप में सम्मानित होता है।", "bhavesh|पंचमेश|2": "जातक अपनी  विद्वत्ता ,  सलाहकारिता (मंत्रित्व) , शिक्षण अथवा शास्त्र ज्ञान के माध्यम से  प्रचुर धन संचय  करता है।", "bhavesh|पंचमेश|3": "जातक  साहसी ,  कला-निपुण , अपनी बुद्धि से पराक्रम करने वाला तथा अपने  भ्रातृ वर्ग के लिए अत्यंत शुभचिंतक  व प्रिय होता है।", "bhavesh|पंचमेश|4": "जातक को  उत्तम माता ,  उच्चतम विद्या , विशाल  गृह-वाहन सुख , मानसिक संतोष तथा राज-कृपा प्राप्त होती है।", "bhavesh|पंचमेश|5": "स्वक्षेत्री पंचमेश  श्रेष्ठ व आज्ञाकारी संतान ,  अचूक भविष्य ज्ञान ,  राजकीय पद/मंत्री पद ,  कर (टैक्स) प्रबंधन  और  मंत्र सिद्धि  प्रदान करता है।", "bhavesh|पंचमेश|6": "पंचमेश का दुःस्थान गमन  संतान हीनता या संतान से कष्ट ,  बौद्धिक भ्रम/कुटिलता ,  पेट के रोग (जठर विकार) , तथा शत्रुओं द्वारा मतिभ्रम का कारण बनता है।", "bhavesh|पंचमेश|7": "जातक का जीवनसाथी  विद्वान, सुसंस्कृत व उच्च कुलीन  होता है। संतान के जन्म के पश्चात सामाजिक प्रतिष्ठा व व्यापार में तीव्र वृद्धि होती है।", "bhavesh|पंचमेश|8": "संतान का नाश या गंभीर कष्ट ,  स्मृति/बुद्धि का ह्रास ,  मानसिक असंतुलन , उदर रोग तथा राजाज्ञा/सरकार से दंड व हानि होती है।", "bhavesh|पंचमेश|9": "जातक  परम पुण्यशाली , पूर्वजन्म के शुभ कर्मों का फल पाने वाला,  गुरु-देवता भक्त , उच्च विद्या से सुशोभित तथा समाज में पूज्य होता है।", "bhavesh|पंचमेश|10": "जातक अपनी  तीक्ष्ण बुद्धि व विवेक के बल पर सर्वोच्च राजकीय पद ,  मंत्री पद  या बड़ा  व्यापारिक साम्राज्य  स्थापित कर कीर्ति पाता है।", "bhavesh|पंचमेश|11": "ज्ञान, विद्या व सलाह से अपार आर्थिक लाभ ,  संतान की शानदार प्रगति  तथा सर्व-मनोरथ सिद्धि होती है।", "bhavesh|पंचमेश|12": "संतानहीनता या संतान से दुख ,  बुद्धि का व्यर्थ क्षय , परीक्षा में असफलता तथा मानसिक अशांति व असंतोष उत्पन्न होता है।", "bhavesh|षष्ठेश|1": "(लग्नेश बनाम षष्ठेश बलाबल विश्लेषण):  यदि षष्ठेश लग्नेश की तुलना में अधिक बलवान होकर प्रथम भाव में बैठे, तो जातक  शारीरिक रूप से अस्वस्थ ,  चोट/घाव (व्रण) से पीड़ित , अल्पायु संशय तथा  शत्रुओं व ऋणों से निरंतर परेशान  रहता है। इसके विपरीत, यदि लग्नेश षष्ठेश से अधिक बलि हो, तो जातक अपने  शत्रुओं व प्रतिस्पर्धियों का पूर्ण दमन  करता है, अत्यंत शूरवीर होता है तथा सैन्य या शल्य-चिकित्सा में ख्याति पाता है।", "bhavesh|षष्ठेश|2": "जातक को  कुटुंब में कलह व शत्रुता ,  वाणी दोष (कटु वचन) ,  भोजन दूषित होने से रोग ,  दाहिने नेत्र में विकार  तथा  ऋण/कर्ज  के कारण भारी धन हानि उठानी पड़ती है।", "bhavesh|षष्ठेश|3": "भाई-बहनों से शत्रुता व मुकदमा ,  साहस का क्षय  अथवा गलत व असमाजिक कार्यों में पराक्रम का प्रदर्शन होता है। जातक का अपने बंधुओं से विवाद रहता है।", "bhavesh|षष्ठेश|4": "माता को रोग व कष्ट ,  भूमि-वाहन संबंधी मुकदमेबाज़ी ,  मातुल (मामा) से अनबन , तथा  गृह-सुख व मानसिक शांति का ह्रास  होता है।", "bhavesh|षष्ठेश|5": "बुद्धि में कुटिलता व अस्थिरता ,  संतान से शत्रुता या संतान को गंभीर रोग , उदर (पेट) के विकार तथा मंत्र/विद्या अर्जन में विघ्न आते हैं।", "bhavesh|षष्ठेश|6": "अपनी ही राशि में षष्ठेश का होना अत्यंत शुभ परिणाम देता है; जातक  शत्रुओं पर पूर्ण विजय  पाता है,  निरोगी काय  धारण करता है,  मामा व ज्ञाति वर्ग से लाभ  उठाता है तथा मुकदमों में जीत दर्ज करता है।", "bhavesh|षष्ठेश|7": "जीवनसाथी से शत्रुता/कलह ,  पत्नी/पति का अस्वस्थ रहना ,  दाम्पत्य सुख का अभाव  तथा व्यापारिक साझेदारों द्वारा धोखे व मुकदमों का योग बनता है।", "bhavesh|षष्ठेश|8": "दो दुःस्थानों का संबंध विपरीत राजयोग की स्थिति बना सकता है, परंतु सामान्यतः यह  गंभीर/असाध्य रोग ,  अस्त्र या चोट से भय ,  अपमान ,  अदालती संकट  तथा तीव्र शारीरिक कष्ट देता है।", "bhavesh|षष्ठेश|9": "जातक के  भाग्योदय में निरंतर शत्रु बाधा ,  पिता से गंभीर मतभेद या पिता को रोग ,  धार्मिक कार्यों में विघ्न  तथा गुरुजनों से अनबन रहती है।", "bhavesh|षष्ठेश|10": "कैरियर में शत्रु व प्रतिस्पर्धी हावी  रहते हैं, आजीविका में बारंबार रुकावटें आती हैं, नौकरी में अधिकारियों से विवाद तथा  ऋण लेकर व्यापार  चलाना पड़ता है।", "bhavesh|षष्ठेश|11": "मुकदमों या शत्रुओं के दमन से धन लाभ हो सकता है, परंतु जातक को  बड़े भाई से शत्रुता/विवाद  तथा आय के स्रोतों में अनिश्चितता का सामना करना पड़ता है।", "bhavesh|षष्ठेश|12": "रोगों के उपचार पर अत्यधिक धन व्यय ,  गुप्त शत्रुओं से भारी हानि ,  अदालती दंड या बंधन (जेल)  तथा विदेश प्रवास में कष्ट होता है।", "bhavesh|सप्तमेश|1": "जातक को  सुंदर, समर्पित व गुणवान जीवनसाथी  प्राप्त होता है। जातक स्वयं कामुक,  जन-प्रिय , व्यापार में चतुर,  यात्रा-प्रेमी  तथा जन-सामान्य में प्रतिष्ठा पाने वाला होता है।", "bhavesh|सप्तमेश|2": "विवाह के उपरांत  तीव्र धन लाभ ,  ससुराल पक्ष से प्रचुर आर्थिक सहयोग , कुटुंब में वृद्धि तथा वाणी प्रभाव से व्यापार में सफलता मिलती है।", "bhavesh|सप्तमेश|3": "जातक का जीवनसाथी साहसी व कर्मठ होता है। जातक को  भाई-बहनों के सहयोग  तथा  व्यापारिक यात्राओं  के माध्यम से प्रचुर लाभ होता है।", "bhavesh|सप्तमेश|4": "अखंड गृहस्थ सुख , सुंदर पत्नी/पति,  वाहन व भवनों का सुख , माता का आशीर्वाद तथा अचल संपत्ति में वृद्धि होती है।", "bhavesh|सप्तमेश|5": "जातक का जीवनसाथी  विद्वान, सुसंस्कृत व उच्च कुलीन  होता है।  उत्तम संतान  का जन्म होता है तथा जातक की मंत्र/सलाहकार क्षमता से व्यापार में उन्नति होती है।", "bhavesh|सप्तमेश|6": "(विवाह काल व दिशा का परिणामी प्रभाव):  सप्तमेश का दुःस्थान गमन  विवाह में भारी विलंब/बाधा ,  दाम्पत्य जीवन में कलह व विच्छेद ,  जीवनसाथी को गंभीर रोग  तथा व्यापारिक साझेदारों से मुकदमेबाज़ी देता है। विवाह प्रायः अनुकूल दिशा में नहीं होता।", "bhavesh|सप्तमेश|7": "स्वक्षेत्री सप्तमेश  अत्यंत सुंदर व सुशील जीवनसाथी ,  अखंड दाम्पत्य सुख ,  लोक-प्रसिद्धि , व्यापार में अपार सफलता तथा  उत्कृष्ट जन-संपर्क  प्रदान करता है।", "bhavesh|सप्तमेश|8": "जीवनसाथी का अकाल वियोग या गंभीर बीमारी ,  दाम्पत्य सुख का नाश ,  बदनामी ,  गुप्त जननांगों में विकार  तथा व्यापारिक तबाही का भय रहता है।", "bhavesh|सप्तमेश|9": "विवाह के तुरंत बाद तीव्र भाग्योदय , धर्मनिष्ठ व चरित्रवान जीवनसाथी की प्राप्ति, विदेश यात्राएँ तथा व्यापार में अंतरराष्ट्रीय सफलता मिलती है।", "bhavesh|सप्तमेश|10": "जीवनसाथी के भाग्य व सहयोग से  कैरियर में सर्वोच्च पद ,  व्यापारिक साम्राज्य का विस्तार  तथा राजकीय सम्मान प्राप्त होता है।", "bhavesh|सप्तमेश|11": "विवाह तथा व्यापारिक साझेदारों के माध्यम से  निरंतर प्रचुर लाभ , समृद्ध जीवनसाथी, उत्तम कन्या/पुत्र तथा मित्रों का पूर्ण सहयोग मिलता है।", "bhavesh|सप्तमेश|12": "विवाह पर अत्यधिक व्यर्थ खर्चा , जीवनसाथी से शारीरिक दूरी या वियोग, विदेश में बसने का योग अथवा वैवाहिक जीवन में असंतोष उत्पन्न होता है।", "bhavesh|अष्टमेश|1": "जातक का  शरीर दुबला (कृश) ,  अल्पायु संशय  या  निरंतर रोगग्रस्त  हो सकता है। जातक को  बदनामी ,  मानसिक चिंता (आधि) , आत्मबल में कमी तथा जीवन में पग-पग पर विघ्नों का सामना करना पड़ता है।", "bhavesh|अष्टमेश|2": "धन का भारी क्षय ,  दरिद्रता ,  कुटुंब में अशांति व विभाजन ,  कटु वाणी ,  दाहिने नेत्र में गंभीर रोग  तथा पैतृक संपत्ति में मुकदमों का सामना करना पड़ता है।", "bhavesh|अष्टमेश|3": "पराक्रम का नाश ,  छोटे भाई-बहनों को कष्ट या अकाल मृत्यु ,  दाहिने कान में विकार , मानसिक बेचैनी तथा जातक के उद्यम अंतिम क्षणों में विफल हो जाते हैं।", "bhavesh|अष्टमेश|4": "मातृ-नाश या माता को तीव्र कष्ट ,  गृह-भूमि-वाहन का क्षय/दुर्घटना ,  मानसिक शांति का पूर्ण अभाव  तथा रिश्तेदारों व मित्रों से भारी धोखा मिलता है।", "bhavesh|अष्टमेश|5": "संतान हीनता या संतान को गंभीर कष्ट ,  बुद्धि का भ्रमित/दूषित होना ,  परीक्षाओं में असफलता , स्मृति-भ्रंश तथा राजाज्ञा/सरकार से भारी दंड प्राप्त होता है।", "bhavesh|अष्टमेश|6": "यदि अष्टमेश अति-बलि हो तो विपरीत राजयोग से शत्रुओं का संहार हो सकता है; अन्यथा जातक  असाध्य दीर्घकालिक रोगों ,  अदालती मुकदमों ,  ऋण के जाल  तथा अस्त्र/चोरों से पीड़ित रहता है।", "bhavesh|अष्टमेश|8": "अपनी ही राशि में स्थित अष्टमेश जातक को  दीर्घायु (लंबी उम्र)  प्रदान करता है तथा गुप्त धन दिलाता है, किंतु जीवन में  गुप्त बाधाएँ ,  मानसिक अशांति  व शारीरिक कष्ट बने रहते हैं।", "bhavesh|अष्टमेश|9": "भाग्य का पूर्णतः दुर्भाग्य में बदलना ,  पिता का अकाल वियोग या पिता को कष्ट ,  धर्म से विमुखता , गुरुजनों का अनादर तथा पूर्वपुण्य का क्षय होता है।", "bhavesh|अष्टमेश|10": "कैरियर का पतन (पद-च्युति) ,  व्यापार में भारी आर्थिक घाटा , समाज में  अपमान/बदनामी , आचार में गिरावट तथा कर्मक्षेत्र में निरंतर असफलता मिलती है।", "bhavesh|अष्टमेश|11": "आय के स्रोतों का अचानक बंद होना ,  बड़े भाई को गंभीर कष्ट/नाश , मित्रों से धोखा तथा निरंतर  वित्तीय विपत्तियों  का सामना करना पड़ता है।", "bhavesh|अष्टमेश|12": "व्यर्थ का भारी वित्तीय खर्चा ,  अस्पतालों/रोगों पर व्यय ,  राजकीय दंड/बंधन (जेल गमन) , शारीरिक क्षीणता तथा गहरा मानसिक अवसाद उत्पन्न होता है।\n\nअष्टमेश के बाधात्मक, क्लेशकारी व नकारात्मक स्वरूप के निरूपण के पश्चात, आइए अब नवमेश—अर्थात भाग्य, धर्म, पूर्वपुण्य और पिता के परम शुभ स्वामी का अध्ययन करें।", "bhavesh|दशमेश|1": "जातक  स्वलब्ध-प्रतिष्ठ (स्वयं के पुरुषार्थ से चमकने वाला) ,  कर्मठ ,  उच्च पदधारी ,  यशस्वी  तथा समाज में पूज्य होता है। जातक का संपूर्ण जीवन उसके कर्मक्षेत्र के इर्द-गिर्द घूमता है।", "bhavesh|दशमेश|2": "जातक अपने  व्यापार, व्यवसाय या राजकीय सेवा से प्रचुर धन  अर्जित करता है। उसका  कुटुंब समृद्ध  होता है तथा वह धन का उपयोग शुभ कर्मों में करता है।", "bhavesh|दशमेश|3": "जातक  साहसिक उद्यमों , सेना, पुलिस, मीडिया, कला या  छोटे भाई-बहनों के सहयोग  से अपना कैरियर बनाता है। जातक का कर्म पराक्रम पर आधारित होता है।", "bhavesh|दशमेश|4": "जातक को  उत्तम भूमि ,  विशाल भवनों ,  सरकारी वाहनों  का सुख मिलता है तथा वह माता के आशीर्वाद व अचल संपत्ति के क्रय-विक्रय से  व्यापारिक ख्याति  पाता है।", "bhavesh|दशमेश|5": "जातक अपनी  बौद्धिक क्षमता ,  मंत्रित्व/सलाहकारिता , उच्च शिक्षा तथा  ज्ञान  के बल पर समाज में शीर्ष स्थान व राजकीय सम्मान प्राप्त करता है।", "bhavesh|दशमेश|6": "दशमेश का दुःस्थान गमन  कैरियर में शत्रु व प्रतिस्पर्धियों की बाधा ,  नौकरी में अधिकारियों से विवाद/मुकदमेबाज़ी ,  ऋण की समस्या  तथा आजीविका में बारंबार अस्थिरता लाता है।", "bhavesh|दशमेश|7": "व्यापारिक सफलता ,  विवाह के पश्चात आजीविका में अभूतपूर्व वृद्धि , उत्तम जन-संपर्क तथा विदेश व्यापार से भारी लाभ होता है।", "bhavesh|दशमेश|8": "कैरियर का अचानक पतन (पद-च्युति/हार) ,  व्यापार में भारी घाटा ,  बदनामी , तथा आचार (चरित्र) में गिरावट का भय रहता है।", "bhavesh|दशमेश|9": "जातक  परम भाग्यशाली कर्मों वाला ,  पिता के व्यापार/कैरियर को नई ऊँचाइयों पर ले जाने वाला , धर्मनिष्ठ तथा विश्व-विख्यात होता है।", "bhavesh|दशमेश|10": "स्वक्षेत्री दशमेश जातक को  सर्वोच्च सत्ता/पद (हुकूमत्) ,  अखंड यश-कीर्ति , बड़ा  व्यापारिक साम्राज्य  और  उत्कृष्ट सदाचार  प्रदान करता है।", "bhavesh|दशमेश|11": "व्यवसाय व नौकरी से अपार आर्थिक लाभ ,  उत्तम आय के बहुविध स्रोत , तथा व्यावसायिक योजनाओं की पूर्ण सफलता सुनिश्चित होती है।", "bhavesh|दशमेश|12": "आजीविका हेतु विदेश प्रवास , कैरियर में बारंबार परिवर्तन,  व्यापारिक व्यय व हानि  तथा जातक का कर्म जन्मस्थान से दूर ही फलीभूत होता है।", "bhavesh|एकादशेश|1": "जातक  जन्मजात धनी ,  निरोगी देह वाला ,  निरंतर लाभ कमाने वाला ,  सर्व-प्रिय  तथा समाज में अत्यधिक प्रशंसित (श्लाघ्य) होता है।", "bhavesh|एकादशेश|2": "धन संचय में प्रचुर वृद्धि ,  कुटुंब की आर्थिक समृद्धि ,  उत्तम भोजन व वाणी  तथा आय के कई स्थाई स्रोत बनते हैं।", "bhavesh|एकादशेश|3": "पराक्रम, कला व संगीत से लाभ ,  छोटे व बड़े भाई-बहनों का पूर्ण सहयोग ,  वाम कर्ण की आरोग्यता  तथा सुखद यात्राएँ होती हैं।", "bhavesh|एकादशेश|4": "भूमि, भवनों, कृषि, वाहनों तथा पशु-धन  से प्रचुर लाभ होता है तथा  माता व ससुराल पक्ष से धन प्राप्ति  होती है।", "bhavesh|एकादशेश|5": "विद्वत्ता ,  शेयर/निवेश ,  मंत्र-विद्या ,  कर (टैक्स) प्रबंधन  तथा  संतान की अभूतपूर्व सफलता से भारी धन लाभ  होता है।", "bhavesh|एकादशेश|6": "शत्रुओं पर विजय या मुकदमों से धन लाभ हो सकता है, परंतु जातक को  ऋण का लेन-देन ,  बाएँ कान में विकार  तथा  बड़े भाई से वैमनस्य  रहता है।", "bhavesh|एकादशेश|7": "विवाह व व्यापारिक साझेदारों से भारी लाभ , समृद्ध जीवनसाथी, उत्तम जन-संपर्क तथा अंतरराष्ट्रीय व्यापार में सफलता मिलती है।", "bhavesh|एकादशेश|8": "लाभ के स्रोतों का अचानक बंद होना ,  वित्तीय तबाही ,  अकाल रुकावटें , बाएँ कान में रोग तथा बदनामी का भय रहता है।", "bhavesh|एकादशेश|9": "भाग्योदय से अपार धन लाभ , धार्मिक संस्थानों से जुड़ाव, तीर्थयात्राओं से ख्याति तथा पिता व गुरुओं का सहयोग प्राप्त होता है।", "bhavesh|एकादशेश|10": "व्यापार व नौकरी में सर्वोच्च आर्थिक लाभ ,  राजकीय सम्मान व हुकूमत् , तथा व्यावसायिक ख्याति प्राप्त होती है।", "bhavesh|एकादशेश|11": "स्वक्षेत्री लाभेश जातक को  अपरिमित संपत्ति ,  सर्व-इच्छा पूर्ति (सिद्धि) ,  वैभव ,  उत्तम वाम कर्ण  तथा अखंड सफलता देता है।", "bhavesh|एकादशेश|12": "आय की तुलना में अत्यधिक व्यय (खर्चा) ,  धन की हानि , बड़े भाई-बहनों को कष्ट तथा विदेश संबंधों पर व्यय होता है।", "bhavesh|द्वादशेश|1": "जातक  शारीरिक रूप से कमजोर/कृश ,  असंतोषी ,  व्यर्थ अपव्यय करने वाला ,  पैर या बायीं आँख में विकार से पीड़ित  तथा जन्मभूमि छोड़ विदेश में रहने वाला होता है।", "bhavesh|द्वादशेश|2": "धन का भारी क्षय/दरिद्रता ,  कुटुंब से दूरी व कलह ,  वाणी में कठोरता/दोष  तथा विद्या अर्जन में भारी विघ्न आता है।", "bhavesh|द्वादशेश|3": "साहस का ह्रास ,  छोटे भाई-बहनों से मतभेद या वियोग , व्यर्थ की निष्फल यात्राओं में धन नष्ट होना तथा  दाहिने कान में कष्ट  होता है।", "bhavesh|द्वादशेश|4": "गृह व वाहन के सुख का अभाव ,  माता को शारीरिक कष्ट ,  मानसिक अशांति  तथा जातक को अपने घर/देश का त्याग करना पड़ता है।", "bhavesh|द्वादशेश|5": "बुद्धि व विवेक का व्यर्थ क्षय ,  संतानहीनता या संतान को कष्ट , परीक्षाओं में असफलता तथा मतिभ्रम की स्थिति बनती है।", "bhavesh|द्वादशेश|6": "रोगों के इलाज व अस्पतालों पर अत्यधिक खर्चा ,  गुप्त शत्रुओं से भय ,  अदालती मुकदमों में धन हानि  तथा मामा पक्ष से विवाद होता है।", "bhavesh|द्वादशेश|7": "विवाह पर भारी अपव्यय ,  जीवनसाथी का अस्वस्थ रहना या वियोग , वैवाहिक सुख का अभाव तथा व्यापारिक साझेदारों से घाटा होता है।", "bhavesh|द्वादशेश|8": "दो दुःस्थानों का संबंध (विपरीत राजयोग) बन सकता है, परंतु सामान्यतः यह  गंभीर मानसिक चिंता ,  अपमान ,  बायीं आँख या पैर में चोट  व शारीरिक कष्ट देता है।", "bhavesh|द्वादशेश|9": "भाग्य की कमी ,  पिता को कष्ट/विरह ,  धार्मिक यात्राओं पर अत्यधिक व्यय  तथा गुरुजनों से दूरी रहती है।", "bhavesh|द्वादशेश|10": "कैरियर में रुकावटें व पद-हानि , व्यापार में घाटा, दुराचार में प्रवृत्त होना तथा आजीविका हेतु विदेश प्रवास का योग बनता है।", "bhavesh|द्वादशेश|11": "आय की जगह भारी खर्चा , आय के स्रोतों का नष्ट होना,  बड़े भाई-बहनों से संबंध खराब  होना तथा बाएँ कान में विकार आ सकता है।", "bhavesh|द्वादशेश|12": "अपनी राशि में द्वादशेश का होना जातक को  उत्तम शयन सुख ,  सत्कार्यों व दान में व्यय ,  उत्कृष्ट वाम नयन व अङ्घ्रि (पैर) स्वास्थ्य  तथा  विदेश में बड़ी सफलता व मोक्ष मार्ग  प्रदान करता है।", "bhavesh|नवमेश|1": "प्रथम भाव (लग्न) में विराजमान होना जातक को परम  भाग्यशाली ,  धार्मिक ,  विद्वान ,  लोकप्रिय  तथा  पिता का अत्यंत प्रिय  बनाता है। जातक पूर्वजन्म के शुभ कर्मों (पुण्य) के प्रभाव से अल्प प्रयास में भी जीवन के सर्वोच्च शिखर पर पहुँचता है तथा उसका संपूर्ण व्यक्तित्व दीप्तिमान रहता है।", "bhavesh|नवमेश|2": "जब नवमेश द्वितीय भाव में स्थित होता है, तो जातक  अथाह धन-संपत्ति ,  उत्तम शास्त्र विद्या , मधुर वाणी तथा धर्म-कर्म व धार्मिक संस्थानों के माध्यम से विशाल धन संचय करता है। जातक का कुटुंब अत्यंत समृद्ध व धर्मनिष्ठ होता है।", "bhavesh|नवमेश|3": "तृतीय भाव में नवमेश की स्थिति यह निरूपित करती है कि जातक का  भाग्योदय उसके स्वयं के पराक्रम व पुरुषार्थ पर निर्भर  करेगा। जातक के  भाई-बहन भाग्यशाली  होते हैं तथा उसे कला, लेखन व सुखद यात्राओं के माध्यम से प्रचुर ख्याति प्राप्त होती है।", "bhavesh|नवमेश|4": "नवमेश का चतुर्थ भाव में बैठना जातक को  अखंड मातृ-सुख ,  विशाल भवन ,  कीमती सवारियाँ (वाहन) , अचल कृषि भूमि तथा  अक्षय मानसिक शांति  प्रदान करता है। जातक अपने निवास स्थान पर धार्मिक स्थलों व जलाशयों का निर्माण कराता है।", "bhavesh|नवमेश|5": "पंचम भाव (द्वि-त्रिकोण योग) में नवमेश की स्थिति जातक को  परम बुद्धिमान ,  शास्त्रज्ञ व श्रुति-स्मृति मर्मज्ञ ,  मंत्र-सिद्ध ,  उत्तम संतान से युक्त  तथा शासकों व मंत्रियों का मुख्य सलाहकार बनाती है। संतान के जन्म से भाग्य में चमत्कारिक वृद्धि होती है।", "bhavesh|नवमेश|6": "वहीं यदि नवमेश षष्ठ भाव (दुःस्थान/लीन स्थान) में गमन कर जाए, तो जातक के  भाग्योदय में निरंतर शत्रु बाधाएँ  आती हैं,  पिता से गंभीर मतभेद या पिता का स्वास्थ्य खराब  रहता है तथा धार्मिक कार्यों व मुकदमों में धन का क्षय होता है।", "bhavesh|नवमेश|7": "सप्तम भाव में नवमेश का होना  विवाह के तुरंत बाद तीव्र भाग्योदय  का सूचक है। जातक को  सुंदर, धर्मनिष्ठ व चरित्रवान जीवनसाथी  प्राप्त होता है तथा विदेश व्यापार व यात्राओं से अपार सफलता मिलती है।", "bhavesh|नवमेश|8": "इसके विपरीत, नवमेश का अष्टम भाव (रंध्र) में गमन  भाग्य का दुर्भाग्य में परिवर्तन ,  पिता की अकाल मृत्यु या विरह ,  पुण्य का क्षय , तथा जीवन में पग-पग पर विघ्नों का कारण बनता है; जातक नास्तिक विचारों का शिकार हो सकता है।", "bhavesh|नवमेश|9": "नवमेश का स्वक्षेत्री होकर नवम भाव में स्थित होना जातक को  परम भाग्यशाली ,  तपस्वी ,  तीर्थयात्री ,  परोपकारी ,  आचार्य  तथा अपरिमित ऐश्वर्यवान बनाता है।", "bhavesh|नवमेश|10": "दशम भाव में नवमेश की उपस्थिति  'धर्म-कर्म आधिपत्य राजयोग'  का निर्माण करती है; जातक  सर्वोच्च राजकीय पद ,  प्रसिद्ध आजीविका ,  अखंड यश-कीर्ति  तथा सर्वत्र पूज्य स्थान प्राप्त करता है।", "bhavesh|नवमेश|11": "एकादश भाव में नवमेश का स्थित होना  सतत एवं प्रचुर आर्थिक लाभ ,  इच्छा पूर्ति ,  वैभव  तथा समाज के शीर्ष वर्गों से सम्मान सुनिश्चित करता है।", "bhavesh|नवमेश|12": "अंततः, द्वादश भाव में नवमेश का होना जातक के धन को  धार्मिक व परमार्थिक कार्यों में व्यय  कराता है; जातक का  भाग्योदय विदेश प्रवास या जन्मस्थान से दूर  होता है, परंतु स्वदेश में भाग्य का सहयोग सीमित रहता है।", "bhavesh|अष्टमेश|7": "सप्तम भाव में अष्टमेश की स्थिति वैवाहिक गतिशीलता (conjugal dynamics) में व्यापक हलचल उत्पन्न करती है। 'फलदीपिका' के दशम अध्याय ('कलत्रभाव') तथा षोडश अध्याय ('द्वादश भावफल') के सिद्धांतों के अनुसार, जब अष्टम भाव का स्वामी सप्तम (जाया भाव) में विराजमान होता है, तो यह दांपत्य सुख में अस्थिरता और जीवनसाथी के कायिक व मानसिक स्वास्थ्य में गंभीर बाधाओं का कारण बनता है। अष्टम का 'आधि' और 'क्लेश' प्रभाव सप्तम के 'काम' और 'मद' तत्वों को दूषित कर परस्पर अविश्वास का वातावरण निर्मित करता है।\n\n'भावात् भावम्' द्वारा मारक प्रभाव:  अष्टमेश जीवनसाथी के लिए मारकेश बनकर उसके ही भाव (सप्तम) में स्थित होता है। यदि यह ग्रह पापक्रांत या निर्बल हो, तो जीवनसाथी को असाध्य शारीरिक व्याधियाँ या अल्पायु का संकट झेलना पड़ता है।\n\nआधि व शारीरिक कष्ट:  अष्टम भाव का 'आधि' (गंभीर मानसिक चिंता व अवसाद) कारकतत्व सप्तम भाव में आरोपित होकर जीवनसाथी को निरंतर मानसिक या स्नायुविक रोगों से पीड़ित रखता है।\n\nमांगल्य-हानि एवं अशुचि:  अष्टमेश का सप्तम में होना दांपत्य के 'मांगल्य' को क्षीण करता है। संबंधों में 'अशुचि' (अपवित्रता) अथवा छिद्र (रहस्य/विश्वासघात) आने से वैवाहिक जीवन में बदनामी और अपमान का भय बना रहता है।\n\n'फलदीपिका' के प्रथम अध्याय के श्लोक १३ के अनुसार, सप्तम भाव केवल विवाह तक सीमित न होकर दैनिक व्यवसाय, 'लोक' (जनता व सार्वजनिक प्रतिष्ठा) तथा 'मार्ग' (यात्रा व गंतव्य) का भी मुख्य विचारणीय स्थान है। अतः अष्टमेश का इस भाव में आगमन व्यावसायिक जोखिमों और सामाजिक प्रतिष्ठा में अप्रत्याशित उतार-चढ़ाव का प्रमुख कारण बनता है।\n\nव्यापारिक दृष्टिकोण से सप्तम भाव साझेदारों (partners) एवं व्यावसायिक अनुबंधों का स्थान है। अष्टम भाव 'रन्ध्र' (कमजोरी/छिद्र), 'विघ्न' तथा 'अशुचि' (अपारदर्शकता) का कारक है। जब अष्टमेश सप्तम भाव में बैठता है, तो व्यापारिक साझेदारियों में पारदर्शिता का अभाव हो जाता है। साझेदार गुप्त एजेंडे पर कार्य कर सकते हैं या वित्तीय हेराफेरी (financial fraud) के माध्यम से व्यापार को अचानक भारी घाटे में ढकेल सकते हैं। यदि अष्टमेश पापग्रहों से दृष्ट हो, तो संयुक्त उद्यमों (joint ventures) में आकस्मिक दिवालियापन या कानूनी विवाद खड़े हो जाते हैं।\n\nइसके विपरीत, यदि अष्टमेश स्वगृही या शुभ प्रभाव में बली होकर सप्तम में स्थित हो, तो जातक को जोखिम भरे व्यापार, शेयर बाजार, बीमा दावों, कर-नियोजन (taxation) या गुप्त सौदों के माध्यम से अप्रत्याशित वित्तीय लाभ और अकस्मात व्यापारिक सफलता प्राप्त होती है।\n\n'लोक' (सार्वजनिक प्रतिष्ठा पर आघात):  सप्तम भाव से 'लोक' अर्थात् जनसामान्य में जातक की छवि का विचार किया जाता है। अष्टम भाव के कारकतत्व—'अपमान', 'पराजय' तथा 'अपवाद' (बदनामी)—जब लोक-भाव (सप्तम) में प्रविष्ट होते हैं, तो जातक की सामाजिक प्रतिष्ठा दांव पर लग जाती है। व्यावसायिक प्रतिद्वंद्वियों द्वारा रचे गए षड्यंत्रों, झूठे आरोपों या सार्वजनिक घोटालों के कारण समाज में छवि धूमिल होने का गंभीर जोखिम रहता है।", "rashi|सूर्य|मेष": "मेष सूर्य की उच्च राशि है (१०° पर परमोच्च)। यहाँ सूर्य के स्थित होने से जातक अत्यंत पराक्रमी, साहसी, प्रसिद्ध, राजमान्य, सेनापति या उच्च प्रशासनिक पद प्राप्त करने वाला, शारीरिक रूप से बलवान, पित्त-प्रकृति, दृढ़ निश्चयी तथा शत्रुओं का दमन करने वाला होता है।", "rashi|सूर्य|वृषभ": "शुक्र की स्थिर राशि में सूर्य के होने से जातक चतुर, व्यापारिक बुद्धि वाला, वस्त्र एवं आभूषणों का प्रेमी, शत्रुओं को बुद्धिबल से परास्त करने वाला, संगीत व कलाप्रेमी तथा जल-स्थानों के निकट लाभ पाने वाला होता है।", "rashi|सूर्य|मिथुन": "बुध की मित्र राशि में सूर्य जातक को अत्यंत विद्वान, ज्योतिषी या महान गणितज्ञ, मधुरभाषी, मिष्टान्न प्रेमी, धनवान तथा सामाजिक रूप से लोकप्रिय एवं बहु-श्रुत बनाता है।", "rashi|सूर्य|कर्क": "चंद्रमा की मित्र जलराशि में स्थित सूर्य जातक को गंभारात्मा, राजकार्य में संलग्न, प्रवासप्रिय, विद्वान, कुछ चंचल स्वभाव, मातृ-भक्त तथा सिर या पेट के रोगों से सजग रहने वाला बनाता है।", "rashi|सूर्य|सिंह": "स्वराशि एवं मूलत्रिकोण में सूर्य के होने से जातक अत्यंत प्रतापी, निडर, स्वाभिमानी, राजा या राजा के समान अधिकार संपन्न, भगवान शिव का अनन्य भक्त, विशाल हृदय तथा अखंड वर्चस्व वाला होता है।", "rashi|सूर्य|कन्या": "बुध की राशि में सूर्य जातक को लेखन, गणना, शास्त्र-ज्ञान, हस्तकला में निपुण, नम्र, विद्वानों द्वारा सम्मानित, व्यावहारिक बुद्धि से युक्त तथा कोमल शरीर वाला बनाता है।", "rashi|सूर्य|तुला": "तुला सूर्य की नीच राशि है (१०° पर परम नीच)। शुक्र की वायु राशि में सूर्य का तेज कुंठित होता है, जिससे आत्मबल में कमी, राजकोप या सरकारी कार्यों में बाधा, अस्थि (हड्डी) संबंधी कष्ट, पिता के सुख में कमी, व्यर्थ की यात्राएँ तथा मान-सम्मान में उतार-चढ़ाव देखने को मिलता है।", "rashi|सूर्य|वृश्चिक": "मंगल की उग्र राशि में सूर्य जातक को अत्यंत साहसी, गुह्य विद्याओं का प्रेमी, उग्र स्वभाव, शल्य-चिकित्सक या सेना/पुलिस अधिकारी बनने की योग्यता, अग्नि या शस्त्र से भय तथा शत्रुओं के लिए भयभीत करने वाला बनाता है।", "rashi|सूर्य|धनु": "गुरु की मित्र राशि में सूर्य जातक को धार्मिक, देव-ब्राह्मण भक्त, धनवान, राजा या सरकार द्वारा सम्मानित, उच्च शिक्षा प्राप्त, यशस्वी तथा सत्कार्यों में व्यय करने वाला बनाता है।", "rashi|सूर्य|मकर": "शनि की शत्रु राशि में सूर्य के होने से जातक को कठोर परिश्रमी, कुछ शक्की या चिंताग्रस्त, भाग्य निर्माण के लिए संघर्षरत, परदेस में रहने वाला तथा व्यावहारिक बुद्धि वाला बनाता है।", "rashi|सूर्य|कुंभ": "शनि की राशि में सूर्य जातक को नीच संगति से बचने की चेतावनी देता है; ऐसा व्यक्ति संघर्षों के बाद सफलता पाता है, स्थिर विचारों वाला, हृदय रोग या वात संबंधी कष्टों से सजग रहने वाला तथा समाज के निचले वर्ग से कार्य निकालने में कुशल होता है।", "rashi|सूर्य|मीन": "गुरु की जलराशि में सूर्य जातक को शांतिप्रिय, विद्वान, जल-यात्राओं या समुद्री व्यापार से लाभ पाने वाला, बंधु-बांधवों का प्रिय, धार्मिक तथा सर्वप्रिय बनाता है।", "rashi|चंद्र|मेष": "मानसिक व शारीरिक देह:  लाल नेत्रों वाला, चंचल, यात्राप्रिय, स्त्रियों का प्रिय, साहसी, अपने कुल में धनवान तथा सिर पर चोट या लांछन वाला।\n\nसंपत्ति व स्थिति:  भाइयों से युक्त, भूमि व धन का सुख पाने वाला, परंतु जल से भय रखने वाला।", "rashi|चंद्र|वृषभ": "मानसिक व शारीरिक देह:  वृष चंद्रमा की उच्च राशि है (३° पर परमोच्च)। जातक अत्यंत सुंदर, कांतिमान, दानी, भोगी, सौम्य स्वभाव वाला।\n\nसंपत्ति व स्थिति:  कन्या-संतति की अधिकता, स्थिर धन व भूमिपति, जनप्रिय, भोजन व सुगंधित वस्त्रों का शौकीन।", "rashi|चंद्र|मिथुन": "मानसिक व शारीरिक देह:  कामदेव के समान सुंदर देह, चतुर, हास्य-प्रिय, संगीत व कला का अनुरागी।\n\nसंपत्ति व स्थिति:  शास्त्रज्ञ, कवि या लेखक, मधुरभाषी, स्त्रियों में अत्यंत प्रिय तथा बहु-माध्यमों से धन अर्जित करने वाला।", "rashi|चंद्र|कर्क": "मानसिक व शारीरिक देह:  स्वगृही चंद्रमा से जातक विद्वान, गंभारात्मा, मातृ-भक्त, धर्मात्मा तथा सुंदर देह वाला।\n\nसंपत्ति व स्थिति:  जलचर या जल-संबंधी व्यापार से धनी, ज्योतिषी, गृह-वाहन से युक्त तथा उच्च सामाजिक प्रतिष्ठा वाला।", "rashi|चंद्र|सिंह": "मानसिक व शारीरिक देह:  विशाल हड्डी वाला, गंभीर, निर्भय, कम संतति वाला, स्वाभिमानी तथा उग्र मानसिक क्षमता वाला।\n\nसंपत्ति व स्थिति:  राजा या उच्च अधिकारी का प्रिय, मातृ-भक्त, वनों व पहाड़ों की सैर का शौकीन तथा स्थिर धनवान।", "rashi|चंद्र|कन्या": "मानसिक व शारीरिक देह:  लज्जालु, सुंदर नेत्रों वाला, सत्यवादी, नम्र, परोपकारी तथा कांतिमान।\n\nसंपत्ति व स्थिति:  विद्वान, शिल्प व कला में कुशल, कन्या संतानों से युक्त, पर-भूमि से लाभ पाने वाला तथा धनी।", "rashi|चंद्र|तुला": "मानसिक व शारीरिक देह:  सुंदर देह वाला, न्यायप्रिय, घूमने-फिरने का शौकीन, साधु-संतों का पूजक।\n\nसंपत्ति व स्थिति:  व्यापार में अत्यंत कुशल, विद्वान, स्त्रियों में लोकप्रिय तथा समाज में उच्च आदर पाने वाला।", "rashi|चंद्र|वृश्चिक": "मानसिक व शारीरिक देह:  वृश्चिक चंद्रमा की नीच राशि है (३° पर परम नीच)। जातक मानसिक रूप से चिंताग्रस्त, क्रोधी, दुःखी, गुप्त रोगों से पीड़ित।\n\nसंपत्ति व स्थिति:  मातृ-सुख में कमी, नीच जनों की संगत से हानि, संघर्षमय जीवन तथा धन का अपव्यय।", "rashi|चंद्र|धनु": "मानसिक व शारीरिक देह:  सत्यवादी, बलवान, विशाल गात्र वाला, स्वाभिमानी तथा धर्म-निष्ठ।\n\nसंपत्ति व स्थिति:  धन-धान्य से पूर्ण, कवि या कुशल वक्ता, शिल्पज्ञ, राजा या सरकार से सम्मान पाने वाला।", "rashi|चंद्र|मकर": "मानसिक व शारीरिक देह:  संगीतानुरागी, विशाल नेत्रों वाला, निर्धनता या संघर्ष से उबरने वाला, धार्मिक।\n\nसंपत्ति व स्थिति:  विदेश यात्रा करने वाला, पर-स्त्री प्रेमी, कला-कुशल तथा जीवन के उत्तरार्ध में धनवान।", "rashi|चंद्र|कुंभ": "मानसिक व शारीरिक देह:  सुंदर नासिका व गर्दन वाला, आलसी, गुरुजनों का भक्त, कभी-कभी दुःखी या अवसादग्रस्त मन वाला।\n\nसंपत्ति व स्थिति:  दानी, व्यापार में रुचि रखने वाला, पर-धन से लाभ पाने वाला तथा संतति-युक्त।", "rashi|चंद्र|मीन": "मानसिक व शारीरिक देह:  चतुर, शांतिप्रिय, विद्वान, शत्रुजयी, धार्मिक तथा गुणवान।\n\nसंपत्ति व स्थिति:  जल-संबंधी वस्तुओं का व्यापारी, शास्त्रज्ञ, सुंदर स्त्री का पति, गड़ा हुआ धन (निधि) पाने की संभावना वाला।", "rashi|मंगल|मेष": "मेष में मंगल का विश्लेषणात्मक फल:  स्वराशि एवं मूलत्रिकोण (०°-१२°) में मंगल के स्थित होने से जातक अत्यंत शूरवीर, सेना या पुलिस बल में उच्च पद प्राप्त करने वाला तथा भूमिपति बनता है।  स्वास्थ्य प्रभाव:  देह में पित्त की अधिकता एवं मस्तक पर चोट के निशान संभव हैं।  आक्रामकता व साहस:  निर्भयता एवं अत्यधिक उग्रता रहती है।  नेतृत्व क्षमता:  महान सेनापति या संगठनकर्ता के गुण होते हैं।  विवाद व शत्रु जोखिम:  शत्रुओं का पूर्ण दमन करता है, परंतु अपने ही लोगों से विवाद की संभावना रहती है।", "rashi|मंगल|वृषभ": "वृषभ में मंगल का विश्लेषणात्मक फल:  शुक्र की राशि में मंगल जातक को कामुक एवं साहसी व्यापारी बनाता है।  स्वास्थ्य प्रभाव:  जननेंद्रिय या गले के विकार हो सकते हैं।  आक्रामकता व साहस:  अपनी बात मनवाने के लिए हठी व उग्र भाषण देने वाला होता है।  नेतृत्व क्षमता:  व्यापारिक एवं वित्तीय मामलों में साहसी निर्णय लेता है।  विवाद व शत्रु जोखिम:  पर-स्त्री संग अथवा धन के लेन-देन को लेकर विवाद व सामाजिक बदनामी का जोखिम रहता है।", "rashi|मंगल|मिथुन": "मिथुन में मंगल का विश्लेषणात्मक फल:  बुध की शत्रु राशि में मंगल बौद्धिक एवं तार्किक क्षमता प्रदान करता है।  स्वास्थ्य प्रभाव:  त्वचा रोग, स्नायु रोग या सांस संबंधी कष्ट हो सकते हैं।  आक्रामकता व साहस:  वाणी में तीखापन एवं मानसिक रूप से उग्रता रहती है।  नेतृत्व क्षमता:  वाद-विवाद, पत्रकारिता या शिल्प कला में नेतृत्व करता है।  विवाद व शत्रु जोखिम:  छद्म शत्रुओं से धोखा तथा भाइयों से वैमनस्य का जोखिम रहता है।", "rashi|मंगल|कर्क": "कर्क में मंगल का विश्लेषणात्मक फल:  कर्क मंगल की नीच राशि है (२८° पर परम नीच)।  स्वास्थ्य प्रभाव:  रक्त विकार, पेट के रोग, यकृत (Liver) की समस्या या दुर्बलता रहती है।  आक्रामकता व साहस:  मानसिक रूप से कुंठित उग्रता, क्रोधी व दुःखी स्वभाव रहता है।  नेतृत्व क्षमता:  निर्णय लेने में अस्थिरता के कारण नेतृत्व क्षीण होता है।  विवाद व शत्रु जोखिम:  मातृ-सुख में कमी, भूमि-भवन के मुकदमों में पराजय तथा कुल के लोगों से तीव्र विवाद रहता है।", "rashi|मंगल|सिंह": "सिंह में मंगल का विश्लेषणात्मक फल:  मित्र सूर्य की राशि में मंगल जातक को अत्यंत प्रतापी एवं राजमान्य बनाता है।  स्वास्थ्य प्रभाव:  आरोग्यता उत्तम रहती है, परंतु उष्णता से पित्त विकार संभव है।  आक्रामकता व साहस:  नियंत्रित, मर्यादित एवं धर्मयुक्त पराक्रम होता है।  नेतृत्व क्षमता:  राजा का प्रिय, विशाल सेना या प्रशासनिक तंत्र का नायक बनने की क्षमता।  विवाद व शत्रु जोखिम:  शत्रुओं पर पूर्ण विजय प्राप्त होती है, विवादों में न्यायपूर्ण रुख रहता है।", "rashi|मंगल|कन्या": "कन्या में मंगल का विश्लेषणात्मक फल:  बुध की राशि में मंगल जातक को व्यावहारिक एवं शिल्पी बनाता है।  स्वास्थ्य प्रभाव:  पाचन तंत्र में गड़बड़ी या आंतों के रोग संभव हैं।  आक्रामकता व साहस:  कूटनीतिक एवं गुप्त रूप से आक्रामक रणनीति अपनाता है।  नेतृत्व क्षमता:  गणना, लेखन व व्यापारिक प्रबंधन में कुशल।  विवाद व शत्रु जोखिम:  गुप्त शत्रुओं तथा सहायकों से विवाद या विश्वासघात का जोखिम बना रहता है।", "rashi|मंगल|तुला": "तुला में मंगल का विश्लेषणात्मक फल:  शुक्र की राशि में मंगल जातक को विदेशप्रिय तथा आभूषण प्रेमी बनाता है।  स्वास्थ्य प्रभाव:  मूत्र विकार या रक्तचाप (Blood pressure) की समस्या हो सकती है।  आक्रामकता व साहस:  कामुकता व भौतिक लालसाओं के प्रति तीव्र उग्रता।  नेतृत्व क्षमता:  साझेदारियों व अंतरराष्ट्रीय व्यापार में साहसी कदम।  विवाद व शत्रु जोखिम:  वैवाहिक जीवन में उग्रता, पत्नी से तनाव तथा साझेदारी में विवाद का जोखिम।", "rashi|मंगल|वृश्चिक": "वृश्चिक में मंगल का विश्लेषणात्मक फल:  स्वराशि का मंगल जातक को गुह्य विद्याओं का ज्ञाता एवं अपराजित बनाता है।  स्वास्थ्य प्रभाव:  जननेंद्रिय विकार या शल्य-चिकित्सा (Surgery) की संभावना।  आक्रामकता व साहस:  अत्यधिक निडर, बदला लेने की भावना एवं प्रचंड साहस।  नेतृत्व क्षमता:  सेना, शोध कार्य तथा जोखिम भरे कार्यों में सर्वोच्च नेतृत्व।  विवाद व शत्रु जोखिम:  गुप्त शत्रुओं का संहार करता है, परंतु स्वयं के क्रोध से विवाद उपजाता है।", "rashi|मंगल|धनु": "धनु में मंगल का विश्लेषणात्मक फल:  गुरु की राशि में मंगल जातक को धर्म-रक्षक तथा प्रसिद्ध बनाता है।  स्वास्थ्य प्रभाव:  जांघों या यकृत में कष्ट संभव है, शेष स्वास्थ्य उत्तम रहता है।  आक्रामकता व साहस:  सिद्धांतों और धर्म की रक्षा के लिए उग्र पराक्रम।  नेतृत्व क्षमता:  खेलकूद, सेना या धार्मिक संगठनों में उच्च पद।  विवाद व शत्रु जोखिम:  शत्रुओं को परास्त करता है, विवादों से दूर रहने का प्रयास करता है।", "rashi|मंगल|मकर": "मकर में मंगल का विश्लेषणात्मक फल:  मकर मंगल की उच्च राशि है (२८° पर परमोच्च)। चर मकर राशि में शनि के भूमि-तत्व के साथ मंगल का पराक्रम मिलकर अखंड साम्राज्य देता है।  स्वास्थ्य प्रभाव:  अत्यंत पुष्ट देह व उच्च आरोग्यता।  आक्रामकता व साहस:  अनुशासित, अदम्य एवं महान पराक्रम।  नेतृत्व क्षमता:  महान सेनापति, उच्च प्रशासनिक प्रमुख अथवा विशाल उद्योगपति।  विवाद व शत्रु जोखिम:  शत्रुओं का सर्वनाश होता है, विवादों में निर्णीत सफलता मिलती है।", "rashi|मंगल|कुंभ": "कुंभ में मंगल का विश्लेषणात्मक फल:  शनि की राशि में मंगल जातक को संघर्षमय एवं कठोर जीवन प्रदान करता है।  स्वास्थ्य प्रभाव:  पैरों में चोट, वात-रक्त विकार या हृदय में बेचैनी।  आक्रामकता व साहस:  अव्यवस्थित व कभी-कभी गलत दिशा में पराक्रम।  नेतृत्व क्षमता:  निचले वर्ग के श्रमिकों का नेतृत्व करने की क्षमता।  विवाद व शत्रु जोखिम:  निर्धनता का संघर्ष, असत्य बोलने से विवाद तथा पुलिस/कोर्ट के विवाद का जोखिम।", "rashi|मंगल|मीन": "मीन में मंगल का विश्लेषणात्मक फल:  गुरु की जलराशि में मंगल जातक को विदेश में सफलता एवं सम्मान देता है।  स्वास्थ्य प्रभाव:  पैरों में सूजन या जल से होने वाले विकार।  आक्रामकता व साहस:  शालीन एवं नियंत्रित पराक्रम।  नेतृत्व क्षमता:  धार्मिक व परोपकारी संस्थाओं में नेतृत्व।  विवाद व शत्रु जोखिम:  शत्रुओं पर शांतिपूर्ण विजय, बंधु-बांधवों से आदर प्राप्त होना।\n\nमंगल की अग्नितत्वीय ऊर्जा के पश्चात्, अब हम बुद्धि, वाणी और व्यापार के कारक बुध के राशि फल का निरूपण करेंगे।", "rashi|बुध|मेष": "सम्प्रेषण व वाणी:  उग्र, तर्कहीन व कभी-कभी असत्य या कटु वाणी बोलने की प्रवृत्ति।\n\nव्यापार व धन:  ऋणग्रस्तता की संभावना, व्यापार में उतावलेपन से हानि, चालाकी से कार्य निकालने का प्रयास।\n\nमानसिक क्षमता:  चपल बुद्धि, त्वरित निर्णय लेने वाला, परंतु एकाग्रता की कमी।", "rashi|बुध|वृषभ": "सम्प्रेषण व वाणी:  मिष्टभाषी, सुसंस्कृत वाणी, गुरुजनों व वयोवृद्धों का आदर करने वाला।\n\nव्यापार व धन:  वस्त्र, सुगंधित द्रव्य व कलात्मक वस्तुओं के व्यापार से महाधनी, स्थिर संपत्तिवान।\n\nमानसिक क्षमता:  व्यावहारिक बुद्धि, कलात्मक एवं सौंदर्यपरक सोच।", "rashi|बुध|मिथुन": "सम्प्रेषण व वाणी:  अत्यंत पटु वाणी, चतुर वक्ता, हास्य-विनोद में कुशल, मधुरभाषी।\n\nव्यापार व धन:  स्वराशि के प्रभाव से बहु-व्यापार में सफलता, लेखन, प्रकाशन व वाणिज्य से अपार धन।\n\nमानसिक क्षमता:  बहु-विद्या विशारद, शास्त्रज्ञ, कवि, अत्यंत तीव्र एवं सूक्ष्म ग्रहण शक्ति।", "rashi|बुध|कर्क": "सम्प्रेषण व वाणी:  भावुक वाणी, परिस्थितियों के अनुसार बदलने वाला सम्प्रेषण।\n\nव्यापार व धन:  जल-संबंधी व्यापार, संगीत या ललित कलाओं से धन लाभ, पर-देश से कमाई।\n\nमानसिक क्षमता:  चंचल चित्त, कल्पनाशील बुद्धि, परंतु निर्णय में शंकालु।", "rashi|बुध|सिंह": "सम्प्रेषण व वाणी:  प्रभावशाली, ओजस्वी व तर्कसंगत सम्प्रेषण, राजा के समान निर्भय वाणी।\n\nव्यापार व धन:  सरकारी राजसेवा, सलाहकारी या उच्च पदों से धनार्जन, स्थिर संपत्ति।\n\nमानसिक क्षमता:  स्थिर बुद्धि, आत्मविश्वासी, प्रशासनिक समझ से परिपूर्ण।", "rashi|बुध|कन्या": "सम्प्रेषण व वाणी:  कन्या बुध की उच्च, स्वराशि व मूलत्रिकोण राशि है (१५° पर परमोच्च, १६°-२०° मूलत्रिकोण)। जातक की वाणी अत्यंत वैज्ञानिक, सत्य व प्रभावशाली होती है।\n\nव्यापार व धन:  वाणिज्य, लेखांकन (Accounting), शोध व व्यापार में शीर्ष सफलता, अपार समृद्ध जीवन।\n\nमानसिक क्षमता:  महान गणितज्ञ, सर्वविद्या विशारद, अत्यंत तीक्ष्ण व विश्लेषणात्मक बुद्धि।", "rashi|बुध|तुला": "सम्प्रेषण व वाणी:  संतुलनकारी, मधुर व आदरणीय सम्प्रेषण, सम्मोहन कला में निपुण।\n\nव्यापार व धन:  व्यापार में भारी सफलता, आभूषण, क्रय-विक्रय व कला-कौशल से धन लाभ।\n\nमानसिक क्षमता:  निष्पक्ष न्यायप्रिय बुद्धि, व्यावहारिक राजनीतिज्ञ।", "rashi|बुध|वृश्चिक": "सम्प्रेषण व वाणी:  तीखी, गुप्त व कूटनीतिक वाणी, दूसरों के दोष निकालने वाली प्रवृत्ति।\n\nव्यापार व धन:  दूसरों के धन पर दृष्टि, ऋण या गुप्त माध्यमों से धन कमाने का प्रयास।\n\nमानसिक क्षमता:  गूढ़ विद्याओं व तंत्र-मंत्र का ज्ञाता, शक्की परंतु खोजी बुद्धि।", "rashi|बुध|धनु": "सम्प्रेषण व वाणी:  धर्मनिष्ठ, नीतियुक्त व ओजस्वी सम्प्रेषण, सर्वजन आदरणीय।\n\nव्यापार व धन:  राजा या मंत्रियों द्वारा सम्मानित, शिक्षा, न्याय व परामर्श से अपार धन लाभ।\n\nमानसिक क्षमता:  दार्शनिक, उच्च शास्त्रज्ञ, दूरदर्शी एवं नैतिक बुद्धि।", "rashi|बुध|मकर": "सम्प्रेषण व वाणी:  गंभीर, कम बोलने वाला, व्यावहारिक व कभी-कभी संकोची सम्प्रेषण।\n\nव्यापार व धन:  कठिन परिश्रम से व्यापार वृद्धि, दूसरों के अधीन कार्य करके या शिल्प कला से आजीविका।\n\nमानसिक क्षमता:  कूटनीतिक, यथार्थवादी एवं चालाक बुद्धि।", "rashi|बुध|कुंभ": "सम्प्रेषण व वाणी:  तटस्थ, स्पष्टवादी व दार्शनिक सम्प्रेषण।\n\nव्यापार व धन:  स्थिर आजीविका, तकनीकी या शोध कार्यों से धन लाभ, वित्तीय उतार-चढ़ाव।\n\nमानसिक क्षमता:  स्थिर विचारों वाला, विद्वान, परंतु कभी-कभी अवसाद या मानसिक दुःखी मन।", "rashi|बुध|मीन": "सम्प्रेषण व वाणी:  मीन बुध की नीच राशि है (१५° पर परम नीच)। वाणी दोष, तुतलाहट या गलत सम्प्रेषण से नुकसान।\n\nव्यापार व धन:  व्यापार में हानि, ऋण, विद्या में बाधा, नीच जनों की संगति से धन का नाश।\n\nमानसिक क्षमता:  बुद्धिभ्रम, निर्णय लेने में अक्षम, अत्यधिक दिवास्वप्न देखने वाली बुद्धि।", "rashi|गुरु|मेष": "नैतिकता व धर्म (Morality):  परम धार्मिक, धर्म-ध्वज फहराने वाला, सत्यनिष्ठ एवं सदाचारी।\n\nविद्वत्ता व शिक्षा (Scholarly Achievement):  अत्यंत विद्वान, शास्त्रों का ज्ञाता, तार्किक एवं तीक्ष्ण स्मरण शक्ति।\n\nसमृद्धि व वैभव (Prosperity):  प्रतापी, अपार धन-धान्य, बहु-संतति से युक्त तथा शत्रुओं को नीचा दिखाने वाला।", "rashi|गुरु|वृषभ": "नैतिकता व धर्म (Morality):  गुरुभक्त, परंपराओं का पालन करने वाला तथा शांत-सदाचारी।\n\nविद्वत्ता व शिक्षा (Scholarly Achievement):  काव्य, संगीत व व्यावहारिक शास्त्रों का ज्ञान रखने वाला।\n\nसमृद्धि व वैभव (Prosperity):  महाधनी, सुंदर देह वाला, वस्त्र-आभूषणों से युक्त, कुटुंब से समृद्ध।", "rashi|गुरु|मिथुन": "नैतिकता व धर्म (Morality):  न्यायप्रिय, निष्पक्ष, समाज सुधारक एवं नैतिक मूल्यों का पोषक।\n\nविद्वत्ता व शिक्षा (Scholarly Achievement):  महापंडित, न्यायविद्, प्रसिद्ध वक्ता, नीतिशास्त्र का गाढ़ा अभ्यासी।\n\nसमृद्धि व वैभव (Prosperity):  राजा का प्रिय, दीर्घायु, उच्च पदों पर आसीन व विशाल संपत्ति का स्वामी।", "rashi|गुरु|कर्क": "नैतिकता व धर्म (Morality):  कर्क गुरु की उच्च राशि है (५° पर परमोच्च)। जगत् में पूजनीय, परम निष्पाप, धर्म-अधर्म का सूक्ष्म विवेचक।\n\nविद्वत्ता व शिक्षा (Scholarly Achievement):  सर्वज्ञ, वेद-वेदांत में परम पारंगत, दार्शनिक चिंतक।\n\nसमृद्धि व वैभव (Prosperity):  राजा या राष्ट्रपति के समान सम्मानित, अपार धन-धान्य, सुयोग्य संतति व सर्व-वैभव संपन्न।", "rashi|गुरु|सिंह": "नैतिकता व धर्म (Morality):  स्वाभिमानी, धर्मात्मा, ईश्वरभक्त तथा दयालु।\n\nविद्वत्ता व शिक्षा (Scholarly Achievement):  सैन्य शास्त्र, राजनीति तथा उच्च ज्ञान में निष्णात।\n\nसमृद्धि व वैभव (Prosperity):  पराक्रमी, सेनापति या मंत्री पद प्राप्त, सर्वप्रिय एवं उच्च राजमान्य।", "rashi|गुरु|कन्या": "नैतिकता व धर्म (Morality):  दानी, परोपकारी, निष्कपट तथा धार्मिक व्रतों का पालनकर्ता।\n\nविद्वत्ता व शिक्षा (Scholarly Achievement):  वेद-शास्त्रज्ञ, हस्तकला व गणितीय विषयों में विद्वान।\n\nसमृद्धि व वैभव (Prosperity):  सुंदर स्त्री का पति, व्यापार से धन लाभ, सर्व-सुख संपन्न।", "rashi|गुरु|तुला": "नैतिकता व धर्म (Morality):  न्यायकारी, निष्पक्ष, धर्म में आस्था रखने वाला।\n\nविद्वत्ता व शिक्षा (Scholarly Achievement):  न्याय शास्त्र, कानून व वाणिज्य में विशेष उपलब्धि।\n\nसमृद्धि व वैभव (Prosperity):  सुंदर देह, पुत्रवान, सफल व्यापारी, विदेश प्रिय व प्रचुर धनवान।", "rashi|गुरु|वृश्चिक": "नैतिकता व धर्म (Morality):  धर्म के प्रति उग्र निष्ठा, स्वाभिमानी व कठोर नियम पालने वाला।\n\nविद्वत्ता व शिक्षा (Scholarly Achievement):  शास्त्रों व गुह्य विद्याओं में निष्णात।\n\nसमृद्धि व वैभव (Prosperity):  राजा का प्रिय, भूमिपति, शत्रुओं को नीचा दिखाने वाला तथा समृद्ध।", "rashi|गुरु|धनु": "नैतिकता व धर्म (Morality):  स्वराशि एवं मूलत्रिकोण (०°-१०°) में गुरु होने से महान आचार्य, यज्ञकर्ता व परम धर्मात्मा।\n\nविद्वत्ता व शिक्षा (Scholarly Achievement):  वेदों, उपनिषदों व धर्मशास्त्रों का शीर्ष विद्वान।\n\nसमृद्धि व वैभव (Prosperity):  राजा, न्यायाधीश, अपार खजाने का स्वामी, यशस्वी व महाप्रतापी।", "rashi|गुरु|मकर": "नैतिकता व धर्म (Morality):  मकर गुरु की नीच राशि है (५° पर परम नीच)। धर्महीनता, आचार-भ्रष्टता व नीच संगति।\n\nविद्वत्ता व शिक्षा (Scholarly Achievement):  विद्या में विघ्न, अज्ञानता, कुतर्क करने की प्रवृत्ति।\n\nसमृद्धि व वैभव (Prosperity):  दुःखी, निर्धन, पुत्र-सुख से हीन, दूसरों के अधीन रहने वाला।", "rashi|गुरु|कुंभ": "नैतिकता व धर्म (Morality):  समाज हितैषी, परोपकारी, परंतु मान्यताओं में स्वतंत्र।\n\nविद्वत्ता व शिक्षा (Scholarly Achievement):  दार्शनिक, शोधकर्ता, विद्वान।\n\nसमृद्धि व वैभव (Prosperity):  दानी, जीवन में वित्तीय उतार-चढ़ाव सहकर अंततः सुखी।", "rashi|गुरु|मीन": "नैतिकता व धर्म (Morality):  स्वराशि में गुरु जातक को निष्पाप, परम धार्मिक व संत-प्रकृति बनाता है।\n\nविद्वत्ता व शिक्षा (Scholarly Achievement):  सर्वज्ञ, वेद-वेदांत का विद्वान, नीति-कुशल।\n\nसमृद्धि व वैभव (Prosperity):  राजा का मुख्य सलाहकार/मंत्री, अपार संपत्ति, जनप्रिय व यशस्वी।\n\nबृहस्पति के ज्ञान व आध्यात्मिक प्रभाव के पश्चात्, अब हम दैत्यगुरु शुक्र के द्वादश राशि फल का विचार करेंगे।", "rashi|शुक्र|मेष": "दाम्पत्य व संबंध (Marital Harmony):  चंचल कामुकता, पर-स्त्री अनुराग, विवाह में उतावलापन।\n\nकला व सौंदर्य (Artistic Talent):  कला प्रेमी, आभूषण व आधुनिक फैशन का अनुरागी।\n\nभौतिक सुख (Material Comfort):  विदेश गमन से धन अर्जित करने वाला, परंतु सुख-साधनों पर अत्यधिक व्यय करने वाला।", "rashi|शुक्र|वृषभ": "दाम्पत्य व संबंध (Marital Harmony):  स्वराशि में शुक्र होने से अत्यंत सुखी दाम्पत्य, सुंदर व गुणी पत्नी।\n\nकला व सौंदर्य (Artistic Talent):  ललित कलाओं, संगीत व काव्य का महान अनुरागी व संरक्षक।\n\nभौतिक सुख (Material Comfort):  महाधनी, भूमि-भवन, सुंदर वाहनों का स्वामी, आभूषण व वैभव संपन्न।", "rashi|शुक्र|मिथुन": "दाम्पत्य व संबंध (Marital Harmony):  चतुर, मधुरभाषी, प्रेम संबंधों में सम्मोहक एवं सर्वप्रिय।\n\nकला व सौंदर्य (Artistic Talent):  महान कवि, लेखक, संगीतज्ञ, नाट्य कला विशारद।\n\nभौतिक सुख (Material Comfort):  राजनीति व व्यापार से प्रचुर धन लाभ, समस्त आधुनिक सुख-सुविधाएं।", "rashi|शुक्र|कर्क": "दाम्पत्य व संबंध (Marital Harmony):  अति-भावुक, सुंदर स्त्री से युक्त; पाप दृष्ट होने पर दो पत्नियों का योग।\n\nकला व सौंदर्य (Artistic Talent):  सौंदर्यप्रिय, जलीय व प्राकृतिक स्थलों का प्रेमी।\n\nभौतिक सुख (Material Comfort):  संपत्तिवान, गृह-वाहन सुख, परंतु मानसिक चंचलता।", "rashi|शुक्र|सिंह": "दाम्पत्य व संबंध (Marital Harmony):  स्वाभिमानी, पत्नी के माध्यम से धन लाभ, परंतु कम संतति योग।\n\nकला व सौंदर्य (Artistic Talent):  राजसी कलाओं व आभूषणों का प्रेमी।\n\nभौतिक सुख (Material Comfort):  राजा से सम्मानित, उच्च पद, परंतु कामसुख में आंशिक तृप्ति।", "rashi|शुक्र|कन्या": "दाम्पत्य व संबंध (Marital Harmony):  कन्या शुक्र की नीच राशि है (२७° पर परम नीच)। स्त्री-दुःख, दाम्पत्य में तनाव, कामी, नीच कर्मों में लीन।\n\nकला व सौंदर्य (Artistic Talent):  कला का अभाव या कलात्मक कृतियों का दुरुपयोग।\n\nभौतिक सुख (Material Comfort):  निर्धनता, ऋण, कुसंगति, वाहनों से कष्ट व मान-हानि।", "rashi|शुक्र|तुला": "दाम्पत्य व संबंध (Marital Harmony):  स्वराशि व मूलत्रिकोण (०°-५°) में शुक्र होने से पर
