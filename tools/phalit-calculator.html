तंत्र में शिथिलता या वात विकार।\n\nस्थायी सफलता (Structural Success):  शिल्प, लेखन, गणित व लेखांकन में स्थायी सफलता।", "rashi|शनि|तुला": "धैर्य व परिश्रम (Perseverance):  तुला शनि की उच्च राशि है (२०° पर परमोच्च)। शुक्र का वायु-तत्व एवं तुला का संतुलन शनि के अनुशासन को परम शक्ति देता है। अगाध धैर्य व दीर्घकालीन परिश्रम।\n\nसंघर्ष व कष्ट (Hardship):  संघर्षों का समूल नाश, आपत्ति-विपत्तियों से पूर्ण मुक्ति।\n\nस्वास्थ्य प्रभाव (Health Issues):  दीर्घायु, अत्यंत पुष्ट व आरोग्य शरीर।\n\nस्थायी सफलता (Structural Success):  अखंड साम्राज्य का स्वामी, राजा या जन-नायक, अपार संपत्ति, महान सेनापति व सर्वोच्च पद।", "rashi|शनि|वृश्चिक": "धैर्य व परिश्रम (Perseverance):  उग्र, हठी, बदला लेने की भावना से परिश्रम करने वाला।\n\nसंघर्ष व कष्ट (Hardship):  विष, शस्त्र या अग्नि से भय, जेल/बंधन (Imprisonment) का योग, घोर दुःख।\n\nस्वास्थ्य प्रभाव (Health Issues):  चर्म रोग, गुप्त रोग या शल्य-चिकित्सा।\n\nस्थायी सफलता (Structural Success):  जोखिम भरे या गुप्त विज्ञानों से आंशिक सफलता।", "rashi|शनि|धनु": "धैर्य व परिश्रम (Perseverance):  धार्मिक, संयमी, शांत स्वभाव से कर्तव्यनिष्ठ।\n\nसंघर्ष व कष्ट (Hardship):  अल्प संघर्ष, गुरु कृपा से संकटों का निवारण।\n\nस्वास्थ्य प्रभाव (Health Issues):  आरोग्यता उत्तम, दीर्घायु।\n\nस्थायी सफलता (Structural Success):  राजा का प्रिय, मंत्री, सुखी, पुत्रवान व स्थायी संपत्ति।", "rashi|शनि|मकर": "धैर्य व परिश्रम (Perseverance):  स्वराशि में स्थित शनि जातक को परम अनुशासित, लगनशील व अडिग परिश्रमी बनाता है।\n\nसंघर्ष व कष्ट (Hardship):  प्रारंभिक संघर्षों को जीतकर अपराजित बनने वाला।\n\nस्वास्थ्य प्रभाव (Health Issues):  दीर्घायु, मजबूत अस्थि ढांचा।\n\nस्थायी सफलता (Structural Success):  ग्राम या नगर का प्रमुख, महाधनी, विशाल भूमिपति व शत्रुओं पर विजय।", "rashi|शनि|कुंभ": "धैर्य व परिश्रम (Perseverance):  स्वराशि एवं मूलत्रिकोण (०°-२०°) का शनि जातक को अद्वितीय संगठनकर्ता व स्थिर बुद्धि बनाता है।\n\nसंघर्ष व कष्ट (Hardship):  कष्टों का निवारण, जन-समर्थन से बाधाओं का नाश।\n\nस्वास्थ्य प्रभाव (Health Issues):  दीर्घायु, उत्तम स्वास्थ्य।\n\nस्थायी सफलता (Structural Success):  राजा के समान अधिकार, अपार धन-धान्य का स्वामी, जन-नायक व सर्व-प्रतिष्ठित।", "rashi|शनि|मीन": "धैर्य व परिश्रम (Perseverance):  विवेकशील, शांत, धार्मिक व नीतिबद्ध।\n\nसंघर्ष व कष्ट (Hardship):  कुटुंब का पालन करते हुए कष्टों पर विजय।\n\nस्वास्थ्य प्रभाव (Health Issues):  पैरों में चोट या वात विकार संभव।\n\nस्थायी सफलता (Structural Success):  सुखी, राजा का मंत्री, चतुर व संपत्तिवान।", "rashi|राहु|मेष": "अत्यंत साहसी, परंतु उग्र, बिना सोचे-समझे कार्य करने वाला, मस्तक पर चोट या सिरदर्द से पीड़ित।", "rashi|राहु|वृषभ": "धन संचय में अत्यंत चतुर, कूटनीति से लाभ, पर-देशीय संबंधों से समृद्धि, परंतु कुटुंब में वाणी दोष।", "rashi|राहु|मिथुन": "महान कूटनीतिज्ञ, लेखक, चतुर, विदेश यात्राओं व संचार माध्यमों से प्रचुर धन कमाने वाला।", "rashi|राहु|कर्क": "चंचल व अस्थिर मन, मातृ-सुख में कमी, जल से भय, छाती में विकार तथा मानसिक तनाव।", "rashi|राहु|सिंह": "उच्च पद की प्रचंड महत्वाकांक्षा, राजा/सरकार से संघर्ष, परंतु स्वाभिमानी व निडर।", "rashi|राहु|कन्या": "कूटनीतिक सफलता, शोध कार्य में निपुण, शत्रुओं का दमन करने वाला तथा प्रचुर धनवान।", "rashi|राहु|तुला": "अंतरराष्ट्रीय व्यापार से भारी लाभ, वैवाहिक संबंधों में अनिश्चितता या उथल-पुथल।", "rashi|राहु|वृश्चिक": "गुह्य विद्याओं का प्रेमी, उग्र स्वभाव, गुप्त शत्रुओं व दुर्घटनाओं से कष्ट पाने की संभावना।", "rashi|राहु|धनु": "अपरंपरागत धार्मिक सोच, विदेश में बसने वाला, दार्शनिक विचारों का स्वामी।", "rashi|राहु|मकर": "कठोर परिश्रमी, राजनीति में अति-कुशल, बड़े औद्योगिक संगठनों में शीर्ष सफलता।", "rashi|राहु|कुंभ": "समाज के नियमों से हटकर कार्य करने वाला, अनूठे तकनीकी व वैज्ञानिक विचारों का स्वामी।", "rashi|राहु|मीन": "आध्यात्मिक खोज में लीन, समुद्र पार यात्राएं करने वाला, मोक्ष या जल-स्थानों का प्रेमी।", "rashi|केतु|मेष": "उग्र, निडर, शस्त्र या दुर्घटना से चोट पाने वाला, अत्यधिक साहसी परंतु उतावला।", "rashi|केतु|वृषभ": "सांसारिक सुखों से अनासक्ति, धन के मामलों में गुप्त या संभलकर चलने वाला, एकांतप्रिय।", "rashi|केतु|मिथुन": "तीक्ष्ण बुद्धि, गूढ़ विषयों व गुप्त ज्ञान का ज्ञाता, कम बोलने वाला मौन साधक।", "rashi|केतु|कर्क": "छाती या हृदय में बेचैनी, मातृ-सुख में न्यूनता, आंतरिक वैराग्य महसूस करने वाला।", "rashi|केतु|सिंह": "अहंकार का त्यागी, गुप्त साधनाओं का प्रेमी, राजनीतिक छल-प्रपंच से दूर रहने वाला।", "rashi|केतु|कन्या": "रोगों व सूक्ष्म जीवाणुओं का सटीक विश्लेषण करने वाला, कुशल चिकित्सक या साधक।", "rashi|केतु|तुला": "व्यापारिक या वैवाहिक संबंधों में अनासक्ति रखने वाला, आध्यात्मिक संतुलन का खोजी।", "rashi|केतु|वृश्चिक": "तंत्र-मंत्र, गुप्त विज्ञान व शल्य-क्रिया का ज्ञाता, अत्यंत उग्र व तीव्र आध्यात्मिक रूपांतरण वाला।", "rashi|केतु|धनु": "महान आध्यात्मिक ज्ञान, मोक्ष की ओर झुकाव, शास्त्रों व वेदों का गूढ़ मर्मज्ञ।", "rashi|केतु|मकर": "निस्वार्थ कर्म करने वाला, पर्दे के पीछे रहकर प्रशासनिक सफलता पाने वाला।", "rashi|केतु|कुंभ": "निष्काम सेवा भाव रखने वाला, दार्शनिक, सांसारिक चमक-धमक से अलग रहने वाला।", "rashi|केतु|मीन": "मीन राशि में केतु परम मोक्षकारक माना जाता है; जातक उच्च कोटि का साधक, एकांतवासी व सिद्ध पुरुष होता है।", "nakshatra|सूर्य|अश्विनी": "केतु शासित इस नक्षत्र में मेष राशिगत सूर्य जातक को अत्यधिक साहसी, ऊर्जावान, त्वरित निर्णय लेने वाला और तीक्ष्ण बुद्धि प्रदान करता है। कालपुरुष के मस्तक क्षेत्र में होने के कारण यहाँ सूर्य मजबूत अस्थि संरचना और आरोग्य देता है।", "nakshatra|सूर्य|भरणी": "शुक्र शासित भरणी में मेष राशिगत सूर्य जातक को राजसेवा से लाभ, कार्यक्षेत्र में कठोर अनुशासन और दृढ़ संकल्प देता है। मंगल-शुक्र-सूर्य का यह योग जातक को स्वाभिमानी और प्रतिस्पर्धा में विजयी बनाता है।", "nakshatra|सूर्य|कृत्तिका": "कृत्तिका सूर्य का स्व-नक्षत्र है। मेष राशि के 10° पर सूर्य  परमोच्च  होता है। यहाँ स्थित सूर्य तेजस्वी व्यक्तित्व, अद्वितीय नेतृत्व क्षमता, समाज में सर्वोच्च प्रतिष्ठा और प्रशासनिक सफलता देता है। वृष राशि (शुक्र क्षेत्र) में प्रवेश करने पर सूर्य के तीक्ष्ण तेज में सौम्यता आती है, किंतु जातक अपने सिद्धांतों पर अडिग रहता है।", "nakshatra|सूर्य|रोहिणी": "चंद्र शासित रोहिणी नक्षत्र में स्थित सूर्य जातक को कलात्मक अभिरुचि के साथ व्यावहारिक और स्थिर बुद्धि प्रदान करता है। शुक्र की राशि और चंद्र के नक्षत्र का प्रभाव सूर्य के तेज को राजमान्य सौंदर्य और भौतिक समृद्धि में बदल देता है।", "nakshatra|सूर्य|मृगशिरा": "मंगल के नक्षत्र में वृष राशिगत सूर्य जातक को तीव्र शोधपरक दृष्टिकोण, भ्रमणप्रियता और सत्य की खोज में तत्पर रहने वाला बनाता है। जातक तर्कशक्ति से शत्रुओं को परास्त करता है।\n\n2.2 मिथुन, कर्क एवं सिंह राशि स्थित नक्षत्र (आर्द्रा, पुनर्वसु, पुष्य, आश्लेषा, मघा, पूर्वा फाल्गुनी, उत्तरा फाल्गुनी - प्रथम चरण)", "nakshatra|सूर्य|आर्द्रा": "राहु शासित आर्द्रा नक्षत्र में बुध राशिगत सूर्य होने पर जातक बौद्धिक रूप से तीक्ष्ण किंतु मानसिक रूप से उद्वेलित रहता है। यह स्थिति बौद्धिक संघर्ष और तीक्ष्ण शोध क्षमता का निर्माण करती है।", "nakshatra|सूर्य|पुनर्वसु": "गुरु के इस नक्षत्र में मिथुन राशिगत सूर्य जातक को विद्वान, बहुश्रुत और न्यायप्रिय बनाता है। जब सूर्य चतुर्थ चरण में अपनी मित्र राशि कर्क (चंद्र क्षेत्र) में प्रवेश करता है, तो जातक में धार्मिकता, उदारता और समाज सेवा की भावना प्रबल होती है।", "nakshatra|सूर्य|पुष्य": "शनि शासित पुष्य नक्षत्र में कर्क राशिगत सूर्य जातक को धर्मनिष्ठ, राजमान्य, शांत चित्त और परोपकारी बनाता है। गुरु के अधिष्ठान (कर्क) के कारण यहाँ सूर्य जातक के नैतिक मूल्यों को अत्यंत उच्च रखता है।", "nakshatra|सूर्य|आश्लेषा": "बुध शासित आश्लेषा में कर्क राशि स्थित सूर्य होने से जातक अत्यंत कूटनीतिज्ञ, गुप्त विधाओं में चतुर, किंतु कभी-कभी शंकालु और पित्त-कफ जनित विकारों से पीड़ित हो सकता है।", "nakshatra|सूर्य|मघा": "केतु के नक्षत्र में सिंह स्वराशि स्थित सूर्य होने से जातक को पैतृक संपत्ति का लाभ, राजसी ठाट-बाट, स्वाभिमान तथा उच्च प्रशासनिक क्षमता प्राप्त होती है। जातक कुल दीपक बनता है।", "nakshatra|सूर्य|पूर्वा फाल्गुनी": "शुक्र के नक्षत्र में सिंह राशिगत सूर्य जातक को प्रतापी, कलाप्रेमी, राजसी सुख भोगने वाला और समाज में अत्यंत लोकप्रिय बनाता है।", "nakshatra|सूर्य|उत्तरा फाल्गुनी": "सिंह राशि के अंतिम भाग में सूर्य अपने ही नक्षत्र में होता है। यहाँ स्थित सूर्य जातक को अपार यश, निष्पक्ष न्यायप्रियता, राजा के समान अधिकार और स्थायी प्रतिष्ठा प्रदान करता है।\n\n2.3 कन्या, तुला एवं वृश्चिक राशि स्थित नक्षत्र (हस्त, चित्रा, स्वाती, विशाखा, अनुराधा, ज्येष्ठा)", "nakshatra|सूर्य|हस्त": "चंद्र के नक्षत्र में कन्या राशि (बुध क्षेत्र) स्थित सूर्य जातक को व्यावहारिक, कुशल शिल्पी, गणितज्ञ और वाणिज्य कार्यों में निपुण बनाता है।", "nakshatra|सूर्य|चित्रा": "मंगल शासित चित्रा में कन्या स्थित सूर्य रचनात्मकता देता है। किंतु तुला राशि (शुक्र क्षेत्र) के तृतीय व चतुर्थ चरण में प्रवेश करते ही सूर्य का नीचत्व प्रभाव आरंभ होता है।", "nakshatra|सूर्य|स्वाती": "राहु के नक्षत्र में तुला राशि के 10° पर सूर्य  परम नीच  माना गया है। स्वाती नक्षत्र में नीच राशिगत सूर्य जातक के आत्मबल में कमी, शासकीय बाधाएं, पिता के स्वास्थ्य में कष्ट और नेत्र या पित्त रोग उत्पन्न कर सकता है।", "nakshatra|सूर्य|विशाखा": "गुरु शासित विशाखा के तुला भाग में सूर्य नीचत्व के प्रभाव से मुक्त होने की ओर अग्रसर होता है। चतुर्थ चरण में वृश्चिक राशि (मित्र मंगल क्षेत्र) में जाने पर जातक पुनः साहसी और निडर हो जाता है।", "nakshatra|सूर्य|अनुराधा": "शनि शासित अनुराधा नक्षत्र में वृश्चिक राशि स्थित सूर्य जातक को विदेश यात्रा का योग, गुप्त ज्ञान की प्राप्ति और कठिन परिस्थितियों में भी स्थिर रहने की क्षमता प्रदान करता है।", "nakshatra|सूर्य|ज्येष्ठा": "बुध के नक्षत्र में वृश्चिक राशि स्थित सूर्य जातक को अत्यधिक स्वाभिमानी, तीक्ष्ण बुद्धि और नेतृत्व प्रिय बनाता है, किंतु अहम् की भावना बढ़ने से वैचारिक मतभेद संभव हैं।\n\n2.4 धनु, मकर, कुंभ एवं मीन राशि स्थित नक्षत्र (मूल, पूर्वाषाढ़ा, उत्तराषाढ़ा, श्रवण, धनिष्ठा, शतभिषा, पूर्वा भाद्रपद, उत्तरा भाद्रपद, रेवती)", "nakshatra|सूर्य|मूल": "केतु शासित मूल नक्षत्र में धनु राशि (मित्र गुरु क्षेत्र) स्थित सूर्य जातक को दार्शनिक, वेद-शास्त्रों का ज्ञाता और धर्मनिष्ठ बनाता है।", "nakshatra|सूर्य|पूर्वाषाढ़ा": "शुक्र के इस नक्षत्र में सूर्य स्थित होने से जातक प्रभावशाली, सरस, राजपक्ष से लाभ पाने वाला और न्यायप्रिय होता है।", "nakshatra|सूर्य|उत्तराषाढ़ा": "सूर्य के स्व-नक्षत्र उत्तराषाढ़ा के धनु भाग में जातक अपराजेय होता है। मकर राशि (शनि क्षेत्र) में प्रवेश करने पर सूर्य जातक को अत्यधिक कर्मठ, शासकीय सेवाओं में उच्च पदस्थ और अनुशासित बनाता है।", "nakshatra|सूर्य|श्रवण": "चंद्र के नक्षत्र में मकर राशिगत सूर्य जातक को शास्त्र श्रवण में रुचि रखने वाला, प्रसिद्ध, विद्वान और सम्मानित स्थान प्रदान करता है।", "nakshatra|सूर्य|धनिष्ठा": "मंगल शासित धनिष्ठा के मकर भाग में सूर्य धनवान और उच्च प्रशासनिक क्षमता वाला बनाता है। कुंभ राशि में प्रवेश करने पर सूर्य जन-सेवा और सामाजिक कार्यों से जोड़ता है।", "nakshatra|सूर्य|शतभिषा": "राहु के इस नक्षत्र में कुंभ राशिगत सूर्य जातक को रहस्यमयी, वैज्ञानिक दृष्टिकोण वाला और गूढ़ शोधकार्यों में सफल बनाता है।", "nakshatra|सूर्य|पूर्वा भाद्रपद": "गुरु के इस नक्षत्र में कुंभ स्थित सूर्य त्यागी और तपस्वी बनाता है। मीन राशि के चतुर्थ चरण में जाने पर जातक आध्यात्मिक ऊंचाइयों को प्राप्त करता है।", "nakshatra|सूर्य|उत्तरा भाद्रपद": "शनि के इस नक्षत्र में मीन राशिगत सूर्य जातक को धर्मनिष्ठ, शांत, परोपकारी और सर्वत्र आदर पाने वाला बनाता है।", "nakshatra|सूर्य|रेवती": "बुध के नक्षत्र रेवती में मीन राशिगत सूर्य होने से जातक समृद्ध, जल-यात्राओं से लाभ पाने वाला, दयालु और सद्गति प्राप्त करने वाला होता है।\n\nसूर्य के इस नक्षत्र प्रभाव का आकलन करने के पश्चात्, अब हम मन, जल तत्व और चेतना के स्वामी चंद्र के नक्षत्रगत संचरण का समालोचनात्मक मूल्यांकन करेंगे।", "nakshatra|चंद्र|अश्विनी": "मेष राशि स्थित अश्विनी नक्षत्र में चंद्र होने पर जातक अत्यंत सुंदर, प्रियदर्शी, बुद्धिमान, वस्त्र-आभूषणों से युक्त और त्वरित कार्य करने वाला होता है।", "nakshatra|चंद्र|भरणी": "भरणी स्थित चंद्र जातक को सत्यवादी, नीरोग, दृढ़प्रतिज्ञ और जल/द्रव्य पदार्थों से सुख प्राप्त करने वाला बनाता है।", "nakshatra|चंद्र|कृत्तिका": "मेष के अंतिम भाग में चंद्र तीक्ष्ण बुद्धि देता है। किंतु जैसे ही चंद्र वृष राशि में प्रवेश करता है, वृष के 3° पर यह  परमोच्च  होता है। वृष 3° से 30° तक चंद्र का मूलत्रिकोण क्षेत्र भी है। यहाँ चंद्र जातक को असीम कांति, सुंदर रूप, अपार धन, चतुर वाणी और चित्त की परम प्रसन्नता प्रदान करता है।", "nakshatra|चंद्र|रोहिणी": "रोहिणी चंद्र का स्व-नक्षत्र है। यहाँ स्थित चंद्र जातक को परम सुंदर, सत्यवादी, माता का परम प्रिय, धन-धान्य और कृषि/द्रव्य लाभ से परिपूर्ण बनाता है।", "nakshatra|चंद्र|मृगशिरा": "वृष राशि स्थित मृगशिरा में चंद्र जातक को चतुर, चंचल नेत्रों वाला, शोधप्रिय और मधुर वाणी बोलने वाला बनाता है।\n\n3.2 मिथुन, कर्क एवं सिंह राशि स्थित नक्षत्र (आर्द्रा, पुनर्वसु, पुष्य, आश्लेषा, मघा, पूर्वा फाल्गुनी, उत्तरा फाल्गुनी)", "nakshatra|चंद्र|आर्द्रा": "मिथुन राशि में आर्द्रा स्थित चंद्र जातक को दयालु, किंतु मानसिक रूप से उद्वेगयुक्त, शोध कार्यों में संलग्न और कभी-कभी अभिमान करने वाला बनाता है।", "nakshatra|चंद्र|पुनर्वसु": "मिथुन राशि में चंद्र विद्वत्ता देता है। जब चंद्र चतुर्थ चरण में अपनी स्वराशि कर्क में प्रवेश करता है, तो जातक परम शांत, दाता, गृह सुख से परिपूर्ण और उच्च नैतिक मूल्यों वाला होता है।", "nakshatra|चंद्र|पुष्य": "कर्क राशि में पुष्य नक्षत्र स्थित चंद्र स्वगृही होकर अति शुभ माना जाता है। जातक धर्मज्ञ, राजा से सम्मानित, बुद्धिमान, मित्रों का प्रिय और महाधनी होता है।", "nakshatra|चंद्र|आश्लेषा": "अपनी ही राशि कर्क के आश्लेषा नक्षत्र में चंद्र जातक को कूटनीतिक, अत्यंत चतुर बुद्धि, किंतु स्वभाव में थोड़ा कपट या अस्थिरता दे सकता है।", "nakshatra|चंद्र|मघा": "सिंह राशि (सूर्य क्षेत्र) स्थित मघा नक्षत्र में चंद्र जातक को महाधनी, सेवक-चाकरों से युक्त, पितृभक्त और विशाल ह्रदय वाला राजसी पुरुष बनाता है।", "nakshatra|चंद्र|पूर्वा फाल्गुनी": "यहाँ स्थित चंद्र जातक को मधुरभाषी, त्यागी, सुंदर, कलाप्रिय, और स्त्रियों में प्रिय बनाता है।", "nakshatra|चंद्र|उत्तरा फाल्गुनी": "सिंह राशि स्थित उत्तरा फाल्गुनी में चंद्र जातक को स्वउपार्जित धन से समृद्ध, राजा का प्रिय, और जनसामान्य में आदरणीय बनाता है।\n\n3.3 कन्या, तुला एवं वृश्चिक राशि स्थित नक्षत्र (हस्त, चित्रा, स्वाती, विशाखा, अनुराधा, ज्येष्ठा)", "nakshatra|चंद्र|हस्त": "कन्या राशि स्थित हस्त नक्षत्र में चंद्र जातक को अत्यंत चतुर, शास्त्रज्ञ, व्यापार और गणित में निपुण, तथा मिष्ठान्न प्रिय बनाता है।", "nakshatra|चंद्र|चित्रा": "कन्या स्थित चित्रा में चंद्र जातक को सुंदर नेत्रों वाला और कुशल योजनाकार बनाता है। तुला राशि (शुक्र क्षेत्र) के तृतीय व चतुर्थ चरण में चंद्र जातक को कलात्मक और वस्त्र-आभूषणों का शौकीन बनाता है।", "nakshatra|चंद्र|स्वाती": "तुला स्थित स्वाती नक्षत्र में चंद्र जातक को धार्मिक, दयालु, व्यापारी, स्वाधीन चिंतन वाला और शांत स्वभाव प्रदान करता है।", "nakshatra|चंद्र|विशाखा": "तुला राशि स्थित विशाखा में चंद्र जातक को महत्वाकांक्षी और चतुर व्यापारी बनाता है। चतुर्थ चरण में वृश्चिक राशि में प्रवेश करते ही चंद्र पर नीचत्व का प्रभाव प्रारंभ होता है।", "nakshatra|चंद्र|अनुराधा": "वृश्चिक राशि के 3° पर चंद्र  परम नीच  होता है। अनुराधा नक्षत्र में स्थित नीच राशिगत चंद्र जातक को मानसिक कष्ट, ईर्ष्या, उद्वेग, और रक्त विकारों का जोखिम दे सकता है। किंतु शनि के नक्षत्र प्रभाव के कारण जातक विदेश यात्राओं और गुप्त विधाओं में निपुण होता है।", "nakshatra|चंद्र|ज्येष्ठा": "वृश्चिक राशि स्थित ज्येष्ठा नक्षत्र में चंद्र जातक को अत्यधिक स्वाभिमानी, तीक्ष्ण बुद्धि, और मानसिक रूप से उग्र किंतु निडर और कूटनीतिज्ञ बनाता है।\n\n3.4 धनु, मकर, कुंभ एवं मीन राशि स्थित नक्षत्र (मूल, पूर्वाषाढ़ा, उत्तराषाढ़ा, श्रवण, धनिष्ठा, शतभिषा, पूर्वा भाद्रपद, उत्तरा भाद्रपद, रेवती)", "nakshatra|चंद्र|मूल": "धनु राशि स्थित मूल नक्षत्र में चंद्र जातक को समृद्ध, त्यागी, धर्मनिष्ठ, किंतु जीवन में कम से कम एक बार भारी मानसिक या पारिवारिक उथल-पुथल का सामना कराने वाला होता है।", "nakshatra|चंद्र|पूर्वाषाढ़ा": "यहाँ चंद्र जातक को स्वाभिमानी, सुंदर जीवनसाथी प्राप्त करने वाला, और जल यात्राओं से लाभ पाने वाला बनाता है।", "nakshatra|चंद्र|उत्तराषाढ़ा": "धनु स्थित उत्तराषाढ़ा में चंद्र जातक को धार्मिक और सर्वप्रिय बनाता है। मकर राशि (शनि क्षेत्र) में जाने पर जातक अनुशासित, नीतिज्ञ, और लोक कल्याणकारी होता है।", "nakshatra|चंद्र|श्रवण": "मकर राशि स्थित श्रवण नक्षत्र (स्व-नक्षत्र) में चंद्र जातक को बहुश्रुत, अपार ज्ञानवान, सुंदर जीवनसाथी से युक्त, और प्रसिद्ध विद्वान बनाता है।", "nakshatra|चंद्र|धनिष्ठा": "मकर स्थित धनिष्ठा में चंद्र जातक को संगीतप्रेमी, धनवान और दानवीर बनाता है। कुंभ राशि में जाने पर जातक सामाजिक क्रांति या जनकल्याण में संलग्न रहता है।", "nakshatra|चंद्र|शतभिषा": "कुंभ राशि स्थित शतभिषा में चंद्र जातक को स्पष्टवक्ता, स्वतंत्र विचारों वाला, और औषधियों का ज्ञान रखने वाला बनाता है।", "nakshatra|चंद्र|पूर्वा भाद्रपद": "कुंभ स्थित पूर्वा भाद्रपद में चंद्र जातक को ज्ञानी, धन संग्रह करने वाला बनाता है। मीन राशि (गुरु क्षेत्र) में जाने पर चंद्र परम सात्त्विक और दार्शनिक फल देता है।", "nakshatra|चंद्र|उत्तरा भाद्रपद": "मीन राशि स्थित उत्तरा भाद्रपद में चंद्र जातक को धार्मिक, मधुरभाषी, शत्रुजयी, और परम सुखी बनाता है।", "nakshatra|चंद्र|रेवती": "मीन के रेवती नक्षत्र में स्थित चंद्र जातक को सर्वांग सुंदर, जल संबंधी व्यापार में सफल, धन-धान्य से परिपूर्ण और पूर्ण सुखी बनाता है।\n\nचंद्र की नक्षत्रगत स्थिति से निर्मित इस मानसिक व भावनात्मक संस्तर के पश्चात्, अब हम पराक्रम, उग्रता और सामरिक ऊर्जा के कारक मंगल के प्रभावों का समालोचनात्मक ब्योरा प्रस्तुत करेंगे।", "nakshatra|मंगल|अश्विनी": "अपनी स्वराशि मेष में अश्विनी स्थित मंगल जातक को परम साहसी, अस्त्र-शस्त्र व शल्य-क्रिया में निपुण, शूरवीर सेनापति और अत्यंत ऊर्जावान बनाता है।", "nakshatra|मंगल|भरणी": "मेष राशि स्थित भरणी में मंगल स्वगृही होकर जातक को निडर, स्वतंत्र विचारों वाला, भूमि का स्वामी और शत्रुओं का दमन करने वाला बनाता है।", "nakshatra|मंगल|कृत्तिका": "मेष स्थित कृत्तिका में मंगल जातक को अत्यंत तीक्ष्ण, उग्र, और अग्नि संबंधी कार्यों में निपुण बनाता है। वृष राशि (शुक्र क्षेत्र) में प्रवेश पर मंगल कामुकता और भौतिक वस्तुओं के संचय की ओर उन्मुख होता है।", "nakshatra|मंगल|रोहिणी": "वृष स्थित रोहिणी नक्षत्र में मंगल जातक को सुंदर, सौंदर्य व कला का प्रेमी, किंतु स्वभाव में थोड़ा उग्र और हठी बनाता है।", "nakshatra|मंगल|मृगशिरा": "मृगशिरा मंगल का स्व-नक्षत्र है। वृष राशि में यहाँ मंगल जातक को कुशल योजनाकार, भूमिपति और सामरिक कलाओं का ज्ञाता बनाता है।\n\n4.2 मिथुन, कर्क एवं सिंह राशि स्थित नक्षत्र (आर्द्रा, पुनर्वसु, पुष्य, आश्लेषा, मघा, पूर्वा फाल्गुनी, उत्तरा फाल्गुनी)", "nakshatra|मंगल|आर्द्रा": "मिथुन राशि स्थित आर्द्रा में मंगल जातक को विवादप्रिय, चतुर कूटनीतिज्ञ, किंतु भ्रातृ कष्ट और घाव/चोट से पीड़ित रहने वाला बना सकता है।", "nakshatra|मंगल|पुनर्वसु": "मिथुन में स्थित मंगल बौद्धिक तर्क शक्ति देता है। जब मंगल चतुर्थ चरण में कर्क राशि में प्रवेश करता है, तो यह नीच राशि की ओर अग्रसर होता है।", "nakshatra|मंगल|पुष्य": "कर्क राशि में मंगल नीच राशि का होता है। पुष्य नक्षत्र में नीच स्थित मंगल जातक को आत्मबल में कमी, भ्रातृ मतभेद, और संपत्ति संबंधी विवाद दे सकता है।", "nakshatra|मंगल|आश्लेषा": "कर्क राशि के 28° पर मंगल  परम नीच  होता है। आश्लेषा नक्षत्र में स्थित यह परम नीच मंगल जातक को अत्यधिक उग्र, क्रोधी, शंकालु, अस्त्र या दुर्घटना से चोट पाने वाला, और मज्जागत विकारों से घिरा रखता है।", "nakshatra|मंगल|मघा": "सिंह राशि (सूर्य क्षेत्र) स्थित मघा में मंगल अपनी मित्र राशि में होकर जातक को प्रतापी, सेनाध्यक्ष, राजमान्य, और विशाल संपत्ति का स्वामी बनाता है।", "nakshatra|मंगल|पूर्वा फाल्गुनी": "यहाँ मंगल जातक को उत्साही, तेजस्वी, और क्रीड़ा व साहसिक क्षेत्रों में सफलता देने वाला होता है।", "nakshatra|मंगल|उत्तरा फाल्गुनी": "सिंह स्थित उत्तरा फाल्गुनी में मंगल जातक को न्यायप्रिय, परम शूरवीर, और शासकीय शक्ति से संपन्न बनाता है।\n\n4.3 कन्या, तुला एवं वृश्चिक राशि स्थित नक्षत्र (हस्त, चित्रा, स्वाती, विशाखा, अनुराधा, ज्येष्ठा)", "nakshatra|मंगल|हस्त": "कन्या राशि स्थित हस्त नक्षत्र में मंगल शत्रु बुध की राशि में होने से जातक को यांत्रिक (मेकेनिकल) और तकनीकी कार्यों में सफलता देता है, किंतु पाचन तंत्र या पित्त विकार भी दे सकता है।", "nakshatra|मंगल|चित्रा": "चित्रा मंगल का स्व-नक्षत्र है। कन्या में यह तकनीकी निपुणता देता है, जबकि तुला में जाने पर जातक वास्तुकला और निर्माण कार्यों में अपनी ऊर्जा लगाता है।", "nakshatra|मंगल|स्वाती": "तुला स्थित स्वाती में मंगल जातक को व्यापारिक प्रतिस्पर्धा में निपुण, किंतु वैवाहिक जीवन में कुछ उग्रता और वैचारिक मतभेद देता है।", "nakshatra|मंगल|विशाखा": "तुला स्थित विशाखा में मंगल जातक को लक्ष्य-केंद्रित बनाता है। चतुर्थ चरण में अपनी स्वराशि वृश्चिक में प्रवेश करते ही मंगल का पराक्रम पुनः जाग्रत होता है।", "nakshatra|मंगल|अनुराधा": "वृश्चिक राशि में अनुराधा स्थित मंगल जातक को अत्यंत धैर्यवान, गुप्त योजनाओं में माहिर, और विदेशी संपर्कों से लाभ पाने वाला बनाता है।", "nakshatra|मंगल|ज्येष्ठा": "वृश्चिक स्थित ज्येष्ठा में मंगल स्वगृही होकर जातक को निर्भीक, शत्रुओं का दमन करने वाला, प्रशासनिक या रक्षा सेवाओं में उच्च पद पाने वाला बनाता है।\n\n4.4 धनु, मकर, कुंभ एवं मीन राशि स्थित नक्षत्र (मूल, पूर्वाषाढ़ा, उत्तराषाढ़ा, श्रवण, धनिष्ठा, शतभिषा, पूर्वा भाद्रपद, उत्तरा भाद्रपद, रेवती)", "nakshatra|मंगल|मूल": "धनु राशि (मित्र गुरु क्षेत्र) स्थित मूल नक्षत्र में मंगल जातक को धर्म योद्धा, साहसी दार्शनिक, और सत्य के लिए संघर्ष करने वाला बनाता है।", "nakshatra|मंगल|पूर्वाषाढ़ा": "यहाँ मंगल जातक को स्वाभिमानी, उच्च पदस्थ, और विशाल संपत्ति का स्वामी बनाता है।", "nakshatra|मंगल|उत्तराषाढ़ा": "धनु में मंगल धार्मिक तेज देता है। जैसे ही मंगल मकर राशि में प्रवेश करता है, मकर के 28° पर यह  परमोच्च  होता है।", "nakshatra|मंगल|श्रवण": "मकर राशि में श्रवण नक्षत्र स्थित मंगल उच्च का होकर जातक को अद्वितीय प्रशासनिक क्षमता, भूमि-भवन का अपार सुख, और समाज में उच्च प्रतिष्ठा प्रदान करता है।", "nakshatra|मंगल|धनिष्ठा": "मकर के 28° पर धनिष्ठा के अंतर्गत मंगल परमोच्च अंश पर होता है। यहाँ मंगल जातक को महाप्रतापी, धनवान, महान सेनापति, और सर्वत्र विजय पाने वाला बनाता है। कुंभ में जाने पर मंगल समाज-सुधार हेतु संघर्ष करता है।", "nakshatra|मंगल|शतभिषा": "कुंभ राशि स्थित शतभिषा में मंगल जातक को वैज्ञानिक, शल्य-चिकित्सक (सर्जन), और कठिन गुप्त शोधों में सफलता देता है।", "nakshatra|मंगल|पूर्वा भाद्रपद": "कुंभ में मंगल उग्रता देता है, जबकि मीन (गुरु क्षेत्र) के चतुर्थ चरण में जाने पर जातक अपनी ऊर्जा को आध्यात्मिक साधना में लगाता है।", "nakshatra|मंगल|उत्तरा भाद्रपद": "मीन राशि स्थित उत्तरा भाद्रपद में मंगल जातक को शत्रुजयी, धर्मनिष्ठ, और शांत पराक्रमी बनाता है।", "nakshatra|मंगल|रेवती": "मीन के रेवती नक्षत्र में स्थित मंगल जातक को जल यात्राओं से लाभ, साहसी व्यापारी, और परोपकारी बनाता है।", "nakshatra|बुध|अश्विनी": "मेष राशि स्थित अश्विनी में बुध जातक को तीव्रगामी बुद्धि, त्वरित वाक्-शक्ति, और नए विचारों का जनक बनाता है।", "nakshatra|बुध|भरणी": "भरणी स्थित बुध जातक को व्यावहारिक, चतुर व्यापारी, किंतु वाक्-व्यवहार में थोड़ा कठोर या व्यंग्यात्मक बना सकता है।", "nakshatra|बुध|कृत्तिका": "मेष स्थित कृत्तिका में बुध जातक को तीक्ष्ण तर्कशास्त्री बनाता है। वृष राशि (मित्र शुक्र क्षेत्र) में जाने पर जातक की वाणी में मधुरता और सौन्दर्यबोध आता है।", "nakshatra|बुध|रोहिणी": "वृष स्थित रोहिणी नक्षत्र में बुध जातक को परम मधुरभाषी, काव्य-कलाप्रेमी, वस्त्र व सुगंधित द्रव्यों का व्यापारी, और अत्यधिक चतुर बनाता है।", "nakshatra|बुध|मृगशिरा": "वृष स्थित मृगशिरा में बुध जातक को जिज्ञासु, कुशल लेखक, और गणितीय कार्यों में निपुण बनाता है।\n\n5.2 मिथुन, कर्क एवं सिंह राशि स्थित नक्षत्र (आर्द्रा, पुनर्वसु, पुष्य, आश्लेषा, मघा, पूर्वा फाल्गुनी, उत्तरा फाल्गुनी)", "nakshatra|बुध|आर्द्रा": "मिथुन बुध की स्वराशि है। आर्द्रा नक्षत्र में स्थित बुध जातक को अत्यंत चतुर, वैज्ञानिक सोच वाला, शोधकर्ता, और हास्यप्रिय (मज़ाकपसंद) बनाता है।", "nakshatra|बुध|पुनर्वसु": "मिथुन राशि स्थित पुनर्वसु में बुध स्वगृही होकर जातक को परम विद्वान, लेखक, और उच्च शिक्षा प्राप्त करने वाला बनाता है। चतुर्थ चरण में कर्क राशि में जाने पर जातक की बुद्धि में भावनात्मकता बढ़ती है।", "nakshatra|बुध|पुष्य": "कर्क राशि स्थित पुष्य नक्षत्र में बुध जातक को धार्मिक साहित्य का ज्ञाता, सरस वक्ता, और समाज सुधारक बनाता है।", "nakshatra|बुध|आश्लेषा": "कर्क स्थित आश्लेषा बुध का स्व-नक्षत्र है। यहाँ बुध जातक को कूटनीति का प्रकांड पंडित, अत्यंत चतुर व्यापारी, किंतु शंकालु और कभी-कभी स्नायु तंत्र (Nervous System) में दुर्बलता देने वाला होता है।", "nakshatra|बुध|मघा": "सिंह राशि (मित्र सूर्य क्षेत्र) स्थित मघा में बुध जातक को राजमान्य, शासकीय सलाहकार, और प्रभावशाली वक्ता बनाता है।", "nakshatra|बुध|पूर्वा फाल्गुनी": "यहाँ बुध जातक को सुंदर अभिव्यक्ति वाला, नाटक व कला का प्रेमी, और समाज में लोकप्रिय बनाता है।", "nakshatra|बुध|उत्तरा फाल्गुनी": "सिंह स्थित उत्तरा फाल्गुनी में बुध जातक को न्यायप्रिय, कुशल गणितज्ञ, और प्रशासक बनाता है।\n\n5.3 कन्या, तुला एवं वृश्चिक राशि स्थित नक्षत्र (हस्त, चित्रा, स्वाती, विशाखा, अनुराधा, ज्येष्ठा)", "nakshatra|बुध|हस्त": "कन्या राशि बुध की  स्वराशि  तथा  उच्च राशि  है। कन्या के 15° पर बुध  परमोच्च  होता है। हस्त नक्षत्र में स्थित बुध जातक को अद्वितीय गणितीय क्षमता, अपार व्यापारिक चातुर्य, कुशल शिल्पकला और शास्त्रीय ज्ञान प्रदान करता है।", "nakshatra|बुध|चित्रा": "कन्या के 15° से 20° तक बुध का मूलत्रिकोण क्षेत्र और 20° से 30° तक स्वराशि क्षेत्र है। चित्रा नक्षत्र के प्रथम दो चरणों में बुध परम बलवान होकर जातक को प्रखर विद्वान बनाता है। तुला में प्रवेश पर जातक व्यावसायिक सौंदर्यशास्त्र में निपुण होता है।", "nakshatra|बुध|स्वाती": "तुला राशि (मित्र शुक्र क्षेत्र) स्थित स्वाती में बुध जातक को चतुर व्यापारी, अंतरराष्ट्रीय संबंधों का ज्ञाता, और स्वतंत्र वक्ता बनाता है।", "nakshatra|बुध|विशाखा": "तुला में बुध जातक को बहुमुखी प्रतिभा देता है। चतुर्थ चरण में वृश्चिक राशि (सम मंगल क्षेत्र) में जाने पर जातक की बुद्धि कूटनीतिक और तीक्ष्ण हो जाती है।", "nakshatra|बुध|अनुराधा": "वृश्चिक स्थित अनुराधा में बुध जातक को शोधपरक बुद्धि, गुप्त विद्याओं का ज्ञान, और विदेश यात्राओं से लाभ दिलाता है।", "nakshatra|बुध|ज्येष्ठा": "वृश्चिक स्थित ज्येष्ठा बुध का स्व-नक्षत्र है। यहाँ बुध जातक को प्रखर तार्किक, तीक्ष्ण कूटनीतिज्ञ, किंतु स्वभाव में उद्वेग और वात/पित्त विकार दे सकता है।\n\n5.4 धनु, मकर, कुंभ एवं मीन राशि स्थित नक्षत्र (मूल, पूर्वाषाढ़ा, उत्तराषाढ़ा, श्रवण, धनिष्ठा, शतभिषा, पूर्वा भाद्रपद, उत्तरा भाद्रपद, रेवती)", "nakshatra|बुध|मूल": "धनु राशि (सम गुरु क्षेत्र) स्थित मूल नक्षत्र में बुध जातक को दार्शनिक, वेद-शास्त्रों का अभ्यासी, और उच्च ज्ञानी बनाता है।", "nakshatra|बुध|पूर्वाषाढ़ा": "यहाँ बुध जातक को सरस वक्ता, साहित्यकार, और समाज में आदरणीय बनाता है।", "nakshatra|बुध|उत्तराषाढ़ा": "धनु में बुध जातक को नीतिज्ञ बनाता है। मकर राशि (सम शनि क्षेत्र) में जाने पर जातक अत्यंत व्यावहारिक, अनुशासित और शासकीय लेखों का विशेषज्ञ होता है।", "nakshatra|बुध|श्रवण": "मकर स्थित श्रवण में बुध जातक को बहुश्रुत, चतुर श्रोता, और उच्च कोटि का सलाहकार बनाता है।", "nakshatra|बुध|धनिष्ठा": "मकर स्थित धनिष्ठा में बुध जातक को धन-प्रबंधन में निपुण बनाता है। कुंभ में जाने पर जातक वैज्ञानिक और सामाजिक शोधों में संलग्न होता है।", "nakshatra|बुध|शतभिषा": "कुंभ स्थित शतभिषा में बुध जातक को रहस्यमयी, गूढ़ विषयों का ज्ञाता, और सांख्यिकी (Statistics) का विशेषज्ञ बनाता है।", "nakshatra|बुध|पूर्वा भाद्रपद": "कुंभ में बुध जातक को विचारशील बनाता है। किंतु जैसे ही बुध मीन राशि में चतुर्थ चरण में प्रवेश करता है, यह नीच राशिगत हो जाता है।", "nakshatra|बुध|उत्तरा भाद्रपद": "मीन राशि बुध की  नीच राशि  है। मीन के 15° पर बुध  परम नीच  माना गया है। उत्तरा भाद्रपद स्थित नीच बुध जातक को निर्णय लेने में दुविधा, स्नायु तंत्र (Nervous System) में दुर्बलता, त्वचा रोग, और व्यापारिक हानियाँ दे सकता है।", "nakshatra|बुध|रेवती": "मीन के रेवती नक्षत्र (स्व-नक्षत्र) में स्थित नीच बुध नीचभंग की स्थिति का निर्माण करता है, जिससे जातक व्यावहारिक संघर्षों के पश्चात् कलात्मक और आध्यात्मिक क्षेत्रों में प्रसिद्धि पाता है।\n\nबुध के बौद्धिक व व्यापारिक विमर्श का समापन करते हुए, अब हम देवगुरु बृहस्पति के आध्यात्मिक, सामाजिक और जीवन-मूल्य संबंधी प्रभावों की सांगोपांग विवेचना करेंगे।", "nakshatra|गुरु|अश्विनी": "मेष राशि (मित्र मंगल क्षेत्र) स्थित अश्विनी में गुरु जातक को तेजस्वी ज्ञानी, त्वरित निर्णय लेने वाला धर्मात्मा, और आयुर्वेद का ज्ञाता बनाता है।", "nakshatra|गुरु|भरणी": "मेष स्थित भरणी में गुरु जातक को नियमनिष्ठ, विशाल संपत्ति का स्वामी, और समाज में उच्च पद पाने वाला बनाता है।", "nakshatra|गुरु|कृत्तिका": "मेष स्थित कृत्तिका में गुरु जातक को प्रखर वेदांती और तीक्ष्ण बुद्धि वाला बनाता है। वृष राशि (शत्रु शुक्र क्षेत्र) में प्रवेश करने पर जातक व्यावहारिक ज्ञान और भौतिक धन संचय में रुचि लेता है।", "nakshatra|गुरु|रोहिणी": "वृष स्थित रोहिणी में गुरु जातक को अत्यंत सुंदर, कला-संगीत का मर्मज्ञ, धनी, और संस्कारी संतान वाला बनाता है।", "nakshatra|गुरु|मृगशिरा": "वृष स्थित मृगशिरा में गुरु जातक को धर्म-शास्त्रों का शोधकर्ता, मिष्ठान्न प्रिय, और सुवक्ता बनाता है।\n\n6.2 मिथुन, कर्क एवं सिंह राशि स्थित नक्षत्र (आर्द्रा, पुनर्वसु, पुष्य, आश्लेषा, मघा, पूर्वा फाल्गुनी, उत्तरा फाल्गुनी)", "nakshatra|गुरु|आर्द्रा": "मिथुन राशि (शत्रु बुध क्षेत्र) स्थित आर्द्रा में गुरु जातक को तीक्ष्ण बुद्धि देता है, किंतु विचारों में कभी-कभी संशय या द्वंद्व उत्पन्न करता है।", "nakshatra|गुरु|पुनर्वसु": "पुनर्वसु गुरु का स्व-नक्षत्र है। मिथुन में यह महान विद्वान बनाता है। चतुर्थ चरण में कर्क राशि में प्रवेश करते ही गुरु अपनी  उच्च राशि  में पहुँच जाता है।", "nakshatra|गुरु|पुष्य": "कर्क राशि गुरु की  उच्च राशि  है और कर्क के 5° पर गुरु  परमोच्च  होता है। पुष्य नक्षत्र में परमोच्च स्थित गुरु जातक को महाज्ञानी, राजा का मुख्य सलाहकार या मंत्री, अपार धन-संपदा से परिपूर्ण, परम धार्मिक, जितेंद्रीय, और समाज में सर्वोच्च सम्मानित पद प्रदान करता है।", "nakshatra|गुरु|आश्लेषा": "कर्क स्थित आश्लेषा में उच्च का गुरु जातक को अत्यंत गूढ़ नीतिज्ञ, कूटनीति का आचार्य, और आध्यात्मिक शक्तियों का स्वामी बनाता है।", "nakshatra|गुरु|मघा": "सिंह राशि (मित्र सूर्य क्षेत्र) स्थित मघा में गुरु जातक को राजा के समान प्रतापी, कुलीन, पितृभक्त, और विशाल संपत्ति का स्वामी बनाता है।", "nakshatra|गुरु|पूर्वा फाल्गुनी": "यहाँ गुरु जातक को सर्वप्रिय, दानवीर, सुंदर, और कला व साहित्य का आदर करने वाला बनाता है।", "nakshatra|गुरु|उत्तरा फाल्गुनी": "सिंह स्थित उत्तरा फाल्गुनी में गुरु जातक को निष्पक्ष न्यायाधीश, प्रशासक, और धर्मनिष्ठ नेता बनाता है।\n\n6.3 कन्या, तुला एवं वृश्चिक राशि स्थित नक्षत्र (हस्त, चित्रा, स्वाती, विशाखा, अनुराधा, ज्येष्ठा)", "nakshatra|गुरु|हस्त": "कन्या राशि (शत्रु बुध क्षेत्र) स्थित हस्त में गुरु जातक को व्यावहारिक ज्ञान, शिल्प व वाणिज्य में सफलता, और धार्मिक अनुष्ठानों में रुचि प्रदान करता है।", "nakshatra|गुरु|चित्रा": "कन्या स्थित चित्रा में गुरु जातक को योजनाकार बनाता है। तुला राशि (शत्रु शुक्र क्षेत्र) में प्रवेश करने पर गुरु जातक को वैवाहिक जीवन में समायोजन और व्यावहारिक न्याय की प्रेरणा देता है।", "nakshatra|गुरु|स्वाती": "तुला स्थित स्वाती नक्षत्र में गुरु जातक को स्वतंत्र व्यापारी, धार्मिक, जनप्रिय, और न्यायविद बनाता है।", "nakshatra|गुरु|विशाखा": "विशाखा गुरु का स्व-नक्षत्र है। तुला में यह जातक को महामहत्वाकांक्षी बनाता है। चतुर्थ चरण में अपनी मित्र राशि वृश्चिक (मंगल क्षेत्र) में जाने पर गुरु की सात्त्विक ऊर्जा और बढ़ जाती है।", "nakshatra|गुरु|अनुराधा": "वृश्चिक स्थित अनुराधा में गुरु जातक को विदेश में अपार मान-सम्मान, आध्यात्मिक साधना, और गुप्त विद्याओं में महारत देता है।", "nakshatra|गुरु|ज्येष्ठा": "वृश्चिक स्थित ज्येष्ठा में गुरु जातक को आत्मज्ञानी, प्रखर वक्ता, और शत्रुओं पर विजय प्राप्त करने वाला बनाता है।\n\n6.4 धनु, मकर, कुंभ एवं मीन राशि स्थित नक्षत्र (मूल, पूर्वाषाढ़ा, उत्तराषाढ़ा, श्रवण, धनिष्ठा, शतभिषा, पूर्वा भाद्रपद, उत्तरा भाद्रपद, रेवती)", "nakshatra|गुरु|मूल": "धनु गुरु की  स्वराशि  है और 0° से 10° तक गुरु का  मूलत्रिकोण  क्षेत्र है। मूल नक्षत्र में स्थित गुरु जातक को परम सात्त्विक, वेदों का प्रकांड विद्वान, आचार्य पद, और सर्वोन्नति प्रदान करता है।", "nakshatra|गुरु|पूर्वाषाढ़ा": "धनु राशि के 10° से 30° तक स्वराशि क्षेत्र में पूर्वाषाढ़ा स्थित गुरु जातक को अपार यश, धन-संपदा, राजपक्ष से लाभ, और सुखी पारिवारिक जीवन देता है।", "nakshatra|गुरु|उत्तराषाढ़ा": "धनु में गुरु स्वगृही फल देता है। किंतु जैसे ही गुरु मकर राशि (सम शनि क्षेत्र) में प्रवेश करता है, यह नीच राशि में चला जाता है।", "nakshatra|गुरु|श्रवण": "मकर राशि गुरु की  नीच राशि  है और मकर के 5° पर गुरु  परम नीच  माना गया है। उत्तराषाढ़ा के द्वितीय चरण में मकर 5° पर स्थित नीच गुरु जातक के धर्म, भाग्य, धन-संचय और संतान सुख में बाधाएँ दे सकता है। किंतु श्रवण नक्षत्र में नीच राशिगत गुरु होने पर शनि का नक्षत्र प्रभाव जातक को व्यावहारिक संघर्षों के पश्चात् सफलता देता है।", "nakshatra|गुरु|धनिष्ठा": "मकर स्थित धनिष्ठा में नीच गुरु जातक को भौतिकवादी दृष्टिकोण देता है। कुंभ राशि (शनि क्षेत्र) में जाने पर गुरु सामाजिक कल्याण और ज्ञान वितरण की ओर बढ़ता है।", "nakshatra|गुरु|शतभिषा": "कुंभ स्थित शतभिषा में गुरु जातक को दार्शनिक, वैज्ञानिक, और रहस्यमयी विद्याओं का ज्ञाता बनाता है।", "nakshatra|गुरु|पूर्वा भाद्रपद": "पूर्वा भाद्रपद गुरु का स्व-नक्षत्र है। कुंभ में यह विचारक बनाता है, और मीन राशि (गुरु की अपनी स्वराशि) के चतुर्थ चरण में प्रवेश करते ही जातक को आध्यात्मिक मोक्ष की ओर ले जाता है।", "nakshatra|गुरु|उत्तरा भाद्रपद": "मीन राशि स्थित उत्तरा भाद्रपद में गुरु स्वगृही होकर जातक को परम शांत, जितेंद्रीय, शास्त्रज्ञ, और सर्वत्र सम्मानित बनाता है।", "nakshatra|गुरु|रेवती": "मीन के रेवती नक्षत्र में स्थित गुरु जातक को महाधनी, सुखी, ज्ञानी, और सद्गति प्राप्त करने वाला परम सात्त्विक पुरुष बनाता है।", "nakshatra|शुक्र|अश्विनी": "शुक्र यहां उग्रता और गति प्राप्त करता है। जातक सुंदर, शीघ्र कामुक होने वाला, वाहन-प्रेमी, किंतु वैवाहिक जीवन में उतावलेपन के कारण तनाव पाने वाला होता है।", "nakshatra|शुक्र|भरणी": "स्व-नक्षत्र। शुक्र जातक को अत्यंत कामुक, वस्त्र-आभूषण प्रेमी, सुंदर आंखों वाला, कलात्मक और भौतिक सुखों का उपभोग करने वाला बनाता है।", "nakshatra|शुक्र|कृत्तिका": "सूर्य के प्रभाव से शुक्र के सौम्यता में कमी आती है। जातक तेजस्वी, तीक्ष्ण स्वभाव, आभूषण-प्रेमी किंतु जीवनसाथी के साथ अहम के टकराव से पीड़ित रहता है।", "nakshatra|शुक्र|रोहिणी": "शुक्र अपनी स्वराशि व चंद्रमा के नक्षत्र में अत्यंत शुभ होता है। जातक मधुरभाषी, असीम सुंदर, धनी, कला-संगीत में निपुण और पूर्ण स्त्री-सुख प्राप्त करने वाला होता है।", "nakshatra|शुक्र|मृगशिरा": "जातक शौकीन, सौंदर्य का अनुरागी, यात्राएं करने वाला, वस्त्र व आभूषणों के व्यापार में कुशल किंतु चंचल मन वाला होता है।", "nakshatra|शुक्र|आर्द्रा": "राहु के प्रभाव से शुक्र भ्रम और अनैतिकता दे सकता है। जातक काम-वासना में अतिवादी, गुप्त संबंधों की ओर झुकाव रखने वाला और वैवाहिक सुख में रुकावटें झेलने वाला होता है।", "nakshatra|शुक्र|पुनर्वसु": "जातक धार्मिक, सुसंस्कृत, विद्वान, सुंदर व निष्ठावान जीवनसाथी पाने वाला, काव्य प्रेमी और समृद्ध होता है।", "nakshatra|शुक्र|पुष्य": "जातक गंभीर, वफादार, स्थिर संपत्ति का स्वामी, स्त्रियों का आदर करने वाला और जल या पेय पदार्थों के व्यापार से लाभ पाने वाला होता है।", "nakshatra|शुक्र|आश्लेषा": "जातक चालाक, कलात्मक वार्तालाप में चतुर, कामुक, किंतु व्यसनों या असत्य आचरण से धन व स्वास्थ्य का नुकसान करने वाला होता है।", "nakshatra|शुक्र|मघा": "जातक अभिमानी, वैभवशाली, उच्च वर्गीय स्त्रियों से संपर्क रखने वाला, किंतु संतान या पत्नी के स्वास्थ्य को लेकर चिंतित रहने वाला होता है।", "nakshatra|शुक्र|पूर्वा फाल्गुनी": "स्व-नक्षत्र। जातक अत्यंत भाग्यशाली, संगीत-नृत्य प्रेमी, विलासी, लोकप्रिय, सुंदर रूप-रंग वाला और उत्सवों का प्रेमी होता है।", "nakshatra|शुक्र|उत्तरा फाल्गुनी": "जातक राजकीय कार्यों से धन कमाने वाला, उच्च पद पाने वाला, किंतु वैवाहिक जीवन में मधुरता की कमी महसूस करने वाला होता है।", "nakshatra|शुक्र|हस्त": "कन्या राशि में शुक्र नीच का होता है। जातक कलात्मक, हस्तशिल्प में निपुण, किंतु अत्यधिक कामुकता के कारण बदनाम या स्वास्थ्य समस्याओं से घिरने वाला होता है।", "nakshatra|शुक्र|चित्रा": "तुला राशि का भाग शुक्र को बल प्रदान करता है। जातक फैशन, डिजाइनिंग, आभूषण व चित्रकला का शौकीन तथा भव्य जीवनशैली जीने वाला होता है।", "nakshatra|शुक्र|स्वाती": "स्वराशि व राहु नक्षत्र। जातक स्वतंत्र विचारों वाला, व्यापार में अत्यधिक सफल, विदेशी वस्तुओं का शौकीन और लोकप्रिय होता है।", "nakshatra|शुक्र|विशाखा": "जातक महत्वाकांक्षी, व्यापारिक लाभ अर्जित करने वाला, सुंदर किंतु स्वभाव में थोड़ा ईर्ष्या रखने वाला होता है।", "nakshatra|शुक्र|अनुराधा": "जातक विदेश यात्रा करने वाला, गुप्त कलाओं का प्रेमी, वफादार मित्र बनाने वाला और विषम परिस्थितियों में भी धन कमाने वाला होता है।", "nakshatra|शुक्र|ज्येष्ठा": "जातक बुद्धिमान, वाकपटु, किंतु कामुकता में नियंत्रण न रखने के कारण विवादों और प्रमेह आदि रोगों में फंसने वाला होता है।", "nakshatra|शुक्र|मूल": "जातक सुख-सुविधाओं का त्याग करने की प्रवृत्ति रखने वाला, दार्शनिक, किंतु वैवाहिक सुख में भारी उतार-चढ़ाव देखने वाला होता है।", "nakshatra|शुक्र|पूर्वाषाढ़ा": "स्व-नक्षत्र। जातक अत्यंत प्रभावशाली, असीम धन-संपत्ति का स्वामी, सुंदर, जल संबंधी कार्यों से लाभ पाने वाला और लोकप्रिय होता है।", "nakshatra|शुक्र|उत्तराषाढ़ा": "जातक विनम्र, आदरणीय, समाज में प्रतिष्ठित, सत्यप्रिय और स्थिर संपत्ति प्राप्त करने वाला होता है।", "nakshatra|शुक्र|श्रवण": "जातक संगीत प्रेमी, उत्तम विद्या अर्जित करने वाला, स्त्रियों में प्रिय और वाहन सुख प्राप्त करने वाला होता है।", "nakshatra|शुक्र|धनिष्ठा": "जातक धनवान, गान-विद्या में रुचि रखने वाला, बहुमूल्य रत्न व आभूषण धारण करने वाला और भव्य भवन का स्वामी होता है।", "nakshatra|शुक्र|शतभिषा": "जातक रहस्यमयी सुखों का भोग करने वाला, सट्टे या आकस्मिक साधनों से धन कमाने वाला, किंतु गुप्त रोगों से पीड़ित रहने वाला होता है।", "nakshatra|शुक्र|पूर्वा भाद्रपद": "मीन राशिगत शुक्र उच्च का होता है। जातक परम ज्ञानी, उदार, त्यागी, असीम सुख-सुविधाएं पाने वाला और अध्यात्म प्रेमी होता है।", "nakshatra|शुक्र|उत्तरा भाद्रपद": "उच्च शुक्र का यह चरण जातक को दीर्घायु, स्थिर धन, धर्मात्मा, सर्वप्रिय और शांत वैवाहिक जीवन प्रदान करता है।", "nakshatra|शुक्र|रेवती": "परम उच्च स्थिति (२७°)। जातक अद्वितीय सुंदर, निष्पाप, काव्य-कला में प्रवीण, विशाल धन-निधि का स्वामी और पूर्ण स्त्री-सुख भोगने वाला होता है।", "nakshatra|शनि|अश्विनी": "मेष राशि में शनि नीच का होता है। जातक क्रोधी, दरिद्र, पैरों में चोट से पीड़ित, आलसी और असफलताओं से घिरा रहने वाला होता है।", "nakshatra|शनि|भरणी": "जातक नीच कर्मों की ओर झुकने वाला, अत्यधिक संघर्ष करने वाला, स्त्रियों से विवाद रखने वाला और स्वास्थ्य से कमजोर होता है।", "nakshatra|शनि|कृत्तिका": "जातक कठोर स्वभाव, तीक्ष्ण वाणी, पिता से मतभेद रखने वाला, किंतु एकांतप्रिय और अनुशासित होता है।", "nakshatra|शनि|रोहिणी": "जातक कृषि, भूमि या जल संबंधी कार्यों से धन कमाने वाला, स्वभाव से धीर-गंभीर और स्थिर संपत्ति वाला होता है।", "nakshatra|शनि|मृगशिरा": "जातक शंकालु, तकनीकी या लोहे के काम में कुशल, मेहनती किंतु भाइयों से अनबन रखने वाला होता है।", "nakshatra|शनि|आर्द्रा": "जातक चतुर, कपटी, दुखी, वात रोगों से पीड़ित, समाज से अलग रहने वाला और कठिन परिश्रम से आजीविका चलाने वाला होता है।", "nakshatra|शनि|पुनर्वसु": "जातक न्यायप्रिय, सिद्धांतों पर चलने वाला, विलंब से सफलता पाने वाला, किंतु समाज में सम्मानित होता है।", "nakshatra|शनि|पुष्य": "स्व-नक्षत्र। जातक अत्यंत गंभीर, स्थिर चित्त, लोक-कल्याणकारी, जल या खनन कार्यों से धन कमाने वाला और दीर्घायु होता है।", "nakshatra|शनि|आश्लेषा": "जातक कुटिल, दूसरों को धोखा देने वाला, मानसिक तनाव से ग्रस्त और अशुचि (अपवित्र) रहने वाला होता है।", "nakshatra|शनि|मघा": "जातक अभिमानी, कड़ा संघर्ष करने वाला, पैतृक संपत्ति से वंचित रहने वाला और हृदय या उदर रोगों से पीड़ित होता है।", "nakshatra|शनि|पूर्वा फाल्गुनी": "जातक विलास की वस्तुओं के निर्माण या मजदूरी से धन कमाने वाला, आलसी और वैवाहिक सुख में विलंब पाने वाला होता है।", "nakshatra|शनि|उत्तरा फाल्गुनी": "जातक सरकारी या प्रशासनिक क्षेत्र में निचले स्तर पर कार्य करने वाला, अनुशासित किंतु एकाकी होता है।", "nakshatra|शनि|हस्त": "जातक कड़ा शारीरिक श्रम करने वाला, चतुर कारीगर या तकनीशियन, किंतु मन में उदासी रखने वाला होता है।", "nakshatra|शनि|चित्रा": "तुला राशि में शनि उच्च का होता है। जातक महान शिल्पी, निर्माण कार्यों का प्रमुख, अधिकार संपन्न, न्यायप्रिय और धनी होता है।", "nakshatra|शनि|स्वाती": "उच्च स्थिति (२०°)। जातक अंतरराष्ट्रीय व्यापार, कानून या सार्वजनिक नीति में अत्यधिक सफल, चतुर और अपार धन अर्जित करने वाला होता है।", "nakshatra|शनि|विशाखा": "जातक महत्वाकांक्षी, विलंब से लक्ष्य प्राप्त करने वाला, न्यायमूर्तियों या सलाहकारों जैसा जीवन जीने वाला होता है।", "nakshatra|शनि|अनुराधा": "स्व-नक्षत्र। जातक विदेश में सफलता पाने वाला, निडर, कठिनाइयों को परास्त करने वाला और गुप्त विद्याओं का ज्ञानी होता है।", "nakshatra|शनि|ज्येष्ठा": "जातक कुटिल वाणी वाला, वात रोग से पीड़ित, नीच संगति में रहने वाला और कड़े संघर्ष का सामना करने वाला होता है।", "nakshatra|शनि|मूल": "जातक दार्शनिक, वैरागी, पुरानी परंपराओं को तोड़ने वाला, किंतु निर्धनता या शारीरिक कष्ट झेलने वाला होता है।", "nakshatra|शनि|पूर्वाषाढ़ा": "जातक कलात्मक वस्तुओं का निर्माण करने वाला, जल से जुड़े उद्योगों में सफल, किंतु स्वभाव से जिद्दी होता है।", "nakshatra|शनि|उत्तराषाढ़ा": "मकर राशि में शनि स्वगृही होता है। जातक अत्यंत अनुशासित, सत्यवादी, विशाल साम्राज्य या संस्था का निर्माण करने वाला और निष्ठावान होता है।", "nakshatra|शनि|श्रवण": "जातक ज्ञान का साधक, सेवाभावी, प्रसिद्ध, इतिहास या पुरानी वस्तुओं का संरक्षक और दीर्घायु होता है।", "nakshatra|शनि|धनिष्ठा": "कुंभ राशि में शनि मूलत्रिकोण (०°-२०°) में होता है। जातक अपार धन, अचल संपत्ति, लोहा/मशीनरी का स्वामी और महान संगठक होता है।", "nakshatra|शनि|शतभिषा": "स्वराशि व राहु नक्षत्र। जातक वैज्ञानिक, शोधकर्ता, गुप्त युक्तियों से शत्रुओं का नाश करने वाला, किंतु अकेलापन भोगने वाला होता है।", "nakshatra|शनि|पूर्वा भाद्रपद": "जातक गंभीर विचारक, त्यागी, सिद्धांतों के लिए कष्ट सहने वाला और आध्यात्मिक दृष्टि से उन्नत होता है।", "nakshatra|शनि|उत्तरा भाद्रपद": "स्व-नक्षत्र। जातक परम शांत, धर्म-परायण, दूसरों को आश्रय देने वाला, धनवान और मृत्यु के भय से मुक्त होता है।", "nakshatra|शनि|रेवती": "जातक नम्र, कला प्रेमी, यात्राओं से लाभ पाने वाला, किंतु बुढ़ापे में स्वास्थ्य संबंधी निर्बलता झेलने वाला होता है।", "nakshatra|राहु|अश्विनी": "जातक अत्यंत उतावला, तेज गति के वाहनों से भ्रमित, सिर में दुर्घटना की संभावना रखने वाला और आकस्मिक साहसिक निर्णय लेने वाला होता है।", "nakshatra|राहु|भरणी": "काम-वासना का अत्यधिक विस्तार; जातक अनैतिक सुखों के प्रति आकर्षित होकर सामाजिक मर्यादाएं तोड़ता है।", "nakshatra|राहु|कृत्तिका": "सत्ता और प्रभुत्व की अंधी दौड़; जातक अधिकारियों से शत्रुता मोल लेता है तथा आंख या त्वचा विकारों से पीड़ित होता है।", "nakshatra|राहु|रोहिणी": "कल्पनाशीलता का अतिरेक; जातक कला, सिनेमा या ग्लैमराइज्ड मीडिया से अपार धन कमाता है किंतु मानसिक भ्रम का शिकार रहता है।", "nakshatra|राहु|मृगशिरा": "जातक की बुद्धि शंकालु और कपटपूर्ण प्रपंचों में लीन रहती है; भाइयों से विश्वासघात की आशंका रहती है।", "nakshatra|राहु|आर्द्रा": "स्व-नक्षत्र।  (तुलनात्मक विश्लेषण: आर्द्रा में राहु मस्तिष्क की बौद्धिक क्षमताओं का भयंकर विस्तार करता है—जातक कूटनीति, कंप्यूटर टेक्नोलॉजी या वैज्ञानिक अनुसंधान में शीर्ष छूता है किंतु भयंकर तृष्णा व मानसिक अशांति झेलता है; जबकि केतु आर्द्रा में आकर सांसारिक आघात देकर व्यक्ति को संसार से काट देता है) ।", "nakshatra|राहु|पुनर्वसु": "जातक अपने ज्ञान और धार्मिकता का ढोंग या दिखावा करके समाज में भौतिक लाभ अर्जित करता है।", "nakshatra|राहु|पुष्य": "जातक कुटिल साधनों से संपत्ति जुटाने का प्रयास करता है; जल-भय और नीच संगति का शिकार बनता है।", "nakshatra|राहु|आश्लेषा": "जातक विषैली व छलपूर्ण वाणी बोलने वाला, परापर निंदक और कुष्ठ या पामा (खुजली) जैसे त्वचा विकारों से पीड़ित होता है।", "nakshatra|राहु|मघा": "पैतृक परंपराओं का विरोधी; जातक सत्ता हथियाने के लिए किसी भी सीमा तक छल-प्रपंच का प्रयोग करता है।", "nakshatra|राहु|पूर्वा फाल्गुनी": "विलासिता और काम-भोग का प्रचंड विस्तार; जातक सट्टे, जुए या पर-स्त्रियों के संपर्क से धन लुटाता है।", "nakshatra|राहु|उत्तरा फाल्गुनी": "जातक समाज में झूठी प्रतिष्ठा का दिखावा करता है और शासकीय दण्ड के भय में जीता है।", "nakshatra|राहु|हस्त": "जातक सम्मोहन, जादू-टोना या छल-कपट की कला में निपुण होकर दूसरों को ठगने की प्रवृत्ति रखता है।", "nakshatra|राहु|चित्रा": "भड़कीले फैशन, दिखावे और वासनात्मक रूप-रंग का आकर्षण; जातक शस्त्र से आघात का भय रखता है।", "nakshatra|राहु|स्वाती": "स्व-नक्षत्र। अंतर्राष्ट्रीय व्यापार में अभूतपूर्व सफलता; जातक वाकपटुता से विदेशी धन व वैभव समेटता है।", "nakshatra|राहु|विशाखा": "जातक अत्यंत स्वार्थी और ईर्ष्यालु बनता है; अपने भौतिक लक्ष्यों के लिए किसी का भी अहित कर सकता है।", "nakshatra|राहु|अनुराधा": "जातक गुप्त षड्यंत्रों से धन कमाता है, विदेश में बसता है, किंतु आंतों या उदर के जटिल रोगों से ग्रसित रहता है।", "nakshatra|राहु|ज्येष्ठा": "चालाकी का पराकाष्ठा; जातक असत्य भाषण और दूसरों को नीचा दिखाने में महारत रखता है।", "nakshatra|राहु|मूल": "जातक जीवन में भयंकर उथल-पुथल के बीच धन व शक्ति की पुनर्प्राप्ति के लिए तांत्रिक या गुप्त मार्ग अपनाता है।", "nakshatra|राहु|पूर्वाषाढ़ा": "जल संबंधी व्यवसायों से अकूत धन-लाभ, किंतु काम-वासना के अतिरेक के कारण सार्वजनिक अपमान।", "nakshatra|राहु|उत्तराषाढ़ा": "राजनीतिक महत्वाकांक्षा की पूर्ति; जातक कूटनीतिक चालों से उच्च प्रशासनिक पद प्राप्त करता है।", "nakshatra|राहु|श्रवण": "दूसरों की गुप्त बातें सुनने और अफवाहें फैलाने में कुशल; कान के असाध्य रोगों से पीड़ित।", "nakshatra|राहु|धनिष्ठा": "मशीनों, लोहे और तकनीकी साधनों से आकस्मिक धन-लाभ; जातक अत्यंत क्रोधी और हिंसक प्रवृत्तियों वाला होता है।", "nakshatra|राहु|शतभिषा": "स्व-नक्षत्र। जातक सौ असाध्य रोगों को छिपाने वाला, रहस्यमयी शोधकर्ता या चिकित्सक बनता है, किंतु घोर एकाकी रहता है।", "nakshatra|राहु|पूर्वा भाद्रपद": "दोहरा चरित्र; दुनिया के सामने परम ज्ञानी तथा भीतर से घोर विलासी और छली।", "nakshatra|राहु|उत्तरा भाद्रपद": "जातक एकांत में गुप्त व्यसनों/नशों का सेवन करता है, किंतु अंततः परिस्थितियों से समझौता करता है।", "nakshatra|राहु|रेवती": "काल्पनिक संसार में जीने वाला; जातक कूट साधनों से धन कमाता है और पैरों/अंगूठे की बीमारियों से पीड़ित होता है।", "nakshatra|केतु|अश्विनी": "स्व-नक्षत्र। जातक अत्यंत तीक्ष्ण बुद्धि, त्वरित निर्णय लेने वाला, शल्य-चिकित्सक (सर्जन) जैसा दिमाग रखने वाला, किंतु शरीर पर व्रण/घाव धारण करने वाला होता है।", "nakshatra|केतु|भरणी": "काम-वासना का abrupt severance (अचानक छेदन); जातक विलासिता से विरक्त होकर वैवाहिक संबंधों का त्याग कर देता है।", "nakshatra|केतु|कृत्तिका": "अहंकार का दमन; जातक सिर दर्द या नेत्र-जलन सहता है और केवल आत्म-समर्पण से शांति पाता है।", "nakshatra|केतु|रोहिणी": "जातक सांसारिक मोह-भंग के कारण मानसिक रूप से व्यथित रहता है, किंतु आकस्मिक आध्यात्मिक ज्ञान प्राप्त करता है।", "nakshatra|केतु|मृगशिरा": "अग्नि या तीक्ष्ण शस्त्र से दुर्घटना का भय; जातक भाइयों से अलगाव रखकर एकांत साधना करता है।", "nakshatra|केतु|आर्द्रा": "(तुलनात्मक विश्लेषण: जहां आर्द्रा का राहु संसार में प्रपंच और विस्तार देता है, वहीं आर्द्रा का केतु जातक को ऐसा भयंकर मानसिक या शारीरिक आघात देता है कि उसका संसार से मोहभंग हो जाता है और वह परम सत्य की खोज में निकल पड़ता है) ।", "nakshatra|केतु|पुनर्वसु": "जातक शास्त्रों का गूढ़ मर्म समझने वाला, निष्काम कर्मयोगी और गृहस्थी के बंधनों से मुक्त होने वाला होता है।", "nakshatra|केतु|पुष्य": "दार्शनिक और वैरागी चित्त; जातक पुरानी असाध्य व्याधियों को सहते हुए आत्म-ज्ञान प्राप्त करता है।", "nakshatra|केतु|आश्लेषा": "जातक की वाणी विषैली (विषवाक्) होती है; वह पेट के घाव/अल्सर से पीड़ित होकर कुसंगति का अंत करता है।", "nakshatra|केतु|मघा": "स्व-नक्षत्र। पैतृक संपत्ति का पूर्ण त्याग (Severance); जातक उच्च आध्यात्मिक अधिकार और तपस्वी स्वभाव प्राप्त करता है।", "nakshatra|केतु|पूर्वा फाल्गुनी": "शय्या-सुख और भौतिक सुखों में अचानक विघ्न; जातक एकांत और विरक्ति की ओर मुड़ता है।", "nakshatra|केतु|उत्तरा फाल्गुनी": "सत्ता और पद का अचानक पतन (पदच्युति); जातक एकाकी जीवन में ईश्वर भक्ति खोजता है।", "nakshatra|केतु|हस्त": "हाथों में तीक्ष्ण घाव के निशान; जातक सूक्ष्म कारीगरी या शल्य-कर्म में निपुण किंतु विरक्त रहता है।", "nakshatra|केतु|चित्रा": "शल्य-चिकित्सा (ऑपरेशन) अथवा शस्त्र-आघात; जातक तीक्ष्ण औजारों का प्रयोग करने वाला होता है।", "nakshatra|केतु|स्वाती": "व्यापार में अचानक भारी घाटा या अचानक विरक्ति; जातक अनियंत्रित मानसिक अवस्था से गुजरता है।", "nakshatra|केतु|विशाखा": "हठयोगी और कठोर तपस्वी; जातक भोजन-छाया त्यागकर आत्यंतिक साधना की ओर अग्रसर होता है।", "nakshatra|केतु|अनुराधा": "गुप्त रहस्यों का भेदी; जातक विदेश में एकांतवास करता है और अति-कृश शरीर वाला होता है।", "nakshatra|केतु|ज्येष्ठा": "तीक्ष्ण-कटु वाणी (विषवाक्); जातक शत्रुओं पर विनाशकारी आघात करता है और स्वयं मानसिक पीड़ा झेलता है।", "nakshatra|केतु|मूल": "स्व-नक्षत्र। आध्यात्मिक अनुसंधानों का शिखर; जातक सांसारिक बंधनों को जड़ से काटकर परम वैरागी बनता है।", "nakshatra|केतु|पूर्वाषाढ़ा": "जल-भय; स्त्रियों से भारी धोखा या आघात मिलने के उपरांत जातक सांसारिक सुख त्याग देता है।", "nakshatra|केतु|उत्तराषाढ़ा": "निष्काम कर्म; जातक अहंकार-शून्य होकर महान आध्यात्मिक या सामाजिक कार्य संपन्न करता है।", "nakshatra|केतु|श्रवण": "मौन व्रत का साधक; जातक कान के कष्ट/बहरापन झेलते हुए अंतर्मुखी साधना में लीन रहता है।", "nakshatra|केतु|धनिष्ठा": "दुर्घटना, चोट या अग्नि से शारीरिक क्षति; किंतु जातक अत्यंत निडर और त्यागी होता है।", "nakshatra|केतु|शतभिषा": "विषैली औषधियों के सेवन या असाध्य रोगों से पीड़ा; जातक घोर रहस्यमयी संन्यासी जैसा जीवन जीता है।", "nakshatra|केतु|पूर्वा भाद्रपद": "जातक इस संसार को पूर्णतः असत्य (मिथ्या) मानकर मोक्ष-प्राप्ति की साधना में रत होता है।", "nakshatra|केतु|उत्तरा भाद्रपद": "पूर्ण आत्म-नियंत्रित योग साधक; जातक योगक्रिया द्वारा ऐहिक शरीर का त्याग करने का सामर्थ्य रखता है।", "nakshatra|केतु|रेवती": "जीवन के अंतिम चरण में सर्वस्व त्यागकर परम मोक्ष (कैवल्य) प्राप्त करने वाला शांतचित्त जातक।\n\nनक्षत्र-ग्रह सम्मिश्रण का जीवन एवं कर्मफल पर एकीकृत प्रभाव\n\nफलदीपिका  का यह १०८-घटकीय नक्षत्र-ग्रह ढांचा यह सिद्ध करता है कि कोई ग्रह केवल राशि या भाव में बैठकर ही अंतिम फल तय नहीं करता। जब  शुक्र  जैसा सौम्य ग्रह  रेवती  (बुध नक्षत्र, मीन राशि) में स्थित होता है, तो वह अपने उच्च बल और सौम्य नक्षत्र के सम्मिश्रण से जातक को असीम धन, कलात्मक ख्याति और अलौकिक सुख प्रदान करता है; परंतु वही शुक्र जब  आर्द्रा  (राहु नक्षत्र) में होता है, तो भौतिक चमक-धमक देकर भी वैवाहिक जीवन में भयंकर छल और विकृति पैदा करता है। इसी प्रकार  शनि  का  चित्रा  या  स्वाती  नक्षत्र में होना जातक को निर्माण व न्याय के क्षेत्र में सर्वोच्च अधिकार पद देता है, जबकि  अश्विनी  में इसका होना नीचता और दरिद्रता का कारण बनता है।  राहु व केतु  जिस नक्षत्र में बैठते हैं, उस नक्षत्र के स्वामी की ऊर्जा को सोखकर (छाया ग्रह के रूप में) क्रमशः तृष्णा-विस्तार अथवा विरक्ति-छेदन के रूप में आकस्मिक फल देते हैं।", "yuti|सूर्य+चंद्र": "अग्नि (सूर्य) और जल (चंद्रमा) का यह संयोग आत्मा और मन का एकीकरण है।  फलदीपिका  के अनुसार, यह युति जातक को यंत्र-मंत्र-तंत्र या शल्य-क्रिया में कुशल बना सकती है, किंतु मानसिक स्तर पर यह 'अमावस संताप' उत्पन्न करती है। मन (चंद्र) सूर्य के ताप से विचलित होता है, जिससे जातक में आत्म-संदेह, माता के स्वास्थ्य में उतार-चढ़ाव या वात-कफ रोग पनपते हैं। यदि सात्त्विक प्रभाव हो, तो यह शिव-शक्ति के योग से गहन आत्म-साक्षात्कार भी कराता है।", "yuti|सूर्य+मंगल": "यह सूर्य के पित्त और मंगल के रक्त/पित्त का अत्यंत उग्र मिलन है। दोनों ग्रह क्षत्रिय जाति और सात्त्विक-तामसिक उग्रता के प्रतीक हैं। यह युति जातक को अद्भुत पराक्रमी, साहसी, सेनापति या शस्त्रधारी बनाती है। जातक में प्रशासनिक व नेतृत्व क्षमता कूट-कूटकर भरी होती है। परंतु, इस योग का उग्र अतिरेक व्यवहार में अत्यधिक क्रूरता, रक्त विकार, दुर्घटना का भय और दाह-ज्वर (fever/inflammation) देता है।", "yuti|सूर्य+बुध": "बुध (राजसिक, पृथ्वी तत्व) बुद्धि और वाक्-चातुर्य का कारक है, जबकि सूर्य आत्मा और प्रकाश है।  फलदीपिका  के अनुसार, यह युति जातक को अत्यंत चतुर, मिष्टभाषी, निपुण, विद्वानों द्वारा सम्मानित, गणितज्ञ, तथा राजा या सरकार का प्रिय बनाती है। बुध सूर्य के लिए सम है और सूर्य को मित्र मानता है, इसलिए यह युति जातक की तीक्ष्ण मेधा को प्रज्वलित कर प्रशासनिक व व्यापारिक सफलता देती है।", "yuti|सूर्य+गुरु": "यह सात्त्विक अग्नि और सात्त्विक आकाश तत्व का सर्वोत्तम मिलन है। सूर्य और गुरु परस्पर परम मित्र हैं। यह युति जातक को वेदों व शास्त्रों का महान ज्ञाता, धर्मनिष्ठ, राजा/सरकार का उच्च सलाहकार या मंत्री, उच्च पदस्थ अधिकारी तथा सर्वजन पूजित बनाती है। जातक का चरित्र अत्यंत उज्ज्वल और सात्त्विक होता है, यद्यपि गुरु के अस्त होने पर संतति संबंधी चिंताओं का सामना करना पड़ सकता है।", "yuti|सूर्य+शुक्र": "अग्नि (सूर्य) और काम-विलासी जल (शुक्र) का यह योग परस्पर विरोधी है। शुक्र सूर्य का नैसर्गिक शत्रु है। यह युति जातक को शस्त्र विद्या, कला, काव्य या संगीत में रुचि देती है, किंतु दांपत्य जीवन में भारी तनाव उत्पन्न करती है। सूर्य की प्रचंड ऊष्मा शुक्र के सौम्य विलास को भस्म कर देती है, जिससे काम-वासना का अतिरेक, नेत्र रोग, या स्त्रियों के माध्यम से कष्ट व अपमान की स्थिति बनती है।", "yuti|सूर्य+शनि": "सूर्य (अग्नि, पिता, सात्त्विक) और शनि (वायु, पुत्र, तामसिक, नीच जन) का संयोग ज्योतिष का सबसे कड़ा वैचारिक द्वंद्व है। शनि सूर्य को अपना परम शत्रु मानता है। यह युति जीवन में अत्यधिक संघर्ष, पिता-पुत्र के मध्य वैमनस्य, स्वाभिमान को चोट, हड्डियों व वायु विकार के रोग तथा विलंब से सफलता देती है। परंतु यदि यह शुभ भाव में हो, तो जातक को अत्यंत धैर्यवान, कठोर परिश्रमी और जन-नेता बनाती है।", "yuti|सूर्य+राहु": "राहु एक तमोगुणी छाया ग्रह है जो सूर्य के प्रकाश को आच्छादित करने की क्षमता रखता है। सूर्य-राहु की युति 'ग्रहण योग' बनाती है। यह जातक के मन में गंभीर भ्रम, अहम् का असंतुलन, पिता के स्वास्थ्य या जीवन में अरिष्ट, तथा सरकारी कार्यों में अचानक बाधाएं लाती है। जातक कूटनीतिक और छद्म विद्याओं में चतुर हो सकता है, किंतु आत्मिक शांति का अभाव रहता है।", "yuti|सूर्य+केतु": "केतु मोक्ष और अग्नि तत्व का कारक है। जब सूर्य और केतु मिलते हैं, तो सूर्य का आत्म-तेज केतु की विरक्ति से जुड़ जाता है। यह युति जातक को गूढ़ आध्यात्मिक शोधकर्ता, तीक्ष्ण दृष्टि वाला और सांसारिक माया से विरक्त बनाती है। शारीरिक स्तर पर यह शरीर में व्रण (घाव), रक्त संबंधी अशुद्धि, उग्रता और पिता से दूरी या वैराग्य का कारण बनती है।\n\nयुति का नाम,ग्रहों का नैसर्गिक संबंध (सूर्य के संदर्भ में),जीवन पर मुख्य विश्लेषणात्मक प्रभाव", "yuti|चंद्र+मंगल": "स्वभाव व मानसिक स्थिति:  जल (चंद्र) और अग्नि (मंगल) का यह तीक्ष्ण योग जातक को अत्यधिक साहसी, निडर, उग्र बुद्धि और त्वरित निर्णय लेने वाला बनाता है। मन में धैर्य की कमी और शीघ्र क्रोधित होने की प्रवृत्ति रहती है।\n\nस्वास्थ्य:  शरीर में पित्त और मज्जा तत्त्व प्रबल रहता है। उच्च रक्तचाप, रक्त-विकार, अग्नि या दुर्घटना से चोट (व्रण) का भय बना रहता है।\n\nआजीविका:  तांबे (ताम्र) के व्यापार, रसोईघर/अग्नि संबंधी कार्य, शल्य चिकित्सा (सर्जरी), सेना, पुलिस, धातु-उद्योग अथवा भू-संपदा के क्रय-विक्रय से धनार्जन होता है।", "yuti|चंद्र+बुध": "स्वभाव व मानसिक स्थिति:  जल और पृथ्वी तत्त्व तथा चंद्र-बुध की नैसर्गिक मित्रता मन और बुद्धि का अद्भुत संतुलन देती है। जातक वाक्-पटु, अत्यंत चतुर, हास्य-विनोद प्रिय (तपस्वी या गंभीर विषयों में भी मज़ाक ढूंढ़ने वाला) और त्वरितग्राही होता है।\n\nस्वास्थ्य:  स्नायु मंडल (तंत्रिका तंत्र) और त्वचा (खाल) पर बुध का प्रभाव रहता है। बुध के पीड़ित होने पर चर्म रोग या वात-पित्त-कफ का त्रिदोष असंतुलन संभव है।\n\nआजीविका:  लेखन, साहित्य, गणित, लेखा-परीक्षण (अकाउंटेंसी), पीतल/सीसे का व्यापार, शिल्प कला, ज्योतिषाचार्य या वाणिज्यिक परामर्श से आजीविका चलती है।", "yuti|चंद्र+गुरु": "स्वभाव व मानसिक स्थिति:  जल और आकाश तत्त्व का यह पावन मिलन  'गजकेसरी'  सदृश सात्विक प्रभाव उत्पन्न करता है। जातक अत्यंत ज्ञानी, गंभीर, धर्म-परायण, सहृदय, विशाल हृदय वाला और चित्त से सदैव प्रसन्न रहने वाला होता है।\n\nस्वास्थ्य:  कफ प्रकृति की प्रधानता रहती है। शरीर पुष्ट, गौर वर्ण और दीर्घायु से युक्त रहता है। जातक का मानसिक स्वास्थ्य अत्यंत सुदृढ़ रहता है।\n\nआजीविका:  अध्यापन, वेदांत-शास्त्र, राजकीय कोष/खजाने का प्रबंधन, न्यायधीश, मंत्री, धर्माचार्य या स्वर्ण (सोने) व चने के व्यापार से अपार धन कमाता है।", "yuti|चंद्र+शुक्र": "स्वभाव व मानसिक स्थिति:  दोनों सौम्य एवं जल तत्त्वी ग्रह हैं। जातक सौंदर्य-प्रेमी, कोमल स्वभाव, काव्य-कला में रुचि रखने वाला, कामुक और अत्यंत सुख-प्रिय होता है।\n\nस्वास्थ्य:  रसनेन्द्रिय बलिष्ठ होती है। जातक का शरीर सुंदर, कांतिमान और गौर वर्ण का होता है, परंतु अत्यधिक भोग-विलास से मूत्र रोग या कामुक शिथिलता संभव है।\n\nआजीविका:  चांदी (रौप्य), बारीक वस्त्र, श्वेत रेशम, सुगंधित द्रव्य (इत्र), दुग्ध पदार्थ, गायों के क्रय-विक्रय, सिनेमा, संगीत और स्त्री-वर्ग से जुड़े व्यवसायों से भारी लाभ होता है।", "yuti|चंद्र+शनि": "स्वभाव व मानसिक स्थिति:  जल और वायु तत्त्व का यह विरोधाभासी योग मन में 'विष योग' जैसी स्थिति लाता है। जातक गंभीर, एकांतप्रिय, उदासीन, आलसी, अति-चिंतनशील और वैरागी प्रवृत्ति का होता है। मन में अज्ञात भय व्याप्त रहता है।\n\nस्वास्थ्य:  वात रोग, कफ असंतुलन, शरीर में कृशता (दुबलापन), पैरों में पीड़ा और तंद्रा (ऊंघना/आलस्य) की समस्या बनी रहती है।\n\nआजीविका:  लोहे (आयस) का व्यापार, तिल/तेल का व्यवसाय, जीर्ण वस्त्रों का क्रय-विक्रय, कृषि-साधन, श्रम-प्रधान कार्य या निम्न श्रेणी के लोगों के सहयोग से जीवन-यापन होता है।", "yuti|चंद्र+राहु": "स्वभाव व मानसिक स्थिति:  यह ग्रहण योग मन को भ्रमित करता है। जातक कूटनीतिक, शंकित, असत्य बोलने में संकोच न करने वाला, पाखंडी और मानसिक रूप से उद्वेलित रहता है।\n\nस्वास्थ्य:  अनसुलझी मानसिक बीमारियां, चर्म रोग, खुजली, हिचकी, कफ-विकार और अज्ञात विषैले प्रभावों या सर्प-भय से कष्ट संभव है।\n\nआजीविका:  सीसा धातु, छाया-चित्रण (फोटोग्राफी/सिनेमा), कूटनीति, गुप्तचर कार्य, सट्टेबाजी तथा म्लेच्छ/विदेशी संपर्कों से अप्रत्याशित धन लाभ होता है।", "yuti|चंद्र+केतु": "स्वभाव व मानसिक स्थिति:  जातक की वाणी में तीखापन या विषैला प्रभाव होता है। वह स्वभाव से क्रूर, उग्र, एकांतवासी, परंतु तीक्ष्ण अंतर्दृष्टि और गूढ़ आध्यात्मिक झुकाव रखने वाला होता है।\n\nस्वास्थ्य:  शरीर पर घाव या व्रण के स्थायी निशान होते हैं। धूम्रपान या विषैले द्रव्यों के सेवन से यकृत/रक्त की क्षति का जोखिम रहता है।\n\nआजीविका:  जड़ी-बूटी (औषधि), मिट्टी के पात्र (मृद्भांड), शस्त्र-निर्माण, रसायन विज्ञान, विषैले पदार्थ या गुप्त साधनाओं/तांत्रिक विधियों से आजीविका चलाता है।", "yuti|मंगल+बुध": "तत्व व गुण द्वंद्व:  अग्नि (मंगल) + पृथ्वी (बुध); तामसिक + राजसिक। नैसर्गिक शत्रुता का योग।\n\nफलदीपिका फलादेश:  जातक शिल्पकला में चतुर, अस्त्र-शस्त्र निर्माण में निपुण, सुनार, जड़ी-बूटियों या रसायनों का विक्रेता तथा तर्क-वितर्क में कुशाग्र होता है।\n\nभावगत एवं व्यावहारिक प्रभाव:  यदि यह युति  उपचय भावों (३, ६, ११)  में हो, तो जातक कुशल यांत्रिक (Engineer), शल्य-चिकित्सक (Surgeon) या गणितज्ञ बनता है। यदि यह  दुस्थान (६, ८, १२)  में हो, तो वाणी में कटुता, छल, धोखा देने की प्रवृत्ति और नसों/त्वचा संबंधी विकार उत्पन्न होते हैं।", "yuti|मंगल+गुरु": "तत्व व गुण द्वंद्व:  अग्नि (मंगल) + आकाश (गुरु); तामसिक + सात्विक। परम मित्र योग।\n\nफलदीपिका फलादेश:  जातक विद्वान, विद्यावान, शूरवीर, नगर या सेनापति का प्रमुख, राजा द्वारा सम्मानित और जन-समाज में पूजित होता है।\n\nभावगत एवं व्यावहारिक प्रभाव:   केंद्र (१, ४, ७, १०) या त्रिकोण (५, ९)  में यह योग एक अत्यंत शक्तिशाली 'राजयोग' निर्मित करता है। जातक प्रशासनिक सेवाओं (IAS/IPS), सेना या उच्च राजकीय पदों पर बैठता है। जातक जितेन्द्रिय और धर्मरक्षक होता है।", "yuti|मंगल+शुक्र": "तत्व व गुण द्वंद्व:  अग्नि (मंगल) + जल (शुक्र); तामसिक + राजसिक। सम संबंध।\n\nफलदीपिका फलादेश:  जातक ललित कलाओं का पारखी, सौंदर्यप्रेमी, पशु/वाहन सुख युक्त, व्यापार में चतुर तथा पर-स्त्री/पर-पुरुष में आसक्त रहने वाला होता है।\n\nभावगत एवं व्यावहारिक प्रभाव:   सप्तम या अष्टम भाव  में यह युति प्रचंड कामवासना, वैवाहिक जीवन में कलह और गुप्तांगों में विकार देती है।  चतुर्थ या दशम भाव  में होने पर जातक वास्तुकला (Architecture), फैशन, या सिनेमा-मनोरंजन क्षेत्र से अपार संपत्ति कमाता है।", "yu । फलदीपिका (अध्याय 27) के अनुसार यह 'परम संन्यास योग' (प्रव्रज्या) का सटीक उदाहरण है।\n\nइस युति में यदि  सूर्य  सर्वाधिक बलवान होगा तो जातक सूर्य-संबंधी (शैव/तापस) संन्यासी बनेगा; यदि  गुरु  बलवान होगा तो वह वेदांती/त्रिदंडी संन्यासी बनेगा; यदि  शनि  बलवान होगा तो वह नग्न/कठोर हठयोगी (कापालिक/काषाय) संन्यासी बनेगा।\n\nसकारात्मक:  सर्वोच्च आध्यात्मिक जागृति, कठोर तपस्या में सफलता और सर्व-वासनाओं पर पूर्ण विजय।\n\nनकारात्मक:  गृहस्थ जीवन का पूर्ण विनाश, भौतिक निर्धनता और कठोर भिक्षाटन का जीवन।\n\nआजीविका:  पीठाधीश्वर, जगद्गुरु, परिव्राजक (यात्री साधु), या महामंडलेश्वर।\n\nस्वास्थ्य:  शरीर का अत्यधिक कृश (दूधला/दुबला) होना, गंभीर वात रोग।\n\nमानसिक स्थिति:  सांसारिक मोह-माया से पूर्णतः मुक्त, सच्चिदानंद भाव।", "yuti|सूर्य+शुक्र+शनि+राहु": "सूर्य (तेज) + शुक्र (स्त्री/सुख) + शनि (दुःख/दास्ता) + राहु (कपट/वासना)। यह अत्यंत विषैला और संघर्षमयी योग है।\n\nसकारात्मक:  जोखिम भरे, अनैतिक या निचले स्तर के व्यवसायों से त्वरित धन कमाने की क्षमता।\n\nनकारात्मक:  चरित्र हनन, वैवाहिक जीवन का विनाश, स्त्री वर्ग से प्रतारणा, और कुल-कलंक।\n\nआजीविका:  यदि शनि या राहु बलवान हों, तो मदिरा, चमड़ा उद्योग, तस्कर, या निम्न श्रेणी के मनोरंजन व्यवसाय से जीवन-यापन।\n\nस्वास्थ्य:  प्रजननांगों के गंभीर रोग, वीर्य का दूषित होना, त्वचा का गलना, व वात-पित्त का प्रकोप।\n\nमानसिक स्थिति:  सदैव असंतुष्ट, अति-कामुक और अनैतिक विचारों से ग्रस्त।", "yuti|सूर्य+शुक्र+शनि+केतु": "सूर्य (अग्नि) + शुक्र (जल/सुख) + शनि (वायु/मंद) + केतु (धूम्र/विरक्ति)। कर्मात्मक ऋणों की शुद्धि का कठिन योग।\n\nसकारात्मक:  दुखों को सहने की असीम सहनशक्ति, निस्वार्थ सेवा भाव, और कला का आध्यात्मिक उपयोग।\n\nनकारात्मक:  पारिवारिक सुख का पूर्ण अभाव, पत्नी की अकाल मृत्यु या वियोग, और जीवन भर दरिद्रता।\n\nआजीविका:  यदि शनि या केतु बलवान हों, तो वृद्धाश्रमों, अनाथालयों, या सेवा भाव के स्थानों में कार्य; या साधारण शारीरिक श्रम।\n\nस्वास्थ्य:  प्रजननांगों के विकार, नसों में सुन्नता व लकवा, शरीर पर क्षत/व्रण के निशान।\n\nमानसिक स्थिति:  उदास, विरक्त और नियति के प्रति समर्पित।\n\nबहुग्रह योगों के इस विस्तृत विवेचन के पश्चात, अब किसी भी कु ह योग जातक को किसी विशाल आध्यात्मिक संप्रदाय का स्वामी, संन्यासी या युगदृष्टा विचारक बना देता है। इस योग के मुख्य विश्लेषणात्मक निष्कर्ष निम्नलिखित हैं:\nनैतिक एवं आध्यात्मिक द्वंद्व (Moral and Philosophical Synthesis):  देवगुरु और दैत्यगुरु का एक साथ होना जातक को धर्म-शास्त्र और भौतिक विज्ञान—दोनों का निष्णात विद्वान बनाता है। जहाँ शुक्र जातक को सांसारिक सुखों, विलास और राजकीय वैभव की ओर खींचता है, वहीं गुरु का सात्विक प्रभाव और शनि का कठोर अंकुश उसे अंततः यह बोध कराता है कि यह वैभव क्षणभंगुर है। इसके परिणामस्वरूप जातक सांसारिक दायित्वों को निभाते हुए भी परम सत्य की खोज में रत रहता है।\nवैभव एवं वैराग्य का संतुलन (Balance between Wealth and Austerity):  शुक्र का 'निधि-द्रव्य' तथा गुरु का 'कोशस्थल' कार्यकत्व जातक को अपार संपत्ति, धन-धान्य और राजकीय खजाने का स्वामी या प्रबंधक बनाता है। परंतु, शनि की उपस्थिति उस धन के प्रति जातक में एक अंतर्निहित अनासक्ति उत्पन्न करती है। जातक स्वयं सादे वस्त्र और साधारण जीवन पसंद करता है, जबकि अपनी संपत्ति का उपयोग विशाल जन-कल्याणकारी कार्यों, मंदिरों या शैक्षणिक संस्थानों के निर्माण में करता है।\nनेतृत्व एवं जन-संपर्क (Leadership and Public Influence):  सूर्य का राजसी नेतृत्व, गुरु का आचार्यत्व, शुक्र की जन-प्रियता और शनि का 'नीचजनाश्रय' (आम जनता पर प्रभाव) मिलकर जातक को एक अत्यंत प्रभावशाली जन-नेता या आध्यात्मिक गुरु बनाते हैं। ऐसा व्यक्ति उच्च शासक वर्ग से लेकर समाज के अंतिम व्यक्ति तक समान रूप से आदरणीय होता है और अपनी वाणी से जनमानस की विचारधारा को बदलने की क्षमता रखता है।\nइन तीनों पृथक चतुर्ग्रह संयोजनों के गहन अध्ययन के पश्चात, अब इनका एक एकीकृत तुलनात्मक मूल्यांकन करना अत्यंत आवश्यक है ताकि फलादेश में सूक्ष्मता और सटीकता लाई जा सके।"};</script>

function resolveYuti(members){
  const key = members.join('+');
  if (LIB['yuti|' + key]) return { key, text: LIB['yuti|' + key], note: null };
  let cand = members.slice();
  const tries = [];
  if (cand.includes('केतु')){ cand = cand.filter(g => g !== 'केतु'); tries.push(cand.slice()); }
  if (cand.includes('राहु')){ cand = cand.filter(g => g !== 'राहु'); tries.push(cand.slice()); }
  for (const t of tries){
    const k = t.join('+');
    if (t.length >= 2 && LIB['yuti|' + k]) return { key: k, text: LIB['yuti|' + k], note: 'टिप्पणी: इस पूरे संयोग (' + key + ') की entry library में नहीं है, इसलिए सबसे बड़े मेल खाते उप-संयोग (' + k + ') का फल दिया गया है।' };
  }
  cand = members.slice();
  while (cand.length > 2){
    cand = cand.slice(0, -1);
    const k = cand.join('+');
    if (LIB['yuti|' + k]) return { key: k, text: LIB['yuti|' + k], note: 'टिप्पणी: इस पूरे संयोग (' + key + ') की entry library में नहीं है, इसलिए सबसे बड़े मेल खाते उप-संयोग (' + k + ') का फल दिया गया है।' };
  }
  return { key, text: null, note: null };
}
function subCombos(arr, k){
  if (k === 0) return [[]];
  if (arr.length < k) return [];
  if (arr.length === k) return [arr.slice()];
  const head = arr[0], rest = arr.slice(1);
  return subCombos(rest, k - 1).map(c => [head].concat(c)).concat(subCombos(rest, k));
}

    txt += `${g} | ${p.signName} | ${p.deg} | ${p.nakName} | ${p.bhava}\n`;
  });
  tbl += `<tr><td>लग्न</td><td>${lag.signName}</td><td>${lag.deg}</td><td>${lag.nakName}</td><td>1</td></tr></table>`;
  txt += `लग्न | ${lag.signName} | ${lag.deg} | ${lag.nakName} | 1\n`;
  const occ = {};
  GRAHA.forEach(g => { (occ[P[g].bhava] = occ[P[g].bhava] || []).push(g); });
  secs.push({ part: 'summary', title: 'कुंडली सारांश', html: tbl + '<div class="charttitle">जन्म कुंडली (North Indian)</div>' + drawChart(lag.sign, occ), txt });
  // groups by bhava
  const groups = {};
  for (let b = 1; b <= 12; b++){
    const mem = (occ[b] || []).slice().sort((a, z) => GRAHA.indexOf(a) - GRAHA.indexOf(z));
    if (mem.length >= 2) groups[b] = Object.assign({ bhava: b, members: mem }, resolveYuti(mem));
  }
  // bhavesh ownership: graha -> [bhava,...]
  const owns = {};
  for (let b = 1; b <= 12; b++){
    const lord = LORDS[(lag.sign + b - 1) % 12];
    (owns[lord] = owns[lord] || []).push(b);
  }
  // Part 1: graha vichar
  secs.push({ part: 'graha', parthead: 'भाग 1 - ग्रह विचार' });
  let gSlots = 0;
  GRAHA.forEach(g => {
    const p = P[g];
    const entries = [];
    const add = (title, key, note) => { const t = LIB[key]; if (t) { entries.push({ title, text: t, note: note || null }); } };
    add(`${g} ${p.nakName} नक्षत्र में`, `nakshatra|${g}|${p.nakName}`);
    add(`${g} ${p.signName} राशि में`, `rashi|${g}|${p.signName}`);
    add(`${g} ${OBL[p.bhava - 1]} भाव में`, `bhava|${g}|${p.bhava}`);
    (owns[g] || []).forEach(b => add(`${BHAVESH[b - 1]} ${OBL[p.bhava - 1]} भाव में`, `bhavesh|${BHAVESH[b - 1]}|${p.bhava}`));
    Object.values(groups).filter(gr => gr.members.includes(g)).forEach(gr => {
      if (!gr.text) return;
      const others = gr.members.filter(x => x !== g);
      entries.push({ title: `${g} की ${others.join(', ')} के साथ युति`, text: gr.text, note: gr.note });
    });
    if (CH.asta.has(g)) add(`${g} - अस्त`, `asta|${g}`);
    if (CH.vakri.has(g)) add(`${g} - वक्री`, `vakri|${g}`);
    gSlots += entries.length;
    secs.push({ part: 'graha', title: `${g} विचार`, posline: `${p.signName} राशि - ${p.nakName} नक्षत्र - भाव ${p.bhava}`, entries });
  });
  // Part 2: bhava vichar
  secs.push({ part: 'bhava', parthead: 'भाग 2 - भाव विचार' });
  let bSlots = 0;
  for (let b = 1; b <= 12; b++){
    const lord = LORDS[(lag.sign + b - 1) % 12];
    const lp = P[lord];
    const mem = occ[b] || [];
    const entries = [];
    mem.forEach(g => { const t = LIB[`bhava|${g}|${b}`]; if (t) entries.push({ title: `${g} ${OBL[b - 1]} भाव में`, text: t }); });
    const bt = LIB[`bhavesh|${BHAVESH[b - 1]}|${lp.bhava}`];
    if (bt) entries.push({ title: `${BHAVESH[b - 1]} ${OBL[lp.bhava - 1]} भाव में`, text: bt });
    const gr = groups[b];
    if (gr && gr.text) entries.push({ title: `${gr.members.join(' + ')} - एक भाव में युति`, text: gr.text, note: gr.note });
    if (mem.length >= 3){
      for (let k = mem.length - 1; k >= 2; k--){
        subCombos(mem, k).forEach(sub => {
          const t = LIB['yuti|' + sub.join('+')];
          if (t) entries.push({ title: `${sub.join(' + ')} - ${k} ग्रहों की युति`, text: t });
        });
      }
    }
    bSlots += entries.length;
    secs.push({ part: 'bhava', title: `${BHN[b - 1]} भाव विचार (${BHS[b - 1]})`,
      posline: `स्वामी: ${lord} (${OBL[lp.bhava - 1]} भाव में) - स्थित ग्रह: ${mem.length ? mem.join(', ') : 'कोई नहीं'}`,
      entries, emptyNote: mem.length ? null : 'इस भाव में कोई ग्रह स्थित नहीं है। इस भाव का विचार भावेश की स्थिति से किया गया है।' });
  }
  return { secs, gSlots, bSlots };
}
function renderReport(){
  if (!CH) return;
  const on = {
    summary: document.getElementById('tgl-summary').checked,
    graha: document.getElementById('tgl-graha').checked,
    bhava: document.getElementById('tgl-bhava').checked
  };
  const { secs, gSlots, bSlots } = buildModel(CH.P);
  let html = '', txt = 'फलित रिपोर्ट\n', total = 0;
  secs.forEach(s => {
    if (!on[s.part]) return;
    if (s.parthead){ html += `<div class="parthead">${s.parthead}</div>`; txt += `\n===== ${s.parthead} =====\n`; return; }
    html += `<div class="section"><div class="shead">${esc(s.title)}</div>`;
    txt += `\n## ${s.title}\n`;
    if (s.posline){ html += `<div class="posline">${esc(s.posline)}</div>`; txt += s.posline + '\n'; }
    if (s.html){ html += s.html; txt += s.txt; }
    (s.entries || []).forEach(e => {
      total++;
      html += `<div class="entry"><div class="etitle">${esc(e.title)}</div><div class="etext">${esc(e.text)}</div>${e.note ? `<div class="enote">${esc(e.note)}</div>` : ''}</div>`;
      txt += `\n### ${e.title}\n${e.text}\n`;
      if (e.note) txt += e.note + '\n';
    });
    if (s.emptyNote){ html += `<div class="note">${esc(s.emptyNote)}</div>`; txt += s.emptyNote + '\n'; }
    html += '</div>';
  });
  document.getElementById('report').innerHTML = html || '<div class="empty-note">सभी भाग बंद हैं - कम से कम एक भाग चालू करें।</div>';
  lastTxt = txt;
  document.getElementById('report-status').textContent = `कुल ${total} entries लगीं (ग्रह विचार ${on.graha ? gSlots : 0} + भाव विचार ${on.bhava ? bSlots : 0})`;
}
function downloadAsTxt(filename, textContent){
  if (!textContent) return;
  const blob = new Blob([textContent], { type: 'text/plain;charset=utf-8' });
  const link = document.createElement('a');
  const url = URL.createObjectURL(blob);
  link.href = url; link.download = filename;
  document.body.appendChild(link); link.click();
  document.body.removeChild(link); URL.revokeObjectURL(url);
}
document.getElementById('btn-txt').addEventListener('click', () => {
  if (!CH){ document.getElementById('report-status').textContent = 'पहले Astro Code भरें।'; return; }
  downloadAsTxt('Phalit-Report.txt', lastTxt);
});
document.getElementById('btn-shot').addEventListener('click', async () => {
  const st = document.getElementById('report-status');
  if (!CH){ st.textContent = 'पहले Astro Code भरें।'; return; }
  if (typeof html2canvas !== 'function'){ st.textContent = 'Screenshot engine लोड नहीं हुआ - internet चालू करके page reload करें।'; return; }
  try {
    const canvas = await html2canvas(document.getElementById('report'), { scale: 1, backgroundColor: '#ffffff' });
    const link = document.createElement('a');
    link.download = 'Phalit-Report.png';
    link.href = canvas.toDataURL('image/png');
    document.body.appendChild(link); link.click(); document.body.removeChild(link);
  } catch (e) { st.textContent = 'Screenshot नहीं बन पाया: ' + (e.message || e); }
});
['tgl-summary','tgl-graha','tgl-bhava'].forEach(id => document.getElementById(id).addEventListener('change', renderReport));
</script>
<script type="module">
const EPHEM_CDN = 'https://cdn.jsdelivr.net/npm/@swisseph/browser@1.4.0/dist/swisseph-browser.js';
const ephemStatus = document.getElementById('ephem-status');
const ephemError = document.getElementById('ephem-error');
let SE = null, SEP = null, SEF = null, SEH = null, SEL = null;
function setStatus(t, ok){ ephemStatus.textContent = t; ephemStatus.className = ok ? 'ok' : ''; }
try {
  const m = await import(/* @vite-ignore */EPHEM_CDN);
  SE = m.SwissEphemeris; SEP = m.Planet; SEF = m.CalculationFlag; SEH = m.HouseSystem; SEL = m.LunarPoint;
  const swe = new SE();
  await swe.init();
  swe.setSiderealMode(m.SiderealMode.Lahiri);
  window._swe = swe;
  setStatus('✅ Engine तैयार - Astro Code डालकर "📥 भरो" दबाएं', true);
} catch (e) {
  setStatus('⚠️ Engine लोड नहीं हुआ - इंटरनेट चालू करके पेज reload करें', false);
}
setTimeout(() => { if (!window._swe) setStatus('⏳ Engine लोड हो रहा है… (नेटवर्क धीमा हो सकता है)', false); }, 45000);
const FLAGS = () => SEF.MoshierEphemeris | SEF.Speed;
async function calcFromAstroCode(){
  if (!window._swe) throw new Error('Ephemeris लोड नहीं हुआ - पेज refresh करें');
  ephemError.innerText = '';
  const m = /^AS1-(\d{8})-(\d{6})-([+-]\d{4})-(\d{4})([NS])-(\d{5})([EW])$/.exec((document.getElementById('astro-code-in').value || '').trim());
  if (!m) throw new Error('सही Astro Code डालें (AS1-YYYYMMDD-HHMMSS-±HHMM-DDMMN/S-DDDMME/W)');
  const d8 = m[1], t6 = m[2], tz = m[3], lat4 = m[4], latDir = m[5], lon5 = m[6], lonDir = m[7];
  const Y = +d8.slice(0,4), mo = +d8.slice(4,6), dy = +d8.slice(6,8);
  const h24 = +t6.slice(0,2), mm = +t6.slice(2,4), ss = +t6.slice(4,6);
  const tzMin = (tz[0] === '-' ? -1 : 1) * (+tz.slice(1,3) * 60 + +tz.slice(3,5));
  let lat = +lat4.slice(0,2) + (+lat4.slice(2,4)) / 60; if (latDir === 'S') lat = -lat;
  let lon = +lon5.slice(0,3) + (+lon5.slice(3,5)) / 60; if (lonDir === 'W') lon = -lon;
  let utc = new Date(Date.UTC(Y, mo - 1, dy, h24, mm, ss)); utc = new Date(utc.getTime() - tzMin * 60000);
  const swe = window._swe;
  const jd = swe.julianDay(utc.getUTCFullYear(), utc.getUTCMonth() + 1, utc.getUTCDate(),
                           utc.getUTCHours() + utc.getUTCMinutes() / 60 + utc.getUTCSeconds() / 3600);
  const ayan = swe.getAyanamsa(jd), F = FLAGS();
  const bodies = { 'सूर्य': SEP.Sun, 'चंद्र': SEP.Moon, 'मंगल': SEP.Mars, 'बुध': SEP.Mercury, 'गुरु': SEP.Jupiter, 'शुक्र': SEP.Venus, 'शनि': SEP.Saturn, 'राहु': SEL.MeanNode };
  const raw = {};
  Object.entries(bodies).forEach(([g, b]) => {
    const r = swe.calculatePosition(jd, b, F);
    raw[g] = { lon: norm360(r.longitude - ayan), speed: (typeof r.longitudeSpeed === 'number') ? r.longitudeSpeed : null };
  });
  raw['केतु'] = { lon: norm360(raw['राहु'].lon + 180), speed: null };
  const lagnaLon = norm360(swe.calculateHouses(jd, lat, lon, SEH.Placidus).ascendant - ayan);
  const lagSign = Math.floor(lagnaLon / 30);
  const mk = L => {
    const sign = Math.floor(norm360(L) / 30);
    return { lon: norm360(L), sign, signName: RASHI[sign], deg: degStr(L),
             nakName: NAK[Math.floor(norm360(L) / (360 / 27))],
             bhava: ((sign - lagSign) % 12 + 12) % 12 + 1 };
  };
  const P = { 'लग्न': mk(lagnaLon) };
  GRAHA.forEach(g => { P[g] = mk(raw[g].lon); });
  const asta = new Set(), vakri = new Set();
  const sunLon = raw['सूर्य'].lon;
  Object.keys(ORB).forEach(g => {
    let d = Math.abs(norm360(raw[g].lon) - sunLon); d = Math.min(d, 360 - d);
    if (d <= ORB[g]) asta.add(g);
  });
  TARA.forEach(g => { if (raw[g].speed !== null && raw[g].speed < 0) vakri.add(g); });
  CH = { P, asta, vakri };
  setStatus('✅ भरा गया - report नीचे तैयार है', true);
  renderReport();
}
window.calcFromAstroCode = calcFromAstroCode;
document.getElementById('btn-applycode').addEventListener('click', async () => {
  const err = document.getElementById('code-error');
  err.innerText = '';
  try { await calcFromAstroCode(); }
  catch (e) { err.innerText = e.message || String(e); }
});
</script>
