 const s=[...SHUBHA_BASE];
 // Shukla Chandra
 if(pd.n==='चंद्र'&&!pd.isKrishna)s.push('चंद्र');
 // Budh when not in papa yuti
 if(pd.n==='बुध'){

 return s;
}

function parseAstroCode(code){
 // v17 fix: regex-based parser handles negative timezones (e.g. --0500 for Chicago)
 const m=code.trim().match(/^AS1-(\d{8})-(\d{6})-([+-]\d{4})-(\d{4})([NS])-(\d{5})([EW])$/i);
 if(!m)throw'Invalid code';
 const dt=m[1],tm=m[2],tz=m[3],latS=m[4],latD=m[5],lonS=m[6],lonD=m[7];
 const Y=+dt.slice(0,4),M=+dt.slice(4,6),D=+dt.slice(6,8);
 const hh=+tm.slice(0,2),mm=+tm.slice(2,4),ss=+tm.slice(4,6);
 const tzh=t=>{const s=t[0]==='-'?-1:1;return s*(+t.slice(1,3)+ +t.slice(3,5)/60);};
 const tzs=tzh(tz);
 const la=(s,d)=>{const dd=+s.slice(0,2),mm=+s.slice(2)/60;const sg=d.toUpperCase()==='S'||d.toUpperCase()==='W'?-1:1;return sg*(dd+mm);};
 // Note: lat format DDMM, lon format DDDMM
 const latLa=(s,d)=>{const dd=+s.slice(0,s.length-2),mm=+s.slice(s.length-2)/60;const sg=d.toUpperCase()==='S'?-1:1;return sg*(dd+mm);};
 const lonLa=(s,d)=>{const dd=+s.slice(0,s.length-2),mm=+s.slice(s.length-2)/60;const sg=d.toUpperCase()==='W'?-1:1;return sg*(dd+mm);};
 return{Y,M,D,hh,mm,ss,tzs,lat:latLa(latS,latD),lon:lonLa(lonS,lonD)};
}

const EPHEM_CDN='https://cdn.jsdelivr.net/npm/@swisseph/browser@1.4.0/dist/swisseph-browser.js';
let _swe=null,_sweLoading=null,_SEP=null,_SEF=null;
async function ensureSwe(){
 if(_swe)return _swe;
 if(_sweLoading)return _sweLoading;
 _sweLoading=(async()=>{
  const m=await import(/* @vite-ignore */EPHEM_CDN);
  const swe=new m.SwissEphemeris();await swe.init();
  swe.setSiderealMode(m.SiderealMode.Lahiri);
  _swe=swe;_SEP=m.Planet;_SEF=m.CalculationFlag;return swe;
 })();
 return _sweLoading;
}
const norm360=x=>((x%360)+360)%360;
function jdFromYMDH(y,mo,d,utH){
 let Y=y,M=mo;
 if(M<=2){Y--;M+=12;}
 const A=Math.floor(Y/100),B=2-A+Math.floor(A/4);
 return Math.floor(365.25*(Y+4716))+Math.floor(30.6001*(M+1))+d+B-1524.5+utH/24;
}
const SEPBODY={0:'Sun',1:'Moon',2:'Mercury',3:'Venus',4:'Mars',5:'Jupiter',6:'Saturn'};
async function calcPositions(info){
 const swe=await ensureSwe();
 const utcH=info.hh+info.mm/60+info.ss/3600-info.tzs;
 const jd=jdFromYMDH(info.Y,info.M,info.D,utcH);
 const ayan=swe.getAyanamsa(jd);
 const res=[];
 for(const pl of PLANETS){
  let lng,retro=false;
  if(pl.body<=6){
   const FL=_SEF.MoshierEphemeris|_SEF.Speed;
   const r=swe.calculatePosition(jd,_SEP[SEPBODY[pl.body]],FL);
   lng=norm360(r.longitude-ayan);
   // retro via speed: check position diff
   const r2=swe.calculatePosition(jd+0.5,_SEP[SEPBODY[pl.body]],FL);
   let sp=r2.longitude-r.longitude;if(sp>180)sp-=360;if(sp<-180)sp+=360;
   retro=sp<0;
  }else if(pl.body===10){
   // Rahu: use body number 10 directly (never MeanNode)
   const FL=_SEF.MoshierEphemeris|_SEF.Speed;
   const r=swe.calculatePosition(jd,10,FL);
   lng=norm360(r.longitude-ayan);
   retro=true;
  }else{
   // Ketu: Rahu + 180
   const FL=_SEF.MoshierEphemeris|_SEF.Speed;
   const r=swe.calculatePosition(jd,10,FL);
   let rl=norm360(r.longitude-ayan);
   lng=norm360(rl+180);
   retro=true;
  }
  res.push({...pl,lng,retro});
 }
 const asc=norm360(swe.calculateHouses(jd,info.lat,info.lon,'P').ascendant-ayan);
 return{planets:res,lagna:asc,jd};
}

function getRashi(lng){return Math.floor(lng/30)}
function getDegInRashi(lng){return lng%30}
function getNak(lng){const idx=Math.floor(lng/(360/27));return{idx,name:NAKS[idx],lord:NAK_LORDS[idx],pada:Math.floor((lng%(360/27))/(360/108))+1}}
function getHouse(rashi,lagnaR){return((rashi-lagnaR+12)%12)+1}
function dignityScore(pl,rashi){
 // Rahu/Ketu: neutral (no standard dignities)
 if(pl==='राहु'||pl==='केतु')return{r:10,label:'सम'};
 if(!DIGNITY[pl])return{r:0,label:'-'};
 const d=DIGNITY[pl];
 if(rashi===d.u)return{r:20,label:'उच्च'};
 if(rashi===d.mt)return{r:18,label:'मूलत्रिकोण'};
 if(d.s.includes(rashi))return{r:16,label:'स्वराशि'};
 // Friend/enemy
 const fr=FRIEND[pl]||[],en=ENEMY[pl]||[];
 // Need rashi lord - simplified mapping
 const LORDS=['मंगल','शुक्र','बुध','चंद्र','सूर्य','बुध','शुक्र','मंगल','गुरु','शनि','शनि','गुरु'];
 const lord=LORDS[rashi];
 if(fr.includes(lord))return{r:12,label:'मित्र'};
 if(en.includes(lord))return{r:6,label:'शत्रु'};
 return{r:10,label:'सम'};
}
function avastha(deg){
 if(deg<6)return{v:2,n:'बाल'};if(deg<12)return{v:4,n:'कुमार'};
 if(deg<18)return{v:5,n:'युवा'};if(deg<24)return{v:3,n:'किशोर'};
 if(deg<30)return{v:2,n:'वृद्ध'};return{v:1,n:'मृत'};
}
function navatara(pNak,mNak){
 const d=((pNak-mNak+27)%27)%9;
 const names=['जन्म','संपत','विपत','क्षेम','प्रत्यरि','साधक','वध','मित्र','अतिमित्र'];
 const scores=[3,5,1,4,2,4,0,4,5];
 return{n:names[d],s:scores[d]};
}
function isPushkarNavamsha(pl,lng){
 // Fully auto: Pushkar Navamsha by pada (1-indexed)
 // Fire (Mesha,Simha,Dhanu): 7th,9th pada | Earth (Vrishabha,Kanya,Makara): 3rd,5th
 // Air (Mithuna,Tula,Kumbha): 6th,8th | Water (Karka,Vrishchika,Meena): 1st,3rd
 const rashi=getRashi(lng),deg=getDegInRashi(lng);
 const pada=Math.floor(deg/(30/9))+1; // 1-9
 const el=rashi%4; // 0=fire,1=earth,2=air,3=water
 if(el===0)return pada===7||pada===9;
 if(el===1)return pada===3||pada===5;
 if(el===2)return pada===6||pada===8;
 return pada===1||pada===3; // water
}
function isPushkarBhaga(pl,lng){
 // Chalit v10 PB_POINTS (rashi-specific, ±1° tolerance)

 const rashi=getRashi(lng),deg=getDegInRashi(lng);
 return Math.abs(deg-PB_POINTS[rashi])<=1.0;
}
// Mrityu Bhaga degrees (1-indexed degree within rashi) per planet per rashi (Mesha..Meena)

function isMrityuBhaga(pl,lng){
 // Fully auto: check if planet's degree matches its Mrityu Bhaga
 if(!MRITYU_BHAGA[pl])return false; // Rahu/Ketu: no MB

function getChalitHouse(planetLng,lagnaLng){
 // Bhava Chalit (Sripati simplified): bhava spans cusp±15°
 for(let i=0;i<12;i++){
  const cusp=(lagnaLng+i*30)%360;

  if(d>180)d-=360;
  if(Math.abs(d)<=15)return i+1;
 }
 const diff=((planetLng-lagnaLng)%360+360)%360;
 return Math.floor(diff/30)+1;
}

/**

function isMoolatrikona(p, lon) {
  const [mn, mx] = MT_RANGES[p];
  return lon >= mn && lon <= mx;
}
function isTemporalFriend(r1, r2) {
  const d = ((r2 - r1 + 12) % 12) + 1;

}
function panchadha(nat, isFriend) {
  if (nat === 15) return isFriend ? 22.5 : 7.5;
  if (nat === 7.5) return isFriend ? 15 : 3.75;
  if (nat === 3.75) return isFriend ? 7.5 : 1.875;
  return nat;
}
function vD1(lon) { return Math.floor(lon / 30); }
function vD2(lon) {
  const r = Math.floor(lon / 30), d = lon % 30;
  return (r % 2 === 0) ? (d < 15 ? 4 : 3) : (d < 15 ? 3 : 4);
}
function vD3(lon) {
  const r = Math.floor(lon / 30), d = lon % 30;
  return (r + Math.floor(d / 10) * 4) % 12;
}
function vD7(lon) {
  const r = Math.floor(lon / 30), d = lon % 30;
  const k = Math.floor(d / (30 / 7));
  return (r % 2 === 0) ? (r + k) % 12 : (r + 6 + k) % 12;
}
function vD9(lon) {
  const r = Math.floor(lon / 30), d = lon % 30;
  return ([0, 9, 6, 3][r % 4] + Math.floor(d / (30 / 9))) % 12;
}
function vD12(lon) {
  const r = Math.floor(lon / 30), d = lon % 30;
  return (r + Math.floor(d / 2.5)) % 12;
}
function vD30(lon) {
  const r = Math.floor(lon / 30), d = lon % 30;
  if (r % 2 === 0) {
    if (d < 5) return 0;
    if (d < 10) return 9;
    if (d < 18) return 8;
    if (d < 25) return 2;
    return 6;
  } else {
    if (d < 12) return 5;
    if (d < 20) return 11;
    if (d < 25) return 10;
    return 7;
  }
}

function calculateSaptavargaja(p, lon, allLons) {
  if (!H_TABLE) throw new Error('H_TABLE not set. Call setHTable() first.');
  const pRashi = Math.floor(lon / 30);
  const vargas = [vD1(lon), vD2(lon), vD3(lon), vD7(lon), vD9(lon), vD12(lon), vD30(lon)];
  const names = ['D1', 'D2', 'D3', 'D7', 'D9', 'D12', 'D30'];
  let total = 0;
  for (let i = 0; i < 7; i++) {
    const r = vargas[i];
    let score;
    if (names[i] === 'D1' && isMoolatrikona(p, lon)) score = 45;
    else if (OWN_SIGNS[p].includes(r)) score = 30;
    else {
      const nat = H_TABLE[p][r];
      const lord = RASHI_LORDS[r];
      const lordRashi = Math.floor(allLons[lord] / 30);
      score = panchadha(nat, isTemporalFriend(pRashi, lordRashi));
    }
    total += score;
  }
  return total;
}

function calculateSthanaBala(planets, lagnaLon) {
  const result = [];
  for (let p = 0; p < 7; p++) {
    const lon = planets[p];
    let dist = Math.abs(lon - ((UCHCHA_POINTS[p] + 180) % 360));
    if (dist > 180) dist = 360 - dist;
    const uchcha = dist / 3.0;
    const saptavargaja = calculateSaptavargaja(p, lon, planets);
    const isFemale = (p === MOON || p === VENUS);
    let ojaYugma = 0;
    for (const v of [vD1(lon), vD9(lon)]) {
      const isEven = (v % 2 !== 0);
      if ((isFemale && isEven) || (!isFemale && !isEven)) ojaYugma += 15;
    }
    const pRashi = Math.floor(lon / 30);
    const lagnaRashi = Math.floor(lagnaLon / 30);
    const house = ((pRashi - lagnaRashi + 12) % 12) + 1;
    const kendradi = [1, 4, 7, 10].includes(house) ? 60 : ([2, 5, 8, 11].includes(house) ? 30 : 15);
    const dk = Math.floor((lon % 30) / 10) + 1;
    let drekkana = 0;
    if (dk === 1 && [SUN, MARS, JUPITER].includes(p)) drekkana = 15;
    if (dk === 2 && [MERCURY, SATURN].includes(p)) drekkana = 15;
    if (dk === 3 && [MOON, VENUS].includes(p)) drekkana = 15;
    const total = uchcha + saptavargaja + ojaYugma + kendradi + drekkana;
    result.push({ uchcha, saptavargaja, ojaYugma, kendradi, drekkana, total });
  }
  return result;
}

  const cusp4 = (mc + 180) % 360;
  const pp = [cusp4, cusp10, cusp4, cusp7, cusp7, cusp10, cusp1];
  const result = [];
  for (let i = 0; i < 7; i++) {
    let d = Math.abs(planets[i] - pp[i]);
    if (d > 180) d = 360 - d;
    result.push(d / 3.0);
  }
  return result;
}

const KHANDA1 = [362, 341, 299, 236, 150, 52];
const KHANDA2 = [362, 703, 1002, 1238, 1388, 1440];

function kalaAyana(planets, ayanamsa) {
  const res = [];
  for (let p = 0; p < 7; p++) {
    let sayana = planets[p] + ayanamsa;
    if (sayana >= 360) sayana -= 360;
    const isSouth = (sayana > 0 && sayana < 180) ? 0 : 3;
    let x = sayana;
    if (sayana > 90 && sayana < 270) x = Math.abs(180 - sayana);
    else if (sayana >= 270) x = Math.abs(360 - sayana);
    const idx = Math.floor(x / 15);
    const rem = x % 15;
    let kranti = (rem * KHANDA1[idx]) / 15.0;
    if (idx > 0) kranti += KHANDA2[idx - 1];
    let v = kranti;
    if (p === MOON || p === SATURN) { if (isSouth === 0) v = -v; }
    else if (p === MERCURY) { /* absolute */ }
    else { if (isSouth !== 0) v = -v; }
    v = (1440.0 + v) / 48.0;
    if (p === SUN) v *= 2.0;
    res.push(Math.round(v * 100) / 100);
  }
  return res;

function calculateKalaBala(planets, ctx) {
  const nat = (function() {
    const noon = (ctx.sunriseHrs + ctx.sunsetHrs) / 2;
    let midnight = (ctx.sunsetHrs + ctx.sunriseNextHrs + 24) / 2;
    if (midnight >= 24) midnight -= 24;
    let dNoon = Math.abs(ctx.birthHrs - noon);
    if (dNoon > 12) dNoon = 24 - dNoon;
    let dMid = Math.abs(ctx.birthHrs - midnight);
    if (dMid > 12) dMid = 24 - dMid;
    return [(12-dNoon)*5, (12-dMid)*5, (12-dMid)*5, 60.0, (12-dNoon)*5, (12-dNoon)*5, (12-dMid)*5];
  })();
  const pak = (function() {
    let elong = planets[SUN] - planets[MOON];
    // paksha uses moon-sun elongation
    elong = planets[MOON] - planets[SUN];
    if (elong < 0) elong += 360;
    if (elong > 180) elong = 360 - elong;
    const val = elong / 3.0;
    return [60-val, 2*val, 60-val, 60-val, val, val, 60-val];
  })();
  const tri = (function() {
    const r = [0,0,0,0,60,0,0];
    const isNight = ctx.birthHrs >= ctx.sunsetHrs || ctx.birthHrs < ctx.sunriseHrs;
    if (!isNight) {
      const part = Math.floor((ctx.birthHrs - ctx.sunriseHrs) / ((ctx.sunsetHrs - ctx.sunriseHrs) / 3));
      if (part === 0) r[MERCURY] = 60; else if (part === 1) r[SUN] = 60; else r[SATURN] = 60;
    } else {
      const nightDur = (ctx.sunriseNextHrs + 24) - ctx.sunsetHrs;
      const tss = ctx.birthHrs >= ctx.sunsetHrs ? ctx.birthHrs - ctx.sunsetHrs : (ctx.birthHrs + 24) - ctx.sunsetHrs;
      const part = Math.floor(tss / (nightDur / 3));
      if (part === 0) r[MOON] = 60; else if (part === 1) r[VENUS] = 60; else r[MARS] = 60;
    }
    return r;
  })();
  const lords = [0,0,0,0,0,0,0];
  lords[ctx.abdaLord] += 15; lords[ctx.masaLord] += 30;
  lords[ctx.varaLord] += 45; lords[ctx.horaLord] += 60;
  const aya = kalaAyana(planets, ctx.ayanamsa);
  const yud = [0,0,0,0,0,0,0];
  const total = [];
  for (let p = 0; p < 7; p++)
    total.push(Math.round((nat[p]+pak[p]+tri[p]+lords[p]+aya[p]+yud[p])*100)/100);
  return { natonnata: nat, paksha: pak, tribhaga: tri, lords, ayana: aya, yuddha: yud, total };
}

function sGraha(d) {
  d = ((d % 360) + 360) % 360;
  if (d <= 30) return 0;
  if (d <= 60) return (d - 30) / 2;
  if (d <= 90) return d - 45;
  if (d <= 120) return (120 - d) / 2 + 30;
  if (d <= 150) return 150 - d;
  if (d <= 180) return 2 * (d - 150);
  if (d < 300) return (300 - d) / 2;
  return 0;
}
function rashiDrishti(q, d) {
  d = ((d % 360) + 360) % 360;
  if (q === MARS) {
    if (d > 90 && d <= 120) return -15.0;
    if (d > 210 && d <= 240) return -15.0;
  } else if (q === JUPITER) {
    if (d > 120 && d <= 150) return 30.0;
    if (d > 240 && d <= 270) return 30.0;
  } else if (q === SATURN) {
    if (d > 60 && d <= 90) return -45.0;
    if (d > 270 && d <= 300) return -45.0;
  }
  return 0;
}
const NAT_BENEFIC = new Set([MOON, JUPITER, VENUS]);
const NAT_MALEFIC = new Set([SUN, MARS, SATURN]);
function moonIsBenefic(sunLon, moonLon) {
  const elong = (((moonLon - sunLon) % 360) + 360) % 360;
  return elong >= 96 && elong <= 264;
}
function mercurySign(lons) {
  const merRashi = Math.floor(lons[MERCURY] / 30);
  let nBen = 0, nMal = 0;
  for (let i = 0; i < 7; i++) {
    if (i === MERCURY) continue;
    if (Math.floor(lons[i] / 30) === merRashi) {
      if (NAT_BENEFIC.has(i)) nBen++;
      if (NAT_MALEFIC.has(i)) nMal++;
    }
  }
  if (nMal === 0) return +1;
  return nBen > nMal ? +1 : -1;
}
function calculateDrikBala(lons) {
  const signs = [-1, moonIsBenefic(lons[SUN], lons[MOON]) ? +1 : -1, -1,
                 mercurySign(lons), +1, +1, -1];
  const res = [];
  for (let p = 0; p < 7; p++) {
    let acc = 0;
    for (let q = 0; q < 7; q++) {
      if (q === p) continue;
      const d = (((lons[p] - lons[q]) % 360) + 360) % 360;
      acc += signs[q] * sGraha(d) + rashiDrishti(q, d);
    }
    res.push(acc / 4.0);
  }
  return res;
}

  const jdNoon = Math.floor(jd - 0.5) + 0.5;
  const n = jdNoon - 2451545.0 + 0.0008;
  const J = n - lon/360;
  const M = (357.5291 + 0.98560028*J) % 360;
  const C = 1.9148*Math.sin(M*Math.PI/180) + 0.0200*Math.sin(2*M*Math.PI/180) + 0.0003*Math.sin(3*M*Math.PI/180);
  const L = (M + C + 180 + 102.9372) % 360;
  const Jtransit = 2451545.0 + J + 0.0053*Math.sin(M*Math.PI/180) - 0.0069*Math.sin(2*L*Math.PI/180);
  const solarNoonJD = Jtransit + lon/360;
  const solarNoonHrs = (solarNoonJD - Math.floor(solarNoonJD)) * 24;
  const sunriseHrs = solarNoonHrs - H;
  const sunsetHrs = solarNoonHrs + H;
  // Next day sunrise (approx same)
  const sunriseNextHrs = sunriseHrs; // simplification
  return { sunriseHrs: ((sunriseHrs%24)+24)%24, sunsetHrs: ((sunsetHrs%24)+24)%24, sunriseNextHrs: ((sunriseNextHrs%24)+24)%24 };
}

function calculateBhavaDrishtiBala(planetLongs, bhavaCusps) {
    let drigBala = new Array(12).fill(0.0);
    let sunLong = planetLongs[0];
    let moonLong = planetLongs[1];
    let diffMoonSun = moonLong - sunLong;
    if (diffMoonSun < 0) diffMoonSun += 360.0;
    let isMoonBenefic = (diffMoonSun >= 84.0 && diffMoonSun <= 276.0);
    for (let p = 0; p < 7; p++) {
        let pLong = planetLongs[p];
        let pIndex = p + 1;
        for (let b = 0; b < 12; b++) {
            let bLong = bhavaCusps[b];
            let diff = bLong - pLong;
            if (diff < 0) diff += 360.0;
            let v = 0.0;
            if (diff > 0 && diff <= 30) v = 0.0;
            else if (diff > 30 && diff <= 60) v = (diff - 30.0) / 2.0;
            else if (diff > 60 && diff <= 90) v = (diff - 60.0) + 15.0;
            else if (diff > 90 && diff <= 120) v = (120.0 - diff) / 2.0 + 30.0;
            else if (diff > 120 && diff <= 150) v = 150.0 - diff;
            else if (diff > 150 && diff <= 180) v = (diff - 150.0) * 2.0;
            else if (diff > 180 && diff <= 300) v = (300.0 - diff) / 2.0;
            else if (diff > 300 && diff <= 360) v = 0.0;
            if (v !== 0.0) {
                let isNegative = false;
                if (pIndex === 1 || pIndex === 3 || pIndex === 7) isNegative = true;
                else if (pIndex === 2) { if (!isMoonBenefic) isNegative = true; }
                if (isNegative) v = -v;
                if (pIndex === 3) { if ((diff > 90 && diff <= 120) || (diff > 210 && diff <= 240)) v -= 15.0; }
                else if (pIndex === 5) { if ((diff > 120 && diff <= 150) || (diff > 240 && diff <= 270)) v += 30.0; }
                else if (pIndex === 7) { if ((diff > 60 && diff <= 90) || (diff > 270 && diff <= 300)) v -= 45.0; }
                if (pIndex !== 4 && pIndex !== 5) v = v / 4.0;
                drigBala[b] += v;
            }
        }
    }
    return drigBala;
}

function hasSimpleNeechbhanga(pd){

  if(pd.rashi!==d.n)return false; // not neecha
  const LORDS=['मंगल','शुक्र','बुध','चंद्र','सूर्य','बुध','शुक्र','मंगल','गुरु','शनि','शनि','गुरु'];
  const disp=LORDS[pd.rashi];
  const dispPd=planetData.find(p=>p.n===disp);
  if(!dispPd)return false;
  const moonPd=planetData.find(p=>p.n==='चंद्र');
  const moonHouse=moonPd?moonPd.house:0;
  // Helper: kendra houses from a given house
  const kendraFrom=(h)=>[h,(h+3)%12||12,(h+6)%12||12,(h+9)%12||12].map(x=>x===0?12:x);
  // 1. Dispositor in kendra from lagna
  if([1,4,7,10].includes(dispPd.house))return true;
  // 2. Dispositor exalted
  const dd=DIGNITY[disp];
  if(dd&&dispPd.rashi===dd.u)return true;
  // 3. Neecha planet in kendra from lagna
  if([1,4,7,10].includes(pd.house))return true;
  // 4. Dispositor in kendra from Moon
  if(moonHouse&&kendraFrom(moonHouse).includes(dispPd.house))return true;
  // 5. Neecha planet in kendra from Moon
  if(moonHouse&&kendraFrom(moonHouse).includes(pd.house))return true;
  // 6. Mutual kendra / yuti between neecha planet and dispositor
  if(dispPd.house===pd.house)return true; // yuti
  return false;
}

  }
  b.d9nakshatra=d9nak;

  const base2Score=b.d9rashi.pts+b.d9bhava.pts+b.d9nakshatra.pts;
  const baseScore=base1Score+base2Score;

  // Modifiers
  // Asta (combust): Deep -10, Medium -7, Light -4
  let asta={pts:0,label:'नहीं'};
  const sunPd=planetData.find(p=>p.n==='सूर्य');
  if(sunPd&&!['सूर्य','राहु','केतु'].includes(n)){
    let diff=Math.abs(pd.lng-sunPd.lng);if(diff>180)diff=360-diff;
    const ASTA_ORB={'चंद्र':12,'मंगल':17,'बुध':14,'गुरु':11,'शुक्र':10,'शनि':15};
    const limit=ASTA_ORB[n]||8;
    if(diff<limit){
      const third=limit/3;
      if(diff<third)asta={pts:-10,label:'गहरा अस्त ('+diff.toFixed(1)+'° सूर्य से)'};
      else if(diff<third*2)asta={pts:-7,label:'मध्यम अस्त ('+diff.toFixed(1)+'° सूर्य से)'};
      else asta={pts:-4,label:'हल्का अस्त ('+diff.toFixed(1)+'° सूर्य से)'};
    }
  }
  m.asta=asta;

  // Pushkar separate: PN +5, PB +5, both +10, Mrityu -10
  let pk={pts:0,label:'नहीं'};
  const isPN=isPushkarNavamsha(n,pd.lng);
  const isPB=isPushkarBhaga(n,pd.lng);
  const isMB=isMrityuBhaga(n,pd.lng);
  if(isMB){pk={pts:-10,label:'मृत्यु भाग (-10)'};}
  else if(isPN&&isPB){pk={pts:10,label:'पुष्कर नवमांश+भाग (+10)'};}
  else if(isPN){pk={pts:5,label:'पुष्कर नवमांश (+5)'};}
  else if(isPB){pk={pts:5,label:'पुष्कर भाग (+5)'};}
  m.pushkar=pk;

  // Yoga bonus: +10 if lord of 9/10/11 placed in 1,2,4,5,7,9,10,11
  let yoga={pts:0,label:'नहीं'};
  const h9lord=getHouseLord(9),h10lord=getHouseLord(10),h11lord=getHouseLord(11);
  if([h9lord,h10lord,h11lord].includes(n)&&[1,2,4,5,7,9,10,11].includes(h)){
    yoga={pts:10,label:'योगकारक स्थिति'};
  }
  m.yoga=yoga;

  // Nakshatra moved to Base 1 (#3) - removed from modifiers

  // Vakri (cheshta bala): +5 for retrograde planets (except Sun/Moon/Rahu/Ketu)
  let vakri={pts:0,label:'नहीं'};
  if(pd.retro&&!['राहु','केतु','सूर्य','चंद्र'].includes(n)){
    vakri={pts:5,label:'वक्री (चेष्टा बल) (+5)'};
  }
  m.vakri=vakri;

  // House lordship moved to Base 1 (#4) - removed from modifiers

  // 3. Vargottama both types (all planets including Rahu/Ketu - user's decision)
  let varg={pts:0,label:'नहीं'};
  const rashiVarg=pd.vargottama?5:0;
  // Bhava vargottama: same whole-sign house in D1 and D9
  const d9house2=getHouse(pd.d9rashi,d9LagnaRashi);
  const bhavaVarg=(d9house2===h)?5:0;
  const vargTotal=rashiVarg+bhavaVarg;
  if(vargTotal>0){
    const parts=[];
    if(rashiVarg)parts.push('राशि');
    if(bhavaVarg)parts.push('भाव');
    varg={pts:vargTotal,label:parts.join('+')+' वर्गोत्तम (+'+vargTotal+')'};
  }
  m.vargottama=varg;

  // 4. Navatara
  let navt={pts:0,label:'नहीं'};
  if(pd.nak&&typeof moonNak!=='undefined'){
    const nt=navatara(pd.nak.idx,moonNak);
    // scores: जन्म3,संपत5,विपत1,क्षेम4,प्रत्यरि2,साधक4,वध0,मित्र4,अतिमित्र5
    // Map to: good +5/+3, neutral 0, bad -3/-5
    const taraPts={'संपत':5,'साधक':5,'अतिमित्र':5,'क्षेम':3,'मित्र':3,'जन्म':0,'विपत':-3,'प्रत्यरि':-3,'वध':-5};
    const tp=taraPts[nt.n]||0;
    if(tp!==0)navt={pts:tp,label:nt.n+' ('+(tp>0?'+':'')+tp+')'};
  }
  m.navatara=navt;

  // 5. Yuti with benefic/malefic
  let yutiM={pts:0,label:'नहीं'};
  if(pd.yuti&&pd.yuti.length>0){
    let yp=0;const yl=[];
    for(const yn of pd.yuti){
      if(isShubhaAuto(yn)){yp+=5;yl.push(yn+' शुभ');}
      else if(isKruraAuto(yn)){yp-=3;yl.push(yn+' क्रूर');}
    }
    if(yp!==0)yutiM={pts:yp,label:yl.join(', ')};
  }
  m.yutiGraha=yutiM;

  // 6. Drishti ON planet (which planets aspect this planet)
  let drishtiP={pts:0,label:'नहीं'};
  {
    let dp=0;const dl=[];
    for(const q of planetData){
      if(q.n===n)continue;
      if(housesAspectedBy(q).has(h)){
        if(q.n===getHouseLord(h)){dp+=5;dl.push(q.n+' स्वामी');}
        else if(isShubhaAuto(q.n)){dp+=3;dl.push(q.n+' शुभ');}
        else if(isKruraAuto(q.n)){dp-=3;dl.push(q.n+' क्रूर');}
      }
    }
    dp=Math.max(-6,Math.min(6,dp));
    if(dp!==0)drishtiP={pts:dp,label:dl.join(', ')||'दृष्टि'};
  }
  m.drishtiGraha=drishtiP;

  const modTotal=m.asta.pts+m.pushkar.pts+m.yoga.pts+m.vakri.pts+m.vargottama.pts+m.navatara.pts+m.yutiGraha.pts+m.drishtiGraha.pts;
  let total=baseScore+modTotal;
  total=Math.max(0,Math.min(100,total));

  const cls=total>=70?'strong':total>=40?'medium':'weak';
  const verdict=total>=70?'बलवान 💪':total>=40?'मध्यम':'कमजोर ⚠️';
  return{breakdown:b,modifiers:m,base1Score,base2Score,baseScore,modTotal,total,cls,verdict};
}

// ============ TAB 2: scoreHouseAuto ============
function scoreHouseAuto(h){
  const b={},m={};
  const lord=getHouseLord(h);
  const lordPd=planetData.find(p=>p.n===lord);
  const lordHouse=lordPd?lordPd.house:0;
  const rashi=(lagnaRashi+h-1)%12;
  const occupants=planetData.filter(p=>p.house===h);
  const occNames=occupants.map(p=>p.n);
  const aspecting=[];
  for(const q of planetData){if(housesAspectedBy(q).has(h))aspecting.push(q.n);}
  const isLagnesh=RASHI_LORD_NAMES[lagnaRashi]===lord;
  const lagneshName=RASHI_LORD_NAMES[lagnaRashi];

  // 1. Bhavesh strength [25]
  const pct=getTab1PctAuto(lord);
  const lordScore=Math.round((pct/100)*25);
  b.lordScore={pts:lordScore,max:25,label:lord+' (Tab1 '+pct+'%)'};

  // 2. Bhavesh placement [15]
  let lp,lpLabel;
  if(lordHouse===h){lp=15;lpLabel='स्वगृही';}
  else if([1,4,7,10,5,9,11].includes(lordHouse)){lp=12;lpLabel='केंद्र/त्रिकोण/लाभ ('+lordHouse+')';}
  else if([2,3].includes(lordHouse)){lp=8;lpLabel='भाव '+lordHouse;}
  else if([6,8,12].includes(lordHouse)){
    if(isLagnesh&&lordHouse===12){lp=8;lpLabel='लग्नेश 12वें में';}
    else{lp=3;lpLabel='त्रिक ('+lordHouse+')';}
  }else{lp=8;lpLabel='भाव '+lordHouse;}
  b.lordPlace={pts:lp,max:15,label:lpLabel};

  // 3. Occupants [15]
  let ocPts,ocLabel;
  if(occupants.length===0){ocPts=7;ocLabel='खाली';}
  else{
    let pts=0;const labels=[];
    for(const o of occupants){
      const d=dignityPts25(o.n,o.rashi);
      if(d.pts>=20){pts=15;labels.push(o.n+' उच्च/स्व');break;}
    }
    if(pts<15){
      for(const o of occupants){
        if(isShubhaAuto(o.n)){pts=Math.min(15,pts+8);labels.push(o.n+' शुभ');}
        else if(isKruraAuto(o.n)&&[3,6,10,11].includes(h)){pts=Math.min(15,pts+8);labels.push(o.n+' क्रूर-उपचय');}
        else{labels.push(o.n+' क्रूर');}
      }
    }
    ocPts=pts;ocLabel=labels.join(', ')||'क्रूर ग्रह';
  }
  b.occupants={pts:ocPts,max:15,label:ocLabel};

  // 4. Drishti [10]
  let drPts,drLabel;
  if(aspecting.includes(lord)){drPts=10;drLabel='स्वामी की दृष्टि';}
  else{
    const shubhAsp=aspecting.filter(x=>isShubhaAuto(x));
    if(shubhAsp.length===0&&aspecting.length===0){drPts=3;drLabel='कोई दृष्टि नहीं';}
    else if(shubhAsp.length===0){drPts=0;drLabel='केवल क्रूर दृष्टि';}
    else{drPts=Math.min(10,shubhAsp.length*5);drLabel=shubhAsp.join(', ')+' की दृष्टि';}
  }
  b.aspects={pts:drPts,max:10,label:drLabel};

  // 5. SAV [20]
  const sav=(window._autoSAV&&window._autoSAV[rashi]!==undefined)?window._autoSAV[rashi]:25;
  let savPts;
  if(sav>=35)savPts=20;else if(sav>=30)savPts=15;else if(sav>=25)savPts=10;else if(sav>=20)savPts=5;else savPts=0;
  b.sav={pts:savPts,max:20,label:'SAV '+sav};

  // 6. Bhava rank [15]
  const rank=(window._bhavaRank&&window._bhavaRank[h])?window._bhavaRank[h]:6;
  let rkPts;
  if(rank<=2)rkPts=15;else if(rank<=4)rkPts=12;else if(rank<=6)rkPts=9;
  else if(rank<=8)rkPts=6;else if(rank<=10)rkPts=3;else rkPts=0;
  b.bhavaRank={pts:rkPts,max:15,label:'रैंक '+rank};

  const baseScore=b.lordScore.pts+b.lordPlace.pts+b.occupants.pts+b.aspects.pts+b.sav.pts+b.bhavaRank.pts;

  // Modifiers
  // Swa-drishti: +10
  let swa={pts:0,label:'नहीं'};
  if(aspecting.includes(lord))swa={pts:10,label:'स्व-दृष्टि'};
  m.swaDrishti=swa;

  // Lagnesh in house: +8
  let lagOcc={pts:0,label:'नहीं'};
  if(occNames.includes(lagneshName))lagOcc={pts:8,label:'लग्नेश उपस्थित'};
  m.lagneshOcc=lagOcc;

  // Vipareeta Raja Yoga: +10
  let vry={pts:0,label:'नहीं'};
  if([6,8,12].includes(h)&&[6,8,12].includes(lordHouse)&&h!==lordHouse){
    vry={pts:10,label:'विपरीत राजयोग'};
  }
  m.vry=vry;

  // Cusp Pushkar/Mrityu (bhava madhya)
  let cuspPk={pts:0,label:'नहीं'};
  if(window._cusps&&window._cusps.length===12){
    const cuspLng=window._cusps[h-1];
    const cPN=isPushkarNavamsha('सूर्य',cuspLng);
    const cPB=isPushkarBhaga('सूर्य',cuspLng);
    const cMB=isMrityuBhaga('सूर्य',cuspLng);
    if(cMB){cuspPk={pts:-15,label:'भाव मध्य मृत्यु भाग (-15)'};}
    else if(cPN&&cPB){cuspPk={pts:20,label:'भाव मध्य डबल पुष्कर (+20)'};}
    else if(cPN){cuspPk={pts:10,label:'भाव मध्य PN (+10)'};}
    else if(cPB){cuspPk={pts:10,label:'भाव मध्य PB (+10)'};}
  }
  m.cuspPushkar=cuspPk;

  const modTotal=m.swaDrishti.pts+m.lagneshOcc.pts+m.vry.pts+m.cuspPushkar.pts;
  let total=baseScore+modTotal;
  total=Math.max(0,Math.min(100,total));

  const cls=total>=70?'strong':total>=40?'medium':'weak';
  const verdict=total>=70?'बलवान 💪':total>=40?'मध्यम':'कमजोर ⚠️';
  return{breakdown:b,modifiers:m,baseScore,modTotal,total,cls,verdict,
    rashi,lord,occupants:occNames,aspecting};
}

// Tab1 pct lookup for Tab 2 (uses window._scoredAuto)
function getTab1PctAuto(planetName){
  if(window._scoredAuto){
    const f=window._scoredAuto.find(p=>p.n===planetName);
    if(f)return f.score.total;
  }
  return 50;
}

async function analyze(){
 const code=document.getElementById('astroCode').value.trim();
 hideError();
 if(!code){showError('Astro Code डालें');return;}
 try{
  const info=parseAstroCode(code);
  const{planets,lagna,jd}=await calcPositions(info);
  lagnaRashi=getRashi(lagna);
  window._lagnaLng=lagna; // for Chalit auto-calc
  // D9 Lagna: Parashara rules (Chara/Sthira/Dvisvabhava)
  const lagnaDegInRashi=lagna%30;
  const lagnaPada=Math.floor(lagnaDegInRashi/(30/9));
  const lr=lagnaRashi%3; // 0=Chara, 1=Sthira, 2=Dvisvabhava
  let d9Start;
  if(lr===0)d9Start=lagnaRashi; // Chara: same
  else if(lr===1)d9Start=(lagnaRashi+8)%12; // Sthira: 9th from
  else d9Start=(lagnaRashi+4)%12; // Dvisvabhava: 5th from
  d9LagnaRashi=(d9Start+lagnaPada)%12;
  // Bhava cusps (Placidus, sidereal) for Tab 2 Bhava Bala rank (verified formula)
  try{
   const swe2=_swe;
   const ayan2=swe2.getAyanamsa(jd);
   const hc=swe2.calculateHouses(jd,info.lat,info.lon,'P');
   const cusps=(hc.cusps||[]).slice(0,12).map(c=>norm360(c-ayan2));
   window._cusps=cusps; // for pushkar check in scoreHouse
   const order7=['सूर्य','चंद्र','मंगल','बुध','गुरु','शुक्र','शनि'];
   const lons7=order7.map(n=>{const p=planets.find(x=>x.n===n);return p?p.lng:0;});
   const drig=calculateBhavaDrishtiBala(lons7,cusps);
   window._bhavaDrigBala=drig;
   const idx=[...Array(12).keys()].sort((a,b)=>drig[b]-drig[a]);
   window._bhavaRank={};
   idx.forEach((bi,rp)=>{window._bhavaRank[bi+1]=rp+1;});
  }catch(e){console.log('Bhava cusps failed:',e);window._bhavaRank=null;}
  // Moon nak for navatara
  const moon=planets.find(p=>p.n==='चंद्र');
  moonNak=getNak(moon.lng).idx;

  // Build planet data
  planetData=planets.map(p=>{
   const rashi=getRashi(p.lng),degInRashi=getDegInRashi(p.lng);
   const house=getHouse(rashi,lagnaRashi);
   const nak=getNak(p.lng);
   // D9 (Parashara): starting sign by element
   // Fire (Mesha,Simha,Dhanu): Mesha | Earth (Vrishabha,Kanya,Makara): Makara
   // Air (Mithuna,Tula,Kumbha): Tula | Water (Karka,Vrishchika,Meena): Karka
   const pada=Math.floor(degInRashi/(30/9));
   const el=rashi%4; // 0=fire,1=earth,2=air,3=water
   const d9start=el===0?0:el===1?9:el===2?6:3;
   const d9rashi=(d9start+pada)%12;
   // Yuti: same house
   const yuti=planets.filter(q=>q.n!==p.n&&getHouse(getRashi(q.lng),lagnaRashi)===house).map(q=>q.n);
   // Drishti: 7th + special
   const drishtiFrom=[];
   const LORDS=['मंगल','शुक्र','बुध','चंद्र','सूर्य','बुध','शुक्र','मंगल','गुरु','शनि','शनि','गुरु'];
   const owns=LORDS.map((l,i)=>l===p.n?((i-lagnaRashi+12)%12)+1:null).filter(x=>x);
   return{...p,rashi,degInRashi,house,nak,d9rashi,yuti,drishtiFrom,owns,
    chalitHouse:getChalitHouse(p.lng,lagna),
    isLagnesh:LORDS[lagnaRashi]===p.n,
    isYogakaraka:false, // TODO: calculate
    isAsta:false,isKrishna:false,grahanYoga:false,
    vargottama:rashi===d9rashi,bhavaVargottama:false};
  });
  // Drishti calculation
  for(const pd of planetData){
   for(const q of planetData){
    if(q.n===pd.n)continue;
    const diff=(pd.house-q.house+12)%12;
    let asp=false;
    if(diff===6)asp=true; // 7th
    if(q.n==='मंगल'&&(diff===3||diff===7))asp=true;
    if(q.n==='गुरु'&&(diff===4||diff===8))asp=true;
    if(q.n==='शनि'&&(diff===2||diff===9))asp=true;
    if(asp)pd.drishtiFrom.push(q.n);
   }
  }
  // Jaimini karakas by degree
  const byDeg=[...planetData].filter(p=>!['राहु','केतु'].includes(p.n)).sort((a,b)=>b.degInRashi-a.degInRashi);
  byDeg.forEach((p,i)=>{const tgt=planetData.find(x=>x.n===p.n);if(tgt)tgt.karak=KARAKS[i]||'';});

  // AUTO-CALC Shadbala + BAV
  await autoCalcShadbalaBAV(info, jd);

  renderResults();
  renderResults2();
 }catch(e){showError('Error: '+e);}
}

// Auto-calculate Shadbala and BAV
async function autoCalcShadbalaBAV(info, jd){
 const swe=_swe;
 try{setHTable(H_TABLE_DATA);}catch(e){}
 // Planet longitudes in Shadbala order: Sun, Moon, Mars, Mercury, Jupiter, Venus, Saturn
 const order=['सूर्य','चंद्र','मंगल','बुध','गुरु','शुक्र','शनि'];
 const lons=order.map(n=>{
  const p=planetData.find(x=>x.n===n);
  return p?p.lng:0;
 });
 const lagnaLon=planetData.length?getRashiLng():0;
 function getRashiLng(){
  // lagna from planetData calc - use first planet's house info
  return 0; // Will compute properly below
 }
 // Get lagna longitude
 const lagnaR=lagnaRashi;
 const lagnaLonDeg=lagnaR*30+2; // approx
 // MC approx = lagna + 270
 const mc=norm360(lagnaLonDeg+270);
 const ascendant=lagnaLonDeg;

 // Sunrise/sunset
 const ss=calcSunriseSunset(jd, info.lat, info.lon, swe, _SEP);
 const birthHrs=info.hh+info.mm/60+info.ss/3600;

 // Lords
 const sunLon=lons[0];
 const kalaCtx={
  sunriseHrs:ss.sunriseHrs, sunsetHrs:ss.sunsetHrs, sunriseNextHrs:ss.sunriseNextHrs,
  birthHrs:birthHrs,
  abdaLord:abdaLordFromYear(info.Y),
  masaLord:masaLordFromSun(sunLon),
  varaLord:varaLordFromJD(jd),
  horaLord:horaLordFromBirth(ss.sunriseHrs, birthHrs, varaLordFromJD(jd)),
  ayanamsa:swe.getAyanamsa(jd)
 };

 // Seeghrocha
 const seeghrocha=[
  sunSeeghrocha?sunSeeghrocha(jd):sunLon,
  0,0,
  mercurySeeghrocha(jd),0,
  venusSeeghrocha?venusSeeghrocha(jd):sunLon,
  0
 ];

 try{
  const res=calculateShadbala({planets:lons, lagna:lagnaLonDeg, ascendant, mc, kalaCtx, seeghrocha});
  window._autoShadbala={};
  order.forEach((n,i)=>{
   window._autoShadbala[n]=res.total[i]/60; // rupas
  });
 }catch(e){console.log('Shadbala auto failed:',e);}

 // BAV via Ashtakavarga
 try{
  const pos={};
  const pmap={सूर्य:'Sun',चंद्र:'Moon',मंगल:'Mars',बुध:'Mercury',गुरु:'Jupiter',शुक्र:'Venus',शनि:'Saturn'};
  for(const pd of planetData){
   if(pmap[pd.n])pos[pmap[pd.n]]=pd.rashi;
  }
  pos['Lagna']=lagnaRashi;
  window._autoBAV={};
  if(typeof calcSAV==='function'){
   const sav=calcSAV(pos);
   window._autoSAV=sav;
   for(const pd of planetData){
    if(pmap[pd.n]){
     window._autoBAV[pd.n]=Math.round(sav[pd.rashi]/7);
    }
   }
  }
 }catch(e){console.log('BAV auto failed:',e);}

 // BAL auto (BPHS approximate: based on bhava lord shadbala + SAV)
 try{
  window._autoBAL={};
  const order=['सूर्य','चंद्र','मंगल','बुध','गुरु','शुक्र','शनि'];
  for(const pd of planetData){
   // Approximate BAL: shadbala rupas * 60 + SAV factor
   const shRupas=(window._autoShadbala&&window._autoShadbala[pd.n])?window._autoShadbala[pd.n]:6;
   const savVal=(window._autoSAV)?window._autoSAV[pd.rashi]:28;
   // BAL approx = (shadbala_virupas * 0.8 + sav * 10) - simplified
   const bal=Math.round(shRupas*60*0.7 + savVal*8);
   window._autoBAL[pd.n]=bal;
  }
 }catch(e){console.log('BAL auto failed:',e);}
}


function renderResults(){
  const box=document.getElementById('results');
  box.innerHTML='';
  // Shadbala ranks by Strength ratio
  const shVals=planetData.map(pd=>{
    const sh=(window._autoShadbala&&window._autoShadbala[pd.n])?window._autoShadbala[pd.n]:6;
    const min=SH_MIN_AUTO[pd.n]||5;
    return{n:pd.n,v:sh/min};
  }).filter(x=>['सूर्य','चंद्र','मंगल','बुध','गुरु','शुक्र','शनि'].includes(x.n));
  shVals.sort((a,b)=>b.v-a.v);
  const shRank={};
  shVals.forEach((x,i)=>{shRank[x.n]=i+1;});
  const scored=planetData.map(pd=>({...pd,score:scorePlanetAuto(pd,shRank)}));
  scored.sort((a,b)=>b.score.total-a.score.total);
  window._scoredAuto=scored;

  const catNames={shadbala:'षड्बल',rashi:'राशि',bhava:'भाव स्थिति',swamitva:'भाव स्वामित्व',nakshatra:'नक्षत्र',bav:'BAV',d9rashi:'D9 राशि',d9bhava:'D9 भाव',d9nakshatra:'D9 नक्षत्र'};
  const d1keys=['shadbala','rashi','bhava','swamitva','nakshatra','bav'];
  const d9keys=['d9rashi','d9bhava','d9nakshatra'];
  const modNames={asta:'अस्त',pushkar:'पुष्कर/मृत्यु',yoga:'योग बोनस',vakri:'वक्री (चेष्टा बल)',vargottama:'वर्गोत्तम',navatara:'नवतारा',yutiGraha:'युति',drishtiGraha:'ग्रह दृष्टि'};

  for(const pd of scored){
    const sc=pd.score;
    let detailRows='<tr style="background:#e8f5e9"><td colspan="3"><b>BASE 1 (D1) [70]</b></td></tr>';
    for(const k of d1keys){
      const v=sc.breakdown[k];
      if(!v)continue;
      detailRows+=`<tr><td>${catNames[k]||k}</td><td style="color:#888">${v.label}</td><td>${v.pts}/${v.max}</td></tr>`;
    }
    detailRows+=`<tr style="background:#e8f5e9"><td><b>Base 1 कुल</b></td><td></td><td><b>${sc.base1Score||''}</b></td></tr>`;
    detailRows+='<tr style="background:#e3f2fd"><td colspan="3"><b>BASE 2 (D9) [30]</b></td></tr>';
    for(const k of d9keys){
      const v=sc.breakdown[k];
      if(!v)continue;
      detailRows+=`<tr><td>${catNames[k]||k}</td><td style="color:#888">${v.label}</td><td>${v.pts}/${v.max}</td></tr>`;
    }
    detailRows+=`<tr style="background:#e3f2fd"><td><b>Base 2 कुल</b></td><td></td><td><b>${sc.base2Score||''}</b></td></tr>`;
    detailRows+=`<tr style="background:#e8f5e9"><td><b>Base कुल</b></td><td></td><td><b>${sc.baseScore}</b></td></tr>`;
    detailRows+=`<tr style="background:#fff3e0"><td colspan="3"><b>MODIFIERS</b></td></tr>`;
    for(const[k,v]of Object.entries(sc.modifiers)){
      const color=v.pts>0?'#2e7d32':v.pts<0?'#c62828':'#888';
      detailRows+=`<tr><td>${modNames[k]||k}</td><td style="color:#888">${v.label}</td><td style="color:${color};font-weight:bold">${v.pts>0?'+':''}${v.pts}</td></tr>`;
    }
    detailRows+=`<tr class="total"><td><b>कुल</b></td><td></td><td><b>${sc.total}%</b></td></tr>`;
    box.innerHTML+=`
    <div class="planet-card ${sc.cls}">
      <div class="ph"><span class="pname">${pd.sym} ${pd.n}</span><span class="ppct">${sc.total}%</span></div>
      <div class="meter"><div class="mfill" style="width:${sc.total}%"></div></div>
      <span class="verdict" onclick="toggleDetail('${pd.n}')">${sc.verdict} ▼</span>
      <div class="details" id="det_${pd.n}">
        <div class="drow">
          <span><b>भाव:</b> ${pd.house} (${RASHIS[pd.rashi]})</span>
          <span><b>डिग्री:</b> ${pd.degInRashi.toFixed(2)}°</span>
          <span><b>नक्षत्र:</b> ${pd.nak.name} (D1)</span>
        </div>
        <div class="drow">
          <span><b>स्वामी:</b> ${(pd.owns||[]).join(', ')||'-'}</span>
          <span><b>D9:</b> ${RASHIS[pd.d9rashi]} | ${pd._d9nakName||''} | भाव ${getHouse(pd.d9rashi,d9LagnaRashi)}</span>
        </div>
        <div class="drow">
          <span><b>नवमांश:</b> ${RASHIS[pd.d9rashi]}</span>
          <span><b>वक्री:</b> ${pd.retro?'हां':'नहीं'}</span>
          <span><b>युति:</b> ${pd.yuti.join(', ')||'अकेला'}</span>
        </div>
        <table class="stable">${detailRows}</table>
      </div>
    </div>`;
  }
  setTimeout(()=>{document.querySelectorAll('#results .mfill').forEach(el=>{const w=el.style.width;el.style.width='0';setTimeout(()=>el.style.width=w,50);});},100);
  const sb=document.getElementById('summaryBox');
  sb.innerHTML=`<div class="summary"><h3>📊 सारांश</h3>
  <div><b>सबसे बलवान:</b> ${scored[0].n} (${scored[0].score.total}%) | <b>सबसे कमजोर:</b> ${scored[scored.length-1].n} (${scored[scored.length-1].score.total}%)</div>
  <div class="rank">${scored.map((p,i)=>`<span class="chip">${i+1}. ${p.n} ${p.score.total}%</span>`).join('')}</div></div>`;
  document.getElementById('toolbar').classList.remove('hidden');
}

function toggleDetail(n){
  document.getElementById('det_'+n).classList.toggle('show');
}

// ============ TAB 2 RENDER ============
function renderResults2(){
  const box=document.getElementById('results2');
  const sb=document.getElementById('summaryBox2');
  if(!box||!window._scoredAuto)return;
  box.innerHTML='';sb.innerHTML='';
  const scored=[];
  for(let h=1;h<=12;h++)scored.push({h,score:scoreHouseAuto(h)});
  scored.sort((a,b)=>b.score.total-a.score.total);

  const catNames={lordScore:'भावेश शक्ति',lordPlace:'भावेश स्थिति',occupants:'स्थित ग्रह',aspects:'दृष्टि',sav:'SAV',bhavaRank:'भाव रैंक'};
  const modNames={swaDrishti:'स्व-दृष्टि',lagneshOcc:'लग्नेश उपस्थिति',vry:'विपरीत राजयोग',cuspPushkar:'भाव मध्य पुष्कर'};

  for(const hs of scored){
    const h=hs.h,sc=hs.score;
    let detailRows='<tr style="background:#e8f5e9"><td colspan="3"><b>BASE SCORE</b></td></tr>';
    for(const[k,v]of Object.entries(sc.breakdown)){
      detailRows+=`<tr><td>${catNames[k]||k}</td><td style="color:#888">${v.label}</td><td>${v.pts}/${v.max}</td></tr>`;
    }
    detailRows+=`<tr style="background:#e8f5e9"><td><b>Base कुल</b></td><td></td><td><b>${sc.baseScore}</b></td></tr>`;
    detailRows+=`<tr style="background:#fff3e0"><td colspan="3"><b>MODIFIERS</b></td></tr>`;
    for(const[k,v]of Object.entries(sc.modifiers)){
      const color=v.pts>0?'#2e7d32':v.pts<0?'#c62828':'#888';
      detailRows+=`<tr><td>${modNames[k]||k}</td><td style="color:#888">${v.label}</td><td style="color:${color};font-weight:bold">${v.pts>0?'+':''}${v.pts}</td></tr>`;
    }
    detailRows+=`<tr class="total"><td><b>कुल</b></td><td></td><td><b>${sc.total}%</b></td></tr>`;
    box.innerHTML+=`
    <div class="planet-card ${sc.cls}">
      <div class="ph"><span class="pname">🏠 भाव ${h} <small style="font-weight:normal">(${RASHIS[sc.rashi]}, ${sc.lord})</small></span><span class="ppct">${sc.total}%</span></div>
      <div class="meter"><div class="mfill" style="width:${sc.total}%"></div></div>
      <span class="verdict" onclick="toggleDetail2(${h})">${sc.verdict} ▼</span>
      <div class="details" id="det2_${h}">
        <div class="drow">
          <span><b>स्वामी:</b> ${sc.lord}</span>
          <span><b>स्थित:</b> ${sc.occupants.join(', ')||'खाली'}</span>
          <span><b>दृष्टि:</b> ${sc.aspecting.join(', ')||'-'}</span>
        </div>
        <table class="stable">${detailRows}</table>
      </div>
    </div>`;
  }
  setTimeout(()=>{document.querySelectorAll('#results2 .mfill').forEach(el=>{const w=el.style.width;el.style.width='0';setTimeout(()=>el.style.width=w,50);});},100);
  sb.innerHTML=`<div class="summary"><h3>📊 सारांश (भाव बल)</h3>
  <div><b>सबसे बलवान भाव:</b> ${scored[0].h} (${scored[0].score.total}%) | <b>सबसे कमजोर:</b> ${scored[scored.length-1].h} (${scored[scored.length-1].score.total}%)</div>
  <div class="rank">${scored.map((p,i)=>`<span class="chip">${i+1}. भाव ${p.h} ${p.score.total}%</span>`).join('')}</div></div>`;
}
function toggleDetail2(h){
  document.getElementById('det2_'+h).classList.toggle('show');
}

function takeScreenshot(){
  html2canvas(document.getElementById('mainContainer')).then(c=>{
    const a=document.createElement('a');a.download='graha-bala-auto.png';a.href=c.toDataURL();a.click();
  });
}

function downloadTXT(){
  const tab=activeTab;
  let txt='';
  if(tab===1&&window._scoredAuto){
    txt='ग्रह बल विश्लेषण Auto v4.1\n========================\n\n';
    window._scoredAuto.forEach((p,i)=>{
      txt+=(i+1)+'. '+p.n+': '+p.score.total+'% ('+p.score.verdict+')\n';
      for(const[k,v]of Object.entries(p.score.breakdown))txt+='   - '+v.label+': '+v.pts+'/'+v.max+'\n';
      for(const[k,v]of Object.entries(p.score.modifiers))if(v.pts!==0)txt+='   * '+v.label+': '+(v.pts>0?'+':'')+v.pts+'\n';
      txt+='\n';
    });
  }else if(tab===2){
    txt='भाव बल विश्लेषण Auto v1\n========================\n\n';
    // re-score to get order
    const scored=[];
    for(let h=1;h<=12;h++)scored.push({h,score:scoreHouseAuto(h)});
    scored.sort((a,b)=>b.score.total-a.score.total);
    scored.forEach((hs,i)=>{
      txt+=(i+1)+'. भाव '+hs.h+' ('+RASHIS[hs.score.rashi]+'): '+hs.score.total+'%\n';
    });
  }
  const blob=new Blob([txt],{type:'text/plain;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=(tab===1?'Graha_Bala_Auto_v1':'Bhava_Bala_Auto_v1')+'.txt';
  a.click();
}
</script>
