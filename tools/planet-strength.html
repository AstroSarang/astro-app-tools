const NAKS=['अश्विनी','भरणी','कृत्तिका','रोहिणी','मृगशीर्ष','आर्द्रा','पुनर्वसु','पुष्य','आश्लेषा','मघा','पूर्वाफाल्गुनी','उत्तराफाल्गुनी','हस्त','चित्रा','स्वाति','विशाखा','अनुराधा','ज्येष्ठा','मूल','पूर्वाषाढ़ा','उत्तराषाढ़ा','श्रवण','धनिष्ठा','शतभिषा','पूर्वाभाद्रपद','उत्तराभाद्रपद','रेवती'];

 const s=[...SHUBHA_BASE];

 if(pd.n==='चंद्र'&&!pd.isKrishna)s.push('चंद्र');
 // Budh when not in papa yuti
 if(pd.n==='बुध'){

  if(!hasPapaYuti)s.push('बुध');
 }
 return s;
}

// ============ ASTRO CODE PARSE ============
function parseAstroCode(code){
 // v17 fix: regex-based parser handles negative timezones (e.g. --0500 for Chicago)
 const m=code.trim().match(/^AS1-(\d{8})-(\d{6})-([+-]\d{4})-(\d{4})([NS])-(\d{5})([EW])$/i);
 if(!m)throw'Invalid code';
 const dt=m[1],tm=m[2],tz=m[3],latS=m[4],latD=m[5],lonS=m[6],lonD=m[7];
 const Y=+dt.slice(0,4),M=+dt.slice(4,6),D=+dt.slice(6,8);
 const hh=+tm.slice(0,2),mm=+tm.slice(2,4),ss=+tm.slice(4,6);
 const tzh=t=>{const s=t[0]==='-'?-1:1;return s*(+t.slice(1,3)+ +t.slice(3,5)/60);};
 const tzs=tzh(tz);
 const la=(s,d)=>{const dd=+s.slice(0,2),mm=+s.slice(2)/60;const sg=d.toUpperCase()==='S'||d.toUpperCase()==='W'?-1:1;return sg*(dd+mm);};
 // Note: lat format DDMM, lon format DDDMM
 const latLa=(s,d)=>{const dd=+s.slice(0,s.length-2),mm=+s.slice(s.length-2)/60;const sg=d.toUpperCase()==='S'?-1:1;return sg*(dd+mm);};
 const lonLa=(s,d)=>{const dd=+s.slice(0,s.length-2),mm=+s.slice(s.length-2)/60;const sg=d.toUpperCase()==='W'?-1:1;return sg*(dd+mm);};
 return{Y,M,D,hh,mm,ss,tzs,lat:latLa(latS,latD),lon:lonLa(lonS,lonD)};
}

// ============ CALCULATIONS ============
const EPHEM_CDN='https://cdn.jsdelivr.net/npm/@swisseph/browser@1.4.0/dist/swisseph-browser.js';
let _swe=null,_sweLoading=null,_SEP=null;
async function ensureSwe(){
 if(_swe)return _swe;
 if(_sweLoading)return _sweLoading;
 _sweLoading=(async()=>{
  const m=await import(/* @vite-ignore */EPHEM_CDN);
  const swe=new m.SwissEphemeris();await swe.init();
  swe.setSiderealMode(m.SiderealMode.Lahiri);
  _swe=swe;_SEP=m.Planet;return swe;
 })();
 return _sweLoading;
}
const norm360=x=>((x%360)+360)%360;
function jdFromYMDH(y,mo,d,utH){
 let Y=y,M=mo;
 if(M<=2){Y--;M+=12;}
 const A=Math.floor(Y/100),B=2-A+Math.floor(A/4);
 return Math.floor(365.25*(Y+4716))+Math.floor(30.6001*(M+1))+d+B-1524.5+utH/24;
}
const SEPBODY={0:'Sun',1:'Moon',2:'Mercury',3:'Venus',4:'Mars',5:'Jupiter',6:'Saturn'};
async function calcPositions(info){
 const swe=await ensureSwe();
 const utcH=info.hh+info.mm/60+info.ss/3600-info.tzs;
 const jd=jdFromYMDH(info.Y,info.M,info.D,utcH);
 const ayan=swe.getAyanamsa(jd);
 const res=[];
 for(const pl of PLANETS){
  let lng,retro=false;
  if(pl.body<=6){
   const r=swe.calculatePosition(jd,_SEP[SEPBODY[pl.body]],0);
   lng=norm360(r.longitude-ayan);
   // retro via speed: check position diff
   const r2=swe.calculatePosition(jd+0.5,_SEP[SEPBODY[pl.body]],0);
   let sp=r2.longitude-r.longitude;if(sp>180)sp-=360;if(sp<-180)sp+=360;
   retro=sp<0;
  }else if(pl.body===10){
   // Rahu: use body number 10 directly (never MeanNode)
   const r=swe.calculatePosition(jd,10,0);
   lng=norm360(r.longitude-ayan);
   retro=true;
  }else{
   // Ketu: Rahu + 180
   const r=swe.calculatePosition(jd,10,0);
   let rl=norm360(r.longitude-ayan);
   lng=norm360(rl+180);
   retro=true;
  }
  res.push({...pl,lng,retro});
 }
 const asc=norm360(swe.calculateHouses(jd,info.lat,info.lon,'P').ascendant-ayan);
 return{planets:res,lagna:asc,jd};
}

function getRashi(lng){return Math.floor(lng/30)}
function getDegInRashi(lng){return lng%30}
function getNak(lng){const idx=Math.floor(lng/(360/27));return{idx,name:NAKS[idx],lord:NAK_LORDS[idx],pada:Math.floor((lng%(360/27))/(360/108))+1}}
function getHouse(rashi,lagnaR){return((rashi-lagnaR+12)%12)+1}
function dignityScore(pl,rashi){
 // Rahu/Ketu: neutral (no standard dignities)
 if(pl==='राहु'||pl==='केतु')return{r:10,label:'सम'};
 if(!DIGNITY[pl])return{r:0,label:'-'};
 const d=DIGNITY[pl];
 if(rashi===d.u)return{r:20,label:'उच्च'};
 if(rashi===d.mt)return{r:18,label:'मूलत्रिकोण'};
 if(d.s.includes(rashi))return{r:16,label:'स्वराशि'};
 // Friend/enemy
 const fr=FRIEND[pl]||[],en=ENEMY[pl]||[];
 // Need rashi lord - simplified mapping
 const LORDS=['मंगल','शुक्र','बुध','चंद्र','सूर्य','बुध','शुक्र','मंगल','गुरु','शनि','शनि','गुरु'];
 const lord=LORDS[rashi];
 if(fr.includes(lord))return{r:12,label:'मित्र'};
 if(en.includes(lord))return{r:6,label:'शत्रु'};
 return{r:10,label:'सम'};
}
function avastha(deg){
 if(deg<6)return{v:2,n:'बाल'};if(deg<12)return{v:4,n:'कुमार'};
 if(deg<18)return{v:5,n:'युवा'};if(deg<24)return{v:3,n:'किशोर'};
 if(deg<30)return{v:2,n:'वृद्ध'};return{v:1,n:'मृत'};
}
function navatara(pNak,mNak){
 const d=((pNak-mNak+27)%27)%9;
 const names=['जन्म','संपत','विपत','क्षेम','प्रत्यरि','साधक','वध','मित्र','अतिमित्र'];
 const scores=[3,5,1,4,2,4,0,4,5];
 return{n:names[d],s:scores[d]};
}
function isPushkarNavamsha(pl,lng){
 // Fully auto: Pushkar Navamsha by pada (1-indexed)
 // Fire (Mesha,Simha,Dhanu): 7th,9th pada | Earth (Vrishabha,Kanya,Makara): 3rd,5th
 // Air (Mithuna,Tula,Kumbha): 6th,8th | Water (Karka,Vrishchika,Meena): 1st,3rd
 const rashi=getRashi(lng),deg=getDegInRashi(lng);
 const pada=Math.floor(deg/(30/9))+1; // 1-9
 const el=rashi%4; // 0=fire,1=earth,2=air,3=water
 if(el===0)return pada===7||pada===9;
 if(el===1)return pada===3||pada===5;
 if(el===2)return pada===6||pada===8;
 return pada===1||pada===3; // water
}
function isPushkarBhaga(pl,lng){
 // Fully auto: Pushkar Bhaga by degree (entire degree)
 // Fire: 21°, Earth: 14°, Air: 24°, Water: 7°
 const rashi=getRashi(lng),deg=getDegInRashi(lng);
 const d=Math.floor(deg); // 0-29
 const el=rashi%4;
 if(el===0)return d===21;
 if(el===1)return d===14;
 if(el===2)return d===24;
 return d===7; // water
}
// Mrityu Bhaga degrees (1-indexed degree within rashi) per planet per rashi (Mesha..Meena)
const MRITYU_BHAGA={

 'चंद्र':[8,20,10,14,25,6,1,13,20,10,14,25],

 'शनि':[13,24,10,14,19,8,20,10,14,25,6,1]
};
function isMrityuBhaga(pl,lng){
 // Fully auto: check if planet's degree matches its Mrityu Bhaga
 if(!MRITYU_BHAGA[pl])return false; // Rahu/Ketu: no MB
 const rashi=getRashi(lng),deg=getDegInRashi(lng);
 const d1=Math.floor(deg)+1; // 1-30
 return MRITYU_BHAGA[pl][rashi]===d1;
}
function getChalitHouse(planetLng,lagnaLng){
 // Bhava Chalit (Sripati simplified): bhava spans cusp±15°
 for(let i=0;i<12;i++){
  const cusp=(lagnaLng+i*30)%360;
  let d=((planetLng-cusp)%360+360)%360;
  if(d>180)d-=360;
  if(Math.abs(d)<=15)return i+1;
 }
 const diff=((planetLng-lagnaLng)%360+360)%360;
 return Math.floor(diff/30)+1;
}

// ============ SHADBALA (auto) ============
/**
 * Shadbala Complete - INTEGRATED MODULE (v2 - APK-verified)
 * 
 * Integrates all 6 Shadbala components decoded from JyotishApp APK.
 * Replaces the old approximate shadbala_complete.js.
 * 
 * Components:
 * 1. Sthana Bala (स्थान बल) - Uchcha + Saptavargaja(35/35) + OjaYugma + Kendradi + Drekkana
 * 2. Dig Bala (दिग् बल) - Directional strength (method_g, 7/7 verified)
 * 3. Kala Bala (काल बल) - 9 sub-components (method_f + method_b, 42/42 verified)
 * 4. Chesta Bala (चेष्टा बल) - Motional strength (method_B decoded)
 * 5. Naisargika Bala (नैसर्गिक बल) - Natural strength (constants)
 * 6. Drik Bala (दृग् बल) - Aspect strength (method_i, 28/28 verified)

function vD1(lon) { return Math.floor(lon / 30); }
function vD2(lon) {
  const r = Math.floor(lon / 30), d = lon % 30;
  return (r % 2 === 0) ? (d < 15 ? 4 : 3) : (d < 15 ? 3 : 4);
}
function vD3(lon) {
  const r = Math.floor(lon / 30), d = lon % 30;
  return (r + Math.floor(d / 10) * 4) % 12;

function vD7(lon) {
  const r = Math.floor(lon / 30), d = lon % 30;

    return 6;
  } else {

function calculateSaptavargaja(p, lon, allLons) {
  if (!H_TABLE) throw new Error('H_TABLE not set. Call setHTable() first.');
  const pRashi = Math.floor(lon / 30);
  const vargas = [vD1(lon), vD2(lon), vD3(lon), vD7(lon), vD9(lon), vD12(lon), vD30(lon)];
  const names = ['D1', 'D2', 'D3', 'D7', 'D9', 'D12', 'D30'];
  let total = 0;
  for (let i = 0; i < 7; i++) {
    const r = vargas[i];
    let score;
    if (names[i] === 'D1' && isMoolatrikona(p, lon)) score = 45;
    else if (OWN_SIGNS[p].includes(r)) score = 30;
    else {

      const lord = RASHI_LORDS[r];
      const lordRashi = Math.floor(allLons[lord] / 30);
      score = panchadha(nat, isTemporalFriend(pRashi, lordRashi));

function calculateSthanaBala(planets, lagnaLon) {
  const result = [];
  for (let p = 0; p < 7; p++) {
    const lon = planets[p];
    let dist = Math.abs(lon - ((UCHCHA_POINTS[p] + 180) % 360));
    if (dist > 180) dist = 360 - dist;
    const uchcha = dist / 3.0;
    const saptavargaja = calculateSaptavargaja(p, lon, planets);
    const isFemale = (p === MOON || p === VENUS);
    let ojaYugma = 0;
    for (const v of [vD1(lon), vD9(lon)]) {
      const isEven = (v % 2 !== 0);
      if ((isFemale && isEven) || (!isFemale && !isEven)) ojaYugma += 15;
    }
    const pRashi = Math.floor(lon / 30);
    const lagnaRashi = Math.floor(lagnaLon / 30);
    const house = ((pRashi - lagnaRashi + 12) % 12) + 1;
    const kendradi = [1, 4, 7, 10].includes(house) ? 60 : ([2, 5, 8, 11].includes(house) ? 30 : 15);
    const dk = Math.floor((lon % 30) / 10) + 1;
    let drekkana = 0;
    if (dk === 1 && [SUN, MARS, JUPITER].includes(p)) drekkana = 15;
    if (dk === 2 && [MERCURY, SATURN].includes(p)) drekkana = 15;
    if (dk === 3 && [MOON, VENUS].includes(p)) drekkana = 15;
    const total = uchcha + saptavargaja + ojaYugma + kendradi + drekkana;
    result.push({ uchcha, saptavargaja, ojaYugma, kendradi, drekkana, total });
  }
  return result;
}

const KHANDA1 = [362, 341, 299, 236, 150, 52];

    if (sayana >= 360) sayana -= 360;

    if (sayana > 90 && sayana < 270) x = Math.abs(180 - sayana);
    else if (sayana >= 270) x = Math.abs(360 - sayana);
    const idx = Math.floor(x / 15);
    const rem = x % 15;
    let kranti = (rem * KHANDA1[idx]) / 15.0;
    if (idx > 0) kranti += KHANDA2[idx - 1];
    let v = kranti;
    if (p === MOON || p === SATURN) { if (isSouth === 0) v = -v; }
    else if (p === MERCURY) { /* absolute */ }
    else { if (isSouth !== 0) v = -v; }
    v = (1440.0 + v) / 48.0;

function calculateKalaBala(planets, ctx) {
  const nat = (function() {
    const noon = (ctx.sunriseHrs + ctx.sunsetHrs) / 2;
    let midnight = (ctx.sunsetHrs + ctx.sunriseNextHrs + 24) / 2;
    if (midnight >= 24) midnight -= 24;
    let dNoon = Math.abs(ctx.birthHrs - noon);
    if (dNoon > 12) dNoon = 24 - dNoon;
    let dMid = Math.abs(ctx.birthHrs - midnight);
    if (dMid > 12) dMid = 24 - dMid;
    return [(12-dNoon)*5, (12-dMid)*5, (12-dMid)*5, 60.0, (12-dNoon)*5, (12-dNoon)*5, (12-dMid)*5];
  })();
  const pak = (function() {
    let elong = planets[SUN] - planets[MOON];
    // paksha uses moon-sun elongation
    elong = planets[MOON] - planets[SUN];
    if (elong < 0) elong += 360;
    if (elong > 180) elong = 360 - elong;
    const val = elong / 3.0;
    return [60-val, 2*val, 60-val, 60-val, val, val, 60-val];
  })();
  const tri = (function() {
    const r = [0,0,0,0,60,0,0];
    const isNight = ctx.birthHrs >= ctx.sunsetHrs || ctx.birthHrs < ctx.sunriseHrs;
    if (!isNight) {
      const part = Math.floor((ctx.birthHrs - ctx.sunriseHrs) / ((ctx.sunsetHrs - ctx.sunriseHrs) / 3));
      if (part === 0) r[MERCURY] = 60; else if (part === 1) r[SUN] = 60; else r[SATURN] = 60;
    } else {
      const nightDur = (ctx.sunriseNextHrs + 24) - ctx.sunsetHrs;
      const tss = ctx.birthHrs >= ctx.sunsetHrs ? ctx.birthHrs - ctx.sunsetHrs : (ctx.birthHrs + 24) - ctx.sunsetHrs;
      const part = Math.floor(tss / (nightDur / 3));
      if (part === 0) r[MOON] = 60; else if (part === 1) r[VENUS] = 60; else r[MARS] = 60;
    }
    return r;
  })();
  const lords = [0,0,0,0,0,0,0];
  lords[ctx.abdaLord] += 15; lords[ctx.masaLord] += 30;
  lords[ctx.varaLord] += 45; lords[ctx.horaLord] += 60;
  const aya = kalaAyana(planets, ctx.ayanamsa);
  const yud = [0,0,0,0,0,0,0];
  const total = [];
  for (let p = 0; p < 7; p++)

  return { natonnata: nat, paksha: pak, tribhaga: tri, lords, ayana: aya, yuddha: yud, total };

function sGraha(d) {
  d = ((d % 360) + 360) % 360;
  if (d <= 30) return 0;
  if (d <= 60) return (d - 30) / 2;
  if (d <= 90) return d - 45;
  if (d <= 120) return (120 - d) / 2 + 30;
  if (d <= 150) return 150 - d;
  if (d <= 180) return 2 * (d - 150);
  if (d < 300) return (300 - d) / 2;
  return 0;
}
function rashiDrishti(q, d) {
  d = ((d % 360) + 360) % 360;
  if (q === MARS) {
    if (d > 90 && d <= 120) return -15.0;
    if (d > 210 && d <= 240) return -15.0;
  } else if (q === JUPITER) {
    if (d > 120 && d <= 150) return 30.0;
    if (d > 240 && d <= 270) return 30.0;
  } else if (q === SATURN) {
    if (d > 60 && d <= 90) return -45.0;
    if (d > 270 && d <= 300) return -45.0;
  }
  return 0;
}
const NAT_BENEFIC = new Set([MOON, JUPITER, VENUS]);
const NAT_MALEFIC = new Set([SUN, MARS, SATURN]);
function moonIsBenefic(sunLon, moonLon) {
  const elong = (((moonLon - sunLon) % 360) + 360) % 360;
  return elong >= 96 && elong <= 264;
}
function mercurySign(lons) {
  const merRashi = Math.floor(lons[MERCURY] / 30);
  let nBen = 0, nMal = 0;
  for (let i = 0; i < 7; i++) {
    if (i === MERCURY) continue;

      if (NAT_BENEFIC.has(i)) nBen++;
      if (NAT_MALEFIC.has(i)) nMal++;

  }
  if (nMal === 0) return +1;
  return nBen > nMal ? +1 : -1;
}
function calculateDrikBala(lons) {
  const signs = [-1, moonIsBenefic(lons[SUN], lons[MOON]) ? +1 : -1, -1,
                 mercurySign(lons), +1, +1, -1];
  const res = [];
  for (let p = 0; p < 7; p++) {
    let acc = 0;
    for (let q = 0; q < 7; q++) {

      const d = (((lons[p] - lons[q]) % 360) + 360) % 360;
      acc += signs[q] * sGraha(d) + rashiDrishti(q, d);

    res.push(acc / 4.0);

}

  const J = n - lon/360;
  const M = (357.5291 + 0.98560028*J) % 360;
  const C = 1.9148*Math.sin(M*Math.PI/180) + 0.0200*Math.sin(2*M*Math.PI/180) + 0.0003*Math.sin(3*M*Math.PI/180);
  const L = (M + C + 180 + 102.9372) % 360;
  const Jtransit = 2451545.0 + J + 0.0053*Math.sin(M*Math.PI/180) - 0.0069*Math.sin(2*L*Math.PI/180);
  const solarNoonJD = Jtransit + lon/360;
  const solarNoonHrs = (solarNoonJD - Math.floor(solarNoonJD)) * 24;
  const sunriseHrs = solarNoonHrs - H;
  const sunsetHrs = solarNoonHrs + H;
  // Next day sunrise (approx same)
  const sunriseNextHrs = sunriseHrs; // simplification
  return { sunriseHrs: ((sunriseHrs%24)+24)%24, sunsetHrs: ((sunsetHrs%24)+24)%24, sunriseNextHrs: ((sunriseNextHrs%24)+24)%24 };
}

function varaLordFromJD(jd) {
  const dow = Math.floor(jd + 1.5) % 7;
  return dow; // 0=Sun, 1=Moon, 2=Mars, 3=Mercury, 4=Jupiter, 5=Venus, 6=Saturn
}

function masaLordFromSun(sunLonSid) {
  const RASHI_LORDS = [2, 5, 3, 1, 0, 3, 5, 2, 4, 6, 6, 4]; // Mars, Venus, Mercury, Moon, Sun...
  // Map: 0=Sun,1=Moon,2=Mars,3=Mercury,4=Jupiter,5=Venus,6=Saturn
  const rashi = Math.floor(sunLonSid / 30);
  return RASHI_LORDS[rashi];
}

function horaLordFromBirth(sunriseHrs, birthHrs, varaLord) {
  // Hora lords sequence starting from vara lord
  const seq = [varaLord];
  const order = [0, 5, 3, 1, 6, 2, 4]; // Sun, Venus, Mercury, Moon, Saturn, Mars, Jupiter
  let idx = order.indexOf(varaLord);
  for (let i = 1; i < 24; i++) {
    idx = (idx + 1) % 7;
    seq.push(order[idx]);
  }
  const hrsSinceSunrise = ((birthHrs - sunriseHrs) % 24 + 24) % 24;
  const horaIdx = Math.floor(hrsSinceSunrise);
  return seq[horaIdx % 24];
}

function geminiRashiPts(pd){

 if(n==='केतु'){

 const d=DIGNITY[n];

 else if(r===d.mt){pts=18;label='मूलत्रिकोण';}
 else if(d.s.includes(r)){pts=16;label='स्वराशि';}
 else{
  const lord=RASHI_LORD_NAMES[r];

  else{pts=8;label='सम राशि';}
 }
 // Dynamic Neechbhanga: neecha (0 pts) + conjunct dispositor OR dispositor uchcha => 12
 if(pts===0&&r===d.n){
  const dispositor=RASHI_LORD_NAMES[r];
  const dispUchcha=DIGNITY[dispositor]?DIGNITY[dispositor].u:-1;
  let dispIsUchcha=false;
  for(const q of planetData){

  }
  if(pd.yuti.includes(dispositor)||dispIsUchcha){
   pts=12;label='नीचभंग';
  }else{
   label='नीच';
  }
 }
 // Dispositor Support (v14): enemy/neecha but dispositor in same house in swarashi/uchcha => 8
 if((pts===4||pts===0)&&pd.yuti.length>0){
  const dispositor=RASHI_LORD_NAMES[r];

     pts=8;label='डिस्पोज़िटर सपोर्ट';
     break;

   }
  }
 }
 return{pts,label};
}

function scorePlanet(pd,manual,shRank){

 b.rashi={pts:rashi.pts,max:20,label:rashi.label};
 const bhava=geminiBhavaPts(pd);
 b.bhava={pts:bhava.pts,max:15,label:bhava.label};
 const d9=geminiD9Pts(pd);
 b.d9={pts:d9.pts,max:15,label:d9.label};
 const sh=geminiShadbalaPts(pd,shRank);
 const shRaw=manual['shadbala_'+pd.n];
 b.shadbala={pts:sh.pts,max:20,label:sh.label+(shRaw?' ('+Math.round(shRaw*60)+' विरूप)':'')};
 const bav=geminiBAVPts(pd,manual);
 b.bav={pts:bav.pts,max:10,label:bav.label};
 const nak=geminiNakshatraPts(pd);
 b.nakshatra={pts:nak.pts,max:10,label:nak.label};
 const avs=geminiAvasthaPts(pd);
 b.avastha={pts:avs.pts,max:10,label:avs.label};
 const baseScore=b.rashi.pts+b.bhava.pts+b.d9.pts+b.shadbala.pts+b.bav.pts+b.nakshatra.pts+b.avastha.pts;
 // ---- PART 2: MODIFIERS ----
 const nt=geminiNavataraMod(pd);
 m.navatara={pts:nt.pts,label:nt.label};
 const pk=geminiPushkarMod(pd,manual);
 m.pushkar={pts:pk.pts,label:pk.label};
 const ch=geminiChalitMod(pd,manual);
 m.chalit={pts:ch.pts,label:ch.label};
 const dy=geminiDrishtiYutiMod(pd);
 m.drishti={pts:dy.pts,label:dy.label};
 const d9pen=d9.isNeecha?{pts:-10,label:'D9 नीच पेनल्टी'}:{pts:0,label:'नहीं'};
 m.d9penalty=d9pen;
 // D9 Special Bonus (v14): D9 lagna or 9th house => +5
 let d9bonus={pts:0,label:'नहीं'};
 // D9 house = (planet's D9 rashi - D9 lagna + 12) % 12 + 1
 const d9house=((pd.d9rashi-d9LagnaRashi+12)%12)+1;
 if(d9house===1||d9house===9){
  d9bonus={pts:5,label:'D9 '+(d9house===1?'लग्न':'9वां')+' (+5)'};
 }
 m.d9bonus=d9bonus;
 // Yoga Bonus (v14): Rajyoga/Dhana Yoga +10
 let yogaBonus={pts:0,label:'नहीं'};
 // If planet is lord of 9/10/11 AND placed in 1,2,4,5,7,9,10,11
 const LORDS=['मंगल','शुक्र','बुध','चंद्र','सूर्य','बुध','शुक्र','मंगल','गुरु','शनि','शनि','गुरु'];
 const houses911=[];
 for(let i=0;i<12;i++){
  const h=((i-lagnaRashi+12)%12)+1;
  if([9,10,11].includes(h)&&LORDS[i]===pd.n)houses911.push(h);
 }
 if(houses911.length>0&&[1,2,4,5,7,9,10,11].includes(pd.house)){
  yogaBonus={pts:10,label:'राजयोग/धन योग (+10)'};
 }
 m.yoga=yogaBonus;
 // 🌟 Special Bonus Logic (v15 Patch - Gemini Final)
 let specialBonus={pts:0,label:'नहीं'};
 let specialLabels=[];
 // Rule 1: एकादश राहु (Rahu in 11th) - सर्व दोष नाशक
 if(pd.n==='राहु'&&pd.house===11){
  specialBonus.pts+=10;
  specialLabels.push('11वें भाव का राहु (+10)');
 }
 // Rule 2: धन भाव में शुभ ग्रह (Benefic in 2nd or 11th)
 const SHUBHA_PLANETS=['चंद्र','बुध','गुरु','शुक्र'];
 if(SHUBHA_PLANETS.includes(pd.n)&&(pd.house===2||pd.house===11)){
  specialBonus.pts+=10;
  specialLabels.push('धन भाव में शुभ ग्रह (+10)');
 }
 if(specialBonus.pts>0){
  specialBonus.label=specialLabels.join(', ');
 }
 m.specialBonus=specialBonus;
 const modTotal=m.navatara.pts+m.pushkar.pts+m.chalit.pts+m.drishti.pts+m.d9penalty.pts+m.d9bonus.pts+m.yoga.pts+m.specialBonus.pts;
 // ---- FINAL ----
 let total=baseScore+modTotal;
 // Floor Logic (v14 Final): Krura in 3/6/11 with own dispositor => min 30%
 const KRURA_PLANETS=['सूर्य','मंगल','शनि','राहु','केतु'];
 if(KRURA_PLANETS.includes(pd.n)&&[3,6,11].includes(pd.house)){
  const disp=RASHI_LORD_NAMES[pd.rashi];
  if(pd.yuti.includes(disp)){
   const dispDign=DIGNITY[disp];
   for(const q of planetData){
    if(q.n===disp){
     const dr=q.rashi;
     if(dispDign&&(dispDign.s.includes(dr)||dr===dispDign.u||dr===dispDign.mt)){
      if(total<30){m.floorCap={pts:30-total,label:'Floor Cap (30%)'};total=30;}
      break;
     }
    }
   }
  }
 }
 total=Math.max(0,Math.min(100,total));
 return{breakdown:b,modifiers:m,baseScore,modTotal,total,
  verdict:total>=70?'बलवान 💪':total>=40?'मध्यम ⚖️':'पीड़ित ⚠️',
  cls:total>=70?'strong':total>=40?'medium':'weak'};
}

function scoreHouse(h,manual){

 }else{lp=8;lpLabel='भाव '+lordHouse;}
 b.lordPlace={pts:lp,max:15,label:lord+' → '+lpLabel};

 // 3. Occupants [15]
 let oc,ocLabel;
 if(occupants.length===0){oc=8;ocLabel='खाली भाव';}

 else{

 }
 b.occupants={pts:oc,max:15,label:ocLabel};

 // 4. Aspects [10]
 let asp,aspLabel;
 if(aspecting.includes(lord)){asp=10;aspLabel='स्वामी की दृष्टि';}
 else if(aspecting.length===0){asp=5;aspLabel='कोई दृष्टि नहीं';}
 else{asp=Math.min(10,shubhaAsp.length*5);aspLabel='शुभ दृष्टि '+shubhaAsp.length+', क्रूर '+kruraAsp.length;}
 b.aspects={pts:asp,max:10,label:aspLabel};

 // 5. SAV [20]
 const sav=savForHouse(h,manual);
 let savPts,savLabel;
 if(sav>=35){savPts=20;savLabel='SAV '+sav+' (उत्तम)';}
 else if(sav>=30){savPts=16;savLabel='SAV '+sav+' (अच्छा)';}
 else if(sav>=25){savPts=10;savLabel='SAV '+sav+' (मध्यम)';}
 else if(sav>=20){savPts=5;savLabel='SAV '+sav+' (कम)';}
 else{savPts=0;savLabel='SAV '+sav+' (बहुत कम)';}
 b.sav={pts:savPts,max:20,label:savLabel};

 // 6. Bhava Bala rank [20]
 const br=bhavaRankPts(h);
 b.bhavaBala={pts:br.pts,max:20,label:br.label};

 const baseScore=b.lordScore.pts+b.lordPlace.pts+b.occupants.pts+b.aspects.pts+b.sav.pts+b.bhavaBala.pts;

 // ---- MODIFIERS ----
 // 7. Pushkar
 const cuspLng=rashi*30+15, sandhiLng=rashi*30;
 const cuspP=isPushkarNavamsha('सूर्य',cuspLng)||isPushkarBhaga('सूर्य',cuspLng);
 const sandhiP=isPushkarNavamsha('सूर्य',sandhiLng)||isPushkarBhaga('सूर्य',sandhiLng);
 let pk={pts:0,label:'नहीं'};
 if(cuspP&&sandhiP)pk={pts:20,label:'Cusp+Sandhi पुष्कर'};
 else if(cuspP||sandhiP)pk={pts:10,label:'पुष्कर (एक)'};
 m.pushkar=pk;

 // 8. Kartari

 const nextOcc=planetData.filter(p=>p.house===nextH).map(p=>p.n);
 let kar={pts:0,label:'नहीं'};

 if(onlyShubha(prevOcc)&&onlyShubha(nextOcc))kar={pts:10,label:'शुभकर्तरी'};

 m.kartari=kar;

 // 9. Heavy affliction
 let aff={pts:0,label:'नहीं'};

 if(!upachaya&&shubhaOcc.length===0&&shubhaAsp.length===0&&kruraCount>=2)

 // 10. Trik shield
 let shield={pts:0,label:'नहीं'};
 if([6,8,12].includes(h)&&occupants.length===0&&shubhaAsp.length>0&&sav>=30)
  shield={pts:20,label:'त्रिक शील्ड (खाली+शुभ दृष्टि+SAV)'};
 m.trikShield=shield;

 // 11. Yoga bonus
 let yoga={pts:0,label:'नहीं'};
 const hasCM=occupants.some(p=>p.n==='चंद्र')&&occupants.some(p=>p.n==='मंगल');
 if(hasCM)yoga={pts:10,label:'चंद्र-मंगल योग'};
 else if(lordPd){
  try{
   const rs=geminiRashiPts(lordPd);
   if(rs.label==='नीचभंग')yoga={pts:10,label:'भावेश का नीचभंग'};
  }catch(e){}
 }
 m.yoga=yoga;

 // 12. Swa-Drishti (v18): lord aspects own house => +20
 let swaDrishti={pts:0,label:'नहीं'};
 if(aspecting.includes(lord))
  swaDrishti={pts:20,label:'स्व-दृष्टि (मालिक की नज़र) (+20)'};
 m.swaDrishti=swaDrishti;

 // 13. Lagnesh Blessing (v18): lagnesh placed in this house => +15
 let lagneshBlessing={pts:0,label:'नहीं'};
 const lagneshName=RASHI_LORD_NAMES[lagnaRashi];
 if(occupants.some(p=>p.n===lagneshName))
  lagneshBlessing={pts:15,label:'लग्नेश का आशीर्वाद (+15)'};
 m.lagneshBlessing=lagneshBlessing;

 // 14. Vipareeta Raja Yoga (v18): trik house + lord in different trik => +10
 let vry={pts:0,label:'नहीं'};
 if([6,8,12].includes(h)&&[6,8,12].includes(lordHouse)&&h!==lordHouse)
  vry={pts:10,label:'विपरीत राजयोग (+10)'};
 m.vry=vry;

 // 15. Node Magic (v18): Rahu in 11th, or Ketu in 5/9/12 => +15
 let nodeMagic={pts:0,label:'नहीं'};
 if(occupants.some(p=>p.n==='राहु')&&h===11)
  nodeMagic={pts:15,label:'11वें भाव का राहु (+15)'};
 else if(occupants.some(p=>p.n==='केतु')&&[5,9,12].includes(h))
  nodeMagic={pts:15,label:'5/9/12 भाव का केतु (+15)'};
 m.nodeMagic=nodeMagic;

 // 17. Karaka Blessing (v20 refined): trik houses excluded; no double-dipping when karaka==lord
 let karakaBonus={pts:0,label:'नहीं'};
 const karakas=BHAVA_KARAKA[h]||[];
 const occNames=occupants.map(p=>p.n);
 // Rule A: trik houses (6,8,12) get no karaka blessing
 if(![6,8,12].includes(h)){
  // Rule B: exclude karaka if it's also the house lord (Swa-Drishti already covers)
  const activeKarakas=karakas.filter(k=>k!==lord);
  if(activeKarakas.some(k=>occNames.includes(k)||aspecting.includes(k)))
   karakaBonus={pts:13,label:'कारक आशीर्वाद (+13)'};
 }
 m.karakaBonus=karakaBonus;

 // 18. Swagruhi Lord Bonus (v19): lord itself placed in own house => +10
 let swagruhiBonus={pts:0,label:'नहीं'};
 if(occNames.includes(lord))
  swagruhiBonus={pts:10,label:'स्वगृही भावेश (+10)'};
 m.swagruhiBonus=swagruhiBonus;

 // 19. Enemy Occupant Penalty (v20 refined): only if enemy is also KRURA
 let enemyOcc={pts:0,label:'नहीं'};
 const lordEnemies=ENEMY[lord]||[];
 if(occNames.some(occ=>lordEnemies.includes(occ)&&BH_KRURA.includes(occ)))
  enemyOcc={pts:-10,label:'क्रूर शत्रु ग्रह (-10)'};
 m.enemyOcc=enemyOcc;

 const modTotal=m.pushkar.pts+m.kartari.pts+m.affliction.pts+m.trikShield.pts+m.yoga.pts+m.swaDrishti.pts+m.lagneshBlessing.pts+m.vry.pts+m.nodeMagic.pts+m.karakaBonus.pts+m.swagruhiBonus.pts+m.enemyOcc.pts;
 let total=baseScore+modTotal;
 // 16. Trik House Soft Cap (v18): cap 6/8/12 houses
 if([6,8,12].includes(h)){
  if(m.vry.pts===0&&m.trikShield.pts===0)total=Math.min(total,75);
  else total=Math.min(total,85);
 }
 total=Math.max(0,Math.min(100,total));
 return{breakdown:b,modifiers:m,baseScore,modTotal,total,
  verdict:total>=70?'बलवान 💪':total>=40?'मध्यम ⚖️':'पीड़ित ⚠️',

}

// ============ VERIFIED BHAVA DRISHTI BALA (Gemini v2, 48/48 verified 2026-10-11) ============
function calculateBhavaDrishtiBala(planetLongs, bhavaCusps) {
    let drigBala = new Array(12).fill(0.0);
    let sunLong = planetLongs[0];
    let moonLong = planetLongs[1];
    let diffMoonSun = moonLong - sunLong;
    if (diffMoonSun < 0) diffMoonSun += 360.0;
    let isMoonBenefic = (diffMoonSun >= 84.0 && diffMoonSun <= 276.0);
    for (let p = 0; p < 7; p++) {
        let pLong = planetLongs[p];
        let pIndex = p + 1;
        for (let b = 0; b < 12; b++) {
            let bLong = bhavaCusps[b];
            let diff = bLong - pLong;
            if (diff < 0) diff += 360.0;
            let v = 0.0;
            if (diff > 0 && diff <= 30) v = 0.0;
            else if (diff > 30 && diff <= 60) v = (diff - 30.0) / 2.0;
            else if (diff > 60 && diff <= 90) v = (diff - 60.0) + 15.0;
            else if (diff > 90 && diff <= 120) v = (120.0 - diff) / 2.0 + 30.0;
            else if (diff > 120 && diff <= 150) v = 150.0 - diff;
            else if (diff > 150 && diff <= 180) v = (diff - 150.0) * 2.0;
            else if (diff > 180 && diff <= 300) v = (300.0 - diff) / 2.0;
            else if (diff > 300 && diff <= 360) v = 0.0;
            if (v !== 0.0) {
                let isNegative = false;
                if (pIndex === 1 || pIndex === 3 || pIndex === 7) isNegative = true;
                else if (pIndex === 2) { if (!isMoonBenefic) isNegative = true; }
                if (isNegative) v = -v;
                if (pIndex === 3) { if ((diff > 90 && diff <= 120) || (diff > 210 && diff <= 240)) v -= 15.0; }
                else if (pIndex === 5) { if ((diff > 120 && diff <= 150) || (diff > 240 && diff <= 270)) v += 30.0; }
                else if (pIndex === 7) { if ((diff > 60 && diff <= 90) || (diff > 270 && diff <= 300)) v -= 45.0; }
                if (pIndex !== 4 && pIndex !== 5) v = v / 4.0;
                drigBala[b] += v;
            }
        }
    }
    return drigBala;
}

  planetData=planets.map(p=>{

   const house=getHouse(rashi,lagnaRashi);
   const nak=getNak(p.lng);

   // Air (Mithuna,Tula,Kumbha): Tula | Water (Karka,Vrishchika,Meena): Karka
   const pada=Math.floor(degInRashi/(30/9));
   const el=rashi%4; // 0=fire,1=earth,2=air,3=water
   const d9start=el===0?0:el===1?9:el===2?6:3;
   const d9rashi=(d9start+pada)%12;
   // Yuti: same house
   const yuti=planets.filter(q=>q.n!==p.n&&getHouse(getRashi(q.lng),lagnaRashi)===house).map(q=>q.n);
   // Drishti: 7th + special
   const drishtiFrom=[];
   const LORDS=['मंगल','शुक्र','बुध','चंद्र','सूर्य','बुध','शुक्र','मंगल','गुरु','शनि','शनि','गुरु'];
   const owns=LORDS.map((l,i)=>l===p.n?((i-lagnaRashi+12)%12)+1:null).filter(x=>x);
   return{...p,rashi,degInRashi,house,nak,d9rashi,yuti,drishtiFrom,owns,

   }

// Auto-calculate Shadbala and BAV
async function autoCalcShadbalaBAV(info, jd){
 const swe=_swe;
 try{setHTable(H_TABLE_DATA);}catch(e){}
 // Planet longitudes in Shadbala order: Sun, Moon, Mars, Mercury, Jupiter, Venus, Saturn
 const order=['सूर्य','चंद्र','मंगल','बुध','गुरु','शुक्र','शनि'];
 const lons=order.map(n=>{
  const p=planetData.find(x=>x.n===n);
  return p?p.lng:0;
 });
 const lagnaLon=planetData.length?getRashiLng():0;
 function getRashiLng(){
  // lagna from planetData calc - use first planet's house info
  return 0; // Will compute properly below
 }
 // Get lagna longitude
 const lagnaR=lagnaRashi;
 const lagnaLonDeg=lagnaR*30+2; // approx
 // MC approx = lagna + 270
 const mc=norm360(lagnaLonDeg+270);
 const ascendant=lagnaLonDeg;

 // Sunrise/sunset
 const ss=calcSunriseSunset(jd, info.lat, info.lon, swe, _SEP);
 const birthHrs=info.hh+info.mm/60+info.ss/3600;

 // Lords
 const sunLon=lons[0];
 const kalaCtx={
  sunriseHrs:ss.sunriseHrs, sunsetHrs:ss.sunsetHrs, sunriseNextHrs:ss.sunriseNextHrs,
  birthHrs:birthHrs,
  abdaLord:abdaLordFromYear(info.Y),
  masaLord:masaLordFromSun(sunLon),
  varaLord:varaLordFromJD(jd),
  horaLord:horaLordFromBirth(ss.sunriseHrs, birthHrs, varaLordFromJD(jd)),
  ayanamsa:swe.getAyanamsa(jd)
 };

 // Seeghrocha
 const seeghrocha=[
  sunSeeghrocha?sunSeeghrocha(jd):sunLon,
  0,0,
  mercurySeeghrocha(jd),0,
  venusSeeghrocha?venusSeeghrocha(jd):sunLon,
  0
 ];

 try{
  const res=calculateShadbala({planets:lons, lagna:lagnaLonDeg, ascendant, mc, kalaCtx, seeghrocha});
  window._autoShadbala={};
  order.forEach((n,i)=>{
   window._autoShadbala[n]=res.total[i]/60; // rupas
  });
 }catch(e){console.log('Shadbala auto failed:',e);}

 // BAV via Ashtakavarga
 try{
  const pos={};
  const pmap={सूर्य:'Sun',चंद्र:'Moon',मंगल:'Mars',बुध:'Mercury',गुरु:'Jupiter',शुक्र:'Venus',शनि:'Saturn'};
  for(const pd of planetData){
   if(pmap[pd.n])pos[pmap[pd.n]]=pd.rashi;
  }
  pos['Lagna']=lagnaRashi;
  window._autoBAV={};
  if(typeof calcSAV==='function'){
   const sav=calcSAV(pos);
   window._autoSAV=sav;
   for(const pd of planetData){
    if(pmap[pd.n]){
     window._autoBAV[pd.n]=Math.round(sav[pd.rashi]/7);
    }
   }
  }
 }catch(e){console.log('BAV auto failed:',e);}

 // BAL auto (BPHS approximate: based on bhava lord shadbala + SAV)
 try{
  window._autoBAL={};
  const order=['सूर्य','चंद्र','मंगल','बुध','गुरु','शुक्र','शनि'];
  for(const pd of planetData){
   // Approximate BAL: shadbala rupas * 60 + SAV factor
   const shRupas=(window._autoShadbala&&window._autoShadbala[pd.n])?window._autoShadbala[pd.n]:6;
   const savVal=(window._autoSAV)?window._autoSAV[pd.rashi]:28;
   // BAL approx = (shadbala_virupas * 0.8 + sav * 10) - simplified
   const bal=Math.round(shRupas*60*0.7 + savVal*8);
   window._autoBAL[pd.n]=bal;
  }
 }catch(e){console.log('BAL auto failed:',e);}
}

   <td style="padding:6px;border:1px solid #ddd;font-weight:bold">${pd.sym} ${pd.n}</td>
   <td style="padding:6px;border:1px solid #ddd"><input type="number" step="1" id="edit_shadbala_${pd.n}" value="${shV}" style="width:100%;padding:6px;border:1px solid #ccc;border-radius:6px;font-size:14px"></td>
   <td style="padding:6px;border:1px solid #ddd"><input type="number" min="0" max="8" id="edit_bav_${pd.n}" value="${bavV}" style="width:100%;padding:6px;border:1px solid #ccc;border-radius:6px;font-size:14px"></td>
  </tr>`;
 }
 html+=`</table><button class="btn green" onclick="recalcFromEdits()" style="margin-top:8px">🔄 पुनः गणना करें</button>`;
 box.innerHTML=html;
}

function recalcFromEdits(){
 // Read edited values and re-render both tabs
 renderResults();
 renderResults2();
}

function getManual(){
 const m={};
 for(const pd of planetData){
  // Read from editable inputs if they exist, else auto
  const shEl=document.getElementById('edit_shadbala_'+pd.n);
  const bavEl=document.getElementById('edit_bav_'+pd.n);
  if(shEl&&shEl.value){
   // Convert virupas to rupas
   m['shadbala_'+pd.n]=(+shEl.value)/60;
  }else if(window._autoShadbala&&window._autoShadbala[pd.n]){
   m['shadbala_'+pd.n]=window._autoShadbala[pd.n];
  }
  if(bavEl&&bavEl.value){
   m['bav_'+pd.n]=bavEl.value;
  }else if(window._autoBAV&&window._autoBAV[pd.n]){
   m['bav_'+pd.n]=window._autoBAV[pd.n];
  }
  if(window._autoBAL&&window._autoBAL[pd.n])m['bal_'+pd.n]=window._autoBAL[pd.n];
 }
 return m;
}

function renderResults(){
 const manual=getManual();
 const box=document.getElementById('results');
 box.innerHTML='';
 // Calculate Shadbala ranks by Strength (rupas/minimum), like the app
 const SH_MIN={'सूर्य':5.0,'चंद्र':6.0,'मंगल':5.0,'बुध':7.0,'गुरु':6.5,'शुक्र':5.5,'शनि':5.0};
 const shVals=planetData.map(pd=>{
  const sh=manual['shadbala_'+pd.n];
  const rupas=sh?+sh:0;
  const min=SH_MIN[pd.n]||5;
  return{n:pd.n,v:rupas/min};
 }).filter(x=>['सूर्य','चंद्र','मंगल','बुध','गुरु','शुक्र','शनि'].includes(x.n));
 shVals.sort((a,b)=>b.v-a.v);
 const shRank={};
 shVals.forEach((x,i)=>{shRank[x.n]=i+1;});
 const scored=planetData.map(pd=>({...pd,score:scorePlanet(pd,manual,shRank)}));
 scored.sort((a,b)=>b.score.total-a.score.total);

 const catNames={rashi:'राशि स्थिति',bhava:'भाव स्थिति',d9:'नवमांश (D9)',shadbala:'षड्बल रैंक',bav:'BAV',nakshatra:'नक्षत्र स्वामी',avastha:'अवस्था'};
 const modNames={navatara:'नवतारा',pushkar:'पुष्कर/मृत्यु',chalit:'चलित',drishti:'दृष्टि/युति',d9penalty:'D9 नीच पेनल्टी'};

 for(const pd of scored){
  const sc=pd.score;
  let detailRows='<tr style="background:#e8f5e9"><td colspan="3"><b>📊 BASE SCORE (अधिकतम 100)</b></td></tr>';
  for(const[k,v]of Object.entries(sc.breakdown)){
   detailRows+=`<tr><td>${catNames[k]||k}</td><td style="color:#888">${v.label}</td><td>${v.pts}/${v.max}</td></tr>`;
  }
  detailRows+=`<tr style="background:#e8f5e9"><td><b>Base कुल</b></td><td></td><td><b>${sc.baseScore}</b></td></tr>`;
  detailRows+=`<tr style="background:#fff3e0"><td colspan="3"><b>⚡ MODIFIERS (+/-)</b></td></tr>`;
  for(const[k,v]of Object.entries(sc.modifiers)){
   const color=v.pts>0?'#2e7d32':v.pts<0?'#c62828':'#888';
   detailRows+=`<tr><td>${modNames[k]||k}</td><td style="color:#888">${v.label}</td><td style="color:${color};font-weight:bold">${v.pts>0?'+':''}${v.pts}</td></tr>`;
  }
  detailRows+=`<tr style="background:#fff3e0"><td><b>Modifiers कुल</b></td><td></td><td><b>${sc.modTotal>0?'+':''}${sc.modTotal}</b></td></tr>`;
  detailRows+=`<tr class="total"><td><b>कुल</b></td><td></td><td><b>${sc.total}%</b></td></tr>`;

  box.innerHTML+=`
  <div class="planet-card ${sc.cls}">
   <div class="ph"><span class="pname">${pd.sym} ${pd.n}</span><span class="ppct">${sc.total}%</span></div>
   <div class="meter"><div class="mfill" style="width:${sc.total}%"></div></div>
   <span class="verdict" onclick="toggleDetail('${pd.n}')">${sc.verdict} ▼</span>
   <div class="details" id="det_${pd.n}">
    <div class="drow">
     <span><b>कारकत्व:</b> ${pd.karak||'-'}</span>
     <span><b>भाव:</b> ${pd.house} (${RASHIS[pd.rashi]})</span>
     <span><b>स्वामित्व:</b> ${pd.owns.join(', ')||'-'}</span>
    </div>
    <div class="drow">
     <span><b>नक्षत्र:</b> ${pd.nak.name} पद ${pd.nak.pada}</span>
     <span><b>डिग्री:</b> ${pd.degInRashi.toFixed(2)}°</span>
     <span><b>अवस्था:</b> ${sc.breakdown.avastha.label}</span>
    </div>
    <div class="drow">
     <span><b>युति:</b> ${pd.yuti.join(', ')||'अकेला'}</span>
     <span><b>दृष्टि पा रहा:</b> ${pd.drishtiFrom.join(', ')||'-'}</span>
    </div>
    <div class="drow">
     <span><b>नवमांश:</b> ${RASHIS[pd.d9rashi]}</span>
     <span><b>वक्री:</b> ${pd.retro?'हां':'नहीं'}</span>
     <span><b>वर्गोत्तम:</b> ${pd.vargottama?'हां':'नहीं'}</span>
    </div>
    <table class="stable">${detailRows}</table>
   </div>
  </div>`;
 }
 // Animate meters
 setTimeout(()=>{document.querySelectorAll('.mfill').forEach(el=>{const w=el.style.width;el.style.width='0';setTimeout(()=>el.style.width=w,50);});},100);

 // Summary
 const sb=document.getElementById('summaryBox');
 sb.innerHTML=`<div class="summary"><h3>📊 सारांश</h3>
 <div><b>सबसे बलवान:</b> ${scored[0].n} (${scored[0].score.total}%) ${scored[0].score.verdict} | <b>सबसे कमजोर:</b> ${scored[scored.length-1].n} (${scored[scored.length-1].score.total}%)</div>
 <div class="rank">${scored.map((p,i)=>`<span class="chip">${i+1}. ${p.n} ${p.score.total}%</span>`).join('')}</div></div>`;

 document.getElementById('toolbar').classList.remove('hidden');
 window._scored=scored;
}

function toggleDetail(n){
 document.getElementById('det_'+n).classList.toggle('show');
}
