/* === Shared === */
:root { --primary: #d35400; --dark: #2c3e50; --bg: #f4f6f8; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen-Sans, Ubuntu, Cantarell, "Helvetica Neue", sans-serif; background: var(--bg); margin: 0; padding: 20px; color: #333; line-height: 1.6; }
.container { max-width: 950px; margin: 0 auto; background: #fff; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); padding: 30px; border-top: 5px solid var(--primary); }
h1 { text-align: center; color: var(--dark); margin-top: 0; font-size: 1.8rem; border-bottom: 2px solid #eee; padding-bottom: 15px; }
/* Tabs */
.tab-bar { display: flex; justify-content: center; gap: 10px; margin: 20px 0; }
.tab-btn { padding: 12px 28px; border: 3px solid #d35400; border-radius: 10px; font-size: 1.05rem; font-weight: bold; cursor: pointer; background: #fff; color: #d35400; }
.tab-btn.active { background: #d35400; color: #fff; }
.tab-panel { display: none; }
.tab-panel.active { display: block; }
/* Astro Code */
.astro-section { background: #f3e5f5; padding: 18px; border-radius: 8px; border: 1px solid #ce93d8; margin-bottom: 20px; }
.astro-row { display: flex; gap: 12px; align-items: flex-end; margin-bottom: 10px; flex-wrap: wrap; }
.astro-row label { font-weight: bold; color: #6a1b9a; }
.astro-row input { flex: 1; min-width: 200px; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-family: monospace; }
.btn-bharo { background: #6a1b9a; color: #fff; border: none; border-radius: 6px; padding: 10px 20px; font-weight: bold; cursor: pointer; font-size: 1rem; }
.ephem-status { font-size: 0.9em; color: #666; margin-top: 6px; }
.ephem-status.ok { color: #2e7d32; }
.code-error { color: red; font-weight: bold; font-size: 0.9em; }
.btn-shot { background: #1565c0; color: white; width: 100%; padding: 12px; border: none; font-weight: bold; margin-top: 12px; cursor: pointer; border-radius: 6px; font-size: 1.05rem; }
.btn-shot:hover { background: #0d47a1; }
/* === Ashtkoot styles === */

        :root { --primary: #d35400; --dark: #2c3e50; --bg: #f4f6f8; --box-bg: #ffffff; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen-Sans, Ubuntu, Cantarell, "Helvetica Neue", sans-serif; background-color: var(--bg); margin: 0; padding: 20px; color: #333; line-height: 1.6; }
        .container { max-width: 900px; margin: 0 auto; background: var(--box-bg); border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); overflow: hidden; padding: 30px; border-top: 5px solid var(--primary); }
        
        h1 { text-align: center; color: var(--dark); margin-top: 0; font-size: 1.8rem; border-bottom: 2px solid #eee; padding-bottom: 15px; }
        
        /* Inputs */
        .input-section { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; background: #fff8e1; padding: 20px; border-radius: 8px; border: 1px solid #ffe0b2; margin-bottom: 20px; }
        .input-group label { display: block; font-weight: bold; color: var(--primary); margin-bottom: 5px; }
        select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 1rem; margin-bottom: 10px; }

        /* Options */
        .options-row { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; background: #eaf2fa; padding: 15px; border-radius: 8px; border: 1px solid #b9d4f1; margin-bottom: 20px;}
        .chk-label { cursor: pointer; display: flex; align-items: center; gap: 8px; font-weight: bold; color: var(--dark); font-size: 1.1em;}
        .chk-label input { transform: scale(1.3); cursor: pointer; }

        /* Buttons */
        .btn-calc { width: 100%; padding: 14px; background: var(--primary); color: white; border: none; font-size: 1.2rem; font-weight: bold; cursor: pointer; border-radius: 6px; transition: 0.3s; }
        .btn-calc:hover { background: #ba4a00; }
        .btn-download { background: #27ae60; color: white; width: 100%; padding: 12px; border: none; font-weight: bold; margin-top: 20px; cursor: pointer; border-radius: 6px; display: none; font-size: 1.05rem;}
        .btn-download:hover { background: #219653; }

        /* Results */
        .result-box { margin-top: 30px; padding: 20px; border: 1px solid #ddd; border-radius: 8px; background: #fafafa; }
        .result-title { background: var(--dark); color: white; padding: 10px 15px; border-radius: 5px 5px 0 0; margin: -20px -20px 15px -20px; font-size: 1.2rem; font-weight: bold; text-align: center; }
        
        .result-table { width: 100%; border-collapse: collapse; margin-bottom: 10px; background: #fff; }
        .result-table th, .result-table td { padding: 10px; border: 1px solid #ddd; text-align: center; }
        .result-table th { background: #f0f0f0; color: var(--dark); }
        .result-table td:first-child { text-align: left; font-weight: bold; color: #444; }

        .score-display { text-align: center; font-size: 1.8rem; font-weight: bold; color: white; background: var(--dark); padding: 15px; border-radius: 8px; margin: 15px 0; }
        .verdict { text-align: center; font-size: 1.2rem; font-weight: bold; padding: 10px; border-radius: 5px; background: #f0f0f0;}
        
        /* Guna Meters */
        .meter-wrap { margin: 18px 0 8px 0; padding: 15px; background: #fff; border: 1px solid #e0e0e0; border-radius: 8px; }
        .meter-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
        .meter-title { font-weight: bold; color: var(--dark); font-size: 1.05rem; }
        .meter-val { font-weight: bold; font-size: 1.3rem; }
        .meter-track { position: relative; height: 22px; background: #eceff1; border-radius: 11px; overflow: hidden; }
        .meter-fill { height: 100%; border-radius: 11px; transition: width 0.8s ease; }
        .meter-fill.good { background: linear-gradient(90deg, #66bb6a, #2e7d32); }
        .meter-fill.mid { background: linear-gradient(90deg, #ffca28, #f9a825); }
        .meter-fill.bad { background: linear-gradient(90deg, #ef5350, #c62828); }
        .meter-threshold { position: absolute; top: 0; bottom: 0; width: 2px; background: #37474f; left: 50%; }
        .meter-scale { display: flex; justify-content: space-between; font-size: 0.8rem; color: #78909c; margin-top: 4px; font-weight: bold; }
        .meter-note { text-align: center; font-size: 0.85rem; color: #78909c; margin-top: 6px; }
        
        .parihar-box { background: #e8f5e9; border: 1px solid #c8e6c9; padding: 15px; border-radius: 5px; font-size: 0.95rem; margin-bottom: 15px;}
        .parihar-box ul { margin: 5px 0 0 0; padding-left: 20px; }
        
        .alert-box { background: #ffebee; border: 1px solid #ffcdd2; color: #c62828; padding: 12px; border-radius: 5px; font-weight: bold; margin-bottom: 15px; text-align: center;}
        
        .pass { color: #27ae60; font-weight: bold; }

        .fail { color: #c0392b; font-weight: bold; }
        .error-msg { color: red; text-align: center; display: none; font-weight: bold; margin-bottom: 15px; }

<script>
function switchTab(n){
  document.querySelectorAll('.tab-btn').forEach((b,i)=>b.classList.toggle('active', i===n-1));
  document.querySelectorAll('.tab-panel').forEach((p,i)=>p.classList.toggle('active', i===n-1));
}
/* Screenshot helpers */
async function screenshotAsht(){
  const el = document.getElementById('tab1');
  const canvas = await html2canvas(el, {scale:2});
  const a = document.createElement('a');
  a.download = 'ashtakoot-milan.png';
  a.href = canvas.toDataURL('image/png');
  a.click();
}
async function screenshotPanch(){
  const el = document.getElementById('tab2');
  const canvas = await html2canvas(el, {scale:2});
  const a = document.createElement('a');
  a.download = 'panchadha-maitri.png';
  a.href = canvas.toDataURL('image/png');
  a.click();
}
</script>

// Common Helpers
function getRasi(n, p) { return Math.floor(((n * 4) + p - 1) / 9); }

function getAkMaitri(p1, p2) {
    if(p1===p2) return 5;
    const r = { 0: [[4,3,5],[1,6],[2]], 1: [[2,6],[0,5],[4,3]], 2: [[4,1],[0,5,6],[3]], 3: [[4,2],[0,1,5,6],[]], 4: [[3,0,5],[2],[1,6]], 5: [[4,3,0],[6],[2,1]], 6: [[2,1],[5],[4,3,0]] };
    const c = (a, b) => r[a][0].includes(b) ? 'F' : (r[a][1].includes(b) ? 'N' : 'E');
    let x = c(p1, p2), y = c(p2, p1);
    if(x=='F' && y=='F') return 5;
    if((x=='F' && y=='N') || (x=='N' && y=='F')) return 4;
    if(x=='N' && y=='N') return 3;
    if((x=='F' && y=='E') || (x=='E' && y=='F')) return 1;
    if((x=='N' && y=='E') || (x=='E' && y=='N')) return 0.5;
    return 0;
}

function getDkMaitri(l1, l2) {
    if(l1===l2) return 5;
    const mat = [[5,3,0,5,5,5,0], [3,5,5,0,0,3,5], [0,5,5,0,3,3,3], [5,0,0,5,5,3,3], [5,0,3,5,5,5,0], [5,3,3,3,5,5,3], [0,5,3,3,0,3,5]];
    return (mat[l1][l2] + mat[l2][l1]) / 2; 
}

// Guna Meter helper (visual 0-36 bar)
function gunaMeter(title, score, max) {
    const pct = Math.max(0, Math.min(100, (score / max) * 100));
    const cls = score >= 18 ? 'good' : (score >= 10 ? 'mid' : 'bad');
    const col = score >= 18 ? '#2e7d32' : (score >= 10 ? '#f9a825' : '#c62828');
    return `<div class="meter-wrap">
        <div class="meter-head"><span class="meter-title">${title}</span><span class="meter-val" style="color:${col}">${score} / ${max}</span></div>
        <div class="meter-track"><div class="meter-fill ${cls}" style="width:${pct}%"></div><div class="meter-threshold"></div></div>
        <div class="meter-scale"><span>0</span><span>18 (शुभ रेखा)</span><span>${max}</span></div>
    </div>`;
}

// 1. ASHTKOOT LOGIC (Fixed: Added Raw Score & Parihar back)
function calcAshtkoot(bN, gN, bP, gP) {
    const bR = getRasi(bN, bP); const gR = getRasi(gN, gP);
    const bL = RASI_LORDS[bR]; const gL = RASI_LORDS[gR];

    const vG = r => [3,7,11].includes(r)?4 : [0,4,8].includes(r)?3 : [1,5,9].includes(r)?2 : 1;
    let sVar = (vG(bR) >= vG(gR)) ? 1 : 0;
    let sVas = AK_MAT_VASHYA[AK_VASHYA[bR]][AK_VASHYA[gR]];
    const tD = (f, t) => { let d=(t-f); if(d<0)d+=27; let r=(d+1)%9; return [3,5,7].includes(r)?0:3; };
    let sTar = (tD(bN,gN) + tD(gN,bN)) / 2;
    let sYon = AK_MAT_YONI[AK_PROPS[bN].y][AK_PROPS[gN].y];
    let sMai = getAkMaitri(bL, gL);
    
    let bG = AK_PROPS[bN].g, gG = AK_PROPS[gN].g;
    let sGan = 0;
    if(bG === gG || (bG===0&&gG===1) || (bG===1&&gG===0)) sGan = 6;
    else if((bG===0&&gG===2) || (bG===2&&gG===0)) sGan = 1;

    let dist = (gR - bR); if(dist<0) dist+=12; dist+=1;
    let sBha = [2,5,6,8,9,12].includes(dist) ? 0 : 7;
    let sNad = (AK_PROPS[bN].n === AK_PROPS[gN].n) ? 0 : 8;

    // Raw Score Calculation
    let rawTot = sVar+sVas+sTar+sYon+sMai+sGan+sBha+sNad;

    // Parihar Logic
    let fBha = sBha, fNad = sNad, logs = [];
    if(sBha === 0 && (bL === gL || getAkMaitri(bL, gL)>=4)) { fBha = 7; logs.push("✅ भकूट परिहार: राशि स्वामी मित्र हैं।"); }
    if(sNad === 0) {
        if(bN===gN && bP!==gP) { fNad=8; logs.push("✅ नाड़ी परिहार: नक्षत्र एक, चरण भिन्न।"); }
        else if(bR===gR && bN!==gN) { fNad=8; logs.push("✅ नाड़ी परिहार: राशि एक, नक्षत्र भिन्न।"); }
    }

    // Final Score Calculation
    let finTot = sVar+sVas+sTar+sYon+sMai+sGan+fBha+fNad;
    let vCls = finTot >= 18 ? "pass" : "fail";
    let vTxt = finTot >= 18 ? "विवाह उत्तम/शुभ है" : "विवाह अनुचित";

    let mkR = (n,m,s) => `<tr><td>${n}</td><td>${m}</td><td>${s}</td><td>${s==m?'<span class="pass">✓</span>':(s>0?'<span class="warn">~</span>':'<span class="fail">✗</span>')}</td></tr>`;

    let pariharHtml = "";
    if(logs.length > 0) {
        pariharHtml = `<div class="parihar-box"><strong>लागू परिहार (Exceptions):</strong><ul>${logs.map(l=>`<li>${l}</li>`).join('')}</ul></div>`;
    } else if (rawTot === finTot && (sBha===0 || sNad===0)) {
        pariharHtml = `<div class="parihar-box" style="background:#ffebee; border-color:#ffcdd2;"><strong class="fail">कोई परिहार लागू नहीं हुआ। दोष शेष हैं।</strong></div>`;
    } else {
        pariharHtml = `<div class="parihar-box" style="background:#f5f5f5; border-color:#ddd;"><strong>कोई प्रमुख दोष नहीं / गणना शुभ है।</strong></div>`;
    }

    let html = `<div class="result-box">
        <div class="result-title">1. अष्टकूट मिलान (उत्तर भारतीय)</div>
        <div style="font-weight:bold; color:var(--dark); margin-bottom:10px;">A. विस्तृत विवरण (कच्चे अंक)</div>
        <table class="result-table">
            <thead><tr><th>कूट</th><th>अधिकतम</th><th>प्राप्त (कच्चे)</th><th>स्थिति</th></tr></thead>
            <tbody>
                ${mkR('वर्ण',1,sVar)}${mkR('वश्य',2,sVas)}${mkR('तारा',3,sTar)}${mkR('योनि',4,sYon)}
                ${mkR('मैत्री',5,sMai)}${mkR('गण',6,sGan)}${mkR('भकूट',7,sBha)}${mkR('नाड़ी',8,sNad)}
            </tbody>
        </table>
        <div style="text-align:right; font-weight:bold; color:#666; margin-bottom:20px;">कच्चे अंकों का कुल योग: ${rawTot} / 36</div>
        
        <div style="font-weight:bold; color:var(--dark); margin-bottom:10px;">B. दोष परिहार एवं निर्णय</div>
        ${pariharHtml}
        
        <div class="score-display">अंतिम कुल गुण: ${finTot} <span style="font-size:1.2rem; font-weight:normal;">/ 36</span></div>
        ${gunaMeter('📊 अष्टकूट गुण मीटर', finTot, 36)}
        <div class="verdict"><span class="${vCls}">${vTxt}</span></div>
    </div>`;

    let txt = `\n[1] अष्टकूट मिलान (उत्तर भारतीय)\n------------------------------------------\n`;
    txt += `वर्ण: ${sVar}/1 | वश्य: ${sVas}/2 | तारा: ${sTar}/3 | योनि: ${sYon}/4\n`;
    txt += `मैत्री: ${sMai}/5 | गण: ${sGan}/6 | भकूट (कच्चे): ${sBha}/7 | नाड़ी (कच्चे): ${sNad}/8\n`;
    txt += `कच्चे अंकों का योग: ${rawTot} / 36\n\n`;
    txt += `दोष परिहार स्थिति:\n`;
    txt += logs.length>0 ? logs.join('\n') + '\n' : (sBha===0||sNad===0 ? "कोई परिहार लागू नहीं हुआ।\n" : "कोई प्रमुख दोष नहीं।\n");
    txt += `\nअंतिम प्राप्तांक: ${finTot} / 36 (${vTxt})\n------------------------------------------\n`;

    return { html, txt };
}

// 2. DASHKOOT LOGIC (Fixed: Restored the Warning/Average Logic)
function calcDashkoot(bN, gN, bP, gP) {
    const bR = getRasi(bN, bP); const gR = getRasi(gN, gP);

    let dCount = (bN - gN); if(dCount < 0) dCount += 27;
    let cDinam = dCount + 1; // inclusive count (girl -> boy)
    let sDinam = ([2,4,6,8,0].includes(cDinam % 9)) ? 3 : 0;

    let bG = DK_GANA[bN], gG = DK_GANA[gN];
    let sGana = (bG===gG) ? 4 : ((gG===0&&bG===1)?3 : ((gG===1&&bG===0)?2:0));

    let sYoni = DK_MAT_YONI[DK_YONI[bN]][DK_YONI[gN]];

    let rDiff = (bR - gR); if(rDiff < 0) rDiff += 12; rDiff += 1;
    let sRasi = 3;
    if(rDiff === 7 || rDiff === 12) sRasi = 7;
    else if([3,4,10,11].includes(rDiff)) sRasi = 5;
    else if([2,5,6,8,9].includes(rDiff)) sRasi = 0;
    if(rDiff===1 && bN===gN && bP!==gP) sRasi = 7; 
    else if(rDiff===1 && bN!==gN) sRasi = 7;

    let sLord = getDkMaitri(RASI_LORDS[bR], RASI_LORDS[gR]);
    let sRajju = (DK_RAJJU[bN] !== DK_RAJJU[gN]) ? 5 : 0;

    let isV = false;
    for(let p of DK_VEDHA) if((p[0]===bN && p[1]===gN) || (p[0]===gN && p[1]===bN)) isV = true;
    if([4,13,22].includes(bN) && [4,13,22].includes(gN) && bN!==gN) isV = true;
    let sVedha = isV ? 0 : 2;

    let sVashya = (sLord >= 3) ? 2 : 0;
    
    let mCount = (bN - gN); if(mCount < 0) mCount += 27; mCount += 1;
    let sMahendra = [4,7,10,13,16,19,22,25].includes(mCount) ? 2 : 0;

    let sdCount = (bN - gN); if(sdCount <= 0) sdCount += 27;
    let sStree = (sdCount > 13) ? 2 : 0;

    let finTot = sDinam+sGana+sYoni+sRasi+sLord+sRajju+sVedha+sVashya+sMahendra+sStree;
    
    // VERDICT LOGIC RESTORED TO ORIGINAL
    let vCls = "", vTxt = "";
    if(sRajju === 0) {
        vCls = "fail"; vTxt = "विवाह वर्जित (रज्जु दोष)";
    } else {
        if(finTot >= 18) {
            vCls = "pass"; vTxt = "विवाह शुभ है (उत्तम मिलान)।";
        } else {
            vCls = "warn"; vTxt = "मध्यम मिलान (विचारणीय)।";
        }
    }

    let mkR = (n,m,s) => `<tr><td>${n}</td><td>${m}</td><td>${s}</td><td>${s==m?'<span class="pass">✓</span>':(s>0?'<span class="warn">~</span>':'<span class="fail">✗</span>')}</td></tr>`;

    let html = `<div class="result-box">
        <div class="result-title">2. दशकूट मिलान (दक्षिण भारतीय)</div>
        <table class="result-table">
            <thead><tr><th>कूट</th><th>अधिकतम</th><th>प्राप्त</th><th>स्थिति</th></tr></thead>
            <tbody>
                ${mkR('दिन',3,sDinam)}${mkR('गण',4,sGana)}${mkR('योनि',4,sYoni)}${mkR('राशि',7,sRasi)}
                ${mkR('राश्याधिपति',5,sLord)}${mkR('रज्जु',5,sRajju)}${mkR('वेध',2,sVedha)}
                ${mkR('वश्य',2,sVashya)}${mkR('माहेन्द्र',2,sMahendra)}${mkR('स्त्री-दीर्घ',2,sStree)}
            </tbody>
        </table>
        ${sRajju===0 ? `<div class="alert-box">⚠️ सावधान: रज्जु दोष! दक्षिण भारतीय पद्धति में इसे विवाह के लिए वर्जित माना जाता है।</div>` : ''}
        <div class="score-display">कुल प्राप्तांक: ${finTot} <span style="font-size:1.2rem; font-weight:normal;">/ 36</span></div>
        ${gunaMeter('📊 दशकूट गुण मीटर', finTot, 36)}
        <div class="verdict"><span class="${vCls}">${vTxt}</span></div>
    </div>`;

    let txt = `\n[2] दशकूट मिलान (दक्षिण भारतीय)\n------------------------------------------\n`;
    txt += `दिन: ${sDinam}/3 | गण: ${sGana}/4 | योनि: ${sYoni}/4 | राशि: ${sRasi}/7 | राशि स्वामी: ${sLord}/5\n`;
    txt += `रज्जु: ${sRajju}/5 | वेध: ${sVedha}/2 | वश्य: ${sVashya}/2 | माहेन्द्र: ${sMahendra}/2 | स्त्री-दीर्घ: ${sStree}/2\n`;
    if(sRajju===0) txt += `चेतावनी: रज्जु दोष उपस्थित है।\n`;
    txt += `\nदशकूट कुल प्राप्तांक: ${finTot} / 36 (${vTxt})\n------------------------------------------\n`;

    return { html, txt };
}

function downloadTxt() {
    if(!globalReportTxt) return;
    const blob = new Blob([globalReportTxt], { type: "text/plain;charset=utf-8" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "Kundli_Milan_Mega_Report.txt";
    a.click();
}

        10: { name: "मकर", lord: "शनि" },
        11: { name: "कुंभ", lord: "शनि" },
        12: { name: "मीन", lord: "गुरु" }
    };

    // नैसर्गिक मैत्री चक्र (ग्रह A ग्रह B को क्या मानता है)
    // 1=Friend, 0=Neutral, -1=Enemy
    const naturalMaitri = {
        "सूर्य": { "चन्द्र": 1, "मंगल": 1, "गुरु": 1, "बुध": 0, "शुक्र": -1, "शनि": -1, "सूर्य": 0 },
        "चन्द्र": { "सूर्य": 1, "बुध": 1, "मंगल": 0, "गुरु": 0, "शुक्र": 0, "शनि": 0, "चन्द्र": 0 },
        "मंगल": { "सूर्य": 1, "चन्द्र": 1, "गुरु": 1, "शुक्र": 0, "शनि": 0, "बुध": -1, "मंगल": 0 },
        "बुध": { "सूर्य": 1, "शुक्र": 1, "मंगल": 0, "गुरु": 0, "शनि": 0, "चन्द्र": -1, "बुध": 0 },
        "गुरु": { "सूर्य": 1, "चन्द्र": 1, "मंगल": 1, "शनि": 0, "बुध": -1, "शुक्र": -1, "गुरु": 0 },
        "शुक्र": { "बुध": 1, "शनि": 1, "मंगल": 0, "गुरु": 0, "सूर्य": -1, "चन्द्र": -1, "शुक्र": 0 },
        "शनि": { "बुध": 1, "शुक्र": 1, "गुरु": 0, "सूर्य": -1, "चन्द्र": -1, "मंगल": -1, "शनि": 0 }
    };

    const hindiNumbers = ["शून्य", "प्रथम", "द्वितीय", "तृतीय", "चतुर्थ", "पंचम", "षष्ठ", "सप्तम", "अष्टम", "नवम", "दशम", "एकादश", "द्वादश"];

    function getRelationText(score) {
        if (score === 1) return "मित्र";
        if (score === 0) return "सम";
        if (score === -1) return "शत्रु";
        return "त्रुटि";
    }

    function calculateIndividual(lagnaId, lagneshHouse, saptameshHouse, personType) {
        if (!lagnaId) return null;

        lagnaId = parseInt(lagnaId);
        lagneshHouse = parseInt(lagneshHouse);
        saptameshHouse = parseInt(saptameshHouse);

        // 1. Determine Lords
        const lagnaName = signs[lagnaId].name;
        const lagnesh = signs[lagnaId].lord;
        
        // Saptamesh is Lord of the 7th sign from Lagna
        let saptamSignId = (lagnaId + 6) % 12;
        if (saptamSignId === 0) saptamSignId = 12;
        const saptamesh = signs[saptamSignId].lord;

        // 2. Naisargik Maitri (How Lagnesh treats Saptamesh)
        let nScore = 0;
        if (lagnesh !== saptamesh) {
            nScore = naturalMaitri[lagnesh][saptamesh];
        }
        const naisargikStr = `नैसर्गिक ${getRelationText(nScore)}`;

        // 3. Tatkalik Maitri
        // Formula: Count from Lagnesh to Saptamesh
        let distance = (saptameshHouse - lagneshHouse);
        if (distance < 0) distance += 12;
        distance = distance + 1; // Inclusive count standard in astrology usually, but for distance logic:
        // Logic: Planets in 2, 3, 4, 10, 11, 12 from planet A are friends.
        
        // Let's use pure distance (1-based index)
        // Example: Lagnesh in 1, Saptamesh in 3. Distance = 3-1 = 2 positions away? No, 1->2->3 is 3rd house from it.
        // Let's calculate "House from Lagnesh"
        let posFromLagnesh = (saptameshHouse - lagneshHouse + 1);
        if (posFromLagnesh <= 0) posFromLagnesh += 12;

        let isTatkalikFriend = false;
        if ([2, 3, 4, 10, 11, 12].includes(posFromLagnesh)) {
            isTatkalikFriend = true;
        }

        let tScore = isTatkalikFriend ? 1 : -1;
        // If same planet, standard texts say neutral or ignore, but here logic applies to placement
        if (lagnesh === saptamesh) tScore = 1; // Simplification or same placement logic

        const tatkalikStr = isTatkalikFriend ? "तत्कालीन मित्र" : "तत्कालीन शत्रु";
        
        // Hindi House text
        const lagneshHouseTxt = hindiNumbers[lagneshHouse] + " भाव";
        const saptameshHouseTxt = hindiNumbers[saptameshHouse] + " भाव";
        const distanceTxt = `लग्नेश से सप्तमेश ${hindiNumbers[posFromLagnesh]} भाव मे`;

        // 4. Panchadha Result
        let totalScore = nScore + tScore;
        let finalResult = "";
        
        if (totalScore === 2) finalResult = "अधि-मित्र";
        else if (totalScore === 1) finalResult = "मित्र";
        else if (totalScore === 0) finalResult = "सम";
        else if (totalScore === -1) finalResult = "शत्रु";
        else if (totalScore === -2) finalResult = "अधि-शत्रु";

        return {
            lagna: lagnaName,
            lagnesh: lagnesh,
            saptamesh: saptamesh,
            lHouse: lagneshHouseTxt,
            sHouse: saptameshHouseTxt,
            nResult: naisargikStr,
            tResult: tatkalikStr,
            distText: distanceTxt,
            final: finalResult,
            score: totalScore // For final analysis
        };
    }

    function calculatePanchadha() {
        const boyLagna = document.getElementById('boyLagna').value;
        const boyLHouse = document.getElementById('boyLagneshHouse').value;
        const boySHouse = document.getElementById('boySaptameshHouse').value;

        const girlLagna = document.getElementById('girlLagna').value;
        const girlLHouse = document.getElementById('girlLagneshHouse').value;
        const girlSHouse = document.getElementById('girlSaptameshHouse').value;

        if(!boyLagna || !girlLagna) {
            alert("कृपया लड़के और लड़की दोनों का लग्न चुनें।");
            return;
        }

        const boyData = calculateIndividual(boyLagna, boyLHouse, boySHouse, "लड़के");
        const girlData = calculateIndividual(girlLagna, girlLHouse, girlSHouse, "लड़की");

        // Generate Output String
        let output = "";

        // Boy Output
        output += `लड़के का लग्न ${boyData.lagna} :\n\n`;
        output += `● लग्नेश ${boyData.lagnesh} + सप्तमेश ${boyData.saptamesh} = ${boyData.nResult}\n`;
        output += `● लग्नेश ${boyData.lagnesh} (${boyData.lHouse}) + सप्तमेश ${boyData.saptamesh} (${boyData.sHouse}) ${boyData.distText} = ${boyData.tResult}\n\n`;
        output += `पंचधा मैत्री परिणाम : ${boyData.nResult.split(' ')[1]} + ${boyData.tResult} = ${boyData.final}\n\n`;
        output += "----------------------------------------\n\n";

        // Girl Output
        output += `लड़की का लग्न ${girlData.lagna} :\n\n`;
        output += `● लग्नेश ${girlData.lagnesh} + सप्तमेश ${girlData.saptamesh} = ${girlData.nResult}\n`;
        output += `● लग्नेश ${girlData.lagnesh} (${girlData.lHouse}) + सप्तमेश ${girlData.saptamesh} (${girlData.sHouse}) ${girlData.distText} = ${girlData.tResult}\n\n`;
        output += `पंचधा मैत्री परिणाम : ${girlData.nResult.split(' ')[1]} + ${girlData.tResult} = ${girlData.final}\n\n`;
        output += "----------------------------------------\n\n";

        // Final Analysis Logic
        // Score Mapping: AdhiMitra(2), Mitra(1), Sama(0), Shatru(-1), AdhiShatru(-2)
        // Let's create a combined interpretation
        const bScore = boyData.score;
        const gScore = girlData.score;
        const combinedScore = bScore + gScore;

        let conclusion = "";
        
        // Logic for final text based on user prompt style
        if (bScore >= 0 && gScore >= 0) {
            conclusion = "चूंकि दोनों तरफ से मित्रता या सम भाव है, इसलिए इसे ज्योतिषीय भाषा में 'सद्भावपूर्ण एवं श्रेष्ठ संबंध' माना जाएगा। विवाह के लिए यह स्थिति उत्तम है।";
        } else if ((bScore >= 0 && gScore < 0) || (bScore < 0 && gScore >= 0)) {
            conclusion = "चूंकि एक तरफ से सकारात्मक और दूसरी तरफ से नकारात्मक भाव आ रहा है, इसलिए इसे 'मध्यम संबंध' माना जाएगा। आपसी सामंजस्य बिठाने की आवश्यकता होगी।";
        } else {
            conclusion = "चूंकि दोनों तरफ से शत्रुता या नकारात्मक भाव आ रहा है, इसलिए इसे ज्योतिषीय भाषा में 'कठिन संबंध' माना जा सकता है। कुंडली मिलान के अन्य पक्षों (जैसे गुण मिलान, नाड़ी) को भी देखना अनिवार्य है।";
        }
        
        // Special case from user prompt
        if ((boyData.final === "मित्र" && girlData.final === "सम") || (boyData.final === "सम" && girlData.final === "मित्र")) {
             conclusion = "चूंकि एक तरफ से 'मित्रता' और दूसरी तरफ से 'सम' भाव आ रहा है, इसलिए इसे ज्योतिषीय भाषा में 'सद्भावपूर्ण संबंध' माना जाएगा।";
        }

        output += `वैवाहिक दृष्टिकोण से दोनों का अंतिम विश्लेषण : ${conclusion}`;

        const resDiv = document.getElementById('result-area');
        resDiv.innerHTML = output;
        resDiv.style.display = "block";
    }

    function resetForm() {
        document.querySelectorAll('select').forEach(s => s.selectedIndex = 0);
        document.getElementById('result-area').style.display = "none";
        document.getElementById('result-area').innerHTML = "";
    }

    function copyAnalysis() {
        const text = document.getElementById('result-area').innerText;
        if(!text) { alert("पहले गणना करें!"); return; }
        navigator.clipboard.writeText(text).then(() => {
            alert("विश्लेषण कॉपी कर लिया गया है!");
        });
    }

    function downloadPanchTxt() {
        const text = document.getElementById('result-area').innerText;
        if(!text) { alert("पहले गणना करें!"); return; }
        
        const blob = new Blob([text], { type: "text/plain;charset=utf-8" });
        const anchor = document.createElement("a");
        anchor.href = URL.createObjectURL(blob);
        anchor.download = "Panchadha_Maitri_Analysis.txt";
        anchor.click();
        URL.revokeObjectURL(anchor.href);
    }

</script>

<script type="module">
/* ============ Swiss Ephemeris auto-fill (shared) ============ */
const EPHEM_CDN = 'https://cdn.jsdelivr.net/npm/@swisseph/browser@1.4.0/dist/swisseph-browser.js';
const ephemStatus = document.getElementById('ephem-status');
let SE=null, SEP=null, SEF=null, SEH=null, SEL=null;
function setStatus(t, ok){ ephemStatus.textContent=t; ephemStatus.className='ephem-status'+(ok?' ok':''); }
try {
  const m = await import(/* @vite-ignore */EPHEM_CDN);
  SE = m.SwissEphemeris; SEP = m.Planet; SEF = m.CalculationFlag; SEH = m.HouseSystem; SEL = m.LunarPoint;
  const swe = new SE(); await swe.init();
  swe.setSiderealMode(m.SiderealMode.Lahiri);
  window._swe = swe;
  setStatus('✅ Engine तैयार — Astro Code डालकर "📥 भरो" दबाएं', true);
} catch(e) {
  setStatus('⚠️ Engine लोड नहीं हुआ — इंटरनेट चालू करके पेज reload करें', false);
}
const FLAGS = () => SEF.MoshierEphemeris | SEF.Speed;
const norm360 = d => ((d % 360) + 360) % 360;
const signNum = lon => Math.floor(norm360(lon) / 30) + 1;
const RASHI_LORDS = {1:'Mangal',2:'Shukra',3:'Budh',4:'Chandra',5:'Surya',6:'Budh',7:'Shukra',8:'Mangal',9:'Guru',10:'Shani',11:'Shani',12:'Guru'};

async function fillFromCode(codeId, errId, prefix){
  if(!window._swe) throw new Error('Ephemeris लोड नहीं हुआ — पेज refresh करें');
  const errEl = document.getElementById(errId); errEl.innerText='';
  const m=/^AS1-(\d{8})-(\d{6})-([+-]\d{4})-(\d{4})([NS])-(\d{5})([EW])$/.exec((document.getElementById(codeId).value||'').trim());
  if(!m) throw new Error('सही Astro Code डालें (AS1-YYYYMMDD-HHMMSS-±HHMM-DDMMN/S-DDDMME/W)');
  const d8=m[1], t6=m[2], tz=m[3], lat4=m[4], latDir=m[5], lon5=m[6], lonDir=m[7];
  const Y=+d8.slice(0,4), mo=+d8.slice(4,6), dy=+d8.slice(6,8);
  const h24=+t6.slice(0,2), mm=+t6.slice(2,4), ss=+t6.slice(4,6);
  const tzMin=(tz[0]==='-'?-1:1)*(+tz.slice(1,3)*60 + +tz.slice(3,5));
  let lat=+lat4.slice(0,2)+(+lat4.slice(2,4))/60; if(latDir==='S') lat=-lat;
  let lon=+lon5.slice(0,3)+(+lon5.slice(3,5))/60; if(lonDir==='W') lon=-lon;
  let utc=new Date(Date.UTC(Y,mo-1,dy,h24,mm,ss)); utc=new Date(utc.getTime()-tzMin*60000);
  const swe=window._swe;
  const jd=swe.julianDay(utc.getUTCFullYear(),utc.getUTCMonth()+1,utc.getUTCDate(),
                         utc.getUTCHours()+utc.getUTCMinutes()/60+utc.getUTCSeconds()/3600);
  const ayan=swe.getAyanamsa(jd), F=FLAGS();
  const moonLon=norm360(swe.calculatePosition(jd,SEP.Moon,F).longitude-ayan);
  const hs=swe.calculateHouses(jd,lat,lon,SEH.Placidus);
  const lagnaLon=norm360(hs.ascendant-ayan);
  // Nakshatra + pada for Tab 1
  const nakIdx=Math.floor(moonLon/(360/27));
  const pada=Math.floor((moonLon%(360/27))/(360/108))+1;
  // Lagna + houses for Tab 2
  const lagna=signNum(lagnaLon);
  const lagnesh=RASHI_LORDS[lagna];
  const saptamesh=RASHI_LORDS[((lagna+6-2)%12)+1];
  // We need planet longitudes for lagnesh/saptamesh houses
  const pLons={};
  const pMap={Surya:SEP.Sun,Chandra:SEP.Moon,Mangal:SEP.Mars,Budh:SEP.Mercury,Guru:SEP.Jupiter,Shukra:SEP.Venus,Shani:SEP.Saturn};
  for(const [k,b] of Object.entries(pMap)) pLons[k]=norm360(swe.calculatePosition(jd,b,F).longitude-ayan);
  const lagneshHouse=((signNum(pLons[lagnesh])-lagna+12)%12)+1;
  const saptameshHouse=((signNum(pLons[saptamesh])-lagna+12)%12)+1;

  if(prefix==='b'){
    document.getElementById('bNak').value=nakIdx;
    document.getElementById('bPada').value=pada;
    document.getElementById('boyLagna').value=lagna;
    document.getElementById('boyLagneshHouse').value=lagneshHouse;
    document.getElementById('boySaptameshHouse').value=saptameshHouse;
  } else {
    document.getElementById('gNak').value=nakIdx;
    document.getElementById('gPada').value=pada;
    document.getElementById('girlLagna').value=lagna;
    document.getElementById('girlLagneshHouse').value=lagneshHouse;
    document.getElementById('girlSaptameshHouse').value=saptameshHouse;
  }
  setStatus('✅ भरा गया — गणना नीचे तैयार है', true);
  // Auto-run both tabs
  if(typeof calculateBoth==='function') calculateBoth();
  if(typeof calculatePanchadha==='function') calculatePanchadha();
}
window.fillFromCode=fillFromCode;
document.getElementById('btn-bharo-boy').addEventListener('click', async ()=>{
  try{ await fillFromCode('astro-boy','err-boy','b'); }catch(e){ document.getElementById('err-boy').innerText=e.message; }
});
document.getElementById('btn-bharo-girl').addEventListener('click', async ()=>{
  try{ await fillFromCode('astro-girl','err-girl','g'); }catch(e){ document.getElementById('err-girl').innerText=e.message; }
});
</script>
