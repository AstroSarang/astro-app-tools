<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>फ्रंट पेज डेटा v1.2</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: 'Noto Sans Devanagari', sans-serif; background:#f7f2e4; margin:0; padding:16px; color:#222; }
  .wrap { max-width:780px; margin:0 auto; background:#fff; border:2px solid #b8860b; border-radius:14px; padding:20px 22px; box-shadow:0 2px 10px rgba(0,0,0,.12); }
  h1 { text-align:center; color:#7b1e1e; margin:2px 0 4px; font-size:25px; }
  .ver { text-align:center; color:#888; font-size:12.5px; margin-bottom:12px; }
  #ephem-status { text-align:center; font-size:13.5px; margin-bottom:10px; color:#b45309; }
  #ephem-status.ok { color:#2e7d32; }
  label { font-weight:bold; font-size:14px; display:block; margin:10px 0 4px; }
  input[type=text], select { width:100%; padding:9px; font-size:15px; border:1px solid #c9b458; border-radius:8px; background:#fff; }
  input.mono { font-family: monospace; font-size:13.5px; }
  .row { display:flex; gap:10px; } .row > div { flex:1; }
  .tabs { display:flex; gap:8px; margin:12px 0 6px; }
  .tab { flex:1; text-align:center; padding:10px; border-radius:8px; background:#eee; font-weight:bold; cursor:pointer; border:1px solid #ccc; font-size:15px; }
  .tab.on { background:#2e7d32; color:#fff; border-color:#2e7d32; }
  .btn { background:#2e7d32; color:#fff; border:none; padding:10px 18px; border-radius:8px; font-size:15px; font-weight:bold; cursor:pointer; margin-top:12px; }
  .btn.copy { background:#7b1e1e; width:100%; }
  .btn:active { opacity:.85; }
  textarea.out { width:100%; height:430px; margin-top:12px; background:#263238; color:#e8f5e9; padding:14px 16px; border-radius:10px; font-size:14px; line-height:1.55; font-family:'Courier New', monospace; border:none; resize:vertical; }
  textarea.out.pair { height:460px; }
  .status { font-size:13.5px; margin-top:8px; min-height:18px; }
  .status.ok { color:#2e7d32; } .status.err { color:#b91c1c; }
  .pcard { border:1.5px solid #c9b458; border-radius:10px; padding:12px 14px; margin-top:12px; }
  .pcard h3 { margin:2px 0 6px; color:#7b1e1e; font-size:16.5px; }
  .citybox { position:relative; }
  .sugg { position:absolute; left:0; right:0; top:100%; background:#fff; border:1px solid #c9b458; border-radius:0 0 8px 8px; z-index:30; max-height:210px; overflow:auto; display:none; }
  .sugg div { padding:8px 10px; cursor:pointer; font-size:14px; border-top:1px solid #f0e6c8; }
  .sugg div:first-child { border-top:none; }
  .sugg div:hover { background:#fdf6dd; }
  .note { font-size:12.5px; color:#666; margin-top:4px; }
  .hidden { display:none; }
</style>
</head>
<body>
<div class="wrap">
  <h1>फ्रंट पेज डेटा</h1>

  <div id="ephem-status">⏳ Engine लोड हो रहा है…</div>

      </div>
      <div class="row">
        <div><label>नाम</label><input type="text" id="s_name" autocomplete="off"></div>

          <div class="citybox"><input type="text" id="s_city" autocomplete="off"><div class="sugg" id="s_sugg"></div></div>
        </div>

      <div class="status" id="s_status"></div>

    <textarea class="out" id="s_out" readonly placeholder="एस्ट्रो कोड भरते ही आउटपुट यहाँ आएगा…"></textarea>
    <button class="btn copy" id="s_copy">📋 आउटपुट कॉपी करें</button>
    <div class="status" id="s_copystatus"></div>
  </div>

  <div id="panel2" class="hidden">
    <div class="pcard">
      <h3>लड़का</h3>
      <label style="margin-top:0;">एस्ट्रो कोड</label>

        <div style="flex:1;"><button class="btn" id="b_fill" style="margin-top:0; width:100%;">📥 भरो</button></div>
      </div>
      <div class="row">
        <div><label>नाम</label><input type="text" id="b_name" autocomplete="off"></div>
        <div><label>जन्म स्थान (शहर खोजें)</label>
          <div class="citybox"><input type="text" id="b_city" autocomplete="off"><div class="sugg" id="b_sugg"></div></div>
        </div>
      </div>
      <div class="status" id="b_status"></div>
    </div>
    <div class="pcard">
      <h3>लड़की</h3>
      <label style="margin-top:0;">एस्ट्रो कोड</label>
      <div class="row">
        <div style="flex:3;"><input type="text" class="mono" id="g_code" placeholder="AS1-..." autocomplete="off"></div>
        <div style="flex:1;"><button class="btn" id="g_fill" style="margin-top:0; width:100%;">📥 भरो</button></div>
      </div>
      <div class="row">
        <div><label>नाम</label><input type="text" id="g_name" autocomplete="off"></div>
        <div><label>जन्म स्थान (शहर खोजें)</label>
          <div class="citybox"><input type="text" id="g_city" autocomplete="off"><div class="sugg" id="g_sugg"></div></div>
        </div>
      </div>
      <div class="status" id="g_status"></div>
    </div>
    <textarea class="out pair" id="p_out" readonly placeholder="दोनों के एस्ट्रो कोड भरते ही आउटपुट यहाँ आएगा…"></textarea>
    <button class="btn copy" id="p_copy">📋 आउटपुट कॉपी करें</button>
    <div class="status" id="p_copystatus"></div>
  </div>
</div>

  await swe.init();
  swe.setSiderealMode(m.SiderealMode.Lahiri);
  window._swe = swe;

}

  const base = [0,0,1,2,0,1,1,2,-1,-1,1,2];

  return base[sign];
}

/* ================= सूर्योदय / सूर्यास्त (जन्म अक्षर टूल वाली NOAA विधि) ================= */
function sunTimes(Y,M,D,lat,lon,tzMin){
  const N = Math.floor((Date.UTC(Y,M-1,D) - Date.UTC(Y,0,0)) / 86400000);
  const gamma = 2*Math.PI/365*(N-1);
  const eqtime = 229.18*(0.000075+0.001868*Math.cos(gamma)-0.032077*Math.sin(gamma)-0.014615*Math.cos(2*gamma)-0.040849*Math.sin(2*gamma));
  const decl = 0.006918-0.399912*Math.cos(gamma)+0.070257*Math.sin(gamma)-0.006758*Math.cos(2*gamma)+0.000907*Math.sin(2*gamma)-0.002697*Math.cos(3*gamma)+0.00148*Math.sin(3*gamma);
  const latR = lat*Math.PI/180, zen = 1.5853;
  let cosH = Math.cos(zen)/(Math.cos(latR)*Math.cos(decl)) - Math.tan(latR)*Math.tan(decl);
  cosH = Math.max(-1, Math.min(1, cosH));
  const ha = Math.acos(cosH)*180/Math.PI;
  return { rise: 720 - 4*lon - eqtime - ha*4 + tzMin, set: 720 - 4*lon - eqtime + ha*4 + tzMin };
}
function addDays(Y,M,D,delta){ const t = new Date(Date.UTC(Y,M-1,D+delta)); return [t.getUTCFullYear(), t.getUTCMonth()+1, t.getUTCDate()]; }

/* ================= एक व्यक्ति की गणना ================= */
function parseCode(str){
  const m = /^AS1-(\d{8})-(\d{6})-([+-]\d{4})-(\d{4})([NS])-(\d{5})([EW])$/.exec((str||'').trim());
  if(!m) return null;
  const d8=m[1], t6=m[2], tz=m[3];
  const Y=+d8.slice(0,4), mo=+d8.slice(4,6), dy=+d8.slice(6,8);
  const hh=+t6.slice(0,2), mm=+t6.slice(2,4), ss=+t6.slice(4,6);
  const tzMin=(tz[0]==='-'?-1:1)*(+tz.slice(1,3)*60 + +tz.slice(3,5));
  let lat=+m[4].slice(0,2)+(+m[4].slice(2,4))/60; if(m[5]==='S') lat=-lat;
  let lon=+m[6].slice(0,3)+(+m[6].slice(3,5))/60; if(m[7]==='W') lon=-lon;
  return {Y,mo,dy,hh,mm,ss,tzMin,lat,lon};
}
function computePerson(p){
  const swe = window._swe;
  const utc = new Date(Date.UTC(p.Y,p.mo-1,p.dy,p.hh,p.mm,p.ss) - p.tzMin*60000);
  const jd = swe.julianDay(utc.getUTCFullYear(), utc.getUTCMonth()+1, utc.getUTCDate(), utc.getUTCHours()+utc.getUTCMinutes()/60+utc.getUTCSeconds()/3600);
  const ayan = swe.getAyanamsa(jd), F = FLAGS();
  const lonOf = b => norm360(swe.calculatePosition(jd,b,F).longitude - ayan);
  const sunLon = lonOf(SEP.Sun), moonLon = lonOf(SEP.Moon);
  const lagnaLon = norm360(swe.calculateHouses(jd,p.lat,p.lon,SEH.Placidus).ascendant - ayan);
  const lagnaSign = Math.floor(lagnaLon/30), moonSign = Math.floor(moonLon/30), sunSign = Math.floor(sunLon/30);
  const span = 360/27;
  const nakIdx = Math.floor(moonLon/span);
  const pada = Math.floor((moonLon - nakIdx*span)/(span/4)) + 1;
  const diff = norm360(moonLon - sunLon);
  const tithiNum = Math.floor(diff/12)+1;
  const yogaIdx = Math.floor(norm360(sunLon+moonLon)/span) % 27;
  const kNum = Math.floor(diff/6)+1;
  /* वैदिक दिन + होरा */
  const birthMin = p.hh*60 + p.mm + p.ss/60;
  let vY=p.Y, vM=p.mo, vD=p.dy;
  let st = sunTimes(vY,vM,vD,p.lat,p.lon,p.tzMin);
  if(birthMin < st.rise){ [vY,vM,vD] = addDays(vY,vM,vD,-1); st = sunTimes(vY,vM,vD,p.lat,p.lon,p.tzMin); }
  const vedicWeekday = new Date(Date.UTC(vY,vM-1,vD)).getUTCDay(); /* 0 रविवार */
  const [nY,nM,nD] = addDays(vY,vM,vD,1);
  const stNext = sunTimes(nY,nM,nD,p.lat,p.lon,p.tzMin);
  const absBirth = (p.Y===vY && p.mo===vM && p.dy===vD) ? birthMin : birthMin + 1440;
  let horaIdx;
  if(absBirth < st.set) horaIdx = Math.floor((absBirth - st.rise) / ((st.set - st.rise)/12));
  else horaIdx = 12 + Math.floor((absBirth - st.set) / ((stNext.rise + 1440 - st.set)/12));
  horaIdx = Math.max(0, Math.min(23, horaIdx));
  const dayLordGraha = WEEKDAY_LORD[vedicWeekday];
  const startPos = HORA_SEQ.indexOf(dayLordGraha);
  const horaGraha = HORA_SEQ[(startPos + horaIdx) % 7];
  /* अयनांश प्रारूप: 23:47:20.83 */
  const aD = Math.floor(ayan), aMf = (ayan-aD)*60, aM = Math.floor(aMf), aS = (aMf-aM)*60;
  const ayanStr = aD + ':' + String(aM).padStart(2,'0') + ':' + aS.toFixed(2).padStart(5,'0');
  const jdn = Math.floor(jd + 0.5);
  const dobStr = String(p.dy).padStart(2,'0') + '-' + String(p.mo).padStart(2,'0') + '-' + p.Y;
  const h12 = ((p.hh+11)%12)+1, ampm = p.hh<12 ? 'AM' : 'PM';
  const tobStr = String(h12).padStart(2,'0') + ':' + String(p.mm).padStart(2,'0') + ':' + String(p.ss).padStart(2,'0') + ' ' + ampm;
  const sunNakIdx = Math.floor(sunLon/span) % 27;
  return { dobStr, tobStr, ayanStr, jdn, vedicWeekday, tithiNum, yogaIdx, kNum, horaGraha,
           lagnaSign, moonSign, sunSign, sunNakIdx, nakIdx, pada, moonDegInSign: moonLon - moonSign*30 };
}

/* ================= भाषा अनुसार मान बनाना ================= */
function valuesFor(lang, c){
  const v = [];
  v.push(null); /* नाम - बाहर से */
  v.push(c.dobStr);
  v.push(c.tobStr);
  v.push(null); /* स्थान - बाहर से */
  v.push(AYAN_NAME[lang]);
  v.push(c.ayanStr);
  v.push(WEEKDAY[lang][c.vedicWeekday] + ' (' + GRAHA9[lang][c.vedicWeekday] + ')');
  const tLord = ' (' + GRAHA9[lang][TITHI_LORD30[c.tithiNum-1]] + ')';
  if(c.tithiNum===30) v.push(AMV[lang] + tLord);
  else { const pk = c.tithiNum<=15 ? 0 : 1; const tn = c.tithiNum<=15 ? c.tithiNum-1 : c.tithiNum-16; v.push(PAKSHA[lang][pk] + '-' + TITHI_N[lang][tn] + tLord); }
  v.push(YOGA_N[lang][c.yogaIdx] + ' (' + GRAHA9[lang][YOGA_LORD_CYCLE[c.yogaIdx % 9]] + ')');
  if(KARANA_FIX[lang][c.kNum]) v.push(KARANA_FIX[lang][c.kNum]); else v.push(KARANA_MOV[lang][(c.kNum-2)%7] + ' (' + GRAHA9[lang][(c.kNum-2)%7] + ')');
  v.push(GRAHA[lang][c.horaGraha]);
  v.push(String(c.jdn));
  v.push(SIGNS[lang][c.lagnaSign]);
  v.push(SIGNS[lang][c.moonSign]);
  v.push(SIGNS[lang][c.sunSign] + ' - ' + NAK[lang][c.sunNakIdx]);
  v.push(NAK[lang][c.nakIdx]);
  v.push(String(c.pada));
  v.push(PADA_SYL[lang][c.nakIdx][c.pada-1]);
  v.push(PAYA_N[lang][payaIdx(c.nakIdx)] + BASED_ON[lang].nak + ' / ' + PAYA_N[lang][payaByBhavaIdx(c.moonSign, c.lagnaSign)] + BASED_ON[lang].lagna);
  v.push(VARNA_N[lang][VARNA_BY_SIGN[c.lagnaSign]] + BASED_ON[lang].lagna + ' / ' + VARNA_N[lang][VARNA_BY_SIGN[c.moonSign]] + BASED_ON[lang].rashi);
  const vashI = vashyaIdx(c.moonSign, c.moonDegInSign);
  let vashS = VASHYA_N[lang][vashI];
  if(lang==='en'){ if(vashI===1) vashS = 'Manava (Nara)'; vashS += ' (' + VASHYA_MEAN_EN[vashI] + ')'; }
  v.push(vashS);
  const yoni = YONI_BY_NAK[c.nakIdx];
  v.push(lang==='en' ? YONI_N[lang][yoni] + ' (' + YONI_MEAN_EN[yoni] + ')' : YONI_N[lang][yoni]);
  v.push(YONI_N[lang][YONI_VAIR[yoni]]);
  v.push(lang==='en' ? GANA_N[lang][GANA_BY_NAK[c.nakIdx]] + ' (' + GANA_MEAN_EN[GANA_BY_NAK[c.nakIdx]] + ')' : GANA_N[lang][GANA_BY_NAK[c.nakIdx]]);
  v.push(lang==='en' ? NADI_FULL_EN[NADI_BY_NAK[c.nakIdx]] : NADI_N[lang][NADI_BY_NAK[c.nakIdx]]);
  v.push(NADI_N[lang][nadiPadaIdx(c.nakIdx, c.pada)]);
  v.push(TATTVA_N[lang][GRAHA_TATTVA[SIGN_LORD_GRAHA[c.lagnaSign]]] + BASED_ON[lang].lagna + ' / ' + TATTVA_N[lang][GRAHA_TATTVA[SIGN_LORD_GRAHA[c.moonSign]]] + BASED_ON[lang].rashi);
  v.push(VIHAGA_N[lang][vihagaIdx(c.nakIdx)]);
  return v;
}
function renderSingle(lang, comp, name, place){
  const vals = valuesFor(lang, comp); vals[0]=name||''; vals[3]=place||'';
  return LABELS[lang].map((l,i)=> l + ', ' + vals[i]).join('\n');
}
function renderPair(lang, boy, girl){
  const bv = valuesFor(lang, boy.comp); bv[0]=boy.name||''; bv[3]=(boy.place||'').replace(/,\s*/g, ' - ');
  const gv = valuesFor(lang, girl.comp); gv[0]=girl.name||''; gv[3]=(girl.place||'').replace(/,\s*/g, ' - ');
  const lines = [LABELS[lang][0] + ', ' + (boy.name||'') + ', ' + (girl.name||'')];
  for(let i=1;i<28;i++) lines.push(LABELS[lang][i] + ', ' + bv[i] + ', ' + gv[i]);
  return lines.join('\n');
}

/* ================= UI ================= */
const $ = id => document.getElementById(id);
const state = { single:null, boy:null, girl:null };
function lang(){ return $('langSel').value; }
function refreshSingle(){ if(state.single) $('s_out').value = renderSingle(lang(), state.single, $('s_name').value.trim(), $('s_city').value.trim()); }
function refreshPair(){
  if(state.boy && state.girl){
    $('p_out').value = renderPair(lang(),
      {comp:state.boy, name:$('b_name').value.trim(), place:$('b_city').value.trim()},
      {comp:state.girl, name:$('g_name').value.trim(), place:$('g_city').value.trim()});
  }
}
async function fill(prefix, key){
  const stEl = $(prefix+'_status');
  if(!window._swe){ stEl.textContent='⚠️ Engine अभी तैयार नहीं है - थोड़ा रुककर फिर दबाएं'; stEl.className='status err'; return; }
  const parsed = parseCode($(prefix+'_code').value);
  if(!parsed){ stEl.textContent='❌ सही एस्ट्रो कोड डालें (AS1-YYYYMMDD-HHMMSS-±HHMM-DDMMN/S-DDDMME/W)'; stEl.className='status err'; return; }
  try {
    state[key] = computePerson(parsed);
    stEl.textContent = '✅ भर गया - आउटपुट तैयार है'; stEl.className='status ok';
    if(key==='single') refreshSingle(); else refreshPair();
  } catch(e){ stEl.textContent='❌ गणना नहीं हो पाई: ' + (e.message||e); stEl.className='status err'; }
}
$('s_fill').addEventListener('click', ()=>fill('s','single'));
$('b_fill').addEventListener('click', ()=>fill('b','boy'));
$('g_fill').addEventListener('click', ()=>fill('g','girl'));
['s_name','s_city'].forEach(id=> $(id).addEventListener('input', refreshSingle));
['b_name','b_city','g_name','g_city'].forEach(id=> $(id).addEventListener('input', refreshPair));
$('langSel').addEventListener('change', ()=>{ refreshSingle(); refreshPair(); });
function doCopy(outId, stId){
  const ta = $(outId);
  if(!ta.value){ $(stId).textContent='पहले एस्ट्रो कोड भरें'; $(stId).className='status err'; return; }
  const done = ()=>{ $(stId).textContent='✅ कॉपी हो गया'; $(stId).className='status ok'; };
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(ta.value).then(done).catch(()=>{ ta.select(); document.execCommand('copy'); done(); }); }
  else { ta.select(); document.execCommand('copy'); done(); }
}
$('s_copy').addEventListener('click', ()=>doCopy('s_out','s_copystatus'));
$('p_copy').addEventListener('click', ()=>doCopy('p_out','p_copystatus'));
$('tabBtn1').addEventListener('click', ()=>{ $('tabBtn1').classList.add('on'); $('tabBtn2').classList.remove('on'); $('panel1').classList.remove('hidden'); $('panel2').classList.add('hidden'); });
$('tabBtn2').addEventListener('click', ()=>{ $('tabBtn2').classList.add('on'); $('tabBtn1').classList.remove('on'); $('panel2').classList.remove('hidden'); $('panel1').classList.add('hidden'); });

/* ================= शहर खोज (सिर्फ नाम के लिए, गणना से कोई संबंध नहीं) ================= */
function attachCity(inputId, suggId){
  const inp = $(inputId), box = $(suggId);
  let timer = null;
  inp.addEventListener('input', ()=>{
    clearTimeout(timer);
    const q = inp.value.trim();
    if(q.length<3){ box.style.display='none'; return; }
    timer = setTimeout(async ()=>{
      try {
        const r = await fetch('https://nominatim.openstreetmap.org/search?format=json&addressdetails=1&limit=6&q=' + encodeURIComponent(q), {headers:{'Accept':'application/json'}});
        const data = await r.json();
        if(!data.length){ box.style.display='none'; return; }
        box.innerHTML='';
        data.forEach(d=>{
          const a = d.address||{};
          const city = a.city||a.town||a.village||a.state_district||d.display_name.split(',')[0];
          const parts = [city, a.state || a.country].filter(Boolean);
          const label = [...new Set(parts)].join(', ');
          const div = document.createElement('div');
          div.textContent = label;
          div.addEventListener('click', ()=>{ inp.value = label; box.style.display='none'; inp.dispatchEvent(new Event('input')); });
          box.appendChild(div);
        });
        box.style.display='block';
      } catch(e){ box.style.display='none'; }
    }, 450);
  });
  document.addEventListener('click', e=>{ if(e.target!==inp) box.style.display='none'; });
}
attachCity('s_city','s_sugg'); attachCity('b_city','b_sugg'); attachCity('g_city','g_sugg');
