<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📁 मेरा फोल्डर</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { font-family:'Noto Sans Devanagari','Nirmala UI','Mangal',sans-serif; background:#f3ecdd; color:#3a2a1a; min-height:100vh; }
  a { text-decoration:none; color:inherit; display:block; }
  .appheader { background:linear-gradient(135deg,#3d1028 0%,#6d1a3c 55%,#8f2438 100%); color:#ffe9b8; padding:30px 20px 32px; text-align:center; border-radius:0 0 28px 28px; box-shadow:0 6px 18px rgba(61,16,40,.35); position:relative; overflow:hidden; }
  .appheader .om { font-size:42px; }
  .appheader h1 { font-size:28px; margin:6px 0 2px; color:#ffd97a; }
  .appheader p { font-size:14px; color:#f7dfae; }
  .wrap { padding:18px 14px 30px; max-width:560px; margin:0 auto; }
  .back { display:inline-block; margin:4px 6px 12px; font-size:15px; font-weight:700; color:#6d1a3c; background:#fffdf7; border:1px solid #efe2c4; padding:8px 18px; border-radius:20px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .card { background:#fffdf7; border-radius:18px; padding:18px 10px 16px; text-align:center; box-shadow:0 3px 10px rgba(109,26,60,.10); border:1px solid #efe2c4; }
  .card:active { transform:scale(.97); background:#fdf3dd; }
  .icon { width:56px; height:56px; margin:0 auto 10px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:28px; background:linear-gradient(135deg,#fff3d6,#ffe0a3); border:2px solid #e8b64c; }
  .card h3 { font-size:15.5px; color:#4a1f33; line-height:1.35; }
  .card small { font-size:11.5px; color:#a07c3f; display:block; margin-top:3px; }
  .footer { text-align:center; font-size:12px; color:#a07c3f; padding:6px 16px 26px; }
</style>
</head>
<body>
  <div class="appheader">
    <div class="om">📁</div>
    <h1>मेरा फोल्डर</h1>
    <p>यहां अपना विवरण लिखो</p>
  </div>
  <div class="wrap">
    <a class="back" href="https://astrosarang.github.io/astro-app-tools/">← वापस</a>
    <div class="grid">
      <!-- नीचे अपनी 4-5 cards रखो: href में tool का link, icon में emoji, h3 में नाम, small में विवरण -->
      <a class="card" href="https://astrosarang.github.io/astro-app-tools/tools/d1.html"><div class="icon">🔮</div><h3>D1 विश्लेषण</h3><small>वैदिक ज्योतिष कैलकुलेटर</small></a>
      <a class="card" href="https://astrosarang.github.io/astro-app-tools/tools/kp.html"><div class="icon">🎯</div><h3>KP ज्योतिष</h3><small>KP Calculator</small></a>
      <a class="card" href="https://astrosarang.github.io/astro-app-tools/tools/dashas.html"><div class="icon">🪐</div><h3>दशाएं</h3><small>Dashas</small></a>
      <a class="card" href="https://astrosarang.github.io/astro-app-tools/tools/gochars.html"><div class="icon">♄</div><h3>गोचर</h3><small>Gochars</small></a>
      <a class="card" href="https://astrosarang.github.io/astro-app-tools/tools/shubh.html"><div class="icon">🌟</div><h3>शुभ मुहूर्त</h3><small>Shubh Muhurt</small></a>
    </div>
  </div>
  <div class="footer">Astro Sarang</div>
</body>
</html>
