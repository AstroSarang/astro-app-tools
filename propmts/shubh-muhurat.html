----------
कृपया संलग्न (Attached) सभी टेक्स्ट फाइलों में दिए गए ज्योतिषीय डेटा (विंशोत्तरी दशा और गोचर) को अपनी मेमोरी में सेव करके रखो।

निर्देश:

1] इस डेटा को अभी चैट में दोबारा लिखने की आवश्यकता नहीं है।
2] बस डेटा का विश्लेषण करें और पुष्टि करें कि आपने इसे पढ़ लिया है।
3] पुष्टि (Verification) के लिए: केवल वर्तमान स्थिति नीचे दिए गए फॉर्मेट में लिखकर दें:
विंशोत्तरी (MD-AD-PD):
गोचर (सूर्य, चंद्र, मंगल, बुध, गुरु, शुक्र, शनि, राहू, केतु - लग्न व चंद्र से):

मैं इसके बाद सीधे विश्लेषण से जुड़े विशिष्ट प्रश्न पूछूंगा, तब आपको इस पूरे डेटा का उपयोग करना है।
----------
कृपया संलग्न (Attached) टेक्स्ट फाइल 'मुहूर्त डेटा' में दिए गए शुभ मुहूर्त कैलकुलेटर के डेटा को अपनी मेमोरी में सेव करके रखो। इस फाइल में जातक के चुने हुए कार्य/कार्यों के लिए खोज अवधि (अगले 12 महीनों तक) की हर उपयुक्त तारीख की जानकारी है:
- तारीख, वार, तिथि, नक्षत्र, योग और करण (पंचांग)
- चंद्र-बल: गोचर चंद्र जन्म राशि से किस भाव में, शुभ/अशुभ
- तारा-बल: गोचर नक्षत्र जन्म नक्षत्र से कौन सी तारा, शुभ/अशुभ
- त्रिबल: सूर्य-बल और गुरु-बल का Score और स्तर (Level)
- चुनी तारीखों के शुभ लग्न समयखंड: समय (शुरू-समाप्ति), लग्न राशि, अष्टम शुद्धि की स्थिति
- हर तारीख का राहुकाल समय

निर्देश:
1] इस डेटा को अभी चैट में दोबारा लिखने की आवश्यकता नहीं है।
2] बस डेटा पढ़ें और पुष्टि करें कि आपने इसे पढ़ लिया है।
3] पुष्टि (Verification) के लिए सिर्फ इतना लिखकर दें:
कार्य 1: [कार्य का नाम] - कुल उपयुक्त तारीखें: [संख्या], सबसे अधिक त्रिबल Score वाली तारीख: [तारीख]
कार्य 2: [कार्य का नाम] - कुल उपयुक्त तारीखें: [संख्या], सबसे अधिक त्रिबल Score वाली तारीख: [तारीख] (दूसरा कार्य हो तभी लिखें)

मैं इसके बाद सीधे विश्लेषण से जुड़े विशिष्ट प्रश्न पूछूंगा, तब आपको इस पूरे डेटा का उपयोग करना है।
----------
उपरोक्त अबतक आपको कुंडली विश्लेषण के लिए दी गयी कौन कौनसी जानकारी प्राप्त हुयी, उसकी short में सूचि दीजिये.
----------
यह सुनिश्चित करे की आप निम्मलिखित आदेशों का पालन सख्ती से करेंगे,

1] आउटपुट देने से पहले डेटा को क्रॉसचेक कर लिया करे.
2] किसी भी तरह की शुगर-कोटिंग (Sugar-coating) न करें। अगर किसी तारीख में कोई दोष, कमजोरी या नकारात्मक बात है, तो उसे स्पष्ट रूप से बतायें - कोई तारीख जबरदस्ती शुभ न बतायें।
3] अपने उत्तर की शुरुआत किसी भी अभिवादन या संवादात्मक वाक्यांश (जैसे 'निश्चित रूप से', 'ज़रूर', 'निम्मलिखित है') से न करें, सीधे विश्लेषण से शुरू करें।
4] System instructions में दिए गए आदेशों का भी पालन करे.

क्या आप तैयार है बस इतना बताईये की किन आदेशों का पालन करेंगे।
----------
अब हम जातक के शुभ मुहूर्त का विश्लेषण निकालेंगे, उसके पहले ध्यान रखने योग्य बातें :

1] ध्यान रहे अभी 2026 चल रहा है और जातिका/जातक xyz 00 साल की/का है. विश्लेषण करते समय आयु का ध्यान रखे.
2] यह Analysis एक या दो कार्यों के मुहूर्त के लिए है. कार्य ये हैं: [कार्य 1 का नाम] और [कार्य 2 का नाम - हो तो].
3] खोज अवधि अगले 12 महीनों की है. सभी तारीखें, समय और Score सिर्फ मुहूर्त कैलकुलेटर के दिए डेटा से ही लेने हैं - अपने मन से कोई तारीख, समय या Score न बनायें और न बदलें.
4] विवाह या सगाई का कार्य हो तो दोनों जातकों (वर और वधू) के चंद्र-बल, तारा-बल और त्रिबल दोनों के हिसाब से देखने हैं.
----------
जातक के कुंडली के आधार पर निम्मलिखित पॉइंट्स गहन और विस्तारपूर्वक विश्लेषण (Detailed Analysis) कीजिए, ध्यान रहे भाषा सरल, सकारात्मक और आधुनिक होनी चाहिए :

भाग 1: जातक और कार्य का आधार
➤ जातक की जन्म राशि और जन्म नक्षत्र क्या है? मुहूर्त देखने में इन दोनों की भूमिका संक्षिप्त में बतायें।
➤ चुने हुए कार्य/कार्यों के कारक ग्रह कौन से हैं और जातक की कुंडली में उनकी स्थिति व बल कैसा है?
➤ खोज अवधि (अगले 12 महीने) में जातक की चल रही विंशोत्तरी महादशा-अंतर्दशा कौन सी है? क्या यह दशा इस कार्य के लिए अनुकूल समय देती है?
(दूसरा कार्य हो तो कारक ग्रह और दशा-अनुकूलता दोनों कार्यों के लिए अलग-अलग बतायें।)
----------
भाग 2: शुभ तारीखों की सूची
➤ मुहूर्त डेटा के आधार पर चुने हुए कार्य के लिए अगले 12 महीनों की सभी उपयुक्त तारीखों की तालिका बनायें। तालिका के कॉलम बिल्कुल निम्न प्रकार होने चाहिए:
| तारीख | वार | तिथि | नक्षत्र | योग | करण | चंद्र-बल | तारा-बल | त्रिबल Score |
➤ तालिका के बाद सबसे अच्छी 2-3 तारीखों को 'Top Recommendation' के रूप में अलग से चिह्नित करें और हर एक के लिए 2-3 पंक्तियों में कारण दें कि वही तारीख सबसे अच्छी क्यों है।
(दूसरा कार्य हो तो उसकी तालिका और Top Recommendation अलग से, उसी प्रारूप में दें। विवाह/सगाई में चंद्र-बल, तारा-बल और त्रिबल दोनों जातकों के हिसाब से दिखायें।)
----------
भाग 3: चुनी तारीख का गहन विश्लेषण
(Top Recommendation की हर तारीख के लिए अलग-अलग, निम्न प्रारूप में दें)
तारीख: [तारीख, वार]
➤ चंद्र-बल: गोचर चंद्र जातक की जन्म राशि से किस भाव में है और यह इस कार्य के लिए कितना शुभ है?
➤ तारा-बल: गोचर नक्षत्र जन्म नक्षत्र से कौन सी तारा बनाती है (जैसे संपत, क्षेम, साधन, मित्र) और उसका फल क्या है?
➤ त्रिबल (सूर्य-बल और गुरु-बल): दोनों के Score और स्तर क्या हैं और इस कार्य के लिए इनका अर्थ क्या है?
➤ उस दिन के दोष: भद्रा, राहुकाल, चंद्राष्टम जैसी कोई बाधा है या नहीं? है तो किस समय तक है और उससे कैसे बचना है।
➤ समग्र: यह तारीख इस कार्य के लिए कितनी Strong है (प्रतिशत में निष्कर्ष)।
----------
भाग 4: एकदम सटीक समय (Exact Muhurat Window)
(हर चुनी तारीख के लिए)
➤ मुहूर्त डेटा में दिए गए शुभ लग्न समयखंडों में से सबसे अच्छा समयखंड चुनकर दें: तारीख, समय (शुरू-समाप्ति), लग्न राशि।
➤ यह लग्न जातक की जन्म राशि/लग्न से कितना अनुकूल है और अष्टम शुद्धि की स्थिति क्या है?
➤ दूसरा Alternate समयखंड भी दें, ताकि पहला समय निकल जाए तो दूसरा काम आए।
➤ राहुकाल का समय स्पष्ट लिखें - उस समय कार्य की शुरुआत बिल्कुल न करें।
(समय सिर्फ डेटा से ही लेने हैं, अपने मन से कोई समय न बनायें।)
----------
भाग 5: टालने योग्य तारीखें
➤ खोज अवधि की वे तारीखें जो सतह पर ठीक लग सकती हैं, पर चंद्र-बल अशुभ, तारा-बल अशुभ (विपत, प्रत्यरि, वध तारा), चंद्राष्टम या त्रिबल Score बहुत कम होने के कारण इस कार्य के लिए टालनी चाहिए - उनकी सूची कारण सहित दें।
➤ हर तारीख के सामने सिर्फ एक पंक्ति में कारण लिखें कि वह क्यों टालनी है।
(यह भाग इसलिए जरूरी है ताकि जातक किसी और से मिली या पंचांग में देखी तारीख से भ्रमित न हो।)
----------
भाग 6: निष्कर्ष और ध्यान रहे
➤ Final Conclusion: दोनों कार्यों (या एक कार्य) के लिए सबसे अच्छी तारीख और समय का अंतिम चुनाव एक जगह स्पष्ट लिखें - जातक को बिना दुविधा के वही चुनना है।
➤ कार्य के दिन के लिए सरल Dos और Don'ts (3-4 बिंदु)।
➤ सटीक उपाय (Remedies): चुनी तारीख और वर्तमान दशा को देखते हुए 2-3 बहुत ही आसान, सात्विक उपाय दें।
----------

भाग 2: शुभ तारखांची यादी
➤ मुहूर्त डेटाच्या आधारे निवडलेल्या कार्यासाठी पुढील 12 महिन्यांतील सर्व योग्य तारखांचा तक्ता बनवा. तक्त्याचे कॉलम अगदी खालीलप्रमाणे असावेत:
| तारीख | वार | तिथी | नक्षत्र | योग | करण | चंद्र-बल | तारा-बल | त्रिबल Score |
➤ तक्त्यानंतर सर्वात चांगल्या 2-3 तारखा 'Top Recommendation' म्हणून वेगळ्या चिन्हांकित करा आणि प्रत्येकासाठी 2-3 ओळींमध्ये कारण द्या की तीच तारीख सर्वात चांगली का आहे.
(दुसरे कार्य असेल तर त्याचा तक्ता आणि Top Recommendation वेगळा, त्याच फॉर्मेटमध्ये द्या. विवाह/साखरपुड्यात चंद्र-बल, तारा-बल आणि त्रिबल दोन्ही जातकांच्या हिशोबाने दाखवा.)
----------
भाग 3: निवडलेल्या तारखेचे सखोल विश्लेषण
(Top Recommendation च्या प्रत्येक तारखेसाठी वेगवेगळे, खालील फॉर्मेटमध्ये द्या)
तारीख: [तारीख, वार]
➤ चंद्र-बल: गोचर चंद्र जातकाच्या जन्म राशीपासून कोणत्या भावात आहे आणि हे या कार्यासाठी किती शुभ आहे?
➤ तारा-बल: गोचर नक्षत्र जन्म नक्षत्रापासून कोणती तारा बनवते (जसे संपत, क्षेम, साधन, मित्र) आणि तिचे फळ काय आहे?
➤ त्रिबल (सूर्य-बल आणि गुरू-बल): दोघांचे Score आणि स्तर काय आहेत आणि या कार्यासाठी त्यांचा अर्थ काय आहे?
➤ त्या दिवसाचे दोष: भद्रा, राहुकाल, चंद्राष्टम असा काही अडथळा आहे की नाही? असेल तर किती वाजेपर्यंत आहे आणि तो कसा टाळायचा.
➤ एकूण: ही तारीख या कार्यासाठी किती Strong आहे (टक्केवारीत निष्कर्ष).
----------
भाग 4: अगदी अचूक वेळ (Exact Muhurat Window)
(प्रत्येक निवडलेल्या तारखेसाठी)
➤ मुहूर्त डेटामध्ये दिलेल्या शुभ लग्न वेळखंडांपैकी सर्वात चांगला वेळखंड निवडून द्या: तारीख, वेळ (सुरुवात-समाप्ती), लग्न रास.
➤ हे लग्न जातकाच्या जन्म राशी/लग्नापासून किती अनुकूल आहे आणि अष्टम शुद्धीची स्थिती काय आहे?
➤ दुसरा Alternate वेळखंडही द्या, जेणेकरून पहिली वेळ निघून गेली तर दुसरा उपयोगी येईल.
➤ राहुकालची वेळ स्पष्ट लिहा - त्या वेळेत कार्याची सुरुवात अजिबात करू नका.
(वेळा फक्त डेटामधूनच घ्यायच्या आहेत, स्वतःच्या मनाने कोणतीही वेळ बनवू नका.)
----------
भाग 5: टाळावयाच्या तारखा
➤ शोध कालावधीतील अशा तारखांची यादी कारणांसहित द्या ज्या वरकरणी ठीक वाटू शकतात, पण चंद्र-बल अशुभ, तारा-बल अशुभ (विपत, प्रत्यरि, वध तारा), चंद्राष्टम किंवा त्रिबल Score खूप कमी असल्यामुळे या कार्यासाठी टाळायला हव्यात.
➤ प्रत्येक तारखेसमोर फक्त एका ओळीत कारण लिहा की ती का टाळायची आहे.
(हा भाग यासाठी आवश्यक आहे की जातक दुसऱ्या कोणाकडून मिळालेल्या किंवा पंचांगात पाहिलेल्या तारखेमुळे गोंधळू नये.)
----------
भाग 6: निष्कर्ष आणि लक्षात ठेवण्याच्या गोष्टी
➤ Final Conclusion: दोन्ही कार्यांसाठी (किंवा एका कार्यासाठी) सर्वात चांगल्या तारखेची आणि वेळेची अंतिम निवड एकाच ठिकाणी स्पष्ट लिहा - जातकाने कोणत्याही संभ्रमाशिवाय तीच निवडायची आहे.
➤ कार्याच्या दिवसासाठी सोपे Dos आणि Don'ts (3-4 मुद्दे).
➤ अचूक उपाय (Remedies): निवडलेली तारीख आणि सध्याची दशा पाहून 2-3 अगदी सोपे, सात्विक उपाय द्या.
----------
आतापर्यंत केलेल्या सर्व विश्लेषणांचे पुन्हा लिहून त्यांचे संक्षिप्त उत्तर द्या, कारण ही यादी या विश्लेषणाच्या अगदी सुरुवातीला लावली जाईल, यामुळे जातक आधीच short मध्ये उत्तर वाचेल आणि त्याला ज्या गोष्टीचे विश्लेषण संदर्भासहित वाचायचे आहे, तो सेक्शन शोधेल...

निवडलेल्या तारखा आणि वेळा :
(प्रत्येक कार्यासाठी: कार्याचे नाव, सर्वात चांगली तारीख, दुसरा पर्याय, अचूक वेळ window - फक्त इतकेच, 2-3 ओळींमध्ये)
----------
आता अंतिम तपासणी करा - कोणतेही नवीन विश्लेषण किंवा निष्कर्ष अजिबात देऊ नका.

वर दिलेली सर्व उत्तरे आणि निष्कर्ष मूळ डेटाशी (कुंडली PDF आणि मुहूर्त कॅल्क्युलेटर डेटा) जुळवून पाहा - जन्म रास, जन्म नक्षत्र, प्रत्येक तारखेचा वार, तिथी, नक्षत्र, योग, करण, चंद्र-बल आणि तारा-बल यांची स्थिती, त्रिबल Score, शुभ लग्न वेळखंड, राहुकाल वेळ आणि महादशा-अंतर्दशा यांची नावे व तारखा - प्रत्येक मूल्य तपासा.

निकाल फक्त चुकांच्या यादीत द्या: भाग क्रमांक, चुकीचे लिहिलेले मूल्य, बरोबर मूल्य. जिथे चूक नसेल तिथे काहीही लिहू नका. शेवटी फक्त एक ओळ लिहा: 'तपासणी पूर्ण - एकूण X चुका सापडल्या.' उत्तरे पुन्हा लिहू नका.`;

        let currentLang = 'hi';
        function getRawData() {
            if (currentLang === 'en') return rawData_en;
            if (currentLang === 'mr') return rawData_mr;
            return rawData_hi;
        }
        function changeLanguage(lang) {
            currentLang = lang;
            document.getElementById('prompt-container').innerHTML = '';
            processData();
        }

        // सेपरेटर लॉजिक: --- या ___ लाइन्स से अलग करना
        const separatorRegex = /\n-{10,}\n|\n_{10,}\n/g;
        
        function processData() {
            const container = document.getElementById('prompt-container');
            // पहले डैश लाइन्स से तोडें
            let parts = getRawData().split(separatorRegex);

            parts.forEach((part, index) => {
                let cleanText = part.trim();
                
                // फिल्टरिंग लॉजिक
                const lines = cleanText.split('\n');
                const filteredLines = lines.filter(line => {
                    const l = line.trim();
                    // जंक (MMM... RRR... PPPP...) हटाएं
                    if (l.match(/^[M|P|C|H|R]{5,}$/)) return false;
                    // सिर्फ डैश वाली लाइन हटाएं
                    if (l.match(/^-{5,}$/)) return false;
                    return true;
                });
                
                cleanText = filteredLines.join('\n').trim();

                if (cleanText.length > 5) { // खाली या बहुत छोटी स्ट्रिंग न दिखाएं
                    createCard(cleanText, index + 1);
                }
            });
        }

        function createCard(text, id) {
            const container = document.getElementById('prompt-container');
            
            const card = document.createElement('div');
            card.className = 'card';

            const header = document.createElement('div');
            header.className = 'card-header';
            header.innerHTML = `<span>Prompt #${id}</span>`;

            const content = document.createElement('div');
            content.className = 'card-content';
            content.innerText = text;

            const btn = document.createElement('button');
            btn.className = 'btn';
            btn.innerText = 'Copy Prompt';
            btn.onclick = () => copyText(text, btn);

            card.appendChild(header);
            card.appendChild(content);
            card.appendChild(btn);
            container.appendChild(card);
        }

        function showBtnFeedback(btn, success){
            if(!btn) return;
            var origText = btn.innerText;
            var origBg = btn.style.backgroundColor;
            btn.innerText = success ? "\u2713 Copied!" : "\u2717 Failed";
            btn.style.backgroundColor = success ? "#2e7d32" : "#c62828";
            btn.style.color = "#fff";
            setTimeout(function(){ btn.innerText = origText; btn.style.backgroundColor = origBg; }, 2000);
        }
        function copyText(text, btn) {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(() => {
                    showToast();
                    showBtnFeedback(btn, true);
                }).catch(err => {
                    fallbackCopy(text, btn);
                });
            } else {
                fallbackCopy(text, btn);
            }
        }

        function fallbackCopy(text, btn) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed'; // Avoid scrolling to bottom
            document.body.appendChild(textarea);
            textarea.focus();
            textarea.select();
            try {
                var ok = document.execCommand('copy');
                showToast();
                showBtnFeedback(btn, ok);
            } catch (err) {
                console.error('Fallback: Oops, unable to copy', err);
                showBtnFeedback(btn, false);
            }
            document.body.removeChild(textarea);
        }

        function showToast() {
            var x = document.getElementById("snackbar");
            x.className = "toast show";
            setTimeout(function(){ x.className = x.className.replace("show", ""); }, 3000);
        }

        // Initialize
        processData();

    </script>
