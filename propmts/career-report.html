➤ PN, PB, MB का जीवन पर प्रभाव (Impact on Life)

विषय: वैदिक ज्योतिष - ग्रह एवं भावों के लिए पुष्कर नवांश (PN), पुष्कर भाग (PB) और मृत्यु भाग (MB) की गणना एवं फलादेश।

TXT गणनाओं के आधार पर निम्नलिखित क्षेत्रों पर प्रभाव लिखें:

​▸ दैवीय सुरक्षा (Divine Protection): कौन से भाव/ग्रह पुष्कर ऊर्जा से सुरक्षित हैं और जीवन के किन क्षेत्रों में 'बिना मांगे' मदद मिलेगी?

​▸ संघर्ष एवं बाधाएं (MB Impact): मृत्यु भाग वाले ग्रह जीवन के किन क्षेत्रों में 'लैंडमाइन' की तरह बाधा पैदा कर सकते हैं?

​▸ शुरुआत बनाम परिणाम (Start vs Middle): भाव 'प्रारंभ' और 'मध्य' के पुष्कर अंतर के आधार पर बताएं कि कार्य की शुरुआत कैसी होगी और उसका अंत कैसा होगा?

▸ PN और PB की गणना में देखें कि क्या उनका 'भावेश' MB में है ?
(यदि भाव का स्वामी (Bhavesh) मृत्यु भाग में है, तो भाव के पुष्कर होने पर भी फल बाधित होगा)

​▸ दशा फल: वर्तमान या आगामी महादशा में इन अमृत/विष बिंदुओं का क्या प्रभाव पड़ेगा?

➤ कुंडली में इन्दु लग्न किस राशि और भाव में स्थित है?
➤ इन्दु लग्न में कौन-कौन से ग्रह स्थित हैं और इन्दु लग्न पर किन ग्रहों की दृष्टि है (शुभ या अशुभ)?
➤ इन्दु लग्न का स्वामी कहाँ और किस स्थिति में (उच्च/नीच/स्वराशि) बैठा है?
➤ क्या दशमेश (करियर), षष्ठेश (नौकरी), या सप्तमेश (व्यापार) का इन्दु लग्न से कोई सीधा संबंध बन रहा है?

विश्लेषण: जातक का अंतिम आर्थिक स्तर (Wealth Status) कैसा रहेगा? क्या कुंडली में असाधारण धन (करोड़पति योग) है या धन के लिए लगातार संघर्ष करना पड़ेगा? धन का मुख्य स्रोत क्या होगा?

भाग 2: जैमिनी ज्योतिष के अनुसार करियर का विश्लेषण

(यह भाग करियर में पद, अधिकार, आत्मा के उद्देश्य और सार्वजनिक छवि को समझने के लिए है।)

1] आत्मकारक (AK) और  अमात्यकारक (AmK)-आत्मा का उद्देश्य और सलाहकार:
A] आत्मकारक (AK):

➤ जैमिनी पद्धति से आत्मकारक ग्रह कौन-सा है? (सबसे ज्यादा अंश वाला ग्रह)
➤ आत्मकारक  किस राशि और भाव में स्थित है?
➤ आत्मकारक के साथ कौन-कौन से ग्रहों (चर कारक) की युति है?
➤ आत्मकारक पर किन राशियों की जैमिनी राशि दृष्टि है? (चर,स्थिर,द्विस्वभाव)
➤ आत्मकारक किस नवमांश में स्थित है?
➤ आत्मकारक किस नक्षत्र में स्थित है?

B]अमात्यकारक  (AmK):

➤ जैमिनी पद्धति से अमात्यकारक ग्रह कौन-सा है? (दूसरा सबसे ज्यादा अंश वाला ग्रह)
➤ अमात्यकारक किस राशि और भाव में स्थित है?
➤ अमात्यकारक के साथ कौन-कौन से ग्रहों (चर कारक) की युति है?
➤ अमात्यकारक पर किन राशियों की जैमिनी राशि दृष्टि है? (चर,स्थिर,द्विस्वभाव)
➤ अमात्यकारक किस नवमांश में स्थित है?
➤ अमात्यकारक किस नक्षत्र में स्थित है?

विश्लेषण: AmK जातक की आत्मा का मूल उद्देश्य और जीवन की दिशा दर्शाता है। AmK उस सलाहकार या माध्यम (करियर/मंत्रियों) का प्रतिनिधित्व करता है जो उस उद्देश्य को प्राप्त करने में मदद करता है।

to be continued...

2] AK और AmK का आपसी संबंध - उद्देश्य और मार्ग में सामंजस्य:
➤ क्या AK और AmK एक-दूसरे से शुभ भावों में स्थित हैं (जैसे केंद्र 1, 4, 7, 10; त्रिकोण 1, 5, 9; या 3/11 का संबंध)?
➤ क्या वे एक-दूसरे पर जैमिनी राशि दृष्टि डाल रहे हैं?

विश्लेषण: यह संबंध करियर में सहजता और सफलता को दर्शाता है। यदि संबंध शुभ है, तो करियर आत्मा की संतुष्टि के साथ आगे बढ़ता है और व्यक्ति अपने काम से खुश रहता है। अशुभ संबंध आंतरिक संघर्ष और असंतोष का संकेत देता है।

3] कर्म पद (A10) - पेशेवर छवि और सार्वजनिक प्रतिष्ठा:
➤ A10 (कर्मपद)  किस राशि और भाव में स्थित है?
➤ A10 में कौन-कौन से ग्रह (चर कारक) स्तिथ है?
➤ A10 पर किन राशियों की जैमिनी राशि दृष्टि है? (चर,स्थिर,द्विस्वभाव) (शुभ ग्रहों का प्रभाव प्रसिद्धि देता है, पाप ग्रहों का प्रभाव विवाद या संघर्ष)।
➤ क्या A10 का संबंध लग्न आरूढ़ (AL), आत्मकारक (AK) या अमात्यकारक (AmK) से बन रहा है?

विश्लेषण: यह दर्शाता है कि दुनिया आपके काम और पद को कैसे देखती है। यह करियर से मिलने वाली प्रसिद्धि, सामाजिक प्रतिष्ठा और सार्वजनिक छवि का सटीक आकलन करता है।

to be continued...

4] कारकांश लग्न (Karakamsa Lagna)-छिपी हुई प्रतिभा और भाग्य:
➤ कारकांश लग्न से दशम भाव में कौन सी राशि और ग्रह हैं?
➤ कारकांश दशमेश कहाँ स्थित है?
➤ कारकांश दशमेश किन ग्रहों के साथ युति में है?

विश्लेषण: यह जातक की छिपी हुई प्रतिभा, आंतरिक इच्छाओं और करियर की वास्तविक दिशा को इंगित करता है। कारकांश से दशम भाव व्यक्ति के अंतिम कर्म और भाग्य को दर्शाता है।

5] अर्गला विश्लेषण - अदृश्य हस्तक्षेप और संसाधनों का प्रवाह:

➤ दशम भाव पर अर्गला: करियर के "संस्थान" (जैसे ऑफिस, कंपनी) को किन ग्रहों से निरंतर सहयोग या बाधा मिल रही है?
➤ अमात्यकारक (AmK) पर अर्गला: करियर में उच्च अधिकारियों, सलाहकारों या सहकर्मियों से मिलने वाले सहयोग या बाधा का विश्लेषण।
➤ A10 (कर्म पद) पर अर्गला: आपकी सार्वजनिक छवि और प्रतिष्ठा को कौन सी ताकतें पर्दे के पीछे से मजबूत कर रही हैं या कमजोर कर रही हैं?

विश्लेषण: करियर में मिलने वाले अदृश्य सहयोग, संसाधनों का प्रवाह और छिपी हुई बाधाओं का पता लगाना।

➤ घटिका लग्न पर किन राशियों (चर, स्थिर, द्विस्वभाव) की जैमिनी दृष्टि है?

भाग 4: कृष्णमूर्ति पद्धति (KP) के अनुसार करियर का विश्लेषण

(यह भाग करियर की घटनाओं और सफलता के वादे का सटीक आकलन करने के लिए है।)

1] करियर का वादा (Promise of Profession)

A] समग्र करियर का वादा (Overall Promise of Profession):
➤ 10वें भाव का कस्पल सब-लॉर्ड (CSL) कौन है?
➤ यह CSL किन भावों को सिग्निफाई कर रहा है? (विशेषकर 2, 6, 10, 11 भावों का संबंध)।

विश्लेषण: क्या कुंडली में एक स्थिर और सफल करियर का वादा है? (भाव 2, 6, 10, 11 आय और सेवा/पद दर्शाते हैं, जबकि 5, 8, 12 बाधाएं दर्शाते हैं)। (सफल करियर के वादे का 100 में से कितने प्रतिशत संभावना है?)

B] नौकरी का वादा (Promise of Job):
➤ 6ठे भाव का कस्पल सब-लॉर्ड (CSL) कौन है?
➤ यह 6th CSL किन भावों को सिग्निफाई कर रहा है?
➤ क्या यह नौकरी के अनुकूल भावों (2, 6, 10, 11) से जुड़ा है या नौकरी छूटने/बाधा के भावों (1, 5, 9, 12) से?

विश्लेषण: क्या जातक के लिए नौकरी (Job/Service) में स्थिरता और सफलता का स्पष्ट वादा है? (सफल नौकरी के वादे का 100 में से कितने प्रतिशत संभावना है?)

C] व्यापार का वादा (Promise of Business):
➤ 7वें भाव का कस्पल सब-लॉर्ड (CSL) कौन है?
➤ यह 7th CSL किन भावों को सिग्निफाई कर रहा है?
➤ क्या यह व्यापार के अनुकूल भावों (2, 7, 10, 11) से जुड़ा है या व्यापार में नुकसान/बर्बादी के भावों (5, 8, 12) से?

विश्लेषण: क्या जातक स्वतंत्र व्यापार (Business) में सफल हो पाएगा या उसे रिस्क लेने से बचना चाहिए? (सफल व्यापार के वादे का 100 में से कितने प्रतिशत संभावना है?)

to be continued...

2] पेशे की प्रकृति (Nature of Profession):

A] समग्र पेशे की प्रकृति (Nature of Profession):
➤ 10वें CSL का नक्षत्र स्वामी कौन है और वह कहाँ स्थित है?
➤ 10वें CSL का उप-स्वामी (SL) कौन है और वह कहाँ स्थित है?
➤ 10वें CSL का उप-उप स्वामी (SSL) कौन है और वह कहाँ स्थित है?
➤ करियर से संबंधित भावों (2, 6, 10, 11) को सिग्निफाई करने वाले प्रमुख ग्रह कौन से हैं और उनकी स्थिति क्या है?
➤ भाव 2, 6, 10, 11 के सबसे मजबूत सिग्निफिकेटर ग्रह कौन से हैं?

विश्लेषण: नौकरी, व्यापार या स्वतंत्र पेशे का सटीक निर्धारण। ग्रहों की प्रकृति से कार्यक्षेत्र का पता लगाना।

B] नौकरी की प्रकृति (Nature of Job):
➤ 6ठे CSL का नक्षत्र स्वामी कौन है और वह कहाँ स्थित है?
➤ 6ठे CSL का उप-स्वामी (SL) कौन है और वह कहाँ स्थित है?
➤ 6ठे CSL का उप-उप स्वामी (SSL) कौन है और वह कहाँ स्थित है?

विश्लेषण: यदि जातक नौकरी करता है, तो उसे किस प्रकार की जॉब (जैसे: टेक्निकल, एडमिनिस्ट्रेटिव, सर्विस) करनी चाहिए?

C] व्यापार की प्रकृति (Nature of Business):
➤ 7वें  CSL का नक्षत्र स्वामी कौन है और वह कहाँ स्थित है?

यह सुनिश्चित करे की आप निम्मलिखित आदेशों का पालन सख्ती से करेंगे,

1] आउटपुट देने से पहले डेटा को क्रॉसचेक कर लिया करे.
2] किसी भी तरह की शुगर-कोटिंग (Sugar-coating) न करें। अगर कुंडली में कोई दोष, संघर्ष या नकारात्मक योग है, तो उसे स्पष्ट और कड़वे शब्दों में बताएं। मुझे क्लाइंट को खुश नहीं करना, बल्कि सच बताना है। ध्यान रहे पूरी तरह नकारात्मक नही होना चाहिए, सकारात्मक और नकारात्मक का बैलेंस बनाकर जो सच है वो बताये ।
3] अपने उत्तर की शुरुआत किसी भी अभिवादन या संवादात्मक वाक्यांश (जैसे 'निश्चित रूप से', 'ज़रूर', 'निम्मलिखित है' आदि) से न करें। आपका उत्तर सीधे मांगी गई जानकारी से ही प्रारंभ होना चाहिए।

➢ विश्लेषण : धन संचय और आय का विश्लेषण

8] अष्टम चरण: निष्कर्ष और समाधान

➤  अंत में बताएं कि यह कुंडली 'मजदूर/निम्न श्रेणी' की है या 'उच्च अधिकारी/व्यवसायी' की।
➤  यदि ग्रह पीड़ित हैं, तो करियर की बाधाओं को दूर करने के सटीक ज्योतिषीय उपाय सुझाएं।
------------------------------------------
उपरोक्त कुण्डली और अष्टकवर्ग जानकारी के आधार पर, आपको एक विशेषज्ञ ज्योतिषी की भूमिका निभानी है। आपका कार्य यह विश्लेषण करना है कि जातक के लिए आधुनिक समय के अनुसार कौन सा करियर पथ (Corporate Job, Freelancing/YouTube, Consultancy, या Traditional Business) सबसे अधिक सफल रहेगा। 
(नोट: विश्लेषण से पहले जातक के 'लग्न' की पहचान करें ताकि दशमेश का सही पता चल सके)।

➤ विश्लेषण की प्रक्रिया (Step-by-Step Process):

► 1. सर्वाष्टकवर्ग (SAV) का "गैप-बेस्ड" तुलनात्मक विश्लेषण (Gap-Based Logic):
करियर की सटीक दिशा तय करने के लिए भावों के बीच का अंतर (Gap) देखें:
A] 6ठा (सर्विस/नौकरी) vs 7वां (व्यापार/पार्टनरशिप): देखें कि दोनों में से कौन मजबूत है और उनके बीच अंकों का अंतर (Gap) कितना है। 
B] 10वां (स्थिरता/ब्रांड) vs 3रा (साहस/डिजिटल/मीडिया): देखें कि व्यक्ति को रिस्क लेना सूट करेगा या स्थिरता।
C] 11वां (लाभ): देखें कि लाभ (11वां) का झुकाव 6ठे की तरफ है या 7वें की तरफ।

► 2. सटीक करियर टाइप (Micro-Niche) की पहचान:
नीचे दिए गए नियमों के आधार पर जातक का सटीक प्रोफेशन तय करें:
- स्वतंत्र कार्य / YouTube / फ्रीलांसिंग: यदि 3रा भाव बहुत मजबूत हो (28+) और 6ठा भाव 7वें से मजबूत हो। (व्यक्ति अकेले डिजिटल/मीडिया में काम करेगा)।
- कंसल्टेंसी / एडवाइजरी / सर्विस: यदि 6ठा भाव 7वें से बहुत अधिक मजबूत हो (बड़ा गैप) और 10वां/11वां भाव भी मजबूत हो। (व्यक्ति अपनी सलाह/सर्विस बेचेगा)।
- स्थायी नौकरी / कॉर्पोरेट जॉब: यदि 10वां भाव (स्थिरता) बहुत मजबूत हो (30+) और 6ठा भाव 7वें से ज्यादा हो।
- पारंपरिक व्यापार / पार्टनरशिप: यदि 7वां भाव (28+) स्पष्ट रूप से 6ठे भाव से बहुत अधिक मजबूत हो।

► 3. भिन्नाष्टकवर्ग (BAV) का सहायक विश्लेषण (Supportive Triggers):
A] शनि (नौकरी कारक): शनि का 6ठे और 10वें भाव में स्कोर (4+ शुभ है)।
B] बुध (व्यापार/मीडिया कारक): बुध का 3रे और 7वें भाव में स्कोर (4+ शुभ है)।
C] दशमेश (10th Lord): लग्न के अनुसार दशमेश की पहचान करें और उसका 10वें भाव में स्कोर देखें।
(ध्यान दें: BAV केवल सहायक है, अंतिम निर्णय SAV के गैप (Gap) पर ही निर्भर करेगा)।

► 4. भाव की शुभता (Bhava Shubhta - 28 Bindu Rule):
अष्टकवर्ग के प्रामाणिक नियम के अनुसार, किसी भी भाव में 28 बिंदु औसत (Average) माने जाते हैं।
- 6ठे, 7वें, 10वें और 11वें भाव के अंकों को इस नियम पर तौलें। 
- 28 या उससे अधिक अंक भाव को शुभ और परिणाम देने में आसान बनाते हैं। 28 से कम अंक संघर्ष (कष्ट) दर्शाते हैं। बताएं कि किस क्षेत्र में आसानी है और किसमें संघर्ष।

जातक के निम्नलिखित करियर संबंधित ग्रहों की सूची दीजिए:

A) दशम भाव (कर्म/करियर का केंद्र)

1] दशम भाव का स्वामी (दशमेश)
2] दशम भाव का नक्षत्र स्वामी
3] दशम भाव में बैठे ग्रह
4] दशम भाव पर दृष्टि रखने वाले ग्रह
5] दशमेश जिस राशि में बैठा है उस राशि का स्वामी (Dispositor)
6] दशमेश जिस नक्षत्र में बैठा है उस नक्षत्र का स्वामी
7] दशमेश से युत ग्रह
8] दशमेश पर दृष्टि रखने वाले ग्रह
9] 10वें भाव का कस्पल सब-लॉर्ड (CSL)
9] 10वें भाव का कस्पल सब-लॉर्ड (CSL)
10] 10वें CSL का नक्षत्र स्वामी (NL)
11] 10वें CSL का उप-स्वामी (SL)
12] 10वें CSL का  SSL
13] 10वें भाव के KP सिग्निफिकेंटर

B) दशमेश (करियर का मुख्य प्रबंधक)

1] दशमेश जिस राशि में बैठा है, उसका स्वामी (Dispositor)
2] दशमेश जिस नक्षत्र में बैठा है, उसका स्वामी
3] दशमेश से युति करने वाले ग्रह
4] दशमेश पर दृष्टि रखने वाले ग्रह

C) 6ठा भाव (नौकरी/सेवा)

1] षष्ठम भाव का स्वामी
2] षष्ठम भाव में बैठे ग्रह
3] षष्ठम भाव का नक्षत्र स्वामी
4] 6ठे भाव का सिग्निफिकेटर ग्रह

D) दशमांश कुंडली (D10 - करियर का सूक्ष्म विश्लेषण)

1] D10 का लग्न स्वामी
2] D10 के लग्न में बैठे ग्रह
3] D10 में दशम भाव का स्वामी
4] D10 में दशम भाव का नक्षत्र स्वामी
5] D10 के दशम भाव में बैठे ग्रह
6] D10 में बलवान (उच्च, स्वगृही, वर्गोत्तम) ग्रह

E) नवमांश कुंडली (D9 - करियर के भाग्य का विश्लेषण)

1] D9 में दशम भाव का स्वामी
2] D9 में दशम भाव का नक्षत्र स्वामी
3] D9 के दशम भाव में बैठे ग्रह

F) D60 कुंडली (D60 - पूर्व पूण्य में करियर)

1] D60 में दशम भाव का स्वामी
2] D60 में दशम भाव का नक्षत्र स्वामी
3] D60 के दशम भाव में बैठे ग्रह

G) सहायक भाव (धन,लाभ)

1] एकादश भाव (लाभ/महत्वाकांक्षा) का स्वामी और उसमें बैठे ग्रह
2] द्वितीय भाव (धन/वाणी) का स्वामी और उसमें बैठे ग्रह
3] 2रे भाव के KP सिग्निफिकेंटर
4] 11वें भाव के KP सिग्निफिकेंटर

H) लग्न (करियर में स्वयं की भूमिका)

1] लग्न का स्वामी (लग्नेश)
2] लग्न में बैठे ग्रह
3] लग्नेश और दशमेश के बीच का संबंध (मित्र, शत्रु, युति, दृष्टि)

I) नैसर्गिक कारक (आंतरिक प्रेरणा और मार्ग)

1] कर्म का नैसर्गिक कारक शनि का राशि स्वामी, नक्षत्र स्वामी और युत ग्रह
2] अधिकार और पद का नैसर्गिक कारक सूर्य का राशि स्वामी, नक्षत्र स्वामी और युत ग्रह
3] 5वें भाव से संबंधित ग्रह (बुद्धि और रचनात्मकता के लिए)

J) जैमिनी कारक (आंतरिक शक्ति)

1] जैमिनी अमात्यकारक (AmK - करियर का मुख्य सलाहकार)
2] जैमिनी आत्मकारक (AK - आत्मा का उद्देश्य)
3] कारकांश लग्न से दशम भाव का स्वामी और दशम भाव में बैठे ग्रह
4] स्वांश लग्न से दशम भाव का स्वामी और दशम भाव में बैठे ग्रह
5] कर्म आरूढ़ (A10) का स्वामी और A10 में बैठे ग्रह
6] आरूढ़ लग्न (AL/A1) से दशम भाव का स्वामी और दशम भाव में बैठे ग्रह

K) भृगु नंदी नाड़ी (BNN - कर्म का प्रवाह)

1] शनि (कर्म कारक) से युति करने वाले ग्रह (विशेषकर गुरु)।
2] शनि से दूसरे भाव में स्थित ग्रह (कर्म से प्राप्त होने वाला धन/अधिकार)।
3] शनि से तीसरे भाव में स्थित ग्रह (कर्म के लिए किया गया पराक्रम और संचार)।
4] शनि से त्रिकोण (5वें और 9वें भाव) में स्थित ग्रह (कर्म में भाग्य और बुद्धि का साथ)।
5] शनि की दृष्टि (3, 7, 10) जिन ग्रहों पर पड़ रही है, वे ग्रह।

L) संबंध जांच (Connection Check)

a) क्या लग्नेश का 10वें, 2रे, 6ठे या 11वें भाव/भावेश से मजबूत संबंध बन रहा है?
b) क्या नैसर्गिक कारक शनि और सूर्य का 10वें, 2रे, 6ठे या 11वें भाव/भावेश से मजबूत संबंध बन रहा है?
c) क्या दशमेश का 2रे, 6ठे या 11वें भाव/भावेश से मजबूत संबंध बन रहा है?

------------------------------------------
1] अब पहले निकाले गए सभी ग्रहों को सूचीबद्ध कीजिये।
(इस सूची में जो ग्रह बार-बार आ रहे हैं, वे विशेष रूप से महत्वपूर्ण हैं।)

2] अब सूचीबद्ध ग्रहों की D1 शक्ति का आकलन कीजिये।
(इन ग्रहों का अस्त,वक्री,नीच-नीचभंग, वर्गोत्तम, शत्रु-मित्र-सम राशी, चलित स्थिति, D9 स्थिति, PN-PB-MB स्थिति, SAV-BAV,षड्बल सहित)

3] अब सभी ग्रहों के संयुक्त प्रभाव का वर्णन कीजिये।
(जो ग्रह D1 में भी  मजबूत और बलवान है , वे विशेष रूप से महत्वपूर्ण हैं। और करियर के रूप में अपना अच्छा फल दे सकते हैं।)

4] अब सभी ग्रहों के संयुक्त प्रभाव को जांच कर, उन्हें करियर को प्रभावित करने के क्रम में लगाइए:

Group A - मुख्य प्रभावशाली ग्रह (Core Career Planets):
ये वे ग्रह हैं जो करियर की नींव, दिशा और मुख्य विषय को परिभाषित करते हैं। जातक का पूरा करियर इन्हीं ग्रहों के इर्द-गिर्द घूमेगा। ज
(उदाहरण: दशमेश, अमात्यकारक (AmK), 10वें भाव में बैठा कोई बलवान ग्रह, शनि से युति करने वाला ग्रह (BNN), 10वें CSL का नक्षत्र स्वामी, D10 का लग्नेश)।

Group B - मध्यम प्रभावशाली ग्रह (Supporting Planets):
ये ग्रह मुख्य ग्रहों की सहायता करते हैं, करियर में कौशल, अवसर और संसाधन जोड़ते हैं। ये करियर के माहौल और परिणामों को प्रभावित करते हैं।
(उदाहरण: लग्नेश, आत्मकारक (AK), 2रे/6ठे/11वें भाव के स्वामी, नैसर्गिक कारक सूर्य/गुरु, शनि से दूसरे/त्रिकोण में स्थित ग्रह (BNN), दशमेश पर दृष्टि डालने वाले ग्रह)।

Group C - सहायक और उत्प्रेरक ग्रह (Trigger/Situational Planets):
ये ग्रह विशेष परिस्थितियों में या अपनी दशा-अंतर्दशा में करियर को प्रभावित करते हैं। ये करियर में मोड़ या विशेष घटनाओं के कारक बन सकते हैं।
(उदाहरण: दशमेश का Dispositor, नक्षत्र स्वामी, D10 में अन्य महत्वपूर्ण ग्रह, 5वें भाव का स्वामी, शनि से 3रे/12वें भाव में स्थित ग्रह (BNN))।
------------------------------------------
आपको प्रदान की गई ग्रहों (Group A/B/C) की सूची और एक बाहरी ज्ञान स्रोत (Career_Fields.txt नामक फाइल) का उपयोग करके कुंडली से निकाले गए करियर के मुख्य प्रभावशाली ग्रहों का विश्लेषण करना है। जातक के लिए सबसे उपयुक्त करियर क्षेत्रों की एक विस्तृत, प्राथमिकता-आधारित (Prioritized) सूची बनानी है। आपका अंतिम लक्ष्य केवल सामान्य क्षेत्र बताना नहीं, बल्कि Career_Fields.txt से विशिष्ट और उपयुक्त नौकरी/व्यवसाय के नाम सुझाना है। आपका उत्तर केवल क्षेत्रों की सूची नहीं होना चाहिए, बल्कि यह समझाना चाहिए कि ग्रहों का संयुक्त प्रभाव उन क्षेत्रों की ओर क्यों इशारा करता है। उस फाइल में प्रत्येक ग्रह से जुड़े कार्यक्षेत्रों की एक विस्तृत सूची है। आपको अपनी सामान्य जानकारी का भी उपयोग करना है। और उपरोक्त में हुयी चर्चा विश्लेषण का भी उपयोग करना है।   (विश्लेषण में 'TXT फाइल' का उल्लेख ना करें, यह सिर्फ सन्दर्भ के लिए है)

विश्लेषण की प्रक्रिया (Step-by-Step Analysis Process):

कीवर्ड निकालना: सबसे पहले, Career_Fields.txt फाइल  और अपने ज्ञान का उपयोग करके Group A और Group B के सभी ग्रहों के मूल स्वभाव और मुख्य कारकत्व (Keywords) को पहचानें। (जैसे: गुरु = ज्ञान, सलाह; शनि = संरचना, कानून; मंगल = एक्शन, प्रबंधन)।

हाइब्रिड प्रोफाइल बनाना: अलग-अलग ग्रहों के क्षेत्रों को सूचीबद्ध करने के बजाय, उनके कीवर्ड्स को मिलाकर एक संयुक्त करियर प्रोफाइल बनाएं। आपको यह सोचना है कि इन ग्रहों की ऊर्जाएं मिलकर किस तरह के पेशेवर का निर्माण करती हैं।

(उदाहरण: गुरु (ज्ञान) + शनि (संरचना) + मंगल (एक्शन) का संयोजन एक ऐसे व्यक्ति को दर्शाता है जो किसी बड़े संगठन (शनि) में अपनी विशेषज्ञता (गुरु) का उपयोग करते हुए एक प्रबंधकीय या नेतृत्व (मंगल) की भूमिका निभाता है।)

विशिष्ट करियर मैपिंग (सबसे महत्वपूर्ण चरण): अब, आपके द्वारा बनाए गए हाइब्रिड प्रोफाइल के आधार पर, Career_Fields.txt फाइल को ध्यान से स्कैन करें। उन विशिष्ट करियर नामों, पदों या व्यवसायों की एक सूची बनाएं जो इस प्रोफाइल से सबसे अधिक मेल खाते हैं। आपको इन नामों को अपने अंतिम उत्तर में शामिल करना अनिवार्य है।

विश्लेषण को परिष्कृत करना: बनाए गए हाइब्रिड प्रोफाइल को उपरोक्त चैट में चर्चा के आधार पर उनकी शक्ति, क्षमता, बल समझकर और सटीक बनाएं।

प्राथमिकता देना: इस गहन विश्लेषण के आधार पर, 3-4 सबसे शक्तिशाली करियर पथों की पहचान करें और उन्हें नीचे दिए गए प्रारूप के अनुसार तीन श्रेणियों (Tiers) में विभाजित करें।

आउटपुट का प्रारूप (Required Output Format):
आपको अपना अंतिम उत्तर निम्नलिखित "श्रेणी प्रणाली" (Tier System) में ही देना है:

आपके लिए शीर्ष करियर पथ: प्राथमिकता और विश्लेषण :

➤ श्रेणी 1: सर्वश्रेष्ठ और सर्वोच्च प्राथमिकता वाले क्षेत्र (Tier 1: Best and Highest Priority Fields)

(यह वह 1 या 2 क्षेत्र हैं जो आपकी कुंडली के लगभग सभी मुख्य ग्रहों की ऊर्जा से मेल खाते हैं और सफलता की सर्वाधिक संभावना रखते हैं।)

► करियर पथ 1: [करियर क्षेत्र का नाम, जैसे: कॉर्पोरेट मैनेजमेंट / स्ट्रैटेजी और प्रशासन]

➧ इस क्षेत्र में विशिष्ट पद (Career_Fields.txt के अनुसार): [यहाँ फाइल से 2-4 विशिष्ट नाम लिखें, जैसे: 'सीईओ (CEO)', 'मैनेजिंग डायरेक्टर (MD)', 'उच्च प्रशासनिक अधिकारी (IAS)', 'विभाग प्रमुख']

➧ सफलता की संभावना: [एक प्रतिशत दें, जैसे: 90%]

➧ ज्योतिषीय कारण (क्यों?): यहाँ विस्तार से समझाएं कि Group A और B के ग्रहों का संयुक्त प्रभाव इस करियर पथ का समर्थन कैसे करता है। ग्रहों के संयोजन की कहानी बताएं।

➧ निष्कर्ष: एक या दो वाक्यों में बताएं कि यह क्षेत्र आपके लिए सर्वश्रेष्ठ क्यों है।

➤ श्रेणी 2: मजबूत और द्वितीयक प्राथमिकता वाले क्षेत्र (Tier 2: Strong and Secondary Priority Fields)

(यह वे क्षेत्र हैं जो बहुत मजबूत हैं, लेकिन शायद श्रेणी 1 जितने व्यापक नहीं हैं या किसी विशेष ग्रह संयोजन पर अधिक आधारित हैं।)

► करियर पथ 2: [करियर क्षेत्र का नाम, जैसे: कॉर्पोरेट कानून (Corporate Law)/ कानून और न्याय]

➧ इस क्षेत्र में विशिष्ट पद (Career_Fields.txt के अनुसार): [यहाँ फाइल से 2-4 विशिष्ट नाम लिखें, जैसे: 'न्यायाधीश', 'कॉर्पोरेट वकील', 'सरकारी वकील']

➧ सफलता की संभावना: [एक प्रतिशत दें, जैसे: 75%]

➧ ज्योतिषीय कारण (क्यों?): समझाएं कि कौन से ग्रह इस क्षेत्र का समर्थन करते हैं और यह श्रेणी 1 से थोड़ा अलग क्यों है।

➧ निष्कर्ष: एक या दो वाक्यों में बताएं कि यह एक मजबूत द्वितीयक विकल्प क्यों है।

➤ श्रेणी 3: विचारणीय या वैकल्पिक क्षेत्र (Tier 3: Considerable or Alternative Fields)

(यह वे क्षेत्र हैं जिनमें क्षमता तो है, लेकिन कुछ सावधानियों की आवश्यकता हो सकती है या वे आपकी मुख्य ऊर्जा से थोड़ा हटकर हैं।)

► करियर पथ 3: [करियर क्षेत्र का नाम, जैसे: स्वतंत्र कंसल्टेंसी/शिक्षा और परामर्श]

➧ इस क्षेत्र में विशिष्ट पद (Career_Fields.txt के अनुसार): [यहाँ फाइल से 2-4 विशिष्ट नाम लिखें, जैसे: 'प्रोफेसर', 'सलाहकार (Consultant)', 'मोटिवेशनल स्पीकर']

➧ सफलता की संभावना: [एक प्रतिशत दें, जैसे: 40% (सावधानियों के साथ)]

➧ ज्योतिषीय कारण (क्यों?): इस क्षेत्र के सकारात्मक और नकारात्मक दोनों ज्योतिषीय पहलुओं को समझाएं। बताएं कि किन शर्तों के तहत इसमें सफलता मिल सकती है।

➧ निष्कर्ष: एक या दो वाक्यों में बताएं कि इसे वैकल्पिक क्यों माना जाना चाहिए।

➢ अंतिम निर्देश: आपका लक्ष्य जातक को स्पष्टता देना है। सिर्फ विकल्प न दें, बल्कि एक विशेषज्ञ की तरह मार्गदर्शन करें कि उनके लिए सबसे अच्छा क्या है और क्यों, और यह भी बताएं कि उस क्षेत्र में कौन से विशिष्ट पद उनकी कुंडली के अनुसार सबसे उपयुक्त हैं।
------------------------------------------
उपरोक्त जानकारी में दिए गए मुख्य ग्रहों के संयुक्त प्रभाव और संलग्न Career_Fields.txt फाइल के आधार पर, जातक के लिए 10 सबसे उपयुक्त नौकरी और व्यवसाय के नामों की एक सूची बनाएं। (विश्लेषण में 'TXT फाइल' का उल्लेख ना करें, यह सिर्फ सन्दर्भ के लिए है)
------------------------------------------
मारक पहचान: क्या यह ग्रह द्वितीयेश (2nd lord) या सप्तमेश (7th lord) होकर मारकेश की भूमिका में है? यदि हाँ, तो कौन सी - द्वितीयेश (सामान्य मारक) या सप्तमेश (प्रबल मारक)?

बाधक पहचान: क्या यह ग्रह लग्न के स्वभाव (चर, स्थिर, द्विस्वभाव) के अनुसार बाधक भाव (11वें, 9वें, या 7वें) का स्वामी है?

दोहरी भूमिका: क्या यह ग्रह मारक और बाधक दोनों की भूमिका निभा रहा है? (विशेषकर द्विस्वभाव लग्न के लिए सप्तमेश के रूप में)।

कार्यात्मक शुभता: इसके विपरीत, क्या यह ग्रह केंद्र/त्रिकोण का स्वामी होकर एक शुभ 'योगकारक' ग्रह है? या केवल एक त्रिकोण का स्वामी होकर अत्यंत शुभ है?

2. नकारात्मकता/सकारात्मकता की तीव्रता का आकलन (Assessing the Intensity):

पापी ग्रहों का प्रभाव: क्या इस ग्रह पर नैसर्गिक पाप ग्रहों (शनि, मंगल, राहु, केतु) की दृष्टि है या वह उनके साथ युति में है? यदि हाँ, तो यह उसकी नकारात्मकता को कैसे बढ़ा रहा है?

शुभ ग्रहों का प्रभाव: क्या इस ग्रह पर नैसर्गिक शुभ ग्रहों (गुरु, शुक्र, शुभ बुध) की दृष्टि है या वह उनके साथ है? क्या इससे मारक/बाधक प्रभाव में कोई कमी या सुरक्षा (Mitigation) मिल रही है?

भाव स्थिति: यह ग्रह कुंडली के किस भाव में स्थित है? क्या यह त्रिक भावों (6, 8, 12) में बैठकर और अधिक अशुभ हो गया है, या केंद्र/त्रिकोण में बैठकर इसकी स्थिति कुछ बेहतर है?

राशि बल: क्या यह ग्रह अपनी नीच राशि में होकर अत्यंत पीड़ित है या अपनी उच्च/स्वयं की राशि में होकर इसकी नकारात्मकता में कमी आ रही है? अथवा अधिक शक्तिशाली और प्रभावी हो गई है?

3. सक्रियकरण और संभावित फल (Activation and Potential Results):

दशा सक्रियकरण: इस ग्रह की महादशा या अंतर्दशा में किस प्रकार के कष्ट, बाधाएं या परेशानियां (स्वास्थ्य, संबंध, करियर आदि में) देखने को मिल सकती हैं?

गोचर का प्रभाव: जब शनि या राहु जैसे बड़े ग्रह गोचर में इस मारक/बाधक ग्रह के ऊपर से गुजरते हैं, तो क्या यह इसके नकारात्मक फलों को सक्रिय कर सकते हैं?
प्रभावित क्षेत्र: यह ग्रह अपने नैसर्गिक कारकत्व (जैसे शुक्र - संबंध/वाहन, शनि - करियर/रोग) और अपने भाव स्वामित्व के आधार पर जीवन के किन विशिष्ट क्षेत्रों को सबसे अधिक प्रभावित करेगा?

4. समग्र निष्कर्ष (Overall Conclusion):
अंतिम मूल्यांकन: उपरोक्त सभी बिंदुओं का विश्लेषण करने के बाद, इस ग्रह को एक कार्यात्मक अशुभ ग्रह के रूप में 1 से 10 के पैमाने पर कितनी रेटिंग देंगे? (जहाँ 1 बहुत हल्का और 10 अत्यंत हानिकारक हो)।

5: परामर्श और उपाय (Counseling and Remedies)
(यह खंड इस बात पर केंद्रित है कि "चुनौती" (Step 1-4 में पहचानी गई) का प्रबंधन कैसे किया जाए।)

5.1. ज्योतिषीय शांति उपाय (Astrological Pacification):

मंत्र/जाप: क्या इस ग्रह (या इसके अधिपति देवता) के बीज मंत्र या वैदिक मंत्र का जाप शांति के लिए आवश्यक है?

स्तोत्र: क्या दशा-अंतर्दशा के दौरान किसी विशिष्ट स्तोत्र (जैसे, शनि के लिए 'शनि महात्म्य' या बुध के लिए 'विष्णु सहस्रनाम') का पाठ करना सुरक्षात्मक होगा?

दान: इस ग्रह के नकारात्मक प्रभाव को शांत करने के लिए किन वस्तुओं का दान (रंग, अनाज, धातु) और कब (किस दिन) करना चाहिए?

5.2. रत्न और धारण (Gems and Wearing) - [सबसे महत्वपूर्ण सावधानी]:

रत्न निषेध: क्या यह ग्रह (मारक/बाधक होने के कारण) उन ग्रहों में से है जिनका रत्न किसी भी हालत में धारण नहीं करना चाहिए? (स्पष्ट रूप से लिखें: क्योंकि एक बलवान मारकेश का रत्न पहनना "शक्तिशाली शत्रु को और शक्ति देना" है।)

वैकल्पिक धारण: क्या इस ग्रह को शांत करने के बजाय, कुंडली के 'रक्षक' ग्रह (जैसे लग्नेश या नवमेश) का रत्न पहनना बेहतर उपाय होगा?

5.3. व्यवहारगत उपाय (Behavioral Remedies / The Counseling):

चेतना (Awareness): जातक को इस ग्रह के नकारात्मक स्वभाव के बारे में कैसे सचेत रहना है? (जैसे: "आपकी वाणी (बुध) ही आपका मारकेश है, इसलिए बोलने से पहले सोचने का अभ्यास करें।")

परिवर्तन (Modification): जातक को अपनी किन आदतों को बदलना होगा? (जैसे: "आपका गुरु (बाधकेश) आपको 'आदर्शवादी' बनाकर 'बाधा' दे रहा है। आपका उपाय है कि आप दूसरों से 'परफेक्शन' की उम्मीद करना कम करें और लचीले बनें।")

5.4. आध्यात्मिक/कार्मिक उपाय (Spiritual/Karmic Remedies):

कर्म का पाठ (Karmic Lesson): यह ग्रह जीवन में क्या 'कार्मिक सबक' सिखाने आया है? (जैसे: 'वैराग्य' या 'अलगाव' का सबक)।

ऊर्जा का रूपांतरण (Energy Channeling): क्या जातक इस ग्रह की नकारात्मक ऊर्जा को एक उच्च उद्देश्य के लिए उपयोग कर सकता है? (जैसे: 'मारक' शनि की ऊर्जा को 'अध्यात्म' या 'अस्पताल सेवा' में लगाना)।

        // सेपरेटर लॉजिक: --- या ___ लाइन्स से अलग करना
        const separatorRegex = /\n-{10,}\n|\n_{10,}\n/g;
        
        function processData() {
            const container = document.getElementById('prompt-container');
            // पहले डैश लाइन्स से तोडें
            let parts = rawData.split(separatorRegex);

            parts.forEach((part, index) => {
                let cleanText = part.trim();
                
                // फिल्टरिंग लॉजिक
                const lines = cleanText.split('\n');
                const filteredLines = lines.filter(line => {
                    const l = line.trim();
                    // जंक (MMM... RRR... PPPP...) हटाएं
                    if (l.match(/^[M|P|C|H|R]{5,}$/)) return false;
                    // सिर्फ डैश वाली लाइन हटाएं
                    if (l.match(/^-{5,}$/)) return false;
                    return true;
                });
                
                cleanText = filteredLines.join('\n').trim();

                if (cleanText.length > 5) { // खाली या बहुत छोटी स्ट्रिंग न दिखाएं
                    createCard(cleanText, index + 1);
                }
            });
        }

        function createCard(text, id) {
            const container = document.getElementById('prompt-container');
            
            const card = document.createElement('div');
            card.className = 'card';

            const header = document.createElement('div');
            header.className = 'card-header';
            header.innerHTML = `<span>Prompt #${id}</span>`;

            const content = document.createElement('div');
            content.className = 'card-content';
            content.innerText = text;

            const btn = document.createElement('button');
            btn.className = 'btn';
            btn.innerText = 'Copy Prompt';
            btn.onclick = () => copyText(text);

            card.appendChild(header);
            card.appendChild(content);
            card.appendChild(btn);
            container.appendChild(card);
        }

        function copyText(text) {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(() => {
                    showToast();
                }).catch(err => {
                    fallbackCopy(text);
                });
            } else {
                fallbackCopy(text);
            }
        }

        function fallbackCopy(text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed'; // Avoid scrolling to bottom
            document.body.appendChild(textarea);
            textarea.focus();
            textarea.select();
            try {
                document.execCommand('copy');
                showToast();
            } catch (err) {
                console.error('Fallback: Oops, unable to copy', err);
            }
            document.body.removeChild(textarea);
        }

        function showToast() {
            var x = document.getElementById("snackbar");
            x.className = "toast show";
            setTimeout(function(){ x.className = x.className.replace("show", ""); }, 3000);
        }

        // Initialize
        processData();

    </script>
