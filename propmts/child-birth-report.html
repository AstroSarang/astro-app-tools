3] गोचर विश्लेषण :
➤ सभी संभावित दशा अवधि में गुरु और शनि का संयुक्त प्रभाव: 

उपरोक्त कुंडली डेटा और गोचर विवरणों के आधार पर, अगले 7 वर्षों के लिए गुरु (बृहस्पति) और शनि के संयुक्त प्रभाव (Double Transit) की एक विस्तृत तालिका तैयार करें। यह विश्लेषण पूरी तरह से ग्रहों की दृष्टि और स्थिति (Transit Aspects/Positions) पर आधारित होना चाहिए।

तालिका का प्रारूप और कॉलम:
| समय (अवधि) | गुरु का गोचर प्रभाव (D1+D9+D7) | शनि का गोचर प्रभाव (D1+D9+D7) | संयुक्त प्रभाव (Double Transit) | संतान प्राप्ति की संभावना का अंतिम निष्कर्ष |

जाँच के लिए मुख्य चेकलिस्ट निर्देश:
प्रत्येक गोचर अवधि के लिए, निम्नलिखित बिंदुओं पर गुरु और शनि के प्रभाव (दृष्टि या युति) की सूक्ष्मता से जाँच करें:

1] गोचर के गुरु (Jupiter) के लिए:
- जन्म कुंडली (D1): पंचम भाव/पंचमेश, लग्न/लग्नेश, लाभ भाव/लाभेश, परिवार भाव/द्वितीयेश।
- कारक: जन्म गुरु।
- नवांश (D9): नवांश लग्न और नवांश पंचम भाव।
- सप्तमांश (D7): D7 का लग्न/लग्नेश और D7 का पंचम भाव/पंचमेश।

2] गोचर के शनि (Saturn) के लिए:
- जन्म कुंडली (D1): पंचम भाव/पंचमेश, लग्न/लग्नेश, लाभ भाव/लाभेश, परिवार भाव/द्वितीयेश।
- कारक: जन्म गुरु।
- नवांश (D9): नवांश लग्न और नवांश पंचम भाव।
- सप्तमांश (D7): D7 का लग्न/लग्नेश और D7 का पंचम भाव/पंचमेश।

तालिका के नियम:
- प्रभाव कॉलम: केवल उन प्रभावित बिंदुओं के नाम लिखें जिनका संबंध बन रहा है (जैसे: 'पंचम भाव और जन्म गुरु पर दृष्टि')।
- संयुक्त प्रभाव: यदि गुरु और शनि दोनों एक साथ किन्हीं संतान कारकों (विशेषकर D7/D9 लग्न या 5वें भाव) को प्रभावित कर रहे हैं, तो 'सक्रिय (Double Transit Active)' लिखें।
- निष्कर्ष: प्रभाव की तीव्रता और दोहरे गोचर की सक्रियता के आधार पर 'प्रबल', 'औसत' या 'न्यून' लिखें।

➤ क्या गोचर के गुरु और शनि, दोनों एक साथ प्रभावित (दृष्टि या युति द्वारा) कर रहे हैं, ऐसी अवधि है?

विश्लेषण (गोचर): दशा द्वारा पहचानी गई "समय सीमा" के भीतर, दोहरे गोचर का नियम उस विशिष्ट वर्ष को इंगित करता है जब संतान प्राप्ति की घटना घटित होने की सबसे अधिक संभावना है।

उपरोक्त फाइलों और उपलब्ध डेटा के आधार पर, जातक के लिए अगले 7 वर्षों के गुरु (बृहस्पति) के गोचर की एक विस्तृत 'संतान प्राप्ति केंद्रित शक्ति तालिका' तैयार करें।
​तालिका का प्रारूप और कॉलम (अनिवार्य):
| गोचर भाव (L/M) | समय (अवधि) | SAV | BAV | BAL | गुणवत्ता | संतान प्राप्ति पर प्रभाव | संतान के सहायक भावों पर प्रभाव | संतान प्राप्ति की संभावना का अंतिम निष्कर्ष |
​डेटा प्रोसेसिंग के सख्त नियम:
​शक्ति डेटा (SAV/BAV/BAL): इन मानों को कुंडली के अष्टकवर्ग (Sarva/Bhinna) और भाव-बल (Bhava Bala) खंड से निकालें।
​संतान प्राप्ति पर प्रभाव: गुरु का गोचर में 5वें भाव, पंचमेश या जन्म गुरु, या जन्म गुरु से दृष्टि/स्थिति संबंध जाँचे।
​सहायक भावों पर प्रभाव: गुरु का 11वें, 2रे, 9वें भाव या जैमिनी पुत्रकारक से दृष्टि/स्थिति संबंध जाँचे।
​गुणवत्ता (Quality) लॉजिक: SAV > 28 और BAL > 500 होने पर 'High', केवल SAV > 28 होने पर 'Medium', अन्यथा 'Low' लिखें।
​अंतिम निष्कर्ष: यदि 'संतान प्राप्ति पर प्रभाव' सक्रिय है और 'गुणवत्ता' High/Medium है, तो 'प्रबल संभावना' लिखें। यदि दोनों कम हैं, तो 'न्यून' लिखें।

अंतिम समग्र विश्लेषण (पराशरी):
एक ऐसा समय जब:
➤ विंशोत्तरी दशा (MD-AD-PD) अनुकूल हो।
➤ योगिनी दशा (MD-AD-PD) अनुकूल हो।
➤ त्रिभागी दशा (MD-AD-PD) अनुकूल हो।

भाग 2: जैमिनी ज्योतिष के अनुसार संतान प्राप्ति के समय का विश्लेषण:

1] चर महादशा द्वारा समय निर्धारण: 

➤  क्या वर्तमान में ऐसी राशि की चर दशा चल रही है जो मुख्य या सहायक राशि की हो में से एक हो?

2] चर अंतर्दशा द्वारा समय निर्धारण:

➤  संभावित चर महादशा में ऐसी राशि की अंतर्दशाएँ जो मुख्य या सहायक राशि की हो में से एक हो? 

3] चर प्रत्यंतर दशा द्वारा समय निर्धारण:

➤  संभावित चर अंतर्दशा में ऐसी राशि की प्रत्यंतर दशाएँ जो मुख्य या सहायक राशि की हो में से एक हो? 

विश्लेषण (दशा): उपरोक्त राशियों की दशा-अंतर्दशा-प्रत्यंतर संतान प्राप्ति के लिए सबसे प्रबल समय होती है। जिस अवधि में इनमें से एक से अधिक शर्तें पूरी होती हैं, वह समय सबसे महत्वपूर्ण है।
-----------------------------------------
2] दशा की गुणवत्ता का अर्गला से विश्लेषण (घटना कैसी होगी?):
➤ दशा राशि पर अर्गला: संतान प्राप्ति के लिए चुनी गई संभावित दशा राशि पर किन ग्रहों की अर्गला (हस्तक्षेप) है?
▸ शुभ अर्गला: क्या उस पर शुभ ग्रहों (गुरु, शुक्र) की अर्गला है? यह एक सहज, आनंदमय और बिना बाधा के संतान प्राप्ति समारोह का संकेत है।
▸ पाप अर्गला: क्या उस पर पाप ग्रहों (शनि, राहु, मंगल) की अर्गला है? यह संतान प्राप्ति के समय कुछ बाधा, विवाद, खर्च या कष्ट का संकेत दे सकती है।
➤ विरोध अर्गला: क्या अर्गला बनाने वाले ग्रहों का कोई विरोध हो रहा है? कौन सी शक्ति (अर्गला या विरोध) अधिक बलवान है?

विश्लेषण (अर्गला): यह निर्धारित करता है कि संतान प्राप्ति की घटना स्वयं कैसी होगी - सुगम और उत्सवपूर्ण या तनावपूर्ण और बाधाओं से भरी।

विश्लेषण: गोचर के आधार पर संतान के जन्म के संभावित वर्षों का निर्धारण।

1] संतान प्राप्ति का समय - दशा विश्लेषण (संभावित टाइम विंडो की पुष्टि (Timing of Conception/Birth):
➤ दशा स्वामियों का चयन: क्या निकाली गयी सभी संभावित टाइम विंडो (Potential Time Windows) में विंशोत्तरी महादशा (MD), अंतर्दशा (AD), और प्रत्यंतर दशा (PD) के स्वामी ग्रह संतान प्राप्ति के लिए "सक्षम" (Capable) हैं?
➤ सिग्निफिकेशन की जांच: क्या ये दशा स्वामी ग्रह अपनी स्थिति, नक्षत्र स्वामी या उप-स्वामी के माध्यम से संतान के प्रमुख भावों (2, 5, 11) के प्रबल सिग्निफिकेटर बन रहे हैं?
➤ नकारात्मक भावों की सावधानी: क्या इन टाइम विंडोज में दशा स्वामी कहीं बाधक भावों (1, 4, 10) को तो अधिक बल नहीं दे रहे? (यदि 1, 4, 10 प्रबल हैं, तो गर्भधारण में देरी या चिकित्सा सहायता की आवश्यकता हो सकती है)।

विश्लेषण: संतान के जन्म की संभावित समय-सीमा का सटीक निर्धारण।

विश्लेषण: गोचर के माध्यम से संतान प्राप्ति के संभावित महीनों और दिनों की पुष्टि।

➤ संभावित समय: संतान प्राप्ति के लिए सबसे संभावित वर्ष कौन से हैं?।

कार्यात्मक शुभता: इसके विपरीत, क्या यह ग्रह केंद्र/त्रिकोण का स्वामी होकर एक शुभ 'योगकारक' ग्रह है? या केवल एक त्रिकोण का स्वामी होकर अत्यंत शुभ है?

शुभ ग्रहों का प्रभाव: क्या इस ग्रह पर नैसर्गिक शुभ ग्रहों (गुरु, शुक्र, शुभ बुध) की दृष्टि है या वह उनके साथ है? क्या इससे मारक/बाधक प्रभाव में कोई कमी या सुरक्षा (Mitigation) मिल रही है?

भाव स्थिति: यह ग्रह कुंडली के किस भाव में स्थित है? क्या यह त्रिक भावों (6, 8, 12) में बैठकर और अधिक अशुभ हो गया है, या केंद्र/त्रिकोण में बैठकर इसकी स्थिति कुछ बेहतर है?

राशि बल: क्या यह ग्रह अपनी नीच राशि में होकर अत्यंत पीड़ित है या अपनी उच्च/स्वयं की राशि में होकर इसकी नकारात्मकता में कमी आ रही है? अथवा अधिक शक्तिशाली और प्रभावी हो गई है?

5: परामर्श और उपाय (Counseling and Remedies)
(यह खंड इस बात पर केंद्रित है कि "चुनौती" (Step 1-4 में पहचानी गई) का प्रबंधन कैसे किया जाए।)

5.1. ज्योतिषीय शांति उपाय (Astrological Pacification):

मंत्र/जाप: क्या इस ग्रह (या इसके अधिपति देवता) के बीज मंत्र या वैदिक मंत्र का जाप शांति के लिए आवश्यक है?

स्तोत्र: क्या दशा-अंतर्दशा के दौरान किसी विशिष्ट स्तोत्र (जैसे, शनि के लिए 'शनि महात्म्य' या बुध के लिए 'विष्णु सहस्रनाम') का पाठ करना सुरक्षात्मक होगा?

दान: इस ग्रह के नकारात्मक प्रभाव को शांत करने के लिए किन वस्तुओं का दान (रंग, अनाज, धातु) और कब (किस दिन) करना चाहिए?

5.2. रत्न और धारण (Gems and Wearing) - [सबसे महत्वपूर्ण सावधानी]:

रत्न निषेध: क्या यह ग्रह (मारक/बाधक होने के कारण) उन ग्रहों में से है जिनका रत्न किसी भी हालत में धारण नहीं करना चाहिए? (स्पष्ट रूप से लिखें: क्योंकि एक बलवान मारकेश का रत्न पहनना "शक्तिशाली शत्रु को और शक्ति देना" है।)

        // सेपरेटर लॉजिक: --- या ___ लाइन्स से अलग करना
        const separatorRegex = /\n-{10,}\n|\n_{10,}\n/g;
        
        function processData() {
            const container = document.getElementById('prompt-container');
            // पहले डैश लाइन्स से तोडें
            let parts = rawData.split(separatorRegex);

            parts.forEach((part, index) => {
                let cleanText = part.trim();
                
                // फिल्टरिंग लॉजिक
                const lines = cleanText.split('\n');
                const filteredLines = lines.filter(line => {
                    const l = line.trim();
                    // जंक (MMM... RRR... PPPP...) हटाएं
                    if (l.match(/^[M|P|C|H|R]{5,}$/)) return false;
                    // सिर्फ डैश वाली लाइन हटाएं
                    if (l.match(/^-{5,}$/)) return false;
                    return true;
                });
                
                cleanText = filteredLines.join('\n').trim();

                if (cleanText.length > 5) { // खाली या बहुत छोटी स्ट्रिंग न दिखाएं
                    createCard(cleanText, index + 1);
                }
            });
        }

        function createCard(text, id) {
            const container = document.getElementById('prompt-container');
            const card = document.createElement('div');
            card.className = 'card';

            const header = document.createElement('div');
            header.className = 'card-header';
            header.innerHTML = `<span>Prompt #${id}</span>`;

            const content = document.createElement('div');
            content.className = 'card-content';
            content.innerText = text;

            const btn = document.createElement('button');
            btn.className = 'btn';
            btn.innerText = 'Copy Prompt';
            btn.onclick = () => copyText(text);

            card.appendChild(header);
            card.appendChild(content);
            card.appendChild(btn);
            container.appendChild(card);
        }

        function copyText(text) {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(() => {
                    showToast();
                }).catch(err => {
                    fallbackCopy(text);
                });
            } else {
                fallbackCopy(text);
            }
        }

        function fallbackCopy(text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed'; // Avoid scrolling to bottom
            document.body.appendChild(textarea);
            textarea.focus();
            textarea.select();
            try {
                document.execCommand('copy');
                showToast();
            } catch (err) {
                console.error('Fallback: Oops, unable to copy', err);
            }
            document.body.removeChild(textarea);
        }

        function showToast() {
            var x = document.getElementById("snackbar");
            x.className = "toast show";
            setTimeout(function(){ x.className = x.className.replace("show", ""); }, 3000);
        }

        // Initialize
        processData();

    </script>
</body>
