----------
➤ PN, PB, MB का जीवन पर प्रभाव (Impact on Life)

विषय: वैदिक ज्योतिष - ग्रह एवं भावों के लिए पुष्कर नवांश (PN), पुष्कर भाग (PB) और मृत्यु भाग (MB) की गणना एवं फलादेश।

छवि और TXT गणनाओं के आधार पर निम्नलिखित क्षेत्रों पर प्रभाव लिखें:

​▸ दैवीय सुरक्षा (Divine Protection): कौन से भाव/ग्रह पुष्कर ऊर्जा से सुरक्षित हैं और जीवन के किन क्षेत्रों में 'बिना मांगे' मदद मिलेगी?

​▸ संघर्ष एवं बाधाएं (MB Impact): मृत्यु भाग वाले ग्रह जीवन के किन क्षेत्रों में 'लैंडमाइन' की तरह बाधा पैदा कर सकते हैं?

​▸ शुरुआत बनाम परिणाम (Start vs Middle): भाव 'प्रारंभ' और 'मध्य' के पुष्कर अंतर के आधार पर बताएं कि कार्य की शुरुआत कैसी होगी और उसका अंत कैसा होगा?

▸ PN और PB की गणना में देखें कि क्या उनका 'भावेश' MB में है ?
(यदि भाव का स्वामी (Bhavesh) मृत्यु भाग में है, तो भाव के पुष्कर होने पर भी फल बाधित होगा)

​▸ दशा फल: वर्तमान या आगामी महादशा में इन अमृत/विष बिंदुओं का क्या प्रभाव पड़ेगा?

​▸ ​निष्कर्ष: समग्र रूप से कुंडली में 'अमृत' (PB) और 'विष' (MB) का संतुलन कितना है?
----------
1] जातक के कुंडली के सभी शुभ योगो की पहले सूचि तयार करें, बाद में सभी शुभ योगों के बनने की विधि और उनके भाव तथा ग्रहों की क्षमता के आधार पर संभावित परिणाम का विस्तारपूर्वक विश्लेषण कीजिये, कुछ योग और दोष की सूचि pdf के अंत में दिए गए है, उनसे जो शुभ योग है वो भी लेने है.txt से भी लेने है.
2] जातक के कुंडली के सभी दोषों की पहले सूचि तयार करें, बाद में सभी दोषों के बनने की विधि और उनके भाव तथा ग्रहों की क्षमता के आधार पर संभावित परिणाम का विस्तारपूर्वक विश्लेषण कीजिये, कुछ योग और दोष की सूचि pdf के अंत में दिए गए है, उनसे जो दोष है वो भी लेने है.txt से भी लेने है.

भाग 1: पराशरी ज्योतिष के अनुसार विवाह के समय का विश्लेषण
1] विंशोत्तरी दशा :
➤ महादशा (MD): क्या जातक की महादशा ऐसे ग्रह की चल रही है जो विवाह के लिए प्रभावशाली ग्रह हो? (यह एक लंबी अवधि का संकेत है)।
➤ अंतर्दशा (AD): सभी संभावित महादशा के भीतर, क्या अंतर्दशा ऐसे ग्रह की है जो विवाह के लिए प्रभावशाली ग्रह हो?
➤ प्रत्यंतर दशा (PD):सभी संभावित महादशा अनुकूल अंतर्दशा के भीतर, विवाह के समय के सबसे करीब पहुंचने के लिए, क्या प्रत्यंतर दशा ऐसे ग्रह की है जो विवाह के लिए प्रभावशाली ग्रह हो?

2] योगिनी दशा :
➤ सभी संभावित दशा में चल रही योगिनी महादशा और अंतर्दशा के स्वामी ग्रह जो विवाह के लिए प्रभावशाली ग्रह हो??

3] गोचर विश्लेषण :
➤ सभी संभावित दशा अवधि में गुरु और शनि का संयुक्त प्रभाव: 

उपरोक्त कुंडली डेटा और गोचर विवरणों के आधार पर, अगले 7 वर्षों के लिए गुरु (बृहस्पति) और शनि के संयुक्त प्रभाव (Double Transit) की एक विस्तृत तालिका तैयार करें। यह विश्लेषण पूरी तरह से ग्रहों की दृष्टि और स्थिति (Transit Aspects/Positions) पर आधारित होना चाहिए।

तालिका का प्रारूप और कॉलम:
| समय (अवधि) | गुरु का गोचर प्रभाव (D1+D9) | शनि का गोचर प्रभाव (D1+D9) | संयुक्त प्रभाव (Double Transit) | विवाह की संभावना का अंतिम निष्कर्ष |

जाँच के लिए मुख्य चेकलिस्ट निर्देश:
प्रत्येक गोचर अवधि के लिए, निम्नलिखित बिंदुओं पर गुरु और शनि के प्रभाव (दृष्टि या युति) की सूक्ष्मता से जाँच करें:

1] गोचर के गुरु (Jupiter) के लिए:
- जन्म कुंडली (D1): सप्तम भाव/सप्तमेश, लग्न/लग्नेश, लाभ भाव/लाभेश, परिवार भाव/द्वितीयेश।
- कारक: जन्म शुक्र, जन्म गुरु, चंद्र लग्न (राशि)।
- नवांश (D9): नवांश लग्न और नवांश सप्तम भाव।

2] गोचर के शनि (Saturn) के लिए:
- जन्म कुंडली (D1): लग्न/लग्नेश, सप्तम भाव/सप्तमेश, लाभ भाव/लाभेश, परिवार भाव/द्वितीयेश।
- कारक: जन्म शुक्र, जन्म गुरु, चंद्र लग्न (राशि)।
- नवांश (D9): नवांश लग्न और नवांश सप्तम भाव।

तालिका के नियम:
- प्रभाव कॉलम: केवल उन प्रभावित बिंदुओं के नाम लिखें जिनका संबंध बन रहा है (जैसे: 'सप्तम भाव और जन्म शुक्र पर दृष्टि')।
- संयुक्त प्रभाव: यदि गुरु और शनि दोनों एक साथ किन्हीं विवाह कारकों (विशेषकर लग्न या 7वें भाव) को प्रभावित कर रहे हैं, तो 'सक्रिय (Double Transit Active)' लिखें।
- निष्कर्ष: प्रभाव की तीव्रता और दोहरे गोचर की सक्रियता के आधार पर 'प्रबल', 'औसत' या 'न्यून' लिखें।

➤ क्या गोचर के गुरु और शनि, दोनों एक साथ प्रभावित (दृष्टि या युति द्वारा) कर रहे हैं, ऐसी अवधि है?

विश्लेषण (गोचर): दशा द्वारा पहचानी गई "समय सीमा" के भीतर, दोहरे गोचर का नियम उस विशिष्ट वर्ष को इंगित करता है जब विवाह की घटना घटित होने की सबसे अधिक संभावना है।
----------
उपरोक्त फाइलों और उपलब्ध डेटा के आधार पर, जातक के लिए अगले 7 वर्षों के गुरु (बृहस्पति) के गोचर की एक विस्तृत 'विवाह केंद्रित शक्ति तालिका' तैयार करें।
​तालिका का प्रारूप और कॉलम (अनिवार्य):
| गोचर भाव (L/M) | समय (अवधि) | SAV | BAV | BAL | गुणवत्ता | विवाह पर प्रभाव | विवाह के सहायक भावों पर प्रभाव | विवाह की संभावना का अंतिम निष्कर्ष |
​डेटा प्रोसेसिंग के सख्त नियम:
​शक्ति डेटा (SAV/BAV/BAL): इन मानों को कुंडली के अष्टकवर्ग (Sarva/Bhinna) और भाव-बल (Bhava Bala) खंड से निकालें।
​विवाह पर प्रभाव: गुरु का गोचर में 7वें भाव, सप्तमेश, जन्म शुक्र, या जन्म गुरु से दृष्टि/स्थिति संबंध जाँचे।
​सहायक भावों पर प्रभाव: गुरु का 11वें, 2रे, 9वें भाव या जन्म शनि से दृष्टि/स्थिति संबंध जाँचे।
​गुणवत्ता (Quality) लॉजिक: SAV > 28 और BAL > 500 होने पर 'High', केवल SAV > 28 होने पर 'Medium', अन्यथा 'Low' लिखें।
​अंतिम निष्कर्ष: यदि 'विवाह पर प्रभाव' सक्रिय है और 'गुणवत्ता' High/Medium है, तो 'प्रबल संभावना' लिखें। यदि दोनों कम हैं, तो 'न्यून' लिखें।
----------

▸ जन्म कुंडली का मंगल (Mars) - (स्त्री जातक के विवाह के लिए)।

➤ स्त्री की कुंडली में: क्या गोचर का गुरु जन्म कुंडली के शुक्र (स्वयं) और मंगल (पति) से संबंध बना रहा है?

विश्लेषण:

➤ BNN के अनुसार, विवाह तब होता है जब "जीव" (गुरु) विवाह के लिए तैयार होता है और "कर्म" (शनि) उसे अनुमति देता है।
➤ सबसे प्रबल समय: वह वर्ष जब गोचर का गुरु विवाह के कारक ग्रहों (पुरुष के लिए शुक्र, और स्त्री के लिए शुक्र व मंगल) को सक्रिय कर रहा हो और साथ ही, गोचर का शनि भी उन्हीं कारक ग्रहों या भावों को अपनी दृष्टि या युति से अनुमोदित (approve) कर रहा हो।
➤ सहायक समय: यदि केवल गुरु का गोचर अनुकूल हो, तो भी विवाह की घटना हो सकती है, लेकिन जब शनि का भी अनुमोदन मिल जाता है, तो घटना का होना लगभग निश्चित हो जाता है।

2] जीवनसाथी का मनोबल और मानसिकता और अंतरंग स्वभाव कैसा होगा?
[पराशरी: 7वें भाव का स्वामी (सप्तमेश) नवमांश (D9) में किस स्थिति/तत्व में है। जैमिनी: दाराकारक (DK) का नवमांश (स्वांश) और उस पर प्रभाव। BNN: शुक्र (पुरुष के लिए) या गुरु (स्त्री के लिए) का चंद्रमा (मन) के साथ संबंध। KP: 7वें CSL का नक्षत्र स्वामी (NL) किस तत्व (अग्नि, जल, वायु, पृथ्वी) की राशि में है।]

3] क्या जीवनसाथी वफादार होगा ?
[संदर्भ: कृपया D1 और D9 चार्ट में सप्तम भाव/सप्तमेश, शुक्र और चंद्रमा (मन) पर राहु/मंगल और बुध (चालाकी/धोखा) तथा 8वें/12वें भाव का नकारात्मक प्रभाव जांचें। लॉयल्टी तय करने से पहले अनिवार्य रूप से चेक करें कि क्या ये ग्रह (या कोई पापी युति जैसे : राहू के साथ शुक्र-बुध-मंगल) "गुरु या शनि की राशि या नक्षत्र" में स्थित हैं अथवा बुध-शुक्र-मंगल की राशी में स्तिथ है, या उन पर गुरु/शनि की शुभ दृष्टि है; क्योंकि यह स्थिति व्यक्ति को भटकाव से रोककर नैतिकता देती है।; KP: क्या 7th CSL 5, 8 और 12 (गुप्त संबंध/धोखा) को एक साथ सिग्निफाई कर रहा है?]

[संदर्भ: पराशरी: सप्तम भाव/सप्तमेश पर पाप ग्रहों (शनि, मंगल, राहु, केतु) का प्रभाव, सप्तमेश का 6ठे, 8वें या 12वें भाव से संबंध, नीच/अस्त ग्रहों का प्रभाव। जैमिनी: DK ग्रह पर पाप अर्गला।]

[संदर्भ: पराशरी: सप्तमेश जिस भाव और राशि में है, उसका कारकत्व (जैसे 3रा भाव = यात्रा/पड़ोसी/सोशल मीडिया, 4था भाव = घर/रिश्तेदार, 9वां भाव = धर्म/शिक्षा स्थान), नवमांश का सप्तम भाव। पुरुष के लिए शुक्र और स्त्री के लिए गुरु की भाव स्थिति। KP: 7th CSL का 3, 4, 9, 11 आदि भावों से संबंध। जैमिनी: A7 (दारापद) किस भाव और राशि में है (यह भौतिक मिलन की जगह बताता है)। BNN: गुरु/शुक्र किस दिशा और तत्व की राशि में बैठे हैं।]

8] जीवनसाथी की रुचि/शौक ?
[संदर्भ: पराशरी: सप्तम भाव/सप्तमेश का 3रे (रुचि/हॉबी) या 5वें (रचनात्मकता/कला) भाव से संबंध। D9 में शुक्र की स्थिति। जैमिनी: कारकांश और स्वांश लग्न का प्रभाव। KP: 7th CSL के नक्षत्र स्वामी का 3रे (हॉबी) या 5वें (कला) भाव से संबंध]
----------
9] जीवनसाथी का करियर या नौकरी कैसी होगी?
[संदर्भ: पराशरी: सप्तम से दशम (D1 का 4था भाव और भावेश), D9 का 4था भाव और भावेश। जैमिनी: DK से 10वां भाव। KP: 7वें CSL का नक्षत्र स्वामी (NL) कौन है और उसका मूल स्वभाव क्या है? क्या 7th CSL का संबंध 10वें (करियर) या 6ठे (नौकरी) भाव से बन रहा है?]
----------
10] जीवनसाथी का शारीरिक स्वास्थ्य और बल कैसा रहेगा?
[संदर्भ: पराशरी: सप्तम से 6ठा (D1 का 12वां भाव - रोग) और 8वां (D1 का 2रा भाव - आयु/मारक), सप्तमेश की डिग्री/अवस्था। जैमिनी: दाराकारक पर पाप अर्गला। KP: क्या 7th CSL 1, 6, 8, 12 भावों (बीमारी/अस्पताल) को प्रबलता से सिग्निफाई कर रहा है?]
----------
11] वैवाहिक जीवन का विश्लेषण? (पराशरी D1 और  D9 और अन्य; जैमिनी [अर्गला]; BNN; KP)
➤ वैवाहिक जीवन की मानसिक गहराई और भावनात्मक जुड़ाव
➤ वैवाहिक सुख और संबंध प्रकृति
➤ विवाह चलेगा या नहीं ? (D9 का 2nd भाव और भावेश भी देखे, और अन्य ज्योतिष पद्धति)
[संदर्भ: पराशरी: D1/D9 सप्तम भाव/सप्तमेश की शुभता या पाप कर्तरी। नवमांश (D9) का दूसरा भाव (कुटुंब की स्थिरता) और उसका भावेश। जैमिनी: उपपद लग्न (UL) और उस पर अर्गला। BNN: गुरु और शुक्र का आपसी संबंध (युति, 1-5-9 या 2-12)। KP: क्या 7th CSL शुभ भावों (2, 7, 11) को दिखा रहा है या अलगाव/तलाक के भावों (1, 6, 10, 12) को?]
----------
12] जीवनसाथी की पारिवारिक पृष्ठभूमि का विस्तार से विश्लेषण?
[संदर्भ: पराशरी: सप्तम से दूसरा (D1 का 8वां भाव और भावेश)। D9 का 8वां भाव। जैमिनी: उपपद लग्न (UL) से दूसरा भाव और उसका स्वामी।]
----------
13] क्या जीवनसाथी आपके जीवन के उद्देश्यों, लक्ष्यों और महत्वाकांक्षाओं का समर्थन करेगा/करेगी?
[संदर्भ: पराशरी: लग्न (जातक) और सप्तम (जीवनसाथी) के स्वामियों के बीच मित्रता/शत्रुता/दृष्टि संबंध। नवमांश में लग्नेश और सप्तमेश का संबंध। 11वें (लाभ/इच्छा पूर्ति) भाव से सप्तमेश का संबंध। जैमिनी: आत्माकारक (AK) और दाराकारक (DK) के बीच संबंध (मित्रता = पूर्ण समर्थन)। KP: क्या 7th CSL 11वें (इच्छा पूर्ति) भाव को दिखा रहा है? BNN: गुरु और शुक्र का आपसी 1-5-9 संबंध।]
----------
14] संतान प्राप्ति के योग और संतान से संबंधित जीवन कैसा रहेगा?  (D7 और आवश्यक पद्दति)
[संदर्भ: पराशरी: D1 का 5वां भाव/भावेश, गुरु (संतान कारक) की स्थिति, सप्तांश (D7) कुंडली का लग्न और 5वां भाव। KP: 5वें भाव के CSL का 2, 5, 11 भावों से संबंध।]
----------
15] विवाह अथवा ससुराल की दिशा क्या होगी?
➤ विवाह के लिए अनुकूल स्थान क्या हो सकता है?

----------
16] ससुराल से संबंध कैसे होंगे?
[संदर्भ: पराशरी: अष्टम भाव, अष्टमेश की स्थिति और उस पर दृष्टि। नवमांश (D9) का अष्टम भाव। जैमिनी: उपपद लग्न (UL) और A8 (मृत्यु पद/ससुराल) पर अर्गला। KP: 8वें भाव के CSL का 1, 2 या 11 भावों से संबंध।]
----------
17] विवाह के बाद धनलाभ या ससुराल/जीवनसाथी से भाग्योदय के योग हैं या नहीं?
[संदर्भ: पराशरी: D1 और D9 में सप्तमेश का 2रे (धन), 9वें (भाग्य) और 11वें (लाभ) भाव से संबंध। अष्टम भाव (ससुराल की संपत्ति)। KP: क्या 7th CSL 2, 9, 11 भावों को दृढ़ता से सिग्निफाई कर रहा है?]

19] क्या लॉन्ग डिस्टेंस रिलेशनशिप के योग हैं?
[संदर्भ: पराशरी: सप्तमेश का 3रे (यात्रा), 9वें (लंबी यात्रा) या 12वें भाव (विदेश/दूरी) से संबंध। 7वें भाव पर राहु/केतु का प्रभाव। KP: क्या 7th CSL 3, 9, 12 भावों का सिग्निफिकेटर है?]

मारक पहचान: क्या यह ग्रह द्वितीयेश (2nd lord) या सप्तमेश (7th lord) होकर मारकेश की भूमिका में है? यदि हाँ, तो कौन सी - द्वितीयेश (सामान्य मारक) या सप्तमेश (प्रबल मारक)?
बाधक पहचान: क्या यह ग्रह लग्न के स्वभाव (चर, स्थिर, द्विस्वभाव) के अनुसार बाधक भाव (11वें, 9वें, या 7वें) का स्वामी है?
दोहरी भूमिका: क्या यह ग्रह मारक और बाधक दोनों की भूमिका निभा रहा है? (विशेषकर द्विस्वभाव लग्न के लिए सप्तमेश के रूप में)।
कार्यात्मक शुभता: इसके विपरीत, क्या यह ग्रह केंद्र/त्रिकोण का स्वामी होकर एक शुभ 'योगकारक' ग्रह है? या केवल एक त्रिकोण का स्वामी होकर अत्यंत शुभ है?
2. नकारात्मकता/सकारात्मकता की तीव्रता का आकलन (Assessing the Intensity):
पापी ग्रहों का प्रभाव: क्या इस ग्रह पर नैसर्गिक पाप ग्रहों (शनि, मंगल, राहु, केतु) की दृष्टि है या वह उनके साथ युति में है? यदि हाँ, तो यह उसकी नकारात्मकता को कैसे बढ़ा रहा है?
शुभ ग्रहों का प्रभाव: क्या इस ग्रह पर नैसर्गिक शुभ ग्रहों (गुरु, शुक्र, शुभ बुध) की दृष्टि है या वह उनके साथ है? क्या इससे मारक/बाधक प्रभाव में कोई कमी या सुरक्षा (Mitigation) मिल रही है?
भाव स्थिति: यह ग्रह कुंडली के किस भाव में स्थित है? क्या यह त्रिक भावों (6, 8, 12) में बैठकर और अधिक अशुभ हो गया है, या केंद्र/त्रिकोण में बैठकर इसकी स्थिति कुछ बेहतर है?
राशि बल: क्या यह ग्रह अपनी नीच राशि में होकर अत्यंत पीड़ित है या अपनी उच्च/स्वयं की राशि में होकर इसकी नकारात्मकता में कमी आ रही है? अथवा अधिक शक्तिशाली और प्रभावी हो गई है?

- कारक: जन्म गुरु, जन्म शुक्र, चंद्र लग्न (राशी).
- नवांश (D9): नवांश लग्न आणि नवांश 7वे भाव.

2] गोचरच्या शनि (Saturn) साठी:

1] दशा विश्लेषण (संभाव्य कालावधीची पुष्टी):
➤ दशा स्वामींची योग्यता: काढलेल्या सर्व संभाव्य टाइम विंडोमध्ये विंशोत्तरी महादशा (MD), अंतर्दशा (AD) आणि प्रत्यंतर दशा (PD) चे स्वामी ग्रह विवाहासाठी "योग्य" (Qualified) आहेत का?
▸ योग्यतेची तपासणी: हे दशा स्वामी ग्रह आपल्या स्थिती, नक्षत्र स्वामी किंवा उप-स्वामीद्वारे विवाहाच्या प्रमुख भावांचे (2, 7, 11) प्रबल सिग्निफिकेटर बनत आहेत का?
➤ नकारात्मक भावांची तपासणी: हे दशा स्वामी सोबतच विवाहात अडथळा आणणाऱ्या भावांनाही (1, 6, 10) सिग्निफाय करत आहेत का? (असल्यास, विवाह संघर्ष किंवा अडथळ्यांनंतर होईल).

विश्लेषण (दशा): दशा कालावधींवर आधारित विवाहाची संभाव्य वेळ-मर्यादा.
KP नुसार, विवाह फक्त त्याच MD-AD-PD मध्ये शक्य आहे ज्यांचे स्वामी ग्रह 2, 7 आणि 11 भावांचे प्रबल सिग्निफिकेटर असतील. हे पराशरी दशा विश्लेषण फिल्टर करण्याचा सर्वात अचूक मार्ग आहे.

2] गोचर (Transits) चा वापर:

➤ प्रमुख ग्रहांचा गोचर: दशेने दर्शवलेल्या अनुकूल कालावधीत, गोचरचे बृहस्पति (Jupiter) आणि शनि (Saturn) विवाहाचे प्रबल सिग्निफिकेटर असलेल्या ग्रहांवरून जात आहेत का?

विश्लेषण (गोचर): दशा संभाव्य वर्षे आणि महिन्यांची सीमा सांगते, तर गोचर त्या सीमेत अचूक महिना आणि दिवस दर्शवण्यास मदत करते.
----------

भाग 5: विवाह वेळेचा निष्कर्ष आणि समग्र आढावा
➤ विवाह वेळेसाठी सर्व प्रणालींच्या (पराशरी, जैमिनी, BNN, KP) मुख्य निष्कर्षांचा संक्षिप्त सारांश.
➤ वेगवेगळ्या प्रणाली कोणत्या मुद्द्यांवर सहमत आहेत आणि कोणत्या मुद्द्यांवर थोडा वेगळा दृष्टिकोन आहे?
➤ सर्व विश्लेषणांच्या आधारावर सर्व प्रणालींच्या सर्वसम्मत कालावधीची ओळख.
➤ अंतिम निष्कर्ष: विवाहाच्या वेळेचे सर्वात संभाव्य वर्ष.
----------
वरील चॅट आणि पीडीएफ आणि सुरुवातीपासून तुम्हाला दिलेल्या सर्व माहितीच्या आधारावर खालील प्रश्नांचे सखोल आणि विस्ताराने विश्लेषण करून निष्कर्षासह द्यायचे आहे, लक्षात ठेवा विश्लेषण संदर्भाबरोबरच आपल्या बुद्धीचा वापर करून आवश्यकतेनुसार ज्योतिष प्रणालीचा वापर करून केले पाहिजे.
आणि कोणत्या सूचना आहेत ज्यांचे तुम्हाला काटेकोरपणे पालन करायचे आहे ते तुम्हाला आठवते का? कोणत्या आहेत?
तर पहिला प्रश्न देऊ का?
----------
1] संभावित जीवनसाथीच्या स्वभावाचे सविस्तर विश्लेषण?
[संदर्भ: सर्व चार भागांचे विश्लेषण; पराशरी D1 आणि D9; जैमिनी; BNN; KP]
----------
2] जीवनसाथीचे मनोबल, मानसिकता आणि अंतरंग स्वभाव कसा असेल?
[पराशरी: सातव्या भावाचा स्वामी (सप्तमेश) नवमांशात (D9) कोणत्या स्थितीत/तत्त्वात आहे. जैमिनी: दाराकारकाचा (DK) नवमांश (स्वांश) आणि त्यावरील प्रभाव. BNN: शुक्र (पुरुषासाठी) किंवा गुरु (स्त्रीसाठी) यांचा चंद्राशी (मन) संबंध. KP: सातव्या CSL चा नक्षत्र स्वामी (NL) कोणत्या तत्त्वाच्या (अग्नी, जल, वायू, पृथ्वी) राशीत आहे.]
----------
3] जीवनसाथी निष्ठावान असेल का?
[संदर्भ: कृपया D1 आणि D9 चार्टमध्ये सप्तम भाव/सप्तमेश, शुक्र आणि चंद्र (मन) यांच्यावर राहू/मंगळ आणि बुध (चलाखी/धोका) तसेच 8व्या/12व्या भावाचा नकारात्मक प्रभाव तपासा. निष्ठा ठरवण्याआधी अनिवार्यपणे तपासा की हे ग्रह (किंवा राहूसोबत शुक्र-बुध-मंगळासारखी कोणतीही पापी युती) "गुरु किंवा शनीच्या राशीत किंवा नक्षत्रात" स्थित आहेत की बुध-शुक्र-मंगळाच्या राशीत स्थित आहेत, किंवा त्यांच्यावर गुरु/शनीची शुभ दृष्टी आहे; कारण ही स्थिती व्यक्तीला भरकटण्यापासून रोखून नैतिकता देते. KP: 7th CSL 5, 8 आणि 12 (गुप्त संबंध/धोका) यांना एकत्र सिग्निफाय करत आहे का?]
----------
4] जीवनसाथीच्या काही कमकुवत बाबी किंवा नकारात्मक पैलू कोणते असू शकतात?
[संदर्भ: पराशरी: सप्तम भाव/सप्तमेशावर पाप ग्रहांचा (शनी, मंगळ, राहू, केतू) प्रभाव, सप्तमेशाचा 6व्या, 8व्या किंवा 12व्या भावाशी संबंध, नीच/अस्त ग्रहांचा प्रभाव. जैमिनी: DK ग्रहावर पाप अर्गला.]
----------
5] विवाहाच्या संभाव्य वेळेचे सविस्तर विश्लेषण? (पराशरी; जैमिनी (अर्गला); BNN; KP)
[संदर्भ: विवाह वेळ विश्लेषणाचे सर्व चार भाग; पराशरी; जैमिनी (अर्गला); BNN; KP]
----------
6] जीवनसाथीशी पहिली भेट कुठे आणि कशी होण्याची शक्यता आहे?
➤ जीवनसाथीशी भेट कोणत्या माध्यमातून किंवा कोणत्या नातेवाइकामार्फत होऊ शकते?
[संदर्भ: पराशरी: सप्तमेश ज्या भावात आणि राशीत आहे, त्याचे कारकत्व (जसे 3रा भाव = प्रवास/शेजारी/सोशल मीडिया, 4था भाव = घर/नातेवाईक, 9वा भाव = धर्म/शिक्षण स्थान), नवमांशाचा सप्तम भाव. पुरुषासाठी शुक्र आणि स्त्रीसाठी गुरुची भाव स्थिती. KP: 7th CSL चा 3, 4, 9, 11 इत्यादी भावांशी संबंध. जैमिनी: A7 (दारापद) कोणत्या भावात आणि राशीत आहे (हे भौतिक भेटीचे ठिकाण सांगते). BNN: गुरु/शुक्र कोणत्या दिशेच्या आणि तत्त्वाच्या राशीत बसले आहेत.]
----------
7] जीवनसाथीच्या भौतिक संकेतांचे सविस्तर विश्लेषण?
➤ रंग
➤ रूप
➤ उंची
➤ बांधा
➤ चेहऱ्यावर किंवा आसपास निशाण/तिल (संभाव्यता टक्केवारी)
➢ रंग, रूप, उंची, बांधा यांचा समग्र निष्कर्ष
[संदर्भ: पराशरी: सप्तम भावात बसलेले ग्रह, सप्तमेशाचा ग्रह स्वभाव (जसे सूर्य/मंगळ = गठ्ठा, शुक्र/चंद्र = सुंदर/सौम्य). D9 चे लग्न आणि लग्नेश. जैमिनी: दाराकारकाचा (DK) ग्रह तत्त्व. KP: 7th CSL आणि त्याच्या नक्षत्र स्वामीचे स्वरूप. BNN: शुक्र किंवा गुरुसोबत बसलेले ग्रह (जसे मंगळ सोबत असेल तर गठ्ठा शरीर, चंद्र असेल तर गोल चेहरा आणि सौंदर्य).]
----------
8] जीवनसाथीची आवड/छंद?
[संदर्भ: पराशरी: सप्तम भाव/सप्तमेशाचा 3ऱ्या (आवड/छंद) किंवा 5व्या (सर्जनशीलता/कला) भावाशी संबंध. D9 मध्ये शुक्राची स्थिती. जैमिनी: कारकांश आणि स्वांश लग्नाचा प्रभाव. KP: 7th CSL च्या नक्षत्र स्वामीचा 3ऱ्या (छंद) किंवा 5व्या (कला) भावाशी संबंध.]

[संदर्भ: पराशरी: सप्तमापासून दशम (D1 चा 4था भाव आणि भावेश), D9 चा 4था भाव आणि भावेश. जैमिनी: DK पासून 10वा भाव. KP: 7व्या CSL चा नक्षत्र स्वामी (NL) कोण आहे आणि त्याचा मूळ स्वभाव काय आहे? 7th CSL चा संबंध 10व्या (करिअर) किंवा 6व्या (नोकरी) भावाशी बनत आहे का?]
----------
10] जीवनसाथीचे शारीरिक आरोग्य आणि बळ कसे असेल?

11] वैवाहिक जीवनाचे विश्लेषण? (पराशरी D1 आणि D9 आणि इतर; जैमिनी [अर्गला]; BNN; KP)
➤ वैवाहिक जीवनाची मानसिक खोली आणि भावनिक जिव्हाळा

[संदर्भ: पराशरी: D1/D9 सप्तम भाव/सप्तमेशाची शुभता किंवा पाप कर्तरी. नवमांशाचा (D9) दुसरा भाव (कुटुंबाची स्थिरता) आणि त्याचा भावेश. जैमिनी: उपपद लग्न (UL) आणि त्यावरील अर्गला. BNN: गुरु आणि शुक्र यांचा परस्पर संबंध (युती, 1-5-9 किंवा 2-12). KP: 7th CSL शुभ भावांना (2, 7, 11) दाखवत आहे की विभक्तता/घटस्फोटाच्या भावांना (1, 6, 10, 12)?]

12] जीवनसाथीच्या कौटुंबिक पार्श्वभूमीचे सविस्तर विश्लेषण?

----------

----------
14] संततीप्राप्तीचे योग आणि संततीसंबंधी जीवन कसे असेल? (D7 आणि आवश्यक पद्धती)

15] विवाह किंवा सासरची दिशा कोणती असेल?
➤ विवाहासाठी अनुकूल ठिकाण कोणते असू शकते?

----------
16] सासरशी संबंध कसे असतील?
[संदर्भ: पराशरी: अष्टम भाव, अष्टमेशाची स्थिती आणि त्यावरील दृष्टी. नवमांशाचा (D9) अष्टम भाव. जैमिनी: उपपद लग्न (UL) आणि A8 (मृत्यू पद/सासर) यांच्यावरील अर्गला. KP: 8व्या भावाच्या CSL चा 1, 2 किंवा 11 भावांशी संबंध.]

17] विवाहानंतर धनलाभ किंवा सासर/जीवनसाथीकडून भाग्योदयाचे योग आहेत की नाहीत?
[संदर्भ: पराशरी: D1 आणि D9 मध्ये सप्तमेशाचा 2ऱ्या (धन), 9व्या (भाग्य) आणि 11व्या (लाभ) भावाशी संबंध. अष्टम भाव (सासरची संपत्ती). KP: 7th CSL 2, 9, 11 भावांना ठामपणे सिग्निफाय करत आहे का?]

5: समुपदेशन आणि उपाय (Counseling and Remedies)
(हा विभाग "आव्हानाचे" (Step 1-4 मध्ये ओळखले गेलेले) व्यवस्थापन कसे करायचे यावर केंद्रित आहे.)
5.1. ज्योतिषीय शांती उपाय (Astrological Pacification):
मंत्र/जप: या ग्रहाच्या (किंवा त्याच्या अधिपती देवतेच्या) बीज मंत्राचा किंवा वैदिक मंत्राचा जप शांतीसाठी आवश्यक आहे का?
स्तोत्र: दशा-अंतर्दशेदरम्यान विशिष्ट स्तोत्राचे (जसे, शनीसाठी 'शनी महात्म्य' किंवा बुधासाठी 'विष्णू सहस्रनाम') पठण संरक्षणात्मक ठरेल का?
दान: या ग्रहाच्या नकारात्मक प्रभावाची शांती करण्यासाठी कोणत्या वस्तूंचे दान (रंग, धान्य, धातू) आणि केव्हा (कोणत्या दिवशी) करावे?
5.2. रत्न आणि धारण (Gems and Wearing) - [सर्वात महत्त्वाची सावधानी]:
रत्न निषेध: हा ग्रह (मारक/बाधक असल्यामुळे) त्या ग्रहांपैकी आहे का ज्याचे रत्न कोणत्याही परिस्थितीत धारण करू नये? (स्पष्टपणे लिहा: कारण बलवान मारकेशाचे रत्न घालणे म्हणजे "शक्तिशाली शत्रूला आणखी शक्ती देणे" होय.)
पर्यायी धारण: या ग्रहाची शांती करण्याऐवजी, कुंडलीच्या 'रक्षक' ग्रहाचे (जसे लग्नेश किंवा नवमेश) रत्न घालणे चांगला उपाय ठरेल का?
5.3. वर्तणुकी उपाय (Behavioral Remedies / The Counseling):
जाणीव (Awareness): जातकाने या ग्रहाच्या नकारात्मक स्वभावाबद्दल कसे सतर्क राहावे? (जसे: "तुमची वाणी (बुध) हाच तुमचा मारकेश आहे, म्हणून बोलण्यापूर्वी विचार करण्याचा सराव करा.")
बदल (Modification): जातकाला आपल्या कोणत्या सवयी बदलाव्या लागतील? (जसे: "तुमचा गुरु (बाधकेश) तुम्हाला 'आदर्शवादी' बनवून 'अडथळा' देत आहे. तुमचा उपाय म्हणजे इतरांकडून 'परफेक्शन'ची अपेक्षा कमी करणे आणि लवचिक बनणे.")
5.4. आध्यात्मिक/कार्मिक उपाय (Spiritual/Karmic Remedies):
कर्माचा धडा (Karmic Lesson): हा ग्रह जीवनात कोणता 'कार्मिक धडा' शिकवायला आला आहे? (जसे: 'वैराग्य' किंवा 'अलगीकरण' यांचा धडा).
ऊर्जेचे रूपांतरण (Energy Channeling): जातक या ग्रहाची नकारात्मक ऊर्जा उच्च उद्देशासाठी वापरू शकतो का? (जसे: 'मारक' शनीची ऊर्जा 'अध्यात्म' किंवा 'रुग्णालय सेवा' यात लावणे).

        let currentLang = 'hi';
        function getRawData() {
            if (currentLang === 'en') return rawData_en;
            if (currentLang === 'mr') return rawData_mr;
            return rawData_hi;
        }
        function changeLanguage(lang) {
            currentLang = lang;
            document.getElementById('prompt-container').innerHTML = '';
            processData();
        }

        // सेपरेटर लॉजिक: --- या ___ लाइन्स से अलग करना
        const separatorRegex = /\n-{10,}\n|\n_{10,}\n/g;
        
        function processData() {
            const container = document.getElementById('prompt-container');
            // पहले डैश लाइन्स से तोडें
            let parts = getRawData().split(separatorRegex);

            parts.forEach((part, index) => {
                let cleanText = part.trim();
                
                // फिल्टरिंग लॉजिक
                const lines = cleanText.split('\n');
                const filteredLines = lines.filter(line => {
                    const l = line.trim();
                    // जंक (MMM... RRR... PPPP...) हटाएं
                    if (l.match(/^[M|P|C|H|R]{5,}$/)) return false;
                    // सिर्फ डैश वाली लाइन हटाएं
                    if (l.match(/^-{5,}$/)) return false;
                    return true;
                });
                
                cleanText = filteredLines.join('\n').trim();

                if (cleanText.length > 5) { // खाली या बहुत छोटी स्ट्रिंग न दिखाएं
                    createCard(cleanText, index + 1);
                }
            });
        }

        function createCard(text, id) {
            const container = document.getElementById('prompt-container');
            
            const card = document.createElement('div');
            card.className = 'card';

            const header = document.createElement('div');
            header.className = 'card-header';
            header.innerHTML = `<span>Prompt #${id}</span>`;

            const content = document.createElement('div');
            content.className = 'card-content';
            content.innerText = text;

            const btn = document.createElement('button');
            btn.className = 'btn';
            btn.innerText = 'Copy Prompt';
            btn.onclick = () => copyText(text, btn);

            card.appendChild(header);
            card.appendChild(content);
            card.appendChild(btn);
            container.appendChild(card);
        }

        function showBtnFeedback(btn, success){
            if(!btn) return;
            var origText = btn.innerText;
            var origBg = btn.style.backgroundColor;
            btn.innerText = success ? "\u2713 Copied!" : "\u2717 Failed";
            btn.style.backgroundColor = success ? "#2e7d32" : "#c62828";
            btn.style.color = "#fff";
            setTimeout(function(){ btn.innerText = origText; btn.style.backgroundColor = origBg; }, 2000);
        }
        function copyText(text, btn) {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(() => {
                    showToast();
                    showBtnFeedback(btn, true);
                }).catch(err => {
                    fallbackCopy(text, btn);
                });
            } else {
                fallbackCopy(text, btn);
            }
        }

        function fallbackCopy(text, btn) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed'; // Avoid scrolling to bottom
            document.body.appendChild(textarea);
            textarea.focus();
            textarea.select();
            try {
                var ok = document.execCommand('copy');
                showToast();
                showBtnFeedback(btn, ok);
            } catch (err) {
                console.error('Fallback: Oops, unable to copy', err);
                showBtnFeedback(btn, false);
            }
            document.body.removeChild(textarea);
        }

        function showToast() {
            var x = document.getElementById("snackbar");
            x.className = "toast show";
            setTimeout(function(){ x.className = x.className.replace("show", ""); }, 3000);
        }

        // Initialize
        processData();

    </script>
