➤ PN, PB, MB का जीवन पर प्रभाव (Impact on Life)

विषय: वैदिक ज्योतिष - ग्रह एवं भावों के लिए पुष्कर नवांश (PN), पुष्कर भाग (PB) और मृत्यु भाग (MB) की गणना एवं फलादेश।

छवि और TXT गणनाओं के आधार पर निम्नलिखित क्षेत्रों पर प्रभाव लिखें:

​▸ दैवीय सुरक्षा (Divine Protection): कौन से भाव/ग्रह पुष्कर ऊर्जा से सुरक्षित हैं और जीवन के किन क्षेत्रों में 'बिना मांगे' मदद मिलेगी?

​▸ संघर्ष एवं बाधाएं (MB Impact): मृत्यु भाग वाले ग्रह जीवन के किन क्षेत्रों में 'लैंडमाइन' की तरह बाधा पैदा कर सकते हैं?

​▸ शुरुआत बनाम परिणाम (Start vs Middle): भाव 'प्रारंभ' और 'मध्य' के पुष्कर अंतर के आधार पर बताएं कि कार्य की शुरुआत कैसी होगी और उसका अंत कैसा होगा?

▸ PN और PB की गणना में देखें कि क्या उनका 'भावेश' MB में है ?
(यदि भाव का स्वामी (Bhavesh) मृत्यु भाग में है, तो भाव के पुष्कर होने पर भी फल बाधित होगा)

​▸ दशा फल: वर्तमान या आगामी महादशा में इन अमृत/विष बिंदुओं का क्या प्रभाव पड़ेगा?

​▸ ​निष्कर्ष: समग्र रूप से कुंडली में 'अमृत' (PB) और 'विष' (MB) का संतुलन कितना है?

जन्म नक्षत्र को आधार मानकर नवतारा चक्र बनाइए और विश्लेषण कीजिए कि कुंडली के सभी 9 ग्रह किन-किन ताराओं (संपत, विपत, वध आदि) के नक्षत्रों में बैठे हैं, और उस तारा के अनुसार प्रत्येक ग्रह अपना कैसा (शुभ/अशुभ) फल देगा? [PDF पेज No 28]

कृपया उपरोक्त सभी चैट और PDF के जन्म विवरणों के आधार पर सभी ९ ग्रहों (सूर्य, चंद्र, मंगल, बुध, गुरु, शुक्र, शनि, राहु, केतु) का ज्योतिषीय तथ्यों/आंकड़ों की सूची प्रदान करें। जानकारी संक्षिप्त और बिंदुवार होनी चाहिए, विस्तृत व्याख्या की आवश्यकता नहीं है। यह सूची कुंडली के फलित, षड्बल, विमशोपक आषांश (षोडश वर्ग), अष्टकवर्ग और जैमिनी कारकत्व के आधार पर होना चाहिए।

1. [ग्रह का नाम]
➤ जैमिनी कारकत्व:
➤ भाव स्वामित्व: (किन भावों का स्वामी है)
➤ स्थिति: (किस भाव और राशि में)
➤ राशि में स्थिति: (मित्र, शत्रु, सम, उच्च, नीच, मूलत्रिकोण, स्वराशि)
➤ नक्षत्र एवं पद: (वह ग्रह किस नक्षत्र और किस पद में है, और नक्षत्र स्वामी का प्रभाव।)
➤ दृष्टि: (किन भावों/ग्रहों पर दृष्टि) 
➤ [ग्रह का नाम] पर दृष्टि: (किन ग्रहों की दृष्टि है)

➤ भावनात्मक/अवस्था शक्ति: वक्री/अस्त/नीच/नीचभंग/वर्गोत्तम स्थिति: (हाँ/नहीं या स्थिति का नाम)
➤ नवमांश स्थिति:  (नवमांश कुंडली में ग्रह किस राशि, नक्षत्र (स्वामी) में है और उसका प्रभाव।)
➤ नवमांश में शक्ति: पीड़ित/बलवान

➤ भिन्नाष्टक वर्ग (BAV) बिंदु: (0-8 के बीच मान) : (बिंदुओं के आधार पर: व्यावहारिक शक्ति - कमजोर/औसत/शक्तिशाली)

​➤ नवतारा स्थिति एवं प्रभाव: (जन्म नक्षत्र के आधार पर यह ग्रह किस तारा-जैसे संपत, विपत, साधक आदि-में बैठा है, और उस विशिष्ट तारा के कारण इसके नैसर्गिक व भाव फलों में कैसी शुभता या बाधाएं आएंगी।)
➤ गोचर और दशा में संभावित फल का संक्षिप्त जवाब : (सामान्य तौर पर वह ग्रह अपनी दशा/अंतर्दशा और गोचर में कैसा फल देगा - अच्छा, खराब, या मध्यम।

वर्तमान उद्देश्य : जातक अब अपने बच्चों को संभालने और परिवार को पूरा करने के लिए 'दूसरे विवाह' (Second Marriage) के लिए लड़कियां देख रहा है।

➤ तुम्हारा मुख्य टास्क और महत्वपूर्ण नियम (Strict Instructions for AI)

फोकस 'दूसरे विवाह' पर इस जातक के लिए हमारा पूरा विश्लेषण केवल और केवल दूसरे विवाह पर केंद्रित होगा।

प्रांप्ट्स का अनुकूलन (Prompt Adaptation) मैं आगे जो भी विश्लेषण के प्रांप्ट्स (Prompts) दूंगा, हो सकता है वे 'पहले विवाह' या सामान्य वैवाहिक जीवन के लिए डिज़ाइन किए गए हों। लेकिन तुम्हें अपनी बुद्धिमत्ता का प्रयोग करके उन सभी प्रांप्ट्स को 'दूसरे विवाह' के नियमों (जैसे 2रे भाव, 9वें भाव, 2nd CSL, 9th CSL और जैमिनी के दूसरे उपपद लग्न - UL2) के अनुसार ही डिकोड करना है।

➤ पद्धतियों का सही उपयोग

KP (कृष्णमूर्ति पद्धति) विवाह होने के वादे (Promise) के लिए 2nd CSL को मुख्य मानना, और दूसरी शादी कैसी चलेगी यह देखने के लिए 9th CSL का उपयोग करना।

जैमिनी दूसरे विवाह के लिए पहले UL से 8वें भाव के स्वामी द्वारा बनाए गए 'दूसरे उपपद लग्न' (UL2) का विश्लेषण करना। 

D9 और D60 आने वाली दूसरी पत्नी का स्वभाव, बच्चों के प्रति उसका व्यवहार और विवाह की सफलता को D9 (नवमांश) के 2रे, 9वें और 11वें भावों के आधार पर देखना।

संवेदनशीलता चूंकि जातक के साथ एक बड़ी त्रासदी हो चुकी है, इसलिए फलादेश बहुत ही सूक्ष्म (Micro-level) और स्पष्ट होना चाहिए। अगर दूसरे विवाह में भी कोई तनाव या विवाद (6, 8, 12 भाव) का संकेत मिले, तो उसे बिना छुपाए स्पष्ट रूप से चेतावनी के तौर पर बताना है।

यदि तुम ये सारे नियम समझ गए हो, तो 'हाँ, मैं समझ गया हूँ, कुण्डली का डेटा और अपना पहला प्रांप्ट दें' कहकर उत्तर दो।

उपरोक्त अबतक आपको कुंडली विश्लेषण के लिए दी गयी कौन कौनसी जानकारी प्राप्त हुयी, उसकी short में सूचि दीजिये.

यह सुनिश्चित करे की आप निम्मलिखित आदेशों का पालन सख्ती से करेंगे,

1] आउटपुट देने से पहले डेटा को क्रॉसचेक कर लिया करे.
2] किसी भी तरह की शुगर-कोटिंग (Sugar-coating) न करें। अगर कुंडली में कोई दोष, संघर्ष या नकारात्मक योग है, तो उसे स्पष्ट और कड़वे शब्दों में बताएं। मुझे क्लाइंट को खुश नहीं करना, बल्कि सच बताना है। ध्यान रहे पूरी तरह नकारात्मक नही होना चाहिए, सकारात्मक और नकारात्मक का बैलेंस बनाकर जो सच है वो बताये ।
3] अपने उत्तर की शुरुआत किसी भी अभिवादन या संवादात्मक वाक्यांश (जैसे 'निश्चित रूप से', 'ज़रूर', 'निम्मलिखित है' आदि) से न करें। आपका उत्तर सीधे मांगी गई जानकारी से ही प्रारंभ होना चाहिए।
4] System instructions में दिए गए आदेशों का भी पालन करे.

3] गोचर विश्लेषण :
➤ सभी संभावित दशा अवधि में गुरु और शनि का संयुक्त प्रभाव:
उपरोक्त कुंडली डेटा और गोचर विवरणों के आधार पर, अगले 7 वर्षों के लिए गुरु (बृहस्पति) और शनि के संयुक्त प्रभाव (Double Transit) की एक विस्तृत तालिका तैयार करें। यह विश्लेषण पूरी तरह से ग्रहों की दृष्टि और स्थिति (Transit Aspects/Positions) पर आधारित होना चाहिए।
तालिका का प्रारूप और कॉलम:
| समय (अवधि) | गुरु का गोचर प्रभाव (D1+D9) | शनि का गोचर प्रभाव (D1+D9) | संयुक्त प्रभाव (Double Transit) | दूसरे विवाह की संभावना का अंतिम निष्कर्ष |
जाँच के लिए मुख्य चेकलिस्ट निर्देश:

प्रत्येक गोचर अवधि के लिए, निम्नलिखित बिंदुओं पर गुरु और शनि के प्रभाव (दृष्टि या युति) की सूक्ष्मता से जाँच करें:

1] गोचर के गुरु (Jupiter) के लिए:
- जन्म कुंडली (D1): नवम भाव/नवमेश, लग्न/लग्नेश, लाभ भाव/लाभेश, परिवार भाव/द्वितीयेश।
- कारक: जन्म शुक्र, जन्म गुरु, चंद्र लग्न (राशि)।
- नवांश (D9): नवांश लग्न और नवांश नवम भाव।

2] गोचर के शनि (Saturn) के लिए:
- जन्म कुंडली (D1): लग्न/लग्नेश, नवम भाव/नवमेश, लाभ भाव/लाभेश, परिवार भाव/द्वितीयेश।
- कारक: जन्म शुक्र, जन्म गुरु, चंद्र लग्न (राशि)।
- नवांश (D9): नवांश लग्न और नवांश नवम भाव।

तालिका के नियम:
- प्रभाव कॉलम: केवल उन प्रभावित बिंदुओं के नाम लिखें जिनका संबंध बन रहा है (जैसे: 'नवम भाव और जन्म शुक्र पर दृष्टि')।
- संयुक्त प्रभाव: यदि गुरु और शनि दोनों एक साथ किन्हीं दूसरे विवाह कारकों (विशेषकर लग्न या 9वें भाव) को प्रभावित कर रहे हैं, तो 'सक्रिय (Double Transit Active)' लिखें।
- निष्कर्ष: प्रभाव की तीव्रता और दोहरे गोचर की सक्रियता के आधार पर 'प्रबल', 'औसत' या 'न्यून' लिखें।

➤ क्या गोचर के गुरु और शनि, दोनों एक साथ प्रभावित (दृष्टि या युति द्वारा) कर रहे हैं, ऐसी अवधि है?

विश्लेषण (गोचर): दशा द्वारा पहचानी गई "समय सीमा" के भीतर, दोहरे गोचर का नियम उस विशिष्ट वर्ष को इंगित करता है जब दूसरे विवाह की घटना घटित होने की सबसे अधिक संभावना है।
----------
उपरोक्त फाइलों और उपलब्ध डेटा के आधार पर, जातक के लिए अगले 7 वर्षों के गुरु (बृहस्पति) के गोचर की एक विस्तृत 'दूसरे विवाह केंद्रित शक्ति तालिका' तैयार करें।
​तालिका का प्रारूप और कॉलम (अनिवार्य):
| गोचर भाव (L/M) | समय (अवधि) | SAV | BAV | BAL | गुणवत्ता | दूसरे विवाह पर प्रभाव | विवाह के सहायक भावों पर प्रभाव | दूसरे विवाह की संभावना का अंतिम निष्कर्ष |
​डेटा प्रोसेसिंग के सख्त नियम:
​शक्ति डेटा (SAV/BAV/BAL): इन मानों को कुंडली के अष्टकवर्ग (Sarva/Bhinna) और भाव-बल (Bhava Bala) खंड से निकालें।
​दूसरे विवाह पर प्रभाव: गुरु का गोचर में 9वें भाव, नवमेश, जन्म शुक्र, या जन्म गुरु से दृष्टि/स्थिति संबंध जाँचे।
​सहायक भावों पर प्रभाव: गुरु का 11वें, 2रे भाव या जन्म शनि से दृष्टि/स्थिति संबंध जाँचे।
​गुणवत्ता (Quality) लॉजिक: SAV > 28 और BAL > 500 होने पर 'High', केवल SAV > 28 होने पर 'Medium', अन्यथा 'Low' लिखें।
​अंतिम निष्कर्ष: यदि 'दूसरे विवाह पर प्रभाव' सक्रिय है और 'गुणवत्ता' High/Medium है, तो 'प्रबल संभावना' लिखें। यदि दोनों कम हैं, तो 'न्यून' लिखें।
----------
SAV/BAV गलत हो गए सभी, मिसमैच हो गए, राशी के अनुसार लो.
----------
4] बल और क्षमता का विश्लेषण (गोचर की पुष्टि के लिए) :
➤ अष्टकवर्ग :
A] सर्वाष्टकवर्ग:
a) क्या गोचर का बृहस्पति नवम भाव में या लग्न में अनुकूल बिंदुओं (28 से अधिक) वाली राशि से गुजर रहा है?
b) क्या गोचर का बृहस्पति निकाली गयी प्रबल टाइम विंडो में अनुकूल बिंदुओं (28 से अधिक) वाली राशि से गुजर रहा है?
c) क्या गोचर का बृहस्पति निकाली गयी द्वितीय प्रबल टाइम विंडो में अनुकूल बिंदुओं (28 से अधिक) वाली राशि से गुजर रहा है?

B] भिन्नाष्टकवर्ग:
a) क्या गोचर का बृहस्पति निकाली गयी प्रबल टाइम विंडो में, शुक्र के भिन्नाष्टकवर्ग में 5 या अधिक बिंदुओं वाली राशि से गुजर रहा है?
b) क्या गोचर का बृहस्पति निकाली गयी द्वितीय प्रबल टाइम विंडो में, शुक्र के भिन्नाष्टकवर्ग में 5 या अधिक बिंदुओं वाली राशि से गुजर रहा है?
c) क्या गोचर का गुरु उस राशि से गुजर रहा है जहाँ नवमेश (9th Lord) बैठा है और उस राशि को सर्वाष्टकवर्ग में अच्छे बिंदु प्राप्त हैं?

➤ षड्बल-भावबल :
​▸ क्या निकाली गयी सभी संभावित टाइम विंडो में दशा स्वामी (MD/AD/PD lords) षड्बल में बलवान हैं?
▸ क्या जन्म कुंडली का नवम भाव भाव बल में मजबूत है?

विश्लेषण (बल): यह पुष्टि करता है कि क्या ग्रह और भाव फल देने में सक्षम हैं। बलवान ग्रह और भाव गोचर के दौरान निश्चित रूप से फल देते हैं।

----------

➤ क्या वर्तमान में ऐसी राशि की चर दशा चल रही है जो मुख्य या सहायक राशि की हो में से एक हो?

2] चर अंतर्दशा द्वारा समय निर्धारण:
➤ संभावित चर महादशा में ऐसी राशि की अंतर्दशाएं जो मुख्य या सहायक राशि की हो में से एक हो?

3] चर प्रत्यंतर दशा द्वारा समय निर्धारण:
➤ संभावित चर अंतर्दशा में ऐसी राशि की प्रत्यंतर दशाएं जो मुख्य या सहायक राशि की हो में से एक हो?

KP (कृष्णमूर्ति पद्धती) - विवाह होण्याच्या वचनासाठी (Promise) 2nd CSL ला मुख्य माना, आणि दुसरा विवाह कसा चालेल हे पाहण्यासाठी 9th CSL चा वापर करा.

जैमिनी - दुसऱ्या विवाहासाठी पहिल्या UL पासून 8व्या भावाच्या स्वामीने तयार केलेल्या 'दुसऱ्या उपपद लग्ना'चे (UL2) विश्लेषण करा. 

D9 आणि D60 - येणाऱ्या दुसऱ्या पत्नीचा स्वभाव, मुलांप्रती तिचे वर्तन आणि विवाहाचे यश D9 (नवमांश) च्या 2ऱ्या, 9व्या आणि 11व्या भावांच्या आधारे तपासा.

संवेदनशीलता - जातकासोबत एक मोठी शोकांतिका घडली असल्याने, फलादेश अतिशय सूक्ष्म (Micro-level) आणि स्पष्ट असावा. दुसऱ्या विवाहातही तणाव किंवा वादाचे (6, 8, 12 भाव) काही संकेत मिळाले, तर ते न लपवता स्पष्टपणे इशारा म्हणून सांगा.

वरील आतापर्यंत तुम्हाला कुंडली विश्लेषणासाठी कोणकोणती माहिती मिळाली, तिची थोडक्यात सूची द्या.

हे सुनिश्चित करा की तुम्ही खालील आदेशांचे काटेकोरपणे पालन कराल,

1] आउटपुट देण्यापूर्वी डेटाचे क्रॉसचेक करून घ्या.
2] कोणत्याही प्रकारचे शुगर-कोटिंग (Sugar-coating) करू नका. जर कुंडलीत कोणता दोष, संघर्ष किंवा नकारात्मक योग असेल, तर तो स्पष्ट आणि कडू शब्दांत सांगा. मला क्लायंटला खुश करायचे नाही, तर खरे सांगायचे आहे. लक्षात ठेवा पूर्णपणे नकारात्मक होता कामा नये, सकारात्मक आणि नकारात्मक यांचा समतोल राखून जे खरे आहे ते सांगा ।
3] तुमच्या उत्तराची सुरुवात कोणत्याही अभिवादनाने किंवा संवादात्मक वाक्यांशाने (जसे 'निश्चितपणे', 'जरूर', 'खालील आहे' इत्यादी) करू नका. तुमचे उत्तर थेट मागितलेल्या माहितीपासूनच सुरू व्हायला हवे.
4] System instructions मध्ये दिलेल्या आदेशांचेही पालन करा.

3] गोचर विश्लेषण :
➤ सर्व संभाव्य दशा कालावधीत गुरु आणि शनीचा संयुक्त प्रभाव:
वरील कुंडली डेटा आणि गोचर तपशिलांच्या आधारे, पुढील 7 वर्षांसाठी गुरु (बृहस्पति) आणि शनीच्या संयुक्त प्रभावाचा (Double Transit) एक विस्तृत तक्ता तयार करा. हे विश्लेषण पूर्णपणे ग्रहांच्या दृष्टी आणि स्थितीवर (Transit Aspects/Positions) आधारित असले पाहिजे.
तक्त्याचा फॉरमॅट आणि कॉलम:
| वेळ (कालावधी) | गुरुचा गोचर प्रभाव (D1+D9) | शनीचा गोचर प्रभाव (D1+D9) | संयुक्त प्रभाव (Double Transit) | दुसऱ्या विवाहाच्या शक्यतेचा अंतिम निष्कर्ष |
तपासणीसाठी मुख्य चेकलिस्ट निर्देश:

प्रत्येक गोचर कालावधीसाठी, खालील मुद्द्यांवर गुरु आणि शनीच्या प्रभावाची (दृष्टी किंवा युती) सूक्ष्म तपासणी करा:

1] गोचरच्या गुरु (Jupiter) साठी:
- जन्म कुंडली (D1): नवम भाव/नवमेश, लग्न/लग्नेश, लाभ भाव/लाभेश, परिवार भाव/द्वितीयेश.
- कारक: जन्म शुक्र, जन्म गुरु, चंद्र लग्न (राशी).
- नवांश (D9): नवांश लग्न आणि नवांश नवम भाव.

2] गोचरच्या शनी (Saturn) साठी:
- जन्म कुंडली (D1): लग्न/लग्नेश, नवम भाव/नवमेश, लाभ भाव/लाभेश, परिवार भाव/द्वितीयेश.
- कारक: जन्म शुक्र, जन्म गुरु, चंद्र लग्न (राशी).
- नवांश (D9): नवांश लग्न आणि नवांश नवम भाव.

तक्त्याचे नियम:
- प्रभाव कॉलम: फक्त त्या प्रभावित मुद्द्यांची नावे लिहा ज्यांचा संबंध बनत आहे (उदा.: 'नवम भाव आणि जन्म शुक्रावर दृष्टी').
- संयुक्त प्रभाव: जर गुरु आणि शनी दोघे एकत्रितपणे कोणत्याही दुसऱ्या विवाह कारकांना (विशेषतः लग्न किंवा 9व्या भावाला) प्रभावित करत असतील, तर 'सक्रिय (Double Transit Active)' लिहा.
- निष्कर्ष: प्रभावाच्या तीव्रतेवर आणि दुहेरी गोचरच्या सक्रियतेवर आधारित 'प्रबळ', 'सरासरी' किंवा 'कमी' लिहा.

➤ गोचरचे गुरु आणि शनी, दोघे एकत्रितपणे प्रभावित (दृष्टी किंवा युतीद्वारे) करत आहेत, असा कालावधी आहे का?

विश्लेषण (गोचर): दशांनी ओळखलेल्या "वेळ मर्यादे"मध्ये, दुहेरी गोचरचा नियम त्या विशिष्ट वर्षाकडे निर्देश करतो जेव्हा दुसऱ्या विवाहाची घटना घडण्याची सर्वात जास्त शक्यता असते.

वरील फाइल्स आणि उपलब्ध डेटाच्या आधारे, जातकासाठी पुढील 7 वर्षांच्या गुरु (बृहस्पति) च्या गोचरची एक विस्तृत 'दुसऱ्या विवाह केंद्रित शक्ति तक्ता' तयार करा.
तक्त्याचा फॉरमॅट आणि कॉलम (अनिवार्य):
| गोचर भाव (L/M) | वेळ (कालावधी) | SAV | BAV | BAL | गुणवत्ता | दुसऱ्या विवाहावर प्रभाव | विवाहाच्या सहाय्यक भावांवर प्रभाव | दुसऱ्या विवाहाच्या शक्यतेचा अंतिम निष्कर्ष |
डेटा प्रोसेसिंगचे कठोर नियम:
शक्ति डेटा (SAV/BAV/BAL): ही मूल्ये कुंडलीच्या अष्टकवर्ग (Sarva/Bhinna) आणि भाव-बल (Bhava Bala) विभागातून काढा.
दुसऱ्या विवाहावर प्रभाव: गोचरमधील गुरुचा 9व्या भाव, नवमेश, जन्म शुक्र किंवा जन्म गुरुशी दृष्टी/स्थिती संबंध तपासा.
सहाय्यक भावांवर प्रभाव: गुरुचा 11व्या, 2ऱ्या भावाशी किंवा जन्म शनीशी दृष्टी/स्थिती संबंध तपासा.
गुणवत्ता (Quality) लॉजिक: SAV > 28 आणि BAL > 500 असल्यास 'High', फक्त SAV > 28 असल्यास 'Medium', अन्यथा 'Low' लिहा.
अंतिम निष्कर्ष: जर 'दुसऱ्या विवाहावर प्रभाव' सक्रिय असेल आणि 'गुणवत्ता' High/Medium असेल, तर 'प्रबळ शक्यता' लिहा. जर दोन्ही कमी असतील, तर 'कमी' लिहा.

2] अर्गलाद्वारे दशेच्या गुणवत्तेचे विश्लेषण (घटना कशी असेल?):
➤ दशा राशीवर अर्गला: दुसऱ्या विवाहासाठी निवडलेल्या संभाव्य दशा राशीवर कोणत्या ग्रहांची अर्गला (हस्तक्षेप) आहे?
▸ शुभ अर्गला: त्यावर शुभ ग्रहांची (गुरु, शुक्र) अर्गला आहे का? हे एक सहज, आनंदमय आणि अडथळ्याशिवाय होणाऱ्या दुसऱ्या विवाह समारंभाचे लक्षण आहे.
▸ पाप अर्गला: त्यावर पाप ग्रहांची (शनि, राहु, मंगल) अर्गला आहे का? हे दुसऱ्या विवाहाच्या वेळी काही अडथळा, वाद (विशेषतः पहिल्या विवाहाच्या बाबतीत), खर्च किंवा कष्ट यांचे संकेत देऊ शकते.
➤ विरोध अर्गला: अर्गला करणाऱ्या ग्रहांना कोणी विरोध करत आहे का? कोणती शक्ती (अर्गला किंवा विरोध) अधिक बलवान आहे?

विश्लेषण (अर्गला): हे ठरवते की दुसऱ्या विवाहाची घटना स्वतः कशी असेल - सुगम आणि उत्सवपूर्ण की तणावपूर्ण आणि अडथळ्यांनी भरलेली.
----------
भाग 3: भृगु नंदी नाडीनुसार (BNN) दुसऱ्या विवाहाच्या वेळेचे विश्लेषण:

1] जीव कारक (गुरु) सक्रिय होणे:
➤ गोचराचा बृहस्पति (Transit Jupiter): गोचराचा बृहस्पति जन्म कुंडलीतील खालील ग्रह किंवा भावांना सक्रिय करत आहे का (त्यांच्याशी युती करत आहे, किंवा 2-12, किंवा त्यांच्यापासून त्रिकोण (1-5-9) मध्ये आहे)?
▸ जन्म कुंडलीचा बृहस्पति (Jupiter).
▸ जन्म कुंडलीचा शुक्र (Venus) आणि बुध (Mercury - जो दुसऱ्या/द्विस्वभाव संबंधाचा कारक आहे).
▸ जन्म कुंडलीचा मंगल (Mars) - (स्त्री जातकाच्या दुसऱ्या विवाहासाठी).
▸ जन्म कुंडलीचा नवम भाव किंवा नवमेश.

2] कर्मफलदाता (शनि) चे अनुमोदन:
➤ गोचराचा शनि (Transit Saturn): गोचराचा शनि जन्म कुंडलीतील खालील ग्रह किंवा भावांना सक्रिय करत आहे का (त्यांच्यावरून जात आहे, किंवा त्यांच्यावर दृष्टी टाकत आहे)?
▸ जन्म कुंडलीचा बृहस्पति (Jupiter).
▸ जन्म कुंडलीचा शुक्र (Venus) आणि बुध (Mercury).
▸ जन्म कुंडलीचा मंगल (Mars) - (स्त्री जातकाच्या दुसऱ्या विवाहासाठी).
▸ जन्म कुंडलीचा नवम भाव किंवा नवमेश.
----------
3] पुरुष आणि स्त्री कुंडलीसाठी विशिष्ट विश्लेषण:
➤ पुरुषाच्या कुंडलीत: गोचराचा गुरु जन्म कुंडलीच्या शुक्र किंवा बुधाशी संबंध बनवत आहे का?
➤ स्त्रीच्या कुंडलीत: गोचराचा गुरु जन्म कुंडलीच्या शुक्र (स्वतः) आणि मंगल (पती) यांच्याशी संबंध बनवत आहे का?

विश्लेषण:

➤ BNN नुसार, दुसरा विवाह तेव्हा होतो जेव्हा 'जीव' (गुरु) तयार असतो आणि 'कर्म' (शनि) त्याला परवानगी देतो, आणि त्याचबरोबर बुध (Mercury) चा प्रभाव सक्रिय असतो.
➤ सर्वात प्रबल काळ: ते वर्ष जेव्हा गोचराचा गुरु दुसऱ्या विवाहाच्या कारक ग्रहांना (विशेषतः शुक्र/बुध) आणि नवम भावाला सक्रिय करत असेल आणि त्याचबरोबर, गोचराचा शनिही त्याच कारक ग्रहांना किंवा भावांना आपल्या दृष्टीने किंवा युतीने अनुमोदित (approve) करत असेल.
➤ सहायक काळ: जर फक्त गुरुचा गोचर अनुकूल असेल, तरीही घटना होऊ शकते, पण जेव्हा शनिचेही अनुमोदन मिळते, तेव्हा दुसरा विवाह होणे जवळजवळ निश्चित होते.
----------
भाग 4: कृष्णमूर्ति पद्धतीनुसार (KP) दुसऱ्या विवाहाच्या वेळेचे विश्लेषण:

1] दशा विश्लेषण (संभाव्य कालावधीची पुष्टी):
➤ दशा स्वामींची योग्यता: काढलेल्या सर्व संभाव्य टाइम विंडोमध्ये विंशोत्तरी महादशा (MD), अंतर्दशा (AD), आणि प्रत्यंतर दशा (PD) चे स्वामी ग्रह दुसऱ्या विवाहासाठी "योग्य" (Qualified) आहेत का?
▸ योग्यतेची तपासणी: हे दशा स्वामी ग्रह आपल्या स्थिती, नक्षत्र स्वामी किंवा उप-स्वामी यांद्वारे दुसऱ्या विवाहाच्या प्रमुख भावांचे (2, 9, 11) प्रबल सिग्निफिकेटर बनत आहेत का?
▸ नकारात्मक भावांची तपासणी: हे दशा स्वामी त्याचबरोबर दुसऱ्या विवाहात बाधक भावांनाही (1, 8, 10 - जे 2, 9, 11 चे व्यय भाव आहेत) सिग्निफाय करत आहेत का? (जर हो, तर दुसरा विवाह संघर्ष किंवा अडथळ्यांनंतर होईल).

विश्लेषण (दशा): दशा कालावधींच्या आधारे दुसऱ्या विवाहाची संभाव्य वेळ-सीमा.
KP नुसार, दुसरा विवाह फक्त त्याच MD-AD-PD मध्ये शक्य आहे ज्याचे स्वामी ग्रह 2, 9, आणि 11 भावांचे प्रबल सिग्निफिकेटर असतील. हे पराशरी दशा विश्लेषणाला फिल्टर करण्याचा सर्वात अचूक मार्ग आहे.
----------
2] गोचराचा (Transits) वापर:

➤ प्रमुख ग्रहांचे गोचर: दशेने दर्शवलेल्या अनुकूल कालावधीत, गोचराचे बृहस्पति (Jupiter) आणि शनि (Saturn) त्या ग्रहांवरून जात आहेत का जे दुसऱ्या विवाहाचे (2, 9, 11) प्रबल सिग्निफिकेटर आहेत?

विश्लेषण (गोचर): दशा संभाव्य वर्षे आणि महिन्यांची सीमा सांगते, तर गोचर त्या सीमेतील अचूक महिना आणि दिवस निश्चित करण्यात मदत करते.
----------
जर या कालावधीत दुसरा विवाह होत नसेल तर आणखी कोणते संभाव्य कालावधी आहेत आणि प्रत्येकात किती-किती % शक्यता आहे ?

भाग 5: दुसऱ्या विवाहाच्या वेळेचा निष्कर्ष आणि समग्र अवलोकन
➤ दुसऱ्या विवाहाच्या वेळेसाठी सर्व प्रणालींच्या (पराशरी, जैमिनी, BNN, KP) मुख्य निष्कर्षांचा संक्षिप्त सारांश.
➤ कोणत्या मुद्द्यांवर विविध प्रणाली सहमत आहेत आणि कोणत्यावर त्यांचा थोडा वेगळा दृष्टिकोन आहे?
➤ सर्व विश्लेषणांच्या आधारे सर्व प्रणालींच्या सर्वसंमत कालावधीची ओळख.
➤ अंतिम निष्कर्ष : दुसऱ्या विवाहाच्या वेळेचे सर्वात संभाव्य वर्ष.

➤ जातकाने स्वतःबद्दल माहिती दिली आहे आणि जातकाचे काही प्रश्न आहेत; आधी दिलेली माहिती सूचीबद्ध करा, त्यानंतर सर्व प्रश्न सूचीबद्ध करा :

----------
दुसऱ्या विवाहाच्या वेळेचा समग्र निष्कर्ष : सुरुवातीपासून विचारलेल्या जातकाच्या वैवाहिक जीवनासंबंधी आणि जातकाने विचारलेल्या सर्व प्रश्नांच्या विश्लेषणाचा थोडक्यात निष्कर्ष द्या
----------
आता आतापर्यंत केलेल्या सर्व खालील घटनांची आणि प्रश्नांची पुन्हा लिहून त्यांची संक्षिप्त उत्तरे द्या, कारण ही यादी या विश्लेषणाच्या अगदी सुरुवातीलाच लावली जाईल; यामुळे जातक आधीच थोडक्यात उत्तरे वाचेल आणि ज्याचे विश्लेषण संदर्भासहित वाचायचे आहे, तो सेक्शन शोधेल...

जातकाचे प्रश्न :`;
        let currentLang = 'hi';
        function getRawData() {
            if (currentLang === 'en') return rawData_en;
            if (currentLang === 'mr') return rawData_mr;
            return rawData_hi;
        }
        function changeLanguage(lang) {
            currentLang = lang;
            document.getElementById('prompt-container').innerHTML = '';
            processData();
        }

        // सेपरेटर लॉजिक: --- या ___ लाइन्स से अलग करना
        const separatorRegex = /\n-{10,}\n|\n_{10,}\n/g;
        
        function processData() {
            const container = document.getElementById('prompt-container');
            // पहले डैश लाइन्स से तोडें
            let parts = getRawData().split(separatorRegex);

            parts.forEach((part, index) => {
                let cleanText = part.trim();
                
                // फिल्टरिंग लॉजिक
                const lines = cleanText.split('\n');
                const filteredLines = lines.filter(line => {
                    const l = line.trim();
                    // जंक (MMM... RRR... PPPP...) हटाएं
                    if (l.match(/^[M|P|C|H|R]{5,}$/)) return false;
                    // सिर्फ डैश वाली लाइन हटाएं
                    if (l.match(/^-{5,}$/)) return false;
                    return true;
                });
                
                cleanText = filteredLines.join('\n').trim();

                if (cleanText.length > 5) { // खाली या बहुत छोटी स्ट्रिंग न दिखाएं
                    createCard(cleanText, index + 1);
                }
            });
        }

        function createCard(text, id) {
            const container = document.getElementById('prompt-container');
            
            const card = document.createElement('div');
            card.className = 'card';

            const header = document.createElement('div');
            header.className = 'card-header';
            header.innerHTML = `<span>Prompt #${id}</span>`;

            const content = document.createElement('div');
            content.className = 'card-content';
            content.innerText = text;

            const btn = document.createElement('button');
            btn.className = 'btn';
            btn.innerText = 'Copy Prompt';
            btn.onclick = () => copyText(text, btn);

            card.appendChild(header);
            card.appendChild(content);
            card.appendChild(btn);
            container.appendChild(card);
        }

        function showBtnFeedback(btn, success){
            if(!btn) return;
            var origText = btn.innerText;
            var origBg = btn.style.backgroundColor;
            btn.innerText = success ? "\u2713 Copied!" : "\u2717 Failed";
            btn.style.backgroundColor = success ? "#2e7d32" : "#c62828";
            btn.style.color = "#fff";
            setTimeout(function(){ btn.innerText = origText; btn.style.backgroundColor = origBg; }, 2000);
        }
        function copyText(text, btn) {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(() => {
                    showToast();
                    showBtnFeedback(btn, true);
                }).catch(err => {
                    fallbackCopy(text, btn);
                });
            } else {
                fallbackCopy(text, btn);
            }
        }

        function fallbackCopy(text, btn) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed'; // Avoid scrolling to bottom
            document.body.appendChild(textarea);
            textarea.focus();
            textarea.select();
            try {
                var ok = document.execCommand('copy');
                showToast();
                showBtnFeedback(btn, ok);
            } catch (err) {
                console.error('Fallback: Oops, unable to copy', err);
                showBtnFeedback(btn, false);
            }
            document.body.removeChild(textarea);
        }

        function showToast() {
            var x = document.getElementById("snackbar");
            x.className = "toast show";
            setTimeout(function(){ x.className = x.className.replace("show", ""); }, 3000);
        }

        // Initialize
        processData();

    </script>
