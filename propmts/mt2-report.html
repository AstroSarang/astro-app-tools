विषय: वैदिक ज्योतिष - ग्रह एवं भावों के लिए पुष्कर नवांश (PN), पुष्कर भाग (PB) और मृत्यु भाग (MB) की गणना एवं फलादेश।

​▸ संघर्ष एवं बाधाएं (MB Impact): मृत्यु भाग वाले ग्रह जीवन के किन क्षेत्रों में 'लैंडमाइन' की तरह बाधा पैदा कर सकते हैं?

▸ PN और PB की गणना में देखें कि क्या उनका 'भावेश' MB में है ?
(यदि भाव का स्वामी (Bhavesh) मृत्यु भाग में है, तो भाव के पुष्कर होने पर भी फल बाधित होगा)

प्रांप्ट्स का अनुकूलन (Prompt Adaptation) मैं आगे जो भी विश्लेषण के प्रांप्ट्स (Prompts) दूंगा, हो सकता है वे 'पहले विवाह' या सामान्य वैवाहिक जीवन के लिए डिज़ाइन किए गए हों। लेकिन तुम्हें अपनी बुद्धिमत्ता का प्रयोग करके उन सभी प्रांप्ट्स को 'दूसरे विवाह' के नियमों (जैसे 2रे भाव, 9वें भाव, 2nd CSL, 9th CSL और जैमिनी के दूसरे उपपद लग्न - UL2) के अनुसार ही डिकोड करना है।

➤ पद्धतियों का सही उपयोग

जैमिनी दूसरे विवाह के लिए पहले UL से 8वें भाव के स्वामी द्वारा बनाए गए 'दूसरे उपपद लग्न' (UL2) का विश्लेषण करना।

3] गोचर विश्लेषण :
➤ सभी संभावित दशा अवधि में गुरु और शनि का संयुक्त प्रभाव:
उपरोक्त कुंडली डेटा और गोचर विवरणों के आधार पर, अगले 7 वर्षों के लिए गुरु (बृहस्पति) और शनि के संयुक्त प्रभाव (Double Transit) की एक विस्तृत तालिका तैयार करें। यह विश्लेषण पूरी तरह से ग्रहों की दृष्टि और स्थिति (Transit Aspects/Positions) पर आधारित होना चाहिए।
तालिका का प्रारूप और कॉलम:
| समय (अवधि) | गुरु का गोचर प्रभाव (D1+D9) | शनि का गोचर प्रभाव (D1+D9) | संयुक्त प्रभाव (Double Transit) | दूसरे विवाह की संभावना का अंतिम निष्कर्ष |
जाँच के लिए मुख्य चेकलिस्ट निर्देश:

प्रत्येक गोचर अवधि के लिए, निम्नलिखित बिंदुओं पर गुरु और शनि के प्रभाव (दृष्टि या युति) की सूक्ष्मता से जाँच करें:

1] गोचर के गुरु (Jupiter) के लिए:
- जन्म कुंडली (D1): नवम भाव/नवमेश, लग्न/लग्नेश, लाभ भाव/लाभेश, परिवार भाव/द्वितीयेश।
- कारक: जन्म शुक्र, जन्म गुरु, चंद्र लग्न (राशि)।
- नवांश (D9): नवांश लग्न और नवांश नवम भाव।

2] गोचर के शनि (Saturn) के लिए:
- जन्म कुंडली (D1): लग्न/लग्नेश, नवम भाव/नवमेश, लाभ भाव/लाभेश, परिवार भाव/द्वितीयेश।
- कारक: जन्म शुक्र, जन्म गुरु, चंद्र लग्न (राशि)।
- नवांश (D9): नवांश लग्न और नवांश नवम भाव।

तालिका के नियम:
- प्रभाव कॉलम: केवल उन प्रभावित बिंदुओं के नाम लिखें जिनका संबंध बन रहा है (जैसे: 'नवम भाव और जन्म शुक्र पर दृष्टि')।
- संयुक्त प्रभाव: यदि गुरु और शनि दोनों एक साथ किन्हीं दूसरे विवाह कारकों (विशेषकर लग्न या 9वें भाव) को प्रभावित कर रहे हैं, तो 'सक्रिय (Double Transit Active)' लिखें।
- निष्कर्ष: प्रभाव की तीव्रता और दोहरे गोचर की सक्रियता के आधार पर 'प्रबल', 'औसत' या 'न्यून' लिखें।

➤ क्या गोचर के गुरु और शनि, दोनों एक साथ प्रभावित (दृष्टि या युति द्वारा) कर रहे हैं, ऐसी अवधि है?

विश्लेषण (गोचर): दशा द्वारा पहचानी गई "समय सीमा" के भीतर, दोहरे गोचर का नियम उस विशिष्ट वर्ष को इंगित करता है जब दूसरे विवाह की घटना घटित होने की सबसे अधिक संभावना है।
------------------------------------------
उपरोक्त फाइलों और उपलब्ध डेटा के आधार पर, जातक के लिए अगले 7 वर्षों के गुरु (बृहस्पति) के गोचर की एक विस्तृत 'दूसरे विवाह केंद्रित शक्ति तालिका' तैयार करें।
​तालिका का प्रारूप और कॉलम (अनिवार्य):
| गोचर भाव (L/M) | समय (अवधि) | SAV | BAV | BAL | गुणवत्ता | दूसरे विवाह पर प्रभाव | विवाह के सहायक भावों पर प्रभाव | दूसरे विवाह की संभावना का अंतिम निष्कर्ष |
​डेटा प्रोसेसिंग के सख्त नियम:
​शक्ति डेटा (SAV/BAV/BAL): इन मानों को कुंडली के अष्टकवर्ग (Sarva/Bhinna) और भाव-बल (Bhava Bala) खंड से निकालें।
​दूसरे विवाह पर प्रभाव: गुरु का गोचर में 9वें भाव, नवमेश, जन्म शुक्र, या जन्म गुरु से दृष्टि/स्थिति संबंध जाँचे।
​सहायक भावों पर प्रभाव: गुरु का 11वें, 2रे भाव या जन्म शनि से दृष्टि/स्थिति संबंध जाँचे।
​गुणवत्ता (Quality) लॉजिक: SAV > 28 और BAL > 500 होने पर 'High', केवल SAV > 28 होने पर 'Medium', अन्यथा 'Low' लिखें।
​अंतिम निष्कर्ष: यदि 'दूसरे विवाह पर प्रभाव' सक्रिय है और 'गुणवत्ता' High/Medium है, तो 'प्रबल संभावना' लिखें। यदि दोनों कम हैं, तो 'न्यून' लिखें।
------------------------------------------
SAV/BAV गलत हो गए सभी, मिसमैच हो गए, राशी के अनुसार लो.
------------------------------------------
4] बल और क्षमता का विश्लेषण (गोचर की पुष्टि के लिए) :
➤ अष्टकवर्ग :
A] सर्वाष्टकवर्ग:
a) क्या गोचर का बृहस्पति नवम भाव में या लग्न में अनुकूल बिंदुओं (28 से अधिक) वाली राशि से गुजर रहा है?

c) क्या गोचर का बृहस्पति निकाली गयी द्वितीय प्रबल टाइम विंडो में अनुकूल बिंदुओं (28 से अधिक) वाली राशि से गुजर रहा है?

B] भिन्नाष्टकवर्ग:

b) क्या गोचर का बृहस्पति निकाली गयी द्वितीय प्रबल टाइम विंडो में, शुक्र के भिन्नाष्टकवर्ग में 5 या अधिक बिंदुओं वाली राशि से गुजर रहा है?
c) क्या गोचर का गुरु उस राशि से गुजर रहा है जहाँ नवमेश (9th Lord) बैठा है और उस राशि को सर्वाष्टकवर्ग में अच्छे बिंदु प्राप्त हैं?

➤ षड्बल-भावबल :
​▸ क्या निकाली गयी सभी संभावित टाइम विंडो में दशा स्वामी (MD/AD/PD lords) षड्बल में बलवान हैं?
▸ क्या जन्म कुंडली का नवम भाव भाव बल में मजबूत है?

विश्लेषण (बल): यह पुष्टि करता है कि क्या ग्रह और भाव फल देने में सक्षम हैं। बलवान ग्रह और भाव गोचर के दौरान निश्चित रूप से फल देते हैं।

▸ जन्म कुंडली का बृहस्पति (Jupiter)।
▸ जन्म कुंडली का शुक्र (Venus) और बुध (Mercury)।
▸ जन्म कुंडली का मंगल (Mars) - (स्त्री जातक के दूसरे विवाह के लिए)।
▸ जन्म कुंडली का नवम भाव या नवमेश।

3] पुरुष और स्त्री कुंडली के लिए विशिष्ट विश्लेषण:
➤ पुरुष की कुंडली में: क्या गोचर का गुरु जन्म कुंडली के शुक्र या बुध से संबंध बना रहा है?
➤ स्त्री की कुंडली में: क्या गोचर का गुरु जन्म कुंडली के शुक्र (स्वयं) और मंगल (पति) से संबंध बना रहा है?

विश्लेषण:

➤ BNN के अनुसार, दूसरा विवाह तब होता है जब "जीव" (गुरु) तैयार होता है और "कर्म" (शनि) उसे अनुमति देता है, और साथ ही बुध (Mercury) का प्रभाव सक्रिय होता है।
➤ सबसे प्रबल समय: वह वर्ष जब गोचर का गुरु दूसरे विवाह के कारक ग्रहों (विशेषकर शुक्र/बुध) और नवम भाव को सक्रिय कर रहा हो और साथ ही, गोचर का शनि भी उन्हीं कारक ग्रहों या भावों को अपनी दृष्टि या युति से अनुमोदित (approve) कर रहा हो।
➤ सहायक समय: यदि केवल गुरु का गोचर अनुकूल हो, तो भी घटना हो सकती है, लेकिन जब शनि का भी अनुमोदन मिल जाता है, तो दूसरे विवाह का होना लगभग निश्चित हो जाता है।

भाग 4: कृष्णमूर्ति पद्धति (KP) के अनुसार दूसरे विवाह के समय का विश्लेषण:

1] दशा विश्लेषण (संभावित अवधि की पुष्टि):
➤ दशा स्वामियों की योग्यता: क्या निकाली गयी सभी संभावित टाइम विंडो में विंशोत्तरी महादशा (MD), अंतर्दशा (AD), और प्रत्यंतर दशा (PD) के स्वामी ग्रह दूसरे विवाह के लिए "योग्य" (Qualified) हैं?
▸ योग्यता की जांच: क्या ये दशा स्वामी ग्रह अपनी स्थिति, नक्षत्र स्वामी या उप-स्वामी के माध्यम से दूसरे विवाह के प्रमुख भावों (2, 9, 11) के प्रबल सिग्निफिकेटर बन रहे हैं?
▸ नकारात्मक भावों की जांच: क्या ये दशा स्वामी साथ-ही-साथ दूसरे विवाह में बाधक भावों (1, 8, 10 - जो 2, 9, 11 के व्यय भाव हैं) को भी सिग्निफाई कर रहे हैं? (यदि हाँ, तो दूसरा विवाह संघर्ष या बाधाओं के बाद होगा)।

विश्लेषण (दशा): दशा अवधियों के आधार पर दूसरे विवाह की संभावित समय-सीमा।
KP के अनुसार, दूसरा विवाह केवल उसी MD-AD-PD में संभव है जिसके स्वामी ग्रह 2, 9, और 11 भावों के प्रबल सिग्निफिकेटर हों। यह पराशरी दशा विश्लेषण को फ़िल्टर करने का सबसे सटीक तरीका है।
------------------------------------------
2] गोचर (Transits) का उपयोग:

➤ प्रमुख ग्रहों का गोचर: दशा द्वारा इंगित अनुकूल अवधि में, क्या गोचर के बृहस्पति (Jupiter) और शनि (Saturn) उन ग्रहों के ऊपर से गुजर रहे हैं जो दूसरे विवाह (2, 9, 11) के प्रबल सिग्निफिकेटर हैं?

विश्लेषण (गोचर): दशा संभावित वर्षों और महीनों की सीमा बताती है, जबकि गोचर उस सीमा के भीतर सटीक महीने और दिन को इंगित करने में मदद करता है।
------------------------------------------
अगर इस अवधि में दूसरा विवाह नही होता है तो और कौनसी संभावित अवधि है और कितने कितने % संभावना है ?

भाग 5: दूसरे विवाह के समय का निष्कर्ष और समग्र अवलोकन
➤ दूसरे विवाह के समय के लिए सभी प्रणालियों (पराशरी, जैमिनी, BNN, KP) के मुख्य निष्कर्षों का संक्षिप्त सारांश।
➤ किन बिंदुओं पर विभिन्न प्रणालियां सहमत हैं और किन पर थोड़ा भिन्न दृष्टिकोण है?
➤ सभी विश्लेषणों के आधार पर सभी प्रणालिओं के सर्वसम्मत अवधि की पहचान।
➤ अंतिम निष्कर्ष : दूसरे विवाह के समय का सबसे संभावित वर्ष।
------------------------------------------
➤ जातक ने अपने बारे में जानकरी दी है और जातक के कुछ सवाल है, पहले दी हुयी जानकारी को सूचीबद्ध कीजिये, उसके बाद सभी सवाल सूचीबद्ध कीजिये :
-----------------------------------------
अब दी हुयी जानकारी का गहन शोध करके ज्योतिषीय विश्लेषण विस्तार से और निष्कर्ष देकर कीजिये, एक एक घटना का विस्तार से विश्लेषण होना चाहिए, अगर उपाय आवश्यक हो तो उपाय सहित, सबसे पहले पहले सवाल का जबाव दीजिये, बाकि के बाद में पूछता हु.
-----------------------------------------
अब दिए हुए सवालो का जवाब गहन शोध करके लिखिए विस्तार से विश्लेषण और निष्कर्ष देकर कीजिये, एक एक सवाल का विस्तार से विश्लेषण होना चाहिए,उपाय सहित, सबसे पहले पहले सवाल का जबाव दीजिये, बाकि के बाद में पूछता हु.
------------------------------------------
दूसरे विवाह के समय का समग्र निष्कर्ष : शुरुआत से पुछे गए जातक के वैवाहिक जीवन संबधी और जातक द्वारा पूछे गए सभी सवालों के विश्लेषण का शोर्ट में निष्कर्ष दीजिए
------------------------------------------
अब तक किये गए सभी निम्मलिखित घटनाओं और सवालों को फिर से लिखकर उनका संक्षिप्त उत्तर दीजिये, क्योंकि यह सूचि इस विश्लेषण के सबसे पहले लगायी जाएगी, इससे जातक पहले ही शार्ट में जवाब पढ़ लेगा और उसे जिस बात का विश्लेषण संदर्भ सहित पढना है, उस सेक्शन को ढूंढेगा...

जातक के प्रश्न :
`;

        // सेपरेटर लॉजिक: --- या ___ लाइन्स से अलग करना
        const separatorRegex = /\n-{10,}\n|\n_{10,}\n/g;
        
        function processData() {
            const container = document.getElementById('prompt-container');
            // पहले डैश लाइन्स से तोडें
            let parts = rawData.split(separatorRegex);

            parts.forEach((part, index) => {
                let cleanText = part.trim();
                
                // फिल्टरिंग लॉजिक
                const lines = cleanText.split('\n');
                const filteredLines = lines.filter(line => {
                    const l = line.trim();
                    // जंक (MMM... RRR... PPPP...) हटाएं
                    if (l.match(/^[M|P|C|H|R]{5,}$/)) return false;
                    // सिर्फ डैश वाली लाइन हटाएं
                    if (l.match(/^-{5,}$/)) return false;
                    return true;
                });
                
                cleanText = filteredLines.join('\n').trim();

                if (cleanText.length > 5) { // खाली या बहुत छोटी स्ट्रिंग न दिखाएं
                    createCard(cleanText, index + 1);
                }
            });
        }

        function createCard(text, id) {
            const container = document.getElementById('prompt-container');
            
            const card = document.createElement('div');
            card.className = 'card';

            const header = document.createElement('div');
            header.className = 'card-header';
            header.innerHTML = `<span>Prompt #${id}</span>`;

            const content = document.createElement('div');
            content.className = 'card-content';
            content.innerText = text;

            const btn = document.createElement('button');
            btn.className = 'btn';
            btn.innerText = 'Copy Prompt';
            btn.onclick = () => copyText(text, btn);

            card.appendChild(header);
            card.appendChild(content);
            card.appendChild(btn);
            container.appendChild(card);
        }

        function showBtnFeedback(btn, success){
            if(!btn) return;
            var origText = btn.innerText;
            var origBg = btn.style.backgroundColor;
            btn.innerText = success ? "\u2713 Copied!" : "\u2717 Failed";
            btn.style.backgroundColor = success ? "#2e7d32" : "#c62828";
            btn.style.color = "#fff";
            setTimeout(function(){ btn.innerText = origText; btn.style.backgroundColor = origBg; }, 2000);
        }
        function copyText(text, btn) {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(() => {
                    showToast();
                    showBtnFeedback(btn, true);
                }).catch(err => {
                    fallbackCopy(text, btn);
                });
            } else {
                fallbackCopy(text, btn);
            }
        }

        function fallbackCopy(text, btn) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed'; // Avoid scrolling to bottom
            document.body.appendChild(textarea);
            textarea.focus();
            textarea.select();
            try {
                var ok = document.execCommand('copy');
                showToast();
                showBtnFeedback(btn, ok);
            } catch (err) {
                console.error('Fallback: Oops, unable to copy', err);
                showBtnFeedback(btn, false);
            }
            document.body.removeChild(textarea);
        }

        function showToast() {
            var x = document.getElementById("snackbar");
            x.className = "toast show";
            setTimeout(function(){ x.className = x.className.replace("show", ""); }, 3000);
        }

        // Initialize
        processData();

    </script>
