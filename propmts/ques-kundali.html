विश्लेषण: जीवनसाथीचे करिअर व सार्वजनिक प्रतिष्ठा आणि त्याचा विवाहावरील प्रभाव.

9] सासरच्यांशी संबंध (8th House):
➤ अष्टम भाव कोणत्या राशीत आहे आणि त्याचा स्वामी कुठे स्थित आहे? (नक्षत्र, स्वामी)
➤ अष्टम भावात कोणकोणते ग्रह स्थित आहेत किंवा त्यावर दृष्टी टाकत आहेत?

विश्लेषण: सासरच्या कुटुंबाशी संबंध, त्यांचे स्वरूप आणि विवाहावरील त्यांचा प्रभाव.

10] चंद्र आणि सप्तम भाव यांचा संबंध:
➤ चंद्र कोणत्या भावात स्थित आहे?
➤ चंद्र कोणत्या नक्षत्रात स्थित आहे?
➤ सप्तम भाव किंवा सप्तमेश यांच्याशी त्याचा संबंध आहे का?
➤ चंद्रावर कोणकोणते ग्रह प्रभाव टाकत आहेत?
➤ सप्तम भावाशी संबंधित ग्रह चंद्राच्या नक्षत्रात आहे का? चंद्रासोबत युत, दृष्ट आहे का?

वरील सर्व तपशीलांमधून माहिती काढा आणि विश्लेषणही करा; "विश्लेषण:" मुद्द्यांचे विश्लेषण करा. उत्तरांसोबत प्रश्नही लिहा

विश्लेषण: जातकाची भावनिक सुसंगती, मानसिक शांती आणि वैवाहिक संबंधातील भावनिक स्थैर्य.

भाग 2: जैमिनी ज्योतिषानुसार विवाहाचे विश्लेषण:

1] दाराकारक (DK - Darakaraka):

➤ जैमिनी पद्धतीने दाराकारक ग्रह कोणता आहे? (सर्वांत कमी अंश असलेला ग्रह)
➤ दाराकारक कोणत्या राशीत आणि भावात स्थित आहे?
➤ दाराकारकासोबत कोणकोणत्या ग्रहांची (चर कारक) युती आहे?
➤ दाराकारकावर कोणत्या राशींची जैमिनी राशी दृष्टी आहे? (चर, स्थिर, द्विस्वभाव)
➤ दाराकारक कोणत्या नवमांशात स्थित आहे?
➤ दाराकारक कोणत्या नक्षत्रात स्थित आहे?

विश्लेषण: जीवनसाथीचा स्वभाव, व्यक्तिमत्त्व आणि मुख्य गुण.

2] उपपद लग्न (UL - Upapada Lagna):

➤ उपपद लग्न कोणते आहे आणि ते कोणत्या राशीत आणि भावात स्थित आहे?
➤ यात कोणकोणते ग्रह (चर कारक) स्थित आहेत?
➤ यावर कोणत्या राशींची जैमिनी राशी दृष्टी आहे? (चर, स्थिर, द्विस्वभाव)

विश्लेषण: विवाहाची गुणवत्ता, स्थिरता आणि जीवनसाथीच्या कुटुंबाची स्थिती.

3] दारापद (Darapada - A7):
➤ A7 (दारापद) कोणत्या राशीत आणि भावात स्थित आहे?
➤ A7 मध्ये कोणकोणते ग्रह (चर कारक) स्थित आहेत?
➤ A7 वर कोणत्या राशींची जैमिनी राशी दृष्टी आहे? (चर, स्थिर, द्विस्वभाव)

विश्लेषण: संबंधांत जातकाची बाह्य ओळख.

4] स्वांश आणि कारकांश यांवरून विवाहाचे विश्लेषण (आत्म्याच्या दृष्टिकोनातून):

A] स्वांश सप्तम भाव (आंतरिक वैवाहिक जीवन):
➤ स्वांश लग्नापासून सप्तम भावात कोणती राशी आणि ग्रह आहेत?
➤ स्वांश सप्तमेश कुठे स्थित आहे?
➤ स्वांश सप्तमेश कोणत्या ग्रहांसोबत युतीत आहे?

विश्लेषण: हे विवाहाची वास्तविक आणि आंतरिक गुणवत्ता, जीवनसाथीचा आंतरिक स्वभाव आणि विवाहानंतरचे तुमचे भाग्य दर्शवते. हे दाखवते की तुमच्या आत्म्याला विवाहाबद्दल "आतून" कसे वाटेल.

B] कारकांश सप्तम भाव (बाह्य वैवाहिक अनुभव):
➤ कारकांश लग्नापासून सप्तम भावात कोणती राशी आणि ग्रह आहेत?
➤ कारकांश सप्तमेश कुठे स्थित आहे?
➤ कारकांश सप्तमेश कोणत्या ग्रहांसोबत युतीत आहे?

विश्लेषण: हे तुमच्या वैवाहिक जीवनाचे कर्म आणि भाग्य दर्शवते. हे सांगते की या जीवनात तुमच्या आत्म्याला विवाहाच्या माध्यमातून कोणत्या प्रकारच्या "अनुभवां"तून किंवा "कर्मां"तून जावे लागणार आहे. हे विवाहाचा अधिक घटना-उन्मुख (event-oriented) पक्ष दाखवते.

5] UL आणि DK यांचा परस्पर संबंध:

➤ UL आणि DK एकमेकांवर जैमिनी राशी दृष्टी टाकत आहेत का?
➤ ते एकमेकांपासून शुभ भावांत (केंद्र, त्रिकोण) आहेत का?

विश्लेषण: विवाहाची शक्यता आणि संबंधाची खोली.

6] अर्गला विश्लेषण (अप्रत्यक्ष हस्तक्षेप आणि संसाधनांचा प्रवाह):

A) सप्तम भावावरील अर्गला: विवाहाच्या "संस्थेला" कोणत्या ग्रहांकडून सतत सहकार्य किंवा अडथळा मिळत आहे?
➤ सप्तम भावापासून दुसऱ्या, चौथ्या, अकराव्या आणि पाचव्या भावात कोणते ग्रह (शुभ/पाप) आहेत?
या अर्गलांना विरोध करणारे ग्रह (बाराव्या, दहाव्या, तिसऱ्या आणि नवव्या भावात) अस्तित्वात आहेत का? कोण अधिक बलवान आहे?

विश्लेषण: विवाहाची एकंदरीत सुलभता, त्यातील बाह्य आव्हाने आणि सुखाची पातळी.

B) दाराकारकावर (DK) अर्गला: जीवनसाथीला कोणत्या ग्रहांकडून सतत सहकार्य किंवा अडथळा मिळत आहे?
➤ DK ज्या भावात आहे, त्यापासून दुसऱ्या, चौथ्या, अकराव्या आणि पाचव्या भावात कोणते ग्रह आहेत? या अर्गलांचा विरोध होत आहे का?

विश्लेषण: जीवनसाथीचे भाग्य, त्याचे आरोग्य आणि नात्याच्या आंतरिक गतिशीलतेवर होणारा परिणाम.

C) उपपद लग्नावर (UL) अर्गला: विवाहाच्या स्थिरतेवर कोणत्या शक्ती परिणाम करत आहेत?
➤ UL ज्या भावात आहे, त्यापासून दुसऱ्या, चौथ्या, अकराव्या आणि पाचव्या भावात कोणते ग्रह आहेत? या अर्गलांचा विरोध होत आहे का?

विश्लेषण: विवाहाचे दीर्घायुष्य आणि त्याला मिळणारे सामाजिक/कौटुंबिक समर्थन.

वरील सर्व तपशीलांमधून माहिती काढा आणि विश्लेषणही करा; "विश्लेषण:" मुद्द्यांचे विश्लेषण करा; सोबत ग्रहाची अवस्था (उच्च, नीच, नीचभंग, अस्त, वक्री, शत्रू-मित्र-सम राशी) कंसातही लिहा. उत्तरांसोबत प्रश्नही लिहा

भाग 3: भृगु नंदी नाडीनुसार (BNN) जीवनसाथीचे विश्लेषण:

1] गुरू (Jupiter) - जीव कारकाची स्थिती आणि संबंध:

➤ गुरू कोणत्या राशीत आहे (आणि किती डिग्रीवर आहे)?
➤ गुरू कोणत्या ग्रहाच्या नक्षत्रात आहे?
➤ गुरूसोबत युतीत कोणते ग्रह आहेत?
➤ गुरूपासून दुसऱ्या आणि बाराव्या राशीत कोणते ग्रह आहेत?
➤ गुरूपासून त्रिकोणात (1-5-9) कोणते ग्रह आहेत?
विश्लेषण: जातकाचे मूळ व्यक्तिमत्त्व, स्वभाव, भाग्य आणि विवाहाबद्दलचा दृष्टिकोन.

2] जीवनसाथी कारकाची स्थिती आणि संबंध (पुरुषासाठी शुक्र, स्त्रीसाठी मंगळ):

➤ कुंडलीच्या जेंडरनुसार जीवनसाथी कारक ग्रह निवडा (पुरुष जातक = शुक्र, स्त्री जातक = मंगळ).
➤ हा कारक ग्रह कोणत्या राशीत आहे (आणि किती डिग्रीवर आहे)?
➤ हा कारक ग्रह कोणत्या ग्रहाच्या नक्षत्रात आहे?
➤ या कारक ग्रहासोबत युतीत कोणते ग्रह आहेत?
➤ या कारक ग्रहापासून दुसऱ्या आणि बाराव्या राशीत कोणते ग्रह आहेत?
➤ या कारक ग्रहापासून त्रिकोणात (1-5-9) कोणते ग्रह आहेत?
विश्लेषण: जीवनसाथीची मूळ प्रकृती, रंग-रूप, वागणूक आणि वैवाहिक सुखाची गुणवत्ता.

3] जीव/स्वतः आणि जीवनसाथी यांचा परस्पर संबंध - विवाहाचे मुख्य सूत्र:

➤ पुरुषाच्या कुंडलीत: गुरू (जीव) आणि शुक्र (पत्नी) युती, 2-12 किंवा 1-5-9 संबंधात आहेत का?
➤ स्त्रीच्या कुंडलीत: शुक्र (स्वतः स्त्री देह) आणि मंगळ (पती) युती, 2-12 किंवा 1-5-9 संबंधात आहेत का?
➤ जर युती असेल, तर त्यांच्या डिग्रीत किती निकटता आहे? इतर कोणता परस्पर संबंध?
विश्लेषण: विवाहाची प्रबलता, पती-पत्नी यांच्यातील परस्पर संबंधाचे स्वरूप आणि वैवाहिक आनंद.

4] इतर महत्त्वाच्या ग्रहांचा प्रभाव:

➤ शनी (कर्म): शनीचा जीवनसाथी कारक ग्रहाशी (पुरुषासाठी शुक्र, स्त्रीसाठी मंगळ) काय संबंध आहे (युती, 2-12, 1-5-9)?
➤ राहू आणि केतू: राहू/केतूचा जीवनसाथी कारक ग्रह किंवा विवाह सूत्राशी (गुरू-शुक्र किंवा शुक्र-मंगळ) काय संबंध आहे? (हे वेगळेपणा, आंतरजातीय विवाह किंवा अडथळे दर्शवते).
➤ वक्री ग्रह: जीवनसाथी कारक ग्रह, गुरू, किंवा त्यांवर प्रभाव टाकणारा कोणताही ग्रह वक्री (Retrograde) आहे का?

वरील सर्व तपशीलांमधून माहिती काढा आणि विश्लेषणही करा; "विश्लेषण:" मुद्द्यांचे विश्लेषण करा; सोबत ग्रह वक्री असल्यास तेही कंसात लिहा. उत्तरांसोबत प्रश्नही लिहा

भाग 4: कृष्णमूर्ति पद्धतीनुसार (KP) विवाह आणि जीवनसाथीचे विश्लेषण:

1] विवाहाचे वचन (Promise of Marriage):
➤ 7व्या भावाचा कस्पल सब-लॉर्ड (CSL) कोण आहे?
➤ हा CSL कोणत्या भावांना सिग्निफाय करत आहे (विशेषतः 2, 7, 11 भावांच्या संबंधात)?
➤ हा CSL विवाह नाकारणाऱ्या भावांनाही (जसे 1, 6, 8, 10, 12 - जे वेगळेपणा किंवा विलंब दर्शवतात) सिग्निफाय करत आहे का?

विश्लेषण: कुंडलीत विवाहाचे स्पष्ट वचन आहे की अडथळे/नकाराची शक्यता आहे? (विवाहाच्या वचनाची 100 पैकी किती टक्के शक्यता आहे?)

2] विवाहातील विलंबाचे योग (Delay in & Obstacles in Marriage):

➤ 7th CSL शनी आहे का, किंवा शनीच्या नक्षत्रात बसला आहे का?
➤ 7th CSL प्रबलपणे 8व्या भावाला (अडथळा, विलंब आणि अचानक अडचण) सिग्निफाय करत आहे का?
➤ 7th CSL प्रबलपणे 12व्या भावाला (विवाह विरक्ती, दूर जाणे आणि एकांत) तसेच 1, 6, 10 भावांना (विवाहाचे अडथळा भाव) सिग्निफाय करत आहे का?

विश्लेषण: विवाह सामान्य वयात होईल, लवकर होईल, की यात असामान्य विलंब (Late Marriage) आणि मोठ्या अडथळ्यांचे स्पष्ट योग आहेत? विलंबाचे मुख्य ज्योतिषीय कारण काय आहे?

3] जीवनसाथीची प्रकृती आणि वैवाहिक संबंध (Nature of Spouse & Marital Relations):
➤ 7व्या CSL चा नक्षत्र स्वामी कोण आहे आणि तो कुठे स्थित आहे?
➤ 7व्या CSL चा उप-स्वामी कोण आहे आणि तो कुठे स्थित आहे?
➤ 7व्या CSL चा SSL कोण आहे आणि तो कुठे स्थित आहे?
➤ विवाहाशी संबंधित भावांना (2, 7, 11) सिग्निफाय करणारे प्रमुख ग्रह कोणते आहेत आणि त्यांची स्थिती काय आहे?

विश्लेषण: जीवनसाथीचा साधारण स्वभाव, व्यक्तिमत्त्व आणि वैवाहिक संबंधाची एकंदरीत गुणवत्ता.

4] वैवाहिक जीवनाची गुणवत्ता आणि वेगळेपणा (Quality of Married Life & Separation):
➤ 7th CSL विवाहासाठी शुभ भावांना (2, 7, 11) दृढपणे दाखवत आहे का?

(हा भाग करियरमधील पद, अधिकार, आत्म्याचा उद्देश आणि सार्वजनिक प्रतिमा समजून घेण्यासाठी आहे.)

1] आत्मकारक (AK) आणि अमात्यकारक (AmK) - आत्म्याचा उद्देश आणि सल्लागार:
A] आत्मकारक (AK):

➤ जैमिनी पद्धतीने आत्मकारक ग्रह कोणता आहे? (सर्वात जास्त अंश असलेला ग्रह)
➤ आत्मकारक कोणत्या राशीत आणि भावात स्थित आहे?
➤ आत्मकारकासोबत कोणकोणत्या ग्रहांची (चर कारक) युती आहे?
➤ आत्मकारकावर कोणत्या राशींची जैमिनी राशी दृष्टी आहे? (चर, स्थिर, द्विस्वभाव)
➤ आत्मकारक कोणत्या नवमांशात स्थित आहे?
➤ आत्मकारक कोणत्या नक्षत्रात स्थित आहे?

B] अमात्यकारक (AmK):

➤ जैमिनी पद्धतीने अमात्यकारक ग्रह कोणता आहे? (दुसऱ्या क्रमांकाचा सर्वात जास्त अंश असलेला ग्रह)
➤ अमात्यकारक कोणत्या राशीत आणि भावात स्थित आहे?
➤ अमात्यकारकासोबत कोणकोणत्या ग्रहांची (चर कारक) युती आहे?
➤ अमात्यकारकावर कोणत्या राशींची जैमिनी राशी दृष्टी आहे? (चर, स्थिर, द्विस्वभाव)
➤ अमात्यकारक कोणत्या नवमांशात स्थित आहे?
➤ अमात्यकारक कोणत्या नक्षत्रात स्थित आहे?

विश्लेषण: AmK जातकाच्या आत्म्याचा मूळ उद्देश आणि जीवनाची दिशा दर्शवतो. AmK त्या सल्लागाराचे किंवा माध्यमाचे (करियर/मंत्री) प्रतिनिधित्व करतो जो तो उद्देश साध्य करण्यात मदत करतो.

2] AK आणि AmK चा परस्पर संबंध - उद्देश आणि मार्गातील सुसंगती:
➤ AK आणि AmK एकमेकांपासून शुभ भावांमध्ये स्थित आहेत का (जसे केंद्र 1, 4, 7, 10; त्रिकोण 1, 5, 9; किंवा 3/11 चा संबंध)?
➤ ते एकमेकांवर जैमिनी राशी दृष्टी टाकत आहेत का?

विश्लेषण: हा संबंध करियरमधील सहजता आणि यश दर्शवतो. संबंध शुभ असेल तर करियर आत्म्याच्या समाधानासोबत पुढे जातो आणि व्यक्ती आपल्या कामावर खूश राहते. अशुभ संबंध आंतरिक संघर्ष आणि असंतोषाचे लक्षण आहे.

3] कर्म पद (A10) - व्यावसायिक प्रतिमा आणि सार्वजनिक प्रतिष्ठा:
➤ A10 (कर्मपद) कोणत्या राशीत आणि भावात स्थित आहे?
➤ A10 मध्ये कोणकोणते ग्रह (चर कारक) स्थित आहेत?
➤ A10 वर कोणत्या राशींची जैमिनी राशी दृष्टी आहे? (चर, स्थिर, द्विस्वभाव) (शुभ ग्रहांचा प्रभाव प्रसिद्धी देतो, पाप ग्रहांचा प्रभाव वाद किंवा संघर्ष देतो).
➤ A10 चा लग्न आरूढ (AL), आत्मकारक (AK) किंवा अमात्यकारक (AmK) यांच्याशी संबंध बनत आहे का?

विश्लेषण: हे दर्शवते की जग तुमचे काम आणि पद कसे पाहते. हे करियरमधून मिळणाऱ्या प्रसिद्धी, सामाजिक प्रतिष्ठा आणि सार्वजनिक प्रतिमेचे अचूक मूल्यांकन करते.

4] कारकांश लग्न (Karakamsa Lagna) - लपलेली प्रतिभा आणि भाग्य:
➤ कारकांश लग्नापासून दशम भावात कोणती राशी आणि ग्रह आहेत?
➤ कारकांश दशमेश कुठे स्थित आहे?
➤ कारकांश दशमेश कोणत्या ग्रहांशी युतीत आहे?

विश्लेषण: हे जातकाची लपलेली प्रतिभा, आंतरिक इच्छा आणि करियरची वास्तविक दिशा दर्शवते. कारकांशापासून दशम भाव व्यक्तीचे अंतिम कर्म आणि भाग्य दर्शवतो.

5] अर्गला विश्लेषण - अदृश्य हस्तक्षेप आणि संसाधनांचा प्रवाह:

➤ दशम भावावर अर्गला: करियरच्या "संस्थेला" (जसे ऑफिस, कंपनी) कोणत्या ग्रहांकडून सतत सहकार्य किंवा अडथळा मिळत आहे?
➤ अमात्यकारक (AmK) वर अर्गला: करियरमध्ये वरिष्ठ अधिकाऱ्यांकडून, सल्लागारांकडून किंवा सहकाऱ्यांकडून मिळणाऱ्या सहकार्याचा किंवा अडथळ्याचा विश्लेषण.
➤ A10 (कर्म पद) वर अर्गला: तुमची सार्वजनिक प्रतिमा आणि प्रतिष्ठा कोणत्या शक्ती पडद्यामागून मजबूत करत आहेत किंवा कमकुवत करत आहेत?

विश्लेषण: करियरमध्ये मिळणारे अदृश्य सहकार्य, संसाधनांचा प्रवाह आणि लपलेल्या अडथळ्यांचा शोध.

6] घटिका लग्न (Ghatika Lagna - GL) - सत्ता, अधिकार आणि उच्च पद:
➤ घटिका लग्न (GL) कोणत्या राशीत आणि भावात स्थित आहे?
➤ घटिका लग्नात कोणकोणते ग्रह स्थित आहेत?
➤ घटिका लग्नावर कोणत्या राशींची (चर, स्थिर, द्विस्वभाव) जैमिनी दृष्टी आहे?
➤ अमात्यकारक (AmK) किंवा आत्मकारक (AK) यांचा घटिका लग्नाशी कोणताही संबंध (युती किंवा जैमिनी दृष्टी) बनत आहे का?
➤ घटिका लग्नापासून दशम भावात कोणते ग्रह आहेत?

विश्लेषण: जातकाला करियरमध्ये किती 'पॉवर', 'अथॉरिटी' आणि 'सामाजिक प्रतिष्ठा' मिळेल? जातकाकडे एखाद्या मोठ्या संस्थेत उच्च अधिकारी (CEO/Director), लीडर किंवा सरकारी क्षेत्रात शीर्ष पद (Class-1 Officer) मिळवण्याची क्षमता आहे का, की त्याला अधीनस्थ (subordinates) म्हणून काम करावे लागेल?

उपरोक्त सर्व विवरणांमधून माहिती काढा आणि विश्लेषणही करायचे आहे. "विश्लेषण:" मुद्द्यांचे विश्लेषण करा, तसेच ग्रहाची अवस्था (उच्च, नीच, नीचभंग, अस्त, वक्री, शत्रू-मित्र-सम राशी) ब्रॅकेटमध्ये लिहा. उत्तरांसोबत प्रश्नही लिहा 

भाग 3: भृगु नंदी नाडी (BNN) नुसार करियरचे विश्लेषण

(हा भाग ग्रहांच्या प्रवाहावर आणि जीवनाच्या नमुन्यांवर आधारित करियर समजून घेण्यासाठी आहे.)

1] शनी (कर्म कारक) ची स्थिती आणि संबंध:
➤ शनी कोणत्या राशीत आहे (आणि कोणत्या डिग्रीवर आहे)?
➤ शनी कोणत्या ग्रहाच्या नक्षत्रात आहे?
➤ शनीसोबत युतीत कोणते ग्रह आहेत?
➤ शनीपासून दुसऱ्या आणि बाराव्या राशीत कोणते ग्रह आहेत?
➤ शनीपासून त्रिकोणात (1-5-9) कोणते ग्रह आहेत?

विश्लेषण: जातकाच्या कर्माचे मूळ क्षेत्र, पेशाचे स्वरूप (सेवा, तंत्रज्ञान, लोखंड इ.) आणि करियरमध्ये येणारी शिस्त/संघर्ष.

2] गुरू (जीव कारक) आणि शनीचा संबंध:
➤ गुरू आणि शनीचा परस्पर संबंध काय आहे (युती, 2-12, 1-5-9)?

विश्लेषण: जातकाच्या जीवन (गुरू) आणि कर्म (शनी) मधील संबंध. हे सांगते की करियर समाधानकारक असेल की ओझे.

3] करियरशी संबंधित इतर ग्रहांचा प्रभाव:
➤ सूर्य, बुध किंवा मंगळ यांचा शनीशी काय संबंध आहे? (सूर्य - अधिकार, बुध - व्यापार, मंगळ - तंत्रज्ञान).

विश्लेषण: करियरच्या विशिष्ट स्वरूपाचे निर्धारण. (जसे, शनी+बुध = व्यापार/हिशेब, शनी+मंगळ = इंजिनिअरिंग/बांधकाम).

4] दशमेश नवांशाधिपती (Dashmesh Navamshadhipati) चे सूत्र (करियरमधील अडथळा आणि उपाय):
➤ जन्म कुंडलीत (D-1) दशम भावाचा स्वामी (दशमेश / 10th Lord) कोणता ग्रह आहे?
➤ नवांश कुंडलीत (D-9) तो दशमेश कोणत्या भावात आणि कोणत्या राशीत बसला आहे?
➤ नवांशमध्ये दशमेशाचा डिस्पॉजिटर (नवांशाधिपती - त्या राशीचा स्वामी) कोणता ग्रह आहे?
➤ नवांश कुंडलीत तो डिस्पॉजिटर स्वतः दशमेशापासून कोणत्या स्थानी बसला आहे (दशमेशाला पहिले स्थान मानून मोजा; विशेषतः तो दशमेशापासून 6व्या, 8व्या किंवा 12व्या स्थानी आहे का)?
➤ नवांश कुंडलीत तो डिस्पॉजिटर स्वतः कोणत्या भावात बसला आहे (विशेषतः तो नवांशच्या 6व्या, 8व्या किंवा 12व्या भावात आहे का)?

विश्लेषण: जर नवांशमध्ये दशमेशाचा डिस्पॉजिटर स्वतः दशमेशापासून 6-8-12 च्या संबंधात बसत असेल, तर करियरमध्ये अडथळे (Obstructions) आणि अस्थिरता येते, आणि जर तो डिस्पॉजिटर नवांश कुंडलीच्या स्वतःच्या 6व्या, 8व्या किंवा 12व्या भावातही असेल तर अडथळा दुप्पट (प्रबळ) मानला जाईल. जर संबंध 6-8-12 मध्ये नसेल तर स्पष्ट लिहा की या सूत्राने करियरमध्ये अडथळा निर्माण होत नाही. उपायाचे (Career Alignment) निर्धारण - म्हणजे जर डिस्पॉजिटर 12वा असेल तर विदेश/MNC/इम्पोर्ट-एक्सपोर्ट, 8वा असेल तर आयटी/टेक्निकल/रिसर्च/गूढ विषय, आणि 6वा असेल तर सेवा क्षेत्र, मेडिकल, लीगल किंवा फायनान्सशी जोडून या अडथळ्याचे यशात रूपांतर करणे।

उपरोक्त सर्व विवरणांमधून माहिती काढा आणि विश्लेषणही करायचे आहे. "विश्लेषण:" मुद्द्यांचे विश्लेषण करा, तसेच ग्रह वक्री असेल तर तोही ब्रॅकेटमध्ये लिहा. उत्तरांसोबत प्रश्नही लिहा

भाग 4: कृष्णमूर्ति पद्धती (KP) नुसार करियरचे विश्लेषण

(हा भाग करियरच्या घटना आणि यशाच्या वचनाचे अचूक मूल्यांकन करण्यासाठी आहे.)

1] करियरचे वचन (Promise of Profession)

A] एकंदर करियरचे वचन (Overall Promise of Profession):
➤ 10व्या भावाचा कस्पल सब-लॉर्ड (CSL) कोण आहे?
➤ हा CSL कोणत्या भावांना सैगनिफाय करत आहे? (विशेषतः 2, 6, 10, 11 भावांचा संबंध).

विश्लेषण: कुंडलीत स्थिर आणि यशस्वी करियरचे वचन आहे का? (भाव 2, 6, 10, 11 आय आणि सेवा/पद दर्शवतात, तर 5, 8, 12 अडथळे दर्शवतात). (यशस्वी करियरच्या वचनाची 100 पैकी किती टक्के शक्यता आहे?)

B] नोकरीचे वचन (Promise of Job):
➤ 6व्या भावाचा कस्पल सब-लॉर्ड (CSL) कोण आहे?
➤ हा 6th CSL कोणत्या भावांना सैगनिफाय करत आहे?
➤ ते नोकरीला अनुकूल भावांशी (2, 6, 10, 11) जोडलेले आहे की नोकरी सुटण्याच्या/अडथळ्याच्या भावांशी (1, 5, 9, 12)?

विश्लेषण: जातकासाठी नोकरीत (Job/Service) स्थिरता आणि यशाचे स्पष्ट वचन आहे का? (यशस्वी नोकरीच्या वचनाची 100 पैकी किती टक्के शक्यता आहे?)

C] व्यापाराचे वचन (Promise of Business):
➤ 7व्या भावाचा कस्पल सब-लॉर्ड (CSL) कोण आहे?
➤ हा 7th CSL कोणत्या भावांना सैगनिफाय करत आहे?
➤ ते व्यापाराला अनुकूल भावांशी (2, 7, 10, 11) जोडलेले आहे की व्यापारात नुकसान/बर्बादीच्या भावांशी (5, 8, 12)?

विश्लेषण: जातक स्वतंत्र व्यापारात (Business) यशस्वी होऊ शकेल की त्याने रिस्क घेणे टाळावे? (यशस्वी व्यापाराच्या वचनाची 100 पैकी किती टक्के शक्यता आहे?)

2] पेशाचे स्वरूप (Nature of Profession):

A] एकंदर पेशाचे स्वरूप (Nature of Profession):
➤ 10व्या CSL चा नक्षत्र स्वामी कोण आहे आणि तो कुठे स्थित आहे?
➤ 10व्या CSL चा उप-स्वामी (SL) कोण आहे आणि तो कुठे स्थित आहे?
➤ 10व्या CSL चा उप-उप स्वामी (SSL) कोण आहे आणि तो कुठे स्थित आहे?
➤ करियरशी संबंधित भावांना (2, 6, 10, 11) सैगनिफाय करणारे प्रमुख ग्रह कोणते आहेत आणि त्यांची स्थिती काय आहे?
➤ भाव 2, 6, 10, 11 चे सर्वात मजबूत सैगनिफिकेटर ग्रह कोणते आहेत?

B] नोकरीचे स्वरूप (Nature of Job):

➤ 7व्या  CSL चा उप-स्वामी (SL) कोण आहे आणि तो कुठे स्थित आहे?
➤ 7व्या  CSL चा उप-उप स्वामी (SSL) कोण आहे आणि तो कुठे स्थित आहे?

3] पदोन्नती आणि यशाचा काळ (Timing of Promotion):

A] नोकरीतील पदोन्नती आणि काळ (Timing of Promotion in Job):

विश्लेषण: पदोन्नती, नोकरीतील बदल किंवा करियरमधील महत्त्वाच्या घटनांच्या संभाव्य वेळेचे निर्धारण.

4] सरकारी नोकरीचे वचन (Promise of Government Job):

A] 10व्या भावाच्या CSL (Cuspal Sub-Lord) चे विश्लेषण:
➤ 10व्या भावाचा CSL कोणता ग्रह आहे?
➤ हा 10th CSL स्वतः, किंवा आपल्या नक्षत्र स्वामी (NL) मार्फत सूर्य (Sun) किंवा चंद्रमा (Moon) शी जोडलेला आहे का? (सूर्य सरकारचा प्राथमिक कारक आहे, चंद्रमा पब्लिक सेक्टर/प्रशासनाचा).
➤ सूर्य (Sun) किंवा चंद्रमा (Moon) स्वतः आपल्या नक्षत्र स्वामी (NL) किंवा राशी स्वामी (RL) मार्फत 10th CSL शी जोडलेले आहेत का? (रिव्हर्स कनेक्शन चेक).
➤ हा 10th CSL 2, 6, 10 किंवा 11 भावांना प्रबळपणे सैगनिफाय करत आहे का?

B] 6व्या भावाच्या (नोकरी/सेवा) CSL चे विश्लेषण:
➤ 6व्या भावाचा CSL कोणता ग्रह आहे?

➤ 6th CSL 2, 6, 10, 11 भावांचा सैगनिफिकेटर आहे का?

C] विश्लेषण आणि फलादेश निर्देश:
➤ प्रबळ योग (Strong Promise): जर 10th आणि 6th दोन्ही CSL चा संबंध सूर्याशी असेल आणि ते 2, 6, 10, 11 भाव दर्शवत असतील, तर स्पष्टपणे सांगा की जन्म कुंडलीत उच्च स्तरीय सरकारी नोकरीचे 100% वचन आहे.
➤ मध्यम/संविदा (Contractual/State Govt): सूर्याऐवजी मंगळाचा (पोलीस/सेना) किंवा गुरूचा (शिक्षण/न्याय) प्रभाव असेल आणि 6, 10, 11 भाव सक्रिय असतील, तर राज्य सरकार किंवा पब्लिक सेक्टर (PSU) ची शक्यता सांगा.
➤ खाजगी क्षेत्र (Private Sector): जर 10th/6th CSL चा सूर्य किंवा चंद्रमाशी कोणताही संबंध नसेल, आणि ते राहू/केतू किंवा बुधाशी जोडलेले असतील, तर स्पष्ट करा की यश खाजगी क्षेत्रात किंवा मल्टिनॅशनल कंपनीत (MNC) मिळेल.

➤ D60 (षष्टियंश) - पूर्व पुण्य आणि अंतिम परिणाम (Karmic Legacy)
​
जर D1 आणि D10 मध्ये राजयोग असतील, परंतु D60 मध्ये तो ग्रह शापित असेल, तर करियरमध्ये उंचीवर जाऊनही घसरण येऊ शकते. हे 'सस्टेनेबल सक्सेस' (टिकाऊ यश) पाहण्यासाठी D60 चे विश्लेषण आहे.

1] D60 लग्न आणि लग्नेश - कार्मिक ब्लूप्रिंट (The Karmic Blueprint)

संयुक्त भाग: शिक्षण (Education) (भाग 1-5 + D60)

वरील सर्व तपशीलांमधून माहिती काढा आणि विश्लेषणही करा, "विश्लेषण:" मुद्द्यांचे विश्लेषण करा. त्यासोबत दृष्टी टाकणाऱ्या ग्रहांना सोडून बाकी ग्रहांची अवस्था (उच्च-नीच-नीचभंग, शत्रु-मित्र-सम राशी; अस्त-वक्री-वर्गोत्तम) देखील ब्रॅकेटमध्ये लिहा. उत्तरांसोबत प्रश्नही लिहा

भाग 1: पराशरी ज्योतिषानुसार शिक्षणाचे विश्लेषण

(हा भाग शिक्षणाचा पाया, बुद्धी आणि भाग्य समजण्यासाठी आहे.)

1] पंचमेश (5व्या भावाचा स्वामी):
➤ कोणता ग्रह पंचम भावाचा स्वामी आहे?
➤ पंचमेश ग्रह कोणत्या राशी-भावात स्थित आहे? (विशेषतः केंद्र/त्रिकोणातील स्थिती)
➤ पंचमेश ग्रह कोणत्या नक्षत्रात (स्वामी) स्थित आहे?
➤ पंचमेश ग्रहाची युती कोणत्या ग्रहांशी होत आहे?
➤ पंचमेशाशी युत ग्रह कोणत्या नक्षत्रात (स्वामी) स्थित आहे?
➤ पंचमेशावर कोणत्या ग्रहांची दृष्टी आहे?
➤ लग्नेश आणि पंचमेश यांच्यात शत्रुता/मित्रता/समानता आहे का?

विश्लेषण: शिक्षणाची दिशा, यशाची पातळी आणि अभ्यासाकडे मुलाचा दृष्टिकोन.

➤ चतुर्थ भाव कोणत्या राशी आणि नक्षत्रात (स्वामी) स्थित आहे?

➤ पंचम भाव कोणत्या राशी आणि नक्षत्रात (स्वामी) स्थित आहे?
➤ पंचम भावात कोणते ग्रह स्थित आहेत?
➤ पंचम भावात स्थित ग्रह कोणत्या नक्षत्रात (स्वामी) स्थित आहे?
➤ पंचम भावावर कोणते ग्रह दृष्टी टाकत आहेत?

विश्लेषण: प्रारंभिक शिक्षणाचा पाया, घर व school चे वातावरण, बुद्धी आणि विद्येचा स्वभाव.

➤ नवमांशात बुध, गुरु आणि चंद्र यांची स्थिती काय आहे?

➤ (D9) नवमांशात D1 चा पंचमेश कोणत्या भाव, राशी आणि नक्षत्रात (स्वामी) स्थित आहे?

➤ चतुर्विंशांशात बुध, गुरु आणि चंद्र यांची स्थिती काय आहे?

C) जन्म कुंडली (D1) च्या ग्रहांचे D24 मधील विश्लेषण:
➤ (D24 मध्ये) जन्म कुंडलीचा पंचमेश कोणत्या भाव, राशी आणि नक्षत्रात (स्वामी) स्थित आहे?
➤ (D24) चतुर्विंशांशात D1 पंचमेश कोणासोबत बसला आहे?
➤ (D24) चतुर्विंशांशात D1 पंचमेशावर कोणत्या ग्रहांची दृष्टी आहे?

विश्लेषण: वास्तविक विद्या, शिकण्याची क्षमता, शिक्षणाचे क्षेत्र आणि "शैक्षणिक यश". मुलगा खरोखर काय आणि कसे शिकेल याचे अचूक आकलन.

5] दशमांश कुंडली (D10) चे संक्षिप्त विश्लेषण - शिक्षणातून करियरची साखळी

A) D10 मधील दशम भाव आणि दशमेश:
➤ दशमांशात दशम भाव कोणत्या राशी आणि नक्षत्रात (स्वामी) स्थित आहे?
➤ दशमांशात दशम भावात कोणते ग्रह स्थित आहेत? (त्यांच्या नक्षत्र-स्वामींसह)
➤ दशमांशात दशमेश ग्रह कोण आहे आणि तो कोणत्या भाव, राशी आणि नक्षत्रात (स्वामी) स्थित आहे?

B) जन्म कुंडली (D1) च्या पंचमेशाची D10 मधील स्थिती:
➤ (D10 मध्ये) जन्म कुंडलीचा पंचमेश कोणत्या भाव, राशी आणि नक्षत्रात (स्वामी) स्थित आहे?
➤ (D10) दशमांशात D1 पंचमेश कोणासोबत बसला आहे?
➤ (D10) दशमांशात D1 पंचमेशावर कोणत्या ग्रहांची दृष्टी आहे?

विश्लेषण: मुलाचे शिक्षण पुढे जाऊन कोणत्या करियर दिशेचा पाया रचेल - अभ्यास आणि करियरची साखळी किती मजबूत आहे.

6] लग्न आणि लग्नेश:
➤ लग्न/लग्नेशाचे बळ काय आहे?
➤ लग्नेशाचा पंचम भाव किंवा पंचमेशाशी काय संबंध आहे?

विश्लेषण: मुलाची स्वतःची क्षमता, प्रयत्न आणि स्वभाव अभ्यासावर कसा परिणाम करेल.

7] ग्रहांचे बळ आणि शिक्षणाचे कारक ग्रह:
➤ कुंडलीत सर्वात बलवान ग्रह कोणता आहे (षड्बलानुसार)?
➤ बुध (बुद्धी, गणित, तर्क), गुरु (ज्ञान, शिक्षक, मार्गदर्शन), चंद्र (मन, स्मरण, एकाग्रता), सूर्य (आत्मविश्वास), मंगळ (स्पर्धा, तंत्र), शुक्र (कला, सृजन) आणि शनि (शिस्त, मेहनत) यांची स्थिती (राशी, भाव, नक्षत्र-स्वामी) काय आहे?

विश्लेषण: कोणते ग्रह मुलाला नैसर्गिकरित्या कोणत्या विशेष विषयाकडे किंवा क्षेत्राकडे नेतील.

8] उच्च शिक्षण आणि यशाचे भाव:
➤ नवम भाव (उच्च शिक्षण, भाग्य) आणि एकादश भाव (यश/लाभ) आणि त्यांचे स्वामी (राशी, भाव, नक्षत्र-स्वामी) यांची स्थिती.
➤ पंचमेशाचा संबंध नवम/एकादश भावांशी आहे का? (विद्या योग)

विश्लेषण: शिक्षणातून यशाची शक्यता आणि उच्च शिक्षणापर्यंत पोहोचण्याची क्षमता.

9] गुरु (ज्ञान कारक) आणि बुध (बुद्धी कारक) यांचे विशेष विश्लेषण:
➤ कुंडलीत गुरु कोणत्या राशी आणि भावात स्थित आहे?
➤ कुंडलीत बुध कोणत्या राशी आणि भावात स्थित आहे?
➤ गुरु आणि बुध यांचा परस्पर संबंध (युती, दृष्टी, राशी परिवर्तन) काय आहे?
➤ गुरु आणि बुध D24 मध्ये कोणत्या स्थितीत आहेत (उच्च/नीच/स्वराशी/वर्गोत्तम)?
➤ पंचमेश (शिक्षण) किंवा चतुर्थेश (प्रारंभिक शिक्षण) यांचा गुरु किंवा बुध यांच्याशी काही थेट संबंध बनत आहे का?

विश्लेषण: मुलाच्या बुद्धी आणि ज्ञानाची अंतिम पातळी (Education Status) कशी राहील? कुंडलीत असाधारण विद्येचा (उच्च शिक्षण/विशेषज्ञता) योग आहे की अभ्यासासाठी सतत संघर्ष करावा लागेल? शिक्षणाचा मुख्य स्रोत आणि दिशा काय असेल?

वरील सर्व तपशीलांमधून माहिती काढा आणि विश्लेषणही करा, "विश्लेषण:" मुद्द्यांचे विश्लेषण करा. उत्तरांसोबत प्रश्नही लिहा

भाग 2: जैमिनी ज्योतिषानुसार शिक्षणाचे विश्लेषण

(हा भाग शिक्षणातील प्रतिभा, आत्म्याची रुची आणि विद्येची दिशा समजण्यासाठी आहे.)

1] आत्मकारक (AK) आणि अमात्यकारक (AmK)-आत्म्याचा उद्देश आणि मार्गदर्शक:
A] आत्मकारक (AK):

➤ जैमिनी पद्धतीने आत्मकारक ग्रह कोणता आहे? (सर्वात जास्त अंश असलेला ग्रह)
➤ आत्मकारक कोणत्या राशी आणि भावात स्थित आहे?
➤ आत्मकारकासोबत कोणत्या ग्रहांच्या (चर कारक) युती आहेत?
➤ आत्मकारकावर कोणत्या राशींची जैमिनी राशी दृष्टी आहे? (चर, स्थिर, द्विस्वभाव)
➤ आत्मकारक कोणत्या नवमांशात स्थित आहे?
➤ आत्मकारक कोणत्या नक्षत्रात स्थित आहे?

B] अमात्यकारक (AmK):

➤ जैमिनी पद्धतीने अमात्यकारक ग्रह कोणता आहे? (दुसरा सर्वात जास्त अंश असलेला ग्रह)
➤ अमात्यकारक कोणत्या राशी आणि भावात स्थित आहे?
➤ अमात्यकारकासोबत कोणत्या ग्रहांच्या (चर कारक) युती आहेत?
➤ अमात्यकारकावर कोणत्या राशींची जैमिनी राशी दृष्टी आहे? (चर, स्थिर, द्विस्वभाव)
➤ अमात्यकारक कोणत्या नवमांशात स्थित आहे?
➤ अमात्यकारक कोणत्या नक्षत्रात स्थित आहे?

विश्लेषण: AK मुलाच्या आत्म्याचा मूळ उद्देश दर्शवतो. AmK तो मार्ग किंवा मार्गदर्शक (शिक्षक/विषय) दर्शवतो जो मुलाची रुची आणि शिक्षणाची दिशा ठरवण्यात मदत करतो.

2] AK आणि AmK यांचा परस्पर संबंध - रुची आणि मार्गातील सामंजस्य:
➤ AK आणि AmK एकमेकांपासून शुभ भावांमध्ये स्थित आहेत का (जसे केंद्र 1, 4, 7, 10; त्रिकोण 1, 5, 9; किंवा 3/11 चा संबंध)?
➤ ते एकमेकांवर जैमिनी राशी दृष्टी टाकत आहेत का?

विश्लेषण: हा संबंध शिक्षणातील सहजता आणि रुची दर्शवतो. संबंध शुभ असेल तर मुलगा आपल्या रुचीनुसार अभ्यासात सहज पुढे जाईल. अशुभ संबंध अभ्यासात आंतरिक असंतोष आणि दिशेचा भटकंतीपणा दर्शवतो.

3] मंत्रपद (A5) - विद्या आणि बुद्धीची प्रतिमा:
➤ A5 (मंत्रपद) कोणत्या राशी आणि भावात स्थित आहे?
➤ A5 मध्ये कोणते ग्रह (चर कारक) स्थित आहेत?
➤ A5 वर कोणत्या राशींची जैमिनी राशी दृष्टी आहे? (चर, स्थिर, द्विस्वभाव) (शुभ ग्रहांचा प्रभाव विद्येत यश देतो, पाप ग्रहांचा प्रभाव अभ्यासात संघर्ष किंवा वाद).
➤ A5 चा संबंध लग्न आरूढ (AL), आत्मकारक (AK) किंवा अमात्यकारक (AmK) यांच्याशी बनत आहे का?

विश्लेषण: हे दर्शवते की मुलाच्या विद्या आणि बुद्धीची वास्तविक क्षमता काय आहे आणि जग त्याला अभ्यासात कसे पाहील.

4] कारकांश लग्न (Karakamsa Lagna)-लपलेली प्रतिभा आणि विद्या:
➤ कारकांश लग्नापासून पंचम भावात कोणती राशी आणि ग्रह आहेत?
➤ कारकांश पंचमेश कुठे स्थित आहे?
➤ कारकांश पंचमेश कोणत्या ग्रहांसोबत युतीत आहे?

विश्लेषण: हे मुलाची लपलेली प्रतिभा, आंतरिक रुची आणि विद्येची वास्तविक दिशा दर्शवते. कारकांशापासून पंचम भाव मुलाच्या शिकण्याचा स्वभाव आणि ज्ञानाचे अंतिम स्वरूप दर्शवतो.

5] अर्गला विश्लेषण - अदृश्य हस्तक्षेप आणि संसाधनांचा प्रवाह:

➤ पंचम भावावर अर्गला: मुलाच्या अभ्यासाला कोणत्या ग्रहांकडून सतत सहकार्य किंवा अडथळा मिळत आहे (जसे आई-वडील, शिक्षक, संसाधने)?
➤ अमात्यकारक (AmK) वर अर्गला: शिक्षणात शिक्षक, मार्गदर्शक किंवा सहपाठी यांच्याकडून मिळणाऱ्या सहकार्य किंवा अडथळ्याचे विश्लेषण.
➤ A5 (मंत्र पद) वर अर्गला: मुलाची विद्या-प्रतिमा आणि अभ्यासाची प्रतिष्ठा कोणत्या शक्ती पडद्यामागून मजबूत करत आहेत किंवा कमकुवत करत आहेत?

विश्लेषण: शिक्षणात मिळणारे अदृश्य सहकार्य, संसाधनांचा प्रवाह आणि लपलेले अडथळे शोधणे.

6] सुखपद (A4) - प्रारंभिक शिक्षण आणि school चे वातावरण:
➤ A4 (सुखपद) कोणत्या राशी आणि भावात स्थित आहे?
➤ A4 मध्ये कोणते ग्रह स्थित आहेत?
➤ A4 वर कोणत्या राशींची (चर, स्थिर, द्विस्वभाव) जैमिनी दृष्टी आहे?
➤ आत्मकारक (AK) किंवा अमात्यकारक (AmK) यांचा A4 शी काही संबंध (युती किंवा जैमिनी दृष्टी) बनत आहे का?
➤ A4 पासून चतुर्थ भावात कोणते ग्रह आहेत?

विश्लेषण: मुलाचे प्रारंभिक शिक्षण कसे राहील? school चे वातावरण, घरातून अभ्यासात मिळणारे सहकार्य आणि आईची साथ कशी राहील? मुलाला घरी अभ्यासाचे अनुकूल वातावरण मिळेल की school बदलणे/hostel सारखे योग बनतील?

वरील सर्व तपशीलांमधून माहिती काढा आणि विश्लेषणही करा, "विश्लेषण:" मुद्द्यांचे विश्लेषण करा, त्यासोबत ग्रहाची अवस्था (उच्च, नीच, नीचभंग, अस्त, वक्री, शत्रु-मित्र-सम राशी) देखील ब्रॅकेटमध्ये लिहा. उत्तरांसोबत प्रश्नही लिहा

भाग 3: भृगु नंदी नाडी (BNN) नुसार शिक्षणाचे विश्लेषण

(हा भाग ग्रहांच्या प्रवाह आणि जीवनाच्या पॅटर्नच्या आधारे शिक्षण समजण्यासाठी आहे.)

1] बुध (विद्या कारक) याची स्थिती आणि संबंध:
➤ बुध कोणत्या राशीत आहे (आणि कोणत्या डिग्रीवर आहे)?
➤ बुध कोणत्या ग्रहाच्या नक्षत्रात आहे?
➤ बुधासोबत युतीत कोणते ग्रह आहेत?
➤ बुधापासून दुसऱ्या आणि बाराव्या राशीत कोणते ग्रह आहेत?
➤ बुधापासून त्रिकोणात (1-5-9) कोणते ग्रह आहेत?

विश्लेषण: मुलाच्या बुद्धीचा मूळ स्वभाव, शिकण्याची शैली (जसे तर्क, भाषा, गणित) आणि अभ्यासात येणारी शिस्त/संघर्ष.

2] गुरु (ज्ञान कारक) आणि बुध यांचा संबंध:
➤ गुरु आणि बुध यांचा परस्पर संबंध काय आहे (युती, 2-12, 1-5-9)?

विश्लेषण: मुलाचे ज्ञान (गुरु) आणि बुद्धी (बुध) यांच्यातील संबंध. हे सांगते की अभ्यास खोल आणि समाधानकारक असेल की वरवरचा आणि ओझ्यासारखा वाटेल.

3] शिक्षणाशी संबंधित इतर ग्रहांचा प्रभाव:
➤ चंद्र, मंगळ किंवा शनि यांचा बुधाशी काय संबंध आहे? (चंद्र - मन आणि स्मरण, मंगळ - स्पर्धा आणि तंत्र, शनि - शिस्त आणि मेहनत).

विश्लेषण: शिकण्याच्या विशेष स्वभावाचे निर्धारण. (जसे, बुध+चंद्र = स्मरण/भाषेत जलद, बुध+मंगळ = गणित/तंत्र, बुध+शनि = हळू सुरुवात पण खोल पकड).

4] पंचमेश नवांशधिपती (Panchmesh Navamshadhipati) चे सूत्र (शिक्षणातील अडथळा आणि उपाय):
➤ जन्म कुंडली (D-1) मध्ये पंचम भावाचा स्वामी (पंचमेश / 5th Lord) कोणता ग्रह आहे?
➤ नवांश कुंडली (D-9) मध्ये तो पंचमेश कोणत्या भावात आणि कोणत्या राशीत बसला आहे?
➤ नवांशात पंचमेशाचा डिस्पॉझिटर (नवांशधिपती - त्या राशीचा स्वामी) कोणता ग्रह आहे?
➤ नवांश कुंडलीत तो डिस्पॉझिटर स्वतः पंचमेशापासून कोणत्या स्थानावर बसला आहे (पंचमेशाला प्रथम स्थान मानून मोजा; विशेषतः तो पंचमेशापासून 6व्या, 8व्या किंवा 12व्या स्थानावर आहे का)?
➤ नवांश कुंडलीत तो डिस्पॉझिटर स्वतः कोणत्या भावात बसला आहे (विशेषतः तो नवांशाच्या 6व्या, 8व्या किंवा 12व्या भावात आहे का)?

विश्लेषण: जर नवांशात पंचमेशाचा डिस्पॉझिटर स्वतः पंचमेशापासून 6-8-12 च्या संबंधात बसत असेल, तर शिक्षणात अडथळे (Obstructions) आणि अस्थिरता येते, आणि जर तो डिस्पॉझिटर नवांश कुंडलीच्या स्वतःच्या 6व्या, 8व्या किंवा 12व्या भावातही असेल तर अडथळा दुप्पट (प्रबळ) मानला जाईल. जर संबंध 6-8-12 मध्ये नसेल तर स्पष्ट लिहा की या सूत्राने शिक्षणात अडथळा बनत नाही. त्याच्या उपायाचे (Education Alignment) निर्धारण - म्हणजे जर डिस्पॉझिटर 12वा असेल तर परदेशात शिक्षण, hostel किंवा दूरस्थ/online शिक्षण, 8वा असेल तर research, तांत्रिक किंवा गूढ विषय, आणि 6वा असेल तर स्पर्धा-आधारित, शिस्त-प्रधान किंवा परीक्षा-केंद्रित अभ्यासाशी जोडून या अडथळ्याला यशात बदलणे.

वरील सर्व तपशीलांमधून माहिती काढा आणि विश्लेषणही करा, "विश्लेषण:" मुद्द्यांचे विश्लेषण करा, त्यासोबत ग्रह वक्री असेल तर तो देखील ब्रॅकेटमध्ये लिहा. उत्तरांसोबत प्रश्नही लिहा

भाग 4: कृष्णमूर्ती पद्धती (KP) नुसार शिक्षणाचे विश्लेषण

(हा भाग शिक्षणाच्या घटना आणि यशाच्या वचनाचे अचूक आकलन करण्यासाठी आहे.)

1] शिक्षणाचे वचन (Promise of Education)

A] समग्र शिक्षणाचे वचन (Overall Promise of Education):
➤ 5व्या भावाचा कस्पल सब-लॉर्ड (CSL) कोण आहे?
➤ हा CSL कोणत्या भावांना सिग्निफाय करत आहे? (विशेषतः 4, 5, 9, 11 भावांचा संबंध).

विश्लेषण: कुंडलीत यशस्वी शिक्षणाचे वचन आहे का? (भाव 4, 5, 9, 11 शिक्षण, बुद्धी, उच्च शिक्षण आणि यश दर्शवतात, तर 6, 8, 12 अडथळे दर्शवतात). (यशस्वी शिक्षणाच्या वचनाची 100 पैकी किती टक्के शक्यता आहे?)

B] प्रारंभिक शिक्षणाचे वचन (Promise of School Education):
➤ 4थ्या भावाचा कस्पल सब-लॉर्ड (CSL) कोण आहे?
➤ हा 4th CSL कोणत्या भावांना सिग्निफाय करत आहे?
➤ तो शिक्षणाला अनुकूल भावांशी (4, 5, 11) जोडलेला आहे की अडथळ्याच्या भावांशी (6, 8, 12)?

विश्लेषण: मुलाच्या प्रारंभिक (school) शिक्षणात यश आणि स्थिरतेचे स्पष्ट वचन आहे का? (यशस्वी प्रारंभिक शिक्षणाच्या वचनाची 100 पैकी किती टक्के शक्यता आहे?)

C] उच्च शिक्षणाचे वचन (Promise of Higher Education):
➤ 9व्या भावाचा कस्पल सब-लॉर्ड (CSL) कोण आहे?
➤ हा 9th CSL कोणत्या भावांना सिग्निफाय करत आहे?
➤ तो उच्च शिक्षणाला अनुकूल भावांशी (5, 9, 11) जोडलेला आहे की अडथळ्याच्या भावांशी (6, 8, 12)?

विश्लेषण: मुलगा उच्च शिक्षणापर्यंत (पदवी/पदव्युत्तर/व्यावसायिक पाठ्यक्रम) यशस्वीरित्या पोहोचेल का? (यशस्वी उच्च शिक्षणाच्या वचनाची 100 पैकी किती टक्के शक्यता आहे?)

2] शिक्षणाचा स्वभाव (Nature of Education):

A] समग्र शिक्षणाचा स्वभाव (Nature of Education):
➤ 5व्या CSL चा नक्षत्र स्वामी कोण आहे आणि तो कुठे स्थित आहे?
➤ 5व्या CSL चा उप-स्वामी (SL) कोण आहे आणि तो कुठे स्थित आहे?
➤ 5व्या CSL चा उप-उप स्वामी (SSL) कोण आहे आणि तो कुठे स्थित आहे?
➤ शिक्षणाशी संबंधित भावांना (4, 5, 9, 11) सिग्निफाय करणारे प्रमुख ग्रह कोणते आहेत आणि त्यांची स्थिती काय आहे?
➤ भाव 4, 5, 9, 11 चे सर्वात बलवान सिग्निफिकेटर ग्रह कोणते आहेत?

विश्लेषण: अभ्यासाच्या योग्य दिशेचे अचूक निर्धारण. ग्रहांच्या स्वभावावरून stream आणि विषय शोधणे.

B] प्रारंभिक शिक्षणाचा स्वभाव (Nature of School Education):
➤ 4थ्या CSL चा नक्षत्र स्वामी कोण आहे आणि तो कुठे स्थित आहे?
➤ 4थ्या CSL चा उप-स्वामी (SL) कोण आहे आणि तो कुठे स्थित आहे?
➤ 4थ्या CSL चा उप-उप स्वामी (SSL) कोण आहे आणि तो कुठे स्थित आहे?

विश्लेषण: मुलाचे school शिक्षण कसे राहील - नियमित school, घरचे वातावरण आणि अभ्यासाच्या सुरुवातीचे स्वरूप?

C] उच्च शिक्षणाचा स्वभाव (Nature of Higher Education):
➤ 9व्या CSL चा नक्षत्र स्वामी कोण आहे आणि तो कुठे स्थित आहे?
➤ 9व्या CSL चा उप-स्वामी (SL) कोण आहे आणि तो कुठे स्थित आहे?
➤ 9व्या CSL चा उप-उप स्वामी (SSL) कोण आहे आणि तो कुठे स्थित आहे?

विश्लेषण: मुलाचे उच्च शिक्षण कोणत्या प्रकारचे असेल (जसे: degree, professional course, technical, research)?

3] शिक्षणातील यशाची वेळ (Timing of Success in Education):

A] परीक्षा यश आणि प्रवेशाची वेळ (Timing of Exam Success and Admission):
➤ भाव 4, 5, 11 चे प्रबळ सिग्निफिकेटर (Significator) ग्रह कोणते आहेत?
➤ सध्या, किंवा भविष्यात या सिग्निफिकेटर ग्रहांची दशा/अंतर्दशा/प्रत्यंतर दशा कधी येणार आहे?
➤ गोचरमध्ये शनि आणि गुरु यांचा संबंध दशा स्वामींशी किंवा महत्त्वाच्या कस्पांशी कधी होत आहे?

विश्लेषण: board परीक्षेत यश, चांगल्या school/college मध्ये प्रवेश किंवा शिक्षणाच्या महत्त्वाच्या घटनांच्या संभाव्य वेळेचे निर्धारण.

B] स्पर्धा परीक्षा आणि उच्च शिक्षणातील यशाची वेळ (Timing of Competitive and Higher Education Success):
➤ भाव 5, 6, 9, 11 चे प्रबळ सिग्निफिकेटर (Significator) ग्रह कोणते आहेत?
➤ सध्या, किंवा भविष्यात या सिग्निफिकेटर ग्रहांची दशा/अंतर्दशा/प्रत्यंतर दशा कधी येणार आहे?
➤ गोचरमध्ये शनि आणि गुरु यांचा संबंध शिक्षणाच्या महत्त्वाच्या कस्पांशी (विशेषतः 9 आणि 11) कधी होत आहे?
विश्लेषण: स्पर्धा परीक्षेत (JEE/NEET इत्यादी) निवड, scholarship किंवा उच्च शिक्षणातील मोठ्या यशाची संभाव्य वेळ.

4] सरकारी संस्था आणि शिष्यवृत्तीचे वचन (Promise of Government Institution and Scholarship):

A] 5व्या भावाच्या CSL (Cuspal Sub-Lord) चे विश्लेषण:
➤ 5व्या भावाचा CSL कोणता ग्रह आहे?
➤ हा 5th CSL स्वतः, किंवा आपल्या नक्षत्र स्वामी (NL) च्या माध्यमातून सूर्य (Sun) किंवा चंद्र (Moon) यांच्याशी जोडलेला आहे का? (सूर्य हा सरकारचा प्राथमिक कारक आहे, चंद्र हा सार्वजनिक संस्था/प्रशासनाचा).
➤ सूर्य (Sun) किंवा चंद्र (Moon) स्वतः आपल्या नक्षत्र स्वामी (NL) किंवा राशी स्वामी (RL) च्या माध्यमातून 5th CSL शी जोडलेले आहेत का? (रिव्हर्स कनेक्शन चेक).
➤ हा 5th CSL 4, 5, 9 किंवा 11 भावांना प्रबळतेने सिग्निफाय करत आहे का?

B] 4थ्या भावाच्या (प्रारंभिक शिक्षण/संस्था) CSL चे विश्लेषण:
➤ 4थ्या भावाचा CSL कोणता ग्रह आहे?
➤ 4th CSL चा संबंध सूर्य किंवा शनि (शिस्त/संस्थेचा कारक) यांच्याशी बनत आहे का?
➤ 4th CSL हा 4, 5, 9, 11 भावांचा सिग्निफिकेटर आहे का?

C] विश्लेषण आणि फलादेश निर्देश:
➤ प्रबळ योग (Strong Promise): जर 5th आणि 4th दोन्ही CSL चा संबंध सूर्याशी असेल आणि ते 4, 5, 9, 11 भाव दर्शवत असतील, तर स्पष्ट सांगा की जन्म कुंडलीत सरकारी संस्थेत प्रवेश आणि शिष्यवृत्तीचे (Scholarship) 100% वचन आहे.
➤ मध्यम/राज्य संस्था (State/Aided Institution): जर सूर्याऐवजी मंगळ (संरक्षण/तांत्रिक संस्था) किंवा गुरु (शिक्षण/विद्यापीठ) यांचा प्रभाव असेल आणि 5, 9, 11 भाव सक्रिय असतील, तर राज्य सरकार, aided संस्था किंवा सार्वजनिक विद्यापीठाची शक्यता सांगा.
➤ निजी संस्था (Private Institution): जर 5th/4th CSL चा सूर्य किंवा चंद्राशी काही संबंध नसेल, आणि ते राहु/केतु किंवा बुध यांच्याशी जोडलेले असतील, तर स्पष्ट करा की यश निजी (Private) संस्थेत किंवा परदेशी संस्थेत मिळेल.

➤ D60 (षष्टियंश) - पूर्व पुण्य आणि अंतिम परिणाम (Karmic Legacy)

जर D1 आणि D24 मध्ये विद्येचे राजयोग असतील, पण D60 मध्ये तो ग्रह शापित असेल, तर शिक्षणात सुरुवातीच्या उंचीनंतरही अडथळा येऊ शकतो. हे 'सस्टेनेबल सक्सेस' (टिकाऊ यश) पाहण्यासाठी D60 चे विश्लेषण ।

1] D60 लग्न आणि लग्नेश - कार्मिक ब्लूप्रिंट (The Karmic Blueprint)

2] D60 पंचम भाव आणि पंचमेश - कार्मिक विद्या (The Karmic Learning)

3] राजयोग कारक ग्रहांची D60 मधील स्थिती
हे विश्लेषण थेट सांगेल की D1/D24 चे शक्तिशाली विद्या योग D60 मध्ये किती मजबूत आहेत.

➤ तपशीलवार समग्र D60 निष्कर्ष

भाग 5: निष्कर्ष आणि समग्र अवलोकन

➤ चारही प्रणालींचा सारांश: प्रत्येक प्रणालीतून शिक्षणाबद्दल मुख्य निष्कर्ष काय आहेत?
➤ सर्वसंमत निष्कर्ष: कोणते विषय आणि शिक्षण क्षेत्रे सर्व प्रणालींमध्ये समान रीतीने दर्शवली जात आहेत?
➤ शिक्षणाचा आलेख: वयानुसार शिक्षणाचे मुख्य टप्पे (जसे 5-10, 10-15, 15-18, 18-25 वर्षे) कोणते असतील? कधी अभ्यासात संघर्ष आणि कधी यशाची शक्यता आहे?
➤ D60 कुंडलीचे समर्थन आणि अंतिम परिणाम ?
➤ अंतिम सल्ला: मुलासाठी सर्वात योग्य शिक्षण मार्ग (stream आणि विषय), टाळायची क्षेत्रे आणि शिक्षणातील यशासाठी आवश्यक उपाय किंवा रत्न (आवश्यक असल्यास).

संयुक्त भाग: संतान (Child Birth) (भाग 1-5 + D60)

वरील सर्व तपशीलांतून माहिती काढा आणि विश्लेषणही करा, "विश्लेषण:" मुद्द्यांचे विश्लेषण करा. त्याचबरोबर दृष्टी टाकणाऱ्या ग्रहांना सोडून, बाकी ग्रहांची अवस्था (उच्च-नीच-नीचभंग, शत्रू-मित्र-सम राशी; अस्त-वक्री-वर्गोत्तम) ब्रॅकेटमध्ये लिहा. उत्तरांसोबत प्रश्नही लिहा

भाग 1 A: पराशरी ज्योतिषानुसार संतानाचे विश्लेषण

(हा भाग संतानाची शक्यता, संख्या, सुख आणि त्यांच्या स्वभावाची पायाभूत माहिती समजण्यासाठी आहे.)

1] पंचमेश (5व्या भावाचा स्वामी):
➤ कोणता ग्रह पंचम भावाचा स्वामी आहे? 
➤ पंचमेश ग्रह कोणत्या राशी-भावात आहे? (विशेषतः केंद्र/त्रिकोणातील स्थिती)
➤ पंचमेश ग्रह कोणत्या नक्षत्रात (स्वामी) आहे?
➤ पंचमेश ग्रहाची युती कोणत्या ग्रहांबरोबर होत आहे?
➤ पंचमेशाशी युतीत असलेला ग्रह कोणत्या नक्षत्रात (स्वामी) आहे?
➤ पंचमेशावर कोणत्या ग्रहांची दृष्टी आहे?
➤ लग्नेश आणि पंचमेश यांच्यात शत्रुता/मित्रता/समानता आहे का?

विश्लेषण: संतान होण्याची क्षमता, संतानाचे भाग्य आणि जातकाचे संतानाप्रती आकर्षण.

2] पंचम भाव (संतान भाव):
➤ पंचम भाव कोणत्या राशीत आणि नक्षत्रात (स्वामी) आहे?
➤ पंचम भावात कोणकोणते ग्रह आहेत?
➤ पंचम भावात असलेला ग्रह कोणत्या नक्षत्रात (स्वामी) आहे?
➤ पंचम भावावर कोणकोणते ग्रह दृष्टी टाकत आहेत?

विश्लेषण: संतान होण्याची मूलभूत शक्यता, पहिल्या संतानाचे स्वरूप आणि संतानाशी संबंधित एकूण सुख.

3] नवांश कुंडली (D9) चे विश्लेषण - संतानाच्या भाग्याचे आणि आंतरिक सुखाचे मूल्यांकन

A) D9 मधील पंचम भाव आणि पंचमेश:
➤ नवांशात पंचम भाव कोणत्या राशीत आणि नक्षत्रात (स्वामी) आहे?
➤ नवांशात पंचम भावात कोणकोणते ग्रह आहेत? (त्यांच्या नक्षत्र-स्वामिंसह)
➤ नवांशात पंचम भावावर कोणत्या ग्रहांची दृष्टी आहे?
➤ नवांशात पंचमेश ग्रह कोणता आहे आणि तो कोणत्या भावात, राशीत आणि नक्षत्रात (स्वामी) आहे?
➤ नवांशात पंचमेशाची युती किंवा दृष्टी कोणत्या ग्रहांबरोबर होत आहे?
➤ नवांशात पंचमेशाशी युतीत असलेला ग्रह कोणत्या नक्षत्रात आहे?

B) D9 मधील लग्न आणि लग्नेश:
➤ नवांशात लग्न कोणत्या राशीत आणि नक्षत्रात (स्वामी) आहे?
➤ नवांशात लग्न भावात कोणकोणते ग्रह आहेत? (नक्षत्र-स्वामी)
➤ नवांशात लग्नेश ग्रह कोणत्या भावात, राशीत आणि नक्षत्रात (स्वामी) आहे?
➤ नवांशात लग्नेशाची युती किंवा दृष्टी कोणत्या ग्रहांबरोबर होत आहे?
➤ नवांशात गुरूची स्थिती काय आहे?

C) D1 च्या पंचमेशाची नवांशात (D9) स्थिती:
➤ (D9) नवांशात D1 चा पंचमेश कोणत्या भावात, राशीत आणि नक्षत्रात (स्वामी) आहे?
➤ (D9) नवांशात D1 चा पंचमेश कोणाबरोबर बसला आहे?
➤ (D9) नवांशात D1 च्या पंचमेशावर कोणत्या ग्रहांची दृष्टी आहे?

विश्लेषण: संतान सुखाचे सूक्ष्म आणि अचूक मूल्यांकन. हे संतान होण्यातील अडथळे, त्यांची संख्या आणि त्यांचे भाग्य स्पष्टपणे दाखवते.

4] सप्तांश कुंडली (D7) चे विश्लेषण - संतानाचे सूक्ष्म आणि सविस्तर विश्लेषण

A) D7 मधील पंचम भाव आणि पंचमेश:
➤ सप्तांशात पंचम भाव कोणत्या राशीत आणि नक्षत्रात (स्वामी) आहे?
➤ सप्तांशात पंचम भावात कोणकोणते ग्रह आहेत? (त्यांच्या नक्षत्र-स्वामिंसह)
➤ सप्तांशात पंचम भावावर कोणत्या ग्रहांची दृष्टी आहे?
➤ सप्तांशात पंचमेश ग्रह कोणता आहे आणि तो कोणत्या भावात, राशीत आणि नक्षत्रात (स्वामी) आहे?
➤ सप्तांशात पंचमेशाची युती किंवा दृष्टी कोणत्या ग्रहांबरोबर होत आहे?
➤ सप्तांशात पंचमेशाशी युतीत असलेला ग्रह कोणत्या नक्षत्रात आहे?

B) D7 मधील लग्न आणि लग्नेश:
➤ सप्तांशात लग्न कोणत्या राशीत आणि नक्षत्रात (स्वामी) आहे?
➤ सप्तांशात लग्न भावात कोणकोणते ग्रह आहेत? (नक्षत्र-स्वामी)
➤ सप्तांशात लग्नेश ग्रह कोणत्या भावात, राशीत आणि नक्षत्रात (स्वामी) आहे?
➤ सप्तांशात लग्नेशाची युती किंवा दृष्टी कोणत्या ग्रहांबरोबर होत आहे?
➤ सप्तांशात गुरूची स्थिती काय आहे?

C) जन्म कुंडली (D1) च्या ग्रहांचे D7 मधील विश्लेषण:
➤ (D7 मध्ये) जन्म कुंडलीचा पंचमेश कोणत्या भावात, राशीत आणि नक्षत्रात (स्वामी) आहे?
➤ (D7) सप्तांशात D1 चा पंचमेश कोणाबरोबर बसला आहे?
➤ (D7) सप्तांशात D1 च्या पंचमेशावर कोणत्या ग्रहांची दृष्टी आहे?

विश्लेषण: संतानाची संख्या, संतानाचे आरोग्य, संतानाचे स्वरूप, संतानाचा स्वभाव स्पष्टपणे दाखवते.

5] संतान कारक बृहस्पती (Jupiter):
➤ कुंडलीत बृहस्पतीची स्थिती काय आहे? (बलवान, वक्री, अस्त, पीडित).
➤ बृहस्पतीचा पंचम भाव किंवा पंचमेशाशी काय संबंध आहे?
➤ बृहस्पती ग्रह कोणत्या नक्षत्रात आहे?
➤ D9 मध्ये बृहस्पती: नवांशात बृहस्पतीची स्थिती आणि बल काय आहे?

विश्लेषण: संतान सुखाची गुणवत्ता आणि संतानाचे नैतिक आणि चारित्रिक गुण.

6] सप्तम भाव (द्वितीय संतान):
➤ सप्तम भाव (पंचमापासून तिसरा) आणि त्याच्या स्वामीची स्थिती.

विश्लेषण: दुसऱ्या संतानाची शक्यता आणि त्याच्याशी संबंधित विषय. (तसेच नवम भाव तिसऱ्या संतानासाठी

वरील सर्व तपशीलांतून माहिती काढा आणि विश्लेषणही करा, "विश्लेषण:" मुद्द्यांचे विश्लेषण करा. त्याचबरोबर दृष्टी टाकणाऱ्या ग्रहांना सोडून, बाकी ग्रहांची अवस्था (उच्च-नीच-नीचभंग, शत्रू-मित्र-सम राशी; अस्त-वक्री-वर्गोत्तम) ब्रॅकेटमध्ये लिहा. उत्तरांसोबत प्रश्नही लिहा

भाग 1 B: पराशरी ज्योतिषाच्या बीज स्फुट आणि क्षेत्र स्फुट गणनेनुसार संतानाचे विश्लेषण:

पुरुषाच्या कुंडलीसाठी (बीज स्फुट)

[पुरुषाचे नाव] च्या कुंडलीसाठी, कृपया खालील गणना आणि विश्लेषण करा:

1. पुरुषाच्या कुंडलीतील ग्रहांचे डिग्री:
➤ सूर्य (Sun): [डिग्री]° [मिनिट]' [सेकंद]" [राशी] मध्ये
➤ शुक्र (Venus): [डिग्री]° [मिनिट]' [सेकंद]" [राशी] मध्ये
➤ बृहस्पति (Jupiter): [डिग्री]° [मिनिट]' [सेकंद]" [राशी] मध्ये

2. गणना:
➤ वरील डेटावर आधारित, बीज स्फुटाची गणना करा आणि ते कोणत्या राशी, अंश, कला आणि विकलेवर स्थित आहे ते सांगा.

3. विश्लेषण:
➤ हा बीज स्फुट बिंदू विषम राशीत आहे की सम राशीत?
➤ जन्म कुंडलीत (D1) या बीज स्फुट बिंदूवर कोणत्या ग्रहांची युती किंवा दृष्टी आहे? (विशेषतः शुभ आणि पाप ग्रहांचा उल्लेख करा).
➤ हा बीज स्फुट बिंदू नवांश कुंडलीत (D9) कोणत्या राशीत स्थित आहे आणि तिथे त्याचा काय प्रभाव आहे?

अंतिम निष्कर्ष: या सर्व विश्लेषणांवर आधारित, पुरुषाची प्रजनन क्षमता (बीज स्फुट) बलवान आहे, मध्यम आहे, की पीडित आहे?

स्त्रीच्या कुंडलीसाठी (क्षेत्र स्फुट)

[स्त्रीचे नाव] च्या कुंडलीसाठी, कृपया खालील गणना आणि विश्लेषण करा:

1. स्त्रीच्या कुंडलीतील ग्रहांचे डिग्री:
➤ चंद्रमा (Moon): [डिग्री]° [मिनिट]' [सेकंद]" [राशी] मध्ये
➤ मंगळ (Mars): [डिग्री]° [मिनिट]' [सेकंद]" [राशी] मध्ये
➤ बृहस्पति (Jupiter): [डिग्री]° [मिनिट]' [सेकंद]" [राशी] मध्ये

2. गणना:
➤ वरील डेटावर आधारित, क्षेत्र स्फुटाची गणना करा आणि ते कोणत्या राशी, अंश, कला आणि विकलेवर स्थित आहे ते सांगा.

3. विश्लेषण:
➤ हा क्षेत्र स्फुट बिंदू विषम राशीत आहे की सम राशीत?
"जन्म कुंडलीत (D1) या क्षेत्र स्फुट बिंदूवर कोणत्या ग्रहांची युती किंवा दृष्टी आहे? (विशेषतः शुभ आणि पाप ग्रहांचा उल्लेख करा)."
➤ हा क्षेत्र स्फुट बिंदू नवांश कुंडलीत (D9) कोणत्या राशीत स्थित आहे आणि तिथे त्याचा काय प्रभाव आहे?

अंतिम निष्कर्ष: या सर्व विश्लेषणांवर आधारित, स्त्रीची प्रजनन क्षमता (क्षेत्र स्फुट) बलवान आहे, मध्यम आहे, की पीडित आहे?

वरील सर्व तपशीलांतून माहिती काढा आणि विश्लेषणही करा, "विश्लेषण:" मुद्द्यांचे विश्लेषण करा. उत्तरांसोबत प्रश्नही लिहा

भाग 2: जैमिनी ज्योतिषानुसार संतानाचे विश्लेषण

(हा भाग संतानाचे भाग्य आणि जातकाच्या जीवनातील त्यांची भूमिका समजण्यासाठी आहे.)

1] पुत्रकारक (PK - Putra Karaka):
➤ पुत्रकारक ग्रह कोणता आहे? (हा चर कारकांपैकी एक आहे).
➤ PK जन्म कुंडलीत कुठे स्थित आहे आणि त्यावर कोणत्या ग्रहांची दृष्टी आहे?

विश्लेषण: हा संतानाचा मुख्य प्रतिनिधी आहे आणि त्यांचे एकूण भाग्य, स्वभाव आणि जातकाच्या जीवनातील त्यांची भूमिका दाखवतो.

2] आत्मकारक (AK) आणि पुत्रकारक (PK) यांचे संबंध:
➤ AK आणि PK एकमेकांपासून शुभ भावांत (केंद्र, त्रिकोण) आहेत का?

विश्लेषण: जातक आणि त्याची संतान यांच्यातील संबंधाचे स्वरूप. शुभ संबंध खोल प्रेम आणि सहकार्य दाखवतो.

3] पुत्र पद (A5) - संतानाची प्रतिमा आणि त्यांच्याकडून मिळणारे सुख:
➤ A5 (पंचम भावाचे आरूढ पद) कोणत्या भावात स्थित आहे?
➤ A5 मध्ये कोणते ग्रह बसले आहेत किंवा त्यावर कोणत्या ग्रहांची जैमिनी राशी दृष्टी आहे? (शुभ ग्रहांचा प्रभाव संतानाला प्रसिद्धी आणि सुख देतो, पाप ग्रहांचा प्रभाव संघर्ष किंवा बदनामी देऊ शकतो).
➤ A5 चा संबंध लग्न आरूढ (AL), आत्मकारक (AK) किंवा पुत्रकारक (PK) शी बनत आहे का?

विश्लेषण: हे संतानाची सामाजिक स्थिती, त्यांची सार्वजनिक प्रतिमा आणि जातकाला आपल्या संतानाकडून कोणत्या प्रकारचे सुख (किंवा दुःख) मिळेल, याचे मूल्यांकन करते.

4] अर्गला विश्लेषण:
➤ पंचम भावावर अर्गला: संतान प्राप्ती आणि त्यांच्या जीवनाला कोणत्या शक्ती सहाय्य करत आहेत किंवा अडथळा टाकत आहेत?
➤ पुत्रकारक (PK) वर अर्गला: संतानाला वैयक्तिकरित्या मिळणाऱ्या सहाय्याचे किंवा आव्हानांचे विश्लेषण.
➤ A5 (पुत्र पद) वर अर्गला: संतानाची सामाजिक प्रतिमा आणि त्यांच्याकडून मिळणाऱ्या सुखावर कोणत्या अदृश्य शक्ती प्रभाव टाकत आहेत?

विश्लेषण: संतानाच्या जीवनात येणाऱ्या अदृश्य संधी आणि अडथळे.

        let currentLang = 'hi';
        function getRawData() {
            if (currentLang === 'en') return rawData_en;
            if (currentLang === 'mr') return rawData_mr;
            return rawData_hi;
        }
        function changeLanguage(lang) {
            currentLang = lang;
            document.getElementById('prompt-container').innerHTML = '';
            processData();
        }

        // सेपरेटर लॉजिक: --- या ___ लाइन्स से अलग करना
        const separatorRegex = /\n-{10,}\n|\n_{10,}\n/g;
        
        // बेकार लाइन्स को हटाने के लिए (जैसे MMM...RRR)
        const junkRegex = /^[M|P|C|H|R]{5,}/;

        function processData() {
            const container = document.getElementById('prompt-container');
            // पहले डैश लाइन्स से तोडें
            let parts = getRawData().split(separatorRegex);

            parts.forEach((part, index) => {
                let cleanText = part.trim();

                // चेक करें कि क्या टेक्स्ट में सिर्फ जंक (MMM...RRR) है
                // या क्या यह खाली है
                let isJunk = false;
                
                // उन अजीब लाइन्स को हटाएं जो टेक्स्ट के बीच में चिपकी हो सकती हैं
                const lines = cleanText.split('\n');
                const filteredLines = lines.filter(line => {
                    const l = line.trim();
                    // अगर लाइन में बहुत सारे M, P, C, R एक साथ हैं तो उसे हटा दें
                    if (l.match(/^[M|P|C|H|R]{10,}/)) return false;
                    // अगर लाइन में सिर्फ डैशेस हैं
                    if (l.match(/^-{5,}$/)) return false;
                    return true;
                });
                
                cleanText = filteredLines.join('\n').trim();

                if (cleanText.length > 5) { // अगर 5 अक्षर से ज्यादा है तभी दिखाएं
                    createCard(cleanText, index + 1);
                }
            });
        }

        function createCard(text, id) {
            const container = document.getElementById('prompt-container');
            
            const card = document.createElement('div');
            card.className = 'card';

            const header = document.createElement('div');
            header.className = 'card-header';
            header.innerText = `Prompt #${id}`;

            const content = document.createElement('div');
            content.className = 'card-content';
            content.innerText = text;

            const btn = document.createElement('button');
            btn.className = 'btn';
            btn.innerText = 'Copy Prompt';
            btn.onclick = () => copyText(text, btn);

            card.appendChild(header);
            card.appendChild(content);
            card.appendChild(btn);
            container.appendChild(card);
        }

        function showBtnFeedback(btn, success){
            if(!btn) return;
            var origText = btn.innerText;
            var origBg = btn.style.backgroundColor;
            btn.innerText = success ? "\u2713 Copied!" : "\u2717 Failed";
            btn.style.backgroundColor = success ? "#2e7d32" : "#c62828";
            btn.style.color = "#fff";
            setTimeout(function(){ btn.innerText = origText; btn.style.backgroundColor = origBg; }, 2000);
        }
        function copyText(text, btn) {
            navigator.clipboard.writeText(text).then(() => {
                showToast();
                showBtnFeedback(btn, true);
            }).catch(err => {
                // Fallback for older browsers
                const textarea = document.createElement('textarea');
                textarea.value = text;
                document.body.appendChild(textarea);
                textarea.select();
                try {
                    var ok = document.execCommand('copy');
                    showBtnFeedback(btn, ok);
                } catch (e) {
                    console.error('Fallback: Oops, unable to copy', e);
                    showBtnFeedback(btn, false);
                }
                document.body.removeChild(textarea);
                showToast();
            });
        }

        function showToast() {
            var x = document.getElementById("snackbar");
            x.className = "toast show";
            setTimeout(function(){ x.className = x.className.replace("show", ""); }, 3000);
        }

        // Initialize
        processData();

    </script>
