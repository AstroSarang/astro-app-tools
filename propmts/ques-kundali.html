<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Astro Prompts Copier</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        .card {
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-bottom: 15px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            border-left: 5px solid #007bff;
        }
        .card-content {
            white-space: pre-wrap;
            font-size: 14px;
            color: #555;
            max-height: 100px;
            overflow-y: auto;
            background: #f9f9f9;
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #eee;
            margin-bottom: 10px;
        }
        .card-header {
            font-weight: bold;
            margin-bottom: 5px;
            color: #007bff;
        }
        .btn {
            align-self: flex-end;
            background-color: #28a745;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: background 0.3s;
        }
        .btn:hover {
            background-color: #218838;
        }
        .btn:active {
            transform: scale(0.98);
        }
        .toast {
            visibility: hidden;
            min-width: 250px;
            background-color: #333;
            color: #fff;
            text-align: center;
            border-radius: 2px;
            padding: 16px;
            position: fixed;
            z-index: 1;
            left: 50%;
            bottom: 30px;
            transform: translateX(-50%);
            font-size: 17px;
        }
        .toast.show {
            visibility: visible;
            animation: fadein 0.5s, fadeout 0.5s 2.5s;
        }
        @keyframes fadein {
            from {bottom: 0; opacity: 0;}
            to {bottom: 30px; opacity: 1;}
        }
        @keyframes fadeout {
            from {bottom: 30px; opacity: 1;}
            to {bottom: 0; opacity: 0;}
        }
    </style>
</head>
<body>

    <h1>❓ प्रश्न कुंडली Prompts v1 (मराठी - झटपट प्रक्रिया)</h1>
    <div style="text-align:center; margin:10px 0;">
        <label for="lang-select" style="font-weight:bold; margin-right:8px;">भाषा / Language / भाषा:</label>
        <select id="lang-select" onchange="changeLanguage(this.value)" style="padding:8px 12px; font-size:16px; border-radius:8px; border:2px solid #007bff;">
            <option value="hi" selected>हिंदी</option>
            <option value="en">English</option>
            <option value="mr">मराठी</option>

    <div id="snackbar" class="toast">Text Copied to Clipboard!</div>

    <script>
        // यहाँ आपका पूरा डेटा है
        const rawData_hi = `या भाषेसाठी (हिंदी विस्तृत प्रक्रिया) prompts अजून बनवलेले नाहीत - नंतर जोडले जातील.`;
        const rawData_en = `Prompts for this language (English detailed process) are not made yet - they will be added later.`;
        const rawData_mr = `हा PDF जातकाची कुंडली आहे, त्यातील सर्व माहिती तुम्ही सेव करून ठेवावी, जेणेकरून कुंडलीचे विश्लेषण करता येईल, विश्लेषण करताना PDF च्या पेजचा संदर्भ लिहू नका पण पुढील माहिती कोणत्या पेजवर आहे, याची यादी द्या म्हणजे तुम्हालाही पुढे शोधणे सोपे होईल :

1] ग्रह स्थिती तक्ता -(ग्रह, डिग्री, राशी, नक्षत्र-पद, नक्षत्र-स्वामी, जैमिनी चर कारकत्व)
2] सर्वाष्टकवर्ग तक्ता
3] षड्बल तक्ता (स्थान बल, दिग्बल, काल बल, चेष्टा बल, नैसर्गिक बल, दृष्टी बल)
4] भाव बल तक्ता
5] विमशोपक बल तक्ता (षोडश वर्ग, षड् वर्ग, सप्त वर्ग आणि दश वर्ग)
6] जैमिनी आरूढ पद (राशी आधारित)
7] विमशोत्तरी महादशा अंतर्दशा चार्ट
8] योगिनी दशा अंतर्दशा चार्ट
9] चर दशा अंतर्दशा चार्ट
10] कृष्णमूर्ति पद्धती (KP) भाव स्थिती तक्ता {भाव-राशी-स्वामी-नक्षत्र स्वामी-उप स्वामी-उप-उप स्वामी-Cusp-राशी-नक्षत्र-पद}
11] कृष्णमूर्ति पद्धती (KP) ग्रह स्थिती तक्ता {भाव-राशी-स्वामी-नक्षत्र स्वामी-उप स्वामी-उप-उप स्वामी-Cusp-राशी-नक्षत्र-पद}
12] कृष्णमूर्ति पद्धती (KP) घराचे कारक ग्रह स्थिती तक्ता
13] कृष्णमूर्ति पद्धती (KP) ग्रह कारकत्व स्थिती तक्ता
14] D1 च्या 12 भावांचे राशी-नक्षत्र (Bhava Cusp)
15] D9 ग्रह स्थिती तक्ता -(ग्रह, डिग्री, राशी, नक्षत्र-पद, नक्षत्र-स्वामी)
16] D9 च्या 12 भावांचे राशी-नक्षत्र (Bhava Cusp)

सर्व तक्ते आत्ता चॅटमध्ये पुन्हा लिहिण्याची गरज नाही - फक्त वरीलपैकी कोणकोणती माहिती सेव केली गेली, याची यादी द्या.

त्याचप्रमाणे सोबत दिलेल्या Master Data TXT फाइलमधील सर्व भागांचा डेटा (षोडशवर्ग कुंडल्या, KP तक्ते, विंशोत्तरी-योगिनी-त्रिभागी-अष्टोत्तरी-चर दशा, BNN, जैमिनी इ.) सुद्धा सेव करा आणि त्या भागांची नावेही यादीत द्या.

निर्देश: आत्ता कोणतेही विश्लेषण करू नका. यानंतर मी जातकाची माहिती आणि प्रश्न देईन.
----------
कृपया वरील सर्व चॅट आणि PDF मधील जन्म तपशिलांच्या आधारे सर्व ९ ग्रहांचे (सूर्य, चंद्र, मंगळ, बुध, गुरु, शुक्र, शनी, राहू, केतू) ज्योतिषीय तथ्ये/आकडेवारीची यादी द्या. माहिती संक्षिप्त आणि मुद्देनिहाय असावी, सविस्तर स्पष्टीकरणाची गरज नाही. ही यादी कुंडलीच्या फलित, षड्बल, विमशोपक (षोडश वर्ग), अष्टकवर्ग आणि जैमिनी कारकत्व यांच्या आधारावर असावी.


प्रत्येक ग्रहासाठी पुढील माहिती द्या:
1. [ग्रहाचे नाव]
➤ जैमिनी कारकत्व:
➤ भाव स्वामित्व: (कोणत्या भावांचा स्वामी आहे)
➤ स्थिती: (कोणत्या भावात आणि राशीत)
➤ राशीतील स्थिती: (मित्र, शत्रू, सम, उच्च, नीच, मूलत्रिकोण, स्वराशी)
➤ नक्षत्र आणि पद: (तो ग्रह कोणत्या नक्षत्रात आणि कोणत्या पदात आहे, आणि नक्षत्र स्वामीचा प्रभाव.)
➤ दृष्टी: (कोणत्या भावांवर/ग्रहांवर दृष्टी)
➤ [ग्रहाचे नाव] वर दृष्टी: (कोणत्या ग्रहांची दृष्टी आहे)
➤ युती: (कोणत्या ग्रहांसोबत युतीत आहे)
➤ अवस्था (डिग्री): (डिग्री आणि अवस्थेचे नाव जसे बाल, कुमार इत्यादी)
➤ वक्री/अस्त/नीच/नीचभंग/वर्गोत्तम स्थिती: (होय/नाही किंवा स्थितीचे नाव)
➤ नवमांश स्थिती: (नवमांश कुंडलीत ग्रह कोणत्या राशीत, नक्षत्रात (स्वामी) आहे आणि त्याचा प्रभाव.)
➤ नवमांशातील बल: पीडित/बलवान
➤ चलितमधील स्थिती बदल आणि प्रभाव
➤ भावबल: (फक्त मूल्य)
➤ षड्बल: (रूपात मूल्य आणि त्याचे बल कसे आहे - सरासरीपेक्षा चांगले, रँक इत्यादी.)
➤ भिन्नाष्टक वर्ग (BAV) बिंदू: (0-8 दरम्यान मूल्य) : (बिंदूंच्या आधारे: व्यावहारिक बल - कमकुवत/सरासरी/शक्तिशाली)
➤ विमशोपक (षोडश वर्ग): (मूल्य आणि ग्रहांमध्ये त्याचा रँक, लागू असल्यास.)
➤ पुष्कर नवांश (PN)/पुष्कर भाग (PB)/मृत्यु भाग (MB) मध्ये स्थिती आणि प्रभाव :
➤ नवतारा स्थिती आणि प्रभाव: (जन्म नक्षत्राच्या आधारे हा ग्रह कोणत्या ताऱ्यात - जसे संपत, विपत, साधक इत्यादी - बसला आहे, आणि त्या विशिष्ट ताऱ्यामुळे त्याच्या नैसर्गिक व भाव फलांत कोणती शुभता किंवा अडथळे येतील.)
➤ गोचर आणि दशेत संभाव्य फलाचे संक्षिप्त उत्तर : (साधारणपणे तो ग्रह आपल्या दशा/अंतर्दशा आणि गोचरात कसे फल देईल - चांगले, वाईट, किंवा मध्यम.

➤ निष्कर्ष : एकूणच ग्रह मजबूत आहे की पीडित आहे ? (टक्केवारी)

➤ शेवटी सर्व ग्रहांच्या बलवान आणि पीडित असण्याबद्दल निष्कर्ष (टक्केवारीच्या आधारावर)

आता भाव प्रोफाइल:

कृपया वरील सर्व चॅट आणि PDF मधील जन्म तपशिलांच्या आधारे D1 च्या सर्व 12 भावांचे ज्योतिषीय तथ्ये/आकडेवारीची यादी द्या. माहिती संक्षिप्त आणि मुद्देनिहाय असावी, सविस्तर स्पष्टीकरणाची गरज नाही. ही यादी कारकत्व, भाव बल, अष्टकवर्ग यांच्या आधारावर असावी.


प्रत्येक भावासाठी पुढील माहिती द्या:

1. पहिला भाव (लग्न): राशीचे नाव [आरूढ पद]
➤ कारकत्व:
➤ भाव स्वामी (लग्नेश):
➤ भावेशाची स्थिती:
➤ स्थित ग्रह:
➤ भावावर दृष्टी:
➤ भाव बल: रूपात मूल्य आणि त्याचे बल कसे आहे - सरासरीपेक्षा चांगले, रँक इत्यादी. (कुंडलीत कमकुवत किंवा मजबूत भाव).
➤ सर्वाष्टकवर्ग (SAV) बिंदू: (एकूण बिंदू) (भावाची क्षमता: 28 पेक्षा जास्त असल्यास 'उत्तम', 25 पेक्षा कमी असल्यास 'आव्हानात्मक')
➤ पुष्कर नवांश (PN)/पुष्कर भाग (PB) मध्ये स्थिती आणि प्रभाव :
➤ निष्कर्ष : एकूणच भाव मजबूत आहे की पीडित आहे ? (टक्केवारी)

➤ शेवटी सर्व भावांच्या बळकट आणि पीडित असण्याबद्दल निष्कर्ष (टक्केवारीच्या आधारावर)

टीप : ज्या भावात गुलिक किंवा मांदि स्थित असेल, त्या भावाच्या फलात त्यांचा प्रभावही एक-दोन ओळींमध्ये अवश्य सांगा.
----------
भाग: पराशरी ज्योतिषानुसार प्रश्नाचे विश्लेषण

प्रश्न: [ येथे जातकाचा प्रश्न लिहा ]

वरील प्रश्नाशी संबंधित भाव, भावेश आणि कारक ग्रह निश्चित करा आणि पराशरी पद्धतीने सखोल विश्लेषण करा:

1] संबंधित भाव, भावेश आणि कारकांची स्थिती, बल, दृष्टी व युती - प्रश्नाच्या मुळाशी असलेली कारणे
2] संबंधित वर्ग कुंडलीसोबत तपासणी (विवाहासाठी D9, संतेतीसाठी D7, करिअरसाठी D10, इतर प्रश्नांसाठी लागू असलेली वर्ग कुंडली)
3] विंशोत्तरी दशा: सध्या सुरू असलेली महादशा-अंतर्दशा या प्रश्नासाठी अनुकूल आहे की प्रतिकूल? संबंधित ग्रह आपल्या दशा-अंतर्दशेत कधी फल देतील?
4] चर दशा आणि गोचर: सध्याची चर दशा आणि गुरु-शनीच्या गोचराचा संबंधित भावांवर प्रभाव

➤ निष्कर्ष: प्रश्नाचे स्पष्ट उत्तर, शक्यता (टक्केवारी) आणि कालावधी.
----------
भाग: जैमिनी ज्योतिषानुसार प्रश्नाचे विश्लेषण

प्रश्न: [ येथे जातकाचा प्रश्न लिहा ]

वरील प्रश्नाशी संबंधित जैमिनी कारक (लागू असलेले - DK, PK, AmK, MK इ.), संबंधित राशी आणि आरूढ पद (UL, AL इ.) निश्चित करा आणि जैमिनी पद्धतीने विश्लेषण करा:

1] संबंधित कारक व आरूढ पदांची स्थिती आणि त्यांचा परस्पर संबंध
2] चर महादशेद्वारे वेळ निश्चिती: सध्या सुरू असलेली चर महादशा-अंतर्दशा संबंधित राशींशी कशी जोडलेली आहे?
3] अर्गला आणि बाधक विचार: संबंधित राशींवर अर्गला आहे की बाधा?

➤ निष्कर्ष: जैमिनी पद्धतीने प्रश्नाचे स्पष्ट उत्तर आणि संभाव्य कालावधी.
----------
भाग: भृगु नंदी नाडी (BNN) नुसार प्रश्नाचे विश्लेषण

प्रश्न: [ येथे जातकाचा प्रश्न लिहा ]

वरील प्रश्नाशी संबंधित ग्रह व भाव निश्चित करा आणि BNN पद्धतीने विश्लेषण करा:

1] जीव कारक (गुरु) सक्रिय होणे: गोचराचा बृहस्पति जन्म कुंडलीच्या संबंधित ग्रहांना किंवा भावांना सक्रिय करत आहे का (युती, किंवा 2-12 मध्ये, किंवा त्यांच्यापासून त्रिकोणात 1-5-9)?
2] कर्म फल दात्याची (शनी) मान्यता: गोचराचा शनी संबंधित ग्रहांवर किंवा भावांवरून जात आहे का किंवा दृष्टी टाकत आहे का?
3] संबंधित ग्रहांच्या युती व देवाणघेवाण (exchange) संबंधांचा परिणाम

➤ निष्कर्ष: घटना कधी आणि कशी घडेल, याचे BNN नुसार स्पष्ट उत्तर.
----------
भाग: कृष्णमूर्ति पद्धती (KP) नुसार प्रश्नाचे विश्लेषण

प्रश्न: [ येथे जातकाचा प्रश्न लिहा ]

वरील प्रश्नाशी संबंधित भावांचा Cusp Sub Lord (CSL) निश्चित करा आणि KP पद्धतीने विश्लेषण करा:

1] संबंधित भावांच्या CSL चे सैगनिफिकेटर: CSL आपल्या नक्षत्र स्वामीमार्फत कोणकोणते भाव सिग्निफाय करतो?
2] अनुकूल व बाधक भाव तपासणी: CSL प्रश्नासाठी अनुकूल भाव सिग्निफाय करतो की बाधक भाव? (उदा. विवाहासाठी अनुकूल 2, 7, 11 आणि बाधक 1, 6, 10 - प्रश्नानुसार भाव बदला)
3] दशा स्वामींची योग्यता: सध्याच्या महादशा-अंतर्दशा-प्रत्यंतर दशा स्वामी हेच भाव सिग्निफाय करतात का?

➤ अंतिम निर्णय: प्रश्नाचे एका ओळीत स्पष्ट उत्तर (होईल / होणार नाही / मध्यम शक्यता) आणि त्याखाली कारण.

भाग: D60 (षष्ट्यंश) नुसार प्रश्नाचे विश्लेषण - पूर्व पुण्य आणि अंतिम परिणाम (Karmic Legacy)

प्रश्न: [ येथे जातकाचा प्रश्न लिहा ]

वरील प्रश्नाशी संबंधित ग्रह व भाव D60 कुंडलीत तपासा:

1] D60 लग्न आणि लग्नेश - कार्मिक ब्लूप्रिंट
2] प्रश्नाशी संबंधित भाव आणि भावेश यांची D60 मधील स्थिती
3] D1 आणि D9 मध्ये प्रश्नासंबंधी योग असूनही D60 मध्ये संबंधित ग्रह शापित किंवा पीडित असेल, तर विलंब किंवा डिनायल येऊ शकतो - ही तपासणी अवश्य करा

➤ सविस्तर एकूण D60 निष्कर्ष: प्रश्नाच्या मुळाशी कर्मिक कारण आहे का?

भाग: सर्व प्रणालींचा संयुक्त निष्कर्ष

प्रश्न: [ येथे जातकाचा प्रश्न लिहा ]

➤ वरील सर्व प्रणालींच्या (पराशरी, जैमिनी, BNN, KP, D60) मुख्य निष्कर्षांचा संक्षिप्त सारांश.
➤ कोणत्या बिंदूंवर विविध प्रणाली सहमत आहेत आणि कोणत्यांवर थोडा वेगळा दृष्टिकोन आहे?
➤ सर्व विश्लेषणांच्या आधारे सर्व प्रणालींचा एकमत निष्कर्ष.
➤ अंतिम निर्णय: प्रश्नाचे स्पष्ट उत्तर आणि सर्वात संभाव्य कालावधी.
----------
हे सुनिश्चित करा की जेव्हाही मी प्रश्नाच्या विश्लेषणाची मागणी करेन, तेव्हा तुम्ही त्या क्षेत्राशी संबंधित डिव्हिजनल चार्ट D1 सोबत मिळवूनच विश्लेषण कराल, जसे संतानासाठी D1 आणि D7, विवाहासाठी D1 आणि D9, करिअरसाठी D1 आणि D10. तसेच बाकीही...

तसेच प्रत्येक प्रश्नाचे विश्लेषण करताना पराशरी, जैमिनी, BNN आणि KP या चारही प्रणालींचा एकत्रित विचार करूनच निष्कर्ष द्या - कोणतीही एकच प्रणाली वापरू नका.

आतापर्यंत झालेल्या सर्व विश्लेषणांच्या आधारे जातकासाठी उपाय द्या आणि अंतिम निष्कर्ष द्या:

1] गैर-धार्मिक आणि व्यावहारिक उपाय
2] स्वतः करावयाचे धार्मिक आणि ज्योतिषीय उपाय
3] तज्ज्ञ ब्राह्मणाकडून करून घ्यावयाचे उपाय (लागू असल्यास)

➤ अंतिम निष्कर्ष: संपूर्ण विश्लेषणाचा संक्षिप्त सारांश आणि जातकासाठी सर्वात महत्त्वाचा सल्ला.`;
        let currentLang = 'hi';
        function getRawData() {
            if (currentLang === 'en') return rawData_en;
            if (currentLang === 'mr') return rawData_mr;
            return rawData_hi;
        }
        function changeLanguage(lang) {
            currentLang = lang;
            document.getElementById('prompt-container').innerHTML = '';
            processData();
        }

        // सेपरेटर लॉजिक: --- या ___ लाइन्स से अलग करना
        const separatorRegex = /\n-{10,}\n|\n_{10,}\n/g;
        
        // बेकार लाइन्स को हटाने के लिए (जैसे MMM...RRR)
        const junkRegex = /^[M|P|C|H|R]{5,}/;

        function processData() {
            const container = document.getElementById('prompt-container');
            // पहले डैश लाइन्स से तोडें
            let parts = getRawData().split(separatorRegex);

            parts.forEach((part, index) => {
                let cleanText = part.trim();

                // चेक करें कि क्या टेक्स्ट में सिर्फ जंक (MMM...RRR) है
                // या क्या यह खाली है
                let isJunk = false;
                
                // उन अजीब लाइन्स को हटाएं जो टेक्स्ट के बीच में चिपकी हो सकती हैं
                const lines = cleanText.split('\n');
                const filteredLines = lines.filter(line => {
                    const l = line.trim();
                    // अगर लाइन में बहुत सारे M, P, C, R एक साथ हैं तो उसे हटा दें
                    if (l.match(/^[M|P|C|H|R]{10,}/)) return false;
                    // अगर लाइन में सिर्फ डैशेस हैं
                    if (l.match(/^-{5,}$/)) return false;
                    return true;
                });
                
                cleanText = filteredLines.join('\n').trim();

                if (cleanText.length > 5) { // अगर 5 अक्षर से ज्यादा है तभी दिखाएं
                    createCard(cleanText, index + 1);
                }
            });
        }

        function createCard(text, id) {
            const container = document.getElementById('prompt-container');
            
            const card = document.createElement('div');
            card.className = 'card';

            const header = document.createElement('div');
            header.className = 'card-header';
            header.innerText = `Prompt #${id}`;

            const content = document.createElement('div');
            content.className = 'card-content';
            content.innerText = text;

            const btn = document.createElement('button');
            btn.className = 'btn';
            btn.innerText = 'Copy Prompt';
            btn.onclick = () => copyText(text, btn);

            card.appendChild(header);
            card.appendChild(content);
            card.appendChild(btn);
            container.appendChild(card);
        }

        function showBtnFeedback(btn, success){
            if(!btn) return;
            var origText = btn.innerText;
            var origBg = btn.style.backgroundColor;
            btn.innerText = success ? "\u2713 Copied!" : "\u2717 Failed";
            btn.style.backgroundColor = success ? "#2e7d32" : "#c62828";
            btn.style.color = "#fff";
            setTimeout(function(){ btn.innerText = origText; btn.style.backgroundColor = origBg; }, 2000);
        }
        function copyText(text, btn) {
            navigator.clipboard.writeText(text).then(() => {
                showToast();
                showBtnFeedback(btn, true);
            }).catch(err => {
                // Fallback for older browsers
                const textarea = document.createElement('textarea');
                textarea.value = text;
                document.body.appendChild(textarea);
                textarea.select();
                try {
                    var ok = document.execCommand('copy');
                    showBtnFeedback(btn, ok);
                } catch (e) {
                    console.error('Fallback: Oops, unable to copy', e);
                    showBtnFeedback(btn, false);
                }
                document.body.removeChild(textarea);
                showToast();
            });
        }

        function showToast() {
            var x = document.getElementById("snackbar");
            x.className = "toast show";
            setTimeout(function(){ x.className = x.className.replace("show", ""); }, 3000);
        }

        // Initialize
        processData();

    </script>
