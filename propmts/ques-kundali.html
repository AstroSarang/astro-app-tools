9] ससुराल वालों से संबंध (8th House):
➤ अष्टम भाव किस राशि में है और उसका स्वामी कहाँ स्थित है? (नक्षत्र, स्वामी)
➤ अष्टम भाव में कौन-कौन से ग्रह स्थित हैं या उस पर दृष्टि डाल रहे हैं?

विश्लेषण: ससुराल के परिवार से संबंध, उनका स्वरूप और विवाह पर उनका प्रभाव।

10] चंद्र और सप्तम भाव का संबंध:
➤ चंद्र किस भाव में स्थित है?
➤ चंद्र किस नक्षत्र में स्थित है?
➤ सप्तम भाव या सप्तमेश के साथ उसका संबंध है क्या?
➤ चंद्र पर कौन-कौन से ग्रह प्रभाव डाल रहे हैं?
➤ सप्तम भाव से संबंधित ग्रह चंद्र के नक्षत्र में है क्या? चंद्र के साथ युत, दृष्ट है क्या?

ऊपर दिए गए सभी विवरणों से जानकारी निकालें और विश्लेषण भी करें; "विश्लेषण:" बिंदुओं का विश्लेषण करें। उत्तरों के साथ प्रश्न भी लिखें।

विश्लेषण: जातक की भावनात्मक अनुकूलता, मानसिक शांति और वैवाहिक संबंध में भावनात्मक स्थिरता।

भाग 2: जैमिनी ज्योतिष के अनुसार विवाह का विश्लेषण:

1] दाराकारक (DK - Darakaraka):

➤ जैमिनी पद्धति से दाराकारक ग्रह कौन सा है? (सबसे कम अंश वाला ग्रह)
➤ दाराकारक किस राशि और भाव में स्थित है?
➤ दाराकारक के साथ कौन-कौन से ग्रहों की (चर कारक) युति है?
➤ दाराकारक पर किन राशियों की जैमिनी राशि दृष्टि है? (चर, स्थिर, द्विस्वभाव)
➤ दाराकारक किस नवमांश में स्थित है?
➤ दाराकारक किस नक्षत्र में स्थित है?

विश्लेषण: जीवनसाथी का स्वभाव, व्यक्तित्व और मुख्य गुण।

2] उपपद लग्न (UL - Upapada Lagna):

➤ उपपद लग्न कौन सा है और वह किस राशि और भाव में स्थित है?
➤ इसमें कौन-कौन से ग्रह (चर कारक) स्थित हैं?
➤ इस पर किन राशियों की जैमिनी राशि दृष्टि है? (चर, स्थिर, द्विस्वभाव)

विश्लेषण: विवाह की गुणवत्ता, स्थिरता और जीवनसाथी के परिवार की स्थिति।

3] दारापद (Darapada - A7):
➤ A7 (दारापद) किस राशि और भाव में स्थित है?
➤ A7 में कौन-कौन से ग्रह (चर कारक) स्थित हैं?
➤ A7 पर किन राशियों की जैमिनी राशि दृष्टि है? (चर, स्थिर, द्विस्वभाव)

विश्लेषण: संबंधों में जातक की बाहरी पहचान।

4] स्वांश और कारकांश से विवाह का विश्लेषण (आत्मा के दृष्टिकोण से):

A] स्वांश सप्तम भाव (आंतरिक वैवाहिक जीवन):
➤ स्वांश लग्न से सप्तम भाव में कौन सी राशि और ग्रह हैं?
➤ स्वांश सप्तमेश कहाँ स्थित है?
➤ स्वांश सप्तमेश किन ग्रहों के साथ युति में है?

विश्लेषण: यह विवाह की वास्तविक और आंतरिक गुणवत्ता, जीवनसाथी का आंतरिक स्वभाव और विवाह के बाद आपका भाग्य दर्शाता है। यह दिखाता है कि आपकी आत्मा को विवाह के बारे में "अंदर से" कैसा लगेगा।

B] कारकांश सप्तम भाव (बाहरी वैवाहिक अनुभव):
➤ कारकांश लग्न से सप्तम भाव में कौन सी राशि और ग्रह हैं?
➤ कारकांश सप्तमेश कहाँ स्थित है?
➤ कारकांश सप्तमेश किन ग्रहों के साथ युति में है?

विश्लेषण: यह आपके वैवाहिक जीवन का कर्म और भाग्य दर्शाता है। यह बताता है कि इस जीवन में आपकी आत्मा को विवाह के माध्यम से किस प्रकार के "अनुभवों" से या "कर्मों" से गुजरना होगा। यह विवाह का अधिक घटना-उन्मुख (event-oriented) पक्ष दिखाता है।

5] UL और DK का परस्पर संबंध:

➤ UL और DK एक-दूसरे पर जैमिनी राशि दृष्टि डाल रहे हैं क्या?
➤ वे एक-दूसरे से शुभ भावों में (केंद्र, त्रिकोण) हैं क्या?

विश्लेषण: विवाह की संभावना और संबंध की गहराई।

6] अर्गला विश्लेषण (अप्रत्यक्ष हस्तक्षेप और संसाधनों का प्रवाह):

A) सप्तम भाव पर अर्गला: विवाह की "संस्था" को किन ग्रहों से लगातार सहयोग या बाधा मिल रही है?
➤ सप्तम भाव से दूसरे, चौथे, ग्यारहवें और पाँचवें भाव में कौन से ग्रह (शुभ/पाप) हैं?
इन अर्गलाओं का विरोध करने वाले ग्रह (बारहवें, दसवें, तीसरे और नौवें भाव में) मौजूद हैं क्या? कौन अधिक बलवान है?

विश्लेषण: विवाह की समग्र सुगमता, उसमें बाहरी चुनौतियाँ और सुख का स्तर।

B) दाराकारक (DK) पर अर्गला: जीवनसाथी को किन ग्रहों से लगातार सहयोग या बाधा मिल रही है?
➤ DK जिस भाव में है, उससे दूसरे, चौथे, ग्यारहवें और पाँचवें भाव में कौन से ग्रह हैं? इन अर्गलाओं का विरोध हो रहा है क्या?

विश्लेषण: जीवनसाथी का भाग्य, उसका स्वास्थ्य और रिश्ते की आंतरिक गतिशीलता पर होने वाला प्रभाव।

C) उपपद लग्न (UL) पर अर्गला: विवाह की स्थिरता पर कौन सी शक्तियाँ प्रभाव डाल रही हैं?
➤ UL जिस भाव में है, उससे दूसरे, चौथे, ग्यारहवें और पाँचवें भाव में कौन से ग्रह हैं? इन अर्गलाओं का विरोध हो रहा है क्या?

विश्लेषण: विवाह की लंबी आयु और उसे मिलने वाला सामाजिक/पारिवारिक समर्थन।

ऊपर दिए गए सभी विवरणों से जानकारी निकालें और विश्लेषण भी करें; "विश्लेषण:" बिंदुओं का विश्लेषण करें; साथ में ग्रह की अवस्था (उच्च, नीच, नीचभंग, अस्त, वक्री, शत्रु-मित्र-सम राशि) कोष्ठक में भी लिखें। उत्तरों के साथ प्रश्न भी लिखें।

भाग 3: भृगु नंदी नाड़ी के अनुसार (BNN) जीवनसाथी का विश्लेषण:

1] गुरू (Jupiter) - जीव कारक की स्थिति और संबंध:

➤ गुरू किस राशि में है (और कितनी डिग्री पर है)?
➤ गुरू किस ग्रह के नक्षत्र में है?
➤ गुरू के साथ युति में कौन से ग्रह हैं?
➤ गुरू से दूसरी और बारहवीं राशि में कौन से ग्रह हैं?
➤ गुरू से त्रिकोण में (1-5-9) कौन से ग्रह हैं?
विश्लेषण: जातक का मूल व्यक्तित्व, स्वभाव, भाग्य और विवाह के बारे में दृष्टिकोण।

2] जीवनसाथी कारक की स्थिति और संबंध (पुरुष के लिए शुक्र, स्त्री के लिए मंगल):

➤ कुंडली के जेंडर के अनुसार जीवनसाथी कारक ग्रह चुनें (पुरुष जातक = शुक्र, स्त्री जातक = मंगल)।
➤ यह कारक ग्रह किस राशि में है (और कितनी डिग्री पर है)?
➤ यह कारक ग्रह किस ग्रह के नक्षत्र में है?
➤ इस कारक ग्रह के साथ युति में कौन से ग्रह हैं?
➤ इस कारक ग्रह से दूसरी और बारहवीं राशि में कौन से ग्रह हैं?
➤ इस कारक ग्रह से त्रिकोण में (1-5-9) कौन से ग्रह हैं?
विश्लेषण: जीवनसाथी की मूल प्रकृति, रंग-रूप, व्यवहार और वैवाहिक सुख की गुणवत्ता।

3] जीव/स्वयं और जीवनसाथी का परस्पर संबंध - विवाह का मुख्य सूत्र:

➤ पुरुष की कुंडली में: गुरू (जीव) और शुक्र (पत्नी) युति, 2-12 या 1-5-9 संबंध में हैं क्या?
➤ स्त्री की कुंडली में: शुक्र (स्वयं स्त्री देह) और मंगल (पति) युति, 2-12 या 1-5-9 संबंध में हैं क्या?
➤ यदि युति हो, तो उनकी डिग्री में कितनी निकटता है? अन्य कौन सा परस्पर संबंध?
विश्लेषण: विवाह की प्रबलता, पति-पत्नी के बीच परस्पर संबंध का स्वरूप और वैवाहिक आनंद।

4] अन्य महत्वपूर्ण ग्रहों का प्रभाव:

➤ शनि (कर्म): शनि का जीवनसाथी कारक ग्रह से (पुरुष के लिए शुक्र, स्त्री के लिए मंगल) क्या संबंध है (युति, 2-12, 1-5-9)?
➤ राहु और केतु: राहु/केतु का जीवनसाथी कारक ग्रह या विवाह सूत्र से (गुरू-शुक्र या शुक्र-मंगल) क्या संबंध है? (यह अलगाव, अंतरजातीय विवाह या बाधाएँ दर्शाता है)।
➤ वक्री ग्रह: जीवनसाथी कारक ग्रह, गुरू, या उन पर प्रभाव डालने वाला कोई भी ग्रह वक्री (Retrograde) है क्या?

ऊपर दिए गए सभी विवरणों से जानकारी निकालें और विश्लेषण भी करें; "विश्लेषण:" बिंदुओं का विश्लेषण करें; साथ में ग्रह वक्री हो तो वह भी कोष्ठक में लिखें। उत्तरों के साथ प्रश्न भी लिखें।

भाग 4: कृष्णमूर्ति पद्धति के अनुसार (KP) विवाह और जीवनसाथी का विश्लेषण:

1] विवाह का वचन (Promise of Marriage):
➤ 7वें भाव का कस्पल सब-लॉर्ड (CSL) कौन है?
➤ यह CSL किन भावों को सिग्निफ़ाय कर रहा है (विशेषतः 2, 7, 11 भावों के संबंध में)?
➤ यह CSL विवाह को नकारने वाले भावों को भी (जैसे 1, 6, 8, 10, 12 - जो अलगाव या विलंब दर्शाते हैं) सिग्निफ़ाय कर रहा है क्या?

विश्लेषण: कुंडली में विवाह का स्पष्ट वचन है या बाधाओं/नकार की संभावना है? (विवाह के वचन की 100 में से कितने प्रतिशत संभावना है?)

2] विवाह में विलंब के योग (Delay in & Obstacles in Marriage):

➤ 7th CSL शनि है क्या, या शनि के नक्षत्र में बैठा है क्या?
➤ 7th CSL प्रबल रूप से 8वें भाव को (बाधा, विलंब और अचानक कठिनाई) सिग्निफ़ाय कर रहा है क्या?
➤ 7th CSL प्रबल रूप से 12वें भाव को (विवाह विरक्ति, दूर जाना और एकांत) तथा 1, 6, 10 भावों को (विवाह के बाधा भाव) सिग्निफ़ाय कर रहा है क्या?

विश्लेषण: विवाह सामान्य आयु में होगा, जल्दी होगा, या इसमें असामान्य विलंब (Late Marriage) और बड़ी बाधाओं के स्पष्ट योग हैं? विलंब का मुख्य ज्योतिषीय कारण क्या है?

3] जीवनसाथी की प्रकृति और वैवाहिक संबंध (Nature of Spouse & Marital Relations):
➤ 7वें CSL का नक्षत्र स्वामी कौन है और वह कहाँ स्थित है?
➤ 7वें CSL का उप-स्वामी कौन है और वह कहाँ स्थित है?
➤ 7वें CSL का SSL कौन है और वह कहाँ स्थित है?
➤ विवाह से संबंधित भावों को (2, 7, 11) सिग्निफ़ाय करने वाले प्रमुख ग्रह कौन से हैं और उनकी स्थिति क्या है?

विश्लेषण: जीवनसाथी का सामान्य स्वभाव, व्यक्तित्व और वैवाहिक संबंध की समग्र गुणवत्ता।

4] वैवाहिक जीवन की गुणवत्ता और अलगाव (Quality of Married Life & Separation):
➤ 7th CSL विवाह के लिए शुभ भावों को (2, 7, 11) दृढ़ता से दिखा रहा है क्या?
➤ 7th CSL अलगाव/तलाक के भावों को (1, 6, 10) प्रबल रूप से सिग्निफ़ाय कर रहा है क्या? (ध्यान दें: 6वाँ भाव 7वें से 12वाँ है, जो कानूनी अलगाव देता है)।
➤ 7th CSL 8वें भाव को (मानसिक तनाव, ससुराल वालों से क्लेश, गुप्त धोखाधड़ी, या जीवनसाथी के लिए मारक कष्ट) सिग्निफ़ाय कर रहा है क्या?
➤ 7th CSL या 11th CSL का 12वें भाव से (शय्या सुख की कमी/गुप्त परेशानी) संबंध हो रहा है क्या?

विश्लेषण: वैवाहिक जीवन कितना सुखद रहेगा? भविष्य में कानूनी तलाक, अलगाव (Separation), जीवनसाथी के स्वास्थ्य को खतरा, या मानसिक क्लेश के कारण वैवाहिक सुख में बड़ी कमी की कौन सी स्पष्ट संभावना है? (स्पष्ट और कड़वा सत्य बताएं)।

5] विवाह का प्रकार (Love vs. Arranged Marriage):

➤ 5वें भाव का (प्रेम/रोमान्स) कस्पल सब-लॉर्ड (CSL) कौन है?
➤ 7वें CSL और 5वें CSL के बीच कोई सीधा संबंध बन रहा है क्या?
➤ 5th CSL विवाह के भावों को (7वाँ या 11वाँ) प्रबल रूप से सिग्निफ़ाय कर रहा है क्या?

2] AK और AmK का परस्पर संबंध - उद्देश्य और मार्ग में सुसंगति:

➤ वे एक-दूसरे पर जैमिनी राशि दृष्टि डाल रहे हैं क्या?

विश्लेषण: यह संबंध करियर में सहजता और सफलता दर्शाता है। संबंध शुभ हो तो करियर आत्मा की संतुष्टि के साथ आगे बढ़ता है और व्यक्ति अपने काम से खुश रहता है। अशुभ संबंध आंतरिक संघर्ष और असंतोष का लक्षण है।

3] कर्म पद (A10) - व्यावसायिक छवि और सार्वजनिक प्रतिष्ठा:
➤ A10 (कर्मपद) किस राशि और भाव में स्थित है?
➤ A10 में कौन-कौन से ग्रह (चर कारक) स्थित हैं?
➤ A10 पर किन राशियों की जैमिनी राशि दृष्टि है? (चर, स्थिर, द्विस्वभाव) (शुभ ग्रहों का प्रभाव प्रसिद्धि देता है, पाप ग्रहों का प्रभाव विवाद या संघर्ष देता है)।
➤ A10 का लग्न आरूढ़ (AL), आत्मकारक (AK) या अमात्यकारक (AmK) से संबंध बन रहा है क्या?

विश्लेषण: यह दर्शाता है कि दुनिया तुम्हारे काम और पद को कैसे देखती है। यह करियर से मिलने वाली प्रसिद्धि, सामाजिक प्रतिष्ठा और सार्वजनिक छवि का सटीक मूल्यांकन करता है।

4] कारकांश लग्न (Karakamsa Lagna) - छिपी प्रतिभा और भाग्य:
➤ कारकांश लग्न से दशम भाव में कौन सी राशि और ग्रह हैं?
➤ कारकांश दशमेश कहाँ स्थित है?
➤ कारकांश दशमेश किन ग्रहों से युति में है?

विश्लेषण: यह जातक की छिपी प्रतिभा, आंतरिक इच्छा और करियर की वास्तविक दिशा दर्शाता है। कारकांश से दशम भाव व्यक्ति का अंतिम कर्म और भाग्य दर्शाता है।

5] अर्गला विश्लेषण - अदृश्य हस्तक्षेप और संसाधनों का प्रवाह:

➤ दशम भाव पर अर्गला: करियर की "संस्था" (जैसे ऑफिस, कंपनी) को किन ग्रहों से लगातार सहयोग या अड़चन मिल रही है?
➤ अमात्यकारक (AmK) पर अर्गला: करियर में वरिष्ठ अधिकारियों से, सलाहकारों से या सहकर्मियों से मिलने वाले सहयोग या अड़चन का विश्लेषण।
➤ A10 (कर्म पद) पर अर्गला: तुम्हारी सार्वजनिक छवि और प्रतिष्ठा को कौन सी शक्तियाँ परदे के पीछे से मजबूत कर रही हैं या कमजोर कर रही हैं?

विश्लेषण: करियर में मिलने वाला अदृश्य सहयोग, संसाधनों का प्रवाह और छिपी अड़चनों की खोज।

6] घटिका लग्न (Ghatika Lagna - GL) - सत्ता, अधिकार और उच्च पद:
➤ घटिका लग्न (GL) किस राशि और भाव में स्थित है?
➤ घटिका लग्न में कौन-कौन से ग्रह स्थित हैं?
➤ घटिका लग्न पर किन राशियों (चर, स्थिर, द्विस्वभाव) की जैमिनी दृष्टि है?
➤ अमात्यकारक (AmK) या आत्मकारक (AK) का घटिका लग्न से कोई संबंध (युति या जैमिनी दृष्टि) बन रहा है क्या?
➤ घटिका लग्न से दशम भाव में कौन से ग्रह हैं?

विश्लेषण: जातक को करियर में कितनी 'पॉवर', 'अथॉरिटी' और 'सामाजिक प्रतिष्ठा' मिलेगी? जातक में किसी बड़ी संस्था में उच्च अधिकारी (CEO/Director), लीडर या सरकारी क्षेत्र में शीर्ष पद (Class-1 Officer) पाने की क्षमता है क्या, या उसे अधीनस्थ (subordinates) के रूप में काम करना पड़ेगा?

उपरोक्त सभी विवरणों से जानकारी निकालें और विश्लेषण भी करना है। "विश्लेषण:" बिंदुओं का विश्लेषण करें, साथ ही ग्रह की अवस्था (उच्च, नीच, नीचभंग, अस्त, वक्री, शत्रु-मित्र-सम राशि) ब्रैकेट में लिखें। उत्तरों के साथ प्रश्न भी लिखें

भाग 3: भृगु नंदी नाडी (BNN) के अनुसार करियर का विश्लेषण

(यह भाग ग्रहों के प्रवाह और जीवन के नमूनों पर आधारित करियर को समझने के लिए है।)

1] शनि (कर्म कारक) की स्थिति और संबंध:
➤ शनि किस राशि में है (और किस डिग्री पर है)?
➤ शनि किस ग्रह के नक्षत्र में है?
➤ शनि के साथ युति में कौन से ग्रह हैं?
➤ शनि से दूसरी और बारहवीं राशि में कौन से ग्रह हैं?
➤ शनि से त्रिकोण में (1-5-9) कौन से ग्रह हैं?

विश्लेषण: जातक के कर्म का मूल क्षेत्र, पेशे का स्वरूप (सेवा, तकनीक, लोहा आदि) और करियर में आने वाला अनुशासन/संघर्ष।

2] गुरु (जीव कारक) और शनि का संबंध:
➤ गुरु और शनि का परस्पर संबंध क्या है (युति, 2-12, 1-5-9)?

विश्लेषण: जातक के जीवन (गुरु) और कर्म (शनि) के बीच संबंध। यह बताता है कि करियर संतोषजनक होगा या बोझ।

3] करियर से संबंधित अन्य ग्रहों का प्रभाव:
➤ सूर्य, बुध या मंगल का शनि से क्या संबंध है? (सूर्य - अधिकार, बुध - व्यापार, मंगल - तकनीक)।

विश्लेषण: करियर के विशिष्ट स्वरूप का निर्धारण। (जैसे, शनि+बुध = व्यापार/हिसाब, शनि+मंगल = इंजीनियरिंग/निर्माण कार्य)।

4] दशमेश नवांशाधिपती (Dashmesh Navamshadhipati) का सूत्र (करियर में अड़चन और उपाय):
➤ जन्म कुंडली में (D-1) दशम भाव का स्वामी (दशमेश / 10th Lord) कौन सा ग्रह है?
➤ नवांश कुंडली में (D-9) वह दशमेश किस भाव और किस राशि में बैठा है?
➤ नवांश में दशमेश का डिस्पॉजिटर (नवांशाधिपती - उस राशि का स्वामी) कौन सा ग्रह है?
➤ नवांश कुंडली में वह डिस्पॉजिटर स्वयं दशमेश से किस स्थान पर बैठा है (दशमेश को पहला स्थान मानकर गिनें; विशेषतः वह दशमेश से 6वें, 8वें या 12वें स्थान पर है क्या)?
➤ नवांश कुंडली में वह डिस्पॉजिटर स्वयं किस भाव में बैठा है (विशेषतः वह नवांश के 6वें, 8वें या 12वें भाव में है क्या)?

विश्लेषण: यदि नवांश में दशमेश का डिस्पॉजिटर स्वयं दशमेश से 6-8-12 के संबंध में बैठता हो, तो करियर में अड़चनें (Obstructions) और अस्थिरता आती है, और यदि वह डिस्पॉजिटर नवांश कुंडली के अपने 6वें, 8वें या 12वें भाव में भी हो तो अड़चन दोगुनी (प्रबल) मानी जाएगी। यदि संबंध 6-8-12 में न हो तो स्पष्ट लिखें कि इस सूत्र से करियर में अड़चन उत्पन्न नहीं होती। उपाय का (Career Alignment) निर्धारण - अर्थात यदि डिस्पॉजिटर 12वाँ हो तो विदेश/MNC/इम्पोर्ट-एक्सपोर्ट, 8वाँ हो तो आईटी/टेक्निकल/रिसर्च/गूढ़ विषय, और 6वाँ हो तो सेवा क्षेत्र, मेडिकल, लीगल या फाइनेंस से जोड़कर इस अड़चन को सफलता में बदलना।

उपरोक्त सभी विवरणों से जानकारी निकालें और विश्लेषण भी करना है। "विश्लेषण:" बिंदुओं का विश्लेषण करें, साथ ही ग्रह वक्री हो तो वह भी ब्रैकेट में लिखें। उत्तरों के साथ प्रश्न भी लिखें

भाग 4: कृष्णमूर्ति पद्धति (KP) के अनुसार करियर का विश्लेषण

(यह भाग करियर की घटनाओं और सफलता के वचन का सटीक मूल्यांकन करने के लिए है।)

1] करियर का वचन (Promise of Profession)

A] समग्र करियर का वचन (Overall Promise of Profession):
➤ 10वें भाव का कस्पल सब-लॉर्ड (CSL) कौन है?
➤ यह CSL किन भावों को सैगनिफाय कर रहा है? (विशेषतः 2, 6, 10, 11 भावों का संबंध)।

विश्लेषण: कुंडली में स्थिर और सफल करियर का वचन है क्या? (भाव 2, 6, 10, 11 आय और सेवा/पद दर्शाते हैं, जबकि 5, 8, 12 अड़चनें दर्शाते हैं)। (सफल करियर के वचन की 100 में से कितने प्रतिशत संभावना है?)

B] नौकरी का वचन (Promise of Job):
➤ 6वें भाव का कस्पल सब-लॉर्ड (CSL) कौन है?
➤ यह 6th CSL किन भावों को सैगनिफाय कर रहा है?
➤ वह नौकरी के अनुकूल भावों से (2, 6, 10, 11) जुड़ा है या नौकरी छूटने/अड़चन के भावों से (1, 5, 9, 12)?

विश्लेषण: जातक के लिए नौकरी में (Job/Service) स्थिरता और सफलता का स्पष्ट वचन है क्या? (सफल नौकरी के वचन की 100 में से कितने प्रतिशत संभावना है?)

C] व्यापार का वचन (Promise of Business):
➤ 7वें भाव का कस्पल सब-लॉर्ड (CSL) कौन है?
➤ यह 7th CSL किन भावों को सैगनिफाय कर रहा है?
➤ वह व्यापार के अनुकूल भावों से (2, 7, 10, 11) जुड़ा है या व्यापार में नुकसान/बर्बादी के भावों से (5, 8, 12)?

विश्लेषण: जातक स्वतंत्र व्यापार में (Business) सफल हो सकेगा या उसे रिस्क लेने से बचना चाहिए? (सफल व्यापार के वचन की 100 में से कितने प्रतिशत संभावना है?)

2] पेशे का स्वरूप (Nature of Profession):

A] समग्र पेशे का स्वरूप (Nature of Profession):
➤ 10वें CSL का नक्षत्र स्वामी कौन है और वह कहाँ स्थित है?
➤ 10वें CSL का उप-स्वामी (SL) कौन है और वह कहाँ स्थित है?
➤ 10वें CSL का उप-उप स्वामी (SSL) कौन है और वह कहाँ स्थित है?
➤ करियर से संबंधित भावों (2, 6, 10, 11) को सैगनिफाय करने वाले प्रमुख ग्रह कौन से हैं और उनकी स्थिति क्या है?
➤ भाव 2, 6, 10, 11 के सबसे मजबूत सैगनिफिकेटर ग्रह कौन से हैं?

विश्लेषण: नौकरी, व्यापार या स्वतंत्र पेशे का सटीक निर्धारण। ग्रहों के स्वभाव से कार्यक्षेत्र की खोज।

B] नौकरी का स्वरूप (Nature of Job):
➤ 6वें CSL का नक्षत्र स्वामी कौन है और वह कहाँ स्थित है?
➤ 6वें CSL का उप-स्वामी (SL) कौन है और वह कहाँ स्थित है?
➤ 6वें CSL का उप-उप स्वामी (SSL) कौन है और वह कहाँ स्थित है?

विश्लेषण: जातक नौकरी करता हो तो उसे किस प्रकार की जॉब (जैसे: टेक्निकल, एडमिनिस्ट्रेटिव, सर्विस) करनी चाहिए?

C] व्यापार का स्वरूप (Nature of Business):
➤ 7वें CSL का नक्षत्र स्वामी कौन है और वह कहाँ स्थित है?
➤ 7वें CSL का उप-स्वामी (SL) कौन है और वह कहाँ स्थित है?
➤ 7वें CSL का उप-उप स्वामी (SSL) कौन है और वह कहाँ स्थित है?

विश्लेषण: जातक व्यापार करता हो तो उसे किस प्रकार का बिज़नेस (जैसे: पार्टनरशिप, ट्रेडिंग, कंसल्टेंसी, मैन्युफैक्चरिंग) सबसे ज़्यादा सूट करेगा?

3] पदोन्नति और सफलता का काल (Timing of Promotion):

A] नौकरी में पदोन्नति और काल (Timing of Promotion in Job):
➤ भाव 2, 6, 10, 11 के प्रबल सैगनिफिकेटर (Significator) ग्रह कौन से हैं?
➤ वर्तमान में, या भविष्य में इन सैगनिफिकेटर ग्रहों की दशा/अंतर्दशा/प्रत्यंतर दशा कब आएगी?
➤ गोचर में शनि और गुरु का संबंध दशा स्वामियों से या महत्वपूर्ण कस्पों से कब हो रहा है?

विश्लेषण: पदोन्नति, नौकरी में बदलाव या करियर की महत्वपूर्ण घटनाओं के संभावित समय का निर्धारण।

B] व्यापार में बड़ी सफलता और काल (Timing of Success in Business):
➤ भाव 2, 7, 10, 11 के प्रबल सैगनिफिकेटर (Significator) ग्रह कौन से हैं?
➤ वर्तमान में, या भविष्य में इन सैगनिफिकेटर ग्रहों की दशा/अंतर्दशा/प्रत्यंतर दशा कब आएगी?
➤ गोचर में शनि और गुरु का संबंध व्यापार के महत्वपूर्ण कस्पों से (विशेषतः 7 और 11) कब हो रहा है?
विश्लेषण: बिज़नेस में बड़ा प्रॉफिट, एक्सपेंशन या किसी बड़ी डील के फाइनल होने का संभावित काल।

4] सरकारी नौकरी का वचन (Promise of Government Job):

A] 10वें भाव के CSL (Cuspal Sub-Lord) का विश्लेषण:
➤ 10वें भाव का CSL कौन सा ग्रह है?
➤ यह 10th CSL स्वयं, या अपने नक्षत्र स्वामी (NL) के माध्यम से सूर्य (Sun) या चंद्रमा (Moon) से जुड़ा है क्या? (सूर्य सरकार का प्राथमिक कारक है, चंद्रमा पब्लिक सेक्टर/प्रशासन का)।
➤ सूर्य (Sun) या चंद्रमा (Moon) स्वयं अपने नक्षत्र स्वामी (NL) या राशि स्वामी (RL) के माध्यम से 10th CSL से जुड़े हैं क्या? (रिवर्स कनेक्शन चेक)।
➤ यह 10th CSL 2, 6, 10 या 11 भावों को प्रबल रूप से सैगनिफाय कर रहा है क्या?

➤ 6वें भाव का CSL कौन सा ग्रह है?
➤ 6th CSL का संबंध सूर्य या शनि (सेवा का कारक) से बन रहा है क्या?
➤ 6th CSL 2, 6, 10, 11 भावों का सैगनिफिकेटर है क्या?

C] विश्लेषण और फलादेश निर्देश:
➤ प्रबल योग (Strong Promise): यदि 10th और 6th दोनों CSL का संबंध सूर्य से हो और वे 2, 6, 10, 11 भाव दर्शाते हों, तो स्पष्ट रूप से बताएं कि जन्म कुंडली में उच्च स्तरीय सरकारी नौकरी का 100% वचन है।
➤ मध्यम/संविदा (Contractual/State Govt): सूर्य के बजाय मंगल (पुलिस/सेना) या गुरु (शिक्षा/न्याय) का प्रभाव हो और 6, 10, 11 भाव सक्रिय हों, तो राज्य सरकार या पब्लिक सेक्टर (PSU) की संभावना बताएं।
➤ निजी क्षेत्र (Private Sector): यदि 10th/6th CSL का सूर्य या चंद्रमा से कोई संबंध न हो, और वे राहु/केतु या बुध से जुड़े हों, तो स्पष्ट करें कि सफलता निजी क्षेत्र में या मल्टिनेशनल कंपनी (MNC) में मिलेगी।

➤ D60 (षष्टियंश) - पूर्व पुण्य और अंतिम परिणाम (Karmic Legacy)
​
यदि D1 और D10 में राजयोग हों, परंतु D60 में वह ग्रह शापित हो, तो करियर में ऊँचाई पर जाकर भी गिरावट आ सकती है। यह 'सस्टेनेबल सक्सेस' (टिकाऊ सफलता) देखने के लिए D60 का विश्लेषण है।

संयुक्त भाग: शिक्षण (Education) (भाग 1-5 + D60)

➤ गुरु और बुध का परस्पर संबंध (युति, दृष्टि, राशि परिवर्तन) क्या है?
➤ गुरु और बुध D24 में किस स्थिति में हैं (उच्च/नीच/स्वराशि/वर्गोत्तम)?
➤ पंचमेश (शिक्षण) या चतुर्थेश (प्रारंभिक शिक्षण) का गुरु या बुध के साथ कोई सीधा संबंध बन रहा है क्या?

विश्लेषण: बच्चे की बुद्धि और ज्ञान का अंतिम स्तर (Education Status) कैसा रहेगा? कुंडली में असाधारण विद्या का (उच्च शिक्षण/विशेषज्ञता) योग है या अभ्यास के लिए लगातार संघर्ष करना पड़ेगा? शिक्षण का मुख्य स्रोत और दिशा क्या होगी?

उपरोक्त सभी विवरणों से जानकारी निकालें और विश्लेषण भी करें, "विश्लेषण:" मुद्दों का विश्लेषण करें। उत्तरों के साथ प्रश्न भी लिखें

भाग 2: जैमिनी ज्योतिष के अनुसार शिक्षण का विश्लेषण

(यह भाग शिक्षण में प्रतिभा, आत्मा की रुचि और विद्या की दिशा समझने के लिए है।)

1] आत्मकारक (AK) और अमात्यकारक (AmK) - आत्मा का उद्देश्य और मार्गदर्शक:
A] आत्मकारक (AK):

➤ जैमिनी पद्धति से आत्मकारक ग्रह कौन सा है? (सबसे अधिक अंश वाला ग्रह)
➤ आत्मकारक किस राशि और भाव में स्थित है?
➤ आत्मकारक के साथ किन ग्रहों की (चर कारक) युतियाँ हैं?
➤ आत्मकारक पर किन राशियों की जैमिनी राशि दृष्टि है? (चर, स्थिर, द्विस्वभाव)
➤ आत्मकारक किस नवमांश में स्थित है?
➤ आत्मकारक किस नक्षत्र में स्थित है?

B] अमात्यकारक (AmK):

➤ जैमिनी पद्धति से अमात्यकारक ग्रह कौन सा है? (दूसरा सबसे अधिक अंश वाला ग्रह)
➤ अमात्यकारक किस राशि और भाव में स्थित है?
➤ अमात्यकारक के साथ किन ग्रहों की (चर कारक) युतियाँ हैं?
➤ अमात्यकारक पर किन राशियों की जैमिनी राशि दृष्टि है? (चर, स्थिर, द्विस्वभाव)
➤ अमात्यकारक किस नवमांश में स्थित है?
➤ अमात्यकारक किस नक्षत्र में स्थित है?

विश्लेषण: AK बच्चे की आत्मा का मूल उद्देश्य दर्शाता है। AmK वह मार्ग या मार्गदर्शक (शिक्षक/विषय) दर्शाता है जो बच्चे की रुचि और शिक्षण की दिशा तय करने में मदद करता है।

2] AK और AmK का परस्पर संबंध - रुचि और मार्ग में सामंजस्य:
➤ AK और AmK एक-दूसरे से शुभ भावों में स्थित हैं क्या (जैसे केंद्र 1, 4, 7, 10; त्रिकोण 1, 5, 9; या 3/11 का संबंध)?
➤ वे एक-दूसरे पर जैमिनी राशि दृष्टि डाल रहे हैं क्या?

विश्लेषण: यह संबंध शिक्षण में सहजता और रुचि दर्शाता है। संबंध शुभ हो तो बच्चा अपनी रुचि के अनुसार अभ्यास में सहज आगे बढ़ेगा। अशुभ संबंध अभ्यास में आंतरिक असंतोष और दिशा का भटकाव दर्शाता है।

3] मंत्रपद (A5) - विद्या और बुद्धि की प्रतिमा:
➤ A5 (मंत्रपद) किस राशि और भाव में स्थित है?
➤ A5 में कौन से ग्रह (चर कारक) स्थित हैं?
➤ A5 पर किन राशियों की जैमिनी राशि दृष्टि है? (चर, स्थिर, द्विस्वभाव) (शुभ ग्रहों का प्रभाव विद्या में यश देता है, पाप ग्रहों का प्रभाव अभ्यास में संघर्ष या वाद)।
➤ A5 का संबंध लग्न आरूढ (AL), आत्मकारक (AK) या अमात्यकारक (AmK) से बन रहा है क्या?

विश्लेषण: यह दर्शाता है कि बच्चे की विद्या और बुद्धि की वास्तविक क्षमता क्या है और दुनिया उसे अभ्यास में कैसे देखेगी।

4] कारकांश लग्न (Karakamsa Lagna) - छिपी प्रतिभा और विद्या:
➤ कारकांश लग्न से पंचम भाव में कौन सी राशि और ग्रह हैं?
➤ कारकांश पंचमेश कहाँ स्थित है?
➤ कारकांश पंचमेश किन ग्रहों के साथ युति में है?

विश्लेषण: यह बच्चे की छिपी प्रतिभा, आंतरिक रुचि और विद्या की वास्तविक दिशा दर्शाता है। कारकांश से पंचम भाव बच्चे के सीखने का स्वभाव और ज्ञान का अंतिम स्वरूप दर्शाता है।

5] अर्गला विश्लेषण - अदृश्य हस्तक्षेप और संसाधनों का प्रवाह:

➤ पंचम भाव पर अर्गला: बच्चे के अभ्यास को किन ग्रहों से लगातार सहयोग या बाधा मिल रही है (जैसे माता-पिता, शिक्षक, संसाधन)?
➤ अमात्यकारक (AmK) पर अर्गला: शिक्षण में शिक्षक, मार्गदर्शक या सहपाठियों से मिलने वाले सहयोग या बाधा का विश्लेषण।
➤ A5 (मंत्र पद) पर अर्गला: बच्चे की विद्या-प्रतिमा और अभ्यास की प्रतिष्ठा को कौन सी शक्तियाँ पर्दे के पीछे से मजबूत कर रही हैं या कमजोर कर रही हैं?

विश्लेषण: शिक्षण में मिलने वाला अदृश्य सहयोग, संसाधनों का प्रवाह और छिपी बाधाएँ खोजना।

6] सुखपद (A4) - प्रारंभिक शिक्षण और school का वातावरण:
➤ A4 (सुखपद) किस राशि और भाव में स्थित है?
➤ A4 में कौन से ग्रह स्थित हैं?
➤ A4 पर किन राशियों की (चर, स्थिर, द्विस्वभाव) जैमिनी दृष्टि है?
➤ आत्मकारक (AK) या अमात्यकारक (AmK) का A4 से कोई संबंध (युति या जैमिनी दृष्टि) बन रहा है क्या?
➤ A4 से चतुर्थ भाव में कौन से ग्रह हैं?

विश्लेषण: बच्चे का प्रारंभिक शिक्षण कैसा रहेगा? school का वातावरण, घर से अभ्यास में मिलने वाला सहयोग और माँ का साथ कैसा रहेगा? बच्चे को घर पर अभ्यास का अनुकूल वातावरण मिलेगा या school बदलने/hostel जैसे योग बनेंगे?

उपरोक्त सभी विवरणों से जानकारी निकालें और विश्लेषण भी करें, "विश्लेषण:" मुद्दों का विश्लेषण करें, इसके साथ ग्रह की अवस्था (उच्च, नीच, नीचभंग, अस्त, वक्री, शत्रु-मित्र-सम राशि) भी ब्रैकेट में लिखें। उत्तरों के साथ प्रश्न भी लिखें

भाग 3: भृगु नंदी नाडी (BNN) के अनुसार शिक्षण का विश्लेषण

(यह भाग ग्रहों के प्रवाह और जीवन के पैटर्न के आधार पर शिक्षण समझने के लिए है।)

1] बुध (विद्या कारक) की स्थिति और संबंध:
➤ बुध किस राशि में है (और किस डिग्री पर है)?
➤ बुध किस ग्रह के नक्षत्र में है?
➤ बुध के साथ युति में कौन से ग्रह हैं?
➤ बुध से दूसरी और बारहवीं राशि में कौन से ग्रह हैं?
➤ बुध से त्रिकोण में (1-5-9) कौन से ग्रह हैं?

विश्लेषण: बच्चे की बुद्धि का मूल स्वभाव, सीखने की शैली (जैसे तर्क, भाषा, गणित) और अभ्यास में आने वाला अनुशासन/संघर्ष।

2] गुरु (ज्ञान कारक) और बुध का संबंध:
➤ गुरु और बुध का परस्पर संबंध क्या है (युति, 2-12, 1-5-9)?

विश्लेषण: बच्चे के ज्ञान (गुरु) और बुद्धि (बुध) के बीच का संबंध। यह बताता है कि अभ्यास गहरा और संतोषजनक होगा या सतही और बोझ जैसा लगेगा।

3] शिक्षण से संबंधित अन्य ग्रहों का प्रभाव:
➤ चंद्र, मंगल या शनि का बुध से क्या संबंध है? (चंद्र - मन और स्मरण, मंगल - स्पर्धा और तंत्र, शनि - अनुशासन और मेहनत)।

विश्लेषण: सीखने के विशेष स्वभाव का निर्धारण। (जैसे, बुध+चंद्र = स्मरण/भाषा में तेज़, बुध+मंगल = गणित/तंत्र, बुध+शनि = धीमी शुरुआत लेकिन गहरी पकड़)।

4] पंचमेश नवांशाधिपति (Panchmesh Navamshadhipati) का सूत्र (शिक्षण में बाधा और उपाय):
➤ जन्म कुंडली (D-1) में पंचम भाव का स्वामी (पंचमेश / 5th Lord) कौन सा ग्रह है?
➤ नवांश कुंडली (D-9) में वह पंचमेश किस भाव में और किस राशि में बैठा है?
➤ नवांश में पंचमेश का डिस्पॉज़िटर (नवांशाधिपति - उस राशि का स्वामी) कौन सा ग्रह है?
➤ नवांश कुंडली में वह डिस्पॉज़िटर स्वयं पंचमेश से किस स्थान पर बैठा है (पंचमेश को प्रथम स्थान मानकर गिनें; विशेषतः वह पंचमेश से 6वें, 8वें या 12वें स्थान पर है क्या)?
➤ नवांश कुंडली में वह डिस्पॉज़िटर स्वयं किस भाव में बैठा है (विशेषतः वह नवांश के 6वें, 8वें या 12वें भाव में है क्या)?

विश्लेषण: यदि नवांश में पंचमेश का डिस्पॉज़िटर स्वयं पंचमेश से 6-8-12 के संबंध में बैठा हो, तो शिक्षण में बाधाएँ (Obstructions) और अस्थिरता आती है, और यदि वह डिस्पॉज़िटर नवांश कुंडली के स्वयं के 6वें, 8वें या 12वें भाव में भी हो तो बाधा दोगुनी (प्रबल) मानी जाएगी। यदि संबंध 6-8-12 में न हो तो स्पष्ट लिखें कि इस सूत्र से शिक्षण में बाधा नहीं बनती। उसके उपाय का (Education Alignment) निर्धारण - अर्थात यदि डिस्पॉज़िटर 12वाँ हो तो विदेश में शिक्षण, hostel या दूरस्थ/online शिक्षण, 8वाँ हो तो research, तकनीकी या गूढ़ विषय, और 6वाँ हो तो स्पर्धा-आधारित, अनुशासन-प्रधान या परीक्षा-केंद्रित अभ्यास से जोड़कर इस बाधा को यश में बदलना।

उपरोक्त सभी विवरणों से जानकारी निकालें और विश्लेषण भी करें, "विश्लेषण:" मुद्दों का विश्लेषण करें, इसके साथ ग्रह वक्री हो तो वह भी ब्रैकेट में लिखें। उत्तरों के साथ प्रश्न भी लिखें

भाग 4: कृष्णमूर्ति पद्धति (KP) के अनुसार शिक्षण का विश्लेषण

(यह भाग शिक्षण की घटनाओं और यश के वचन का सटीक आकलन करने के लिए है।)

1] शिक्षण का वचन (Promise of Education)

A] समग्र शिक्षण का वचन (Overall Promise of Education):
➤ 5वें भाव का कस्पल सब-लॉर्ड (CSL) कौन है?
➤ यह CSL किन भावों को सैगनिफाय कर रहा है? (विशेषतः 4, 5, 9, 11 भावों का संबंध)।

विश्लेषण: कुंडली में सफल शिक्षण का वचन है क्या? (भाव 4, 5, 9, 11 शिक्षण, बुद्धि, उच्च शिक्षण और यश दर्शाते हैं, जबकि 6, 8, 12 बाधाएँ दर्शाते हैं)। (सफल शिक्षण के वचन की 100 में से कितने प्रतिशत संभावना है?)

B] प्रारंभिक शिक्षण का वचन (Promise of School Education):
➤ 4थे भाव का कस्पल सब-लॉर्ड (CSL) कौन है?
➤ यह 4th CSL किन भावों को सैगनिफाय कर रहा है?
➤ वह शिक्षण के अनुकूल भावों से (4, 5, 11) जुड़ा है या बाधा के भावों से (6, 8, 12)?

विश्लेषण: बच्चे के प्रारंभिक (school) शिक्षण में यश और स्थिरता का स्पष्ट वचन है क्या? (सफल प्रारंभिक शिक्षण के वचन की 100 में से कितने प्रतिशत संभावना है?)

C] उच्च शिक्षण का वचन (Promise of Higher Education):
➤ 9वें भाव का कस्पल सब-लॉर्ड (CSL) कौन है?
➤ यह 9th CSL किन भावों को सैगनिफाय कर रहा है?
➤ वह उच्च शिक्षण के अनुकूल भावों से (5, 9, 11) जुड़ा है या बाधा के भावों से (6, 8, 12)?

विश्लेषण: बच्चा उच्च शिक्षण तक (स्नातक/स्नातकोत्तर/व्यावसायिक पाठ्यक्रम) सफलतापूर्वक पहुँचेगा क्या? (सफल उच्च शिक्षण के वचन की 100 में से कितने प्रतिशत संभावना है?)

2] शिक्षण का स्वभाव (Nature of Education):

A] समग्र शिक्षण का स्वभाव (Nature of Education):
➤ 5वें CSL का नक्षत्र स्वामी कौन है और वह कहाँ स्थित है?
➤ 5वें CSL का उप-स्वामी (SL) कौन है और वह कहाँ स्थित है?
➤ 5वें CSL का उप-उप स्वामी (SSL) कौन है और वह कहाँ स्थित है?
➤ शिक्षण से संबंधित भावों को (4, 5, 9, 11) सैगनिफाय करने वाले प्रमुख ग्रह कौन से हैं और उनकी स्थिति क्या है?

विश्लेषण: अभ्यास की योग्य दिशा का सटीक निर्धारण। ग्रहों के स्वभाव से stream और विषय खोजना।

B] प्रारंभिक शिक्षण का स्वभाव (Nature of School Education):

➤ 4थे CSL का उप-स्वामी (SL) कौन है और वह कहाँ स्थित है?
➤ 4थे CSL का उप-उप स्वामी (SSL) कौन है और वह कहाँ स्थित है?

C] उच्च शिक्षण का स्वभाव (Nature of Higher Education):
➤ 9वें CSL का नक्षत्र स्वामी कौन है और वह कहाँ स्थित है?
➤ 9वें CSL का उप-स्वामी (SL) कौन है और वह कहाँ स्थित है?
➤ 9वें CSL का उप-उप स्वामी (SSL) कौन है और वह कहाँ स्थित है?

3] शिक्षण में यश का समय (Timing of Success in Education):

A] परीक्षा यश और प्रवेश का समय (Timing of Exam Success and Admission):
➤ भाव 4, 5, 11 के प्रबल सैगनिफिकेटर (Significator) ग्रह कौन से हैं?
➤ वर्तमान में, या भविष्य में इन सैगनिफिकेटर ग्रहों की दशा/अंतर्दशा/प्रत्यंतर्दशा कब आने वाली है?
➤ गोचर में शनि और गुरु का संबंध दशा स्वामियों से या महत्वपूर्ण कस्पों से कब हो रहा है?

विश्लेषण: board परीक्षा में यश, अच्छे school/college में प्रवेश या शिक्षण की महत्वपूर्ण घटनाओं के संभाव्य समय का निर्धारण।

B] स्पर्धा परीक्षा और उच्च शिक्षण में यश का समय (Timing of Competitive and Higher Education Success):
➤ भाव 5, 6, 9, 11 के प्रबल सैगनिफिकेटर (Significator) ग्रह कौन से हैं?
➤ वर्तमान में, या भविष्य में इन सैगनिफिकेटर ग्रहों की दशा/अंतर्दशा/प्रत्यंतर्दशा कब आने वाली है?
➤ गोचर में शनि और गुरु का संबंध शिक्षण के महत्वपूर्ण कस्पों से (विशेषतः 9 और 11) कब हो रहा है?
विश्लेषण: स्पर्धा परीक्षा में (JEE/NEET इत्यादि) चयन, scholarship या उच्च शिक्षण में बड़े यश का संभाव्य समय।

4] सरकारी संस्था और शिष्यवृत्ति का वचन (Promise of Government Institution and Scholarship):

A] 5वें भाव के CSL (Cuspal Sub-Lord) का विश्लेषण:
➤ 5वें भाव का CSL कौन सा ग्रह है?
➤ यह 5th CSL स्वयं, या अपने नक्षत्र स्वामी (NL) के माध्यम से सूर्य (Sun) या चंद्र (Moon) से जुड़ा है क्या? (सूर्य सरकार का प्राथमिक कारक है, चंद्र सार्वजनिक संस्था/प्रशासन का)।
➤ सूर्य (Sun) या चंद्र (Moon) स्वयं अपने नक्षत्र स्वामी (NL) या राशि स्वामी (RL) के माध्यम से 5th CSL से जुड़े हैं क्या? (रिव्हर्स कनेक्शन चेक)।
➤ यह 5th CSL 4, 5, 9 या 11 भावों को प्रबलता से सैगनिफाय कर रहा है क्या?

B] 4थे भाव के (प्रारंभिक शिक्षण/संस्था) CSL का विश्लेषण:
➤ 4थे भाव का CSL कौन सा ग्रह है?
➤ 4th CSL का संबंध सूर्य या शनि (अनुशासन/संस्था का कारक) से बन रहा है क्या?
➤ 4th CSL 4, 5, 9, 11 भावों का सैगनिफिकेटर है क्या?

C] विश्लेषण और फलादेश निर्देश:
➤ प्रबल योग (Strong Promise): यदि 5th और 4th दोनों CSL का संबंध सूर्य से हो और वे 4, 5, 9, 11 भाव दर्शाते हों, तो स्पष्ट बताएँ कि जन्म कुंडली में सरकारी संस्था में प्रवेश और शिष्यवृत्ति का (Scholarship) 100% वचन है।
➤ मध्यम/राज्य संस्था (State/Aided Institution): यदि सूर्य के बजाय मंगल (रक्षा/तकनीकी संस्था) या गुरु (शिक्षण/विश्वविद्यालय) का प्रभाव हो और 5, 9, 11 भाव सक्रिय हों, तो राज्य सरकार, aided संस्था या सार्वजनिक विश्वविद्यालय की संभावना बताएँ।
➤ निजी संस्था (Private Institution): यदि 5th/4th CSL का सूर्य या चंद्र से कोई संबंध न हो, और वे राहु/केतु या बुध से जुड़े हों, तो स्पष्ट करें कि यश निजी (Private) संस्था में या विदेशी संस्था में मिलेगा।

➤ D60 (षष्ट्यंश) - पूर्व पुण्य और अंतिम परिणाम (Karmic Legacy)

यदि D1 और D24 में विद्या के राजयोग हों, लेकिन D60 में वह ग्रह शापित हो, तो शिक्षण में शुरुआती ऊँचाई के बाद भी बाधा आ सकती है। यह 'सस्टेनेबल सक्सेस' (टिकाऊ यश) देखने के लिए D60 का विश्लेषण।

1] D60 लग्न और लग्नेश - कार्मिक ब्लूप्रिंट (The Karmic Blueprint)

2] D60 पंचम भाव और पंचमेश - कार्मिक विद्या (The Karmic Learning)

3] राजयोग कारक ग्रहों की D60 में स्थिति
यह विश्लेषण सीधे बताएगा कि D1/D24 के शक्तिशाली विद्या योग D60 में कितने मजबूत हैं।

भाग 5: निष्कर्ष और समग्र अवलोकन

संयुक्त भाग: संतान (Child Birth) (भाग 1-5 + D60)

ऊपर दिए गए सभी विवरणों से जानकारी निकालो और विश्लेषण भी करो, "विश्लेषण:" मुद्दों का विश्लेषण करो। साथ ही दृष्टि डालने वाले ग्रहों को छोड़कर, बाकी ग्रहों की अवस्था (उच्च-नीच-नीचभंग, शत्रु-मित्र-सम राशि; अस्त-वक्री-वर्गोत्तम) ब्रैकेट में लिखो। उत्तरों के साथ प्रश्न भी लिखो

भाग 1 A: पराशरी ज्योतिष के अनुसार संतान का विश्लेषण

(यह भाग संतान की संभावना, संख्या, सुख और उनके स्वभाव की मूलभूत जानकारी समझने के लिए है।)

1] पंचमेश (5वें भाव का स्वामी):
➤ कौन सा ग्रह पंचम भाव का स्वामी है?
➤ पंचमेश ग्रह किस राशि-भाव में है? (विशेष रूप से केंद्र/त्रिकोण में स्थिति)

➤ नवांश में लग्नेश ग्रह किस भाव, राशि और नक्षत्र (स्वामी) में है?
➤ नवांश में लग्नेश की युति या दृष्टि किन ग्रहों के साथ हो रही है?

➤ (D9) नवांश में D1 का पंचमेश किस भाव, राशि और नक्षत्र (स्वामी) में है?

➤ सप्तांश में पंचमेश के साथ युति में स्थित ग्रह किस नक्षत्र में है?

➤ (D7 में) जन्म कुंडली का पंचमेश किस भाव, राशि और नक्षत्र (स्वामी) में है?

वरील सर्व तपशीलांमधून माहिती काढा आणि विश्लेषणही करा; सोबत दृष्टी टाकणाऱ्या ग्रहांना सोडून उर्वरित ग्रहांची अवस्था (उच्च-नीच-नीचभंग, शत्रू-मित्र-सम राशी; अस्त-वक्री-वर्गोत्तम) कंसातही लिहा. उत्तरांसोबत प्रश्नही लिहा

भाग 1: पराशरी ज्योतिषानुसार विवाहाचे विश्लेषण (विवाहाचे स्वरूप आणि जीवनसाथीचे रूप):

1] सप्तमेश (7व्या भावाचा स्वामी):
➤ कोणता ग्रह सप्तम भावाचा स्वामी आहे?
➤ सप्तमेश ग्रह कोणत्या राशी-भावात स्थित आहे?
➤ सप्तमेश ग्रह कोणत्या नक्षत्रात (स्वामी) स्थित आहे?
➤ सप्तमेश ग्रहाची युती कोणत्या ग्रहांसोबत होत आहे?
➤ सप्तमेशासोबत युत असलेला ग्रह कोणत्या नक्षत्रात (स्वामी) स्थित आहे?
➤ सप्तमेशावर कोणत्या ग्रहांची दृष्टी आहे?
➤ लग्नेश आणि सप्तमेश यांत शत्रुत्व/मैत्री/समानता आहे का?

विश्लेषण: जीवनसाथीचा स्वभाव, विवाहाकडे जातकाचा दृष्टिकोन आणि वैवाहिक जीवनाची मुख्य दिशा.

2] सप्तम भाव (7th House):
➤ सप्तम भाव कोणत्या राशीत आणि नक्षत्रात (स्वामी) स्थित आहे?
➤ सप्तम भावात कोणकोणते ग्रह स्थित आहेत?
➤ सप्तम भावात स्थित ग्रह कोणत्या नक्षत्रात (स्वामी) स्थित आहे?
➤ सप्तम भावावर कोणकोणते ग्रह दृष्टी टाकत आहेत?

विश्लेषण: विवाहाचे स्वरूप, भागीदारीची गुणवत्ता आणि वैवाहिक सुखाची पातळी.

3] नवमांश कुंडली (D9 Chart):

A) D9 मध्ये सप्तम भाव आणि सप्तमेश:
➤ नवमांशात सप्तम भाव कोणत्या राशीत आणि नक्षत्रात (स्वामी) स्थित आहे?
➤ नवमांशात सप्तम भावात कोणकोणते ग्रह स्थित आहेत? (त्यांच्या नक्षत्र-स्वामींसह)
➤ नवमांशात सप्तम भावावर कोणत्या ग्रहांची दृष्टी आहे?
➤ नवमांशात सप्तमेश ग्रह कोण आहे आणि तो कोणत्या भावात, राशीत आणि नक्षत्रात (स्वामी) स्थित आहे?
➤ नवमांशात सप्तमेश ग्रहाची युती किंवा दृष्टी कोणत्या ग्रहांसोबत होत आहे?
➤ नवमांशात सप्तमेशासोबत युत असलेला ग्रह कोणत्या नक्षत्रात स्थित आहे?

B) D9 मध्ये लग्न आणि लग्नेश:
➤ नवमांशात लग्न कोणत्या राशीत आणि नक्षत्रात (स्वामी) स्थित आहे?
➤ नवमांशात लग्न भावात कोणकोणते ग्रह स्थित आहेत? (नक्षत्र-स्वामी)
➤ नवमांशात लग्नेश ग्रह कोणत्या भावात, राशीत आणि नक्षत्रात (स्वामी) स्थित आहे?
➤ नवमांशात लग्नेश ग्रहाची युती किंवा दृष्टी कोणत्या ग्रहांसोबत होत आहे?
➤ नवमांशात शुक्र आणि गुरूची स्थिती काय आहे?

विश्लेषण: नवमांशातील जीवनसाथीची गुणवत्ता, आंतरिक स्वभाव आणि विवाहाची खरी ताकद.

4] D1 च्या सप्तमेशाची नवमांशात (D9) स्थिती:
➤ (D9) नवमांशात D1 चा सप्तमेश कोणत्या भावात, राशीत आणि नक्षत्रात (स्वामी) स्थित आहे?
➤ (D9) नवमांशात D1 चा सप्तमेश कोणासोबत बसला आहे?
➤ (D9) नवमांशात D1 च्या सप्तमेशावर कोणत्या ग्रहांची दृष्टी आहे?

विश्लेषण: विवाहाची वास्तविक व आंतरिक गुणवत्ता, जीवनसाथीचा आंतरिक स्वभाव आणि विवाहानंतरचे भाग्य.

5] शुक्र आणि बृहस्पती:
➤ पुरुषाच्या कुंडलीत शुक्र कोणत्या भावात आणि राशीत आहे?
➤ शुक्र कोणत्या नक्षत्रात स्थित आहे?
➤ स्त्रीच्या कुंडलीत बृहस्पती कोणत्या भावात आणि राशीत आहे?
➤ गुरू कोणत्या नक्षत्रात स्थित आहे?
➤ या ग्रहांवर कोणकोणते ग्रह दृष्टी टाकत आहेत किंवा युती बनवत आहेत?

विश्लेषण: पुरुषासाठी पत्नीचे व स्त्रीसाठी पतीचे स्वरूप आणि वैवाहिक सुखाचे कारक बल.

6] शुक्र आणि मंगळ यांचा संबंध:
➤ शुक्र आणि मंगळ यांची युती किंवा दृष्टी आहे का?
➤ त्यांची स्थिती कोणकोणत्या भावांत आहे?

विश्लेषण: पती-पत्नींमधील आकर्षण, भावनिक-शारीरिक सुसंगती आणि वासनेचा प्रभाव.

7] शुक्र-राहू किंवा शुक्र-केतू यांचा प्रभाव:
➤ शुक्र आणि राहू/केतू यांची युती आहे का?
➤ जर होय, तर कोणत्या भावात आहे? (नक्षत्र, स्वामी)
➤ शुक्रावर राहू/केतूची दृष्टी आहे की नाही?

विश्लेषण: विवाहातील असामान्य आकर्षण, मोह, भ्रम किंवा वियोगाचे धोके.

8] सप्तम भावापासून दशम भाव (10th from 7th House):
➤ सप्तमापासून दहावा भाव कोणता आहे आणि त्यात कोणकोणते ग्रह आहेत?
➤ या भावाचा स्वामी कोणत्या स्थितीत आहे? (नक्षत्र, स्वामी)

विश्लेषण: जीवनसाथीचे करिअर व सार्वजनिक प्रतिष्ठा आणि त्याचा विवाहावरील प्रभाव.

9] सासरच्यांशी संबंध (8th House):
➤ अष्टम भाव कोणत्या राशीत आहे आणि त्याचा स्वामी कुठे स्थित आहे? (नक्षत्र, स्वामी)
➤ अष्टम भावात कोणकोणते ग्रह स्थित आहेत किंवा त्यावर दृष्टी टाकत आहेत?

विश्लेषण: सासरच्या कुटुंबाशी संबंध, त्यांचे स्वरूप आणि विवाहावरील त्यांचा प्रभाव.

10] चंद्र आणि सप्तम भाव यांचा संबंध:
➤ चंद्र कोणत्या भावात स्थित आहे?
➤ चंद्र कोणत्या नक्षत्रात स्थित आहे?
➤ सप्तम भाव किंवा सप्तमेश यांच्याशी त्याचा संबंध आहे का?
➤ चंद्रावर कोणकोणते ग्रह प्रभाव टाकत आहेत?
➤ सप्तम भावाशी संबंधित ग्रह चंद्राच्या नक्षत्रात आहे का? चंद्रासोबत युत, दृष्ट आहे का?

वरील सर्व तपशीलांमधून माहिती काढा आणि विश्लेषणही करा; "विश्लेषण:" मुद्द्यांचे विश्लेषण करा. उत्तरांसोबत प्रश्नही लिहा

विश्लेषण: जातकाची भावनिक सुसंगती, मानसिक शांती आणि वैवाहिक संबंधातील भावनिक स्थैर्य.

भाग 2: जैमिनी ज्योतिषानुसार विवाहाचे विश्लेषण:

1] दाराकारक (DK - Darakaraka):

➤ जैमिनी पद्धतीने दाराकारक ग्रह कोणता आहे? (सर्वांत कमी अंश असलेला ग्रह)
➤ दाराकारक कोणत्या राशीत आणि भावात स्थित आहे?
➤ दाराकारकासोबत कोणकोणत्या ग्रहांची (चर कारक) युती आहे?
➤ दाराकारकावर कोणत्या राशींची जैमिनी राशी दृष्टी आहे? (चर, स्थिर, द्विस्वभाव)
➤ दाराकारक कोणत्या नवमांशात स्थित आहे?
➤ दाराकारक कोणत्या नक्षत्रात स्थित आहे?

विश्लेषण: जीवनसाथीचा स्वभाव, व्यक्तिमत्त्व आणि मुख्य गुण.

2] उपपद लग्न (UL - Upapada Lagna):

➤ उपपद लग्न कोणते आहे आणि ते कोणत्या राशीत आणि भावात स्थित आहे?
➤ यात कोणकोणते ग्रह (चर कारक) स्थित आहेत?
➤ यावर कोणत्या राशींची जैमिनी राशी दृष्टी आहे? (चर, स्थिर, द्विस्वभाव)

विश्लेषण: विवाहाची गुणवत्ता, स्थिरता आणि जीवनसाथीच्या कुटुंबाची स्थिती.

3] दारापद (Darapada - A7):
➤ A7 (दारापद) कोणत्या राशीत आणि भावात स्थित आहे?
➤ A7 मध्ये कोणकोणते ग्रह (चर कारक) स्थित आहेत?
➤ A7 वर कोणत्या राशींची जैमिनी राशी दृष्टी आहे? (चर, स्थिर, द्विस्वभाव)

विश्लेषण: संबंधांत जातकाची बाह्य ओळख.

4] स्वांश आणि कारकांश यांवरून विवाहाचे विश्लेषण (आत्म्याच्या दृष्टिकोनातून):

A] स्वांश सप्तम भाव (आंतरिक वैवाहिक जीवन):
➤ स्वांश लग्नापासून सप्तम भावात कोणती राशी आणि ग्रह आहेत?
➤ स्वांश सप्तमेश कुठे स्थित आहे?
➤ स्वांश सप्तमेश कोणत्या ग्रहांसोबत युतीत आहे?

विश्लेषण: हे विवाहाची वास्तविक आणि आंतरिक गुणवत्ता, जीवनसाथीचा आंतरिक स्वभाव आणि विवाहानंतरचे तुमचे भाग्य दर्शवते. हे दाखवते की तुमच्या आत्म्याला विवाहाबद्दल "आतून" कसे वाटेल.

B] कारकांश सप्तम भाव (बाह्य वैवाहिक अनुभव):
➤ कारकांश लग्नापासून सप्तम भावात कोणती राशी आणि ग्रह आहेत?
➤ कारकांश सप्तमेश कुठे स्थित आहे?
➤ कारकांश सप्तमेश कोणत्या ग्रहांसोबत युतीत आहे?

विश्लेषण: हे तुमच्या वैवाहिक जीवनाचे कर्म आणि भाग्य दर्शवते. हे सांगते की या जीवनात तुमच्या आत्म्याला विवाहाच्या माध्यमातून कोणत्या प्रकारच्या "अनुभवां"तून किंवा "कर्मां"तून जावे लागणार आहे. हे विवाहाचा अधिक घटना-उन्मुख (event-oriented) पक्ष दाखवते.

5] UL आणि DK यांचा परस्पर संबंध:

➤ UL आणि DK एकमेकांवर जैमिनी राशी दृष्टी टाकत आहेत का?
➤ ते एकमेकांपासून शुभ भावांत (केंद्र, त्रिकोण) आहेत का?

विश्लेषण: विवाहाची शक्यता आणि संबंधाची खोली.

6] अर्गला विश्लेषण (अप्रत्यक्ष हस्तक्षेप आणि संसाधनांचा प्रवाह):

A) सप्तम भावावरील अर्गला: विवाहाच्या "संस्थेला" कोणत्या ग्रहांकडून सतत सहकार्य किंवा अडथळा मिळत आहे?
➤ सप्तम भावापासून दुसऱ्या, चौथ्या, अकराव्या आणि पाचव्या भावात कोणते ग्रह (शुभ/पाप) आहेत?
या अर्गलांना विरोध करणारे ग्रह (बाराव्या, दहाव्या, तिसऱ्या आणि नवव्या भावात) अस्तित्वात आहेत का? कोण अधिक बलवान आहे?

विश्लेषण: विवाहाची एकंदरीत सुलभता, त्यातील बाह्य आव्हाने आणि सुखाची पातळी.

B) दाराकारकावर (DK) अर्गला: जीवनसाथीला कोणत्या ग्रहांकडून सतत सहकार्य किंवा अडथळा मिळत आहे?
➤ DK ज्या भावात आहे, त्यापासून दुसऱ्या, चौथ्या, अकराव्या आणि पाचव्या भावात कोणते ग्रह आहेत? या अर्गलांचा विरोध होत आहे का?

विश्लेषण: जीवनसाथीचे भाग्य, त्याचे आरोग्य आणि नात्याच्या आंतरिक गतिशीलतेवर होणारा परिणाम.

C) उपपद लग्नावर (UL) अर्गला: विवाहाच्या स्थिरतेवर कोणत्या शक्ती परिणाम करत आहेत?
➤ UL ज्या भावात आहे, त्यापासून दुसऱ्या, चौथ्या, अकराव्या आणि पाचव्या भावात कोणते ग्रह आहेत? या अर्गलांचा विरोध होत आहे का?

विश्लेषण: विवाहाचे दीर्घायुष्य आणि त्याला मिळणारे सामाजिक/कौटुंबिक समर्थन.

वरील सर्व तपशीलांमधून माहिती काढा आणि विश्लेषणही करा; "विश्लेषण:" मुद्द्यांचे विश्लेषण करा; सोबत ग्रहाची अवस्था (उच्च, नीच, नीचभंग, अस्त, वक्री, शत्रू-मित्र-सम राशी) कंसातही लिहा. उत्तरांसोबत प्रश्नही लिहा

भाग 3: भृगु नंदी नाडीनुसार (BNN) जीवनसाथीचे विश्लेषण:

1] गुरू (Jupiter) - जीव कारकाची स्थिती आणि संबंध:

➤ गुरू कोणत्या राशीत आहे (आणि किती डिग्रीवर आहे)?
➤ गुरू कोणत्या ग्रहाच्या नक्षत्रात आहे?
➤ गुरूसोबत युतीत कोणते ग्रह आहेत?
➤ गुरूपासून दुसऱ्या आणि बाराव्या राशीत कोणते ग्रह आहेत?
➤ गुरूपासून त्रिकोणात (1-5-9) कोणते ग्रह आहेत?
विश्लेषण: जातकाचे मूळ व्यक्तिमत्त्व, स्वभाव, भाग्य आणि विवाहाबद्दलचा दृष्टिकोन.

2] जीवनसाथी कारकाची स्थिती आणि संबंध (पुरुषासाठी शुक्र, स्त्रीसाठी मंगळ):

➤ कुंडलीच्या जेंडरनुसार जीवनसाथी कारक ग्रह निवडा (पुरुष जातक = शुक्र, स्त्री जातक = मंगळ).
➤ हा कारक ग्रह कोणत्या राशीत आहे (आणि किती डिग्रीवर आहे)?
➤ हा कारक ग्रह कोणत्या ग्रहाच्या नक्षत्रात आहे?
➤ या कारक ग्रहासोबत युतीत कोणते ग्रह आहेत?
➤ या कारक ग्रहापासून दुसऱ्या आणि बाराव्या राशीत कोणते ग्रह आहेत?
➤ या कारक ग्रहापासून त्रिकोणात (1-5-9) कोणते ग्रह आहेत?
विश्लेषण: जीवनसाथीची मूळ प्रकृती, रंग-रूप, वागणूक आणि वैवाहिक सुखाची गुणवत्ता.

3] जीव/स्वतः आणि जीवनसाथी यांचा परस्पर संबंध - विवाहाचे मुख्य सूत्र:

➤ पुरुषाच्या कुंडलीत: गुरू (जीव) आणि शुक्र (पत्नी) युती, 2-12 किंवा 1-5-9 संबंधात आहेत का?
➤ स्त्रीच्या कुंडलीत: शुक्र (स्वतः स्त्री देह) आणि मंगळ (पती) युती, 2-12 किंवा 1-5-9 संबंधात आहेत का?
➤ जर युती असेल, तर त्यांच्या डिग्रीत किती निकटता आहे? इतर कोणता परस्पर संबंध?
विश्लेषण: विवाहाची प्रबलता, पती-पत्नी यांच्यातील परस्पर संबंधाचे स्वरूप आणि वैवाहिक आनंद.

4] इतर महत्त्वाच्या ग्रहांचा प्रभाव:

➤ शनी (कर्म): शनीचा जीवनसाथी कारक ग्रहाशी (पुरुषासाठी शुक्र, स्त्रीसाठी मंगळ) काय संबंध आहे (युती, 2-12, 1-5-9)?
➤ राहू आणि केतू: राहू/केतूचा जीवनसाथी कारक ग्रह किंवा विवाह सूत्राशी (गुरू-शुक्र किंवा शुक्र-मंगळ) काय संबंध आहे? (हे वेगळेपणा, आंतरजातीय विवाह किंवा अडथळे दर्शवते).
➤ वक्री ग्रह: जीवनसाथी कारक ग्रह, गुरू, किंवा त्यांवर प्रभाव टाकणारा कोणताही ग्रह वक्री (Retrograde) आहे का?

वरील सर्व तपशीलांमधून माहिती काढा आणि विश्लेषणही करा; "विश्लेषण:" मुद्द्यांचे विश्लेषण करा; सोबत ग्रह वक्री असल्यास तेही कंसात लिहा. उत्तरांसोबत प्रश्नही लिहा

भाग 4: कृष्णमूर्ति पद्धतीनुसार (KP) विवाह आणि जीवनसाथीचे विश्लेषण:

1] विवाहाचे वचन (Promise of Marriage):
➤ 7व्या भावाचा कस्पल सब-लॉर्ड (CSL) कोण आहे?
➤ हा CSL कोणत्या भावांना सिग्निफाय करत आहे (विशेषतः 2, 7, 11 भावांच्या संबंधात)?
➤ हा CSL विवाह नाकारणाऱ्या भावांनाही (जसे 1, 6, 8, 10, 12 - जे वेगळेपणा किंवा विलंब दर्शवतात) सिग्निफाय करत आहे का?

विश्लेषण: कुंडलीत विवाहाचे स्पष्ट वचन आहे की अडथळे/नकाराची शक्यता आहे? (विवाहाच्या वचनाची 100 पैकी किती टक्के शक्यता आहे?)

2] विवाहातील विलंबाचे योग (Delay in & Obstacles in Marriage):

➤ 7th CSL शनी आहे का, किंवा शनीच्या नक्षत्रात बसला आहे का?
➤ 7th CSL प्रबलपणे 8व्या भावाला (अडथळा, विलंब आणि अचानक अडचण) सिग्निफाय करत आहे का?
➤ 7th CSL प्रबलपणे 12व्या भावाला (विवाह विरक्ती, दूर जाणे आणि एकांत) तसेच 1, 6, 10 भावांना (विवाहाचे अडथळा भाव) सिग्निफाय करत आहे का?

विश्लेषण: विवाह सामान्य वयात होईल, लवकर होईल, की यात असामान्य विलंब (Late Marriage) आणि मोठ्या अडथळ्यांचे स्पष्ट योग आहेत? विलंबाचे मुख्य ज्योतिषीय कारण काय आहे?

3] जीवनसाथीची प्रकृती आणि वैवाहिक संबंध (Nature of Spouse & Marital Relations):
➤ 7व्या CSL चा नक्षत्र स्वामी कोण आहे आणि तो कुठे स्थित आहे?
➤ 7व्या CSL चा उप-स्वामी कोण आहे आणि तो कुठे स्थित आहे?
➤ 7व्या CSL चा SSL कोण आहे आणि तो कुठे स्थित आहे?
➤ विवाहाशी संबंधित भावांना (2, 7, 11) सिग्निफाय करणारे प्रमुख ग्रह कोणते आहेत आणि त्यांची स्थिती काय आहे?

विश्लेषण: जीवनसाथीचा साधारण स्वभाव, व्यक्तिमत्त्व आणि वैवाहिक संबंधाची एकंदरीत गुणवत्ता.

4] वैवाहिक जीवनाची गुणवत्ता आणि वेगळेपणा (Quality of Married Life & Separation):
➤ 7th CSL विवाहासाठी शुभ भावांना (2, 7, 11) दृढपणे दाखवत आहे का?
➤ 7th CSL वेगळेपणा/घटस्फोटाच्या भावांना (1, 6, 10) प्रबलपणे सिग्निफाय करत आहे का? (लक्षात ठेवा: 6वा भाव 7व्यापासून 12वा आहे, जो कायदेशीर वेगळेपणा देतो).
➤ 7th CSL 8व्या भावाला (मानसिक तणाव, सासरच्यांकडून क्लेश, गुप्त फसवणूक, किंवा जीवनसाथीसाठी मारक कष्ट) सिग्निफाय करत आहे का?
➤ 7th CSL किंवा 11th CSL चा 12व्या भावाशी (शय्या सुखाची कमतरता/गुप्त त्रास) संबंध होत आहे का?

विश्लेषण: वैवाहिक जीवन किती सुखकर राहील? भविष्यात कायदेशीर घटस्फोट, वेगळेपणा (Separation), जीवनसाथीच्या आरोग्याला धोका, किंवा मानसिक क्लेशामुळे वैवाहिक सुखात मोठ्या घटण्याची कोणती स्पष्ट शक्यता आहे का? (स्पष्ट आणि कडवे सत्य सांगा).

5] विवाहाचा प्रकार (Love vs. Arranged Marriage):

➤ 5व्या भावाचा (प्रेम/रोमान्स) कस्पल सब-लॉर्ड (CSL) कोण आहे?
➤ 7व्या CSL आणि 5व्या CSL यांच्यात कोणता थेट संबंध तयार होत आहे का?
➤ 5th CSL विवाहाच्या भावांना (7वा किंवा 11वा) प्रबलपणे सिग्निफाय करत आहे का?
➤ 7th CSL फक्त 2, 7, 11 दाखवत आहे का (5व्या भावाच्या कोणत्याही प्रभावाशिवाय)?
➤ 5th CSL आणि 7th CSL चा राशी स्वामी (Sign Lord), नक्षत्र स्वामी (Star Lord) आणि उप-स्वामी (Sub-Lord / SL) कोण आहे? यांच्यात कोणती समानता आहे का, किंवा यांच्यात कोणता 'परिवर्तन योग' (Mutual Reception) किंवा खोल संबंध तयार होत आहे का?

विश्लेषण: जातकाचा विवाह प्रेम विवाह (Love Marriage) होईल की पूर्णपणे पारंपरिक (Arranged Marriage)? 100 पैकी किती टक्के शक्यता आहे.

➤ D60 (षष्ट्यंश) - पूर्व पुण्य आणि अंतिम परिणाम (Karmic Legacy)

जर D1 आणि D9 मध्ये विवाहाशी संबंधित जे योग आहेत, पण D60 मध्ये तो ग्रह शापित असेल, तर विवाहात विलंब किंवा नकार येऊ शकतो. हे 'सस्टेनेबल सक्सेस' (टिकाऊ यश) पाहण्यासाठी D60 चे विश्लेषण आहे.

1] D60 लग्न आणि लग्नेश - कार्मिक ब्लूप्रिंट (The Karmic Blueprint)

2] D60 सप्तम भाव आणि सप्तमेश - कार्मिक कर्म (The Karmic Action)

3] राजयोग कारक ग्रहांची D60 मधील स्थिती
हे विश्लेषण थेटपणे सांगेल की D1/D9 चे शक्तिशाली राजयोग D60 मध्ये किती मजबूत आहेत.

➤ सविस्तर समग्र D60 निष्कर्ष

भाग 5: निष्कर्ष आणि एकूण आढावा

➤ चारही प्रणालींच्या मुख्य निष्कर्षांचा संक्षिप्त सारांश.
➤ चारही प्रणाली कोणत्या मुद्द्यांवर सहमत आहेत आणि कोणत्या मुद्द्यांवर थोडा वेगळा दृष्टिकोन आहे?
➤ विवाहाचे वचन: विवाहाचा योग निश्चित आहे का? असल्यास, सहजपणे की अडथळ्यांनंतर?
➤ विवाह, जोडीदार आणि वैवाहिक जीवनाचे एकूण चित्र.

➤ विवाहाच्या शक्यता आणि गुणवत्तेवर अंतिम निष्कर्ष.

संयुक्त भाग: करिअर (Career) (भाग 1-5 + D60)

उपरोक्त सर्व विवरणांमधून माहिती काढा आणि विश्लेषणही करायचे आहे. "विश्लेषण:" मुद्द्यांचे विश्लेषण करा. तसेच दृष्टी टाकत असलेल्या ग्रहांना वगळून, बाकी ग्रहांची अवस्था (उच्च-नीच-नीचभंग, शत्रू-मित्र-सम राशी; अस्त-वक्री-वर्गोत्तम) ब्रॅकेटमध्ये लिहा. उत्तरांसोबत प्रश्नही लिहा

भाग 1: पराशरी ज्योतिषानुसार करियरचे विश्लेषण

(हा भाग करियरची पायाभूत गोष्ट, क्षमता आणि भाग्य समजून घेण्यासाठी आहे.)

1] दशमेश (10व्या भावाचा स्वामी):
➤ कोणता ग्रह दशम भावाचा स्वामी आहे?
➤ दशमेश ग्रह कोणत्या राशी-भावात स्थित आहे?  (विशेषतः केंद्र/त्रिकोणातील स्थिती)
➤ दशमेश ग्रह कोणत्या नक्षत्रात (स्वामी) स्थित आहे?
➤ दशमेश ग्रहाची युती कोणत्या ग्रहांशी होत आहे?
➤ दशमेशासोबत युतीत असलेला ग्रह कोणत्या नक्षत्रात (स्वामी) स्थित आहे?
➤ दशमेशावर कोणत्या ग्रहांची दृष्टी आहे?
➤ लग्नेश आणि दशमेश यांच्यामध्ये शत्रुत्व/मैत्री/समता आहे का?

विश्लेषण: करियरची दिशा, यशाची पातळी आणि करियरबद्दल जातकाचा दृष्टिकोन.

2] दशम भाव (कर्म भाव):
➤ दशम भाव कोणत्या राशीत आणि नक्षत्रात (स्वामी) स्थित आहे?
➤ दशम भावात कोणकोणते ग्रह स्थित आहेत?
➤ दशम भावात स्थित असलेला ग्रह कोणत्या नक्षत्रात (स्वामी) स्थित आहे?
➤ दशम भावावर कोणकोणते ग्रह दृष्टी टाकत आहेत?

विश्लेषण: कार्यक्षेत्राचे स्वरूप, कामाच्या ठिकाणचे वातावरण आणि करियरमध्ये मिळणारी प्रतिष्ठा.

3] नवमांश कुंडली (D9) चे विश्लेषण - करियरमधील भाग्य आणि आंतरिक क्षमता

A) D9 मधील दशम भाव आणि दशमेश:
➤ नवमांशात दशम भाव कोणत्या राशीत आणि नक्षत्रात (स्वामी) स्थित आहे?
➤ नवमांशात दशम भावात कोणकोणते ग्रह स्थित आहेत? (त्यांच्या नक्षत्र-स्वामींसह)
➤ नवमांशात दशम भावावर कोणत्या ग्रहांची दृष्टी आहे?
➤ नवमांशात दशमेश ग्रह कोण आहे आणि तो कोणत्या भावात, राशीत आणि नक्षत्रात (स्वामी) स्थित आहे?
➤ नवमांशात दशमेशाची युती किंवा दृष्टी कोणत्या ग्रहांशी होत आहे?
➤ नवमांशात दशमेशासोबत युतीत असलेला ग्रह कोणत्या नक्षत्रात स्थित आहे?

B) D9 मधील लग्न आणि लग्नेश:
➤ नवमांशात लग्न कोणत्या राशीत आणि नक्षत्रात (स्वामी) स्थित आहे?
➤ नवमांशात लग्न भावात कोणकोणते ग्रह स्थित आहेत? (नक्षत्र-स्वामी)
➤ नवमांशात लग्नेश ग्रह कोणत्या भावात, राशीत आणि नक्षत्रात (स्वामी) स्थित आहे?
➤ नवमांशात लग्नेशाची युती किंवा दृष्टी कोणत्या ग्रहांशी होत आहे?
➤ नवमांशात शनी, बुध आणि सूर्याची स्थिती काय आहे?

C) D1 च्या दशमेशाची नवमांश (D9) मधील स्थिती:
➤ (D9) नवमांशात D1 चा दशमेश कोणत्या भावात, राशीत आणि नक्षत्रात (स्वामी) स्थित आहे?
➤ (D9) नवमांशात D1 चा दशमेश कोणासोबत बसला आहे?
➤ (D9) नवमांशात D1 च्या दशमेशावर कोणत्या ग्रहांची दृष्टी आहे?

विश्लेषण: करियरची सूक्ष्मता, वास्तविक क्षमता आणि व्यावसायिक जीवनात मिळणाऱ्या यश/अपयशाचे अचूक मूल्यांकन.

4] दशमांश कुंडली (D10) चे विश्लेषण - कर्म, पेशा आणि प्रतिष्ठा

A) D10 मधील दशम भाव आणि दशमेश:
➤ दशमांशात दशम भाव कोणत्या राशीत आणि नक्षत्रात (स्वामी) स्थित आहे?
➤ दशमांशात दशम भावात कोणकोणते ग्रह स्थित आहेत? (त्यांच्या नक्षत्र-स्वामींसह)
➤ दशमांशात दशम भावावर कोणत्या ग्रहांची दृष्टी आहे?
➤ दशमांशात दशमेश ग्रह कोण आहे आणि तो कोणत्या भावात, राशीत आणि नक्षत्रात (स्वामी) स्थित आहे?
➤ दशमांशात दशमेशाची युती किंवा दृष्टी कोणत्या ग्रहांशी होत आहे?
➤ दशमांशात दशमेशासोबत युतीत असलेला ग्रह कोणत्या नक्षत्रात स्थित आहे?

B) D10 मधील लग्न आणि लग्नेश:
➤ दशमांशात लग्न कोणत्या राशीत आणि नक्षत्रात (स्वामी) स्थित आहे?
➤ दशमांशात लग्न भावात कोणकोणते ग्रह स्थित आहेत? (नक्षत्र-स्वामी)
➤ दशमांशात लग्नेश ग्रह कोणत्या भावात, राशीत आणि नक्षत्रात (स्वामी) स्थित आहे?
➤ दशमांशात लग्नेशाची युती किंवा दृष्टी कोणत्या ग्रहांशी होत आहे?
➤ दशमांशात शनी, बुध आणि सूर्याची स्थिती काय आहे?

C) जन्म कुंडली (D1) च्या ग्रहांचे D10 मधील विश्लेषण:
➤ (D10 मध्ये) जन्म कुंडलीचा दशमेश कोणत्या भावात, राशीत आणि नक्षत्रात (स्वामी) स्थित आहे?
➤ (D10) दशमांशात D1 चा दशमेश कोणासोबत बसला आहे?
➤ (D10) दशमांशात D1 च्या दशमेशावर कोणत्या ग्रहांची दृष्टी आहे?

विश्लेषण: वास्तविक कर्म, कामाच्या ठिकाणचे वातावरण, पद आणि "सामाजिक प्रतिष्ठा". व्यक्ती प्रत्यक्षात काय करेल आणि त्याला काय दर्जा मिळेल याचे अचूक मूल्यांकन.

5] लग्न आणि लग्नेश:
➤ लग्न/लग्नेशाचे बल काय आहे?
➤ लग्नेशाचा दशम भाव किंवा दशमेशाशी काय संबंध आहे?

विश्लेषण: जातकाची स्वतःची क्षमता, प्रयत्न आणि व्यक्तिमत्त्व करियरवर कसा परिणाम करेल.

6] ग्रहांचे बल आणि करियरचे कारक ग्रह:
➤ कुंडलीत सर्वात बलवान ग्रह कोणता आहे (षड्बलानुसार)?
➤ सूर्य (आत्मा, सरकार), मंगळ (ऊर्जा, धैर्य), बुध (बुद्धी, व्यापार), गुरू (ज्ञान, सल्लागार), शुक्र (कला, विलासिता) आणि शनी (सेवा, शिस्त) यांची स्थिती (राशी, भाव, नक्षत्र-स्वामी) काय आहे?

विश्लेषण: कोणते ग्रह जातकाला नैसर्गिकरित्या विशिष्ट क्षेत्राकडे नेतील.

7] धन आणि लाभाचे भाव:
➤ द्वितीय भाव (संचित धन) आणि एकादश भाव (आय/लाभ) आणि त्यांच्या स्वामींची (राशी, भाव, नक्षत्र-स्वामी) स्थिती.
➤ दशमेशाचा धन/लाभ भावांशी संबंध आहे का? (धन योग)

विश्लेषण: करियरमधून आर्थिक लाभाची शक्यता आणि उत्पन्नाचे स्रोत.

8] इंदु लग्न (Indu Lagna - Wealth Point) चे विश्लेषण:
➤ कुंडलीत इंदु लग्न कोणत्या राशीत आणि भावात स्थित आहे?
➤ इंदु लग्नात कोणकोणते ग्रह स्थित आहेत आणि इंदु लग्नावर कोणत्या ग्रहांची दृष्टी आहे (शुभ किंवा अशुभ)?
➤ इंदु लग्नाचा स्वामी कुठे आणि कोणत्या स्थितीत (उच्च/नीच/स्वराशी) बसला आहे?
➤ दशमेश (करियर), षष्ठेश (नोकरी), किंवा सप्तमेश (व्यापार) यांचा इंदु लग्नाशी कोणताही थेट संबंध बनत आहे का?

विश्लेषण: जातकाचे अंतिम आर्थिक पातळी (Wealth Status) कसे राहील? कुंडलीत असाधारण धन (करोडपती योग) आहे की धनासाठी सतत संघर्ष करावा लागेल? धनाचा मुख्य स्रोत काय असेल?

उपरोक्त सर्व विवरणांमधून माहिती काढा आणि विश्लेषणही करायचे आहे. "विश्लेषण:" मुद्द्यांचे विश्लेषण करा. उत्तरांसोबत प्रश्नही लिहा

भाग 2: जैमिनी ज्योतिषानुसार करियरचे विश्लेषण

(हा भाग करियरमधील पद, अधिकार, आत्म्याचा उद्देश आणि सार्वजनिक प्रतिमा समजून घेण्यासाठी आहे.)

1] आत्मकारक (AK) आणि अमात्यकारक (AmK) - आत्म्याचा उद्देश आणि सल्लागार:
A] आत्मकारक (AK):

➤ जैमिनी पद्धतीने आत्मकारक ग्रह कोणता आहे? (सर्वात जास्त अंश असलेला ग्रह)
➤ आत्मकारक कोणत्या राशीत आणि भावात स्थित आहे?
➤ आत्मकारकासोबत कोणकोणत्या ग्रहांची (चर कारक) युती आहे?
➤ आत्मकारकावर कोणत्या राशींची जैमिनी राशी दृष्टी आहे? (चर, स्थिर, द्विस्वभाव)
➤ आत्मकारक कोणत्या नवमांशात स्थित आहे?
➤ आत्मकारक कोणत्या नक्षत्रात स्थित आहे?

B] अमात्यकारक (AmK):

➤ जैमिनी पद्धतीने अमात्यकारक ग्रह कोणता आहे? (दुसऱ्या क्रमांकाचा सर्वात जास्त अंश असलेला ग्रह)
➤ अमात्यकारक कोणत्या राशीत आणि भावात स्थित आहे?
➤ अमात्यकारकासोबत कोणकोणत्या ग्रहांची (चर कारक) युती आहे?
➤ अमात्यकारकावर कोणत्या राशींची जैमिनी राशी दृष्टी आहे? (चर, स्थिर, द्विस्वभाव)
➤ अमात्यकारक कोणत्या नवमांशात स्थित आहे?
➤ अमात्यकारक कोणत्या नक्षत्रात स्थित आहे?

विश्लेषण: AmK जातकाच्या आत्म्याचा मूळ उद्देश आणि जीवनाची दिशा दर्शवतो. AmK त्या सल्लागाराचे किंवा माध्यमाचे (करियर/मंत्री) प्रतिनिधित्व करतो जो तो उद्देश साध्य करण्यात मदत करतो.

2] AK आणि AmK चा परस्पर संबंध - उद्देश आणि मार्गातील सुसंगती:
➤ AK आणि AmK एकमेकांपासून शुभ भावांमध्ये स्थित आहेत का (जसे केंद्र 1, 4, 7, 10; त्रिकोण 1, 5, 9; किंवा 3/11 चा संबंध)?
➤ ते एकमेकांवर जैमिनी राशी दृष्टी टाकत आहेत का?

विश्लेषण: हा संबंध करियरमधील सहजता आणि यश दर्शवतो. संबंध शुभ असेल तर करियर आत्म्याच्या समाधानासोबत पुढे जातो आणि व्यक्ती आपल्या कामावर खूश राहते. अशुभ संबंध आंतरिक संघर्ष आणि असंतोषाचे लक्षण आहे.

3] कर्म पद (A10) - व्यावसायिक प्रतिमा आणि सार्वजनिक प्रतिष्ठा:
➤ A10 (कर्मपद) कोणत्या राशीत आणि भावात स्थित आहे?
➤ A10 मध्ये कोणकोणते ग्रह (चर कारक) स्थित आहेत?
➤ A10 वर कोणत्या राशींची जैमिनी राशी दृष्टी आहे? (चर, स्थिर, द्विस्वभाव) (शुभ ग्रहांचा प्रभाव प्रसिद्धी देतो, पाप ग्रहांचा प्रभाव वाद किंवा संघर्ष देतो).
➤ A10 चा लग्न आरूढ (AL), आत्मकारक (AK) किंवा अमात्यकारक (AmK) यांच्याशी संबंध बनत आहे का?

विश्लेषण: हे दर्शवते की जग तुमचे काम आणि पद कसे पाहते. हे करियरमधून मिळणाऱ्या प्रसिद्धी, सामाजिक प्रतिष्ठा आणि सार्वजनिक प्रतिमेचे अचूक मूल्यांकन करते.

4] कारकांश लग्न (Karakamsa Lagna) - लपलेली प्रतिभा आणि भाग्य:
➤ कारकांश लग्नापासून दशम भावात कोणती राशी आणि ग्रह आहेत?
➤ कारकांश दशमेश कुठे स्थित आहे?
➤ कारकांश दशमेश कोणत्या ग्रहांशी युतीत आहे?

विश्लेषण: हे जातकाची लपलेली प्रतिभा, आंतरिक इच्छा आणि करियरची वास्तविक दिशा दर्शवते. कारकांशापासून दशम भाव व्यक्तीचे अंतिम कर्म आणि भाग्य दर्शवतो.

5] अर्गला विश्लेषण - अदृश्य हस्तक्षेप आणि संसाधनांचा प्रवाह:

➤ दशम भावावर अर्गला: करियरच्या "संस्थेला" (जसे ऑफिस, कंपनी) कोणत्या ग्रहांकडून सतत सहकार्य किंवा अडथळा मिळत आहे?
➤ अमात्यकारक (AmK) वर अर्गला: करियरमध्ये वरिष्ठ अधिकाऱ्यांकडून, सल्लागारांकडून किंवा सहकाऱ्यांकडून मिळणाऱ्या सहकार्याचा किंवा अडथळ्याचा विश्लेषण.
➤ A10 (कर्म पद) वर अर्गला: तुमची सार्वजनिक प्रतिमा आणि प्रतिष्ठा कोणत्या शक्ती पडद्यामागून मजबूत करत आहेत किंवा कमकुवत करत आहेत?

विश्लेषण: करियरमध्ये मिळणारे अदृश्य सहकार्य, संसाधनांचा प्रवाह आणि लपलेल्या अडथळ्यांचा शोध.

6] घटिका लग्न (Ghatika Lagna - GL) - सत्ता, अधिकार आणि उच्च पद:
➤ घटिका लग्न (GL) कोणत्या राशीत आणि भावात स्थित आहे?
➤ घटिका लग्नात कोणकोणते ग्रह स्थित आहेत?
➤ घटिका लग्नावर कोणत्या राशींची (चर, स्थिर, द्विस्वभाव) जैमिनी दृष्टी आहे?
➤ अमात्यकारक (AmK) किंवा आत्मकारक (AK) यांचा घटिका लग्नाशी कोणताही संबंध (युती किंवा जैमिनी दृष्टी) बनत आहे का?
➤ घटिका लग्नापासून दशम भावात कोणते ग्रह आहेत?

विश्लेषण: जातकाला करियरमध्ये किती 'पॉवर', 'अथॉरिटी' आणि 'सामाजिक प्रतिष्ठा' मिळेल? जातकाकडे एखाद्या मोठ्या संस्थेत उच्च अधिकारी (CEO/Director), लीडर किंवा सरकारी क्षेत्रात शीर्ष पद (Class-1 Officer) मिळवण्याची क्षमता आहे का, की त्याला अधीनस्थ (subordinates) म्हणून काम करावे लागेल?

उपरोक्त सर्व विवरणांमधून माहिती काढा आणि विश्लेषणही करायचे आहे. "विश्लेषण:" मुद्द्यांचे विश्लेषण करा, तसेच ग्रहाची अवस्था (उच्च, नीच, नीचभंग, अस्त, वक्री, शत्रू-मित्र-सम राशी) ब्रॅकेटमध्ये लिहा. उत्तरांसोबत प्रश्नही लिहा 

भाग 3: भृगु नंदी नाडी (BNN) नुसार करियरचे विश्लेषण

(हा भाग ग्रहांच्या प्रवाहावर आणि जीवनाच्या नमुन्यांवर आधारित करियर समजून घेण्यासाठी आहे.)

1] शनी (कर्म कारक) ची स्थिती आणि संबंध:
➤ शनी कोणत्या राशीत आहे (आणि कोणत्या डिग्रीवर आहे)?
➤ शनी कोणत्या ग्रहाच्या नक्षत्रात आहे?
➤ शनीसोबत युतीत कोणते ग्रह आहेत?
➤ शनीपासून दुसऱ्या आणि बाराव्या राशीत कोणते ग्रह आहेत?
➤ शनीपासून त्रिकोणात (1-5-9) कोणते ग्रह आहेत?

विश्लेषण: जातकाच्या कर्माचे मूळ क्षेत्र, पेशाचे स्वरूप (सेवा, तंत्रज्ञान, लोखंड इ.) आणि करियरमध्ये येणारी शिस्त/संघर्ष.

2] गुरू (जीव कारक) आणि शनीचा संबंध:
➤ गुरू आणि शनीचा परस्पर संबंध काय आहे (युती, 2-12, 1-5-9)?

विश्लेषण: जातकाच्या जीवन (गुरू) आणि कर्म (शनी) मधील संबंध. हे सांगते की करियर समाधानकारक असेल की ओझे.

3] करियरशी संबंधित इतर ग्रहांचा प्रभाव:
➤ सूर्य, बुध किंवा मंगळ यांचा शनीशी काय संबंध आहे? (सूर्य - अधिकार, बुध - व्यापार, मंगळ - तंत्रज्ञान).

विश्लेषण: करियरच्या विशिष्ट स्वरूपाचे निर्धारण. (जसे, शनी+बुध = व्यापार/हिशेब, शनी+मंगळ = इंजिनिअरिंग/बांधकाम).

4] दशमेश नवांशाधिपती (Dashmesh Navamshadhipati) चे सूत्र (करियरमधील अडथळा आणि उपाय):
➤ जन्म कुंडलीत (D-1) दशम भावाचा स्वामी (दशमेश / 10th Lord) कोणता ग्रह आहे?
➤ नवांश कुंडलीत (D-9) तो दशमेश कोणत्या भावात आणि कोणत्या राशीत बसला आहे?
➤ नवांशमध्ये दशमेशाचा डिस्पॉजिटर (नवांशाधिपती - त्या राशीचा स्वामी) कोणता ग्रह आहे?
➤ नवांश कुंडलीत तो डिस्पॉजिटर स्वतः दशमेशापासून कोणत्या स्थानी बसला आहे (दशमेशाला पहिले स्थान मानून मोजा; विशेषतः तो दशमेशापासून 6व्या, 8व्या किंवा 12व्या स्थानी आहे का)?
➤ नवांश कुंडलीत तो डिस्पॉजिटर स्वतः कोणत्या भावात बसला आहे (विशेषतः तो नवांशच्या 6व्या, 8व्या किंवा 12व्या भावात आहे का)?

विश्लेषण: जर नवांशमध्ये दशमेशाचा डिस्पॉजिटर स्वतः दशमेशापासून 6-8-12 च्या संबंधात बसत असेल, तर करियरमध्ये अडथळे (Obstructions) आणि अस्थिरता येते, आणि जर तो डिस्पॉजिटर नवांश कुंडलीच्या स्वतःच्या 6व्या, 8व्या किंवा 12व्या भावातही असेल तर अडथळा दुप्पट (प्रबळ) मानला जाईल. जर संबंध 6-8-12 मध्ये नसेल तर स्पष्ट लिहा की या सूत्राने करियरमध्ये अडथळा निर्माण होत नाही. उपायाचे (Career Alignment) निर्धारण - म्हणजे जर डिस्पॉजिटर 12वा असेल तर विदेश/MNC/इम्पोर्ट-एक्सपोर्ट, 8वा असेल तर आयटी/टेक्निकल/रिसर्च/गूढ विषय, आणि 6वा असेल तर सेवा क्षेत्र, मेडिकल, लीगल किंवा फायनान्सशी जोडून या अडथळ्याचे यशात रूपांतर करणे।

उपरोक्त सर्व विवरणांमधून माहिती काढा आणि विश्लेषणही करायचे आहे. "विश्लेषण:" मुद्द्यांचे विश्लेषण करा, तसेच ग्रह वक्री असेल तर तोही ब्रॅकेटमध्ये लिहा. उत्तरांसोबत प्रश्नही लिहा

भाग 4: कृष्णमूर्ति पद्धती (KP) नुसार करियरचे विश्लेषण

(हा भाग करियरच्या घटना आणि यशाच्या वचनाचे अचूक मूल्यांकन करण्यासाठी आहे.)

1] करियरचे वचन (Promise of Profession)

A] एकंदर करियरचे वचन (Overall Promise of Profession):
➤ 10व्या भावाचा कस्पल सब-लॉर्ड (CSL) कोण आहे?
➤ हा CSL कोणत्या भावांना सैगनिफाय करत आहे? (विशेषतः 2, 6, 10, 11 भावांचा संबंध).

विश्लेषण: कुंडलीत स्थिर आणि यशस्वी करियरचे वचन आहे का? (भाव 2, 6, 10, 11 आय आणि सेवा/पद दर्शवतात, तर 5, 8, 12 अडथळे दर्शवतात). (यशस्वी करियरच्या वचनाची 100 पैकी किती टक्के शक्यता आहे?)

➤ हा 6th CSL कोणत्या भावांना सैगनिफाय करत आहे?
➤ ते नोकरीला अनुकूल भावांशी (2, 6, 10, 11) जोडलेले आहे की नोकरी सुटण्याच्या/अडथळ्याच्या भावांशी (1, 5, 9, 12)?

विश्लेषण: जातकासाठी नोकरीत (Job/Service) स्थिरता आणि यशाचे स्पष्ट वचन आहे का? (यशस्वी नोकरीच्या वचनाची 100 पैकी किती टक्के शक्यता आहे?)

C] व्यापाराचे वचन (Promise of Business):
➤ 7व्या भावाचा कस्पल सब-लॉर्ड (CSL) कोण आहे?
➤ हा 7th CSL कोणत्या भावांना सैगनिफाय करत आहे?
➤ ते व्यापाराला अनुकूल भावांशी (2, 7, 10, 11) जोडलेले आहे की व्यापारात नुकसान/बर्बादीच्या भावांशी (5, 8, 12)?

विश्लेषण: जातक स्वतंत्र व्यापारात (Business) यशस्वी होऊ शकेल की त्याने रिस्क घेणे टाळावे? (यशस्वी व्यापाराच्या वचनाची 100 पैकी किती टक्के शक्यता आहे?)

2] पेशाचे स्वरूप (Nature of Profession):

A] एकंदर पेशाचे स्वरूप (Nature of Profession):
➤ 10व्या CSL चा नक्षत्र स्वामी कोण आहे आणि तो कुठे स्थित आहे?
➤ 10व्या CSL चा उप-स्वामी (SL) कोण आहे आणि तो कुठे स्थित आहे?
➤ 10व्या CSL चा उप-उप स्वामी (SSL) कोण आहे आणि तो कुठे स्थित आहे?
➤ करियरशी संबंधित भावांना (2, 6, 10, 11) सैगनिफाय करणारे प्रमुख ग्रह कोणते आहेत आणि त्यांची स्थिती काय आहे?

B] नोकरीचे स्वरूप (Nature of Job):
➤ 6व्या CSL चा नक्षत्र स्वामी कोण आहे आणि तो कुठे स्थित आहे?
➤ 6व्या CSL चा उप-स्वामी (SL) कोण आहे आणि तो कुठे स्थित आहे?
➤ 6व्या CSL चा उप-उप स्वामी (SSL) कोण आहे आणि तो कुठे स्थित आहे?

विश्लेषण: जातक नोकरी करत असेल तर त्याने कोणत्या प्रकारची जॉब (जसे: टेक्निकल, अ‍ॅडमिनिस्ट्रेटिव्ह, सर्व्हिस) करावी?

C] व्यापाराचे स्वरूप (Nature of Business):
➤ 7व्या  CSL चा नक्षत्र स्वामी कोण आहे आणि तो कुठे स्थित आहे?
➤ 7व्या  CSL चा उप-स्वामी (SL) कोण आहे आणि तो कुठे स्थित आहे?
➤ 7व्या  CSL चा उप-उप स्वामी (SSL) कोण आहे आणि तो कुठे स्थित आहे?

3] पदोन्नती आणि यशाचा काळ (Timing of Promotion):

A] नोकरीतील पदोन्नती आणि काळ (Timing of Promotion in Job):

➤ गोचरमध्ये शनी आणि गुरूचा संबंध दशा स्वामींशी किंवा महत्त्वाच्या कस्पांशी कधी होत आहे?

विश्लेषण: पदोन्नती, नोकरीतील बदल किंवा करियरमधील महत्त्वाच्या घटनांच्या संभाव्य वेळेचे निर्धारण.

➤ सध्या, किंवा भविष्यात या सैगनिफिकेटर ग्रहांची दशा/अंतर्दशा/प्रत्यंतर दशा कधी येणार आहे?
➤ गोचरमध्ये शनी आणि गुरूचा संबंध व्यापाराच्या महत्त्वाच्या कस्पांशी (विशेषतः 7 आणि 11) कधी होत आहे?
विश्लेषण: बिझनेसमधील मोठा प्रॉफिट, एक्स्पॅन्शन किंवा एखाद्या मोठ्या डीलच्या फायनल होण्याचा संभाव्य काळ.

4] सरकारी नोकरीचे वचन (Promise of Government Job):

A] 10व्या भावाच्या CSL (Cuspal Sub-Lord) चे विश्लेषण:
➤ 10व्या भावाचा CSL कोणता ग्रह आहे?
➤ हा 10th CSL स्वतः, किंवा आपल्या नक्षत्र स्वामी (NL) मार्फत सूर्य (Sun) किंवा चंद्रमा (Moon) शी जोडलेला आहे का? (सूर्य सरकारचा प्राथमिक कारक आहे, चंद्रमा पब्लिक सेक्टर/प्रशासनाचा).
➤ सूर्य (Sun) किंवा चंद्रमा (Moon) स्वतः आपल्या नक्षत्र स्वामी (NL) किंवा राशी स्वामी (RL) मार्फत 10th CSL शी जोडलेले आहेत का? (रिव्हर्स कनेक्शन चेक).
➤ हा 10th CSL 2, 6, 10 किंवा 11 भावांना प्रबळपणे सैगनिफाय करत आहे का?

B] 6व्या भावाच्या (नोकरी/सेवा) CSL चे विश्लेषण:
➤ 6व्या भावाचा CSL कोणता ग्रह आहे?
➤ 6th CSL चा संबंध सूर्य किंवा शनीशी (सेवेचा कारक) बनत आहे का?
➤ 6th CSL 2, 6, 10, 11 भावांचा सैगनिफिकेटर आहे का?

C] विश्लेषण आणि फलादेश निर्देश:
➤ प्रबळ योग (Strong Promise): जर 10th आणि 6th दोन्ही CSL चा संबंध सूर्याशी असेल आणि ते 2, 6, 10, 11 भाव दर्शवत असतील, तर स्पष्टपणे सांगा की जन्म कुंडलीत उच्च स्तरीय सरकारी नोकरीचे 100% वचन आहे.
➤ मध्यम/संविदा (Contractual/State Govt): सूर्याऐवजी मंगळाचा (पोलीस/सेना) किंवा गुरूचा (शिक्षण/न्याय) प्रभाव असेल आणि 6, 10, 11 भाव सक्रिय असतील, तर राज्य सरकार किंवा पब्लिक सेक्टर (PSU) ची शक्यता सांगा.
➤ खाजगी क्षेत्र (Private Sector): जर 10th/6th CSL चा सूर्य किंवा चंद्रमाशी कोणताही संबंध नसेल, आणि ते राहू/केतू किंवा बुधाशी जोडलेले असतील, तर स्पष्ट करा की यश खाजगी क्षेत्रात किंवा मल्टिनॅशनल कंपनीत (MNC) मिळेल.

➤ D60 (षष्टियंश) - पूर्व पुण्य आणि अंतिम परिणाम (Karmic Legacy)
​
जर D1 आणि D10 मध्ये राजयोग असतील, परंतु D60 मध्ये तो ग्रह शापित असेल, तर करियरमध्ये उंचीवर जाऊनही घसरण येऊ शकते. हे 'सस्टेनेबल सक्सेस' (टिकाऊ यश) पाहण्यासाठी D60 चे विश्लेषण आहे.

1] D60 लग्न आणि लग्नेश - कार्मिक ब्लूप्रिंट (The Karmic Blueprint)

2] D60 दशम भाव आणि दशमेश - कार्मिक कर्म (The Karmic Action)

3] राजयोग कारक ग्रहांची D60 मधील स्थिती
हे विश्लेषण थेट सांगेल की D1/D10 चे शक्तिशाली राजयोग D60 मध्ये किती मजबूत आहेत.

➤ विस्तृत समग्र D60 निष्कर्ष

भाग 5: निष्कर्ष आणि समग्र अवलोकन

➤ चारही प्रणालींचा सारांश: प्रत्येक प्रणालीतून करियरबद्दलचे मुख्य निष्कर्ष काय आहेत?
➤ सर्वसम्मत निष्कर्ष: कोणते करियर क्षेत्र सर्व प्रणालींमध्ये समान रीतीने दर्शवले जात आहेत?
➤ करियरचा आलेख: करियरमधील उन्नतीची मुख्य दशके (उदा. 25-35, 35-45 वर्षे) कोणती असतील? कधी संघर्ष आणि कधी यशाची शक्यता आहे?
➤ D60 कुंडलीचे समर्थन आणि अंतिम परिणाम?
➤ अंतिम सल्ला: जातकासाठी सर्वात योग्य करियर मार्ग (नोकरी/व्यापार), टाळायची क्षेत्रे आणि यशासाठी आवश्यक उपाय किंवा रत्ने (आवश्यक असल्यास).

संयुक्त भाग: शिक्षण (Education) (भाग 1-5 + D60)

वरील सर्व तपशीलांमधून माहिती काढा आणि विश्लेषणही करा, "विश्लेषण:" मुद्द्यांचे विश्लेषण करा. त्यासोबत दृष्टी टाकणाऱ्या ग्रहांना सोडून बाकी ग्रहांची अवस्था (उच्च-नीच-नीचभंग, शत्रु-मित्र-सम राशी; अस्त-वक्री-वर्गोत्तम) देखील ब्रॅकेटमध्ये लिहा. उत्तरांसोबत प्रश्नही लिहा

भाग 1: पराशरी ज्योतिषानुसार शिक्षणाचे विश्लेषण

(हा भाग शिक्षणाचा पाया, बुद्धी आणि भाग्य समजण्यासाठी आहे.)

1] पंचमेश (5व्या भावाचा स्वामी):
➤ कोणता ग्रह पंचम भावाचा स्वामी आहे?
➤ पंचमेश ग्रह कोणत्या राशी-भावात स्थित आहे? (विशेषतः केंद्र/त्रिकोणातील स्थिती)
➤ पंचमेश ग्रह कोणत्या नक्षत्रात (स्वामी) स्थित आहे?
➤ पंचमेश ग्रहाची युती कोणत्या ग्रहांशी होत आहे?
➤ पंचमेशाशी युत ग्रह कोणत्या नक्षत्रात (स्वामी) स्थित आहे?
➤ पंचमेशावर कोणत्या ग्रहांची दृष्टी आहे?
➤ लग्नेश आणि पंचमेश यांच्यात शत्रुता/मित्रता/समानता आहे का?

विश्लेषण: शिक्षणाची दिशा, यशाची पातळी आणि अभ्यासाकडे मुलाचा दृष्टिकोन.

2] चतुर्थ भाव (प्रारंभिक शिक्षण) आणि पंचम भाव (विद्या भाव):
A] चतुर्थ भाव:
➤ चतुर्थ भाव कोणत्या राशी आणि नक्षत्रात (स्वामी) स्थित आहे?
➤ चतुर्थ भावात कोणते ग्रह स्थित आहेत?
➤ चतुर्थ भावात स्थित ग्रह कोणत्या नक्षत्रात (स्वामी) स्थित आहे?
➤ चतुर्थ भावावर कोणते ग्रह दृष्टी टाकत आहेत?
B] पंचम भाव:
➤ पंचम भाव कोणत्या राशी आणि नक्षत्रात (स्वामी) स्थित आहे?
➤ पंचम भावात कोणते ग्रह स्थित आहेत?
➤ पंचम भावात स्थित ग्रह कोणत्या नक्षत्रात (स्वामी) स्थित आहे?
➤ पंचम भावावर कोणते ग्रह दृष्टी टाकत आहेत?

विश्लेषण: प्रारंभिक शिक्षणाचा पाया, घर व school चे वातावरण, बुद्धी आणि विद्येचा स्वभाव.

3] नवमांश कुंडली (D9) चे विश्लेषण - शिक्षणातील भाग्य आणि आंतरिक क्षमता

A) D9 मधील पंचम भाव आणि पंचमेश:
➤ नवमांशात पंचम भाव कोणत्या राशी आणि नक्षत्रात (स्वामी) स्थित आहे?
➤ नवमांशात पंचम भावात कोणते ग्रह स्थित आहेत? (त्यांच्या नक्षत्र-स्वामींसह)
➤ नवमांशात पंचम भावावर कोणत्या ग्रहांची दृष्टी आहे?
➤ नवमांशात पंचमेश ग्रह कोण आहे आणि तो कोणत्या भाव, राशी आणि नक्षत्रात (स्वामी) स्थित आहे?
➤ नवमांशात पंचमेशाची युती किंवा दृष्टी कोणत्या ग्रहांशी होत आहे?
➤ नवमांशात पंचमेशाशी युत ग्रह कोणत्या नक्षत्रात स्थित आहे?

B) D9 मधील लग्न आणि लग्नेश:
➤ नवमांशात लग्न कोणत्या राशी आणि नक्षत्रात (स्वामी) स्थित आहे?
➤ नवमांशात लग्न भावात कोणते ग्रह स्थित आहेत? (नक्षत्र-स्वामी)
➤ नवमांशात लग्नेश ग्रह कोणत्या भाव, राशी आणि नक्षत्रात (स्वामी) स्थित आहे?
➤ नवमांशात लग्नेशाची युती किंवा दृष्टी कोणत्या ग्रहांशी होत आहे?
➤ नवमांशात बुध, गुरु आणि चंद्र यांची स्थिती काय आहे?

C) D1 पंचमेशाची नवमांश (D9) मधील स्थिती:
➤ (D9) नवमांशात D1 चा पंचमेश कोणत्या भाव, राशी आणि नक्षत्रात (स्वामी) स्थित आहे?
➤ (D9) नवमांशात D1 पंचमेश कोणासोबत बसला आहे?
➤ (D9) नवमांशात D1 पंचमेशावर कोणत्या ग्रहांची दृष्टी आहे?

विश्लेषण: शिक्षणाची सूक्ष्मता, वास्तविक बौद्धिक क्षमता आणि अभ्यासात मिळणाऱ्या यश/अपयशाचे अचूक आकलन.

4] चतुर्विंशांश कुंडली (D24) चे विश्लेषण - विद्या, बुद्धी आणि शिक्षणाचे सूक्ष्म फळ

A) D24 मधील पंचम भाव आणि पंचमेश:
➤ चतुर्विंशांशात पंचम भाव कोणत्या राशी आणि नक्षत्रात (स्वामी) स्थित आहे?
➤ चतुर्विंशांशात पंचम भावात कोणते ग्रह स्थित आहेत? (त्यांच्या नक्षत्र-स्वामींसह)
➤ चतुर्विंशांशात पंचम भावावर कोणत्या ग्रहांची दृष्टी आहे?
➤ चतुर्विंशांशात पंचमेश ग्रह कोण आहे आणि तो कोणत्या भाव, राशी आणि नक्षत्रात (स्वामी) स्थित आहे?
➤ चतुर्विंशांशात पंचमेशाची युती किंवा दृष्टी कोणत्या ग्रहांशी होत आहे?
➤ चतुर्विंशांशात पंचमेशाशी युत ग्रह कोणत्या नक्षत्रात स्थित आहे?

B) D24 मधील लग्न आणि लग्नेश:
➤ चतुर्विंशांशात लग्न कोणत्या राशी आणि नक्षत्रात (स्वामी) स्थित आहे?
➤ चतुर्विंशांशात लग्न भावात कोणते ग्रह स्थित आहेत? (नक्षत्र-स्वामी)
➤ चतुर्विंशांशात लग्नेश ग्रह कोणत्या भाव, राशी आणि नक्षत्रात (स्वामी) स्थित आहे?
➤ चतुर्विंशांशात लग्नेशाची युती किंवा दृष्टी कोणत्या ग्रहांशी होत आहे?
➤ चतुर्विंशांशात बुध, गुरु आणि चंद्र यांची स्थिती काय आहे?

C) जन्म कुंडली (D1) च्या ग्रहांचे D24 मधील विश्लेषण:
➤ (D24 मध्ये) जन्म कुंडलीचा पंचमेश कोणत्या भाव, राशी आणि नक्षत्रात (स्वामी) स्थित आहे?
➤ (D24) चतुर्विंशांशात D1 पंचमेश कोणासोबत बसला आहे?
➤ (D24) चतुर्विंशांशात D1 पंचमेशावर कोणत्या ग्रहांची दृष्टी आहे?

विश्लेषण: वास्तविक विद्या, शिकण्याची क्षमता, शिक्षणाचे क्षेत्र आणि "शैक्षणिक यश". मुलगा खरोखर काय आणि कसे शिकेल याचे अचूक आकलन.

5] दशमांश कुंडली (D10) चे संक्षिप्त विश्लेषण - शिक्षणातून करियरची साखळी

A) D10 मधील दशम भाव आणि दशमेश:
➤ दशमांशात दशम भाव कोणत्या राशी आणि नक्षत्रात (स्वामी) स्थित आहे?
➤ दशमांशात दशम भावात कोणते ग्रह स्थित आहेत? (त्यांच्या नक्षत्र-स्वामींसह)
➤ दशमांशात दशमेश ग्रह कोण आहे आणि तो कोणत्या भाव, राशी आणि नक्षत्रात (स्वामी) स्थित आहे?

B) जन्म कुंडली (D1) च्या पंचमेशाची D10 मधील स्थिती:
➤ (D10 मध्ये) जन्म कुंडलीचा पंचमेश कोणत्या भाव, राशी आणि नक्षत्रात (स्वामी) स्थित आहे?
➤ (D10) दशमांशात D1 पंचमेश कोणासोबत बसला आहे?
➤ (D10) दशमांशात D1 पंचमेशावर कोणत्या ग्रहांची दृष्टी आहे?

विश्लेषण: मुलाचे शिक्षण पुढे जाऊन कोणत्या करियर दिशेचा पाया रचेल - अभ्यास आणि करियरची साखळी किती मजबूत आहे.

6] लग्न आणि लग्नेश:
➤ लग्न/लग्नेशाचे बळ काय आहे?
➤ लग्नेशाचा पंचम भाव किंवा पंचमेशाशी काय संबंध आहे?

विश्लेषण: मुलाची स्वतःची क्षमता, प्रयत्न आणि स्वभाव अभ्यासावर कसा परिणाम करेल.

7] ग्रहांचे बळ आणि शिक्षणाचे कारक ग्रह:
➤ कुंडलीत सर्वात बलवान ग्रह कोणता आहे (षड्बलानुसार)?
➤ बुध (बुद्धी, गणित, तर्क), गुरु (ज्ञान, शिक्षक, मार्गदर्शन), चंद्र (मन, स्मरण, एकाग्रता), सूर्य (आत्मविश्वास), मंगळ (स्पर्धा, तंत्र), शुक्र (कला, सृजन) आणि शनि (शिस्त, मेहनत) यांची स्थिती (राशी, भाव, नक्षत्र-स्वामी) काय आहे?

विश्लेषण: कोणते ग्रह मुलाला नैसर्गिकरित्या कोणत्या विशेष विषयाकडे किंवा क्षेत्राकडे नेतील.

8] उच्च शिक्षण आणि यशाचे भाव:
➤ नवम भाव (उच्च शिक्षण, भाग्य) आणि एकादश भाव (यश/लाभ) आणि त्यांचे स्वामी (राशी, भाव, नक्षत्र-स्वामी) यांची स्थिती.
➤ पंचमेशाचा संबंध नवम/एकादश भावांशी आहे का? (विद्या योग)

विश्लेषण: शिक्षणातून यशाची शक्यता आणि उच्च शिक्षणापर्यंत पोहोचण्याची क्षमता.

9] गुरु (ज्ञान कारक) आणि बुध (बुद्धी कारक) यांचे विशेष विश्लेषण:
➤ कुंडलीत गुरु कोणत्या राशी आणि भावात स्थित आहे?
➤ कुंडलीत बुध कोणत्या राशी आणि भावात स्थित आहे?
➤ गुरु आणि बुध यांचा परस्पर संबंध (युती, दृष्टी, राशी परिवर्तन) काय आहे?
➤ गुरु आणि बुध D24 मध्ये कोणत्या स्थितीत आहेत (उच्च/नीच/स्वराशी/वर्गोत्तम)?
➤ पंचमेश (शिक्षण) किंवा चतुर्थेश (प्रारंभिक शिक्षण) यांचा गुरु किंवा बुध यांच्याशी काही थेट संबंध बनत आहे का?

विश्लेषण: मुलाच्या बुद्धी आणि ज्ञानाची अंतिम पातळी (Education Status) कशी राहील? कुंडलीत असाधारण विद्येचा (उच्च शिक्षण/विशेषज्ञता) योग आहे की अभ्यासासाठी सतत संघर्ष करावा लागेल? शिक्षणाचा मुख्य स्रोत आणि दिशा काय असेल?

वरील सर्व तपशीलांमधून माहिती काढा आणि विश्लेषणही करा, "विश्लेषण:" मुद्द्यांचे विश्लेषण करा. उत्तरांसोबत प्रश्नही लिहा

भाग 2: जैमिनी ज्योतिषानुसार शिक्षणाचे विश्लेषण

(हा भाग शिक्षणातील प्रतिभा, आत्म्याची रुची आणि विद्येची दिशा समजण्यासाठी आहे.)

1] आत्मकारक (AK) आणि अमात्यकारक (AmK)-आत्म्याचा उद्देश आणि मार्गदर्शक:
A] आत्मकारक (AK):

➤ जैमिनी पद्धतीने आत्मकारक ग्रह कोणता आहे? (सर्वात जास्त अंश असलेला ग्रह)
➤ आत्मकारक कोणत्या राशी आणि भावात स्थित आहे?
➤ आत्मकारकासोबत कोणत्या ग्रहांच्या (चर कारक) युती आहेत?
➤ आत्मकारकावर कोणत्या राशींची जैमिनी राशी दृष्टी आहे? (चर, स्थिर, द्विस्वभाव)
➤ आत्मकारक कोणत्या नवमांशात स्थित आहे?
➤ आत्मकारक कोणत्या नक्षत्रात स्थित आहे?

B] अमात्यकारक (AmK):

➤ जैमिनी पद्धतीने अमात्यकारक ग्रह कोणता आहे? (दुसरा सर्वात जास्त अंश असलेला ग्रह)
➤ अमात्यकारक कोणत्या राशी आणि भावात स्थित आहे?
➤ अमात्यकारकासोबत कोणत्या ग्रहांच्या (चर कारक) युती आहेत?
➤ अमात्यकारकावर कोणत्या राशींची जैमिनी राशी दृष्टी आहे? (चर, स्थिर, द्विस्वभाव)
➤ अमात्यकारक कोणत्या नवमांशात स्थित आहे?
➤ अमात्यकारक कोणत्या नक्षत्रात स्थित आहे?

विश्लेषण: AK मुलाच्या आत्म्याचा मूळ उद्देश दर्शवतो. AmK तो मार्ग किंवा मार्गदर्शक (शिक्षक/विषय) दर्शवतो जो मुलाची रुची आणि शिक्षणाची दिशा ठरवण्यात मदत करतो.

2] AK आणि AmK यांचा परस्पर संबंध - रुची आणि मार्गातील सामंजस्य:
➤ AK आणि AmK एकमेकांपासून शुभ भावांमध्ये स्थित आहेत का (जसे केंद्र 1, 4, 7, 10; त्रिकोण 1, 5, 9; किंवा 3/11 चा संबंध)?
➤ ते एकमेकांवर जैमिनी राशी दृष्टी टाकत आहेत का?

विश्लेषण: हा संबंध शिक्षणातील सहजता आणि रुची दर्शवतो. संबंध शुभ असेल तर मुलगा आपल्या रुचीनुसार अभ्यासात सहज पुढे जाईल. अशुभ संबंध अभ्यासात आंतरिक असंतोष आणि दिशेचा भटकंतीपणा दर्शवतो.

3] मंत्रपद (A5) - विद्या आणि बुद्धीची प्रतिमा:
➤ A5 (मंत्रपद) कोणत्या राशी आणि भावात स्थित आहे?
➤ A5 मध्ये कोणते ग्रह (चर कारक) स्थित आहेत?
➤ A5 वर कोणत्या राशींची जैमिनी राशी दृष्टी आहे? (चर, स्थिर, द्विस्वभाव) (शुभ ग्रहांचा प्रभाव विद्येत यश देतो, पाप ग्रहांचा प्रभाव अभ्यासात संघर्ष किंवा वाद).
➤ A5 चा संबंध लग्न आरूढ (AL), आत्मकारक (AK) किंवा अमात्यकारक (AmK) यांच्याशी बनत आहे का?

विश्लेषण: हे दर्शवते की मुलाच्या विद्या आणि बुद्धीची वास्तविक क्षमता काय आहे आणि जग त्याला अभ्यासात कसे पाहील.

4] कारकांश लग्न (Karakamsa Lagna)-लपलेली प्रतिभा आणि विद्या:
➤ कारकांश लग्नापासून पंचम भावात कोणती राशी आणि ग्रह आहेत?
➤ कारकांश पंचमेश कुठे स्थित आहे?
➤ कारकांश पंचमेश कोणत्या ग्रहांसोबत युतीत आहे?

विश्लेषण: हे मुलाची लपलेली प्रतिभा, आंतरिक रुची आणि विद्येची वास्तविक दिशा दर्शवते. कारकांशापासून पंचम भाव मुलाच्या शिकण्याचा स्वभाव आणि ज्ञानाचे अंतिम स्वरूप दर्शवतो.

5] अर्गला विश्लेषण - अदृश्य हस्तक्षेप आणि संसाधनांचा प्रवाह:

➤ पंचम भावावर अर्गला: मुलाच्या अभ्यासाला कोणत्या ग्रहांकडून सतत सहकार्य किंवा अडथळा मिळत आहे (जसे आई-वडील, शिक्षक, संसाधने)?
➤ अमात्यकारक (AmK) वर अर्गला: शिक्षणात शिक्षक, मार्गदर्शक किंवा सहपाठी यांच्याकडून मिळणाऱ्या सहकार्य किंवा अडथळ्याचे विश्लेषण.
➤ A5 (मंत्र पद) वर अर्गला: मुलाची विद्या-प्रतिमा आणि अभ्यासाची प्रतिष्ठा कोणत्या शक्ती पडद्यामागून मजबूत करत आहेत किंवा कमकुवत करत आहेत?

विश्लेषण: शिक्षणात मिळणारे अदृश्य सहकार्य, संसाधनांचा प्रवाह आणि लपलेले अडथळे शोधणे.

6] सुखपद (A4) - प्रारंभिक शिक्षण आणि school चे वातावरण:
➤ A4 (सुखपद) कोणत्या राशी आणि भावात स्थित आहे?
➤ A4 मध्ये कोणते ग्रह स्थित आहेत?
➤ A4 वर कोणत्या राशींची (चर, स्थिर, द्विस्वभाव) जैमिनी दृष्टी आहे?
➤ आत्मकारक (AK) किंवा अमात्यकारक (AmK) यांचा A4 शी काही संबंध (युती किंवा जैमिनी दृष्टी) बनत आहे का?
➤ A4 पासून चतुर्थ भावात कोणते ग्रह आहेत?

विश्लेषण: मुलाचे प्रारंभिक शिक्षण कसे राहील? school चे वातावरण, घरातून अभ्यासात मिळणारे सहकार्य आणि आईची साथ कशी राहील? मुलाला घरी अभ्यासाचे अनुकूल वातावरण मिळेल की school बदलणे/hostel सारखे योग बनतील?

वरील सर्व तपशीलांमधून माहिती काढा आणि विश्लेषणही करा, "विश्लेषण:" मुद्द्यांचे विश्लेषण करा, त्यासोबत ग्रहाची अवस्था (उच्च, नीच, नीचभंग, अस्त, वक्री, शत्रु-मित्र-सम राशी) देखील ब्रॅकेटमध्ये लिहा. उत्तरांसोबत प्रश्नही लिहा

भाग 3: भृगु नंदी नाडी (BNN) नुसार शिक्षणाचे विश्लेषण

(हा भाग ग्रहांच्या प्रवाह आणि जीवनाच्या पॅटर्नच्या आधारे शिक्षण समजण्यासाठी आहे.)

1] बुध (विद्या कारक) याची स्थिती आणि संबंध:
➤ बुध कोणत्या राशीत आहे (आणि कोणत्या डिग्रीवर आहे)?
➤ बुध कोणत्या ग्रहाच्या नक्षत्रात आहे?
➤ बुधासोबत युतीत कोणते ग्रह आहेत?
➤ बुधापासून दुसऱ्या आणि बाराव्या राशीत कोणते ग्रह आहेत?
➤ बुधापासून त्रिकोणात (1-5-9) कोणते ग्रह आहेत?

विश्लेषण: मुलाच्या बुद्धीचा मूळ स्वभाव, शिकण्याची शैली (जसे तर्क, भाषा, गणित) आणि अभ्यासात येणारी शिस्त/संघर्ष.

2] गुरु (ज्ञान कारक) आणि बुध यांचा संबंध:
➤ गुरु आणि बुध यांचा परस्पर संबंध काय आहे (युती, 2-12, 1-5-9)?

विश्लेषण: मुलाचे ज्ञान (गुरु) आणि बुद्धी (बुध) यांच्यातील संबंध. हे सांगते की अभ्यास खोल आणि समाधानकारक असेल की वरवरचा आणि ओझ्यासारखा वाटेल.

3] शिक्षणाशी संबंधित इतर ग्रहांचा प्रभाव:
➤ चंद्र, मंगळ किंवा शनि यांचा बुधाशी काय संबंध आहे? (चंद्र - मन आणि स्मरण, मंगळ - स्पर्धा आणि तंत्र, शनि - शिस्त आणि मेहनत).

विश्लेषण: शिकण्याच्या विशेष स्वभावाचे निर्धारण. (जसे, बुध+चंद्र = स्मरण/भाषेत जलद, बुध+मंगळ = गणित/तंत्र, बुध+शनि = हळू सुरुवात पण खोल पकड).

4] पंचमेश नवांशधिपती (Panchmesh Navamshadhipati) चे सूत्र (शिक्षणातील अडथळा आणि उपाय):
➤ जन्म कुंडली (D-1) मध्ये पंचम भावाचा स्वामी (पंचमेश / 5th Lord) कोणता ग्रह आहे?
➤ नवांश कुंडली (D-9) मध्ये तो पंचमेश कोणत्या भावात आणि कोणत्या राशीत बसला आहे?
➤ नवांशात पंचमेशाचा डिस्पॉझिटर (नवांशधिपती - त्या राशीचा स्वामी) कोणता ग्रह आहे?
➤ नवांश कुंडलीत तो डिस्पॉझिटर स्वतः पंचमेशापासून कोणत्या स्थानावर बसला आहे (पंचमेशाला प्रथम स्थान मानून मोजा; विशेषतः तो पंचमेशापासून 6व्या, 8व्या किंवा 12व्या स्थानावर आहे का)?
➤ नवांश कुंडलीत तो डिस्पॉझिटर स्वतः कोणत्या भावात बसला आहे (विशेषतः तो नवांशाच्या 6व्या, 8व्या किंवा 12व्या भावात आहे का)?

विश्लेषण: जर नवांशात पंचमेशाचा डिस्पॉझिटर स्वतः पंचमेशापासून 6-8-12 च्या संबंधात बसत असेल, तर शिक्षणात अडथळे (Obstructions) आणि अस्थिरता येते, आणि जर तो डिस्पॉझिटर नवांश कुंडलीच्या स्वतःच्या 6व्या, 8व्या किंवा 12व्या भावातही असेल तर अडथळा दुप्पट (प्रबळ) मानला जाईल. जर संबंध 6-8-12 मध्ये नसेल तर स्पष्ट लिहा की या सूत्राने शिक्षणात अडथळा बनत नाही. त्याच्या उपायाचे (Education Alignment) निर्धारण - म्हणजे जर डिस्पॉझिटर 12वा असेल तर परदेशात शिक्षण, hostel किंवा दूरस्थ/online शिक्षण, 8वा असेल तर research, तांत्रिक किंवा गूढ विषय, आणि 6वा असेल तर स्पर्धा-आधारित, शिस्त-प्रधान किंवा परीक्षा-केंद्रित अभ्यासाशी जोडून या अडथळ्याला यशात बदलणे.

वरील सर्व तपशीलांमधून माहिती काढा आणि विश्लेषणही करा, "विश्लेषण:" मुद्द्यांचे विश्लेषण करा, त्यासोबत ग्रह वक्री असेल तर तो देखील ब्रॅकेटमध्ये लिहा. उत्तरांसोबत प्रश्नही लिहा

भाग 4: कृष्णमूर्ती पद्धती (KP) नुसार शिक्षणाचे विश्लेषण

(हा भाग शिक्षणाच्या घटना आणि यशाच्या वचनाचे अचूक आकलन करण्यासाठी आहे.)

1] शिक्षणाचे वचन (Promise of Education)

A] समग्र शिक्षणाचे वचन (Overall Promise of Education):
➤ 5व्या भावाचा कस्पल सब-लॉर्ड (CSL) कोण आहे?
➤ हा CSL कोणत्या भावांना सिग्निफाय करत आहे? (विशेषतः 4, 5, 9, 11 भावांचा संबंध).

विश्लेषण: कुंडलीत यशस्वी शिक्षणाचे वचन आहे का? (भाव 4, 5, 9, 11 शिक्षण, बुद्धी, उच्च शिक्षण आणि यश दर्शवतात, तर 6, 8, 12 अडथळे दर्शवतात). (यशस्वी शिक्षणाच्या वचनाची 100 पैकी किती टक्के शक्यता आहे?)

B] प्रारंभिक शिक्षणाचे वचन (Promise of School Education):
➤ 4थ्या भावाचा कस्पल सब-लॉर्ड (CSL) कोण आहे?
➤ हा 4th CSL कोणत्या भावांना सिग्निफाय करत आहे?
➤ तो शिक्षणाला अनुकूल भावांशी (4, 5, 11) जोडलेला आहे की अडथळ्याच्या भावांशी (6, 8, 12)?

विश्लेषण: मुलाच्या प्रारंभिक (school) शिक्षणात यश आणि स्थिरतेचे स्पष्ट वचन आहे का? (यशस्वी प्रारंभिक शिक्षणाच्या वचनाची 100 पैकी किती टक्के शक्यता आहे?)

C] उच्च शिक्षणाचे वचन (Promise of Higher Education):
➤ 9व्या भावाचा कस्पल सब-लॉर्ड (CSL) कोण आहे?
➤ हा 9th CSL कोणत्या भावांना सिग्निफाय करत आहे?
➤ तो उच्च शिक्षणाला अनुकूल भावांशी (5, 9, 11) जोडलेला आहे की अडथळ्याच्या भावांशी (6, 8, 12)?

विश्लेषण: मुलगा उच्च शिक्षणापर्यंत (पदवी/पदव्युत्तर/व्यावसायिक पाठ्यक्रम) यशस्वीरित्या पोहोचेल का? (यशस्वी उच्च शिक्षणाच्या वचनाची 100 पैकी किती टक्के शक्यता आहे?)

2] शिक्षणाचा स्वभाव (Nature of Education):

A] समग्र शिक्षणाचा स्वभाव (Nature of Education):
➤ 5व्या CSL चा नक्षत्र स्वामी कोण आहे आणि तो कुठे स्थित आहे?
➤ 5व्या CSL चा उप-स्वामी (SL) कोण आहे आणि तो कुठे स्थित आहे?
➤ 5व्या CSL चा उप-उप स्वामी (SSL) कोण आहे आणि तो कुठे स्थित आहे?
➤ शिक्षणाशी संबंधित भावांना (4, 5, 9, 11) सिग्निफाय करणारे प्रमुख ग्रह कोणते आहेत आणि त्यांची स्थिती काय आहे?
➤ भाव 4, 5, 9, 11 चे सर्वात बलवान सिग्निफिकेटर ग्रह कोणते आहेत?

विश्लेषण: अभ्यासाच्या योग्य दिशेचे अचूक निर्धारण. ग्रहांच्या स्वभावावरून stream आणि विषय शोधणे.

B] प्रारंभिक शिक्षणाचा स्वभाव (Nature of School Education):
➤ 4थ्या CSL चा नक्षत्र स्वामी कोण आहे आणि तो कुठे स्थित आहे?
➤ 4थ्या CSL चा उप-स्वामी (SL) कोण आहे आणि तो कुठे स्थित आहे?
➤ 4थ्या CSL चा उप-उप स्वामी (SSL) कोण आहे आणि तो कुठे स्थित आहे?

विश्लेषण: मुलाचे school शिक्षण कसे राहील - नियमित school, घरचे वातावरण आणि अभ्यासाच्या सुरुवातीचे स्वरूप?

C] उच्च शिक्षणाचा स्वभाव (Nature of Higher Education):
➤ 9व्या CSL चा नक्षत्र स्वामी कोण आहे आणि तो कुठे स्थित आहे?
➤ 9व्या CSL चा उप-स्वामी (SL) कोण आहे आणि तो कुठे स्थित आहे?
➤ 9व्या CSL चा उप-उप स्वामी (SSL) कोण आहे आणि तो कुठे स्थित आहे?

विश्लेषण: मुलाचे उच्च शिक्षण कोणत्या प्रकारचे असेल (जसे: degree, professional course, technical, research)?

3] शिक्षणातील यशाची वेळ (Timing of Success in Education):

A] परीक्षा यश आणि प्रवेशाची वेळ (Timing of Exam Success and Admission):
➤ भाव 4, 5, 11 चे प्रबळ सिग्निफिकेटर (Significator) ग्रह कोणते आहेत?
➤ सध्या, किंवा भविष्यात या सिग्निफिकेटर ग्रहांची दशा/अंतर्दशा/प्रत्यंतर दशा कधी येणार आहे?
➤ गोचरमध्ये शनि आणि गुरु यांचा संबंध दशा स्वामींशी किंवा महत्त्वाच्या कस्पांशी कधी होत आहे?

विश्लेषण: board परीक्षेत यश, चांगल्या school/college मध्ये प्रवेश किंवा शिक्षणाच्या महत्त्वाच्या घटनांच्या संभाव्य वेळेचे निर्धारण.

B] स्पर्धा परीक्षा आणि उच्च शिक्षणातील यशाची वेळ (Timing of Competitive and Higher Education Success):
➤ भाव 5, 6, 9, 11 चे प्रबळ सिग्निफिकेटर (Significator) ग्रह कोणते आहेत?
➤ सध्या, किंवा भविष्यात या सिग्निफिकेटर ग्रहांची दशा/अंतर्दशा/प्रत्यंतर दशा कधी येणार आहे?
➤ गोचरमध्ये शनि आणि गुरु यांचा संबंध शिक्षणाच्या महत्त्वाच्या कस्पांशी (विशेषतः 9 आणि 11) कधी होत आहे?
विश्लेषण: स्पर्धा परीक्षेत (JEE/NEET इत्यादी) निवड, scholarship किंवा उच्च शिक्षणातील मोठ्या यशाची संभाव्य वेळ.

4] सरकारी संस्था आणि शिष्यवृत्तीचे वचन (Promise of Government Institution and Scholarship):

A] 5व्या भावाच्या CSL (Cuspal Sub-Lord) चे विश्लेषण:
➤ 5व्या भावाचा CSL कोणता ग्रह आहे?

➤ सूर्य (Sun) किंवा चंद्र (Moon) स्वतः आपल्या नक्षत्र स्वामी (NL) किंवा राशी स्वामी (RL) च्या माध्यमातून 5th CSL शी जोडलेले आहेत का? (रिव्हर्स कनेक्शन चेक).
➤ हा 5th CSL 4, 5, 9 किंवा 11 भावांना प्रबळतेने सिग्निफाय करत आहे का?

B] 4थ्या भावाच्या (प्रारंभिक शिक्षण/संस्था) CSL चे विश्लेषण:

➤ 4th CSL हा 4, 5, 9, 11 भावांचा सिग्निफिकेटर आहे का?

C] विश्लेषण आणि फलादेश निर्देश:
➤ प्रबळ योग (Strong Promise): जर 5th आणि 4th दोन्ही CSL चा संबंध सूर्याशी असेल आणि ते 4, 5, 9, 11 भाव दर्शवत असतील, तर स्पष्ट सांगा की जन्म कुंडलीत सरकारी संस्थेत प्रवेश आणि शिष्यवृत्तीचे (Scholarship) 100% वचन आहे.
➤ मध्यम/राज्य संस्था (State/Aided Institution): जर सूर्याऐवजी मंगळ (संरक्षण/तांत्रिक संस्था) किंवा गुरु (शिक्षण/विद्यापीठ) यांचा प्रभाव असेल आणि 5, 9, 11 भाव सक्रिय असतील, तर राज्य सरकार, aided संस्था किंवा सार्वजनिक विद्यापीठाची शक्यता सांगा.
➤ निजी संस्था (Private Institution): जर 5th/4th CSL चा सूर्य किंवा चंद्राशी काही संबंध नसेल, आणि ते राहु/केतु किंवा बुध यांच्याशी जोडलेले असतील, तर स्पष्ट करा की यश निजी (Private) संस्थेत किंवा परदेशी संस्थेत मिळेल.

जर D1 आणि D24 मध्ये विद्येचे राजयोग असतील, पण D60 मध्ये तो ग्रह शापित असेल, तर शिक्षणात सुरुवातीच्या उंचीनंतरही अडथळा येऊ शकतो. हे 'सस्टेनेबल सक्सेस' (टिकाऊ यश) पाहण्यासाठी D60 चे विश्लेषण ।

➤ अंतिम निष्कर्ष: संपूर्ण विश्लेषणाचा संक्षिप्त सारांश आणि जातकासाठी सर्वात महत्त्वाचा सल्ला.
----------
आतापर्यंत विचारलेल्या सर्व पुढील प्रश्नांची संक्षिप्त उत्तरे द्या, कारण ही यादी या विश्लेषणाच्या अगदी सुरुवातीला लावली जाईल, यामुळे जातक प्रथमच थोडक्यात उत्तरे वाचेल आणि त्याला ज्या विषयाचे विश्लेषण संदर्भासह वाचायचे आहे, तो विभाग शोधेल...
