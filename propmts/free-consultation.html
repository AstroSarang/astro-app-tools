छवि और TXT गणनाओं के आधार पर निम्नलिखित क्षेत्रों पर प्रभाव लिखें:

जन्म नक्षत्र को आधार मानकर नवतारा चक्र बनाइए और विश्लेषण कीजिए कि कुंडली के सभी 9 ग्रह किन-किन ताराओं (संपत, विपत, वध आदि) के नक्षत्रों में बैठे हैं, और उस तारा के अनुसार प्रत्येक ग्रह अपना कैसा (शुभ/अशुभ) फल देगा? [PDF पेज No 28]
--------------------------------------------------
कृपया उपरोक्त सभी चैट और PDF के जन्म विवरणों के आधार पर सभी ९ ग्रहों (सूर्य, चंद्र, मंगल, बुध, गुरु, शुक्र, शनि, राहु, केतु) का ज्योतिषीय तथ्यों/आंकड़ों की सूची प्रदान करें। जानकारी संक्षिप्त और बिंदुवार होनी चाहिए, विस्तृत व्याख्या की आवश्यकता नहीं है। यह सूची कुंडली के फलित, षड्बल, विमशोपक (षोडश वर्ग), अष्टकवर्ग और जैमिनी कारकत्व के आधार पर होना चाहिए।

प्रत्येक ग्रह के लिए निम्नलिखित जानकारी प्रदान करें:
1. [ग्रह का नाम]
➤ जैमिनी कारकत्व:
➤ भाव स्वामित्व: (किन भावों का स्वामी है)
➤ स्थिति: (किस भाव और राशि में)
➤ राशि में स्थिति: (मित्र, शत्रु, सम, उच्च, नीच, मूलत्रिकोण, स्वराशि)
➤ नक्षत्र एवं पद: (वह ग्रह किस नक्षत्र और किस पद में है, और नक्षत्र स्वामी का प्रभाव।)
➤ दृष्टि: (किन भावों/ग्रहों पर दृष्टि) 
➤ [ग्रह का नाम] पर दृष्टि: (किन ग्रहों की दृष्टि है)
➤ युति: (किन ग्रहों के साथ युति में है)
➤ अवस्था (डिग्री): (डिग्री और अवस्था का नाम जैसे बाल, कुमार आदि)
➤ वक्री/अस्त/नीच/नीचभंग/वर्गोत्तम स्थिति: (हाँ/नहीं या स्थिति का नाम)
➤ नवमांश स्थिति:  (नवमांश कुंडली में ग्रह किस राशि, नक्षत्र (स्वामी) में है और उसका प्रभाव।)
➤ नवमांश में शक्ति: पीड़ित/बलवान
➤ चलित में स्थिति परिवर्तन और प्रभाव 
➤ भावबल: (केवल मान)
➤ षड्बल :  (रूप में मान और उसका बल कैसा है - औसत से बेहतर, रैंक आदि।)
➤ भिन्नाष्टक वर्ग (BAV) बिंदु: (0-8 के बीच मान) : (बिंदुओं के आधार पर: व्यावहारिक शक्ति - कमजोर/औसत/शक्तिशाली)
➤ विमशोपक (षोडश वर्ग): (मान और ग्रहों में उसका रैंक, यदि लागू हो।)
➤ पुष्कर नवांश (PN)/पुष्कर भाग (PB)/मृत्यु भाग (MB) में स्तिथि और प्रभाव :
​➤ नवतारा स्थिति एवं प्रभाव: (जन्म नक्षत्र के आधार पर यह ग्रह किस तारा-जैसे संपत, विपत, साधक आदि-में बैठा है, और उस विशिष्ट तारा के कारण इसके नैसर्गिक व भाव फलों में कैसी शुभता या बाधाएं आएंगी।)
➤ गोचर और दशा में संभावित फल का संक्षिप्त जवाब : (सामान्य तौर पर वह ग्रह अपनी दशा/अंतर्दशा और गोचर में कैसा फल देगा - अच्छा, खराब, या मध्यम।

➤ निष्कर्ष : समग्र रूप से ग्रह मजबूत है या पीड़ित है ? (प्रतिशत)

उपरोक्त कुंडली डेटा और गोचर विवरणों के आधार पर, अगले 7 वर्षों के लिए गुरु (बृहस्पति) और शनि के संयुक्त प्रभाव (Double Transit) की एक विस्तृत तालिका तैयार करें। यह विश्लेषण पूरी तरह से ग्रहों की दृष्टि और स्थिति (Transit Aspects/Positions) पर आधारित होना चाहिए।

तालिका का प्रारूप और कॉलम:
| समय (अवधि) | गुरु का गोचर प्रभाव (D1+D9) | शनि का गोचर प्रभाव (D1+D9) | संयुक्त प्रभाव (Double Transit) | विवाह की संभावना का अंतिम निष्कर्ष |

जाँच के लिए मुख्य चेकलिस्ट निर्देश:
प्रत्येक गोचर अवधि के लिए, निम्नलिखित बिंदुओं पर गुरु और शनि के प्रभाव (दृष्टि या युति) की सूक्ष्मता से जाँच करें:

1] गोचर के गुरु (Jupiter) के लिए:
- जन्म कुंडली (D1): सप्तम भाव/सप्तमेश, लग्न/लग्नेश, लाभ भाव/लाभेश, परिवार भाव/द्वितीयेश।
- कारक: जन्म शुक्र, जन्म गुरु, चंद्र लग्न (राशि)।
- नवांश (D9): नवांश लग्न और नवांश सप्तम भाव।

2] गोचर के शनि (Saturn) के लिए:

तालिका के नियम:
- प्रभाव कॉलम: केवल उन प्रभावित बिंदुओं के नाम लिखें जिनका संबंध बन रहा है (जैसे: 'सप्तम भाव और जन्म शुक्र पर दृष्टि')।
- संयुक्त प्रभाव: यदि गुरु और शनि दोनों एक साथ किन्हीं विवाह कारकों (विशेषकर लग्न या 7वें भाव) को प्रभावित कर रहे हैं, तो 'सक्रिय (Double Transit Active)' लिखें।
- निष्कर्ष: प्रभाव की तीव्रता और दोहरे गोचर की सक्रियता के आधार पर 'प्रबल', 'औसत' या 'न्यून' लिखें।

➤ क्या गोचर के गुरु और शनि, दोनों एक साथ प्रभावित (दृष्टि या युति द्वारा) कर रहे हैं, ऐसी अवधि है?

विश्लेषण (गोचर): दशा द्वारा पहचानी गई "समय सीमा" के भीतर, दोहरे गोचर का नियम उस विशिष्ट वर्ष को इंगित करता है जब विवाह की घटना घटित होने की सबसे अधिक संभावना है।

उपरोक्त फाइलों और उपलब्ध डेटा के आधार पर, जातक के लिए अगले 7 वर्षों के गुरु (बृहस्पति) के गोचर की एक विस्तृत 'विवाह केंद्रित शक्ति तालिका' तैयार करें।
​तालिका का प्रारूप और कॉलम (अनिवार्य):
| गोचर भाव (L/M) | समय (अवधि) | SAV | BAV | BAL | गुणवत्ता | विवाह पर प्रभाव | विवाह के सहायक भावों पर प्रभाव | विवाह की संभावना का अंतिम निष्कर्ष |
​डेटा प्रोसेसिंग के सख्त नियम:
​शक्ति डेटा (SAV/BAV/BAL): इन मानों को कुंडली के अष्टकवर्ग (Sarva/Bhinna) और भाव-बल (Bhava Bala) खंड से निकालें।
​विवाह पर प्रभाव: गुरु का गोचर में 7वें भाव, सप्तमेश, जन्म शुक्र, या जन्म गुरु से दृष्टि/स्थिति संबंध जाँचे।
​सहायक भावों पर प्रभाव: गुरु का 11वें, 2रे, 9वें भाव या जन्म शनि से दृष्टि/स्थिति संबंध जाँचे।
​गुणवत्ता (Quality) लॉजिक: SAV > 28 और BAL > 500 होने पर 'High', केवल SAV > 28 होने पर 'Medium', अन्यथा 'Low' लिखें।
​अंतिम निष्कर्ष: यदि 'विवाह पर प्रभाव' सक्रिय है और 'गुणवत्ता' High/Medium है, तो 'प्रबल संभावना' लिखें। यदि दोनों कम हैं, तो 'न्यून' लिखें।

विश्लेषण (दशा): उपरोक्त राशियों की दशा-अंतर्दशा-प्रत्यंतर विवाह के लिए सबसे प्रबल समय होती है। जिस अवधि में इनमें से एक से अधिक शर्तें पूरी होती हैं, वह समय सबसे महत्वपूर्ण है।

भाग 3: भृगु नंदी नाड़ी (BNN) के अनुसार विवाह के समय का विश्लेषण:

1] जीव कारक (गुरु) का सक्रिय होना:

➤ गोचर का बृहस्पति (Transit Jupiter): क्या गोचर का बृहस्पति, जन्म कुंडली के निम्नलिखित ग्रहों या भावों को सक्रिय कर रहा है (उनसे युति कर रहा है, या 2-12, या उनसे त्रिकोण (1-5-9) में है)?
▸ जन्म कुंडली का बृहस्पति (Jupiter)।
▸ जन्म कुंडली का शुक्र (Venus) - (यह विवाह के लिए सबसे महत्वपूर्ण सक्रियता है)।
▸ जन्म कुंडली का मंगल (Mars) - (स्त्री जातक के विवाह के लिए)।
▸ जन्म कुंडली का सप्तम भाव या सप्तमेश।

2] कर्म फल दाता (शनि) का अनुमोदन:

➤ गोचर का शनि (Transit Saturn): क्या गोचर का शनि, जन्म कुंडली के निम्नलिखित ग्रहों या भावों को सक्रिय कर रहा है (उन पर से गुजर रहा है, या दृष्टि डाल रहा है)?
▸ जन्म कुंडली का बृहस्पति (Jupiter)।
▸ जन्म कुंडली का शुक्र (Venus)।
▸ जन्म कुंडली का मंगल (Mars) - (स्त्री जातक के मामले में)।
▸ जन्म कुंडली का सप्तम भाव या सप्तमेश।
--------------------------------------------------
3] पुरुष और स्त्री कुंडली के लिए विशिष्ट विश्लेषण:

➤ पुरुष की कुंडली में: क्या गोचर का गुरु जन्म कुंडली के शुक्र से संबंध बना रहा है?
➤ स्त्री की कुंडली में: क्या गोचर का गुरु जन्म कुंडली के शुक्र (स्वयं) और मंगल (पति) से संबंध बना रहा है?

विश्लेषण:

➤ BNN के अनुसार, विवाह तब होता है जब "जीव" (गुरु) विवाह के लिए तैयार होता है और "कर्म" (शनि) उसे अनुमति देता है।
➤ सबसे प्रबल समय: वह वर्ष जब गोचर का गुरु विवाह के कारक ग्रहों (पुरुष के लिए शुक्र, और स्त्री के लिए शुक्र व मंगल) को सक्रिय कर रहा हो और साथ ही, गोचर का शनि भी उन्हीं कारक ग्रहों या भावों को अपनी दृष्टि या युति से अनुमोदित (approve) कर रहा हो।
➤ सहायक समय: यदि केवल गुरु का गोचर अनुकूल हो, तो भी विवाह की घटना हो सकती है, लेकिन जब शनि का भी अनुमोदन मिल जाता है, तो घटना का होना लगभग निश्चित हो जाता है।

भाग 4: कृष्णमूर्ति पद्धति (KP) के अनुसार विवाह के समय का विश्लेषण:

1] दशा विश्लेषण (संभावित अवधि की पुष्टि):
➤ दशा स्वामियों की योग्यता: क्या निकाली गयी सभी संभावित टाइम विंडो में विंशोत्तरी महादशा (MD), अंतर्दशा (AD), और प्रत्यंतर दशा (PD) के स्वामी ग्रह विवाह के लिए "योग्य" (Qualified) हैं?
▸ योग्यता की जांच: क्या ये दशा स्वामी ग्रह अपनी स्थिति, नक्षत्र स्वामी या उप-स्वामी के माध्यम से विवाह के प्रमुख भावों (2, 7, 11) के प्रबल सिग्निफिकेटर बन रहे हैं?
➤ नकारात्मक भावों की जांच: क्या ये दशा स्वामी साथ-ही-साथ विवाह में बाधक भावों (1, 6, 10) को भी सिग्निफाई कर रहे हैं? (यदि हाँ, तो विवाह संघर्ष या बाधाओं के बाद होगा)।

विश्लेषण (दशा): दशा अवधियों के आधार पर विवाह की संभावित समय-सीमा।
KP के अनुसार, विवाह केवल उसी MD-AD-PD में संभव है जिसके स्वामी ग्रह 2, 7, और 11 भावों के प्रबल सिग्निफिकेटर हों। यह पराशरी दशा विश्लेषण को फ़िल्टर करने का सबसे सटीक तरीका है।

2] गोचर (Transits) का उपयोग:

➤ प्रमुख ग्रहों का गोचर: दशा द्वारा इंगित अनुकूल अवधि में, क्या गोचर के बृहस्पति (Jupiter) और शनि (Saturn) उन ग्रहों के ऊपर से गुजर रहे हैं जो विवाह के प्रबल सिग्निफिकेटर हैं?

विश्लेषण (गोचर): दशा संभावित वर्षों और महीनों की सीमा बताती है, जबकि गोचर उस सीमा के भीतर सटीक महीने और दिन को इंगित करने में मदद करता है।

3] क्या जीवनसाथी वफादार होगा ?
[संदर्भ: कृपया D1 और D9 चार्ट में सप्तम भाव/सप्तमेश, शुक्र और चंद्रमा (मन) पर राहु/मंगल और बुध (चालाकी/धोखा) तथा 8वें/12वें भाव का नकारात्मक प्रभाव जांचें। लॉयल्टी तय करने से पहले अनिवार्य रूप से चेक करें कि क्या ये ग्रह (या कोई पापी युति जैसे : राहू के साथ शुक्र-बुध-मंगल) "गुरु या शनि की राशि या नक्षत्र" में स्थित हैं अथवा बुध-शुक्र-मंगल की राशी में स्तिथ है, या उन पर गुरु/शनि की शुभ दृष्टि है; क्योंकि यह स्थिति व्यक्ति को भटकाव से रोककर नैतिकता देती है।; KP: क्या 7th CSL 5, 8 और 12 (गुप्त संबंध/धोखा) को एक साथ सिग्निफाई कर रहा है?]

[संदर्भ: पराशरी: सप्तम भाव/सप्तमेश पर पाप ग्रहों (शनि, मंगल, राहु, केतु) का प्रभाव, सप्तमेश का 6ठे, 8वें या 12वें भाव से संबंध, नीच/अस्त ग्रहों का प्रभाव। जैमिनी: DK ग्रह पर पाप अर्गला।]

[संदर्भ: पराशरी: सप्तमेश जिस भाव और राशि में है, उसका कारकत्व (जैसे 3रा भाव = यात्रा/पड़ोसी/सोशल मीडिया, 4था भाव = घर/रिश्तेदार, 9वां भाव = धर्म/शिक्षा स्थान), नवमांश का सप्तम भाव। पुरुष के लिए शुक्र और स्त्री के लिए गुरु की भाव स्थिति। KP: 7th CSL का 3, 4, 9, 11 आदि भावों से संबंध। जैमिनी: A7 (दारापद) किस भाव और राशि में है (यह भौतिक मिलन की जगह बताता है)। BNN: गुरु/शुक्र किस दिशा और तत्व की राशि में बैठे हैं।]

11] वैवाहिक जीवन का विश्लेषण? (पराशरी D1 और  D9 और अन्य; जैमिनी [अर्गला]; BNN; KP)

➤ वैवाहिक सुख और संबंध प्रकृति

[संदर्भ: पराशरी: सप्तम से दूसरा (D1 का 8वां भाव और भावेश)। D9 का 8वां भाव। जैमिनी: उपपद लग्न (UL) से दूसरा भाव और उसका स्वामी।]

13] क्या जीवनसाथी आपके जीवन के उद्देश्यों, लक्ष्यों और महत्वाकांक्षाओं का समर्थन करेगा/करेगी?

--------------------------------------------------
14] संतान प्राप्ति के योग और संतान से संबंधित जीवन कैसा रहेगा?  (D7 और आवश्यक पद्दति)
[संदर्भ: पराशरी: D1 का 5वां भाव/भावेश, गुरु (संतान कारक) की स्थिति, सप्तांश (D7) कुंडली का लग्न और 5वां भाव। KP: 5वें भाव के CSL का 2, 5, 11 भावों से संबंध।]

15] विवाह अथवा ससुराल की दिशा क्या होगी?
➤ विवाह के लिए अनुकूल स्थान क्या हो सकता है?

16] ससुराल से संबंध कैसे होंगे?

17] विवाह के बाद धनलाभ या ससुराल/जीवनसाथी से भाग्योदय के योग हैं या नहीं?

19] क्या लॉन्ग डिस्टेंस रिलेशनशिप के योग हैं?

3] गोचर विश्लेषण :
➤ सभी संभावित दशा अवधि में गुरु और शनि का संयुक्त प्रभाव: 

उपरोक्त कुंडली डेटा और गोचर विवरणों के आधार पर, अगले 7 वर्षों के लिए गुरु (बृहस्पति) और शनि के संयुक्त प्रभाव (Double Transit) की एक विस्तृत तालिका तैयार करें। यह विश्लेषण पूरी तरह से ग्रहों की दृष्टि और स्थिति (Transit Aspects/Positions) पर आधारित होना चाहिए।

तालिका का प्रारूप और कॉलम:
| समय (अवधि) | गुरु का गोचर प्रभाव (D1+D9) | शनि का गोचर प्रभाव (D1+D9) | संयुक्त प्रभाव (Double Transit) | विवाह की संभावना का अंतिम निष्कर्ष |

जाँच के लिए मुख्य चेकलिस्ट निर्देश:
प्रत्येक गोचर अवधि के लिए, निम्नलिखित बिंदुओं पर गुरु और शनि के प्रभाव (दृष्टि या युति) की सूक्ष्मता से जाँच करें:

1] गोचर के गुरु (Jupiter) के लिए:
- जन्म कुंडली (D1): सप्तम भाव/सप्तमेश, लग्न/लग्नेश, लाभ भाव/लाभेश, परिवार भाव/द्वितीयेश।
- कारक: जन्म शुक्र, जन्म गुरु, चंद्र लग्न (राशि)।
- नवांश (D9): नवांश लग्न और नवांश सप्तम भाव।

2] गोचर के शनि (Saturn) के लिए:
- जन्म कुंडली (D1): लग्न/लग्नेश, सप्तम भाव/सप्तमेश, लाभ भाव/लाभेश, परिवार भाव/द्वितीयेश।
- कारक: जन्म शुक्र, जन्म गुरु, चंद्र लग्न (राशि)।
- नवांश (D9): नवांश लग्न और नवांश सप्तम भाव।

तालिका के नियम:
- प्रभाव कॉलम: केवल उन प्रभावित बिंदुओं के नाम लिखें जिनका संबंध बन रहा है (जैसे: 'सप्तम भाव और जन्म शुक्र पर दृष्टि')।
- संयुक्त प्रभाव: यदि गुरु और शनि दोनों एक साथ किन्हीं विवाह कारकों (विशेषकर लग्न या 7वें भाव) को प्रभावित कर रहे हैं, तो 'सक्रिय (Double Transit Active)' लिखें।
- निष्कर्ष: प्रभाव की तीव्रता और दोहरे गोचर की सक्रियता के आधार पर 'प्रबल', 'औसत' या 'न्यून' लिखें।

​तालिका का प्रारूप और कॉलम (अनिवार्य):
| गोचर भाव (L/M) | समय (अवधि) | SAV | BAV | BAL | गुणवत्ता | विवाह पर प्रभाव | विवाह के सहायक भावों पर प्रभाव | विवाह की संभावना का अंतिम निष्कर्ष |
​डेटा प्रोसेसिंग के सख्त नियम:
​शक्ति डेटा (SAV/BAV/BAL): इन मानों को कुंडली के अष्टकवर्ग (Sarva/Bhinna) और भाव-बल (Bhava Bala) खंड से निकालें।
​विवाह पर प्रभाव: गुरु का गोचर में 7वें भाव, सप्तमेश, जन्म शुक्र, या जन्म गुरु से दृष्टि/स्थिति संबंध जाँचे।

विश्लेषण (दशा): उपरोक्त राशियों की दशा-अंतर्दशा-प्रत्यंतर विवाह के लिए सबसे प्रबल समय होती है। जिस अवधि में इनमें से एक से अधिक शर्तें पूरी होती हैं, वह समय सबसे महत्वपूर्ण है।

भाग 3: भृगु नंदी नाड़ी (BNN) के अनुसार विवाह के समय का विश्लेषण:

1] जीव कारक (गुरु) का सक्रिय होना:

➤ गोचर का बृहस्पति (Transit Jupiter): क्या गोचर का बृहस्पति, जन्म कुंडली के निम्नलिखित ग्रहों या भावों को सक्रिय कर रहा है (उनसे युति कर रहा है, या 2-12, या उनसे त्रिकोण (1-5-9) में है)?
▸ जन्म कुंडली का बृहस्पति (Jupiter)।
▸ जन्म कुंडली का शुक्र (Venus) - (यह विवाह के लिए सबसे महत्वपूर्ण सक्रियता है)।
▸ जन्म कुंडली का मंगल (Mars) - (स्त्री जातक के विवाह के लिए)।
▸ जन्म कुंडली का सप्तम भाव या सप्तमेश।

2] कर्म फल दाता (शनि) का अनुमोदन:

➤ गोचर का शनि (Transit Saturn): क्या गोचर का शनि, जन्म कुंडली के निम्नलिखित ग्रहों या भावों को सक्रिय कर रहा है (उन पर से गुजर रहा है, या दृष्टि डाल रहा है)?
▸ जन्म कुंडली का बृहस्पति (Jupiter)।
▸ जन्म कुंडली का शुक्र (Venus)।
▸ जन्म कुंडली का मंगल (Mars) - (स्त्री जातक के मामले में)।
▸ जन्म कुंडली का सप्तम भाव या सप्तमेश।

3] पुरुष और स्त्री कुंडली के लिए विशिष्ट विश्लेषण:

➤ पुरुष की कुंडली में: क्या गोचर का गुरु जन्म कुंडली के शुक्र से संबंध बना रहा है?
➤ स्त्री की कुंडली में: क्या गोचर का गुरु जन्म कुंडली के शुक्र (स्वयं) और मंगल (पति) से संबंध बना रहा है?

विश्लेषण:

➤ BNN के अनुसार, विवाह तब होता है जब "जीव" (गुरु) विवाह के लिए तैयार होता है और "कर्म" (शनि) उसे अनुमति देता है।
➤ सबसे प्रबल समय: वह वर्ष जब गोचर का गुरु विवाह के कारक ग्रहों (पुरुष के लिए शुक्र, और स्त्री के लिए शुक्र व मंगल) को सक्रिय कर रहा हो और साथ ही, गोचर का शनि भी उन्हीं कारक ग्रहों या भावों को अपनी दृष्टि या युति से अनुमोदित (approve) कर रहा हो।
➤ सहायक समय: यदि केवल गुरु का गोचर अनुकूल हो, तो भी विवाह की घटना हो सकती है, लेकिन जब शनि का भी अनुमोदन मिल जाता है, तो घटना का होना लगभग निश्चित हो जाता है।

भाग 4: कृष्णमूर्ति पद्धति (KP) के अनुसार विवाह के समय का विश्लेषण:

1] दशा विश्लेषण (संभावित अवधि की पुष्टि):
➤ दशा स्वामियों की योग्यता: क्या निकाली गयी सभी संभावित टाइम विंडो में विंशोत्तरी महादशा (MD), अंतर्दशा (AD), और प्रत्यंतर दशा (PD) के स्वामी ग्रह विवाह के लिए "योग्य" (Qualified) हैं?
▸ योग्यता की जांच: क्या ये दशा स्वामी ग्रह अपनी स्थिति, नक्षत्र स्वामी या उप-स्वामी के माध्यम से विवाह के प्रमुख भावों (2, 7, 11) के प्रबल सिग्निफिकेटर बन रहे हैं?
➤ नकारात्मक भावों की जांच: क्या ये दशा स्वामी साथ-ही-साथ विवाह में बाधक भावों (1, 6, 10) को भी सिग्निफाई कर रहे हैं? (यदि हाँ, तो विवाह संघर्ष या बाधाओं के बाद होगा)।

विश्लेषण (दशा): दशा अवधियों के आधार पर विवाह की संभावित समय-सीमा।
KP के अनुसार, विवाह केवल उसी MD-AD-PD में संभव है जिसके स्वामी ग्रह 2, 7, और 11 भावों के प्रबल सिग्निफिकेटर हों। यह पराशरी दशा विश्लेषण को फ़िल्टर करने का सबसे सटीक तरीका है।

विश्लेषण (गोचर): दशा संभावित वर्षों और महीनों की सीमा बताती है, जबकि गोचर उस सीमा के भीतर सटीक महीने और दिन को इंगित करने में मदद करता है।

उपरोक्त चैट और पीडीएफ की और शुरू से आपको दी गयी सभी जानकारी के आधार पर निम्मलिखित सवालों का गहन और विस्तार से विश्लेषण करके निष्कर्ष सहित देना है, ध्यान रहे विश्लेषण संदर्भ के आलावा भी अपने बुद्धि का उपयोग करते हुए आवश्यकता अनुसार ज्योतिष ज्योतिष प्रणाली का उपयोग करते हुए होनी चाहिए। 
और क्या निर्देश है जिनका आपको सख्ती से पालन करना है वो आपको याद है ?  कौनसे है ?

1. मारक-बाधक पहचान (Identification):

मारक पहचान: क्या यह ग्रह द्वितीयेश (2nd lord) या सप्तमेश (7th lord) होकर मारकेश की भूमिका में है? यदि हाँ, तो कौन सी - द्वितीयेश (सामान्य मारक) या सप्तमेश (प्रबल मारक)?
बाधक पहचान: क्या यह ग्रह लग्न के स्वभाव (चर, स्थिर, द्विस्वभाव) के अनुसार बाधक भाव (11वें, 9वें, या 7वें) का स्वामी है?
दोहरी भूमिका: क्या यह ग्रह मारक और बाधक दोनों की भूमिका निभा रहा है? (विशेषकर द्विस्वभाव लग्न के लिए सप्तमेश के रूप में)।
कार्यात्मक शुभता: इसके विपरीत, क्या यह ग्रह केंद्र/त्रिकोण का स्वामी होकर एक शुभ 'योगकारक' ग्रह है? या केवल एक त्रिकोण का स्वामी होकर अत्यंत शुभ है?
2. नकारात्मकता/सकारात्मकता की तीव्रता का आकलन (Assessing the Intensity):
पापी ग्रहों का प्रभाव: क्या इस ग्रह पर नैसर्गिक पाप ग्रहों (शनि, मंगल, राहु, केतु) की दृष्टि है या वह उनके साथ युति में है? यदि हाँ, तो यह उसकी नकारात्मकता को कैसे बढ़ा रहा है?

4.  **लपलेली रहस्ये उघड करा:** सामान्य गोष्टींव्यतिरिक्त, ग्रहांच्या स्थितीच्या आधारे त्यांच्या स्वभाव, करियर किंवा नातेसंबंधांशी संबंधित एखादी खोल किंवा लपलेली गोष्ट सांगा, जी ऐकून ते आश्चर्यचकित होतील.
5.  **संवादासारखे बनवा:** मध्ये-मध्ये प्रश्नार्थक वाक्ये वापरा, जसे - "तुम्हाला माझे म्हणणे समजत आहे का?" किंवा "तुमच्याबाबत असे घडते का?". यामुळे ते एकतर्फी भाषण वाटणार नाही.
6.  **सकारात्मक आणि नकारात्मक संतुलन:** फक्त चांगल्या गोष्टीच नाहीत, तर आव्हाने आणि दोषांबद्दलही सांगा, परंतु सांगण्याची पद्धत सहानुभूतीपूर्ण आणि उपायाभिमुख असली पाहिजे. जसे - "होय, एका ठिकाणी थोडीशी आव्हान दिसत आहे... पण घाबरण्यासारखे काही नाही, त्यावर उपायही असतो."

**या मुख्य विषयांचा संभाषणात समावेश करा:**
* जातकाचा मूळ स्वभाव, त्याची सर्वात मोठी ताकद आणि कमजोरी.
* कुंडलीचा सर्वात शक्तिशाली राजयोग आणि त्याचा आयुष्यावरील प्रभाव.
* कुंडलीचा सर्वात प्रमुख दोष आणि त्याशी संबंधित काळजी.
* कुंडलीनुसार जातकाचे छोटे आणि मोठे रोग आणि आजार.
* करियर, धन, विवाह आणि आरोग्याशी संबंधित एक-एक महत्त्वाची आणि आश्चर्यकारक गोष्ट.

कृपया संपूर्ण स्क्रिप्ट सहज प्रवाहात लिहा, जेणेकरून मी ती सहजपणे वाचून ऐकवू शकेन.
----------
या कुंडलीच्या आधारे जातकाच्या वैवाहिक जीवनाचे विश्लेषण करा. विवाहाचा योग कधी जुळत आहे? जीवनसाथीचा स्वभाव आणि दिशा काय असू शकते? वैवाहिक जीवनातील सुखासाठी काही उपाय आवश्यक आहे का?
----------
या कुंडलीच्या आधारे जातकाच्या करियरचे सविस्तर विश्लेषण करा. नोकरी की व्यवसाय यापैकी काय चांगले राहील, कोणत्या क्षेत्रात यश मिळेल आणि करियरमध्ये मोठी झेप कधी येऊ शकते ते सांगा?
----------
तुम्ही अत्यंत अनुभवी आणि ज्ञानी वैदिक ज्योतिषी आहात. मी तुम्हाला एका जातकाची लग्न कुंडली देत आहे. तुमचे कार्य या कुंडलीचे सखोल आणि सविस्तर विश्लेषण करणे आहे. तुम्हाला तुमची प्रतिक्रिया एखाद्या तज्ज्ञ ज्योतिषीसारखी सादर करायची आहे, जो थेट जातकाशी बोलत आहे.

तुमचे विश्लेषण असे असले पाहिजे की ते जातकाला आश्चर्यचकित करेल आणि त्याच्या आयुष्यातील त्या लपलेल्या पैलूंचा उलगडा करेल ज्यांची त्याला माहिती नसेल. साधारण गोष्टी सांगू नका, तर ग्रहांच्या स्थितीच्या आधारे विशेष आणि गुप्त रहस्यांवर लक्ष केंद्रित करा.

**विश्लेषणात खालील मुद्द्यांचा समावेश करा:**

1.  **व्यक्तिमत्त्व आणि स्वभावाचे सखोल विश्लेषण:**
    * लग्न, लग्नेश आणि चंद्राच्या स्थितीच्या आधारे जातकाचा मूळ स्वभाव, त्याची विचारसरणी आणि बाह्य जगासाठी त्याच्या वर्तनाचे वर्णन करा.
    * जातकाची सर्वात मोठी ताकद आणि सर्वात मोठी कमजोरी काय आहे?
    * अशी एखादी लपलेली प्रतिभा किंवा इच्छा आहे का जी जातक स्वतःही पूर्णपणे समजत नाही?

2.  **कुंडलीतील विशेष योग आणि दोष:**
    * कुंडलीत तयार होणारे सर्व महत्त्वाचे **सकारात्मक योग** (जसे - गजकेसरी योग, पंच महापुरुष योग, राज योग, धन योग) ओळखा आणि सांगा की ते जातकाच्या आयुष्यावर कसे आणि कधी परिणाम करतील.
    * कुंडलीत असलेल्या सर्व महत्त्वाच्या **नकारात्मक दोषां**चे (जसे - कालसर्प दोष, मांगलिक दोष, पितृ दोष, ग्रहण दोष) विश्लेषण करा. हा दोष आयुष्याच्या कोणत्या क्षेत्रात समस्या देत आहे आणि त्याची तीव्रता किती आहे?

3.  **आयुष्यातील प्रमुख क्षेत्रांवर भविष्यवाणी:**
    * **करियर आणि व्यवसाय:** जातकासाठी कोणते क्षेत्र सर्वात चांगले राहील? नोकरी की व्यवसाय? यश कधी मिळण्याची शक्यता आहे?
    * **धन आणि आर्थिक स्थिती:** जातकाची आर्थिक स्थिती कशी राहील? धन कमवण्याची आणि वाचवण्याची क्षमता कशी आहे? अनपेक्षित धनलाभाचा काही योग आहे का?
    * **विवाह आणि नातेसंबंध:** वैवाहिक जीवन कसे राहील? जीवनसाथीचा स्वभाव कसा असू शकतो? विवाहाची योग्य वेळ काय असू शकते?
    * **आरोग्य:** जातकाने कोणत्या आरोग्य समस्यांबाबत सावध राहिले पाहिजे?

4.  **कुंडलीतील लपलेली रहस्ये आणि विशेष संकेत:**
    * ग्रहांची एखादी विशेष युती, दृष्टी किंवा स्थिती जी जातकाच्या आयुष्यावर असाधारण प्रभाव टाकत आहे.
    * आयुष्यातील एखादी अशी संभाव्य घटना (सकारात्मक किंवा नकारात्मक) जिच्याबद्दल जातकाने आधीपासून सावध राहिले पाहिजे.
    * जातकाचा भाग्यवान ग्रह कोणता आहे आणि तो कसा बळकट करता येऊ शकतो?

तुमचे उत्तर सोप्या हिंदीत असले पाहिजे, परंतु भाषेत ज्योतिषीय गांभीर्य आणि ज्ञान झळकले पाहिजे. विश्लेषण वेगवेगळ्या विभागांत मांडा जेणेकरून ते समजणे सोपे होईल.`;
        let currentLang = 'hi';
        function getRawData() {
            if (currentLang === 'en') return rawData_en;
            if (currentLang === 'mr') return rawData_mr;
            return rawData_hi;
        }
        function changeLanguage(lang) {
            currentLang = lang;
            document.getElementById('prompt-container').innerHTML = '';
            processData();
        }

        // सेपरेटर लॉजिक: --- या ___ लाइन्स से अलग करना
        const separatorRegex = /\n-{10,}\n|\n_{10,}\n/g;
        
        function processData() {
            const container = document.getElementById('prompt-container');
            // पहले डैश लाइन्स से तोडें
            let parts = getRawData().split(separatorRegex);

            parts.forEach((part, index) => {
                let cleanText = part.trim();
                
                // फिल्टरिंग लॉजिक
                const lines = cleanText.split('\n');
                const filteredLines = lines.filter(line => {
                    const l = line.trim();
                    // जंक (MMM... RRR... PPPP...) हटाएं
                    if (l.match(/^[M|P|C|H|R]{5,}$/)) return false;
                    // सिर्फ डैश वाली लाइन हटाएं
                    if (l.match(/^-{5,}$/)) return false;
                    return true;
                });
                
                cleanText = filteredLines.join('\n').trim();

                if (cleanText.length > 5) { // खाली या बहुत छोटी स्ट्रिंग न दिखाएं
                    createCard(cleanText, index + 1);
                }
            });
        }

        function createCard(text, id) {
            const container = document.getElementById('prompt-container');
            
            const card = document.createElement('div');
            card.className = 'card';

            const header = document.createElement('div');
            header.className = 'card-header';
            header.innerHTML = `<span>Prompt #${id}</span>`;

            const content = document.createElement('div');
            content.className = 'card-content';
            content.innerText = text;

            const btn = document.createElement('button');
            btn.className = 'btn';
            btn.innerText = 'Copy Prompt';
            btn.onclick = () => copyText(text, btn);

            card.appendChild(header);
            card.appendChild(content);
            card.appendChild(btn);
            container.appendChild(card);
        }

        function showBtnFeedback(btn, success){
            if(!btn) return;
            var origText = btn.innerText;
            var origBg = btn.style.backgroundColor;
            btn.innerText = success ? "\u2713 Copied!" : "\u2717 Failed";
            btn.style.backgroundColor = success ? "#2e7d32" : "#c62828";
            btn.style.color = "#fff";
            setTimeout(function(){ btn.innerText = origText; btn.style.backgroundColor = origBg; }, 2000);
        }
        function copyText(text, btn) {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(() => {
                    showToast();
                    showBtnFeedback(btn, true);
                }).catch(err => {
                    fallbackCopy(text, btn);
                });
            } else {
                fallbackCopy(text, btn);
            }
        }

        function fallbackCopy(text, btn) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed'; // Avoid scrolling to bottom
            document.body.appendChild(textarea);
            textarea.focus();
            textarea.select();
            try {
                var ok = document.execCommand('copy');
                showToast();
                showBtnFeedback(btn, ok);
            } catch (err) {
                console.error('Fallback: Oops, unable to copy', err);
                showBtnFeedback(btn, false);
            }
            document.body.removeChild(textarea);
        }

        function showToast() {
            var x = document.getElementById("snackbar");
            x.className = "toast show";
            setTimeout(function(){ x.className = x.className.replace("show", ""); }, 3000);
        }

        // Initialize
        processData();

    </script>
