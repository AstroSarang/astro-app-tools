<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Astro Prompts Copier</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        .card {
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-bottom: 15px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            border-left: 5px solid #007bff;
        }
        .card-content {
            white-space: pre-wrap;
            font-size: 14px;
            color: #555;
            max-height: 150px;
            overflow-y: auto;
            background: #f9f9f9;
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #eee;
            margin-bottom: 10px;
        }
        .card-header {
            font-weight: bold;
            margin-bottom: 5px;
            color: #007bff;
            display: flex;
            justify-content: space-between;
        }
        .btn {
            align-self: flex-end;
            background-color: #28a745;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: background 0.3s;
        }
        .btn:hover {
            background-color: #218838;
        }
        .btn:active {
            transform: scale(0.98);
        }
        .toast {
            visibility: hidden;
            min-width: 250px;
            background-color: #333;
            color: #fff;
            text-align: center;
            border-radius: 2px;
            padding: 16px;
            position: fixed;
            z-index: 1;
            left: 50%;
            bottom: 30px;
            transform: translateX(-50%);
            font-size: 17px;
        }
        .toast.show {
            visibility: visible;
            animation: fadein 0.5s, fadeout 0.5s 2.5s;
        }
        @keyframes fadein {
            from {bottom: 0; opacity: 0;}
            to {bottom: 30px; opacity: 1;}
        }
        @keyframes fadeout {
            from {bottom: 30px; opacity: 1;}
            to {bottom: 0; opacity: 0;}
        }
    </style>
</head>
<body>

    <h1>Free Consultation Prompts</h1>
    <div style="text-align:center; margin:10px 0;">
        <label for="lang-select" style="font-weight:bold; margin-right:8px;">भाषा / Language / भाषा:</label>
        <select id="lang-select" onchange="changeLanguage(this.value)" style="padding:8px 12px; font-size:16px; border-radius:8px; border:2px solid #007bff;">
            <option value="hi" selected>हिंदी</option>
            <option value="en">English</option>
            <option value="mr">मराठी</option>
        </select>
    </div>
    <div class="container" id="prompt-container">
        <!-- Prompts will be loaded here -->
    </div>

    <div id="snackbar" class="toast">Text Copied to Clipboard!</div>

    <script>
        // यहाँ आपका पूरा डेटा है
        const rawData_hi = ``;
        const rawData_en = ``;
        const rawData_mr = ``;
        let currentLang = 'hi';
        function getRawData() {
            if (currentLang === 'en') return rawData_en;
            if (currentLang === 'mr') return rawData_mr;
            return rawData_hi;
        }
        function changeLanguage(lang) {
            currentLang = lang;
            document.getElementById('prompt-container').innerHTML = '';
            processData();
        }

        // सेपरेटर लॉजिक: --- या ___ लाइन्स से अलग करना
        const separatorRegex = /\n-{10,}\n|\n_{10,}\n/g;
        
        function processData() {
            const container = document.getElementById('prompt-container');
            // पहले डैश लाइन्स से तोडें
            let parts = getRawData().split(separatorRegex);

            parts.forEach((part, index) => {
                let cleanText = part.trim();
                
                // फिल्टरिंग लॉजिक
                const lines = cleanText.split('\n');
                const filteredLines = lines.filter(line => {
                    const l = line.trim();
                    // जंक (MMM... RRR... PPPP...) हटाएं
                    if (l.match(/^[M|P|C|H|R]{5,}$/)) return false;
                    // सिर्फ डैश वाली लाइन हटाएं
                    if (l.match(/^-{5,}$/)) return false;
                    return true;
                });
                
                cleanText = filteredLines.join('\n').trim();

                if (cleanText.length > 5) { // खाली या बहुत छोटी स्ट्रिंग न दिखाएं
                    createCard(cleanText, index + 1);
                }
            });
        }

        function createCard(text, id) {
            const container = document.getElementById('prompt-container');
            
            const card = document.createElement('div');
            card.className = 'card';

            const header = document.createElement('div');
            header.className = 'card-header';
            header.innerHTML = `<span>Prompt #${id}</span>`;

            const content = document.createElement('div');
            content.className = 'card-content';
            content.innerText = text;

            const btn = document.createElement('button');
            btn.className = 'btn';
            btn.innerText = 'Copy Prompt';
            btn.onclick = () => copyText(text, btn);

            card.appendChild(header);
            card.appendChild(content);
            card.appendChild(btn);
            container.appendChild(card);
        }

        function showBtnFeedback(btn, success){
            if(!btn) return;
            var origText = btn.innerText;
            var origBg = btn.style.backgroundColor;
            btn.innerText = success ? "\u2713 Copied!" : "\u2717 Failed";
            btn.style.backgroundColor = success ? "#2e7d32" : "#c62828";
            btn.style.color = "#fff";
            setTimeout(function(){ btn.innerText = origText; btn.style.backgroundColor = origBg; }, 2000);
        }
        function copyText(text, btn) {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(() => {
                    showToast();
                    showBtnFeedback(btn, true);
                }).catch(err => {
                    fallbackCopy(text, btn);
                });
            } else {
                fallbackCopy(text, btn);
            }
        }

        function fallbackCopy(text, btn) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed'; // Avoid scrolling to bottom
            document.body.appendChild(textarea);
            textarea.focus();
            textarea.select();
            try {
                var ok = document.execCommand('copy');
                showToast();
                showBtnFeedback(btn, ok);
            } catch (err) {
                console.error('Fallback: Oops, unable to copy', err);
                showBtnFeedback(btn, false);
            }
            document.body.removeChild(textarea);
        }

        function showToast() {
            var x = document.getElementById("snackbar");
            x.className = "toast show";
            setTimeout(function(){ x.className = x.className.replace("show", ""); }, 3000);
        }

        // Initialize
        processData();

    </script>
</body>
</html>
