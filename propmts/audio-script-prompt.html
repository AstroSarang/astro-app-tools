<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Audio Script Prompt Tool v1.2</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: 'Noto Sans Devanagari', 'Mangal', sans-serif; margin: 0; background: #fdf6ec; color: #222; }
  .wrap { max-width: 860px; margin: 0 auto; padding: 14px; }
  h1 { font-size: 21px; color: #8b0000; margin: 6px 0 2px; }
  .sub { font-size: 13px; color: #666; margin-bottom: 12px; }
  label { display: block; font-weight: 700; margin: 12px 0 5px; color: #5b2a86; font-size: 15px; }
  select, input[type=text], textarea { width: 100%; padding: 10px; font-size: 15px; border: 2px solid #d8b36a; border-radius: 8px; background: #fff; font-family: inherit; }
  textarea { resize: vertical; }
  .row { display: flex; gap: 10px; }
  .row > div { flex: 1; }
  #copyBtn { width: 100%; margin-top: 14px; padding: 13px; font-size: 17px; font-weight: 700; background: #1c7c34; color: #fff; border: none; border-radius: 9px; cursor: pointer; }
  #copyBtn:active { background: #145c26; }
  .meta { font-size: 12.5px; color: #777; margin-top: 6px; text-align: right; }
  .note { font-size: 13px; color: #8b5a00; background: #fff3d6; border: 1px solid #e6c877; border-radius: 8px; padding: 8px 10px; margin-top: 8px; display: none; }
  #out { background: #fffdf7; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🎧 Audio Script Prompt Tool v1.2</h1>
  <div class="sub">रिपोर्ट चुनो, नाम और सवाल भरो - तैयार prompt एक click में copy करो। लंबाई हर template में तय है (मैरिज टाइमिंग 10 मिनट, बाकी 20 मिनट)।</div>

  <label>रिपोर्ट चुनें:</label>
  <select id="reportSel"></select>

  <div class="row">
    <div>
      <label>स्क्रिप्ट की भाषा:</label>
      <select id="langSel">
        <option value="hinglish">Hinglish (डिफ़ॉल्ट)</option>
        <option value="hindi">हिंदी</option>
        <option value="marathi">मराठी</option>
        <option value="english">English</option>
      </select>
    </div>
  </div>

  <div id="nameBlock1">
    <label id="nameLabel1">जातक का नाम:</label>
    <input type="text" id="name1" placeholder="जैसे: समीर">
  </div>
  <div id="nameBlock2" style="display:none">
    <label>वधू का नाम:</label>
    <input type="text" id="name2" placeholder="जैसे: प्रिया">
  </div>

  <div id="qBlock">
    <label>जातक के सवाल (एक line में एक सवाल):</label>
    <textarea id="questions" rows="6" placeholder="हर line में एक सवाल लिखें या paste करें"></textarea>
  </div>
  

  <label>रिपोर्ट यहाँ paste करो (ऐच्छिक):</label>
  <textarea id="reportText" rows="5" placeholder="खाली छोड़ोगे तो सिर्फ prompt copy होगा; भरोगे तो report prompt के अंत में जुड़कर एक साथ copy होगी"></textarea>

  <button id="copyBtn">📋 तैयार Prompt Copy करो</button>
  <div class="meta" id="meta"></div>

  <label>तैयार Prompt:</label>
  <textarea id="out" rows="22" readonly></textarea>
</div>
<script>
const TEMPLATES = {"ques": {"label": "प्रश्न कुंडली (Ques Kundali)", "text": "नीचे एक विस्तृत प्रश्न कुंडली (Prashna Kundali) रिपोर्ट दी गई है, जिसमें जातक द्वारा पूछे गए प्रश्नों का चारों पद्धतियों (पराशरी, जैमिनी, भृगु नंदी नाड़ी और केपी) के आधार पर विस्तृत विश्लेषण और उत्तर शामिल हैं। आपको इस पूरी रिपोर्ट के आधार पर एक 'टेक्स्ट-टू-स्पीच' (TTS) ऑडियो स्क्रिप्ट तैयार करनी है।\n\nजातक का नाम: [यहाँ जातक का नाम भरें]\n\nजातक के स्वयं के प्रश्न (यहाँ क्रम से भरें; उत्तर रिपोर्ट में दिए गए हैं):\n[प्रश्न 1]\n[प्रश्न 2]\n[प्रश्न 3]\n[प्रश्न 4]\n[प्रश्न 5]\n[प्रश्न 6]\n\nरिपोर्ट की संरचना: इस रिपोर्ट में कोई तय प्रश्न सूची नहीं है; रिपोर्ट पूरी तरह जातक के ऊपर भरे गए प्रश्नों पर ही आधारित है। हर प्रश्न का उत्तर रिपोर्ट में चारों पद्धतियों के विश्लेषण के साथ दिया गया है।\n\nस्क्रिप्ट के लिए निर्देश (सख्ती से पालन करें):\n\n1] भाषा: स्क्रिप्ट की भाषा सरल Hinglish हो, जैसी आज की पीढ़ी बोलती और समझती है। स्क्रिप्ट का tone पूरी तरह बोलचाल वाला रखें - शुद्ध या संस्कृतनिष्ठ भारी हिंदी के शब्द न वापरें, रोज़मर्रा की बातचीत वाली Hinglish ही रखें। इंग्लिश मिक्स शब्द चाहिए - जैसे व्यवसाय का बिजनेस, ऐसे ही दो करके दें। पूरी स्क्रिप्ट देवनागरी लिपि में ही लिखें; अंग्रेजी के शब्द भी देवनागरी में ही लिखें, जैसे 'पर्सनलाइज़्ड', 'प्रैक्टिकल', 'सपोर्टिव'। ऊपर सूची में दिए गए प्रश्न या भाग अंग्रेजी में हैं; स्क्रिप्ट में इन्हें अंग्रेजी में ज्यों के त्यों न पढ़कर सरल Hinglish में अपने शब्दों में प्रस्तुत करें।\n\nध्यान रहे: Narrator एक फीमेल एस्ट्रोलॉजर है।\n\n2] शुरुआत: स्क्रिप्ट की शुरुआत बिल्कुल इन शब्दों से होनी चाहिए: 'नमस्कार, संजीवनी ज्योतिष संस्थान में आपका स्वागत है। [जातक का नाम] जी, यह आपकी पर्सनलाइज़्ड प्रश्न कुंडली रिपोर्ट की ऑडियो समरी है।'\n\n3] लंबाई: यह स्क्रिप्ट लगभग 20 मिनट के ऑडियो के लिए है। हर प्रश्न का जवाब करीब {PERQ} शब्दों में दें।\n\n4] संरचना और क्रम: स्क्रिप्ट इसी क्रम में चले -\n(क) सभी प्रश्न ऊपर भरे गए क्रम में ही एक-एक करके लें - हर प्रश्न को पहले सरल शब्दों में प्रस्तुत करें, फिर रिपोर्ट में दिया गया उसका उत्तर और निष्कर्ष गहराई से समझाएँ।\n(ख) सभी प्रश्नों के बाद रिपोर्ट का समग्र निष्कर्ष (Overall Conclusion) संक्षेप में दें।\n(ग) अंत में उपाय (नीचे point 7 देखें) और फिर समापन पंक्ति।\nसभी भागों को एक कहानी और संवाद (Conversational) के लहजे में जोड़ें, बीच-बीच में स्वाभाविक संक्रमण वाक्य रखें, ताकि client को लगे कि कोई उन्हें सामने बैठाकर रिपोर्ट समझा रहा है। ध्यान रहे, अलग-अलग भागों में एक ही निष्कर्ष बार-बार न दोहराया जाए; जहाँ बात पहले आ चुकी हो, वहाँ संक्षेप में संदर्भ देकर आगे बढ़ें।\n\n5] तकनीकी शब्दावली से बचें: कुंडली के तकनीकी विवरण (ग्रहों की डिग्रियाँ, वर्ग चार्टों के नाम, मृत्यु भाग जैसे शब्द) सीधे न पढ़ें; उनके पीछे का अर्थ और अंतिम फलादेश सरल भाषा में समझाएँ। प्रतिशत (जैसे सफलता की संभावना) सिर्फ मुख्य निष्कर्षों में ही बोलें, हर point में प्रतिशत न दोहराएँ।\n\n6] सहानुभूति और स्पष्टता: जहाँ भी रिपोर्ट में चुनौती, बाधा या कठिन समय का जिक्र हो, उसे बहुत ही सहानुभूति और मेंटरशिप वाले लहजे में लिखें - डराएँ नहीं, मार्ग दिखाएँ।\n\n7] उपाय (Remedies): समापन से ठीक पहले, रिपोर्ट में दिए गए सभी कर्मिक और व्यवहारगत उपायों को स्पष्ट रूप से और क्रम से समझाएँ। रिपोर्ट में जो निष्कर्ष या उपाय नहीं है, वह अपनी ओर से न जोड़ें और न गढ़ें।\n\n8] समापन: स्क्रिप्ट का अंत बिल्कुल इन शब्दों से होना चाहिए: '[जातक का नाम] जी, यह थी आपकी प्रश्न कुंडली रिपोर्ट की संपूर्ण ऑडियो समरी। संजीवनी ज्योतिष संस्थान पर आपके विश्वास के लिए हृदय से धन्यवाद।'\n\n9] TTS के अनुकूल प्रारूप: स्क्रिप्ट में किसी भी तरह के बुलेट पॉइंट, कोष्ठक (ब्रैकेट), तारांकन (*), हैशटैग (#), क्रमांक या इमोजी का प्रयोग न करें। किसी शब्द के साथ ब्रैकेट में उसका दूसरा रूप या अर्थ न लिखें, जैसे बुध (Mercury) - हर शब्द सिर्फ एक ही रूप में लिखें। सिर्फ स्पष्ट पैराग्राफ में लिखें, ताकि TTS सॉफ्टवेयर इसे बिना अटके, प्राकृतिक मानवीय आवाज़ में पढ़ सके।\n\nअब इस रिपोर्ट के आधार पर स्क्रिप्ट तैयार करें।"}, "full": {"label": "संपूर्ण कुंडली (Full Kundali)", "text": "नीचे एक विस्तृत संपूर्ण कुंडली (Full Kundali) रिपोर्ट दी गई है, जिसमें पंचांग, लग्न, सभी ग्रहों और भावों, योग-दोष, जीवन के सभी मुख्य क्षेत्रों और भविष्य के विश्लेषण के साथ जातक द्वारा स्वयं पूछे गए प्रश्नों के उत्तर भी शामिल हैं। आपको इस पूरी रिपोर्ट के आधार पर एक 'टेक्स्ट-टू-स्पीच' (TTS) ऑडियो स्क्रिप्ट तैयार करनी है।\n\nजातक का नाम: [यहाँ जातक का नाम भरें]\n\nजातक के स्वयं के प्रश्न (यहाँ क्रम से भरें; उत्तर रिपोर्ट में दिए गए हैं):\n[प्रश्न 1]\n[प्रश्न 2]\n[प्रश्न 3]\n[प्रश्न 4]\n[प्रश्न 5]\n\nरिपोर्ट की संरचना (स्क्रिप्ट का क्रम यही रहेगा):\nभाग ख - कुंडली का आधार: पंचांग विश्लेषण; लग्न और लग्नेश; चंद्र राशि और चंद्र।\nभाग ग - ग्रह और भाव: सभी 9 ग्रहों का विस्तृत विश्लेषण; सभी 12 भावों का विस्तृत विश्लेषण।\nभाग घ - योग और दोष: महत्वपूर्ण शुभ योग; महत्वपूर्ण अशुभ दोष; मंगल दोष का विस्तृत विश्लेषण।\nभाग ङ - जीवन के मुख्य क्षेत्र: स्वभाव और व्यक्तित्व; गुण और विशेषताएँ; कमजोरियाँ; रुचियाँ और शौक; जीवन संघर्ष; भाग्य; स्वास्थ्य; वैवाहिक जीवन; जीवनसाथी का स्वभाव; प्रेम संबंध; पारिवारिक जीवन; संतान सुख; भौतिक सुख-सुविधाएँ; यात्रा और निवास; आध्यात्मिक झुकाव; करियर और व्यवसाय; धन और आर्थिक स्थिति; शिक्षा।\nभाग च - विशेष विश्लेषण: अंकशास्त्र (Numerology); व्यक्तिगत अनुकूलता; चलित कुंडली के मुख्य बदलाव; PN, PB और MB; नवतारा चक्र; सभी 20 वर्ग चार्टों (Shodashvarga) का संक्षिप्त विश्लेषण; कुंडली के सकारात्मक और नकारात्मक बिंदु।\nभाग छ - भविष्य और सलाह: संपूर्ण कुंडली का संक्षिप्त सारांश; सबसे महत्वपूर्ण सलाह; आने वाले 20 वर्षों की भविष्यवाणी; अगले 50 वर्षों की विंशोत्तरी दशा का संक्षिप्त विश्लेषण।\n\nस्क्रिप्ट के लिए निर्देश (सख्ती से पालन करें):\n\n1] भाषा: स्क्रिप्ट की भाषा सरल Hinglish हो, जैसी आज की पीढ़ी बोलती और समझती है। स्क्रिप्ट का tone पूरी तरह बोलचाल वाला रखें - शुद्ध या संस्कृतनिष्ठ भारी हिंदी के शब्द न वापरें, रोज़मर्रा की बातचीत वाली Hinglish ही रखें। इंग्लिश मिक्स शब्द चाहिए - जैसे व्यवसाय का बिजनेस, ऐसे ही दो करके दें। पूरी स्क्रिप्ट देवनागरी लिपि में ही लिखें; अंग्रेजी के शब्द भी देवनागरी में ही लिखें, जैसे 'पर्सनलाइज़्ड', 'प्रैक्टिकल', 'सपोर्टिव'। ऊपर सूची में दिए गए प्रश्न या भाग अंग्रेजी में हैं; स्क्रिप्ट में इन्हें अंग्रेजी में ज्यों के त्यों न पढ़कर सरल Hinglish में अपने शब्दों में प्रस्तुत करें।\n\nध्यान रहे: Narrator एक फीमेल एस्ट्रोलॉजर है।\n\n2] शुरुआत: स्क्रिप्ट की शुरुआत बिल्कुल इन शब्दों से होनी चाहिए: 'नमस्कार, संजीवनी ज्योतिष संस्थान में आपका स्वागत है। [जातक का नाम] जी, यह आपकी पर्सनलाइज़्ड संपूर्ण कुंडली रिपोर्ट की ऑडियो समरी है।'\n\n3] लंबाई: यह स्क्रिप्ट लगभग 20 मिनट के ऑडियो के लिए है।\n\n4] संरचना और क्रम: स्क्रिप्ट इसी क्रम में चले -\n(क) सबसे पहले जातक द्वारा स्वयं पूछे गए प्रश्नों के उत्तर - प्रति प्रश्न लगभग 225 से 250 शब्द; हर प्रश्न का निष्कर्ष गहराई से समझाएँ।\n(ख) फिर भाग ख - व्यक्तित्व का सार: पंचांग, लग्न-लग्नेश और चंद्र राशि से मिलने वाला जातक का मूल स्वभाव, कुल लगभग 375 शब्द।\n(ग) फिर भाग ग - 9 ग्रहों और 12 भावों में से सिर्फ सबसे महत्वपूर्ण निष्कर्ष, कुल लगभग 625 शब्द; हर ग्रह या भाव पर एक-दो वाक्य से अधिक नहीं।\n(घ) फिर भाग घ - शुभ योग, अशुभ दोष और मंगल दोष का सार, कुल लगभग 300 शब्द।\n(ङ) फिर भाग ङ - जीवन के मुख्य क्षेत्रों का सार, कुल लगभग 875 शब्द; हर क्षेत्र पर लगभग 90 शब्द, सिर्फ अंतिम फल।\n(च) फिर भाग च - विशेष विश्लेषणों का संक्षिप्त सार, कुल लगभग 250 शब्द।\n(छ) फिर भाग छ - आने वाले 20 वर्षों का सार, दशा की दिशा और सबसे महत्वपूर्ण सलाह, कुल लगभग 300 शब्द।\n(ज) अंत में उपाय (नीचे point 7 देखें) और फिर समापन पंक्ति।\nसभी भागों को एक कहानी और संवाद (Conversational) के लहजे में जोड़ें, बीच-बीच में स्वाभाविक संक्रमण वाक्य रखें, ताकि client को लगे कि कोई उन्हें सामने बैठाकर रिपोर्ट समझा रहा है। ध्यान रहे, अलग-अलग भागों में एक ही निष्कर्ष बार-बार न दोहराया जाए; जहाँ बात पहले आ चुकी हो, वहाँ संक्षेप में संदर्भ देकर आगे बढ़ें।\n\n5] तकनीकी शब्दावली से बचें: कुंडली के तकनीकी विवरण (ग्रहों की डिग्रियाँ, वर्ग चार्टों के नाम, मृत्यु भाग जैसे शब्द) सीधे न पढ़ें; उनके पीछे का अर्थ और अंतिम फलादेश सरल भाषा में समझाएँ। प्रतिशत (जैसे सफलता की संभावना) सिर्फ मुख्य निष्कर्षों में ही बोलें, हर point में प्रतिशत न दोहराएँ।\n\n6] सहानुभूति और स्पष्टता: जहाँ भी रिपोर्ट में चुनौती, बाधा या कठिन समय का जिक्र हो, उसे बहुत ही सहानुभूति और मेंटरशिप वाले लहजे में लिखें - डराएँ नहीं, मार्ग दिखाएँ।\n\n7] उपाय (Remedies): समापन से ठीक पहले, रिपोर्ट में दिए गए सभी कर्मिक और व्यवहारगत उपायों को स्पष्ट रूप से और क्रम स ग घ - रिपोर्ट के 20 प्रश्न:\n1] What is the career choice and probable fields according to the person's birth chart, a detailed analysis of the possibilities of job versus business?\n2] What are the person's natural talents, skills and abilities (Strengths) that will help in the career?\n3] What weaknesses or negative aspects (Weaknesses) may the person have in the career, which need attention?\n4] What impact will education and skill development have on the person's career, and in which fields will study be beneficial? (उप-प्रश्न: Will the person be able to successfully use their education and knowledge in their career? In which field can their real expertise lie?)\n5] For the person, will doing a job/service (Job/Service) be more suitable, or starting one's own business (Business)?\n6] If the native does a job, are there strong indications of a government job (Government Job) in the kundali? What is its percentage probability?\n7] If business, which type of business or industry is most favourable for the person?\n8] When is advancement, promotion and progress (Growth and Promotion) likely in the career, and which factors will be responsible for it?\n9] How will financial gain, sources of income and financial stability be through the career? How are the wealth-related yogas? (उप-प्रश्न: What is the person's actual capacity for wealth accumulation, and will the sources of income be ethical?)\n10] Are there any indications of financial challenges or losses in the career? If yes, when and how?\n11] How are the indications for job satisfaction (Job Satisfaction)? With what aspects will the person remain satisfied in their work, or due to what causes may dissatisfaction arise?\n12] How will relations with colleagues, seniors and subordinates (Colleagues, Bosses, Subordinates) be at the workplace? Are there any indications of conflict or cooperation? (उप-प्रश्न: What are the hidden obstacles coming in the job? Will enmity or health-related problems at the workplace affect the career?)\n13] Are there indications of travel (Travel) or relocation (Relocation) in connection with the career? If yes, in which direction or to which place will going be favourable?\n14] What major challenges, obstacles or difficult times (Challenges and Obstacles) may come in the career, and how to face them?\n15] When may important events (like first job, job change, major promotion, start/change of business) occur in the career?\n16] How are the current planetary periods (Planetary Periods/Dashas) and transits (Transits) affecting the person's career, and what will be their influence in the future?\n17] How are the indications for success, honour and reputation (Success, Honor, Reputation) in the career? Will fame be gained in any specific field? (उप-प्रश्न: Will the person get real credit, awards and honour for their work, or only position and responsibility?)\n18] Will the person be able to achieve life's great goals and ambitions (Goals and Ambitions) through the career?\n19] How are the indications for attaining the highest position (Peak Position) and authority (Authority) in the career? Will the native be able to become a leader or a high officer in their field?\n20] What astrological remedies, gems or puja-path can be suggested for any special problem or obstacle related to the career?\n\nस्क्रिप्ट के लिए निर्देश (सख्ती से पालन करें):\n\n1] भाषा: स्क्रिप्ट की भाषा सरल Hinglish हो, जैसी आज की पीढ़ी बोलती और समझती है। स्क्रिप्ट का tone पूरी तरह बोलचाल वाला रखें - शुद्ध या संस्कृतनिष्ठ भारी हिंदी के शब्द न वापरें, रोज़मर्रा की बातचीत वाली Hinglish ही रखें। इंग्लिश मिक्स शब्द चाहिए - जैसे व्यवसाय का बिजनेस, ऐसे ही दो करके दें। पूरी स्क्रिप्ट देवनागरी लिपि में ही लिखें; अंग्रेजी के शब्द भी देवनागरी में ही लिखें, जैसे 'पर्सनलाइज़्ड', 'करियर', 'प्रैक्टिकल', 'सपोर्टिव'। ऊपर सूची में दिए गए प्रश्न अंग्रेजी में हैं; स्क्रिप्ट में इन्हें अंग्रेजी में ज्यों के त्यों न पढ़कर सरल Hinglish में अपने शब्दों में प्रस्तुत करें।\n\nध्यान रहे: Narrator एक फीमेल एस्ट्रोलॉजर है।\n\n2] शुरुआत: स्क्रिप्ट की शुरुआत बिल्कुल इन शब्दों से होनी चाहिए: 'नमस्कार, संजीवनी ज्योतिष संस्थान में आपका स्वागत है। [जातक का नाम] जी, यह आपकी पर्सनलाइज़्ड करियर रिपोर्ट की ऑडियो समरी है।'\n\n3] लंबाई: यह स्क्रिप्ट लगभग 20 मिनट के ऑडियो के लिए है।\n\n4] संरचना और क्रम: स्क्रिप्ट इसी क्रम में चले -\n(क) सबसे पहले जातक द्वारा स्वयं पूछे गए प्रश्नों के उत्तर - यह भाग सबसे विस्तार से हो, प्रति प्रश्न लगभग 225 से 250 शब्द; हर प्रश्न का निष्कर्ष गहराई से समझाएँ, एक-दो पंक्तियों में न निपटाएँ।\n(ख) फिर भाग ख के Part 1 से Part 5 तक की संक्षिप्त समरी - हर Part पर लगभग 125 शब्द, सिर्फ मुख्य निष्कर्ष।\n(ग) फिर भाग ग के Point A से E तक की संक्षिप्त समरी - हर Point पर लगभग 90 शब्द।\n(घ) फिर भाग घ के 20 प्रश्नों के उत्तर एक-एक करके, उसी क्रम में - हर प्रश्न पर लगभग 60 से 75 शब्द, मुख्य निष्कर्ष और उसका कारण; जिन प्रश्नों के साथ उप-प्रश्न दिया है, उसका उत्तर भी उसी प्रश्न के साथ दें।\n(ङ) अंत में उपाय (नीचे point 7 देखें) और फिर समापन पंक्ति।\nसभी भागों को एक कहानी और संवाद (Conversational) के लहजे में जोड़ें, बीच-बीच में स्वाभाविक संक्रमण वाक्य रखें, ताकि client को लगे कि कोई उन्हें सामने बैठाकर रिपोर्ट समझा रहा है। ध्यान रहे, Part वाली समरी और प्रश्नों वाले भाग में एक ही निष्कर्ष बार-बार न दोहराया जाए; जहाँ बात पहले आ चुकी हो, वहाँ संक्षेप में संदर्भ देकर आगे बढ़ें।\n\n5] तकनीकी शब्दावली से बचें: कुंडली के तकनीकी विवरण (ग्रहों की डिग्रियाँ, वर्ग चार्टों के नाम, मृत्यु भाग जैसे शब्द) सीधे न पढ़ें; उनके पीछे का अर्थ और अंतिम फलादेश सरल भाषा में समझाएँ। प्रतिशत (जैसे सफलता की संभावना) सिर्फ मुख्य निष्कर्षों में ही बोलें, हर point में प्रतिशत न दोहराएँ।\n\n6] सहानुभूति और स्पष्टता: जहाँ भी करियर में चुनौती या बाधा का जिक्र हो, उसे बहुत ही सहानुभूति और मेंटरशिप वाले लहजे में लिखें - डराएँ नहीं, मार्ग दिखाएँ।\n\n7] उपाय (Remedies): समापन से ठीक पहले, रिपोर्ट में दिए गए सभी कर्मिक और व्यवहारगत उपायों को स्पष्ट रूप से और क्रम से समझाएँ (प्रश्न 20 के उत्तर को भी यहीं समेटें)। रिपोर्ट में जो निष्कर्ष या उपाय नहीं है, वह अपनी ओर से न जोड़ें और न गढ़ें।\n\n8] समापन: स्क्रिप्ट क  के 16 प्रश्न:\n1] According to the child's birth chart, how is his overall level of studies and academic capacity, will he successfully reach higher education?\n2] What natural talents, interests and abilities (Strengths) are there in the child which will be helpful in studies, and in which subjects is his natural grip the strongest?\n3] What weaknesses or negative aspects (Weaknesses) can there be in the child's studies - like distraction of attention, laziness, lack of memory or disinterest in a subject - which need attention?\n4] How is the level of the child's memory power, understanding and intellect? Is he sharp in learning by rote or in learning by understanding? What is his Learning Style? (उप-प्रश्न: Will the child's intellect become sharper with age, or will the initial sharpness slow down later?)\n5] After 10th, which Stream (Science, Commerce or Arts) will be the most suitable for the child and why? Also give the probability of success in each Stream in percentage.\n6] Which are the most suitable Subjects for the child? How should the main subjects, elective subject and language be chosen? (उप-प्रश्न: From which subjects should the child be kept away, where his weakness is clear?)\n7] How will the child's performance be in Board exams (10th and 12th)? In which Board year will the result be the best and in which will special caution have to be kept?\n8] Are there strong yogas of success in competitive exams (JEE, NEET, Olympiad, UPSC etc.) in the kundali? What is its probability in percentage and which type of competitive exam will be the most favourable?\n9] How much will the child's higher education be and in which direction - general graduation, Professional Course (Engineering/Medical/Law etc.), or up to Research? What will be the final level of education?\n10] Are there yogas of studying abroad in the kundali? If yes, then at which age or which stage and in which direction will it be favourable to go?\n11] Are there yogas of obstruction in studies, नी ज्योतिष संस्थान में आपका स्वागत है। [जातक का नाम] जी, यह आपकी पर्सनलाइज़्ड शिक्षा रिपोर्ट की ऑडियो समरी है।'\n\n3] लंबाई: यह स्क्रिप्ट लगभग 20 मिनट के ऑडियो के लिए है।\n\n4] संरचना और क्रम: स्क्रिप्ट इसी क्रम में चले -\n(क) सबसे पहले जातक द्वारा स्वयं पूछे गए प्रश्नों के उत्तर - यह भाग सबसे विस्तार से हो, प्रति प्रश्न लगभग 225 से 250 शब्द; हर प्रश्न का निष्कर्ष गहराई से समझाएँ, एक-दो पंक्तियों में न निपटाएँ।\n(ख) फिर भाग ख के Part 1 से Part 5 तक की संक्षिप्त समरी - हर Part पर लगभग 125 शब्द, सिर्फ मुख्य निष्कर्ष।\n(ग) फिर भाग ग के Point A से E तक की संक्षिप्त समरी - हर Point पर लगभग 90 शब्द।\n(घ) फिर भाग घ के 16 प्रश्नों के उत्तर एक-एक करके, उसी क्रम में - हर प्रश्न पर लगभग 60 से 75 शब्द, मुख्य निष्कर्ष और उसका कारण; जिन प्रश्नों के साथ उप-प्रश्न दिया है, उसका उत्तर भी उसी प्रश्न के साथ दें।\n(ङ) अंत में उपाय (नीचे point 7 देखें) और फिर समापन पंक्ति।\nसभी भागों को एक कहानी और संवाद (Conversational) के लहजे में जोड़ें, बीच-बीच में स्वाभाविक संक्रमण वाक्य रखें, ताकि client को लगे कि कोई उन्हें सामने बैठाकर रिपोर्ट समझा रहा है। ध्यान रहे, Part वाली समरी और प्रश्नों वाले भाग में एक ही निष्कर्ष बार-बार न दोहराया जाए; जहाँ बात पहले आ चुकी हो, वहाँ संक्षेप में संदर्भ देकर आगे बढ़ें।\n\n5] तकनीकी शब्दावली से बचें: कुंडली के तकनीकी विवरण (ग्रहों की डिग्रियाँ, वर्ग चार्टों के नाम, मृत्यु भाग जैसे शब्द) सीधे न पढ़ें; उनके पीछे का अर्थ और अंतिम फलादेश सरल भाषा में समझाएँ। प्रतिशत (जैसे सफलता की संभावना) सिर्फ मुख्य निष्कर्षों में ही बोलें, हर point में प्रतिशत न दोहराएँ।\n\n6] सहानुभूति और स्पष्टता: जहाँ भी शिक्षा में चुनौती, बाधा या कमजोरी का जिक्र हो, उसे बहुत ही सहानुभूति और मेंटरशिप वाले लहजे में लिखें - डराएँ नहीं, मार्ग दिखाएँ।\n\n7] उपाय (Remedies): समापन से ठीक पहले, रिपोर्ट में दिए गए सभी कर्मिक और व्यवहारगत उपायों को स्पष्ट रूप से और क्रम से समझाएँ (प्रश्न 16 के उत्तर को भी यहीं समेटें)। रिपोर्ट में जो निष्कर्ष या उपाय नहीं है, वह अपनी ओर से न जोड़ें और न गढ़ें।\n\n8] समापन: स्क्रिप्ट का अंत बिल्कुल इन शब्दों से होना चाहिए: '[जातक का नाम] जी, यह थी आपकी शिक्षा रिपोर्ट की संपूर्ण ऑडियो समरी। संजीवनी ज्योतिष संस्थान पर आपके विश्वास के लिए हृदय से धन्यवाद।'\n\n9] TTS के अनुकूल प्रारूप: स्क्रिप्ट में किसी भी तरह के बुलेट पॉइंट, कोष्ठक (ब्रैकेट), तारांकन (*), हैशटैग (#), क्रमांक या इमोजी का प्रयोग न करें। किसी शब्द के साथ ब्रैकेट में उसका दूसरा रूप या अर्थ न लिखें, जैसे बुध (Mercury) - हर शब्द सिर्फ एक ही रूप में लिखें। सिर्फ स्पष्ट पैराग्राफ में लिखें, ताकि TTS सॉफ्टवेयर इसे बिना अटके, प्राकृतिक मानवीय आवाज़ में पढ़ सके।\n\nअब इस रिपोर्ट के आधार पर स्क्रिप्ट तैयार करें।\n"}, "mr": {"label": "मैरिज रिपोर्ट (Marriage Report)", "text": "नीचे एक विस्तृत मैरिज (Marriage) रिपोर्ट दी गई है, जिसमें जीवनसाथी के स्वभाव, विवाह के समय, वैवाहिक जीवन और विवाह से जुड़े सभी पहलुओं का चारों पद्धतियों (पराशरी, जैमिनी, भृगु नंदी नाड़ी और केपी) के आधार पर विश्लेषण, 23 प्रश्नों के उत्तर और जातक द्वारा स्वयं पूछे गए प्रश्नों के उत्तर शामिल हैं। आपको इस पूरी रिपोर्ट के आधार पर एक 'टेक्स्ट-टू-स्पीच' (TTS) ऑडियो स्क्रिप्ट तैयार करनी है।\n\nजातक का नाम: [यहाँ जातक का नाम भरें]\n\nजातक के स्वयं के प्रश्न (यहाँ क्रम से भरें; उत्तर रिपोर्ट में दिए गए हैं):\n[प्रश्न 1]\n[प्रश्न 2]\n[प्रश्न 3]\n[प्रश्न 4]\n[प्रश्न 5]\n\nभाग ख - रिपोर्ट के 23 प्रश्न:\n1] Detailed analysis of the prospective wife's nature?\n2] What will be the spouse's morale, mindset, and inner nature?\n3] Will the spouse be loyal?\n4] What could be some weaknesses or negative traits of the spouse?\n5] Detailed analysis of the probable timing of marriage?\n6] Where and how is the first meeting with the spouse likely to happen? (उप-प्रश्न: Through which medium or which relative could the meeting with the spouse take place?)\n7] Detailed analysis of the spouse's physical indicators? (उप-प्रश्न: Complexion Appearance Height Build Marks/moles on or around the face (probability percentage))\n8] The spouse's interests/hobbies?\n9] What will the spouse's career or job be like?\n10] What will the spouse's physical health and strength be like?\n11] Analysis of married life? (उप-प्रश्न: The mental depth a logy\nPart 3: Analysis of Progeny according to Bhrigu Nandi Nadi (BNN)\nPart 4: Analysis of Progeny according to Krishnamurti Paddhati (KP)\nD60 (Shashtiamsha) - Past Life Merit (Poorva Punya) and Final Outcome (Karmic Legacy)\nPart 5: Conclusion and Overall Overview\nभाग ग - संतान समय विश्लेषण:\nPart 1: Analysis of the timing of childbirth according to Parashari Astrology\nPart 2: Analysis of the timing of childbirth according to Jaimini Astrology\nPart 3: Analysis of the timing of childbirth according to Bhrigu Nandi Nadi (BNN)\nPart 4: Analysis of the timing of childbirth according to Krishnamurti Paddhati (KP)\nविशेष प्रश्न: If childbirth does not happen in this period, what is the next probable period and what are the percentage (%) chances?\nPart 5: Conclusion and Overall Overview\nभाग घ - रिपोर्ट के 15 प्रश्न:\n1] According to my kundali, how many children in total am I likely to have? What would be their probable order (e.g. first son or daughter, and then)?\n2] Does my kundali have a clear promise of having children (Promise of Progeny)? If yes, will it happen easily or after some obstacles?\n3] Is there any possibility of delay in having children or medical challenges?\n4] Which is the most suitable and probable time period for having children (Most Favorable Time Period)?\n5] What will be the general nature, personality and health of my children?\n6] Will my children prove lucky for me? After their birth, will there be positive changes in my life (like increase in career or wealth)?\n7] What will be the mutual relationship (Parent-Child Relationship) between me and my children? Will it be loving and supportive or stressful?\n8] What will be the education and career prospects of my children? Will they be successful in their lives?\n9] Does the kundali show any indication of having children through alternative methods like IVF (artificial insemination) or adoption (Adoption)?\n10] Are there any yogas of worry regarding children, like regarding their health function cleanQuestions(raw){
  return raw.split('\n').map(function(s){ return s.trim(); })
    .filter(function(s){ return s.length > 0; })
    .map(function(s){ return s.replace(/^(\d+\s*[\]\)\.\-]|\-|\•)\s*/, '').trim(); })
    .filter(function(s){ return s.length > 0; });
}

रोग्यसंबंधी समस्या करियरवर परिणाम करतील का?)", "करियरच्या संदर्भात प्रवास (Travel) किंवा स्थान बदल (Relocation) चे योग आहेत का? असल्यास, कोणत्या दिशेला किंवा ठिकाणी जाणे अनुकूल राहील?", "करियरमध्ये कोणती प्रमुख आव्हाने, अडथळे किंवा कठीण काळ (Challenges and Obstacles) येऊ शकतात आणि त्यांचा सामना कसा करावा?", "करियरमध्ये महत्त्वाच्या घटना (जसे पहिली नोकरी, नोकरी बदलणे, मोठे प्रमोशन, व्यवसायाची सुरुवात/बदल) कधी घडू शकतात?", "सध्याच्या ग्रह दशा (Planetary Periods/Dashas) आणि गोचर (Transits) व्यक्तीच्या करियरवर कसा परिणाम करत आहेत आणि भविष्यात त्यांचा काय परिणाम होईल?", "करियरमध्ये यश, मान-सन्मान आणि प्रतिष्ठा (Success, Honor, Reputation) चे योग कसे आहेत? कोणत्याही विशिष्ट क्षेत्रात प्रसिद्धी मिळेल का? (उप-प्रश्न: व्यक्तीला आपल्या कामासाठी खरे श्रेय, पुरस्कार आणि सन्मान मिळेल, की फक्त पद आणि जबाबदारीच मिळेल?)", "करियरच्या माध्यमातून व्यक्ती आपल्या आयुष्यातील मोठे उद्दिष्टे आणि महत्त्वाकांक्षा (Goals and Ambitions) साध्य करू शकेल का?", "करियरमध्ये सर्वोच्च पद (Peak Position) आणि अधिकार (Authority) प्राप्तीचे योग कसे आहेत? जातक आपल्या क्षेत्रात लीडर किंवा उच्च अधिकारी बनू शकेल का?", "करियरसंबंधी कोणत्याही विशेष समस्येसाठी किंवा अडथळ्यासाठी कोणते ज्योतिषीय उपाय, रत्न किंवा पूजा पाठ सुचवता येतील?"]}, "education": {"anchor": "भाग घ - रिपोर्ट के 16 प्रश्न:", "en": ["According to the child's birth chart, how is his overall level of studies and academic capacity, will he successfully reach higher education?", "What natural talents, interests and abilities (Strengths) are there in the child which will be helpful in studies, and in which subjects is his natural grip the strongest?", "What weaknesses or negative aspects (Weaknesses) can there be in the child's studies - like distraction of attention, laziness, lack of memory or disinterest in a subject - which need attention?", "How is the level of the child's memory power, understanding and intellect? Is he sharp in learning by rote or in learning by understanding? What is his Learning Style? (उप-प्रश्न: Will the child's intellect become sharper with age, or will the initial sharpness slow down later?)", "After 10th, which Stream (Science, Commerce or Arts) will be the most suitable for the child and why? Also give the probability of success in each Stream in percentage.", "Which are the most suitable Subjects for the child? How should the main subjects, elective subject and language be chosen? (उप-प्रश्न: From which subjects should the child be kept away, where his weakness is clear?)", "How will the child's performance be in Board exams (10th and 12th)? In which Board year will the result be the best and in which will special caution have to be kept?", "Are there strong yogas of success in competitive exams (JEE, NEET, Olympiad, UPSC etc.) in the kundali? What is its probability in percentage and which type of competitive exam will be the most favourable?", "How much will the child's higher education be and in which direction - general graduation, Professional Course (Engineering/Medical/Law etc.), or up to Research? What will be the final level of education?", "Are there yogas of studying abroad in the kundali? If yes, then at which age or which stage and in which direction will it be favourable to go?", "Are there yogas of obstruction in studies, a year going bad (Drop) or changing the Stream? If yes, then at which age or which stage and what will be its reason?", "According to the dasha, which are the good and difficult times of the child's studies? According to age (5-10, 10-15, 15-18, 18-25 years) tell in which phase studies will be the strongest and in which phase special attention will have to be given.", "Apart from studies, in which field of sports, art, music, technique or other does the child have a special talent? Should that field be taken seriously forward along with education?", "Growing up, what will be the direction of the child's career? Which are the 2-3 strongest career fields? Towards which career field will it be most beneficial to turn his education, so that today's Stream and subject selection can be done accordingly?", "Guidance for the parents: How should the child's study habits be made, how much pressure on him is appropriate, how should the study environment (home or Hostel, morning or night) be kept and which things should be avoided?", "Which astrological remedies, gemstones or poojas can be suggested for success in the child's education, concentration and intellect? Which gemstones should the child not be made to wear at all?"], "hindi": ["बच्चे की जन्मकुंडली के अनुसार उसकी पढ़ाई का समग्र स्तर और शैक्षणिक क्षमता कैसी है, क्या वह उच्च शिक्षा तक सफलतापूर्वक पहुँचेगा?", "बच्चे के अंदर कौन सी स्वाभाविक प्रतिभाएं, रुचियाँ और क्षमताएं (Strengths) हैं जो पढ़ाई में सहायक होंगी, और किन विषयों में उसकी प्राकृतिक पकड़ सबसे मजबूत है?", "बच्चे की पढ़ाई में क्या कमजोरियाँ या नकारात्मक पहलू (Weaknesses) हो सकते हैं - जैसे ध्यान भटकना, आलस्य, स्मरण की कमी या किसी विषय से अरुचि - जिन पर ध्यान देने की आवश्यकता है?", "बच्चे की स्मरण शक्ति, समझ और बुद्धि का स्तर कैसा है? वह रटकर सीखने में तेज है या समझकर सीखने में? उसकी सीखने की शैली (Learning Style) क्या है? (उप-प्रश्न: क्या बच्चे की बुद्धि उम्र के साथ और तेज होगी, या शुरुआती तेज़ी बाद में धीमी पड़ेगी?)", "10वीं के बाद बच्चे के लिए कौन सी Stream (Science, Commerce या Arts) सबसे उपयुक्त रहेगी और क्यों? प्रत्येक Stream में सफलता की संभावना प्रतिशत में भी बताइए।", "बच्चे के लिए सबसे उपयुक्त विषय (Subjects) कौन से हैं? मुख्य विषयों, वैकल्पिक विषय (Elective) और भाषा का चयन कैसे करना चाहिए? (उप-प्रश्न: किन विषयों से बच्चे को दूर रखना चाहिए, जहाँ उसकी कमजोरी स्पष्ट है?)", "Board परीक्षाओं (10वीं और 12वीं) में बच्चे का प्रदर्शन कैसा रहेगा? किस Board वर्ष में परिणाम सबसे अच्छा रहेगा और किसमें विशेष सावधानी रखनी होगी?", "क्या कुंडली में प्रतियोगी परीक्षाओं (JEE, NEET, Olympiad, UPSC आदि) में सफलता के प्रबल योग हैं? इसकी संभावना कितने प्रतिशत है और किस प्रकार की प्रतियोगी परीक्षा सबसे अनुकूल रहेगी?", "बच्चे की उच्च शिक्षा कितनी होगी और किस दिशा में होगी - सामान्य स्नातक, Professional Course (Engineering/Medical/Law आदि), या Research तक? शिक्षा का अंतिम स्तर क्या रहेगा?", "क्या कुंडली में विदेश में पढ़ाई के योग हैं? यदि हाँ, तो किस उम्र या किस चरण में और किस दिशा में जाना अनुकूल रहेगा?", "क्या पढ़ाई में रुकावट, वर्ष खराब होने (Drop) या Stream बदलने के योग हैं? यदि हाँ, तो किस उम्र या किस चरण में और उसका कारण क्या होगा?", "दशा के अनुसार बच्चे की पढ़ाई के अच्छे और कठिन समय कौन से हैं? उम्र के हिसाब से (5-10, 10-15, 15-18, 18-25 वर्ष) बताइए कि किस चरण में पढ़ाई सबसे मजबूत रहेगी और किस चरण में विशेष ध्यान देना होगा।", "पढ़ाई के अलावा बच्चे में खेल, कला, संगीत, तकनीक या अन्य किस क्षेत्र की विशेष प्रतिभा है? क्या उस क्षेत्र को शिक्षा के साथ गंभीरता से आगे बढ़ाना चाहिए?", "बड़े होकर बच्चे के करियर की दिशा क्या रहेगी? कौन से 2-3 करियर क्षेत्र सबसे प्रबल हैं? उसकी शिक्षा को किस करियर क्षेत्र की ओर मोड़ना सबसे लाभकारी होगा, ताकि आज की Stream और विषय का चयन उसी के अनुसार हो सके?", "माता-पिता के लिए मार्गदर्शन: बच्चे की पढ़ने की आदतें कैसी बनानी चाहिए, उस पर कितना दबाव डालना उचित है, पढ़ाई का माहौल (घर या Hostel, सुबह या रात) कैसा रखना चाहिए और किन बातों से बचना चाहिए?", "बच्चे की शिक्षा में सफलता, एकाग्रता और बुद्धि के लिए कौन से ज्योतिषीय उपाय, रत्न या पूजा सुझाई जा सकती है? कौन से रत्न बच्चे को बिल्कुल नहीं पहनाने चाहिए?"], "marathi": ["मुलाच्या जन्म कुंडलीनुसार त्याचा अभ्यासाचा समग्र स्तर आणि शैक्षणिक क्षमता कशी आहे, तो उच्च शिक्षणापर्यंत यशस्वीरित्या पोहोचेल का?", "मुलात कोणत्या नैसर्गिक प्रतिभा, रुची आणि क्षमता (Strengths) आहेत ज्या अभ्यासात मदत करतील, आणि कोणत्या विषयांमध्ये त्याची नैसर्गिक पकड सर्वात मजबूत आहे?", "मुलाच्या अभ्यासात कोणत्या कमकुवत बाजू किंवा नकारात्मक पैलू (Weaknesses) असू शकतात - जसे ध्यान विचलित होणे, आळस, स्मरणशक्तीची कमतरता किंवा एखाद्या विषयात अनास्था - ज्यांच्याकडे लक्ष दिले पाहिजे?", "मुलाच्या स्मरणशक्ती, समज आणि बुद्धीची पातळी कशी आहे? तो रट्टा मारून शिकण्यात पटाईत आहे की समजून शिकण्यात? त्याची Learning Style काय आहे? (उप-प्रश्न: मुलाची बुद्धी वय वाढते तशी अधिक तीक्ष्ण होईल, की सुरुवातीची तीक्ष्णता नंतर हळू होईल?)", "दहावीनंतर मुलासाठी कोणत function swapList(text, key, lang){
  const q = QLISTS[key];
  if (!q) return text;
  const items = (lang === 'hindi') ? q.hindi : (lang === 'marathi') ? q.marathi : q.en;
  if (!items) return text;
  const listText = items.map(function(s, i){ return (i+1) + '] ' + s; }).join('\n');
  const endMark = '\n\nस्क्रिप्ट के लिए निर्देश';
  const ei = text.indexOf(endMark);
  if (ei < 0) return text;
  if (q.struct){
    const head = 'रिपोर्ट की संरचना (स्क्रिप्ट का क्रम यही रहेगा):';
    const si = text.indexOf(head);
    if (si < 0) return text;
    return text.slice(0, si) + head + '\n' + q.struct + ':\n' + listText + text.slice(ei);
  }
  const ai = text.indexOf(q.anchor);
  if (ai < 0) return text;
  const after = text.indexOf('\n', ai) + 1;
  return text.slice(0, after) + listText + text.slice(ei);
}

function fillQuestions(text, qs){
  const lines = text.split('\n');
  const idx = [];
  lines.forEach(function(l, i){ if (/^\[प्रश्न \d+\]$/.test(l.trim())) idx.push(i); });
  if (!idx.length) return text;
  const replacement = qs.length ? qs.map(function(q, i){ return (i+1) + '] ' + q; })
                                : idx.map(function(_, i){ return '[प्रश्न ' + (i+1) + ']'; });
  const start = idx[0], end = idx[idx.length - 1];
  lines.splice(start, end - start + 1, ...replacement);
  return lines.join('\n');
}

function swapLang(text, lang){
  const lp = LANG_POINTS[lang];
  if (!lp) return text;
  const lines = text.split('\n');
  for (let i = 0; i < lines.length; i++){
    if (lines[i].indexOf('1] भाषा:') === 0){ lines[i] = lp; break; }
  }
  return lines.join('\n');
}

function build(){
  const key = reportSel.value;
  let text = TEMPLATES[key].text;
  const isMilan = key === 'milan';
  nameBlock2.style.display = isMilan ? 'block' : 'none';
  nameLabel1.textContent = isMilan ? 'वर का नाम:' : 'जातक का नाम:';
  const noQ = !!NO_Q[key];
  qBlock.style.display = noQ ? 'none' : 'block';

  const n1 = name1.value.trim(), n2 = name2.value.trim();
  if (isMilan){
    if (n1) text = text.split('[यहाँ वर का नाम भरें]').join(n1).split('[वर का नाम]').join(n1);
    if (n2) text = text.split('[यहाँ वधू का नाम भरें]').join(n2).split('[वधू का नाम]').join(n2);
  } else if (n1){
    text = text.split('[यहाँ जातक का नाम भरें]').join(n1).split('[जातक का नाम]').join(n1);
  }
  if (!noQ) text = fillQuestions(text, cleanQuestions(questionsEl.value));
  if (text.indexOf('{PERQ}') >= 0){
    const qsNow = cleanQuestions(questionsEl.value);
    let qCount = qsNow.length;
    if (!qCount){ const ph = text.match(/\[प्रश्न \d+\]/g); qCount = ph ? ph.length : 6; }
    const perq = Math.round((2700 / qCount) / 5) * 5;
    text = text.split('{PERQ}').join(String(perq));
  }
  text = swapList(text, key, langSel.value);
  text = swapLang(text, langSel.value);
  const rep = reportTextEl.value.trim();
  if (rep){
    text = text.replace(/\n?अब इस रिपोर्ट के आधार पर स्क्रिप्ट तैयार करें।\s*$/, '\n\nरिपोर्ट:\n' + rep + '\n\nअब इस रिपोर्ट के आधार पर स्क्रिप्ट तैयार करें।');
  }
  outEl.value = text;
  metaEl.textContent = 'कुल अक्षर: ' + text.length + ' | अनुमानित शब्द: ' + Math.round(text.split(/\s+/).length);
}

[reportSel, langSel, name1, name2, questionsEl, reportTextEl].forEach(function(el){
  el.addEventListener('input', build);
  el.addEventListener('change', build);
});

copyBtn.addEventListener('click', function(){
  build();
  outEl.removeAttribute('readonly');
  outEl.select();
  outEl.setAttribute('selectionStart', 0);
  let ok = false;
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(outEl.value).then(function(){ done(true); }, function(){ done(legacy()); });
  } else { done(legacy()); }
  function legacy(){ try { return document.execCommand('copy'); } catch(e){ return false; } }
  function done(success){
    outEl.setAttribute('readonly', '');
    const old = '📋 तैयार Prompt Copy करो';
    copyBtn.textContent = success ? '✅ Copy हो गया' : '⚠️ Select हो गया है - अब Copy करो (Ctrl+C)';
    setTimeout(function(){ copyBtn.textContent = old; }, 2200);
  }
});
