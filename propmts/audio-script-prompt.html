<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Audio Script Prompt Tool v1</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: 'Noto Sans Devanagari', 'Mangal', sans-serif; margin: 0; background: #fdf6ec; color: #222; }
  .wrap { max-width: 860px; margin: 0 auto; padding: 14px; }
  h1 { font-size: 21px; color: #8b0000; margin: 6px 0 2px; }
  .sub { font-size: 13px; color: #666; margin-bottom: 12px; }
  label { display: block; font-weight: 700; margin: 12px 0 5px; color: #5b2a86; font-size: 15px; }
  select, input[type=text], textarea { width: 100%; padding: 10px; font-size: 15px; border: 2px solid #d8b36a; border-radius: 8px; background: #fff; font-family: inherit; }
  textarea { resize: vertical; }
  .row { display: flex; gap: 10px; }
  .row > div { flex: 1; }
  #copyBtn { width: 100%; margin-top: 14px; padding: 13px; font-size: 17px; font-weight: 700; background: #1c7c34; color: #fff; border: none; border-radius: 9px; cursor: pointer; }
  #copyBtn:active { background: #145c26; }
  .meta { font-size: 12.5px; color: #777; margin-top: 6px; text-align: right; }
  .note { font-size: 13px; color: #8b5a00; background: #fff3d6; border: 1px solid #e6c877; border-radius: 8px; padding: 8px 10px; margin-top: 8px; display: none; }
  #out { background: #fffdf7; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🎧 Audio Script Prompt Tool v1</h1>
  <div class="sub">रिपोर्ट चुनो, नाम और सवाल भरो - तैयार prompt एक click में copy करो। लंबाई हर template में तय है (मैरिज टाइमिंग 10 मिनट, बाकी 20 मिनट)।</div>

  <label>रिपोर्ट चुनें:</label>
  <select id="reportSel"></select>

  <div class="row">
    <div>
      <label>स्क्रिप्ट की भाषा:</label>
      <select id="langSel">
        <option value="hinglish">Hinglish (डिफ़ॉल्ट)</option>
        <option value="hindi">हिंदी</option>
        <option value="marathi">मराठी</option>
        <option value="english">English</option>
      </select>
    </div>
  </div>

  <div id="nameBlock1">
    <label id="nameLabel1">जातक का नाम:</label>
    <input type="text" id="name1" placeholder="जैसे: समीर">
  </div>
  <div id="nameBlock2" style="display:none">
    <label>वधू का नाम:</label>
    <input type="text" id="name2" placeholder="जैसे: प्रिया">
  </div>

  <div id="qBlock">
    <label>जातक के सवाल (एक line में एक सवाल):</label>
    <textarea id="questions" rows="6" placeholder="हर line में एक सवाल लिखें या paste करें"></textarea>
  </div>
  <div class="note" id="btrNote">इस रिपोर्ट (BTR) में जातक के सवाल नहीं होते, इसलिए सवाल वाला खाना इसमें लागू नहीं है।</div>

  <label>रिपोर्ट यहाँ paste करो (ऐच्छिक):</label>
  <textarea id="reportText" rows="5" placeholder="खाली छोड़ोगे तो सिर्फ prompt copy होगा; भरोगे तो report prompt के अंत में जुड़कर एक साथ copy होगी"></textarea>

  <button id="copyBtn">📋 तैयार Prompt Copy करो</button>
  <div class="meta" id="meta"></div>

  <label>तैयार Prompt:</label>
  <textarea id="out" rows="22" readonly></textarea>
</div>
<script>
const TEMPLATES = {"ques": {"label": "प्रश्न कुंडली (Ques Kundali)", "text": "नीचे एक विस्तृत प्रश्न कुंडली (Prashna Kundali) रिपोर्ट दी गई है, जिसमें जातक द्वारा पूछे गए प्रश्नों का चारों पद्धतियों (पराशरी, जैमिनी, भृगु नंदी नाड़ी और केपी) के आधार पर विस्तृत विश्लेषण और उत्तर शामिल हैं। आपको इस पूरी रिपोर्ट के आधार पर एक 'टेक्स्ट-टू-स्पीच' (TTS) ऑडियो स्क्रिप्ट तैयार करनी है।\n\nजातक का नाम: [यहाँ जातक का नाम भरें]\n\nजातक के स्वयं के प्रश्न (यहाँ क्रम से भरें; उत्तर रिपोर्ट में दिए गए हैं):\n[प्रश्न 1]\n[प्रश्न 2]\n[प्रश्न 3]\n[प्रश्न 4]\n[प्रश्न 5]\n[प्रश्न 6]\n\nरिपोर्ट की संरचना: इस रिपोर्ट में कोई तय प्रश्न सूची नहीं है; रिपोर्ट पूरी तरह जातक के ऊपर भरे गए प्रश्नों पर ही आधारित है। हर प्रश्न का उत्तर रिपोर्ट में चारों पद्धतियों के विश्लेषण के साथ दिया गया है।\n\nस्क्रिप्ट के लिए निर्देश (सख्ती से पालन करें):\n\n1] भाषा: स्क्रिप्ट की भाषा सरल Hinglish हो, जैसी आज की पीढ़ी बोलती और समझती है। स्क्रिप्ट का tone पूरी तरह बोलचाल वाला रखें - शुद्ध या संस्कृतनिष्ठ भारी हिंदी के शब्द न वापरें, रोज़मर्रा की बातचीत वाली Hinglish ही रखें। पूरी स्क्रिप्ट देवनागरी लिपि में ही लिखें; अंग्रेजी के शब्द भी देवनागरी में ही लिखें, जैसे 'पर्सनलाइज़्ड', 'प्रैक्टिकल', 'सपोर्टिव'। ऊपर सूची में दिए गए प्रश्न या भाग अंग्रेजी में हैं; स्क्रिप्ट में इन्हें अंग्रेजी में ज्यों के त्यों न पढ़कर सरल Hinglish में अपने शब्दों में प्रस्तुत करें।\n\n2] शुरुआत: स्क्रिप्ट की शुरुआत बिल्कुल इन शब्दों से होनी चाहिए: 'नमस्कार, संजीवनी ज्योतिष संस्थान में आपका स्वागत है। [जातक का नाम] जी, यह आपकी पर्सनलाइज़्ड प्रश्न कुंडली रिपोर्ट की ऑडियो समरी है।'\n\n3] लंबाई: यह स्क्रिप्ट लगभग 20 मिनट के ऑडियो के लिए है। हर प्रश्न पर लगभग 250 से 300 शब्द रखें; प्रश्नों की संख्या के अनुसार कुल लंबाई उसी अनुपात में रहे, अधिकतम 3200 शब्द। प्रश्न कम हों तो भी खाली विस्तार न करें।\n\n4] संरचना और क्रम: स्क्रिप्ट इसी क्रम में चले -\n(क) सभी प्रश्न ऊपर भरे गए क्रम में ही एक-एक करके लें - हर प्रश्न को पहले सरल शब्दों में प्रस्तुत करें, फिर रिपोर्ट में दिया गया उसका उत्तर और निष्कर्ष गहराई से समझाएँ।\n(ख) सभी प्रश्नों के बाद रिपोर्ट का समग्र निष्कर्ष (Overall Conclusion) संक्षेप में दें।\n(ग) अंत में उपाय (नीचे point 7 देखें) और फिर समापन पंक्ति।\nसभी भागों को एक कहानी और संवाद (Conversational) के लहजे में जोड़ें, बीच-बीच में स्वाभाविक संक्रमण वाक्य रखें, ताकि client को लगे कि कोई उन्हें सामने बैठाकर रिपोर्ट समझा रहा है। ध्यान रहे, अलग-अलग भागों में एक ही निष्कर्ष बार-बार न दोहराया जाए; जहाँ बात पहले आ चुकी हो, वहाँ संक्षेप में संदर्भ देकर आगे बढ़ें।\n\n5] तकनीकी शब्दावली से बचें: कुंडली के तकनीकी विवरण (ग्रहों की डिग्रियाँ, वर्ग चार्टों के नाम, मृत्यु भाग जैसे शब्द) सीधे न पढ़ें; उनके पीछे का अर्थ और अंतिम फलादेश सरल भाषा में समझाएँ। प्रतिशत (जैसे सफलता की संभावना) सिर्फ मुख्य निष्कर्षों में ही बोलें, हर point में प्रतिशत न दोहराएँ।\n\n6] सहानुभूति और स्पष्टता: जहाँ भी रिपोर्ट में चुनौती, बाधा या कठिन समय का जिक्र हो, उसे बहुत ही सहानुभूति और मेंटरशिप वाले लहजे में लिखें - डराएँ नहीं, मार्ग दिखाएँ।\n\n7] उपाय (Remedies): समापन से ठीक पहले, रिपोर्ट में दिए गए सभी कर्मिक और व्यवहारगत उपायों को स्पष्ट रूप से और क्रम से समझाएँ। रिपोर्ट में जो निष्कर्ष या उपाय नहीं है, वह अपनी ओर से न जोड़ें और न गढ़ें।\n\n8] समापन: स्क्रिप्ट का अंत बिल्कुल इन शब्दों से होना चाहिए: '[जातक का नाम] जी, यह थी आपकी प्रश्न कुंडली रिपोर्ट की संपूर्ण ऑडियो समरी। संजीवनी ज्योतिष संस्थान पर आपके विश्वास के लिए हृदय से धन्यवाद।'\n\n9] TTS के अनुकूल प्रारूप: स्क्रिप्ट में किसी भी तरह के बुलेट पॉइंट, कोष्ठक (ब्रैकेट), तारांकन (*), हैशटैग (#), क्रमांक या इमोजी का प्रयोग न करें। किसी शब्द के साथ ब्रैकेट में उसका दूसरा रूप या अर्थ न लिखें, जैसे बुध (Mercury) - हर शब्द सिर्फ एक ही रूप में लिखें। सिर्फ स्पष्ट पैराग्राफ में लिखें, ताकि TTS सॉफ्टवेयर इसे बिना अटके, प्राकृतिक मानवीय आवाज़ में पढ़ सके।\n\nअब इस रिपोर्ट के आधार पर स्क्रिप्ट तैयार करें।"}, "full": {"label": "संपूर्ण कुंडली (Full Kundali)", "text": "नीचे एक विस्तृत संपूर्ण कुंडली (Full Kundali) रिपोर्ट दी गई है, जिसमें पंचांग, लग्न, सभी ग्रहों और भावों, योग-दोष, जीवन के सभी मुख्य क्षेत्रों और भविष्य के विश्लेषण के साथ जातक द्वारा स्वयं पूछे गए प्रश्नों के उत्तर al career choice and probable field? A detailed analysis of Job vs. Business prospects?\n2] What are the Native's natural talents, skills, and Strengths that will be helpful in their career?\n3] What could be the weaknesses or negative traits (Weaknesses) in the Native's career that require attention?\n4] What impact will education and skill development have on the career, and in which fields will studies be beneficial? (उप-प्रश्न: Will the Native be able to successfully utilize their education and knowledge in their career? In which field can their actual expertise lie?)\n5] Will it be more suitable for the Native to pursue a Job/Service or start their own Business?\n6] If the Native pursues a job, are there strong yogas for a Government Job in the Kundali? What is the percentage of its probability?\n7] If business is indicated, what type of business or industry is most favorable for the Native?\n8] When are Growth and Promotion probable in the career, and which factors will be responsible for it?\n9] How will be the financial gains, sources of income, and financial stability from the career? How are the wealth-related yogas? (उप-प्रश्न: What is the Native's actual wealth accumulation capacity, and will the sources of income be ethical?)\n10] Are there yogas for any financial challenges or losses in the career? If yes, when and how?\n11] How are the yogas for Job Satisfaction? What factors will keep the Native satisfied at work, or what could be the reasons for dissatisfaction?\n12] How will relationships be with Colleagues, Bosses, and Subordinates at the workplace? Are there yogas for conflict or cooperation? (उप-प्रश्न: What are the hidden obstacles in the job? Will workplace enmity or health issues affect the career?)\n13] Are there yogas for Travel or Relocation related to the career? If yes, which direction or location will be favorable?\n14] What major Challenges and Obstacles or tough times can arise in the career, and how to face them?\n15] When can significant career events (like the first job, job change, major promotion, starting/changing a business) occur?\n16] How are the current Planetary Periods (Dashas) and Transits (Gochara) affecting the Native's career, and what will be their impact in the future?\n17] How are the yogas for Success, Honor, and Reputation in the career? Will fame be achieved in a specific field? (उप-प्रश्न: Will the Native receive actual credit, awards, and respect for their work, or only the position and responsibilities?)\n18] Will the Native be able to achieve their major life Goals and Ambitions through their career?\n19] How are the yogas for achieving a Peak Position and Authority in the career? Will the Native become a leader or a high-ranking official in their field?\n20] What astrological remedies, gemstones, or Poojas can be suggested for any specific career-related problem or obstacle?\n\nस्क्रिप्ट के लिए निर्देश (सख्ती से पालन करें):\n\n1] भाषा: स्क्रिप्ट की भाषा सरल Hinglish हो, जैसी आज की पीढ़ी बोलती और समझती है। स्क्रिप्ट का tone पूरी तरह बोलचाल वाला रखें - शुद्ध या संस्कृतनिष्ठ भारी हिंदी के शब्द न वापरें, रोज़मर्रा की बातचीत वाली Hinglish ही रखें। पूरी स्क्रिप्ट देवनागरी लिपि में ही लिखें; अंग्रेजी के शब्द भी देवनागरी में ही लिखें, जैसे 'पर्सनलाइज़्ड', 'करियर', 'प्रैक्टिकल', 'सपोर्टिव'। ऊपर सूची में दिए गए प्रश्न अंग्रेजी में हैं; स्क्रिप्ट में इन्हें अंग्रेजी में ज्यों के त्यों न पढ़कर सरल Hinglish में अपने शब्दों में प्रस्तुत करें।\n\n2] शुरुआत: स्क्रिप्ट की शुरुआत बिल्कुल इन शब्दों से होनी चाहिए: 'नमस्कार, संजीवनी ज्योतिष संस्थान में आपका स्वागत है। [जातक का नाम] जी, यह आपकी पर्सनलाइज़्ड करियर रिपोर्ट की ऑडियो समरी है।'\n\n3] लंबाई: यह स्क्रिप्ट लगभग 20 मिनट के ऑडियो के लिए है, इसलिए कुल लंबाई 2800 से 3200 शब्दों के बीच रखें।\n\n4] संरचना और क्रम: स्क्रिप्ट इसी क्रम में चले -\n(क) सबसे पहले जातक द्वारा स्वयं पूछे गए प्रश्नों के उत्तर - यह भाग सबसे विस्तार से हो, प्रति प्रश्न लगभग 180 से 200 शब्द; हर प्रश्न का निष्कर्ष गहराई से समझाएँ, एक-दो पंक्तियों में न निपटाएँ।\n(ख) ere yogas for wealth gain or rise of fortune (Bhagyoday) from the spouse/in-laws after marriage?\n18] Are there yogas for any pre-marital relationship or attraction? (Love Marriage, Inter-caste Marriage, Elopement, or Arranged Marriage - with percentage chances)\n19] Are there yogas for a long-distance relationship?\n20] What major changes will come in life after marriage? (Especially Career, Health, Relocation, Spiritual Progress)\n21] Are there any delays or obstacles in marriage? If yes, what are the reasons? (उप-प्रश्न: Are there yogas for separation, temporary distance, or more than one marriage?)\n22] What kind of obstacles (Karma, Planets, Dosha, etc.) are visible regarding marriage? (उप-प्रश्न: specific challenges in married life and their remedies)\n23] Is there Manglik Dosha or any other marriage-related Dosha in the horoscope? If yes, what is its impact and remedy?\n\nस्क्रिप्ट के लिए निर्देश (सख्ती से पालन करें):\n\n1] भाषा: स्क्रिप्ट की भाषा सरल Hinglish हो, जैसी आज की पीढ़ी बोलती और समझती है। स्क्रिप्ट का tone पूरी तरह बोलचाल वाला रखें - शुद्ध या संस्कृतनिष्ठ भारी हिंदी के शब्द न वापरें, रोज़मर्रा की बातचीत वाली Hinglish ही रखें। पूरी स्क्रिप्ट देवनागरी लिपि में ही लिखें; अंग्रेजी के शब्द भी देवनागरी में ही लिखें, जैसे 'पर्सनलाइज़्ड', 'प्रैक्टिकल', 'सपोर्टिव'। ऊपर सूची में दिए गए प्रश्न या भाग अंग्रेजी में हैं; स्क्रिप्ट में इन्हें अंग्रेजी में ज्यों के त्यों न पढ़कर सरल Hinglish में अपने शब्दों में प्रस्तुत करें।\n\n2] शुरुआत: स्क्रिप्ट की शुरुआत बिल्कुल इन शब्दों से होनी चाहिए: 'नमस्कार, संजीवनी ज्योतिष संस्थान में आपका स्वागत है। [जातक का नाम] जी, यह आपकी पर्सनलाइज़्ड मैरिज रिपोर्ट की ऑडियो समरी है।'\n\n3] लंबाई: यह स्क्रिप्ट लगभग 20 मिनट के ऑडियो के लिए है, इसलिए कुल लंबाई 2800 से 3200 शब्दों के बीच रखें।\n\n4] संरचना और क्रम: स्क्रिप्ट इसी क्रम में चले -\n(क) सबसे पहले जातक द्वारा स्वयं पूछे गए प्रश्नों के उत्तर - प्रति प्रश्न लगभग 150 से 180 शब्द; हर प्रश्न का निष्कर्ष स्पष्ट रूप से समझाएँ।\n(ख) फिर भाग ख के 23 प्रश्नों के उत्तर एक-एक करके, उसी क्रम में - प्रति प्रश्न लगभग 55 से 65 शब्द, मुख्य निष्कर्ष और उसका कारण। प्रश्न 1, 5 और 11 के अंदर दिए गए चारों पद्धतियों के Part 1 से 5 उन्हीं प्रश्नों के उत्तर में ही समेटें, अलग से न दोहराएँ।\n(ग) फिर रिपोर्ट का Overall Conclusion संक्षेप में दें।\n(घ) अंत में उपाय (नीचे point 7 देखें) और फिर समापन पंक्ति।\nसभी भागों को एक कहानी और संवाद (Conversational) के लहजे में जोड़ें, बीच-बीच में स्वाभाविक संक्रमण वाक्य रखें, ताकि client को लगे कि कोई उन्हें सामने बैठाकर रिपोर्ट समझा रहा है। ध्यान रहे, अलग-अलग भागों में एक ही निष्कर्ष बार-बार न दोहराया जाए; जहाँ बात पहले आ चुकी हो, वहाँ संक्षेप में संदर्भ देकर आगे बढ़ें।\n\n5] तकनीकी शब्दावली से बचें: कुंडली के तकनीकी विवरण (ग्रहों की डिग्रियाँ, वर्ग चार्टों के नाम, मृत्यु भाग जैसे शब्द) सीधे न पढ़ें; उनके पीछे का अर्थ और अंतिम फलादेश सरल भाषा में समझाएँ। प्रतिशत (जैसे सफलता की संभावना) सिर्फ मुख्य निष्कर्षों में ही बोलें, हर point में प्रतिशत न दोहराएँ।\n\n6] सहानुभूति और स्पष्टता: जहाँ भी रिपोर्ट में चुनौती, बाधा या कठिन समय का जिक्र हो, उसे बहुत ही सहानुभूति और मेंटरशिप वाले लहजे में लिखें - डराएँ नहीं, मार्ग दिखाएँ।\n\n7] उपाय (Remedies): समापन से ठीक पहले, रिपोर्ट में दिए गए सभी कर्मिक और व्यवहारगत उपायों को स्पष्ट रूप से और क्रम से समझाएँ। रिपोर्ट में जो निष्कर्ष या उपाय नहीं है, वह अपनी ओर से न जोड़ें और न गढ़ें।\n\n8] समापन: स्क्रिप्ट का अंत बिल्कुल इन शब्दों से होना चाहिए: '[जातक का नाम] जी, यह थी आपकी मैरिज रिपोर्ट की संपूर्ण ऑडियो समरी। संजीवनी ज्योतिष संस्थान पर आपके विश्वास के लिए हृदय से धन्यवाद।'\n\n9] TTS के अनुकूल प्रारूप: स्क्रिप्ट में किसी भी तरह के बुलेट पॉइंट, कोष्ठक (ब्रैकेट), तारांकन (*), हैशटैग (#), क्रमांक या इमोजी का प्रयोग न करें। किसी शब्द के साथ ब्रैकेट में उसका दूसरा रूप या अर्थ न लिखें, जैसे बुध (Mercury) - हर शब्द सिर्फ एक ही रूप में लिखें। सिर्फ स्पष्ट पैराग्राफ में लिखें, ताकि TTS सॉफ्टवेयर इसे बिना अटके, प्राकृतिक मानवीय आवाज़ में पढ़ सके।\n\nअब इस रिपोर्ट के आधार पर स्क्रिप्ट तैयार करें।"}, "mtr": {"label": "मैरिज टाइमिंग (Marriage Time) - 10 मिनट", "text": "नीचे एक विस्तृत मैरिज टाइमिंग ( Hinglish ही रखें। पूरी स्क्रिप्ट देवनागरी लिपि में ही लिखें; अंग्रेजी के शब्द भी देवनागरी में ही लिखें, जैसे 'पर्सनलाइज़्ड', 'प्रैक्टिकल', 'सपोर्टिव'। ऊपर सूची में दिए गए प्रश्न या भाग अंग्रेजी में हैं; स्क्रिप्ट में इन्हें अंग्रेजी में ज्यों के त्यों न पढ़कर सरल Hinglish में अपने शब्दों में प्रस्तुत करें।\n\n2] शुरुआत: स्क्रिप्ट की शुरुआत बिल्कुल इन शब्दों से होनी चाहिए: 'नमस्कार, संजीवनी ज्योतिष संस्थान में आपका स्वागत है। [जातक का नाम] जी, यह आपकी पर्सनलाइज़्ड बर्थ टाइम रेक्टिफिकेशन रिपोर्ट की ऑडियो समरी है।'\n\n3] लंबाई: यह स्क्रिप्ट लगभग 20 मिनट के ऑडियो के लिए है, इसलिए कुल लंबाई 2800 से 3200 शब्दों के बीच रखें।\n\n4] संरचना और क्रम: स्क्रिप्ट इसी क्रम में चले -\n(क) सबसे पहले रिपोर्ट का मुख्य फल स्पष्ट रूप से बताएँ - जातक का दिया गया अनुमानित जन्म समय क्या था और सभी जाँचों के बाद अंतिम सुधरा हुआ (Rectified) जन्म समय क्या निर्धारित हुआ, लगभग 200 शब्द। यह समय स्क्रिप्ट में दो बार स्पष्ट रूप से बोलें - एक बार शुरुआत में और एक बार अंत में।\n(ख) फिर भाग ख - सुधार की प्रक्रिया को एक कहानी की तरह क्रम से समझाएँ: हर चरण में क्या जाँचा गया, समय-सीमा कैसे सिकुड़ती गई और कौन सी घटना या तथ्य निर्णायक साबित हुआ, प्रति चरण लगभग 180 से 200 शब्द। तकनीकी नामों (जैसे वर्ग चार्टों के नाम) को कम से कम रखकर उनका अर्थ सरल शब्दों में बताएँ।\n(ग) फिर भाग ग - सुधरी हुई कुंडली का सत्यापन: जीवन की मुख्य घटनाएँ नए समय से कैसे मेल खाती हैं, लगभग 300 शब्द।\n(घ) अंत में यह बताएँ कि नए समय से कुंडली में क्या बदला (जैसे लग्न या भावों में बदलाव) और इसका जातक के लिए क्या अर्थ है, लगभग 300 शब्द, और फिर समापन पंक्ति।\nसभी भागों को एक कहानी और संवाद (Conversational) के लहजे में जोड़ें, बीच-बीच में स्वाभाविक संक्रमण वाक्य रखें, ताकि client को लगे कि कोई उन्हें सामने बैठाकर रिपोर्ट समझा रहा है। ध्यान रहे, अलग-अलग भागों में एक ही निष्कर्ष बार-बार न दोहराया जाए; जहाँ बात पहले आ चुकी हो, वहाँ संक्षेप में संदर्भ देकर आगे बढ़ें।\n\n5] तकनीकी शब्दावली से बचें: कुंडली के तकनीकी विवरण (ग्रहों की डिग्रियाँ, वर्ग चार्टों के नाम, मृत्यु भाग जैसे शब्द) सीधे न पढ़ें; उनके पीछे का अर्थ और अंतिम फलादेश सरल भाषा में समझाएँ। प्रतिशत (जैसे सफलता की संभावना) सिर्फ मुख्य निष्कर्षों में ही बोलें, हर point में प्रतिशत न दोहराएँ।\n\n6] सहानुभूति और स्पष्टता: जहाँ भी रिपोर्ट में चुनौती, बाधा या कठिन समय का जिक्र हो, उसे बहुत ही सहानुभूति और मेंटरशिप वाले लहजे में लिखें - डराएँ नहीं, मार्ग दिखाएँ।\n\n7] आगे की दिशा: समापन से ठीक पहले यह स्पष्ट रूप से बताएँ कि आगे की सभी ज्योतिषीय गणनाएँ और रिपोर्टें इसी सुधरे हुए जन्म समय पर आधारित होंगी, और जातक को यह समय अपने रिकॉर्ड में सुधारकर सुरक्षित रखने का सुझाव दें। रिपोर्ट में जो तथ्य नहीं है, वह अपनी ओर से न जोड़ें और न गढ़ें।\n\n8] समापन: स्क्रिप्ट का अंत बिल्कुल इन शब्दों से होना चाहिए: '[जातक का नाम] जी, यह थी आपकी बर्थ टाइम रेक्टिफिकेशन रिपोर्ट की संपूर्ण ऑडियो समरी। संजीवनी ज्योतिष संस्थान पर आपके विश्वास के लिए हृदय से धन्यवाद।'\n\n9] TTS के अनुकूल प्रारूप: स्क्रिप्ट में किसी भी तरह के बुलेट पॉइंट, कोष्ठक (ब्रैकेट), तारांकन (*), हैशटैग (#), क्रमांक या इमोजी का प्रयोग न करें। किसी शब्द के साथ ब्रैकेट में उसका दूसरा रूप या अर्थ न लिखें, जैसे बुध (Mercury) - हर शब्द सिर्फ एक ही रूप में लिखें। सिर्फ स्पष्ट पैराग्राफ में लिखें, ताकि TTS सॉफ्टवेयर इसे बिना अटके, प्राकृतिक मानवीय आवाज़ में पढ़ सके।\n\nअब इस रिपोर्ट के आधार पर स्क्रिप्ट तैयार करें।"}, "yearbook": {"label": "वर्षफल (Year Book)", "text": "नीचे एक विस्तृत वर्षफल (Year Book / Varshphal) रिपोर्ट दी गई है, जिसमें जातक के आगामी 12 महीनों का महीना-दर-महीना विस्तृत विश्लेषण, महत्वपूर्ण ज्योतिषीय बिंदु, विशेष नोट और उपाय शामिल हैं। आपको इस पूरी रिपोर्ट के आधार पर एक 'टेक्स्ट-टू-स्पीच' (TTS) ऑडियो स्क्रिप्ट तैयार करनी है।\n\nजातक का नाम: [यहाँ जातक का नाम भरें]\n\nजातक के स्वयं के प्रश्न (यहाँ क्रम से भरें; उत्तर रिपोर्ट में दिए गए हैं):\n[प्रश्न 1]\n[प्रश्न 2]\n[प्रश्न 3]\n\nरिपोर्ट की संरचना (स्क्रिप्ट का क्रम यही रहेगा):\nभाग ख - वर्ष का सार: आगामी 12 महीनों के महत्वपूर्ण ज्योतिषीय बिंदु (Important Astrological Points); आने वाले 12 महीनों के लिए विशेष नोट (Special Note)।\nभाग ग - मासिक विश्लेषण: पहला महीना (जन्म माह) से बारहवाँ महीना तक, हर महीने का विस्तृत विश्लेषण (करियर, वित्त, स्वास्थ्य, प्रेम और पारिवारिक जीवन)।\n\nस्क्रिप्ट के लिए निर्देश (सख्ती से पालन करें):\n\n1] भाषा: स्क्रिप्ट की भाषा सरल Hinglish हो, जैसी आज की पीढ़ी बोलती और समझती है। स्क्रिप्ट का tone पूरी तरह बोलचाल वाला रखें - शुद्ध या संस्कृतनिष्ठ भारी हिंदी के शब्द न वापरें, रोज़मर्रा की बातचीत वाली Hinglish ही रखें। पूरी स्क्रिप्ट देवनागरी लिपि में ही लिखें; अंग्रेजी के शब्द भी देवनागरी में ही लिखें, जैसे 'पर्सनलाइज़्ड', 'प्रैक्टिकल', 'सपोर्टिव'। ऊपर सूची में दिए गए प्रश्न या भाग अंग्रेजी में हैं; स्क्रिप्ट में इन्हें अंग्रेजी में ज्यों के त्यों न पढ़कर सरल Hinglish में अपने शब्दों में प्रस्तुत करें।\n\n2] शुरुआत: स्क्रिप्ट की शुरुआत बिल्कुल इन शब्दों से होनी चाहिए: 'नमस्कार, संजीवनी ज्योतिष संस्थान में आपका स्वागत है। [जातक का नाम] जी, यह आपकी पर्सनलाइज़्ड वर्षफल रिपोर्ट की ऑडियो समरी है।'\n\n3] लंबाई: यह स्क्रिप्ट लगभग 20 मिनट के ऑडियो के लिए है, इसलिए कुल लंबाई 2800 से 3200 शब्दों के बीच रखें।\n\n4] संरचना और क्रम: स्क्रिप्ट इसी क्रम में चले -\n(क) सबसे पहले, यदि जातक के स्वयं के प्रश्न ऊपर भरे गए हैं तो उनके उत्तर - प्रति प्रश्न लगभग 120 शब्द।\n(ख) फिर भाग ख - पूरे वर्ष का सार: यह वर्ष कुल मिलाकर कैसा रहेगा, सबसे मजबूत और सबसे कमजोर दौर कौन से हैं, और किन बातों पर विशेष ध्यान देना है, लगभग 400 शब्द।\n(ग) फिर भाग ग - 12 महीनों का सार क्रम से, प्रति महीना लगभग 150 से 170 शब्द। हर महीने में करियर, धन, स्वास्थ्य और संबंधों की स्थिति संक्षेप में बताएँ। महीनों के नाम रिपोर्ट में दिए गए वास्तविक माह-वर्ष के अनुसार ही बोलें (जैसे 'जून 2026'), सिर्फ 'पहला महीना', 'दूसरा महीना' न कहें। जो महीना विशेष रूप से अच्छा या कठिन हो, उसे स्पष्ट रूप से चिह्नित करके बताएँ।\n(घ) अंत में उपाय (नीचे point 7 देखें) और फिर समापन पंक्ति।\nसभी भागों को एक कहानी और संवाद (Conversational) के लहजे में जोड़ें, बीच-बीच में स्वाभाविक संक्रमण वाक्य रखें, ताकि client को लगे कि कोई उन्हें सामने बैठाकर रिपोर्ट समझा रहा है। ध्यान रहे, अलग-अलग भागों में एक ही निष्कर्ष बार-बार न दोहराया जाए; जहाँ बात पहले आ चुकी हो, वहाँ संक्षेप में संदर्भ देकर आगे बढ़ें।\n\n5] तकनीकी शब्दावली से बचें: कुंडली के तकनीकी विवरण (ग्रहों की डिग्रियाँ, वर्ग चार्टों के नाम, मृत्यु भाग जैसे शब्द) सीधे न पढ़ें; उनके पीछे का अर्थ और अंतिम फलादेश सरल भाषा में समझाएँ। प्रतिशत (जैसे सफलता की संभावना) सिर्फ मुख्य निष्कर्षों में ही बोलें, हर point में प्रतिशत न दोहराएँ।\n\n6] सहानुभूति और स्पष्टता: जहाँ भी रिपोर्ट में चुनौती, बाधा या कठिन समय का जिक्र हो, उसे बहुत ही सहानुभूति और मेंटरशिप वाले लहजे में लिखें - डराएँ नहीं, मार्ग दिखाएँ।\n\n7] उपाय (Remedies): समापन से ठीक पहले, रिपोर्ट में दिए गए सभी कर्मिक और व्यवहारगत उपायों को स्पष्ट रूप से और क्रम से समझाएँ। रिपोर्ट में जो निष्कर्ष या उपाय नहीं है, वह अपनी ओर से न जोड़ें और न गढ़ें।\n\n8] समापन: स्क्रिप्ट का अंत बिल्कुल इन शब्दों से होना चाहिए: '[जातक का नाम] जी, यह थी आपकी वर्षफल रिपोर्ट की संपूर्ण ऑडियो समरी। संजीवनी ज्योतिष संस्थान पर आपके विश्वास के लिए हृदय से धन्यवाद।'\n\n9] TTS के अनुकूल प्रारूप: स्क्रिप्ट में किसी भी तरह के बुलेट पॉइंट, कोष्ठक (ब्रैकेट), तारांकन (*), हैशटैग (#), क्रमांक या इमोजी का प्रयोग न करें। किसी शब्द के साथ ब्रैकेट में उसका दूसरा रूप या अर्थ न लिखें, जैसे बुध (Mercury) - हर शब्द सिर्फ एक ही रूप में लिखें। सिर्फ स्पष्ट पैराग्राफ में लिखें, ताकि TTS सॉफ्टवेयर इसे बिना अटके, प्राकृतिक मानवीय आवाज़ में पढ़ सके।\n\nअब इस रिपोर्ट के आधार पर स्क्रिप्ट तैयार करें।"}, "extra": {"label": "अतिरिक्त प्रश्न (Extra Ques)", "text": "नीचे एक विस्तृत अतिरिक्त प्रश्न (Extra Questions) रिपोर्ट दी गई है, जिसमें जातक द्वारा पूछे गए अतिरिक्त प्रश्नों का चारों पद्धतियों (पराशरी, जैमिनी, भृगु नंदी नाड़ी और केपी) के आधार पर विस्तृत विश्लेषण और उत्तर शामिल हैं। आपको इस पूरी रिपोर्ट के आधार पर एक 'टेक्स्ट-टू-स्पीच' (TTS) ऑडियो स्क्रिप्ट तैयार करनी है।\n\nजातक का नाम: [यहाँ जातक का नाम भरें]\n\nजातक के स्वयं के प्रश्न (यहाँ क्रम से भरें; उत्तर रिपोर्ट में दिए गए हैं):\n[प्रश्न 1]\n[प्रश्न 2]\n[प्रश्न 3]\n[प्रश्न 4]\n[प्रश्न 5]\n[प्रश्न 6]\n\nरिपोर्ट की संरचना: इस रिपोर्ट में कोई तय प्रश्न सूची नहीं है; रिपोर्ट पूरी तरह जातक के ऊपर भरे गए अतिरिक्त प्रश्नों पर ही आधारित है। हर प्रश्न का उत्तर रिपोर्ट में विस्तृत विश्लेषण के साथ दिया गया है।\n\nस्क्रिप्ट के लिए निर्देश (सख्ती से पालन करें):\n\n1] भाषा: स्क्रिप्ट की भाषा सरल Hinglish हो, जैसी आज की पीढ़ी बोलती और समझती है। स्क्रिप्ट का tone पूरी तरह बोलचाल वाला रखें - शुद्ध या संस्कृतनिष्ठ भारी हिंदी के शब्द न वापरें, रोज़मर्रा की बातचीत वाली Hinglish ही रखें। पूरी स्क्रिप्ट देवनागरी लिपि में ही लिखें; अंग्रेजी के शब्द भी देवनागरी में ही लिखें, जैसे 'पर्सनलाइज़्ड', 'प्रैक्टिकल', 'सपोर्टिव'। ऊपर सूची में दिए गए प्रश्न या भाग अंग्रेजी में हैं; स्क्रिप्ट में इन्हें अंग्रेजी में ज्यों के त्यों न पढ़कर सरल Hinglish में अपने शब्दों में प्रस्तुत करें।\n\n2] शुरुआत: स्क्रिप्ट की शुरुआत बिल्कुल इन शब्दों से होनी चाहिए: 'नमस्कार, संजीवनी ज्योतिष संस्थान में आपका स्वागत है। [जातक का नाम] जी, यह आपकी पर्सनलाइज़्ड अतिरिक्त प्रश्नों की रिपोर्ट की ऑडियो समरी है।'\n\n3] लंबाई: यह स्क्रिप्ट लगभग 20 मिनट के ऑडियो के लिए है। हर प्रश्न पर लगभग 200 से 250 शब्द रखें; प्रश्नों की संख्या के अनुसार कुल लंबाई उसी अनुपात में रहे, अधिकतम 3200 शब्द। प्रश्न कम हों तो भी खाली विस्तार न करें।\n\n4] संरचना और क्रम: स्क्रिप्ट इसी क्रम में चले -\n(क) सभी प्रश्न ऊपर भरे गए क्रम में ही एक-एक करके लें - हर प्रश्न को पहले सरल शब्दों में प्रस्तुत करें, फिर रिपोर्ट में दिया गया उसका उत्तर और निष्कर्ष स्पष्ट रूप से समझाएँ।\n(ख) सभी प्रश्नों के बाद रिपोर्ट का समग्र निष्कर्ष (Overall Conclusion) संक्षेप में दें।\n(ग) अंत में उपाय (नीचे point 7 देखें) और फिर समापन पंक्ति।\nसभी भागों को एक कहानी और संवाद (Conversational) के लहजे में जोड़ें, बीच-बीच में स्वाभाविक संक्रमण वाक्य रखें, ताकि client को लगे कि कोई उन्हें सामने बैठाकर रिपोर्ट समझा रहा है। ध्यान रहे, अलग-अलग भागों में एक ही निष्कर्ष बार-बार न दोहराया जाए; जहाँ बात पहले आ चुकी हो, वहाँ संक्षेप में संदर्भ देकर आगे बढ़ें।\n\n5] तकनीकी शब्दावली से बचें: कुंडली के तकनीकी विवरण (ग्रहों की डिग्रियाँ, वर्ग चार्टों के नाम, मृत्यु भाग जैसे शब्द) सीधे न पढ़ें; उनके पीछे का अर्थ और अंतिम फलादेश सरल भाषा में समझाएँ। प्रतिशत (जैसे सफलता की संभावना) सिर्फ मुख्य निष्कर्षों में ही बोलें, हर point में प्रतिशत न दोहराएँ।\n\n6] सहानुभूति और स्पष्टता: जहाँ भी रिपोर्ट में चुनौती, बाधा या कठिन समय का जिक्र हो, उसे बहुत ही सहानुभूति और मेंटरशिप वाले लहजे में लिखें - डराएँ नहीं, मार्ग दिखाएँ।\n\n7] उपाय (Remedies): समापन से ठीक पहले, रिपोर्ट में दिए गए सभी कर्मिक और व्यवहारगत उपायों को स्पष्ट रूप से और क्रम से समझाएँ। रिपोर्ट में जो निष्कर्ष या उपाय नहीं है, वह अपनी ओर से न जोड़ें और न गढ़ें।\n\n8] समापन: स्क्रिप्ट का अंत बिल्कुल इन शब्दों से होना चाहिए: '[जातक का नाम] जी, यह थी आपकी अतिरिक्त प्रश्नों की रिपोर्ट की संपूर्ण ऑडियो समरी। संजीवनी ज्योतिष संस्थान पर आपके विश्वास के लिए हृदय से धन्यवाद।'\n\n9] TTS के अनुकूल प्रारूप: स्क्रिप्ट में किसी भी तरह के बुलेट पॉइंट, कोष्ठक (ब्रैकेट), तारांकन (*), हैशटैग (#), क्रमांक या इमोजी का प्रयोग न करें। किसी शब्द के साथ ब्रैकेट में उसका दूसरा रूप या अर्थ न लिखें, जैसे बुध (Mercury) - हर शब्द सिर्फ एक ही रूप में लिखें। सिर्फ स्पष्ट पैराग्राफ में लिखें, ताकि TTS सॉफ्टवेयर इसे बिना अटके, प्राकृतिक मानवीय आवाज़ में पढ़ सके।\n\nअब इस रिपोर्ट के आधार पर स्क्रिप्ट तैयार करें।"}, "jupiter": {"label": "गुरु गोचर (Jupiter Transit)", "text": "नीचे एक विस्तृत गुरु गोचर (Jupiter Transit) रिपोर्ट दी गई है, जिसमें देवगुरु बृहस्पति के गोचर का जातक की कुंडली पर तकनीकी आधार, दृष्टियों का प्रभाव, दशा-गोचर समन्वय, 12 महीनों का विस्तृत विश्लेषण और वैदिक उपाय शामिल हैं। आपको इस पूरी रिपोर्ट के आधार पर एक 'टेक्स्ट-टू-स्पीच' (TTS) ऑडियो स्क्रिप्ट तैयार करनी है।\n\nजातक का नाम: [यहाँ जातक का नाम भरें]\n\nजातक के स्वयं के प्रश्न (यहाँ क्रम से भरें; उत्तर रिपोर्ट में दिए गए हैं):\n[प्रश्न 1]\n[प्रश्न 2]\n[प्रश्न 3]\n\nरिपोर्ट की संरचना (स्क्रिप्ट का क्रम यही रहेगा):\nभाग ख - गोचर का आधार और समग्र प्रभाव:\nभाग 1: गुरु गोचर का तकनीकी आधार (अष्टकवर्ग परिणाम; लग्न और चंद्र से भाव प्रभाव)\nभाग 2: गोचर की दृष्टियाँ और जीवन के क्षेत्रों पर प्रभाव (गुरु की 5वीं, 7वीं और 9वीं दृष्टि)\nभाग 3: दशा और गोचर का समन्वय (Dasha & Transit Synergy)\nभाग 4: गोचर का सूक्ष्म प्रभाव (D9 नवमांश अवलोकन)\nभाग ग - मासिक विश्लेषण: भाग 5 - गोचर के 12 महीनों का सूक्ष्म दशा-गोचर विश्लेषण (महीना-दर-महीना)।\nभाग घ - भाग 6: निष्कर्ष और वैदिक उपाय।\n\nस्क्रिप्ट के लिए निर्देश (सख्ती से पालन करें):\n\n1] भाषा: स्क्रिप्ट की भाषा सरल Hinglish हो, जैसी आज की पीढ़ी बोलती और समझती है। स्क्रिप्ट का tone पूरी तरह बोलचाल वाला रखें - शुद्ध या संस्कृतनिष्ठ भारी हिंदी के शब्द न वापरें, रोज़मर्रा की बातचीत वाली Hinglish ही रखें। पूरी स्क्रिप्ट देवनागरी लिपि में ही लिखें; अंग्रेजी के शब्द भी देवनागरी में ही लिखें, जैसे 'पर्सनलाइज़्ड', 'प्रैक्टिकल', 'सपोर्टिव'। ऊपर सूची में दिए गए प्रश्न या भाग अंग्रेजी में हैं; स्क्रिप्ट में इन्हें अंग्रेजी में ज्यों के त्यों न पढ़कर सरल Hinglish में अपने शब्दों में प्रस्तुत करें।\n\n2] शुरुआत: स्क्रिप्ट की शुरुआत बिल्कुल इन शब्दों से होनी चाहिए: 'नमस्कार, संजीवनी ज्योतिष संस्थान में आपका स्वागत है। [जातक का नाम] जी, यह आपकी पर्सनलाइज़्ड गुरु गोचर रिपोर्ट की ऑडियो समरी है।'\n\n3] लंबाई: यह स्क्रिप्ट लगभग 20 मिनट के ऑडियो के लिए है, इसलिए कुल लंबाई 2800 से 3200 शब्दों के बीच रखें।\n\n4] संरचना और क्रम: स्क्रिप्ट इसी क्रम में चले -\n(क) सबसे पहले, यदि जातक के स्वयं के प्रश्न ऊपर भरे गए हैं तो उनके उत्तर - प्रति प्रश्न लगभग 120 शब्द।\n(ख) फिर भाग ख - गोचर का समग्र प्रभाव: यह गोचर जातक के लिए कुल मिलाकर कितना शक्तिशाली है, किन क्षेत्रों में सबसे अधिक लाभ मिलेगा और कहाँ सावधानी रखनी है, कुल लगभग 700 शब्द। अष्टकवर्ग बिंदुओं जैसे तकनीकी आंकड़ों को सीधे न पढ़कर उनका अर्थ बताएँ (जैसे 'इस क्षेत्र में गोचर की शक्ति बहुत अधिक है')।\n(ग) फिर भाग ग - 12 महीनों का सार क्रम से, प्रति महीना लगभग 150 शब्द। महीनों के नाम रिपोर्ट में दिए गए वास्तविक माह-वर्ष के अनुसार ही बोलें, सिर्फ 'पहला महीना', 'दूसरा महीना' न कहें। जो महीना विशेष रूप से अच्छा या कठिन हो, उसे स्पष्ट रूप से चिह्नित करके बताएँ।\n(घ) अंत में भाग घ - निष्कर्ष और वैदिक उपाय (नीचे point 7 देखें) और फिर समापन पंक्ति।\nसभी भागों को एक कहानी और संवाद (Conversational) के लहजे में जोड़ें, बीच-बीच में स्वाभाविक संक्रमण वाक्य रखें, ताकि client को लगे कि कोई उन्हें सामने बैठाकर रिपोर्ट समझा रहा है। ध्यान रहे, अलग-अलग भागों में एक ही निष्कर्ष बार-बार न दोहराया जाए; जहाँ बात पहले आ चुकी हो, वहाँ संक्षेप में संदर्भ देकर आगे बढ़ें।\n\n5] तकनीकी शब्दावली से बचें: कुंडली के तकनीकी विवरण (ग्रहों की डिग्रियाँ, वर्ग चार्टों के नाम, मृत्यु भाग जैसे शब्द) सीधे न पढ़ें; उनके पीछे का अर्थ और अंतिम फलादेश सरल भाषा में समझाएँ। प्रतिशत (जैसे सफलता की संभावना) सिर्फ मुख्य निष्कर्षों में ही बोलें, हर point में प्रतिशत न दोहराएँ।\n\n6] सहानुभूति और स्पष्टता: जहाँ भी रिपोर्ट में चुनौती, बाधा या कठिन समय का जिक्र हो, उसे बहुत ही सहानुभूति और मेंटरशिप वाले लहजे में लिखें - डराएँ नहीं, मार्ग दिखाएँ।\n\n7] उपाय (Remedies): समापन से ठीक पहले, रिपोर्ट में दिए गए सभी कर्मिक और व्यवहारगत उपायों को स्पष्ट रूप से और क्रम से समझाएँ। रिपोर्ट में जो निष्कर्ष या उपाय नहीं है, वह अपनी ओर से न जोड़ें और न गढ़ें।\n\n8] समापन: स्क्रिप्ट का अंत बिल्कुल इन शब्दों से होना चाहिए: '[जातक का नाम] जी, यह थी आपकी गुरु गोचर रिपोर्ट की संपूर्ण ऑडियो समरी। संजीवनी ज्योतिष संस्थान पर आपके विश्वास के लिए हृदय से धन्यवाद।'\n\n9] TTS के अनुकूल प्रारूप: स्क्रिप्ट में किसी भी तरह के बुलेट पॉइंट, कोष्ठक (ब्रैकेट), तारांकन (*), हैशटैग (#), क्रमांक या इमोजी का प्रयोग न करें। किसी शब्द के साथ ब्रैकेट में उसका दूसरा रूप या अर्थ न लिखें, जैसे बुध (Mercury) - हर शब्द सिर्फ एक ही रूप में लिखें। सिर्फ स्पष्ट पैराग्राफ में लिखें, ताकि TTS सॉफ्टवेयर इसे बिना अटके, प्राकृतिक मानवीय आवाज़ में पढ़ सके।\n\nअब इस रिपोर्ट के आधार पर स्क्रिप्ट तैयार करें।"}};
const LANG_POINTS = {"hinglish": null, "hindi": "1] भाषा: स्क्रिप्ट की भाषा सरल, बोलचाल वाली हिंदी (देवनागरी लिपि) हो। शुद्ध या संस्कृतनिष्ठ भारी हिंदी का प्रयोग न करें; अंग्रेजी शब्द सिर्फ वहीं रखें जहाँ हिंदी शब्द बिल्कुल अस्वाभाविक लगे। ऊपर सूची में दिए गए प्रश्न या भाग अंग्रेजी में हैं; स्क्रिप्ट में इन्हें ज्यों के त्यों न पढ़कर सरल हिंदी में अपने शब्दों में प्रस्तुत करें।", "marathi": "1] भाषा: स्क्रिप्ट की भाषा सरल, बोलचाल वाली मराठी (देवनागरी लिपि) हो। शुद्ध या संस्कृतनिष्ठ भारी मराठी का प्रयोग न करें, रोज़मर्रा की बातचीत वाली मराठी ही रखें। ऊपर सूची में दिए गए प्रश्न या भाग अंग्रेजी में हैं; स्क्रिप्ट में इन्हें ज्यों के त्यों न पढ़कर सरल मराठी में अपने शब्दों में प्रस्तुत करें।", "english": "1] Language: The script must be in simple, conversational English, the way people naturally speak. Avoid heavy, formal or bookish English. The questions and sections listed above are already in English; present them in the script in your own simple words, in a natural storytelling flow, not as read-out headings."};
const NO_Q = { btr: true };

const reportSel = document.getElementById('reportSel');
const langSel = document.getElementById('langSel');
const name1 = document.getElementById('name1');
const name2 = document.getElementById('name2');
const nameBlock2 = document.getElementById('nameBlock2');
const nameLabel1 = document.getElementById('nameLabel1');
const qBlock = document.getElementById('qBlock');
const btrNote = document.getElementById('btrNote');
const questionsEl = document.getElementById('questions');
const reportTextEl = document.getElementById('reportText');
const outEl = document.getElementById('out');
const metaEl = document.getElementById('meta');
const copyBtn = document.getElementById('copyBtn');

Object.keys(TEMPLATES).forEach(function(k){
  const o = document.createElement('option');
  o.value = k; o.textContent = TEMPLATES[k].label;
  reportSel.appendChild(o);
});
reportSel.value = 'career';

function cleanQuestions(raw){
  return raw.split('\n').map(function(s){ return s.trim(); })
    .filter(function(s){ return s.length > 0; })
    .map(function(s){ return s.replace(/^(\d+\s*[\]\)\.\-]|\-|\•)\s*/, '').trim(); })
    .filter(function(s){ return s.length > 0; });
}

function fillQuestions(text, qs){
  const lines = text.split('\n');
  const idx = [];
  lines.forEach(function(l, i){ if (/^\[प्रश्न \d+\]$/.test(l.trim())) idx.push(i); });
  if (!idx.length) return text;
  const replacement = qs.length ? qs.map(function(q, i){ return (i+1) + '] ' + q; })
                                : idx.map(function(_, i){ return '[प्रश्न ' + (i+1) + ']'; });
  const start = idx[0], end = idx[idx.length - 1];
  lines.splice(start, end - start + 1, ...replacement);
  return lines.join('\n');
}

function swapLang(text, lang){
  const lp = LANG_POINTS[lang];
  if (!lp) return text;
  const lines = text.split('\n');
  for (let i = 0; i < lines.length; i++){
    if (lines[i].indexOf('1] भाषा:') === 0){ lines[i] = lp; break; }
  }
  return lines.join('\n');
}

function build(){
  const key = reportSel.value;
  let text = TEMPLATES[key].text;
  const isMilan = key === 'milan';
  nameBlock2.style.display = isMilan ? 'block' : 'none';
  nameLabel1.textContent = isMilan ? 'वर का नाम:' : 'जातक का नाम:';
  const noQ = !!NO_Q[key];
  qBlock.style.display = noQ ? 'none' : 'block';
  btrNote.style.display = noQ ? 'block' : 'none';

  const n1 = name1.value.trim(), n2 = name2.value.trim();
  if (isMilan){
    if (n1) text = text.split('[यहाँ वर का नाम भरें]').join(n1).split('[वर का नाम]').join(n1);
    if (n2) text = text.split('[यहाँ वधू का नाम भरें]').join(n2).split('[वधू का नाम]').join(n2);
  } else if (n1){
    text = text.split('[यहाँ जातक का नाम भरें]').join(n1).split('[जातक का नाम]').join(n1);
  }
  if (!noQ) text = fillQuestions(text, cleanQuestions(questionsEl.value));
  text = swapLang(text, langSel.value);
  const rep = reportTextEl.value.trim();
  if (rep){
    text = text.replace(/\n?अब इस रिपोर्ट के आधार पर स्क्रिप्ट तैयार करें।\s*$/, '\n\nरिपोर्ट:\n' + rep + '\n\nअब इस रिपोर्ट के आधार पर स्क्रिप्ट तैयार करें।');
  }
  outEl.value = text;
  metaEl.textContent = 'कुल अक्षर: ' + text.length + ' | अनुमानित शब्द: ' + Math.round(text.split(/\s+/).length);
}

[reportSel, langSel, name1, name2, questionsEl, reportTextEl].forEach(function(el){
  el.addEventListener('input', build);
  el.addEventListener('change', build);
});

copyBtn.addEventListener('click', function(){
  build();
  outEl.removeAttribute('readonly');
  outEl.select();
  outEl.setAttribute('selectionStart', 0);
  let ok = false;
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(outEl.value).then(function(){ done(true); }, function(){ done(legacy()); });
  } else { done(legacy()); }
  function legacy(){ try { return document.execCommand('copy'); } catch(e){ return false; } }
  function done(success){
    outEl.setAttribute('readonly', '');
    const old = '📋 तैयार Prompt Copy करो';
    copyBtn.textContent = success ? '✅ Copy हो गया' : '⚠️ Select हो गया है - अब Copy करो (Ctrl+C)';
    setTimeout(function(){ copyBtn.textContent = old; }, 2200);
  }
});

build();
</script>
