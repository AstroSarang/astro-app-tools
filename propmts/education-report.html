भाग 2: जैमिनी ज्योतिष के अनुसार शिक्षा का विश्लेषण

(यह भाग शिक्षा में प्रतिभा, आत्मा की रुचि और विद्या की दिशा को समझने के लिए है।)

1] आत्मकारक (AK) और अमात्यकारक (AmK)-आत्मा का उद्देश्य और मार्गदर्शक:
A] आत्मकारक (AK):

➤ जैमिनी पद्धति से आत्मकारक ग्रह कौन-सा है? (सबसे ज्यादा अंश वाला ग्रह)
➤ आत्मकारक किस राशि और भाव में स्थित है?
➤ आत्मकारक के साथ कौन-कौन से ग्रहों (चर कारक) की युति है?
➤ आत्मकारक पर किन राशियों की जैमिनी राशि दृष्टि है? (चर,स्थिर,द्विस्वभाव)
➤ आत्मकारक किस नवमांश में स्थित है?
➤ आत्मकारक किस नक्षत्र में स्थित है?

B]अमात्यकारक (AmK):

➤ जैमिनी पद्धति से अमात्यकारक ग्रह कौन-सा है? (दूसरा सबसे ज्यादा अंश वाला ग्रह)
➤ अमात्यकारक किस राशि और भाव में स्थित है?
➤ अमात्यकारक के साथ कौन-कौन से ग्रहों (चर कारक) की युति है?
➤ अमात्यकारक पर किन राशियों की जैमिनी राशि दृष्टि है? (चर,स्थिर,द्विस्वभाव)
➤ अमात्यकारक किस नवमांश में स्थित है?

विश्लेषण: AK बच्चे की आत्मा का मूल उद्देश्य दर्शाता है। AmK उस मार्ग या मार्गदर्शक (शिक्षक/विषय) का प्रतिनिधित्व करता है जो बच्चे की रुचि और शिक्षा की दिशा तय करने में मदद करता है।

2] AK और AmK का आपसी संबंध - रुचि और मार्ग में सामंजस्य:
➤ क्या AK और AmK एक-दूसरे से शुभ भावों में स्थित हैं (जैसे केंद्र 1, 4, 7, 10; त्रिकोण 1, 5, 9; या 3/11 का संबंध)?
➤ क्या वे एक-दूसरे पर जैमिनी राशि दृष्टि डाल रहे हैं?

विश्लेषण: यह संबंध शिक्षा में सहजता और रुचि को दर्शाता है। यदि संबंध शुभ है, तो बच्चा अपनी रुचि के अनुसार पढ़ाई में सहज आगे बढ़ेगा। अशुभ संबंध पढ़ाई में आंतरिक असंतोष और दिशा का भटकाव दर्शाता है।

3] मंत्रपद (A5) - विद्या और बुद्धि की छवि:

➤ क्या A5 का संबंध लग्न आरूढ़ (AL), आत्मकारक (AK) या अमात्यकारक (AmK) से बन रहा है?

विश्लेषण: यह दर्शाता है कि बच्चे की विद्या और बुद्धि की वास्तविक क्षमता क्या है और दुनिया उसे पढ़ाई में कैसे देखेगी।

5] अर्गला विश्लेषण - अदृश्य हस्तक्षेप और संसाधनों का प्रवाह:

➤ पंचम भाव पर अर्गला: बच्चे की पढ़ाई को किन ग्रहों से निरंतर सहयोग या बाधा मिल रही है (जैसे माता-पिता, शिक्षक, संसाधन)?

विश्लेषण: शिक्षा में मिलने वाले अदृश्य सहयोग, संसाधनों का प्रवाह और छिपी हुई बाधाओं का पता लगाना।

➤ A4 में कौन-कौन से ग्रह स्थित हैं?

भाग 3: भृगु नंदी नाड़ी (BNN) के अनुसार शिक्षा का विश्लेषण

(यह भाग ग्रहों के प्रवाह और जीवन के पैटर्न के आधार पर शिक्षा को समझने के लिए है।)

1] बुध (विद्या कारक) की स्थिति और संबंध:
➤ बुध किस राशि में है (और किस डिग्री पर है)?
➤ बुध किस ग्रह के नक्षत्र में है?
➤ बुध के साथ युति में ग्रह कौन से हैं?
➤ बुध से दूसरी और बारहवीं राशि में कौन से ग्रह हैं?
➤ बुध से त्रिकोण (1-5-9) में कौन से ग्रह हैं?

विश्लेषण: बच्चे की बुद्धि का मूल स्वरूप, सीखने की शैली (जैसे तर्क, भाषा, गणित) और पढ़ाई में आने वाला अनुशासन/संघर्ष।

to be continued...

2] गुरु (ज्ञान कारक) और बुध का संबंध:
➤ गुरु और बुध का आपसी संबंध क्या है (युति, 2-12, 1-5-9)?

विश्लेषण: बच्चे के ज्ञान (गुरु) और बुद्धि (बुध) के बीच का संबंध। यह बताता है कि पढ़ाई गहरी और संतोषजनक होगी या सतही और बोझ जैसी लगेगी।

3] शिक्षा से संबंधित अन्य ग्रहों का प्रभाव:
➤ चंद्र, मंगल या शनि का बुध से क्या संबंध है? (चंद्र - मन और स्मरण, मंगल - प्रतिस्पर्धा और तकनीक, शनि - अनुशासन और मेहनत)।

विश्लेषण: सीखने की विशिष्ट प्रकृति का निर्धारण। (जैसे, बुध+चंद्र = स्मरण/भाषा में तेज, बुध+मंगल = गणित/तकनीक, बुध+शनि = धीमी शुरुआत पर गहरी पकड़)।

4] पंचमेश नवांशधिपति (Panchmesh Navamshadhipati) का सूत्र (शिक्षा में बाधा और समाधान):
➤ जन्म कुंडली (D-1) में पंचम भाव का स्वामी (पंचमेश / 5th Lord) कौन सा ग्रह है?
➤ नवांश कुंडली (D-9) में वह पंचमेश किस भाव और किस राशि में बैठा है?
➤ नवांश में पंचमेश का डिस्पॉजिटर (नवांशधिपति - उस राशि का स्वामी) कौन सा ग्रह है?
➤ नवांश कुंडली में वह डिस्पॉजिटर स्वयं पंचमेश से किस स्थान पर बैठा है (पंचमेश को प्रथम स्थान मानकर गिनिए; विशेषकर क्या वह पंचमेश से 6ठे, 8वें या 12वें स्थान पर है)?
➤ नवांश कुंडली में वह डिस्पॉजिटर स्वयं किस भाव में बैठा है (विशेषकर क्या वह नवांश के 6ठे, 8वें या 12वें भाव में है)?

उपरोक्त जानकारी के आधार पर, आपको एक विशेषज्ञ ज्योतिषी की भूमिका निभानी है और बताएं कि यह कुंडली 'पढ़ाकू बच्चे' की है या 'पढ़ाई में कमजोर बच्चे' की है या 'देर से खिलने वाले बच्चे' की है - जिसका बचपन में शिक्षा के समय मन नहीं लगता, पर आगे चलकर बुद्धि और समझ बहुत तेज हो जाती है।

1] प्रथम चरण: लग्न और लग्नेश का बल (क्षमता - Capacity)
(शिक्षा देखने से पहले यह देखना सबसे जरूरी है बच्चे के व्यक्तित्व और संघर्ष शक्ति।)

➤ लग्नेश की स्थिति (राशि, भाव, युति, अवस्था {उच्च/नीच/निचभंग,अस्त-वक्री} और बल) का विश्लेषण करें।
➤ क्या लग्नेश पीड़ित है (6, 8, 12 भाव में या क्रूर ग्रहों के प्रभाव में)?
➤ क्या बच्चे में पढ़ाई के लिए आवश्यक इच्छाशक्ति (Willpower) और धैर्य है?

➢ विश्लेषण : यदि लग्नेश मजबूत है, तो बच्चा संघर्षों से लड़कर पढ़ाई में ऊपर उठेगा। यदि लग्नेश निर्बल है, तो पंचम भाव कितना भी अच्छा हो, बच्चा उसका पूरा लाभ नहीं उठा पाता।

2] द्वितीय चरण: पंचम भाव और पंचमेश (विद्या का स्वरूप)
(बुद्धि और शिक्षा की दिशा (Direction) जानने के लिए।)

➤ पंचम भाव में स्थित ग्रह कैसे है: ये ग्रह पढ़ाई के शुरुआती स्वरूप को तय करते हैं।
➤ पंचमेश की स्थिति (राशि, भाव, युति, अवस्था {उच्च/नीच/निचभंग,अस्त-वक्री} और बल) और शक्ति का विश्लेषण करें।
➤ क्या पंचमेश पीड़ित है (6, 8, 12 भाव में या क्रूर ग्रहों के प्रभाव में)?
➤ पंचमेश की स्थिति: पंचमेश कहाँ बैठा है? (जैसे: यदि पंचमेश 3रे भाव में है, तो बच्चा स्वयं के प्रयास और प्रतियोगिता से सीखेगा)।
➤ पंचम भाव पर दृष्टि: किन ग्रहों की दृष्टि है और वे पढ़ाई को कैसा बनाते हैं?
➤ चतुर्थ भाव और चतुर्थेश की स्थिति भी देखें - प्रारंभिक शिक्षा की नींव और घर का माहौल कैसा है?

➢ विश्लेषण : पंचमेश और चतुर्थेश दोनों मजबूत हों तो बच्चा जन्म से पढ़ाकू होता है। पंचम भाव मजबूत पर चतुर्थ कमजोर हो तो समझ अच्छी पर school की शुरुआत धीमी रहती है।

➤ बुध की स्थिति और अवस्था देखें - विशेषकर बुध वक्री है या नहीं? वक्री बुध रटी-रटाई पढ़ाई में नहीं जमता, उसका मन अलग ढंग से सोचता है, इसलिए बचपन में पढ़ाई में मन नहीं लगता; पर उम्र बढ़ने पर वही बुध गहरी समझ और तीव्र बुद्धि देता है।
➤ गुरु (ज्ञान) और चंद्र (मन, स्मरण, एकाग्रता) की स्थिति और बल देखें।
➤ D24 (चतुर्विंशांश) में लग्नेश, पंचमेश, बुध और गुरु की स्थिति से विद्या का अंतिम स्तर जांचें।

➢ विश्लेषण : यदि बुध, गुरु या पंचमेश मजबूत हैं पर उनकी दशा स्कूल के वर्षों के बाद आती है, तो यह देर से खिलने वाले बच्चे का स्पष्ट संकेत है।

➤ उम्र 18 के बाद आने वाली दशा किस ग्रह की है? क्या वह बुध, गुरु, पंचमेश या लग्नेश से जुड़ी है?

➤ अमात्यकारक (AmK) की स्थिति क्या है? वह शिक्षा के किस क्षेत्र की ओर इशारा करता है?
➤ मंत्रपद (A5) की स्थिति क्या है? उस पर शुभ या पाप ग्रहों का प्रभाव कैसा है?

➢ विश्लेषण : AmK बच्चे की शिक्षा की दिशा और मार्गदर्शक का कारक दर्शाता है। यदि AmK बुध, गुरु या पंचमेश से जुड़ा हो तो पढ़ाई की दिशा स्पष्ट और मजबूत होती है, और A5 मजबूत हो तो विद्या में यश मिलता है।

6] षष्ठम चरण: षड्बल और अष्टकवर्ग
(भावों का बल)

➤ अष्टकवर्ग (Ashtakavarga) में 4थे, 5वें और 9वें भाव के बिंदुओं की तुलना करें।
➤ पंचमेश, चतुर्थेश और लग्नेश का षड्बल (Shadbala) स्कोर कैसा है?

➢ विश्लेषण : बल और क्षमता का विश्लेषण - ये अंक इस बात की पुष्टि करेंगे कि शिक्षा के योग कागज़ पर ही मजबूत हैं या असल में फल देने की क्षमता भी रखते हैं।

➢ अंतिम निर्णय (Verdict) : उपरोक्त सभी चरणों के आधार पर स्पष्ट निर्णय दीजिए -
(क) कुंडली पढ़ाकू बच्चे की है, या
(ख) कुंडली पढ़ाई में कमजोर बच्चे की है, या
(ग) कुंडली देर से खिलने वाले बच्चे की है - इस स्थिति में यह भी बताइए कि किस उम्र या किस दशा से बच्चे का मन पढ़ाई में लगने लगेगा और बुद्धि तेज होगी।
निर्णय के साथ प्रतिशत में आत्मविश्वास (Confidence) भी दीजिए।

उपरोक्त कुण्डली और अष्टकवर्ग जानकारी के आधार पर, आपको एक विशेषज्ञ ज्योतिषी की भूमिका निभानी है। आपका कार्य यह विश्लेषण करना है कि बच्चे के लिए आधुनिक समय के अनुसार कौन सा शिक्षा पथ (Regular Academic, Competitive Exam Oriented, Skill/Technical आधारित, या कला/खेल आधारित) सबसे अधिक सफल रहेगा।
(नोट: विश्लेषण से पहले बच्चे के 'लग्न' की पहचान करें ताकि पंचमेश का सही पता चल सके)।

➤ विश्लेषण की प्रक्रिया (Step-by-Step Process):

► 1. सर्वाष्टकवर्ग (SAV) का "गैप-बेस्ड" तुलनात्मक विश्लेषण (Gap-Based Logic):
शिक्षा की सटीक दिशा तय करने के लिए भावों के बीच का अंतर (Gap) देखें:
Gap की कसौटी: अंतर 0-2 = दोनों भाव बराबर (मिश्रित परिणाम), अंतर 3-5 = आगे वाले भाव की तरफ स्पष्ट झुकाव, अंतर 6 या अधिक = आगे वाला भाव निर्णायक रूप से मजबूत। सभी तुलनाएँ इसी कसौटी पर करें।
A] 4था (प्रारंभिक शिक्षा/घर) vs 5वां (बुद्धि/मुख्य शिक्षा): देखें कि दोनों में से कौन मजबूत है और उनके बीच अंकों का अंतर (Gap) कितना है।
B] 5वां (परंपरागत पढ़ाई) vs 3रा (साहस/प्रतियोगिता/डिजिटल/स्वयं प्रयास): देखें कि बच्चे को नियमित पढ़ाई सूट करेगी या प्रतियोगिता और स्वयं-प्रयास वाली दिशा।
C] 11वां (सफलता/लाभ): देखें कि सफलता (11वां) का झुकाव किस तरफ है - शैक्षणिक, प्रतियोगी या कौशल की तरफ।
11वें भाव का झुकाव इस प्रकार तय करें - लाभेश (11वें भाव के स्वामी) की स्थिति और संबंध देखें: यदि लाभेश 5वें भाव, पंचमेश या गुरु से जुड़ा हो तो सफलता शैक्षणिक पढ़ाई से; यदि लाभेश 6ठे भाव, षष्ठेश या मंगल से जुड़ा हो तो सफलता प्रतियोगी परीक्षाओं से; यदि लाभेश 3रे भाव या शुक्र/शनि से जुड़ा हो तो सफलता कौशल, कला या तकनीकी क्षेत्र से मिलेगी।

► 2. सटीक शिक्षा पथ (Micro-Niche) की पहचान:
नीचे दिए गए नियमों के आधार पर बच्चे का सटीक शिक्षा पथ तय करें:
- नियमित शैक्षणिक पथ (Regular Academic): यदि 5वां भाव बहुत मजबूत हो (28+) और 9वां भाव भी मजबूत हो। (बच्चा school से university तक की सीधी पढ़ाई में सफल होगा)।
- प्रतियोगी परीक्षा-केंद्रित पथ: यदि 6ठा भाव मजबूत हो (5वें के बराबर या अधिक) और 11वां भाव भी मजबूत हो। (बच्चा प्रतिस्पर्धा में आगे निकलेगा - JEE/NEET/Olympiad जैसी परीक्षाएँ)।
- कौशल / तकनीकी पथ (Skill/Technical): यदि 3रा भाव बहुत मजबूत हो (28+) और बुध या शनि का प्रबल प्रभाव हो। (बच्चा diploma, technical या skill-आधारित पाठ्यक्रमों में चमकेगा)।
- कला / खेल आधारित पथ: यदि 5वें भाव पर शुक्र या मंगल का प्रबल प्रभाव हो और 3रा भाव भी मजबूत हो। (बच्चे की मुख्य दिशा कला, संगीत या खेल की ओर जाएगी)।
प्राथमिकता क्रम: यदि एक से अधिक नियम एक साथ लागू हों तो फैसला इस क्रम से करें - पहले 4थे बनाम 5वें भाव का Gap (मुख्य दिशा: नींव या बुद्धि), फिर 5वें भाव की मजबूती (नियमित पढ़ाई या वैकल्पिक रुझान), फिर 3रे भाव की मजबूती (स्वयं प्रयास/प्रतियोगिता/कौशल का झुकाव)। अंत में BAV सपोर्ट से फैसले की पुष्टि करें।

► 3. भिन्नाष्टकवर्ग (BAV) का सहायक विश्लेषण (Supportive Triggers):
A] बुध (बुद्धि कारक): बुध का 5वें भाव में स्कोर (4+ शुभ है)।
B] गुरु (ज्ञान कारक): गुरु का 5वें और 9वें भाव में स्कोर (4+ शुभ है)।
C] पंचमेश (5th Lord): लग्न के अनुसार पंचमेश की पहचान करें और उसका 5वें भाव में स्कोर देखें।
(ध्यान दें: BAV केवल सहायक है, अंतिम निर्णय SAV के गैप (Gap) पर ही निर्भर करेगा)।

► 4. भाव की शुभता (Bhava Shubhta - 28 Bindu Rule):
अष्टकवर्ग के प्रामाणिक नियम के अनुसार, किसी भी भाव में 28 बिंदु औसत (Average) माने जाते हैं।
- 4थे, 5वें, 9वें और 11वें भाव के अंकों को इस नियम पर तौलें।
- 28 या उससे अधिक अंक भाव को शुभ और परिणाम देने में आसान बनाते हैं। 28 से कम अंक संघर्ष (कष्ट) दर्शाते हैं। बताएं कि किस क्षेत्र में आसानी है और किसमें संघर्ष।
विशेष नोट: 6ठा भाव प्रतिस्पर्धा का भाव है - इसके 28 या अधिक अंक प्रतियोगी परीक्षाओं में अवसर और परिणाम मिलने की आसानी दिखाते हैं, 'शुभ' शब्द का अर्थ यहाँ इसी रूप में लें।

--------------------------------------------------
1] अब पहले निकाले गए सभी ग्रहों को सूचीबद्ध कीजिये।
(इस सूची में जो ग्रह बार-बार आ रहे हैं, वे विशेष रूप से महत्वपूर्ण हैं।)

(इन ग्रहों का अस्त,वक्री,नीच-नीचभंग, वर्गोत्तम, शत्रु-मित्र-सम राशी, चलित स्थिति, D9 स्थिति, PN-PB-MB स्थिति, SAV-BAV,षड्बल सहित)

3] अब सभी ग्रहों के संयुक्त प्रभाव का वर्णन कीजिये।
(जो ग्रह D1 में भी मजबूत और बलवान है , वे विशेष रूप से महत्वपूर्ण हैं। और शिक्षा के रूप में अपना अच्छा फल दे सकते हैं।)

4] अब सभी ग्रहों के संयुक्त प्रभाव को जांच कर, उन्हें शिक्षा को प्रभावित करने के क्रम में लगाइए:

Group A - मुख्य प्रभावशाली ग्रह (Core Education Planets):
ये वे ग्रह हैं जो शिक्षा की नींव, दिशा और मुख्य विषय को परिभाषित करते हैं। बच्चे की पूरी पढ़ाई इन्हीं ग्रहों के इर्द-गिर्द घूमेगी।
(उदाहरण: पंचमेश, अमात्यकारक (AmK), 5वें भाव में बैठा कोई बलवान ग्रह, बुध से युति करने वाला ग्रह (BNN), 5वें CSL का नक्षत्र स्वामी, D24 का लग्नेश)।

Group B - मध्यम प्रभावशाली ग्रह (Supporting Planets):
ये ग्रह मुख्य ग्रहों की सहायता करते हैं, शिक्षा में कौशल, अवसर और संसाधन जोड़ते हैं। ये पढ़ाई के माहौल और परिणामों को प्रभावित करते हैं।
(उदाहरण: लग्नेश, आत्मकारक (AK), 4थे/9वें/11वें भाव के स्वामी, नैसर्गिक कारक गुरु/चंद्र, बुध से दूसरे/बारहवें भाव में बैठे ग्रह (BNN), पंचमेश पर दृष्टि डालने वाले ग्रह)।

Group C - सहायक और उत्प्रेरक ग्रह (Trigger/Situational Planets):
ये ग्रह विशेष परिस्थितियों में या अपनी दशा-अंतर्दशा में शिक्षा को प्रभावित करते हैं। ये पढ़ाई में मोड़ या विशेष घटनाओं के कारक बन सकते हैं।
(उदाहरण: पंचमेश का Dispositor, नक्षत्र स्वामी, D24 में अन्य महत्वपूर्ण ग्रह, 9वें भाव का स्वामी, बुध से 3रे/12वें भाव में स्थित ग्रह (BNN))।

आपको प्रदान की गई ग्रहों (Group A/B/C) की सूची और एक बाहरी ज्ञान स्रोत (Education_Fields.txt नामक फाइल) का उपयोग करके कुंडली से निकाले गए शिक्षा के मुख्य प्रभावशाली ग्रहों का विश्लेषण करना है। बच्चे के लिए सबसे उपयुक्त विषयों और शिक्षा क्षेत्रों (Streams) की एक विस्तृत, प्राथमिकता-आधारित (Prioritized) सूची बनानी है। आपका अंतिम लक्ष्य केवल सामान्य क्षेत्र बताना नहीं, बल्कि Education_Fields.txt से विशिष्ट और उपयुक्त विषय/Stream के नाम सुझाना है। आपका उत्तर केवल क्षेत्रों की सूची नहीं होना चाहिए, बल्कि यह समझाना चाहिए कि ग्रहों का संयुक्त प्रभाव उन विषयों की ओर क्यों इशारा करता है। उस फाइल में प्रत्येक ग्रह से जुड़े विषयों और Streams की एक विस्तृत सूची है। आपको अपनी सामान्य जानकारी का भी उपयोग करना है। और उपरोक्त चर्चा में हुए विश्लेषण का भी उपयोग करना है। (विश्लेषण में 'TXT फाइल' का उल्लेख ना करें, यह सिर्फ सन्दर्भ के लिए है)

विश्लेषण की प्रक्रिया (Step-by-Step Analysis Process):

कीवर्ड निकालना: सबसे पहले, Education_Fields.txt फाइल और अपने ज्ञान का उपयोग करके Group A और Group B के सभी ग्रहों के मूल स्वभाव और मुख्य कारकत्व (Keywords) को पहचानें। (जैसे: गुरु = ज्ञान, विज्ञान; बुध = गणित, भाषा, वाणिज्य; मंगल = तकनीक, प्रतिस्पर्धा)।

हाइब्रिड प्रोफाइल बनाना: अलग-अलग ग्रहों के विषयों को सूचीबद्ध करने के बजाय, उनके कीवर्ड्स को मिलाकर एक संयुक्त शिक्षा प्रोफाइल बनाएं। आपको यह सोचना है कि इन ग्रहों की ऊर्जाएं मिलकर किस तरह के विद्यार्थी का निर्माण करती हैं।

(उदाहरण: गुरु (ज्ञान) + बुध (तर्क) + मंगल (प्रतिस्पर्धा) का संयोजन एक ऐसे बच्चे को दर्शाता है जो विज्ञान के विषयों में गहरी समझ रखता है और प्रतियोगी परीक्षाओं के मार्ग से आगे बढ़ेगा।)

विशिष्ट शिक्षा मैपिंग (सबसे महत्वपूर्ण चरण): अब, आपके द्वारा बनाए गए हाइब्रिड प्रोफाइल के आधार पर, Education_Fields.txt फाइल को ध्यान से स्कैन करें। उन विशिष्ट Stream और विषयों के नामों की एक सूची बनाएं जो इस प्रोफाइल से सबसे अधिक मेल खाते हैं। आपको इन नामों को अपने अंतिम उत्तर में शामिल करना अनिवार्य है।

विश्लेषण को परिष्कृत करना: बनाए गए हाइब्रिड प्रोफाइल को उपरोक्त चैट में चर्चा के आधार पर उनकी शक्ति, क्षमता, बल समझकर और सटीक बनाएं।

प्राथमिकता देना: इस गहन विश्लेषण के आधार पर, 3-4 सबसे शक्तिशाली शिक्षा पथों की पहचान करें और उन्हें नीचे दिए गए प्रारूप के अनुसार तीन श्रेणियों (Tiers) में विभाजित करें।
कुल 3 ही शिक्षा पथ देने हैं - प्रत्येक Tier में केवल 1 पथ। चौथा पथ किसी भी Tier में न जोड़ें।

आउटपुट का प्रारूप (Required Output Format):
आपको अपना अंतिम उत्तर निम्नलिखित "श्रेणी प्रणाली" (Tier System) में ही देना है:
प्रतिशत का नियम: प्रत्येक Tier का प्रतिशत उस शिक्षा पथ को Group A और Group B के ग्रहों से मिलने वाले कुल समर्थन के अनुपात में दें। हर Tier की संभावना स्वतंत्र है, इसलिए तीनों का योग 100 होना आवश्यक नहीं है - परंतु Tier 1 का प्रतिशत सबसे अधिक और Tier 3 का सबसे कम होना चाहिए।

आपके लिए शीर्ष शिक्षा पथ: प्राथमिकता और विश्लेषण :

➤ श्रेणी 1: सर्वश्रेष्ठ और सर्वोच्च प्राथमिकता वाले क्षेत्र (Tier 1: Best and Highest Priority Fields)

(यह वह क्षेत्र है जो बच्चे की कुंडली के लगभग सभी मुख्य ग्रहों की ऊर्जा से मेल खाता है और सफलता की सर्वाधिक संभावना रखता है।)

► शिक्षा पथ 1: [Stream/क्षेत्र का नाम, जैसे: विज्ञान (PCM) - इंजीनियरिंग दिशा]

➧ इस पथ में विशिष्ट विषय (Education_Fields.txt के अनुसार): [यहाँ फाइल से 2-4 विशिष्ट नाम लिखें, जैसे: 'भौतिकी', 'रसायन विज्ञान', 'गणित', 'कंप्यूटर विज्ञान']

➧ सफलता की संभावना: [एक प्रतिशत दें, जैसे: 90%]

➧ ज्योतिषीय कारण (क्यों?): यहाँ विस्तार से समझाएं कि Group A और B के ग्रहों का संयुक्त प्रभाव इस शिक्षा पथ का समर्थन कैसे करता है। ग्रहों के संयोजन की कहानी बताएं।

➧ निष्कर्ष: एक या दो वाक्यों में बताएं कि यह क्षेत्र बच्चे के लिए सर्वश्रेष्ठ क्यों है।

➤ श्रेणी 2: मजबूत और द्वितीयक प्राथमिकता वाले क्षेत्र (Tier 2: Strong and Secondary Priority Fields)

(यह वे क्षेत्र हैं जो बहुत मजबूत हैं, लेकिन शायद श्रेणी 1 जितने व्यापक नहीं हैं या किसी विशेष ग्रह संयोजन पर अधिक आधारित हैं।)

► शिक्षा पथ 2: [Stream/क्षेत्र का नाम, जैसे: वाणिज्य (Commerce) - वित्तीय दिशा]

➧ इस पथ में विशिष्ट विषय (Education_Fields.txt के अनुसार): [यहाँ फाइल से 2-4 विशिष्ट नाम लिखें, जैसे: 'अर्थशास्त्र', 'लेखाशास्त्र', 'व्यवसाय अध्ययन']

➧ सफलता की संभावना: [एक प्रतिशत दें, जैसे: 75%]

➧ ज्योतिषीय कारण (क्यों?): समझाएं कि कौन से ग्रह इस क्षेत्र का समर्थन करते हैं और यह श्रेणी 1 से थोड़ा अलग क्यों है।

➧ निष्कर्ष: एक या दो वाक्यों में बताएं कि यह एक मजबूत द्वितीयक विकल्प क्यों है।

➤ श्रेणी 3: विचारणीय या वैकल्पिक क्षेत्र (Tier 3: Considerable or Alternative Fields)

(यह वे क्षेत्र हैं जिनमें क्षमता तो है, लेकिन कुछ सावधानियों की आवश्यकता हो सकती है या वे बच्चे की मुख्य ऊर्जा से थोड़ा हटकर हैं।)

► शिक्षा पथ 3: [Stream/क्षेत्र का नाम, जैसे: मानविकी (Humanities) या कौशल पाठ्यक्रम]

➧ इस पथ में विशिष्ट विषय (Education_Fields.txt के अनुसार): [यहाँ फाइल से 2-4 विशिष्ट नाम लिखें, जैसे: 'मनोविज्ञान', 'इतिहास', 'ललित कला']

➧ सफलता की संभावना: [एक प्रतिशत दें, जैसे: 40% (सावधानियों के साथ)]

➧ ज्योतिषीय कारण (क्यों?): इस क्षेत्र के सकारात्मक और नकारात्मक दोनों ज्योतिषीय पहलुओं को समझाएं। बताएं कि किन शर्तों के तहत इसमें सफलता मिल सकती है।

➧ निष्कर्ष: एक या दो वाक्यों में बताएं कि इसे वैकल्पिक क्यों माना जाना चाहिए।

➢ अंतिम निर्देश: आपका लक्ष्य माता-पिता को स्पष्टता देना है। सिर्फ विकल्प न दें, बल्कि एक विशेषज्ञ की तरह मार्गदर्शन करें कि बच्चे के लिए सबसे अच्छा क्या है और क्यों, और यह भी बताएं कि उस क्षेत्र में कौन से विशिष्ट विषय बच्चे की कुंडली के अनुसार सबसे उपयुक्त हैं।
--------------------------------------------------

उपरोक्त जानकारी में दिए गए मुख्य ग्रहों के संयुक्त प्रभाव और संलग्न Education_Fields.txt फाइल के आधार पर, बच्चे के लिए 10 सबसे उपयुक्त विषयों और Study Fields के नामों की एक सूची बनाएं। (विश्लेषण में 'TXT फाइल' का उल्लेख ना करें, यह सिर्फ सन्दर्भ के लिए है)

बंधन: यह सूची ठीक ऊपर किए गए Tier विश्लेषण से ही बनेगी - कोई नया क्षेत्र या विषय स्वतंत्र रूप से न जोड़ें, ताकि रिपोर्ट के दोनों भाग आपस में मेल खाएं।
क्रम: सूची प्राथमिकता के घटते क्रम में होगी - पहले Tier 1 के विशिष्ट विषय, फिर Tier 2 के विषय, फिर Tier 3 के विषय, इस क्रम से कुल 10 नाम।
प्रारूप: हर नाम के आगे एक पंक्ति में यह लिखें कि कौन से मुख्य ग्रह (Group A/B/C) उस विषय का समर्थन करते हैं। केवल नामों की नंगी सूची न दें।
यदि तीनों Tiers के विषयों से 10 नाम पूरे न हों, तो शेष नाम उन्हीं Tier क्षेत्रों के निकटतम विषयों से लें - नया क्षेत्र न खोलें।
--------------------------------------------------
शिक्षा में बाधा पहचान: नीचे दिए गए बिंदुओं की जांच बच्चे की शिक्षा के मुख्य ग्रहों (पंचमेश, बुध, गुरु) पर कीजिए -

1. मारक-बाधक पहचान (Identification):

मारक पहचान: क्या यह ग्रह द्वितीयेश (2nd lord) या सप्तमेश (7th lord) होकर मारकेश की भूमिका में है? यदि हाँ, तो कौन सी - द्वितीयेश (सामान्य मारक) या सप्तमेश (प्रबल मारक)?

बाधक पहचान: क्या यह ग्रह लग्न के स्वभाव (चर, स्थिर, द्विस्वभाव) के अनुसार बाधक भाव (11वें, 9वें, या 7वें) का स्वामी है?

दोहरी भूमिका: क्या यह ग्रह मारक और बाधक दोनों की भूमिका निभा रहा है? (विशेषकर द्विस्वभाव लग्न के लिए सप्तमेश के रूप में)।

कार्यात्मक शुभता: इसके विपरीत, क्या यह ग्रह केंद्र/त्रिकोण का स्वामी होकर एक शुभ 'योगकारक' ग्रह है? या केवल एक त्रिकोण का स्वामी होकर अत्यंत शुभ है?

2. नकारात्मकता/सकारात्मकता की तीव्रता का आकलन (Assessing the Intensity):

पापी ग्रहों का प्रभाव: क्या इस ग्रह पर नैसर्गिक पाप ग्रहों (शनि, मंगल, राहु, केतु) की दृष्टि है या वह उनके साथ युति में है? यदि हाँ, तो यह पढ़ाई में उसकी बाधा को कैसे बढ़ा रहा है?

शुभ ग्रहों का प्रभाव: क्या इस ग्रह पर नैसर्गिक शुभ ग्रहों (गुरु, शुक्र, शुभ बुध) की दृष्टि है या वह उनके साथ है? क्या इससे मारक/बाधक प्रभाव में कोई कमी या सुरक्षा (Mitigation) मिल रही है?

भाव स्थिति: यह ग्रह कुंडली के किस भाव में स्थित है? क्या यह त्रिक भावों (6, 8, 12) में बैठकर और अधिक अशुभ हो गया है, या केंद्र/त्रिकोण में बैठकर इसकी स्थिति कुछ बेहतर है?

राशि बल: क्या यह ग्रह अपनी नीच राशि में होकर अत्यंत पीड़ित है या अपनी उच्च/स्वयं की राशि में होकर इसकी नकारात्मकता में कमी आ रही है? अथवा अधिक शक्तिशाली और प्रभावी हो गई है?


3. सक्रियकरण और संभावित फल (Activation and Potential Results):

दशा सक्रियकरण: इस ग्रह की महादशा या अंतर्दशा में पढ़ाई में किस प्रकार की बाधाएं या परेशानियां (ध्यान भंग, विषय से अरुचि, परीक्षा में असफलता, school बदलना आदि) देखने को मिल सकती हैं?

गोचर का प्रभाव: जब शनि या राहु जैसे बड़े ग्रह गोचर में इस मारक/बाधक ग्रह के ऊपर से गुजरते हैं, तो क्या यह इसके नकारात्मक फलों को सक्रिय कर सकते हैं?
प्रभावित क्षेत्र: यह ग्रह अपने नैसर्गिक कारकत्व (जैसे बुध - बुद्धि/वाणी, चंद्र - मन/स्मरण, गुरु - ज्ञान/शिक्षक) और अपने भाव स्वामित्व के आधार पर शिक्षा के किन विशिष्ट क्षेत्रों को सबसे अधिक प्रभावित करेगा?

4. समग्र निष्कर्ष (Overall Conclusion):
अंतिम मूल्यांकन: उपरोक्त सभी बिंदुओं का विश्लेषण करने के बाद, इस ग्रह को शिक्षा के लिए एक कार्यात्मक अशुभ ग्रह के रूप में 1 से 10 के पैमाने पर कितनी रेटिंग देंगे? (जहाँ 1 बहुत हल्का और 10 अत्यंत हानिकारक हो)।

5. परामर्श और उपाय (Counseling and Remedies)
(यह खंड इस बात पर केंद्रित है कि "चुनौती" (Step 1-4 में पहचानी गई) का प्रबंधन कैसे किया जाए।)

5.1. ज्योतिषीय शांति उपाय (Astrological Pacification):

मंत्र/जाप: क्या इस ग्रह (या इसके अधिपति देवता) के बीज मंत्र या वैदिक मंत्र का जाप शांति के लिए आवश्यक है?

स्तोत्र: क्या दशा-अंतर्दशा के दौरान किसी विशिष्ट स्तोत्र (जैसे, बुध के लिए 'विष्णु सहस्रनाम' या गुरु के लिए 'गुरु स्तोत्र') का पाठ करना सुरक्षात्मक होगा?

दान: इस ग्रह के नकारात्मक प्रभाव को शांत करने के लिए किन वस्तुओं का दान (रंग, अनाज, धातु) और कब (किस दिन) करना चाहिए?

5.2. रत्न और धारण (Gems and Wearing) - [सबसे महत्वपूर्ण सावधानी]:

रत्न निषेध: क्या यह ग्रह (मारक/बाधक होने के कारण) उन ग्रहों में से है जिनका रत्न किसी भी हालत में बच्चे को धारण नहीं करना चाहिए? (स्पष्ट रूप से लिखें: क्योंकि एक बलवान मारकेश का रत्न पहनना "शक्तिशाली शत्रु को और शक्ति देना" है।)

वैकल्पिक धारण: क्या इस ग्रह को शांत करने के बजाय, कुंडली के 'रक्षक' ग्रह (जैसे लग्नेश या नवमेश) का रत्न पहनना बेहतर उपाय होगा?

5.3. व्यवहारगत उपाय (Behavioral Remedies / The Counseling):

चेतना (Awareness): माता-पिता को इस ग्रह के नकारात्मक स्वभाव के बारे में कैसे सचेत करना है? (जैसे: "बच्चे का बुध ही बाधक है, इसलिए पढ़ाई में जल्दबाजी की जगह दोहराव और लिखकर अभ्यास कराना होगा।")

परिवर्तन (Modification): बच्चे की पढ़ने की किन आदतों को बदलना होगा? (जैसे: "बच्चे का चंद्र मन को भटकाता है, इसलिए पढ़ाई छोटे-छोटे सत्रों में और निश्चित समय पर करानी होगी।")

5.4. आध्यात्मिक/कार्मिक उपाय (Spiritual/Karmic Remedies):

कर्म का पाठ (Karmic Lesson): यह ग्रह बच्चे को जीवन में क्या 'कार्मिक सबक' सिखाने आया है? (जैसे: 'धैर्य' या 'अनुशासन' का सबक)।

ऊर्जा का रूपांतरण (Energy Channeling): क्या बच्चे इस ग्रह की नकारात्मक ऊर्जा को एक उच्च उद्देश्य के लिए उपयोग कर सकता है? (जैसे: 'बाधक' शनि की ऊर्जा को 'नियमित अभ्यास और अनुशासन' में लगाना)।

क्या आप तैयार है, शिक्षा का विश्लेषण करने के लिए, सिर्फ इतना बताईये.

उपरोक्त चैट और पीडीएफ की और शुरू से आपको दी गयी सभी जानकारी के आधार पर निम्मलिखित सवालों का गहन और विस्तार से विश्लेषण करके निष्कर्ष सहित देना है, ध्यान रहे विश्लेषण संदर्भ के आलावा भी अपने बुद्धि का उपयोग करते हुए आवश्यकता अनुसार ज्योतिष ज्योतिष प्रणाली का उपयोग करते हुए होनी चाहिए।

तो पहला सवाल दू ?

वरील माहितीच्या आधारे तुम्हाला एका तज्ञ ज्योतिषाची भूमिका निभवायची आहे आणि सांगायचे आहे की ही कुंडली 'अभ्यासू मुलगा' ची आहे की 'अभ्यासात कमकुवत मुलगा' ची आहे की 'उशिरा पुढे येणाऱ्या मुला' ची आहे - ज्याचे मन लहान वयातील शिक्षणाच्या वेळी अभ्यासात लागत नाही, पण पुढे जाऊन त्याची बुद्धी आणि समज खूप तीक्ष्ण होते.

1] पहिली पायरी: लग्न आणि लग्नेशाचे बळ (क्षमता)
(शिक्षण पाहण्याआधी मुलाचे व्यक्तिमत्त्व आणि संघर्ष करण्याची शक्ती पाहणे सर्वात महत्त्वाचे आहे.)

➤ लग्नेशाच्या स्थितीचे विश्लेषण करा (राशी, भाव, युती, अवस्था {उच्च/नीच/नीचभंग, अस्त-वक्री} आणि बळ).
➤ लग्नेश पीडित आहे का (6, 8, 12 भावांमध्ये किंवा क्रूर ग्रहांच्या प्रभावाखाली)?
➤ मुलात अभ्यासासाठी आवश्यक इच्छाशक्ती आणि धैर्य आहे का?

➢ विश्लेषण: लग्नेश जर बळवान असेल तर मुलगा संघर्षाशी झुंजून अभ्यासात वर येईल. लग्नेश दुर्बल असेल तर पंचम भाव कितीही चांगला असला तरी मुलगा त्याचा पूर्ण लाभ घेऊ शकत नाही.

2] दुसरी पायरी: पंचम भाव आणि पंचमेश (विद्येचे स्वरूप)
(बुद्धी आणि शिक्षणाची दिशा जाणण्यासाठी.)

➤ पंचम भावात बसलेले ग्रह कसे आहेत : हे ग्रह अभ्यासाचे प्रारंभिक स्वरूप ठरवतात.
➤ पंचमेशाच्या स्थितीचे (राशी, भाव, युती, अवस्था {उच्च/नीच/नीचभंग, अस्त-वक्री} आणि बळ) आणि शक्तीचे विश्लेषण करा.
➤ पंचमेश पीडित आहे का (6, 8, 12 भावांमध्ये किंवा क्रूर ग्रहांच्या प्रभावाखाली)?
➤ पंचमेशाची स्थिती: पंचमेश कुठे बसला आहे? (जसे: पंचमेश तृतीय भावात असेल तर मुलगा स्वतःच्या प्रयत्नांनी आणि स्पर्धेने शिकेल).
➤ पंचम भावावर दृष्टी: कोणत्या ग्रहांच्या दृष्टी आहेत आणि त्या अभ्यासाला कसे बनवतात?
➤ चतुर्थ भाव आणि चतुर्थेशाची स्थितीही पहा - प्रारंभिक शिक्षणाचा पाया आणि घरचे वातावरण कसे आहे?

➢ विश्लेषण: पंचमेश आणि चतुर्थेश दोन्ही बळवान असतील तर मुलगा जन्मतः अभ्यासू आहे. पंचम भाव मजबूत पण चतुर्थ कमकुवत असेल तर समज चांगली पण school ची सुरुवात हळू राहते.

3] तिसरी पायरी: बुध, गुरु, चंद्र आणि D24 (बुद्धीचे खरे स्वरूप)
➤ बुधाची स्थिती आणि अवस्था पहा - विशेषतः बुध वक्री (Retrograde) आहे की नाही? वक्री बुध पाठांतराच्या अभ्यासात जमत नाही, त्याचे मन वेगळ्या पद्धतीने विचार करते, म्हणूनच लहान वयात मन अभ्यासात लागत नाही; पण वय वाढते तशीच बुध खोल समज आणि तीक्ष्ण बुद्धी देतो.
➤ गुरु (ज्ञान) आणि चंद्र (मन, स्मरण, एकाग्रता) यांची स्थिती आणि बळ पहा.
➤ D24 (चतुर्विंशांश) मध्ये लग्नेश, पंचमेश, बुध आणि गुरु यांच्या स्थितीने विद्येची अंतिम पातळी तपासा.

➢ विश्लेषण: बुध, गुरु किंवा पंचमेश बळवान असतील पण त्यांच्या दशा school च्या वर्षांनंतर येत असतील, तर हे उशिरा पुढे येणाऱ्या मुलाचे स्पष्ट लक्षण आहे.

4] चौथी पायरी: school वर्षांची (वय 5-18) दशा तपासणी (उशिरा बहर ओळखणे)
➤ वयाच्या 5 ते 18 वर्षांदरम्यान कोणत्या महादशा-अंतर्दशा चालतील? ते दशा-स्वामी शिक्षणाला अनुकूल आहेत की अडथळा आणणारे?
➤ वयाच्या 18 वर्षांनंतर येणारी दशा कोणत्या ग्रहाची आहे? ती बुध, गुरु, पंचमेश किंवा लग्नेशाशी जोडलेली आहे का?

5] पाचवी पायरी: अमात्यकारक (AmK) आणि मंत्रपद (A5) (जैमिनी ज्योतिष)
(शिक्षणाच्या दिशेचे सूक्ष्म विश्लेषण)

➤ अमात्यकारकाची (AmK) स्थिती काय आहे? तो शिक्षणाच्या कोणत्या क्षेत्राकडे इशारा करतो?
➤ मंत्रपदाची (A5) स्थिती काय आहे? त्यावर शुभ किंवा पाप ग्रहांचा प्रभाव कसा आहे?

➢ विश्लेषण: AmK मुलाच्या शिक्षणाच्या दिशेचा आणि मार्गदर्शकाचा कारक दर्शवतो. AmK बुध, गुरु किंवा पंचमेशाशी जोडलेला असेल तर अभ्यासाची दिशा स्पष्ट आणि मजबूत असते, आणि A5 मजबूत असेल तर विद्येत ख्याती मिळते.

6] सहावी पायरी: षड्बल आणि अष्टकवर्ग
(भावांचे बळ)

➤ अष्टकवर्गात चतुर्थ, पंचम आणि नवम भावांच्या बिंदूंची तुलना करा.
➤ पंचमेश, चतुर्थेश आणि लग्नेशाचा षड्बल स्कोअर कसा आहे?

➢ विश्लेषण: बळ आणि क्षमतेचे विश्लेषण - हे बिंदू निश्चित करतील की शिक्षणाचे योग फक्त कागदावर मजबूत आहेत की प्रत्यक्ष फळ देण्याची क्षमता देखील आहे.

➢ अंतिम निर्णय (Final Verdict): वरील सर्व पायऱ्यांच्या आधारे स्पष्ट निर्णय द्या -
(a) कुंडली अभ्यासू मुलाची आहे, किंवा
(b) कुंडली अभ्यासात कमकुवत मुलाची आहे, किंवा
(c) कुंडली उशिरा पुढे येणाऱ्या मुलाची आहे - या स्थितीत हे देखील सांगावे की कोणत्या वयापासून किंवा कोणत्या दशेपासून मुलाचे मन अभ्यासात लागू लागेल आणि बुद्धी तीक्ष्ण होईल.
निर्णयासोबत टक्केवारीत विश्वास (Confidence) देखील द्या.
--------------------------------------------------

वरील कुंडली आणि अष्टकवर्ग माहितीच्या आधारे तुम्हाला एका तज्ञ ज्योतिषाची भूमिका निभवायची आहे. तुमचे कार्य हे विश्लेषण करणे आहे की आधुनिक काळानुसार मुलासाठी कोणता शिक्षण मार्ग (नियमित शैक्षणिक, स्पर्धा परीक्षा-केंद्रित, कौशल्य/तांत्रिक आधारित, किंवा कला/खेळ आधारित) सर्वात यशस्वी ठरेल.
(टीप: विश्लेषणापूर्वी मुलाचे 'लग्न' ओळखा जेणेकरून पंचमेश अचूकपणे शोधता येईल).

➤ विश्लेषणाची प्रक्रिया (Step-by-Step Process):

► 1. सर्वाष्टकवर्गाचे (SAV) "अंतर-आधारित" तुलनात्मक विश्लेषण (Gap-Based Logic):
शिक्षणाची अचूक दिशा ठरवण्यासाठी भावांमधील फरक (Gap) पहा:
Gap ची कसोटी: फरक 0-2 = दोन्ही भाव समान (मिश्र फळ), फरक 3-5 = नंतरच्या भावाकडे स्पष्ट कल, फरक 6 किंवा अधिक = नंतरचा भाव निर्णायकरीत्या मजबूत. सर्व तुलना याच कसोटीवर करा.
A] चतुर्थ (प्रारंभिक शिक्षण/घर) विरुद्ध पंचम (बुद्धी/मुख्य शिक्षण): दोघांपैकी कोण मजबूत आहे आणि दोघांच्या बिंदूंमध्ये किती फरक (Gap) आहे ते पहा.
B] पंचम (पारंपरिक अभ्यास) विरुद्ध तृतीय (धाडस/स्पर्धा/डिजिटल/स्वयं-प्रयत्न): मुलाला नियमित अभ्यास बसेल की स्पर्धा आणि स्वयं-प्रयत्नांची दिशा ते पहा.
C] एकादश (यश/लाभ): यशाचा (एकादश) कल कोणत्या बाजूला आहे ते पहा - शैक्षणिक, स्पर्धात्मक की कौशल्य.
एकादश भावाचा कल असा ठरवा - एकादशेशाची (एकादश भावाचा स्वामी) स्थिती आणि संबंध पहा: एकादशेश पंचम भाव, पंचमेश किंवा गुरु यांच्याशी जोडलेला असेल तर यश शैक्षणिक अभ्यासातून मिळेल; एकादशेश षष्ठ भाव, षष्ठेश किंवा मंगळ यांच्याशी जोडलेला असेल तर यश स्पर्धा परीक्षांतून मिळेल; एकादशेश तृतीय भाव किंवा शुक्र/शनि यांच्याशी जोडलेला असेल तर यश कौशल्य, कला किंवा तांत्रिक क्षेत्रातून मिळेल.

► 2. अचूक शिक्षण मार्गाची ओळख (Micro-Niche):
खाली दिलेल्या नियमांच्या आधारे मुलाचा अचूक शिक्षण मार्ग ठरवा:
- नियमित शैक्षणिक मार्ग (Regular Academic Path): जर पंचम भाव खूप मजबूत (28+) असेल आणि नवम भावही मजबूत असेल. (मुलगा school पासून विद्यापीठापर्यंत सरळ अभ्यासात यशस्वी होईल).
- स्पर्धा परीक्षा-केंद्रित मार्ग (Competitive Exam-Centred Path): जर षष्ठ भाव मजबूत (पंचमाच्या समान किंवा अधिक) असेल आणि एकादश भावही मजबूत असेल. (मुलगा स्पर्धेत पुढे जाईल - JEE/NEET/Olympiad सारख्या परीक्षा).
- कौशल्य / तांत्रिक मार्ग (Skill / Technical Path): जर तृतीय भाव खूप मजबूत (28+) असेल आणि बुध किंवा शनि यांचा प्रबळ प्रभाव असेल. (मुलगा diploma, तांत्रिक किंवा कौशल्य-आधारित पाठ्यक्रमांत चमकेल).
- कला / खेळ आधारित मार्ग (Art / Sports Based Path): जर पंचम भावावर शुक्र किंवा मंगळ यांचा प्रबळ प्रभाव असेल आणि तृतीय भावही मजबूत असेल. (मुलाची मुख्य दिशा कला, संगीत किंवा खेळाकडे जाईल).
प्राधान्य क्रम: एकापेक्षा अधिक नियम एकत्र लागू होत असतील तर या क्रमाने ठरवा - पहिले चतुर्थ विरुद्ध पंचम भावांचा Gap (मुख्य दिशा: पाया की बुद्धी), मग पंचम भावाचे बळ (नियमित अभ्यास की पर्यायी कल), मग तृतीय भावाचे बळ (स्वयं-प्रयत्न/स्पर्धा/कौशल्य कल). शेवटी BAV समर्थनाने निर्णय निश्चित करा.

► 3. भिन्नाष्टकवर्गाचे (BAV) सहायक विश्लेषण (Supportive Triggers):
A] बुध (बुद्धी कारक): बुधाचा पंचम भावातील स्कोअर (4+ शुभ आहे).
B] गुरु (ज्ञान कारक): गुरुचा पंचम आणि नवम भावांतील स्कोअर (4+ शुभ आहे).
C] पंचमेश: लग्नानुसार पंचमेश ओळखा आणि त्याचा पंचम भावातील स्कोअर पहा.
(टीप: BAV फक्त सहायक आहे, अंतिम निर्णय फक्त SAV च्या Gap वरच अवलंबून असेल).

► 4. भावाची शुभता (Bhava Shubhta - 28 बिंदू नियम):
अष्टकवर्गाच्या प्रामाणिक नियमानुसार कोणत्याही भावातील 28 बिंदू सरासरी मानले जातात.
- चतुर्थ, पंचम, नवम आणि एकादश भावांचे बिंदू या नियमावर तोला.
- 28 किंवा अधिक बिंदू भावाला शुभ आणि फळ देण्यास सोपे बनवतात. 28 पेक्षा कमी बिंदू संघर्ष (अडचण) दर्शवतात. कोणत्या क्षेत्रात सोपेपणा आणि कोणत्या क्षेत्रात संघर्ष आहे ते सांगा.
विशेष टीप: षष्ठ भाव स्पर्धेचा भाव आहे - त्याचे 28 किंवा अधिक बिंदू स्पर्धा परीक्षांत संधी आणि फळ मिळण्याची सोपेपणा दर्शवतात, 'शुभ' शब्दाचा अर्थ येथे याच अर्थाने घ्या.

➤ आउटपुट स्वरूप (Output Format):

1] SAV अंतर-आधारित विश्लेषण (Gap-Based Analysis):
- चतुर्थ विरुद्ध पंचम (फरक आणि विजेता):
- पंचम विरुद्ध तृतीय (फरक आणि विजेता):
- एकादश भावाचे समर्थन:

2] भावाची शुभता (28 बिंदू नियमानुसार):
- चतुर्थ (प्रारंभिक शिक्षण): [बिंदू] - [शुभ/संघर्षमय]
- पंचम (विद्या): [बिंदू] - [शुभ/संघर्षमय]

1] आता आधी काढलेल्या सर्व ग्रहांची यादी बनवा.
(या यादीत वारंवार येणारे ग्रह विशेष महत्त्वाचे आहेत.)

2] आता यादीतील ग्रहांचे D1 बळ मोजा.
(त्यांचे अस्त, वक्री, नीच-नीचभंग, वर्गोत्तम, शत्रु-मित्र-सम राशी, चलित स्थिती, D9 स्थिती, PN-PB-MB स्थिती, SAV-BAV, षड्बल यांसह)

3] आता सर्व ग्रहांचा एकत्रित प्रभाव वर्णन करा.
(D1 मध्ये देखील मजबूत आणि शक्तिशाली ग्रह विशेष महत्त्वाचे आहेत. आणि आपले चांगले परिणाम शिक्षणाच्या स्वरूपात देऊ शकतात.)

4] आता सर्व ग्रहांचा एकत्रित प्रभाव तपासून, त्यांना शिक्षणावर प्रभाव टाकण्याच्या क्रमाने मांडा :

गट A - मुख्य प्रभावशाली ग्रह (Core Education Planets) :
हे ते ग्रह आहेत जे शिक्षणाचा पाया, दिशा आणि मुख्य विषय निश्चित करतात. मुलाचा संपूर्ण अभ्यास याच ग्रहांभोवती फिरेल.
(उदा: पंचमेश, अमात्यकारक (AmK), पंचम भावात बसलेला बलवान ग्रह, बुधाशी युती करणारा ग्रह (BNN), पंचम CSL चा नक्षत्र स्वामी, D24 चा लग्नेश).

गट B - मध्यम प्रभावशाली ग्रह (Supporting Planets) :
हे ग्रह मुख्य ग्रहांना मदत करतात, शिक्षणात कौशल्य, संधी आणि संसाधने जोडतात. हे अभ्यासाच्या वातावरणावर आणि परिणामांवर प्रभाव टाकतात.
(उदा: लग्नेश, आत्मकारक (AK), चतुर्थ/नवम/एकादश भावांचे स्वामी, नैसर्गिक कारक गुरु/चंद्र, बुधापासून दुसऱ्या/बाराव्या भावात बसलेले ग्रह (BNN), पंचमेशावर दृष्टी टाकणारे ग्रह).

गट C - सहायक आणि उत्प्रेरक ग्रह (Trigger/Situational Planets) :
हे ग्रह विशेष परिस्थितीत किंवा त्यांच्या दशा-अंतर्दशेत शिक्षणावर प्रभाव टाकतात. हे अभ्यासात वळण किंवा विशेष घटनेचे कारण बनू शकतात.
(उदा: पंचमेशाचा डिस्पॉझिटर, नक्षत्र स्वामी, D24 मधील इतर महत्त्वाचे ग्रह, नवम भावाचा स्वामी, बुधापासून तिसऱ्या/बाराव्या भावात बसलेले ग्रह (BNN)).
--------------------------------------------------

तुम्हाला दिलेली ग्रहांची यादी (गट A/B/C) आणि बाह्य ज्ञान स्रोताचा (Education_Fields.txt नावाची फाइल) वापर करून, तुम्हाला कुंडलीतून काढलेल्या शिक्षणाच्या मुख्य प्रभावशाली ग्रहांचे विश्लेषण करायचे आहे. मुलासाठी सर्वात योग्य विषयांची आणि शिक्षण क्षेत्रांची (Streams) तपशीलवार, प्राधान्य-आधारित यादी बनवायची आहे. तुमचे अंतिम ध्येय फक्त सामान्य क्षेत्रे सांगणे नाही, तर Education_Fields.txt मधून विशिष्ट आणि योग्य विषय/Stream ची नावे सुचवणे आहे. तुमचे उत्तर फक्त क्षेत्रांची यादी नसावे, तर ग्रहांचा एकत्रित प्रभाव त्या विषयांकडे का निर्देश करतो हे देखील स्पष्ट करावे. त्या फाइलमध्ये प्रत्येक ग्रहाशी संबंधित विषयांची आणि Streams ची तपशीलवार यादी आहे. तुम्ही तुमच्या सामान्य ज्ञानाचा देखील वापर करायचा आहे. आणि वरील चर्चेत झालेले विश्लेषण देखील वापरायचे आहे. (विश्लेषणात 'TXT फाइल'चा उल्लेख करू नका, ती फक्त संदर्भासाठी आहे)

विश्लेषणाची प्रक्रिया (Step-by-Step Analysis Process):

मुख्य शब्द काढणे (Extracting Keywords): सर्वात आधी, Education_Fields.txt फाइल आणि तुमच्या ज्ञानाचा वापर करून, गट A आणि गट B च्या सर्व ग्रहांचा मूळ स्वभाव आणि मुख्य कारकत्व (Keywords) ओळखा. (जसे: गुरु = ज्ञान, विज्ञान; बुध = गणित, भाषा, वाणिज्य; मंगळ = तंत्र, स्पर्धा).

हायब्रिड प्रोफाइल बनवणे (Making the Hybrid Profile): वेगवेगळ्या ग्रहांचे विषय स्वतंत्रपणे यादी करण्याऐवजी, त्यांचे मुख्य शब्द मिसळून एक संयुक्त शिक्षण प्रोफाइल बनवा. या ग्रहांच्या ऊर्जा एकत्र येऊन कोणत्या प्रकारचा विद्यार्थी बनवतात याचा विचार तुम्हाला करायचा आहे.

(उदा: गुरु (ज्ञान) + बुध (तर्क) + मंगळ (स्पर्धा) यांचे संयोजन असा मुलगा दर्शवते ज्याला विज्ञान विषयांमध्ये खोल समज आहे आणि तो स्पर्धा परीक्षांच्या मार्गाने पुढे जाईल.)

विशिष्ट शिक्षण मॅपिंग (Specific Education Mapping - सर्वात महत्त्वाचे चरण): आता, तुम्ही बनवलेल्या हायब्रिड प्रोफाइलच्या आधारे, Education_Fields.txt फाइल काळजीपूर्वक स्कॅन करा. त्या विशिष्ट Stream आणि विषयांच्या नावांची यादी बनवा जी या प्रोफाइलशी सर्वात जास्त जुळतात. तुम्ही ही नावे तुमच्या अंतिम उत्तरात समाविष्ट करणे अनिवार्य आहे.

विश्लेषण अधिक अचूक करणे (Refining the Analysis): वरील चॅटमधील चर्चेच्या आधारे त्यांचे बळ, क्षमता आणि शक्ती समजून बनवलेले हायब्रिड प्रोफाइल अधिक अचूक करा.

प्राधान्य देणे (Giving Priority): या सखोल विश्लेषणाच्या आधारे, 3-4 सर्वात शक्तिशाली शिक्षण मार्ग ओळखा आणि त्यांना खाली दिलेल्या स्वरूपानुसार तीन श्रेणींमध्ये (Tiers) विभागा.
एकूण फक्त 3 शिक्षण मार्ग द्यायचे आहेत - प्रत्येक Tier मध्ये फक्त 1 मार्ग. कोणत्याही Tier मध्ये चौथा मार्ग जोडू नका.

आउटपुट स्वरूप (Required Output Format):
तुम्हाला तुमचे अंतिम उत्तर खालील "Tier System" मध्येच द्यायचे आहे:
टक्केवारीचा नियम: प्रत्येक Tier ची टक्केवारी त्या शिक्षण मार्गाला गट A आणि गट B च्या ग्रहांकडून मिळणाऱ्या एकूण समर्थनाच्या प्रमाणात द्या. प्रत्येक Tier ची शक्यता स्वतंत्र आहे, त्यामुळे तिघांची बेरीज 100 होणे आवश्यक नाही - पण Tier 1 ची टक्केवारी सर्वात जास्त आणि Tier 3 ची सर्वात कमी असली पाहिजे.

तुमच्यासाठी शीर्ष शिक्षण मार्ग: प्राधान्य आणि विश्लेषण :

➤ श्रेणी 1: सर्वोत्तम आणि सर्वोच्च प्राधान्य क्षेत्रे (Tier 1: Best and Highest Priority Fields)

(हे ते क्षेत्र आहे जे मुलाच्या कुंडलीतील जवळजवळ सर्व मुख्य ग्रहांच्या ऊर्जेशी जुळते आणि यशाची जास्तीत जास्त शक्यता बाळगते.)

► शिक्षण मार्ग 1: [Stream/क्षेत्राचे नाव, जसे: Science (PCM) - Engineering दिशा]

➧ या मार्गातील विशिष्ट विषय (Education_Fields.txt नुसार): [येथे फाइलमधून 2-4 विशिष्ट नावे लिहा, जसे: 'Physics', 'Chemistry', 'Mathematics', 'Computer Science']

➧ यशाची शक्यता: [एक टक्केवारी द्या, जसे: 90%]

➧ ज्योतिषीय कारण (का?): गट A आणि B च्या ग्रहांचा एकत्रित प्रभाव या शिक्षण मार्गाला कसा समर्थन देतो हे येथे विस्ताराने स्पष्ट करा. ग्रहांच्या मेळाची गोष्ट सांगा.

➧ निष्कर्ष: हे क्षेत्र मुलासाठी सर्वोत्तम का आहे हे एक-दोन वाक्यांत सांगा.

➤ श्रेणी 2: मजबूत आणि दुय्यम प्राधान्य क्षेत्रे (Tier 2: Strong and Secondary Priority Fields)

(ही ती क्षेत्रे आहेत जी खूप मजबूत आहेत, पण कदाचित श्रेणी 1 इतकी व्यापक नाहीत किंवा अधिक एखाद्या विशेष ग्रह-मेळावर आधारित आहेत.)

► शिक्षण मार्ग 2: [Stream/क्षेत्राचे नाव, जसे: Commerce - Financial दिशा]

➧ या मार्गातील विशिष्ट विषय (Education_Fields.txt नुसार): [येथे फाइलमधून 2-4 विशिष्ट नावे लिहा, जसे: 'Economics', 'Accountancy', 'Business Studies']

➧ यशाची शक्यता: [एक टक्केवारी द्या, जसे: 75%]

➧ ज्योतिषीय कारण (का?): कोणते ग्रह या क्षेत्राला समर्थन देतात आणि ते श्रेणी 1 पेक्षा थोडे वेगळे का आहे हे स्पष्ट करा.

➧ निष्कर्ष: हा मजबूत दुय्यम पर्याय का आहे हे एक-दोन वाक्यांत सांगा.

➤ श्रेणी 3: विचार करण्यायोग्य किंवा पर्यायी क्षेत्रे (Tier 3: Considerable or Alternative Fields)

(ही ती क्षेत्रे आहेत ज्यांमध्ये क्षमता आहे, पण काही सावधगिरीची गरज पडू शकते किंवा ती मुलाच्या मुख्य ऊर्जेपासून थोडी दूर आहेत.)

► शिक्षण मार्ग 3: [Stream/क्षेत्राचे नाव, जसे: Humanities किंवा Skill अभ्यासक्रम]

➧ या मार्गातील विशिष्ट विषय (Education_Fields.txt नुसार): [येथे फाइलमधून 2-4 विशिष्ट नावे लिहा, जसे: 'Psychology', 'History', 'Fine Arts']

➧ यशाची शक्यता: [एक टक्केवारी द्या, जसे: 40% (सावधगिरीसह)]

➧ ज्योतिषीय कारण (का?): या क्षेत्राचे सकारात्मक आणि नकारात्मक दोन्ही ज्योतिषीय पैलू स्पष्ट करा. कोणत्या परिस्थितीत यात यश मिळू शकते ते सांगा.

➧ निष्कर्ष: हा पर्याय म्हणून का विचारात घ्यावा हे एक-दोन वाक्यांत सांगा.

➢ अंतिम सूचना: तुमचे ध्येय पालकांना स्पष्टता देणे आहे. फक्त पर्याय देऊ नका, तर मुलासाठी सर्वात चांगले काय आहे आणि का आहे याबाबत तज्ञाप्रमाणे मार्गदर्शन करा, आणि त्या क्षेत्रात कोणते विशिष्ट विषय मुलाच्या कुंडलीनुसार सर्वात योग्य आहेत हे देखील सांगा.
--------------------------------------------------

वरील माहितीत दिलेल्या मुख्य ग्रहांच्या एकत्रित प्रभावाच्या आणि जोडलेल्या Education_Fields.txt फाइलच्या आधारे, मुलासाठी सर्वात योग्य अशा 10 विषयांची आणि Study Fields ची नावे यादी बनवा. (विश्लेषणात 'TXT फाइल'चा उल्लेख करू नका, ती फक्त संदर्भासाठी आहे)

बंधन: ही यादी वर केलेल्या त्याच Tier विश्लेषणातून बनवायची आहे - कोणतेही नवे क्षेत्र किंवा विषय स्वतंत्रपणे जोडू नका, जेणेकरून अहवालाचे दोन्ही भाग एकमेकांशी जुळतील.
क्रम: यादी प्राधान्याच्या उतरत्या क्रमाने असेल - आधी Tier 1 चे विशिष्ट विषय, मग Tier 2 चे विषय, मग Tier 3 चे विषय, अशा क्रमाने एकूण 10 नावे.
स्वरूप: प्रत्येक नावासमोर, कोणते मुख्य ग्रह (गट A/B/C) त्या विषयाला समर्थन देतात हे एका ओळीत लिहा. फक्त नावांची ओसाड यादी देऊ नका.
जर तिन्ही Tiers च्या विषयांमधून 10 नावे पूर्ण होत नसतील, तर उरलेली नावे त्याच Tier क्षेत्रांच्या जवळच्या विषयांमधून घ्या - नवे क्षेत्र उघडू नका.
--------------------------------------------------
शिक्षणातील अडथळा ओळख (Obstruction Identification): मुलाच्या शिक्षणाच्या मुख्य ग्रहांवर (पंचमेश, बुध, गुरु) खालील बिंदू तपासा -

1. मारक-बाधक ओळख (Identification):

मारक ओळख (Maraka Identification): हा ग्रह द्वितीयेश किंवा सप्तमेश होऊन मारकेशाची भूमिका बजावतो का? हो असेल तर कोणता - द्वितीयेश (सामान्य मारक) की सप्तमेश (प्रबळ मारक)?

बाधक ओळख (Badhaka Identification): हा ग्रह लग्नाच्या स्वभावानुसार (चर, स्थिर, द्विस्वभाव) बाधक भावाचा (एकादश, नवम किंवा सप्तम) स्वामी आहे का?

दुहेरी भूमिका (Dual Role): हा ग्रह मारक आणि बाधक दोन्हींची भूमिका बजावतो का? (विशेषतः द्विस्वभाव लग्नासाठी सप्तमेश म्हणून).

कार्यात्मक शुभता (Functional Auspiciousness): याउलट, हा ग्रह केंद्र/त्रिकोणाचा स्वामी होऊन शुभ 'योगकारक' ग्रह आहे का? किंवा फक्त त्रिकोणाचा स्वामी होऊन अत्यंत शुभ आहे का?

2. नकारात्मकता/सकारात्मकतेच्या तीव्रतेचे मूल्यांकन:

पाप ग्रहांचा प्रभाव: या ग्रहावर नैसर्गिक पाप ग्रहांची (शनि, मंगळ, राहु, केतू) दृष्टी आहे किंवा तो त्यांच्यासोबत युतीत आहे का? हो असेल तर तो अभ्यासातील अडथळा कसा वाढवत आहे?

शुभ ग्रहांचा प्रभाव: या ग्रहावर नैसर्गिक शुभ ग्रहांची (गुरु, शुक्र, शुभ बुध) दृष्टी आहे किंवा तो त्यांच्यासोबत आहे का? या कारणाने मारक/बाधक प्रभावात काही घट किंवा संरक्षण (Mitigation) मिळत आहे का?

भाव स्थिती: हा ग्रह कुंडलीच्या कोणत्या भावात बसला आहे? त्रिक भावांमध्ये (6, 8, 12) बसल्याने तो अधिक अशुभ झाला आहे, की केंद्र/त्रिकोणात बसल्याने त्याची स्थिती थोडी सुधारली आहे?

राशी बळ: हा ग्रह आपल्या नीच राशीत असल्याने अत्यंत पीडित झाला आहे की उच्च/स्व राशीत असल्याने त्याची नकारात्मकता कमी झाली आहे? किंवा तो अधिक शक्तिशाली आणि प्रभावी झाला आहे?

3. सक्रियकरण आणि संभाव्य परिणाम (Activation and Potential Results):

दशा सक्रियकरण: या ग्रहाच्या महादशा किंवा अंतर्दशेत अभ्यासात कोणत्या प्रकारचे अडथळे किंवा त्रास (ध्यान विचलित होणे, एखाद्या विषयात अनास्था, परीक्षेत अपयश, school बदलणे इत्यादी) दिसू शकतात?

गोचर प्रभाव: शनि किंवा राहू सारखे मोठे ग्रह गोचरातून या मारक/बाधक ग्रहावरून जात असताना त्याचे नकारात्मक परिणाम सक्रिय करू शकतात का?
प्रभावित क्षेत्रे: त्याच्या नैसर्गिक कारकत्वाच्या (जसे बुध - बुद्धी/वाणी, चंद्र - मन/स्मरण, गुरु - ज्ञान/शिक्षक) आणि त्याच्या भाव-स्वामित्वाच्या आधारे हा ग्रह शिक्षणाच्या कोणत्या विशिष्ट क्षेत्रांवर सर्वात जास्त प्रभाव टाकेल?

4. समग्र निष्कर्ष:
अंतिम मूल्यांकन: वरील सर्व बिंदूंचे विश्लेषण केल्यानंतर, शिक्षणासाठी कार्यात्मक अशुभ ग्रह म्हणून या ग्रहाला 1 ते 10 च्या स्केलवर किती रेटिंग द्याल? (जिथे 1 अतिशय हलके आणि 10 अत्यंत हानिकारक आहे).

5. मार्गदर्शन आणि उपाय (Counseling and Remedies)
(हा विभाग "आव्हान" (पायरी 1-4 मध्ये ओळखलेले) कसे सांभाळावे यावर केंद्रित आहे.)

5.1. ज्योतिषीय शमन उपाय (Astrological Pacification Remedies):

मंत्र/जप: या ग्रहाच्या (किंवा त्याच्या अधिष्ठात्री देवतेच्या) बीज मंत्राचा किंवा वैदिक मंत्राचा जप शमनासाठी आवश्यक आहे का?

स्तोत्र: दशा-अंतर्दशेदरम्यान एखाद्या विशिष्ट स्तोत्राचे (जसे, बुधासाठी 'विष्णू सहस्रनाम' किंवा गुरूसाठी 'गुरु स्तोत्र') पठण संरक्षणात्मक ठरेल का?

दान: या ग्रहाचा नकारात्मक प्रभाव शांत करण्यासाठी कोणत्या वस्तूंचे दान (रंग, धान्य, धातू) आणि कधी (कोणत्या दिवशी) करावे?

5.2. रत्न आणि धारण - [सर्वात महत्त्वाचा इशारा]:

रत्न निषेध (Gem Prohibition): हा ग्रह (मारक/बाधक असल्याने) त्या ग्रहांमध्ये येतो का ज्यांचे रत्न मुलाला कोणत्याही परिस्थितीत धारण करू नये? (स्पष्ट लिहा: कारण प्रबळ मारकेशाचे रत्न धारण करणे म्हणजे "शक्तिशाली शत्रूला अधिक शक्ती देणे" आहे.)

पर्यायी धारण (Alternative Wearing): या ग्रहाला शांत करण्याऐवजी, कुंडलीच्या 'रक्षक' ग्रहाचे (जसे लग्नेश किंवा नवमेश) रत्न धारण करणे अधिक चांगला उपाय ठरेल का?

5.3. वर्तनात्मक उपाय (Behavioral Remedies - The Counseling):

जागरूकता: पालकांना या ग्रहाच्या नकारात्मक स्वभावाबद्दल कसे जागरूक करावे? (जसे: "मुलाचा बुधच बाधक आहे, म्हणून अभ्यासात घाईऐवजी पुनरावृत्ती आणि लिहून अभ्यास करावा लागेल.")

बदल (Modification): मुलाच्या अभ्यासाच्या कोणत्या सवयी बदलल्या लागतील? (जसे: "मुलाचा चंद्र मन विचलित करतो, म्हणून अभ्यास छोट्या सत्रांमध्ये आणि निश्चित वेळेवर करावा लागेल.")

4] मुलाच्या स्मरणशक्ती, समज आणि बुद्धीची पातळी कशी आहे? तो रट्टा मारून शिकण्यात पटाईत आहे की समजून शिकण्यात? त्याची Learning Style काय आहे?
➤ मुलाची बुद्धी वय वाढते तशी अधिक तीक्ष्ण होईल, की सुरुवातीची तीक्ष्णता नंतर हळू होईल?

5] दहावीनंतर मुलासाठी कोणती Stream (Science, Commerce किंवा Arts) सर्वात योग्य असेल आणि का? प्रत्येक Stream मध्ये यशाची शक्यता टक्केवारीत देखील द्या.

6] मुलासाठी सर्वात योग्य विषय (Subjects) कोणते आहेत? मुख्य विषय, ऐच्छिक विषय आणि भाषा यांची निवड कशी करावी?
➤ कोणत्या विषयांपासून मुलाला दूर ठेवावे, जिथे त्याची कमकुवत बाजू स्पष्ट आहे?

7] Board च्या परीक्षांमध्ये (10वी आणि 12वी) मुलाची कामगिरी कशी राहील? कोणत्या Board वर्षात निकाल सर्वोत्तम राहील आणि कोणत्यात विशेष सावधगिरी बाळगावी लागेल?

8] कुंडलीत स्पर्धा परीक्षांत (JEE, NEET, Olympiad, UPSC इत्यादी) यशाचे प्रबळ योग आहेत का? त्याची शक्यता टक्केवारीत किती आहे आणि कोणत्या प्रकारची स्पर्धा परीक्षा सर्वात अनुकूल राहील?

9] मुलाचे उच्च शिक्षण किती होईल आणि कोणत्या दिशेने - सामान्य पदवी, Professional Course (Engineering/Medical/Law इत्यादी), की Research पर्यंत? शिक्षणाची अंतिम पातळी काय असेल?

10] कुंडलीत परदेशात शिक्षणाचे योग आहेत का? हो असेल तर कोणत्या वयात किंवा कोणत्या टप्प्यावर आणि कोणत्या दिशेने जाणे अनुकूल राहील?

11] अभ्यासात अडथळे, वर्ष वाया जाणे (Drop) किंवा Stream बदलण्याचे योग आहेत का? हो असेल तर कोणत्या वयात किंवा कोणत्या टप्प्यावर आणि त्याचे कारण काय असेल?

12] दशेनुसार मुलाच्या अभ्यासाच्या चांगल्या आणि कठीण काळ कोणते आहेत? वयानुसार (5-10, 10-15, 15-18, 18-25 वर्षे) सांगा की कोणत्या टप्प्यात अभ्यास सर्वात मजबूत राहील आणि कोणत्या टप्प्यात विशेष लक्ष द्यावे लागेल.

13] अभ्यासाव्यतिरिक्त मुलात खेळ, कला, संगीत, तंत्र किंवा इतर कोणत्या क्षेत्रात विशेष प्रतिभा आहे? ते क्षेत्र शिक्षणासोबत गंभीरपणे पुढे नेले पाहिजे का?

14] मोठा झाल्यावर मुलाच्या करियरची दिशा काय असेल? सर्वात प्रबळ 2-3 करियर क्षेत्रे कोणती आहेत? त्याचे शिक्षण कोणत्या करियर क्षेत्राकडे वळवणे सर्वात फायदेशीर ठरेल, जेणेकरून आजची Stream आणि विषय निवड त्यानुसार करता येईल?

15] पालकांसाठी मार्गदर्शन: मुलाच्या अभ्यासाच्या सवयी कशा बनवाव्यात, त्याच्यावर किती दबाव योग्य आहे, अभ्यासाचे वातावरण (घर किंवा Hostel, सकाळ किंवा रात्र) कसे ठेवावे आणि कोणत्या गोष्टी टाळल्या पाहिजेत?

16] मुलाच्या शिक्षणातील यश, एकाग्रता आणि बुद्धीसाठी कोणते ज्योतिषीय उपाय, रत्ने किंवा पूजा सुचवता येतील? कोणती रत्ने मुलाला अजिबात धारण करू नयेत?`;
        let currentLang = 'hi';
        function getRawData() {
            if (currentLang === 'en') return rawData_en;
            if (currentLang === 'mr') return rawData_mr;
            return rawData_hi;
        }
        function changeLanguage(lang) {
            currentLang = lang;
            document.getElementById('prompt-container').innerHTML = '';
            processData();
        }

        // सेपरेटर लॉजिक: --- या ___ लाइन्स से अलग करना
        const separatorRegex = /\n-{10,}\n|\n_{10,}\n/g;
        
        function processData() {
            const container = document.getElementById('prompt-container');
            // पहले डैश लाइन्स से तोडें
            let parts = getRawData().split(separatorRegex);

            parts.forEach((part, index) => {
                let cleanText = part.trim();
                
                // फिल्टरिंग लॉजिक
                const lines = cleanText.split('\n');
                const filteredLines = lines.filter(line => {
                    const l = line.trim();
                    // जंक (MMM... RRR... PPPP...) हटाएं
                    if (l.match(/^[M|P|C|H|R]{5,}$/)) return false;
                    // सिर्फ डैश वाली लाइन हटाएं
                    if (l.match(/^-{5,}$/)) return false;
                    return true;
                });
                
                cleanText = filteredLines.join('\n').trim();

                if (cleanText.length > 5) { // खाली या बहुत छोटी स्ट्रिंग न दिखाएं
                    createCard(cleanText, index + 1);
                }
            });
        }

        function createCard(text, id) {
            const container = document.getElementById('prompt-container');
            
            const card = document.createElement('div');
            card.className = 'card';

            const header = document.createElement('div');
            header.className = 'card-header';
            header.innerHTML = `<span>Prompt #${id}</span>`;

            const content = document.createElement('div');
            content.className = 'card-content';
            content.innerText = text;

            const btn = document.createElement('button');
            btn.className = 'btn';
            btn.innerText = 'Copy Prompt';
            btn.onclick = () => copyText(text, btn);

            card.appendChild(header);
            card.appendChild(content);
            card.appendChild(btn);
            container.appendChild(card);
        }

        function showBtnFeedback(btn, success){
            if(!btn) return;
            var origText = btn.innerText;
            var origBg = btn.style.backgroundColor;
            btn.innerText = success ? "\u2713 Copied!" : "\u2717 Failed";
            btn.style.backgroundColor = success ? "#2e7d32" : "#c62828";
            btn.style.color = "#fff";
            setTimeout(function(){ btn.innerText = origText; btn.style.backgroundColor = origBg; }, 2000);
        }
        function copyText(text, btn) {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(() => {
                    showToast();
                    showBtnFeedback(btn, true);
                }).catch(err => {
                    fallbackCopy(text, btn);
                });
            } else {
                fallbackCopy(text, btn);
            }
        }

        function fallbackCopy(text, btn) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed'; // Avoid scrolling to bottom
            document.body.appendChild(textarea);
            textarea.focus();
            textarea.select();
            try {
                var ok = document.execCommand('copy');
                showToast();
                showBtnFeedback(btn, ok);
            } catch (err) {
                console.error('Fallback: Oops, unable to copy', err);
                showBtnFeedback(btn, false);
            }
            document.body.removeChild(textarea);
        }

        function showToast() {
            var x = document.getElementById("snackbar");
            x.className = "toast show";
            setTimeout(function(){ x.className = x.className.replace("show", ""); }, 3000);
        }

        // Initialize
        processData();

    </script>
