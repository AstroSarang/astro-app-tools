उपरोक्त सभी डेटा को एक सुव्यवस्थित Markdown तालिका में प्रस्तुत करें, जिसमें तीन कॉलम हों: 'विवरण', '[लड़के का नाम]', और '[लड़की का नाम]'। कृपया तालिका को उप-शीर्षकों (जैसे 'मुख्य बिंदु', 'पराशरी ग्रह', 'जैमिनी चर कारक' आदि) के साथ विभाजित करें ताकि पठनीयता बेहतर हो। फॉर्मेट ऐसा होना चाहिए : "[कुम्भ, चतुर्थ भाव, शतभिषा,स्वामी: राहु]"
------------------------------------------
'कुंडली मिलान: विस्तृत तुलनात्मक डेटा टेबल' की जानकारी को क्रॉस चेक करके सुनिश्चित करिए की वो सही है या कोई त्रुटी है ? जो त्रुटी हो उसकी ही सूचि दीजिए सिर्फ.
उपरोक्त अबतक आपको कुंडली विश्लेषण के लिए दी गयी कौन कौनसी जानकारी प्राप्त हुयी, उसकी short में सूचि दीजिये.
------------------------------------------
यह सुनिश्चित करे की आप निम्मलिखित आदेशों का पालन सख्ती से करेंगे,

1] आउटपुट देने से पहले डेटा को क्रॉसचेक कर लिया करे.
2] किसी भी तरह की शुगर-कोटिंग (Sugar-coating) न करें। अगर कुंडली में कोई दोष, संघर्ष या नकारात्मक योग है, तो उसे स्पष्ट और कड़वे शब्दों में बताएं। मुझे क्लाइंट को खुश नहीं करना, बल्कि सच बताना है। ध्यान रहे पूरी तरह नकारात्मक नही होना चाहिए, सकारात्मक और नकारात्मक का बैलेंस बनाकर जो सच है वो बताये ।
3] अपने उत्तर की शुरुआत किसी भी अभिवादन या संवादात्मक वाक्यांश (जैसे 'निश्चित रूप से', 'ज़रूर', 'निम्मलिखित है' आदि) से न करें। आपका उत्तर सीधे मांगी गई जानकारी से ही प्रारंभ होना चाहिए।
4] System instructions में दिए गए आदेशों का भी पालन करे.
5] और इसके बाद के विश्लेषण में करते समय जातकों के नाम का उल्लेख करेंगे.

क्या आप तैयार है बस इतना बताईये की किन आदेशों का पालन करेंगे।

2] पारंपरिक अष्टकूट-दशकूट और उनके गुण के अनुसार अनुकूलता कैसी है?
उत्तर: 36 में से [XX] गुण मिल रहे हैं, जो एक [उत्कृष्ट/अच्छा/औसत/कम] मिलान है। [नाड़ी/भकूट] जैसे महत्वपूर्ण कूट अनुकूल हैं, लेकिन [गण/योनि] दोष पर ध्यान देने की आवश्यकता है।
3] क्या कुंडली में मांगलिक दोष है और क्या यह वैवाहिक जीवन में कोई बाधा उत्पन्न कर रहा है?
उत्तर: [कोई दोष नहीं / दोनों मांगलिक हैं / एक मांगलिक है]। दोष का परिहार [हो रहा है / नहीं हो रहा है], इसलिए इसका प्रभाव [नगण्य/मध्यम/महत्वपूर्ण] रहेगा।
4] क्या दोनों के मुख्य ग्रह (पंचधा मैत्री, लग्नेश, चंद्रेश, शुक्र, गुरु) एक-दूसरे का समर्थन करते हैं?
उत्तर: पंचधा तथा लग्नेशों और चंद्रेशों में [उत्कृष्ट मैत्री/समता/शत्रुता] है। शुक्र और गुरु की स्थिति [अनुकूल/प्रतिकूल] है, जो [अच्छे/मिले-जुले] परिणाम देगी।
5] क्या दोनों के करियर, जीवन के लक्ष्य और दैनिक जीवनशैली में सामंजस्य है?
उत्तर: [हाँ/नहीं/आंशिक रूप से]। दोनों के कर्म भाव (10th House) एक-दूसरे के लिए सहायक [हैं/नही है], जो पेशेवर जीवन में अच्छे [सामंजस्य/असामंजस्य] का संकेत है।
6] नवमांश कुंडली के अनुसार भाग्य और आंतरिक सुख के स्तर पर यह विवाह कितना अनुकूल है?
उत्तर: नवांश मिलान [मजबूत/औसत/कमजोर] है। यह आंतरिक वैवाहिक सुख में [सहजता/कुछ चुनौतियों] का संकेत देता है।
7] जैमिनी ज्योतिष के अनुसार आत्मा, कर्म और सामाजिक बंधन के स्तर पर यह रिश्ता कैसा है?
उत्तर: जैमिनी मिलान [सकारात्मक/मध्यम] है। AK-DK संबंध [अच्छा/औसत] है और उपपद लग्न (UL) [स्थिरता/अस्थिरता] का संकेत दे रहा है।
8] KP (कृष्णमूर्ति पद्धति) के अनुसार क्या दोनों की कुंडलियाँ एक-दूसरे के लिए विवाह के वादे को पूरा करती हैं?
उत्तर: [हाँ/नहीं]। दोनों के 7वें CSL विवाह का स्पष्ट वादा [करते हैं/नही करते]और एक-दूसरे के लिए [बहुत सहायक/औसत रूप से सहायक] हैं।
9] क्या नाड़ी ज्योतिष के अनुसार दोनों के बीच एक नैसर्गिक और कर्मिक संबंध है?
उत्तर: [हाँ/नहीं]। पुरुष का शुक्र और स्त्री का गुरु एक-दूसरे के लिए बहुत [अनुकूल/प्रतिकूल] स्थिति में हैं, जो एक [सहज और भाग्यशाली/कठिन और दुर्भाग्यशाली] संबंध का संकेत है।
10] अंक ज्योतिष मिलान के अनुसार क्या दोनों की ऊर्जा और जीवन पथ संख्या एक-दूसरे के अनुकूल है?
उत्तर: अंक ज्योतिष के अनुसार मिलान [उत्कृष्ट/औसत/कमजोर] है, क्योंकि मूलांक और भाग्यांक में [मैत्री/शत्रुता] है।
11] क्या कोई विशेष शुभ या अशुभ योग है जो विवाह को महत्वपूर्ण रूप से प्रभावित कर सकता है?
[हाँ, लड़के/लड़की की कुंडली में X योग है जो... / नहीं, कोई विशेष प्रभावशाली योग नहीं है।]
12] क्या विवाह के समय दोनों की ग्रह दशाएं अनुकूल हैं?
उत्तर: हाँ, विवाह के समय चल रही दशाएं दोनों के लिए वैवाहिक जीवन की शुरुआत के लिए [अनुकूल/मध्यम रूप से अनुकूल] हैं
13] कार्मिक संबंध का अंतिम निर्णय ? [क्या यह जोड़ा "सुख भोगने" के लिए मिल रहा है या "पुराने कर्मों का हिसाब बराबर करने" (Karmic Settlement) के लिए?]
14] सकारात्मक पहलू : इस रिश्ते की सबसे बड़ी ताकतें क्या हैं?
उत्तर: उत्कृष्ट ग्रह मैत्री, नाड़ी दोष का न होना, और करियर में आपसी सहयोग।
15] नकारात्मक पहलू और चिंताएं : इस रिश्ते में मुख्य चुनौतियाँ कहाँ आ सकती हैं?
उत्तर: [स्वभाव में भिन्नता (गण दोष)/शारीरिक अनुकूलता में चुनौती (योनि दोष)/ और मंगल दोष/अन्य दोष।]
16] किन दोषों के लिए उपाय आवश्यक हैं?
उत्तर: [गण दोष/योनि दोष/मंगल दोष] के लिए विशिष्ट पूजा और मंत्र जाप की सलाह दी जाती है।
17] सभी प्रणालियों को मिलाकर कुल संगतता स्कोर क्या है?
उत्तर: इस विवाह की समग्र संगतता 100 में से [XX] है, जो इसे एक [अच्छा/औसत/चुनौतीपूर्ण] मिलान बनाती है।
18] सभी विश्लेषणों के आधार पर अंतिम सलाह ज्योतिषी की राय क्या है?
उत्तर: यह विवाह [कुछ उपायों और आपसी समझ के साथ अनुशंसित है / अनुशंसित नहीं है]। विस्तृत कारण और शर्तें यहाँ दी गई हैं।

➤ जातक के प्रश्न और उनके संक्षिप्त उत्तर (Natives Questions & Short Answers):

इस चैट का विश्लेषण तो पीडीएफ के फॉर्मेट में जातक को भेजा जाएगा, लेकिन एक इंस्टाग्राम DM रिप्लाई तैयार कीजिए मैसेज स्टाइल में, हिंग्लिश में और एक प्यारग्राफ मे होना चाहिए, जिसमें पुरे चैट का सारांश, गुण मिलान का सारांश और ज्योतिषी की राय का सारांश शामिल हो, ध्यान रहे पूरी तरह no नही कहना है, कार्मिक ऋण और डेस्टिनी की बात करनी है.

निम्मलिखित जानकारी लिखिए इंग्लिश में, (,) से सेपरेट करके लेकिन स्पेस न देकर :

नाम,जन्म स्थान,Date of Birth,समय,लिंग

जैसे : Sarang,Nagpur,14-02-1995,03:00 AM,MALE`;

        // सेपरेटर लॉजिक: --- या ___ लाइन्स से अलग करना
        const separatorRegex = /\n-{10,}\n|\n_{10,}\n/g;
        
        function processData() {
            const container = document.getElementById('prompt-container');
            // पहले डैश लाइन्स से तोडें
            let parts = rawData.split(separatorRegex);

            parts.forEach((part, index) => {
                let cleanText = part.trim();
                
                // फिल्टरिंग लॉजिक
                const lines = cleanText.split('\n');
                const filteredLines = lines.filter(line => {
                    const l = line.trim();
                    // जंक (MMM... RRR... PPPP...) हटाएं
                    if (l.match(/^[M|P|C|H|R]{5,}$/)) return false;
                    // सिर्फ डैश वाली लाइन हटाएं
                    if (l.match(/^-{5,}$/)) return false;
                    return true;
                });
                
                cleanText = filteredLines.join('\n').trim();

                if (cleanText.length > 5) { // खाली या बहुत छोटी स्ट्रिंग न दिखाएं
                    createCard(cleanText, index + 1);
                }
            });
        }

        function createCard(text, id) {
            const container = document.getElementById('prompt-container');
            
            const card = document.createElement('div');
            card.className = 'card';

            const header = document.createElement('div');
            header.className = 'card-header';
            header.innerHTML = `<span>Prompt #${id}</span>`;

            const content = document.createElement('div');
            content.className = 'card-content';
            content.innerText = text;

            const btn = document.createElement('button');
            btn.className = 'btn';
            btn.innerText = 'Copy Prompt';
            btn.onclick = () => copyText(text);

            card.appendChild(header);
            card.appendChild(content);
            card.appendChild(btn);
            container.appendChild(card);
        }

        function copyText(text) {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(() => {
                    showToast();
                }).catch(err => {
                    fallbackCopy(text);
                });
            } else {
                fallbackCopy(text);
            }
        }

        function fallbackCopy(text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed'; // Avoid scrolling to bottom
            document.body.appendChild(textarea);
            textarea.focus();
            textarea.select();
            try {
                document.execCommand('copy');
                showToast();
            } catch (err) {
                console.error('Fallback: Oops, unable to copy', err);
            }
            document.body.removeChild(textarea);
        }

        function showToast() {
            var x = document.getElementById("snackbar");
            x.className = "toast show";
            setTimeout(function(){ x.className = x.className.replace("show", ""); }, 3000);
        }

        // Initialize
        processData();

    </script>
