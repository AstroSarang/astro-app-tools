<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Child Analysis Prompt Generator</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #fff3e0; /* Light Orange background for Child/Jupiter theme */
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 850px;
            margin: 0 auto;
            background: #fff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            border-top: 5px solid #ef6c00;
        }
        h1 {
            text-align: center;
            color: #e65100; /* Dark Orange */
            margin-bottom: 10px;
            font-size: 26px;
        }
        p.subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
            font-weight: 500;
        }
        .row {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }
        .col {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        label {
            margin-bottom: 8px;
            font-weight: 600;
            color: #444;
        }
        input, select {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }
        .section-box {
            background-color: #fff8e1; /* Very light orange/yellow */
            border: 1px solid #ffe0b2;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 8px;
        }
        .section-header {
            font-weight: bold;
            color: #ef6c00;
            margin-bottom: 10px;
            font-size: 16px;
            border-bottom: 2px solid #ffcc80;
            display: inline-block;
            padding-bottom: 5px;
        }
        textarea {
            width: 100%;
            height: 80px;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box;
            resize: vertical;
            font-family: monospace;
        }
        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 6px;
            font-size: 18px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        #createBtn {
            background-color: #ef6c00;
            color: white;
            margin-top: 10px;
        }
        #createBtn:hover {
            background-color: #d84315;
        }
        #outputArea {
            margin-top: 40px;
            display: none;
            background-color: #fafafa;
            padding: 20px;
            border: 1px solid #eee;
            border-radius: 8px;
        }
        #finalPrompt {
            height: 400px;
            font-size: 14px;
            line-height: 1.5;
            background-color: #fff;
            color: #000;
            border: 1px solid #ccc;
        }
        #copyBtn {
            background-color: #2e7d32; /* Green for success */
            color: white;
            margin-top: 15px;
        }
        #copyBtn:hover {
            background-color: #1b5e20;
        }
        @media (max-width: 600px) {
            .row {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>CHB Paste प्रॉम्प्ट जनरेटर</h1>
    <p class="subtitle">Child (Progeny) Analysis AI Tool</p>

    <!-- Basic Info -->
    <div class="row">
        <div class="col">
            <label>1. नाम (Name):</label>
            <input type="text" id="name" placeholder="उदा. विकास">
        </div>
        <div class="col">
            <label>2. लिंग (Gender):</label>
            <select id="gender">
                <option value="जातक">जातक (Male)</option>
                <option value="जातिका">जातिका (Female)</option>
            </select>
        </div>
        <div class="col">
            <label>3. भाषा (Language):</label>
            <select id="lang" onchange="if(document.getElementById('finalPrompt').value) generatePrompt();">
                <option value="hi" selected>हिंदी</option>
                <option value="en">English</option>
                <option value="mr">मराठी</option>
            </select>
        </div>
    </div>

    <!-- Data Sections -->
    <div class="section-box">
        <div class="section-header">1. पराशरी डेटा (Parashari Data)</div>
        <textarea id="dataParashari" placeholder="यहाँ पराशरी डेटा पेस्ट करें..."></textarea>
    </div>

    <div class="section-box">
        <div class="section-header">2. जैमिनी डेटा (Jaimini Data)</div>
        <textarea id="dataJaimini" placeholder="यहाँ जैमिनी डेटा पेस्ट करें..."></textarea>
    </div>

    <div class="section-box">
        <div class="section-header">3. BNN डेटा (Bhrigu Nandi Nadi Data)</div>
        <textarea id="dataBNN" placeholder="यहाँ BNN डेटा पेस्ट करें..."></textarea>
    </div>

    <div class="section-box">
        <div class="section-header">4. KP डेटा (Krishnamurti Paddhati Data)</div>
        <textarea id="dataKP" placeholder="यहाँ KP डेटा पेस्ट करें..."></textarea>
    </div>

    <button id="createBtn" onclick="generatePrompt()">Create Prompt (प्रॉम्प्ट बनाएँ)</button>

    <!-- Output Section -->
    <div id="outputArea">
        <h3 style="margin-bottom:5px; color:#333;">आपका तैयार प्रॉम्प्ट:</h3>
        <textarea id="finalPrompt" readonly></textarea>
        <button id="copyBtn" onclick="copyToClipboard()">Copy Prompt (प्रॉम्प्ट कॉपी करें)</button>
    </div>

</div>

<script>
    var T = {
        hi: {
            b1: function(n,g){ return "निम्मलिखित " + n + " नामक " + g + " के कुंडली के आधार पर उसकी संभावित संतान विश्लेषण रिपोर्ट का गहन और विस्तारपूर्वक विश्लेषण (Detailed Analysis) कीजिए, ध्यान रहे सभी 7 बिंदुओं के साथ-साथ उनके प्रत्येक उपबिन्दुओ का भी विश्लेषण विस्तारपूर्वक होना चाहिए, अंत में प्रत्येक बिंदु का निष्कर्ष भी दीजिए।"; },
            c1: "\n\nविस्तारपूर्वक समग्र पराशरी निष्कर्ष भाग 1 A और भाग 1 B :\n------------------------------------------",
            b2: function(n,g){ return "निम्मलिखित " + n + " नामक " + g + " के कुंडली के आधार पर उसकी संभावित संतान विश्लेषण रिपोर्ट का गहन और विस्तारपूर्वक विश्लेषण (Detailed Analysis) कीजिए, ध्यान रहे सभी 4 बिंदुओं के साथ-साथ उनके प्रत्येक उपबिन्दुओ का भी विश्लेषण विस्तारपूर्वक होना चाहिए, अंत में प्रत्येक बिंदु का निष्कर्ष भी दीजिए।"; },
            c2: "\n\nविस्तारपूर्वक समग्र जैमिनी निष्कर्ष :\n-------------------------------------------",
            b3: function(n,g){ return "निम्मलिखित " + n + " नामक " + g + " के कुंडली के आधार पर उसकी संभावित संतान विश्लेषण रिपोर्ट का गहन और विस्तारपूर्वक विश्लेषण (Detailed Analysis) कीजिए, ध्यान रहे सभी 2 बिंदुओं के साथ-साथ उनके प्रत्येक उपबिन्दुओ का भी विश्लेषण विस्तारपूर्वक होना चाहिए, अंत में प्रत्येक बिंदु का निष्कर्ष भी दीजिए।"; },
            c3: "\n\nविस्तारपूर्वक समग्र BNN निष्कर्ष :\n-------------------------------------------",
            b4: function(n,g){ return "निम्मलिखित " + n + " नामक " + g + " के कुंडली के आधार पर उसकी संभावित संतान विश्लेषण रिपोर्ट का गहन और विस्तारपूर्वक विश्लेषण (Detailed Analysis) कीजिए, ध्यान रहे सभी 2 बिंदुओं के साथ-साथ उनके प्रत्येक उपबिन्दुओ का भी विश्लेषण विस्तारपूर्वक होना चाहिए, अंत में प्रत्येक बिंदु का निष्कर्ष भी दीजिए।"; },
            c4: "\n\nविस्तारपूर्वक समग्र KP निष्कर्ष :"
        },
        en: {
            b1: function(n,g){ return "Based on the horoscope of " + n + " (" + g + "), provide a deep and detailed analysis of their prospective progeny analysis report. Ensure all 7 points along with each of their sub-points are analyzed in detail, and provide a conclusion for each point at the end."; },
            c1: "\n\nDetailed Overall Parashari Conclusion Part 1A and 1B:\n------------------------------------------",
            b2: function(n,g){ return "Based on the horoscope of " + n + " (" + g + "), provide a deep and detailed analysis of their prospective progeny analysis report. Ensure all 4 points along with each of their sub-points are analyzed in detail, and provide a conclusion for each point at the end."; },
            c2: "\n\nDetailed Overall Jaimini Conclusion:\n-------------------------------------------",
            b3: function(n,g){ return "Based on the horoscope of " + n + " (" + g + "), provide a deep and detailed analysis of their prospective progeny analysis report. Ensure all 2 points along with each of their sub-points are analyzed in detail, and provide a conclusion for each point at the end."; },
            c3: "\n\nDetailed Overall BNN Conclusion:\n-------------------------------------------",
            b4: function(n,g){ return "Based on the horoscope of " + n + " (" + g + "), provide a deep and detailed analysis of their prospective progeny analysis report. Ensure all 2 points along with each of their sub-points are analyzed in detail, and provide a conclusion for each point at the end."; },
            c4: "\n\nDetailed Overall KP Conclusion:"
        },
        mr: {
            b1: function(n,g){ return n + " नावाच्या " + g + " च्या कुंडलीच्या आधारे त्याच्या संभाव्य संतती विश्लेषण अहवालाचे सखोल आणि तपशीलवार विश्लेषण (Detailed Analysis) करा, सर्व 7 मुद्दे आणि त्यांच्या प्रत्येक उपमुद्द्यांचे तपशीलवार विश्लेषण झाले पाहिजे याची काळजी घ्या, शेवटी प्रत्येक मुद्द्याचा निष्कर्ष द्या."; },
            c1: "\n\nतपशीलवार समग्र पराशरी निष्कर्ष भाग 1 A आणि भाग 1 B :\n------------------------------------------",
            b2: function(n,g){ return n + " नावाच्या " + g + " च्या कुंडलीच्या आधारे त्याच्या संभाव्य संतती विश्लेषण अहवालाचे सखोल आणि तपशीलवार विश्लेषण (Detailed Analysis) करा, सर्व 4 मुद्दे आणि त्यांच्या प्रत्येक उपमुद्द्यांचे तपशीलवार विश्लेषण झाले पाहिजे याची काळजी घ्या, शेवटी प्रत्येक मुद्द्याचा निष्कर्ष द्या."; },
            c2: "\n\nतपशीलवार समग्र जैमिनी निष्कर्ष :\n-------------------------------------------",
            b3: function(n,g){ return n + " नावाच्या " + g + " च्या कुंडलीच्या आधारे त्याच्या संभाव्य संतती विश्लेषण अहवालाचे सखोल आणि तपशीलवार विश्लेषण (Detailed Analysis) करा, सर्व 2 मुद्दे आणि त्यांच्या प्रत्येक उपमुद्द्यांचे तपशीलवार विश्लेषण झाले पाहिजे याची काळजी घ्या, शेवटी प्रत्येक मुद्द्याचा निष्कर्ष द्या."; },
            c3: "\n\nतपशीलवार समग्र BNN निष्कर्ष :\n-------------------------------------------",
            b4: function(n,g){ return n + " नावाच्या " + g + " च्या कुंडलीच्या आधारे त्याच्या संभाव्य संतती विश्लेषण अहवालाचे सखोल आणि तपशीलवार विश्लेषण (Detailed Analysis) करा, सर्व 2 मुद्दे आणि त्यांच्या प्रत्येक उपमुद्द्यांचे तपशीलवार विश्लेषण झाले पाहिजे याची काळजी घ्या, शेवटी प्रत्येक मुद्द्याचा निष्कर्ष द्या."; },
            c4: "\n\nतपशीलवार समग्र KP निष्कर्ष :"
        }
    };

    function generatePrompt() {
        try {
            // 1. Get Variable Inputs
            var nameRaw = document.getElementById('name').value;
            var name = nameRaw.trim() === "" ? "xyz" : nameRaw.trim();
            var gender = document.getElementById('gender').value;

            // 2. Get Data Inputs
            var dParashari = document.getElementById('dataParashari').value.trim();
            var dJaimini = document.getElementById('dataJaimini').value.trim();
            var dBNN = document.getElementById('dataBNN').value.trim();
            var dKP = document.getElementById('dataKP').value.trim();

            // 3. Construct Strings (Based on Child Analysis Template)

            // Block 1: Intro (7 Points) + Parashari Data
            var lang = document.getElementById('lang').value || 'hi';
            var t = T[lang] || T.hi;
            var gLabel = gender;
            if(lang==='en'){ gLabel = (gender==='जातक'?'native (male)':'native (female)'); }
            if(lang==='mr'){ gLabel = (gender==='जातक'?'जातक (पुरुष)':'जातिका (महिला)'); }

            var block1 = t.b1(name, gLabel) + "\n\n" + dParashari;

            // Block 2: Parashari Conclusion Header (4 Points) + Jaimini Data
            var block2 = t.c1 + "\n" + t.b2(name, gLabel) + "\n\n" + dJaimini;

            // Block 3: Jaimini Conclusion Header (2 Points) + BNN Data
            var block3 = t.c2 + "\n" + t.b3(name, gLabel) + "\n\n" + dBNN;

            // Block 4: BNN Conclusion Header (2 Points) + KP Data
            var block4 = t.c3 + "\n" + t.b4(name, gLabel) + "\n\n" + dKP;

            // Block 5: KP Conclusion Header
            var block5 = t.c4;

            // Combine All
            var fullPrompt = block1 + block2 + block3 + block4 + block5;

            // 4. Display Result
            document.getElementById('finalPrompt').value = fullPrompt;
            document.getElementById('outputArea').style.display = 'block';
            
            // Scroll to output
            document.getElementById('outputArea').scrollIntoView({behavior: "smooth"});

        } catch (err) {
            alert("Error generating prompt: " + err.message);
        }
    }

    function showCopyFeedback(btn, success){
        var origText = btn.innerHTML;
        var origBg = btn.style.background;
        if(success){
            btn.innerHTML = "✓ कॉपी हो गया!";
            btn.style.background = "#2e7d32";
        } else {
            btn.innerHTML = "✗ कॉपी नहीं हुआ";
            btn.style.background = "#c62828";
        }
        setTimeout(function(){
            btn.innerHTML = origText;
            btn.style.background = origBg;
        }, 2000);
    }
    function copyToClipboard() {
        var copyText = document.getElementById("finalPrompt");
        var btn = document.getElementById("copyBtn") || event.target;
        var val = copyText.value;
        if(!val){ alert("पहले प्रॉम्प्ट बनाएं!"); return; }
        if(navigator.clipboard && window.isSecureContext){
            navigator.clipboard.writeText(val).then(function(){
                showCopyFeedback(btn, true);
            }).catch(function(){ fallbackCopy(copyText, btn); });
        } else {
            fallbackCopy(copyText, btn);
        }
    }
    function fallbackCopy(el, btn){
        el.focus(); el.select();
        el.setSelectionRange(0, 99999);
        try{
            var ok = document.execCommand('copy');
            showCopyFeedback(btn, ok);
            if(!ok) setTimeout(function(){alert("कॉपी नहीं हुआ - manually select करके copy करें")}, 2100);
        }catch(e){
            showCopyFeedback(btn, false);
        }
    }
</script>

</body>
</html>
