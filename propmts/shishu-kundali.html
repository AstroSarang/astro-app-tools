1] चंद्र किस भाव में है और चंद्र पर किन पाप ग्रहों (मंगल, शनि, राहु, केतु, सूर्य) की युति या दृष्टि है?
2] जन्म नक्षत्र कौन सा है - क्या वह गंडमूल नक्षत्रों (अश्विनी, मघा, मूल, अश्लेषा, ज्येष्ठा, रेवती) में से है?
3] लग्न का अंश कितना है (लग्न संधि की जांच के लिए)?
4] जन्म तिथि, करण और योग कौन से हैं (अमावस्या, भद्रा करण, तिथि गंडांत की जांच के लिए)?
5] जन्म के समय सूर्य-चंद्र की स्थिति - क्या जन्म ग्रहण काल या संक्रांति काल के आसपास का है?
6] चंद्र की स्थिति से बालारिष्ट की शर्तें (दुष्ट भाव में चंद्र, पाप युति/दृष्टि, भंग की शर्तें - शुभ ग्रहों की दृष्टि/केंद्र स्थिति) पूरी होती हैं या नहीं - मानों सहित लिखें।

यह सुनिश्चित करे की आप निम्मलिखित आदेशों का पालन सख्ती से करेंगे,

1] आउटपुट देने से पहले डेटा को क्रॉसचेक कर लिया करे.
2] किसी भी तरह की शुगर-कोटिंग (Sugar-coating) न करें। अगर किसी तारीख में कोई दोष, कमजोरी या नकारात्मक बात है, तो उसे स्पष्ट रूप से बतायें - कोई तारीख जबरदस्ती शुभ न बतायें।
3] अपने उत्तर की शुरुआत किसी भी अभिवादन या संवादात्मक वाक्यांश (जैसे 'निश्चित रूप से', 'ज़रूर', 'निम्मलिखित है') से न करें, सीधे विश्लेषण से शुरू करें।
4] System instructions में दिए गए आदेशों का भी पालन करे.

क्या आप तैयार है बस इतना बताईये की किन आदेशों का पालन करेंगे।

अब हम शिशु की कुंडली का विश्लेषण निकालेंगे, उसके पहले ध्यान रखने योग्य बातें :

1] यह Analysis जन्मे हुए शिशु (बच्चे) की अपनी कुंडली का है - संबोधन माता-पिता से करना है और बच्चे का उल्लेख हमेशा तृतीय पुरुष में करना है (जैसे 'आपका बच्चा', 'उसका स्वभाव')। बच्चे से सीधे संबोधन बिल्कुल न करें।
2] यह Analysis सिर्फ जन्म से 1 वर्ष तक के शिशुओं के लिए है - विश्लेषण करते समय बच्चे की वर्तमान आयु का ध्यान रखें, अभी 2026 चल रहा है। दोषों की सावधानी-अवधि और संस्कारों का समय बच्चे की आयु के हिसाब से ही बताना है।
3] सभी मान, तारीखें और अवधियाँ सिर्फ दिए गए डेटा (कुंडली PDF, अवकहड़ा डेटा, दशा TXT) से ही लेनी हैं - अपने मन से कोई मान या तारीख न बनाएँ और न बदलें।
4] दोषों के बारे में डराने वाली भाषा बिल्कुल न लिखें - जो दोष है उसे स्पष्ट बताएँ, पर साथ में उसका भंग (रद्दीकरण) है या नहीं और उपाय अवश्य दें, ताकि माता-पिता घबराएँ नहीं, समझदारी से कदम उठाएँ।
5] शिक्षा और करियर के बारे में यहाँ सिर्फ रुचि की दिशा बतानी है - पक्की भविष्यवाणी (जैसे 'बच्चा डॉक्टर ही बनेगा') बिल्कुल न करें।
6] स्वास्थ्य के बारे में सिर्फ ज्योतिषीय प्रवृत्ति और सावधानी के क्षेत्र बताने हैं - कोई medical सलाह या बीमारी का पक्का दावा न करें।

----------

जातक (शिशु) की कुंडली के आधार पर निम्मलिखित पॉइंट्स का गहन और विस्तारपूर्वक विश्लेषण (Detailed Analysis) कीजिए, ध्यान रहे सभी बिंदुओं के साथ-साथ उनके प्रत्येक उपबिन्दुओं का भी विश्लेषण विस्तारपूर्वक होना चाहिए, अंत में प्रत्येक बिंदु का निष्कर्ष (Detailed Conclusion) भी दीजिए। संबोधन माता-पिता से रखें।

भाग 1: शिशु का आधार - अवकहड़ा, नामाक्षर और शुभ बिंदु
➤ जन्म परिचय: बच्चे का लग्न, चंद्र राशि और जन्म नक्षत्र-पद क्या है? इन तीनों से बच्चे के जीवन की बुनियादी दिशा क्या बनती है?
➤ अवकहड़ा चक्र: बच्चे का पाया (सोना, चांदी, तांबा या लोहा) कौन सा है और परिवार के लिए उसका अर्थ क्या है? वर्ण, योनि, गण, वश्य और नाड़ी क्या हैं - हर एक का बच्चे के स्वभाव और जीवन पर क्या संकेत है?
➤ नामाक्षर: जन्म नक्षत्र और उसके पद के अनुसार बच्चे के नाम का सही प्रथम अक्षर कौन सा है? यदि बच्चे का नाम पहले से रखा जा चुका हो तो बताएँ कि वह नामाक्षर से मेल खाता है या नहीं, और नाम के 2-3 उपयुक्त सुझाव भी दें (अर्थ सहित)।
➤ शुभ बिंदु: बच्चे के लिए शुभ अंक, शुभ दिन, शुभ रंग और शुभ दिशा कौन सी हैं?

----------

भाग 2: जन्म-दोष जांच और उपाय
(हर दोष की जांच अलग-अलग करें - पहले स्पष्ट लिखें कि वह दोष है या नहीं, फिर जिस मान के आधार पर निष्कर्ष निकाला है वह मान लिखें, फिर प्रभाव और उपाय दें)
➤ गंडमूल नक्षत्र: क्या बच्चे का जन्म गंडमूल नक्षत्र में हुआ है? है तो कौन से नक्षत्र-पद में, उसका प्रभाव किस पर पड़ता है (बच्चे पर, माता-पिता पर या परिवार पर) और उसकी शांति कब और कैसे करानी चाहिए?
➤ बालारिष्ट: क्या कुंडली में बालारिष्ट है? है तो कितना Strong है, उसकी अवधि किस आयु तक है, और उसका भंग (रद्दीकरण) है या नहीं - भंग की शर्तों सहित स्पष्ट करें।
➤ लग्न संधि और गंडांत: लग्न संधि, लग्न गंडांत या तिथि गंडांत में से कोई स्थिति है या नहीं?
➤ विशेष जन्म-परिस्थितियाँ: अमावस्या, भद्रा करण, ग्रहण काल, संक्रांति काल, माता-पिता या भाई के जन्म नक्षत्र में जन्म - इनमें से कोई परिस्थिति लागू होती है या नहीं? लागू हो तो उसका उपाय क्या है?
➤ नज़र दोष: बच्चे को नज़र लगने की प्रवृत्ति कितनी है और उससे बचाव के सरल उपाय क्या हैं?
➤ माता-पिता के लिए सावधानी: किस आयु तक बच्चे के स्वास्थ्य का विशेष ध्यान रखना है और किन बातों का ध्यान रखना है? (डराने वाली भाषा बिल्कुल न लिखें - हर बात उपाय के साथ दें।)

----------

भाग 3: संस्कार और उनके मुहूर्त
(हर संस्कार के लिए - परंपरागत आयु/अवधि, बच्चे की कुंडली के हिसाब से सबसे शुभ अवधि और संक्षिप्त विधि-टिप्पणी दें। तारीखें सिर्फ दिए गए मुहूर्त डेटा से ही लें, अपने मन से कोई तारीख न बनाएँ। बच्चा अभी 1 वर्ष तक का ही है - नामकरण और अन्नप्राशन जैसे शुरुआती संस्कारों की अवधि विस्तार से दें; मुंडन, विद्यारंभ और उपनयन जैसे आगे आने वाले संस्कारों के लिए सिर्फ उनकी उपयुक्त आयु और अवधि की रूपरेखा दें, उनकी पक्की तारीखें न दें।)
➤ नामकरण संस्कार: यदि नामकरण बाकी हो तो उसके लिए शुभ अवधि और ध्यान रखने योग्य बातें।
➤ अन्नप्राशन: बच्चे की आयु के हिसाब से अन्नप्राशन का सबसे शुभ समय कब पड़ेगा?
➤ मुंडन (चूड़ाकर्म): मुंडन किस वर्ष में कराना सबसे शुभ रहेगा और किस समय टालना चाहिए?
➤ विद्यारंभ: बच्चे की पढ़ाई शुरू करने (अक्षर-लेखन) का सबसे उपयुक्त समय और आयु कौन सी है?
➤ उपनयन (जनेऊ): यदि बच्चे पर लागू होता हो तो उपनयन की उपयुक्त आयु और अवधि क्या है? लागू न हो तो सिर्फ इतना लिखें कि यह संस्कार इस बच्चे पर लागू नहीं होता।
➤ जिन संस्कारों का समय निकल चुका हो, उनके बारे में सिर्फ एक पंक्ति में उल्लेख करें।

----------

भाग 4: स्वभाव, स्वास्थ्य और शिक्षा की दिशा
➤ स्वभाव और व्यक्तित्व: लग्न, चंद्र राशि और जन्म नक्षत्र के आधार पर बच्चे का स्वभाव कैसा होगा - उसकी मज़बूत बातें (तेज़ बुद्धि, भावुकता, ज़िद, रचनात्मकता आदि जो भी लागू हो) और जिन बातों पर माता-पिता को शुरू से ध्यान देना चाहिए, वे बातें स्पष्ट लिखें।
➤ मन और भावनाएँ: बच्चा भावनात्मक रूप से कैसा रहेगा - माता-पिता से जुड़ाव, संवेदनशीलता और उसके मन को समझने की कुंजी क्या है?
➤ स्वास्थ्य: स्वास्थ्य की ज्योतिषीय प्रवृत्ति कैसी है - किन क्षेत्रों (पाचन, श्वास, त्वचा, आँखें आदि जो भी लागू हो) में सावधानी रखनी है और किस आयु तक विशेष ध्यान रखना है? (कोई medical सलाह न दें, सिर्फ प्रवृत्ति और सावधानी बताएँ।)
➤ शिक्षा की दिशा: पढ़ाई में बच्चे की रुचि किस ओर रहेगी - भाषा, गणित, विज्ञान, कला, खेल - किस क्षेत्र में उसकी प्राकृतिक मज़बूती है? यह सिर्फ दिशा है, विस्तृत Education Analysis अलग product है - इसका उल्लेख एक पंक्ति में करें।
➤ परवरिश की व्यावहारिक बातें: उपरोक्त विश्लेषण के आधार पर माता-पिता के लिए 3-4 व्यावहारिक बातें - बच्चे को कैसे प्रोत्साहित करें, किन आदतों को शुरू से बढ़ावा दें और किन बातों से बचें।

----------

भाग 5: योग, भाग्य और बचपन की दशा-रूपरेखा
➤ प्रमुख योग: बच्चे की कुंडली में कौन से प्रमुख योग और राजयोग हैं? हर योग का नाम, वह किन ग्रहों से बना है और उसका बल Percentage में कितना Strong है - तैयार फल न लिखें, बच्चे की कुंडली के मानों से निष्कर्ष निकालें।
➤ भाग्य की दिशा: लग्नेश, भाग्येश (नवम भाव के स्वामी) और चंद्र की स्थिति के आधार पर बच्चे के भाग्य की बुनियादी दिशा क्या है - जीवन में उन्नति का आधार मुख्य रूप से किस क्षेत्र से बनेगा?
➤ बचपन की दशाएँ: जन्म से अब तक कौन सी महादशा-अंतर्दशा चलीं और इस समय कौन सी चल रही है - बच्चे पर उनका असर (स्वास्थ्य, स्वभाव, पढ़ाई की शुरुआत) कैसा रहा और रहेगा?
➤ आगे की रूपरेखा: आने वाली अगली महादशा कब से शुरू होगी और बचपन-किशोरावस्था के बड़े पड़ावों (पढ़ाई की मज़बूत शुरुआत, रुचि का स्पष्ट होना आदि) का समय किस दशा में पड़ेगा - तारीखों और आयु सहित लिखें।

----------

भाग 6: अंतिम निष्कर्ष (Final Conclusion) और माता-पिता के लिए मार्गदर्शन
➤ समग्र निष्कर्ष: बच्चे की कुंडली का कुल स्वरूप एक स्पष्ट पैराग्राफ में बताएँ - बच्चे की सबसे बड़ी मज़बूती, सबसे बड़ी सावधानी और जीवन की बुनियादी दिशा।
➤ माता-पिता के लिए सबसे महत्वपूर्ण 2-3 सलाह अलग से स्पष्ट लिखें - परवरिश, स्वास्थ्य की देखभाल और रुचि को बढ़ावा देने के हिसाब से।

(ध्यान रहे: इस Analysis में माता-पिता के अधिकतम 3 Personal Questions शामिल हैं - वे सवाल अलग से दिए जाएँगे और उनके जवाब इस भाग के बाद उसी क्रम में देने हैं।)

----------

➤ माता-पिता ने अपने बच्चे के बारे में जानकारी दी है और माता-पिता के कुछ प्रश्न हैं, पहले दी गई जानकारी को सूचीबद्ध करें, उसके बाद सभी प्रश्नों को सूचीबद्ध करें :

----------

अब माता-पिता द्वारा बच्चे के बारे में दी हुयी जानकारी का गहन शोध करके ज्योतिषीय विश्लेषण विस्तार से और निष्कर्ष देकर करें, हर घटना का विस्तार से विश्लेषण होना चाहिए, यदि उपाय आवश्यक हो तो उपायों सहित, शुरुआत पहली घटना के विश्लेषण से करें, बाकी बाद में पूछती हूँ।

----------

➤ माता-पिता के कुछ प्रश्न हैं, पहले सभी प्रश्नों को सूचीबद्ध करें :

माता-पिता के सवाल :

----------

अब माता-पिता के सवालों का गहन शोध करके ज्योतिषीय विश्लेषण विस्तार से और निष्कर्ष देकर करें, हर सवाल का विस्तार से विश्लेषण होना चाहिए, यदि उपाय आवश्यक हो तो उपायों सहित, शुरुआत पहले सवाल के विश्लेषण से करें, बाकी बाद में पूछती हूँ।

----------

अब तक किये गए सभी विश्लेषणों को फिर से लिखकर उनका संक्षिप्त उत्तर दीजिये, क्योंकि यह सूचि इस विश्लेषण के सबसे पहले लगायी जाएगी, इससे माता-पिता पहले ही शार्ट में जवाब पढ़ लेगा और उसे जिस भाग का विश्लेषण विस्तार से पढना है, उस भाग को ढूंढेगा...

मुख्य बातें :
(मुख्य बातें - नामाक्षर और अवकहड़ा का सार, दोष-जांच का परिणाम और उपाय, संस्कारों का समय, स्वभाव और शिक्षा की दिशा, वर्तमान दशा, माता-पिता के लिए सबसे महत्वपूर्ण सलाह - बस इतना ही, 2-3 पंक्तियों में हर बिंदु)

तुम्ही खालील आदेशांचे काटेकोरपणे पालन कराल याची खात्री करा,

1] आउटपुट देण्यापूर्वी डेटा क्रॉसचेक करून घ्या.
2] कोणत्याही प्रकारची साखर-लेप (Sugar-coating) करू नका. एखाद्या तारखेत काही दोष, कमजोरी किंवा नकारात्मक बाब असेल तर ती स्पष्टपणे सांगा - कोणतीही तारीख जबरदस्तीने शुभ सांगू नका.
3] तुमच्या उत्तराची सुरुवात कोणत्याही अभिवादनाने किंवा संवादात्मक वाक्यांशाने (जसे 'नक्कीच', 'जरूर', 'खालीलप्रमाणे आहे') करू नका, थेट विश्लेषणापासून सुरुवात करा.
4] System instructions मध्ये दिलेल्या आदेशांचेही पालन करा.

तुम्ही तयार आहात का - फक्त कोणते आदेश पाळाल ते सांगा.

आता आपण शिशुच्या कुंडलीचे विश्लेषण काढणार आहोत, त्यापूर्वी लक्षात ठेवण्याच्या गोष्टी:

1] हे Analysis जन्मलेल्या शिशुच्या (मुलाच्या) स्वतःच्या कुंडलीचे आहे - संबोधन आई-वडिलांशी करायचे आहे आणि मुलाचा उल्लेख नेहमी तृतीय पुरुषात करायचा आहे (जसे 'तुमचे मूल', 'त्याचा स्वभाव'). मुलाशी थेट संबोधन अजिबात करू नका.
2] हे Analysis फक्त जन्मापासून 1 वर्षापर्यंतच्या बाळांसाठीच आहे - विश्लेषण करताना मुलाच्या सध्याच्या वयाचे लक्ष ठेवा, सध्या 2026 सुरू आहे. दोषांचा सावधानता-काळ आणि संस्कारांच्या वेळा मुलाच्या वयानुसारच सांगायच्या आहेत.
3] सर्व मूल्ये, तारखा आणि कालावधी फक्त दिलेल्या डेटामधूनच (कुंडली PDF, अवकहडा डेटा, दशा TXT) घ्यायचे आहेत - स्वतःच्या मनाने कोणतेही मूल्य किंवा तारीख बनवू किंवा बदलू नका.
4] दोषांबद्दल घाबरवणारी भाषा अजिबात लिहू नका - जो दोष आहे तो स्पष्ट सांगा, पण सोबत त्याचा भंग (रद्दीकरण) आहे की नाही आणि उपाय अवश्य द्या, जेणेकरून आई-वडील घाबरणार नाहीत, समजूतदारपणे पावले उचलतील.
5] शिक्षण आणि करिअरबद्दल येथे फक्त आवडीची दिशा सांगायची आहे - पक्की भविष्यवाणी (जसे 'मूल डॉक्टरच होईल') अजिबात करू नका.
6] आरोग्याबद्दल फक्त ज्योतिषीय प्रवृत्ती आणि सावधानतेची क्षेत्रे सांगायची आहेत - कोणताही medical सल्ला किंवा आजाराचा पक्का दावा करू नका.

----------

जातकाच्या (शिशुच्या) कुंडलीच्या आधारावर खालील पॉइंट्सचे गहन आणि विस्तारपूर्वक विश्लेषण (Detailed Analysis) करा, लक्षात ठेवा सर्व बिंदूंसोबत त्यांच्या प्रत्येक उपबिंदूचेही विश्लेषण विस्तारपूर्वक व्हावे, शेवटी प्रत्येक बिंदूचा निष्कर्ष (Detailed Conclusion) देखील द्या. संबोधन आई-वडिलांशी ठेवा.

भाग 1: शिशुचा आधार - अवकहडा, नामाक्षर आणि शुभ बिंदू
➤ जन्म परिचय: मुलाचे लग्न, चंद्र राशी आणि जन्म नक्षत्र-पद कोणते आहे? या तिघांवरून मुलाच्या जीवनाची मूलभूत दिशा कोणती बनते?
➤ अवकहडा चक्र: मुलाचा पाया (सोने, चांदी, तांबे किंवा लोखंड) कोणता आहे आणि कुटुंबासाठी त्याचा अर्थ काय आहे? वर्ण, योनी, गण, वश्य आणि नाडी काय आहेत - प्रत्येकाचा मुलाच्या स्वभावावर आणि जीवनावर काय संकेत आहे?
➤ नामाक्षर: जन्म नक्षत्र आणि त्याच्या पदाप्रमाणे मुलाच्या नावाचे योग्य पहिले अक्षर कोणते आहे? मुलाचे नाव आधीच ठेवलेले असेल तर ते नामाक्षराशी जुळते की नाही ते सांगा, आणि नावाच्या 2-3 योग्य सूचना देखील द्या (अर्थासह).
➤ शुभ बिंदू: मुलासाठी शुभ अंक, शुभ दिवस, शुभ रंग आणि शुभ दिशा कोणती आहेत?

----------

भाग 2: जन्म-दोष तपासणी आणि उपाय
(प्रत्येक दोषाची तपासणी वेगळी करा - आधी स्पष्ट लिहा की तो दोष आहे की नाही, मग ज्या मूल्याच्या आधारावर निष्कर्ष काढला आहे ते मूल्य लिहा, मग प्रभाव आणि उपाय द्या)
➤ गंडमूल नक्षत्र: मुलाचा जन्म गंडमूल नक्षत्रात झाला आहे का? असेल तर कोणत्या नक्षत्र-पदात, त्याचा प्रभाव कोणावर पडतो (मुलावर, आई-वडिलांवर किंवा कुटुंबावर) आणि त्याची शांती कधी आणि कशी करावी?
➤ बालारिष्ट: कुंडलीत बालारिष्ट आहे का? असेल तर तो किती Strong आहे, त्याचा काळ कोणत्या वयापर्यंत आहे, आणि त्याचा भंग (रद्दीकरण) आहे की नाही - भंगाच्या अटींसह स्पष्ट करा.
➤ लग्न संधी आणि गंडांत: लग्न संधी, लग्न गंडांत किंवा तिथी गंडांत यांपैकी कोणतीही स्थिती आहे की नाही?
➤ विशेष जन्म-परिस्थिती: अमावस्या, भद्रा करण, ग्रहण काळ, संक्रांती काळ, आई-वडील किंवा भावंडाच्या जन्म नक्षत्रात जन्म - यांपैकी कोणतीही परिस्थिती लागू होते की नाही? लागू होत असेल तर त्याचा उपाय काय आहे?
➤ नजर दोष: मुलाला नजर लागण्याची प्रवृत्ती किती आहे आणि त्यापासून बचावाचे सोपे उपाय काय आहेत?
➤ आई-वडिलांसाठी सावधानता: कोणत्या वयापर्यंत मुलाच्या आरोग्याची विशेष काळजी घ्यायची आहे आणि कोणत्या गोष्टींचे लक्ष ठेवायचे आहे? (घाबरवणारी भाषा अजिबात लिहू नका - प्रत्येक गोष्ट उपायासोबत द्या.)

        let currentLang = 'hi';
        function getRawData() {
            if (currentLang === 'en') return rawData_en;
            if (currentLang === 'mr') return rawData_mr;
            return rawData_hi;
        }
        function changeLanguage(lang) {
            currentLang = lang;
            document.getElementById('prompt-container').innerHTML = '';
            processData();
        }

        // सेपरेटर लॉजिक: --- या ___ लाइन्स से अलग करना
        const separatorRegex = /\n-{10,}\n|\n_{10,}\n/g;
        
        function processData() {
            const container = document.getElementById('prompt-container');
            // पहले डैश लाइन्स से तोडें
            let parts = getRawData().split(separatorRegex);

            parts.forEach((part, index) => {
                let cleanText = part.trim();
                
                // फिल्टरिंग लॉजिक
                const lines = cleanText.split('\n');
                const filteredLines = lines.filter(line => {
                    const l = line.trim();
                    // जंक (MMM... RRR... PPPP...) हटाएं
                    if (l.match(/^[M|P|C|H|R]{5,}$/)) return false;
                    // सिर्फ डैश वाली लाइन हटाएं
                    if (l.match(/^-{5,}$/)) return false;
                    return true;
                });
                
                cleanText = filteredLines.join('\n').trim();

                if (cleanText.length > 5) { // खाली या बहुत छोटी स्ट्रिंग न दिखाएं
                    createCard(cleanText, index + 1);
                }
            });
        }

        function createCard(text, id) {
            const container = document.getElementById('prompt-container');
            
            const card = document.createElement('div');
            card.className = 'card';

            const header = document.createElement('div');
            header.className = 'card-header';
            header.innerHTML = `<span>Prompt #${id}</span>`;

            const content = document.createElement('div');
            content.className = 'card-content';
            content.innerText = text;

            const btn = document.createElement('button');
            btn.className = 'btn';
            btn.innerText = 'Copy Prompt';
            btn.onclick = () => copyText(text, btn);

            card.appendChild(header);
            card.appendChild(content);
            card.appendChild(btn);
            container.appendChild(card);
        }

        function showBtnFeedback(btn, success){
            if(!btn) return;
            var origText = btn.innerText;
            var origBg = btn.style.backgroundColor;
            btn.innerText = success ? "\u2713 Copied!" : "\u2717 Failed";
            btn.style.backgroundColor = success ? "#2e7d32" : "#c62828";
            btn.style.color = "#fff";
            setTimeout(function(){ btn.innerText = origText; btn.style.backgroundColor = origBg; }, 2000);
        }
        function copyText(text, btn) {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(() => {
                    showToast();
                    showBtnFeedback(btn, true);
                }).catch(err => {
                    fallbackCopy(text, btn);
                });
            } else {
                fallbackCopy(text, btn);
            }
        }

        function fallbackCopy(text, btn) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed'; // Avoid scrolling to bottom
            document.body.appendChild(textarea);
            textarea.focus();
            textarea.select();
            try {
                var ok = document.execCommand('copy');
                showToast();
                showBtnFeedback(btn, ok);
            } catch (err) {
                console.error('Fallback: Oops, unable to copy', err);
                showBtnFeedback(btn, false);
            }
            document.body.removeChild(textarea);
        }

        function showToast() {
            var x = document.getElementById("snackbar");
            x.className = "toast show";
            setTimeout(function(){ x.className = x.className.replace("show", ""); }, 3000);
        }

        // Initialize
        processData();

    </script>
