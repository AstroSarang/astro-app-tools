इस पूरे text को उसी तरह natural और easy-to-understand **chat/message style** में rewrite करो, जैसा कोई astrologer अपने client को WhatsApp पर personally समझा रहा हो।

ध्यान रखना:

* Original meaning, information और सभी important points बिल्कुल preserve करना।
* भाषा natural, conversational और सरल रखनी है।
* बहुत ज्यादा formal या bookish language नहीं होनी चाहिए।
* जरूरत के अनुसार paragraphs और bullet points रख सकते हो, ताकि WhatsApp पर पढ़ना आसान लगे।
* English terms जैसे Gold, Jupiter, Physical Gold, D2 (Hora), D9 Navamsha आदि जहाँ जरूरी हों, उन्हें वैसे ही रहने दो।
* Text को unnecessarily छोटा मत करना और कोई important information हटाना नहीं।
* Tone knowledgeable, confident और friendly हो — लेकिन ऐसा लगे कि कोई इंसान सामने वाले को समझाकर बता रहा है।
* शुरुआत और अंत भी natural chat की तरह रखो।
* अपनी तरफ से कोई नई astrology interpretation या fact add मत करना।
* सिर्फ दिए गए text को इसी style में rewrite करना है।

नीचे एक विस्तृत मैरेज/करियर/astrological रिपोर्ट दी गई है जिसमें कुल 23 प्रश्नों के उत्तर और
ज्योतिषीय विश्लेषण (पराशरी, जैमिनी, भृगु नंदी नाड़ी और केपी पद्धति
के आधार पर) शामिल हैं। आपको इस पूरी रिपोर्ट का विश्लेषण करके एक
'टेक्स्ट-टू-स्पीच' (TTS) ऑडियो स्क्रिप्ट तैयार करनी
है। 

स्क्रिप्ट के लिए निर्देश (सख्ती से पालन करें): 

1] रिपोर्ट जिस भाषा मे है उस भाषा मे स्क्रिप्ट तैयार करे जैसे मराठी या हिंदी
अथवा इंग्लिश. और नियम नंबर 2 मे दी गयी शूरवात भी रिपोर्ट की भाषा के अनुसार बदलना है। 

2] शुरुआत: स्क्रिप्ट की शुरुआत बिल्कुल इन शब्दों से होनी चाहिए: 'नमस्कार,
संजीवनी ज्योतिष संस्थान में आपका स्वागत है। चारुल जी, यह आपकी
व्यक्तिगत मैरेज रिपोर्ट का ऑडियो सारांश है।'

3] लंबाई और विस्तार: यह स्क्रिप्ट एक 20 मिनट के ऑडियो के लिए है। इसलिए स्क्रिप्ट
की लंबाई कम से कम 3000 से 3500 शब्दों की होनी चाहिए। रिपोर्ट के 23 सवालों को
केवल एक-एक लाइन में खत्म न करें; हर सवाल के निष्कर्ष को गहराई से और
विस्तार से समझाएं।

4] संरचना और प्रवाह: सभी 23 सवालों को एक-एक करके या तार्किक रूप से जोड़कर (जैसे:
विवाह का समय, जीवनसाथी का स्वभाव, करियर, ससुराल पक्ष और उपाय) एक कहानी और संवाद
(Conversational) के लहजे में समझाएं। क्लाइंट को ऐसा लगना चाहिए कि कोई उन्हें
सामने बैठाकर उनकी रिपोर्ट समझा रहा है।

5] तकनीकी शब्दावली से बचें: कुंडली के तकनीकी विवरणों (जैसे- ग्रहों की डिग्रियां,
D-9/D-60 चार्ट के नाम, मृत्यु भाग आदि) को सीधे पढ़ने के बजाय, उनके पीछे छिपे
अर्थ और अंतिम फलादेश को सरल भाषा में समझाएं।

5] सहानुभूति और स्पष्टता: जहाँ भी जीवनसाथी के स्वभाव में कमी/वैवाहिक जीवन में
किसी चुनौती (कड़वा सच)/करियर मे चुनौती का जिक्र हो, उसे बहुत ही सहानुभूति और मेंटरशिप वाले लहजे
में लिखें।

6] उपाय (Remedies): स्क्रिप्ट के अंत में रिपोर्ट में दिए गए सभी कर्मिक और
व्यवहारगत उपायों को स्पष्ट रूप से समझाएं।

7] TTS के अनुकूल प्रारूप: स्क्रिप्ट में किसी भी तरह के बुलेट पॉइंट्स, एस्टरिस्क
(*), हैशटैग (#), या इमोजी का प्रयोग न करें। इसे स्पष्ट पैराग्राफ में लिखें ताकि
TTS सॉफ्टवेयर इसे बिना अटके और एक प्राकृतिक मानवीय आवाज़ में पढ़ सके। अंग्रेजी
के शब्दों को देवनागरी लिपि (जैसे 'प्रैक्टिकल', 'सपोर्टिव') में ही लिखें।

अब इस रिपोर्ट के आधार पर स्क्रिप्ट तैयार करें।

        // सेपरेटर लॉजिक: --- या ___ लाइन्स से अलग करना
        const separatorRegex = /\n-{10,}\n|\n_{10,}\n/g;
        
        // बेकार लाइन्स को हटाने के लिए (जैसे MMM...RRR)
        const junkRegex = /^[M|P|C|H|R]{5,}/;

        function processData() {
            const container = document.getElementById('prompt-container');
            // पहले डैश लाइन्स से तोडें
            let parts = rawData.split(separatorRegex);

            parts.forEach((part, index) => {
                let cleanText = part.trim();

                // चेक करें कि क्या टेक्स्ट में सिर्फ जंक (MMM...RRR) है
                // या क्या यह खाली है
                let isJunk = false;
                
                // उन अजीब लाइन्स को हटाएं जो टेक्स्ट के बीच में चिपकी हो सकती हैं
                const lines = cleanText.split('\n');
                const filteredLines = lines.filter(line => {
                    const l = line.trim();
                    // अगर लाइन में बहुत सारे M, P, C, R एक साथ हैं तो उसे हटा दें
                    if (l.match(/^[M|P|C|H|R]{10,}/)) return false;
                    // अगर लाइन में सिर्फ डैशेस हैं
                    if (l.match(/^-{5,}$/)) return false;
                    return true;
                });
                
                cleanText = filteredLines.join('\n').trim();

                if (cleanText.length > 5) { // अगर 5 अक्षर से ज्यादा है तभी दिखाएं
                    createCard(cleanText, index + 1);
                }
            });
        }

        function createCard(text, id) {
            const container = document.getElementById('prompt-container');
            
            const card = document.createElement('div');
            card.className = 'card';

            const header = document.createElement('div');
            header.className = 'card-header';
            header.innerText = `Prompt #${id}`;

            const content = document.createElement('div');
            content.className = 'card-content';
            content.innerText = text;

            const btn = document.createElement('button');
            btn.className = 'btn';
            btn.innerText = 'Copy Prompt';
            btn.onclick = () => copyText(text, btn);

            card.appendChild(header);
            card.appendChild(content);
            card.appendChild(btn);
            container.appendChild(card);
        }

        function showBtnFeedback(btn, success){
            if(!btn) return;
            var origText = btn.innerText;
            var origBg = btn.style.backgroundColor;
            btn.innerText = success ? "\u2713 Copied!" : "\u2717 Failed";
            btn.style.backgroundColor = success ? "#2e7d32" : "#c62828";
            btn.style.color = "#fff";
            setTimeout(function(){ btn.innerText = origText; btn.style.backgroundColor = origBg; }, 2000);
        }
        function copyText(text, btn) {
            navigator.clipboard.writeText(text).then(() => {
                showToast();
                showBtnFeedback(btn, true);
            }).catch(err => {
                // Fallback for older browsers
                const textarea = document.createElement('textarea');
                textarea.value = text;
                document.body.appendChild(textarea);
                textarea.select();
                try {
                    var ok = document.execCommand('copy');
                    showBtnFeedback(btn, ok);
                } catch (e) {
                    console.error('Fallback: Oops, unable to copy', e);
                    showBtnFeedback(btn, false);
                }
                document.body.removeChild(textarea);
                showToast();
            });
        }

        function showToast() {
            var x = document.getElementById("snackbar");
            x.className = "toast show";
            setTimeout(function(){ x.className = x.className.replace("show", ""); }, 3000);
        }

        // Initialize
        processData();
