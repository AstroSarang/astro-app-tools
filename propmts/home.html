Process का जिक्र हटाएँ: Data, prompt, extraction या 'दिए गए data के अनुसार' जैसी बातों का कोई जिक्र न करें। सिर्फ ज्योतिषीय मार्गदर्शन साधारण शब्दों में लिखें, जैसे वह मेरी अपनी observation हो। मैंने पहले भेजी report का जिक्र करना ठीक है (जैसे 'जैसा मैंने आपकी report में भी लिखा था')।

AI जैसे घिसे-पिटे वाक्यांश न इस्तेमाल करें: 'यहाँ कुछ बातें ध्यान देने योग्य हैं', 'यह समझना महत्वपूर्ण है', 'निष्कर्ष में', 'मैं निम्नलिखित सुझाव दूँगा' जैसे वाक्यांश बिल्कुल न लिखें।

दिलेला text माझ्या (ज्योतिषाच्या) कडून माझ्या ग्राहकाला पाठवायच्या natural, संभाषणासारख्या WhatsApp message मध्ये बदला.

या सूचनांचे काटेकोरपणे पालन करा:

भाषा: Message फक्त मराठी (देवनागरी) मध्ये लिहा, अगदी natural रोजच्या बोलण्याच्या मराठीत, जसं एखादी खरी व्यक्ती WhatsApp वर लिहिते. बोलण्यात सहसा मिसळले जाणारे English शब्द (जसे report, chart, planning) चालतील, पण पूर्ण English वाक्ये लिहू नका. Roman script अजिबात नाही.

आवाज: प्रथम व्यक्तीमध्ये लिहा, जसे ज्योतिषी स्वतः ग्राहकाशी बोलत आहे. ग्राहकाला सगळीकडे 'तुम्ही' म्हणून संबोधा. ग्राहकाचा उल्लेख तृतीय व्यक्तीमध्ये कधीही करू नका - ग्राहकासाठी 'जातक', 'native', 'तो', 'ती' किंवा 'ती व्यक्ती' असे शब्द वापरू नका.

नाव: ग्राहकाचे पहिले नाव फक्त तेव्हाच वापरा जेव्हा ते दिलेल्या text मध्ये स्पष्ट दिलेले असेल. नावाचा अंदाज कधीही लावू नका, नाव बनवू नका. नाव दिलेले नसेल तर नावाशिवाय message लिहा.

Tone: ऊबदार, मैत्रीपूर्ण, वैयक्तिक, आपुलकीचा आणि संभाषणासारखा - जसे एखादी खरी व्यक्ती विचार करून WhatsApp message लिहिते. भाषा साधी, रोजची असू द्या, flow natural असू द्या. खूप औपचारिक किंवा पुस्तकी भाषा बनवू नका.

AI सारखी formatting नाही: Numbered list, bullet points, headings, bold text किंवा table अजिबात बनवू नका. Message 2-4 lines च्या लहान paragraphs मध्ये लिहा, जेणेकरून phone वर सहज वाचता येईल.

Original मध्ये table किंवा list असेल तर: दिलेल्या text मध्ये table किंवा list असेल (जसे महिना-दर-महिना तपशील), तर ते वाहत्या वाक्यांमध्ये बदला, पण प्रत्येक महिना, प्रत्येक तारीख आणि प्रत्येक माहिती तशीच ठेवा. कोणतीही row किंवा point सोडू नका.

तथ्ये अगदी अचूक ठेवा: Original मध्ये दिलेली कोणतीही तारीख, महिना, वर्ष, अंक, टक्केवारी, रत्नाचे किंवा उपायाचे नाव, वजन (रत्ती), धातू, बोट किंवा दिवस बदलू नका, मऊ करू नका, सोडू नका. Original मध्ये स्पष्ट verdict असेल - जसे हो, नाही, suitable आहे, suitable नाही, किंवा एखाद्या खास महिन्यासाठी स्पष्ट इशारा - तर तोच स्पष्ट verdict ठेवा, ठाम गोष्ट अस्पष्ट बनवू नका. Original मध्ये जे नाही असा कोणताही नवीन उपाय, रत्न, तारीख किंवा सल्ला जोडू नका.

Process चा उल्लेख काढा: Data, prompt, extraction किंवा 'दिलेल्या data नुसार' अशा गोष्टींचा कोणताही उल्लेख करू नका. फक्त ज्योतिषीय मार्गदर्शन साध्या शब्दांत लिहा, जसे ते माझे स्वतःचे observation आहे. मी आधी पाठवलेल्या report चा उल्लेख करणे ठीक आहे (जसे 'जसं मी तुमच्या report मध्येही लिहिलं होतं').

AI सारखी ठराविक वाक्ये वापरू नका: 'येथे काही गोष्टी लक्षात घेण्यासारख्या आहेत', 'हे समजून घेणे महत्त्वाचे आहे', 'शेवटी', 'मी खालील सूचना देईन' अशी वाक्ये अजिबात लिहू नका.

वैयक्तिक स्पर्श: जिथे नैसर्गिक वाटेल तिथे 'बघा', 'खरं सांगायचं तर', 'एक गोष्ट तुम्ही समजून घ्या', 'माझी सूचना आहे', 'फक्त हे लक्षात ठेवा' असे भाव वापरा, पण अतिरेक करू नका.

लांबी: Message अंदाजे original इतकाच तपशीलवार ठेवा. महत्त्वाच्या गोष्टी छोट्या करून काढू नका, आणि निरर्थक स्पष्टीकरण जोडू नका.

Emoji नाही: कोणतेही emoji, decorative symbol किंवा fancy character लावू नका.

Output: फक्त final बदललेला message द्या. कोणतेही स्पष्टीकरण, प्रस्तावना किंवा आधी-नंतरची टिप्पणी नाही.

तुम्हाला हे करायचे आहे:

3] पुढील प्रश्नांची उत्तरे त्याच माहितीच्या आणि त्याच निष्कर्षांच्या आधारे द्या. जर एखाद्या नवीन प्रश्नाचे उत्तर मागील निष्कर्षाशी विसंगत असेल, तर आधी ती विसंगती स्पष्टपणे सांगा.

आत्ता कोणतेही विश्लेषण करू नका. फक्त एवढेच सांगा:
➤ तुम्हाला कोणती माहिती आणि कोणते विश्लेषण प्राप्त झाले आहे, त्याची short मध्ये यादी द्या.
➤ शेवटी फक्त ही पुष्टी करा - तुम्ही पुढील विश्लेषणासाठी तयार आहात का?`;
        let currentLang = 'hi';
        function getRawData() {
            if (currentLang === 'en') return rawData_en;
            if (currentLang === 'mr') return rawData_mr;
            return rawData_hi;
        }
        function changeLanguage(lang) {
            currentLang = lang;
            document.getElementById('prompt-container').innerHTML = '';
            processData();
        }

        // सेपरेटर लॉजिक: --- या ___ लाइन्स से अलग करना
        const separatorRegex = /\n-{10,}\n|\n_{10,}\n/g;
        
        // बेकार लाइन्स को हटाने के लिए (जैसे MMM...RRR)
        const junkRegex = /^[M|P|C|H|R]{5,}/;

        function processData() {
            const container = document.getElementById('prompt-container');
            // पहले डैश लाइन्स से तोडें
            let parts = getRawData().split(separatorRegex);

            parts.forEach((part, index) => {
                let cleanText = part.trim();

                // चेक करें कि क्या टेक्स्ट में सिर्फ जंक (MMM...RRR) है
                // या क्या यह खाली है
                let isJunk = false;
                
                // उन अजीब लाइन्स को हटाएं जो टेक्स्ट के बीच में चिपकी हो सकती हैं
                const lines = cleanText.split('\n');
                const filteredLines = lines.filter(line => {
                    const l = line.trim();
                    // अगर लाइन में बहुत सारे M, P, C, R एक साथ हैं तो उसे हटा दें
                    if (l.match(/^[M|P|C|H|R]{10,}/)) return false;
                    // अगर लाइन में सिर्फ डैशेस हैं
                    if (l.match(/^-{5,}$/)) return false;
                    return true;
                });
                
                cleanText = filteredLines.join('\n').trim();

                if (cleanText.length > 5) { // अगर 5 अक्षर से ज्यादा है तभी दिखाएं
                    createCard(cleanText, index + 1);
                }
            });
        }

        function createCard(text, id) {
            const container = document.getElementById('prompt-container');
            
            const card = document.createElement('div');
            card.className = 'card';

            const header = document.createElement('div');
            header.className = 'card-header';
            header.innerText = `Prompt #${id}`;

            const content = document.createElement('div');
            content.className = 'card-content';
            content.innerText = text;

            const btn = document.createElement('button');
            btn.className = 'btn';
            btn.innerText = 'Copy Prompt';
            btn.onclick = () => copyText(text, btn);

            card.appendChild(header);
            card.appendChild(content);
            card.appendChild(btn);
            container.appendChild(card);
        }

        function showBtnFeedback(btn, success){
            if(!btn) return;
            var origText = btn.innerText;
            var origBg = btn.style.backgroundColor;
            btn.innerText = success ? "\u2713 Copied!" : "\u2717 Failed";
            btn.style.backgroundColor = success ? "#2e7d32" : "#c62828";
            btn.style.color = "#fff";
            setTimeout(function(){ btn.innerText = origText; btn.style.backgroundColor = origBg; }, 2000);
        }
        function copyText(text, btn) {
            navigator.clipboard.writeText(text).then(() => {
                showToast();
                showBtnFeedback(btn, true);
            }).catch(err => {
                // Fallback for older browsers
                const textarea = document.createElement('textarea');
                textarea.value = text;
                document.body.appendChild(textarea);
                textarea.select();
                try {
                    var ok = document.execCommand('copy');
                    showBtnFeedback(btn, ok);
                } catch (e) {
                    console.error('Fallback: Oops, unable to copy', e);
                    showBtnFeedback(btn, false);
                }
                document.body.removeChild(textarea);
                showToast();
            });
        }

        function showToast() {
            var x = document.getElementById("snackbar");
            x.className = "toast show";
            setTimeout(function(){ x.className = x.className.replace("show", ""); }, 3000);
        }

        // Initialize
        processData();

    </script>
