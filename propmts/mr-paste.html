<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Astrology AI Prompt Creator</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 20px;
            color: #1c1e21;
        }
        .container {
            max-width: 850px;
            margin: 0 auto;
            background: #fff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #d32f2f;
            margin-bottom: 30px;
            font-size: 24px;
        }
        .row {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }
        .col {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        label {
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }
        input, select {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }
        .section-box {
            background-color: #fafafa;
            border: 1px solid #eee;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 8px;
        }
        .section-header {
            font-weight: bold;
            color: #d32f2f;
            margin-bottom: 10px;
            border-bottom: 2px solid #d32f2f;
            display: inline-block;
            padding-bottom: 3px;
        }
        textarea {
            width: 100%;
            height: 80px;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box;
            resize: vertical;
            font-family: monospace;
        }
        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 6px;
            font-size: 18px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        #createBtn {
            background-color: #d32f2f; /* Red/Maroon theme */
            color: white;
            margin-top: 10px;
        }
        #createBtn:hover {
            background-color: #b71c1c;
        }
        #outputArea {
            margin-top: 40px;
            display: none;
        }
        #finalPrompt {
            height: 400px;
            font-size: 14px;
            line-height: 1.5;
            background-color: #fffde7;
        }
        #copyBtn {
            background-color: #388e3c;
            color: white;
            margin-top: 15px;
        }
        #copyBtn:hover {
            background-color: #2e7d32;
        }
        @media (max-width: 600px) {
            .row {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>MR Paste प्रॉम्प्ट जनरेटर</h1>

    <!-- Basic Info -->
    <div class="row">
        <div class="col">
            <label>1. नाम (Name):</label>
            <input type="text" id="name" placeholder="उदा. सारंग">
        </div>
        <div class="col">
            <label>2. लिंग (Gender):</label>
            <select id="gender">
                <option value="जातक">जातक (Male)</option>
                <option value="जातिका">जातिका (Female)</option>
            </select>
        </div>
        <div class="col">
            <label>3. जीवनसाथी (Spouse):</label>
            <select id="spouse">
                <option value="पत्नी">पत्नी (Wife)</option>
                <option value="पति">पति (Husband)</option>
            </select>
        </div>
        <div class="col">
            <label>4. भाषा (Language):</label>
            <select id="lang" onchange="if(document.getElementById('finalPrompt').value) generatePrompt();">
                <option value="hi" selected>हिंदी</option>
                <option value="en">English</option>
                <option value="mr">मराठी</option>
            </select>
        </div>
    </div>

    <!-- Data Sections -->
    <div class="section-box">
        <div class="section-header">पराशरी डेटा (Parashari Data)</div>
        <textarea id="dataParashari" placeholder="यहाँ पराशरी डेटा पेस्ट करें..."></textarea>
    </div>

    <div class="section-box">
        <div class="section-header">जैमिनी डेटा (Jaimini Data)</div>
        <textarea id="dataJaimini" placeholder="यहाँ जैमिनी डेटा पेस्ट करें..."></textarea>
    </div>

    <div class="section-box">
        <div class="section-header">BNN डेटा (Bhrigu Nandi Nadi Data)</div>
        <textarea id="dataBNN" placeholder="यहाँ BNN डेटा पेस्ट करें..."></textarea>
    </div>

    <div class="section-box">
        <div class="section-header">KP डेटा (Krishnamurti Paddhati Data)</div>
        <textarea id="dataKP" placeholder="यहाँ KP डेटा पेस्ट करें..."></textarea>
    </div>

    <button id="createBtn" onclick="generatePrompt()">Create Prompt (प्रॉम्प्ट बनाएँ)</button>

    <!-- Output Section -->
    <div id="outputArea">
        <h3 style="margin-bottom:5px;">आपका तैयार प्रॉम्प्ट:</h3>
        <textarea id="finalPrompt" readonly></textarea>
        <button id="copyBtn" onclick="copyToClipboard()">Copy Prompt (प्रॉम्प्ट कॉपी करें)</button>
    </div>

</div>

<script>
    const T = {
        hi: {
            p1: (n,g,s)=>`निम्मलिखित ${n} नामक ${g} के कुंडली के आधार पर उसकी संभावित ${s} के स्वभाव का गहन और विस्तारपूर्वक विश्लेषण (Detailed Analysis) कीजिए, ध्यान रहे सभी 10 बिंदुओं के साथ-साथ उनके प्रत्येक उपबिन्दुओ का भी विश्लेषण विस्तारपूर्वक होना चाहिए, अंत में प्रत्येक बिंदु का निष्कर्ष (Detailed Conclusion) भी दीजिए।`,
            c1: `विस्तारपूर्वक समग्र पराशरी निष्कर्ष :\n-------------------------------------------`,
            p2: (n,g,s)=>`निम्मलिखित ${n} नामक ${g} के कुंडली के आधार पर उसकी संभावित ${s} के स्वभाव का गहन और विस्तारपूर्वक विश्लेषण (Detailed Analysis) कीजिए, ध्यान रहे सभी 6 बिंदुओं के साथ-साथ उनके प्रत्येक उपबिन्दुओ का भी विश्लेषण विस्तारपूर्वक होना चाहिए, अंत में प्रत्येक बिंदु का निष्कर्ष (Detailed Conclusion) भी दीजिए।`,
            c2: `विस्तारपूर्वक समग्र जैमिनी निष्कर्ष :\n-------------------------------------------`,
            p3: (n,g,s)=>`निम्मलिखित ${n} नामक ${g} के कुंडली के आधार पर उसकी संभावित ${s} के स्वभाव का गहन और विस्तारपूर्वक विश्लेषण (Detailed Analysis) कीजिए, ध्यान रहे सभी 4 बिंदुओं के साथ-साथ उनके प्रत्येक उपबिन्दुओ का भी विश्लेषण विस्तारपूर्वक होना चाहिए, अंत में प्रत्येक बिंदु का निष्कर्ष (Detailed Conclusion) भी दीजिए।`,
            c3: `विस्तारपूर्वक समग्र BNN निष्कर्ष :\n-------------------------------------------`,
            p4: (n,g,s)=>`निम्मलिखित ${n} नामक ${g} के कुंडली के आधार पर उसकी संभावित ${s} के स्वभाव का गहन और विस्तारपूर्वक विश्लेषण (Detailed Analysis) कीजिए, ध्यान रहे सभी 5 बिंदुओं के साथ-साथ उनके प्रत्येक उपबिन्दुओ का भी विश्लेषण विस्तारपूर्वक होना चाहिए, अंत में प्रत्येक बिंदु का निष्कर्ष (Detailed Conclusion) भी दीजिए।`,
            c4: `विस्तारपूर्वक समग्र KP निष्कर्ष :`
        },
        en: {
            p1: (n,g,s)=>`Based on the horoscope of ${n} (${g}), provide a deep and detailed analysis of the nature of their prospective ${s}. Ensure all 10 points along with each of their sub-points are analyzed in detail, and provide a detailed conclusion for each point at the end.`,
            c1: `Detailed Overall Parashari Conclusion:\n-------------------------------------------`,
            p2: (n,g,s)=>`Based on the horoscope of ${n} (${g}), provide a deep and detailed analysis of the nature of their prospective ${s}. Ensure all 6 points along with each of their sub-points are analyzed in detail, and provide a detailed conclusion for each point at the end.`,
            c2: `Detailed Overall Jaimini Conclusion:\n-------------------------------------------`,
            p3: (n,g,s)=>`Based on the horoscope of ${n} (${g}), provide a deep and detailed analysis of the nature of their prospective ${s}. Ensure all 4 points along with each of their sub-points are analyzed in detail, and provide a detailed conclusion for each point at the end.`,
            c3: `Detailed Overall BNN Conclusion:\n-------------------------------------------`,
            p4: (n,g,s)=>`Based on the horoscope of ${n} (${g}), provide a deep and detailed analysis of the nature of their prospective ${s}. Ensure all 5 points along with each of their sub-points are analyzed in detail, and provide a detailed conclusion for each point at the end.`,
            c4: `Detailed Overall KP Conclusion:`
        },
        mr: {
            p1: (n,g,s)=>`${n} नावाच्या ${g} च्या कुंडलीच्या आधारे त्याच्या/तिच्या संभाव्य ${s} च्या स्वभावाचे सखोल आणि तपशीलवार विश्लेषण (Detailed Analysis) करा, सर्व 10 मुद्दे आणि त्यांच्या प्रत्येक उपमुद्द्यांचे तपशीलवार विश्लेषण झाले पाहिजे याची काळजी घ्या, शेवटी प्रत्येक मुद्द्याचा निष्कर्ष (Detailed Conclusion) द्या.`,
            c1: `तपशीलवार समग्र पराशरी निष्कर्ष :\n-------------------------------------------`,
            p2: (n,g,s)=>`${n} नावाच्या ${g} च्या कुंडलीच्या आधारे त्याच्या/तिच्या संभाव्य ${s} च्या स्वभावाचे सखोल आणि तपशीलवार विश्लेषण (Detailed Analysis) करा, सर्व 6 मुद्दे आणि त्यांच्या प्रत्येक उपमुद्द्यांचे तपशीलवार विश्लेषण झाले पाहिजे याची काळजी घ्या, शेवटी प्रत्येक मुद्द्याचा निष्कर्ष (Detailed Conclusion) द्या.`,
            c2: `तपशीलवार समग्र जैमिनी निष्कर्ष :\n-------------------------------------------`,
            p3: (n,g,s)=>`${n} नावाच्या ${g} च्या कुंडलीच्या आधारे त्याच्या/तिच्या संभाव्य ${s} च्या स्वभावाचे सखोल आणि तपशीलवार विश्लेषण (Detailed Analysis) करा, सर्व 4 मुद्दे आणि त्यांच्या प्रत्येक उपमुद्द्यांचे तपशीलवार विश्लेषण झाले पाहिजे याची काळजी घ्या, शेवटी प्रत्येक मुद्द्याचा निष्कर्ष (Detailed Conclusion) द्या.`,
            c3: `तपशीलवार समग्र BNN निष्कर्ष :\n-------------------------------------------`,
            p4: (n,g,s)=>`${n} नावाच्या ${g} च्या कुंडलीच्या आधारे त्याच्या/तिच्या संभाव्य ${s} च्या स्वभावाचे सखोल आणि तपशीलवार विश्लेषण (Detailed Analysis) करा, सर्व 5 मुद्दे आणि त्यांच्या प्रत्येक उपमुद्द्यांचे तपशीलवार विश्लेषण झाले पाहिजे याची काळजी घ्या, शेवटी प्रत्येक मुद्द्याचा निष्कर्ष (Detailed Conclusion) द्या.`,
            c4: `तपशीलवार समग्र KP निष्कर्ष :`
        }
    };

    function generatePrompt() {
        // 1. Get Variable Inputs
        let name = document.getElementById('name').value.trim();
        if(name === "") name = "xyz";
        
        const gender = document.getElementById('gender').value; // जातक / जातिका
        const spouse = document.getElementById('spouse').value; // पत्नी / पति

        // 2. Get Data Inputs
        const dParashari = document.getElementById('dataParashari').value.trim();
        const dJaimini = document.getElementById('dataJaimini').value.trim();
        const dBNN = document.getElementById('dataBNN').value.trim();
        const dKP = document.getElementById('dataKP').value.trim();

        // 3. Construct Strings exactly as requested
        
        // --- Block 1: Parashari ---
        // Structure: Instruction (10 points) -> Data -> Conclusion Header
        const lang = document.getElementById('lang').value || 'hi';
        const t = T[lang] || T.hi;
        // Gender/spouse labels per language
        let gLabel = gender, sLabel = spouse;
        if(lang==='en'){ gLabel = (gender==='जातक'?'native (male)':'native (female)'); sLabel = (spouse==='पत्नी'?'wife':'husband'); }
        if(lang==='mr'){ gLabel = (gender==='जातक'?'जातक (पुरुष)':'जातिका (महिला)'); sLabel = (spouse==='पत्नी'?'पत्नी':'पती'); }

        const blockParashari = `${t.p1(name,gLabel,sLabel)}

${dParashari}

${t.c1}`;

        // --- Block 2: Jaimini ---
        // Structure: Instruction (6 points) -> Data -> Conclusion Header
        const blockJaimini = `${t.p2(name,gLabel,sLabel)}

${dJaimini}

${t.c2}`;

        // --- Block 3: BNN ---
        // Structure: Instruction (4 points) -> Data -> Conclusion Header
        const blockBNN = `${t.p3(name,gLabel,sLabel)}

${dBNN}

${t.c3}`;

        // --- Block 4: KP ---
        // Structure: Instruction (2 points) -> Data -> Conclusion Header
        const blockKP = `${t.p4(name,gLabel,sLabel)}

${dKP}

${t.c4}`;

        // Combine All Blocks with spacing
        const fullPrompt = `${blockParashari}

${blockJaimini}

${blockBNN}

${blockKP}`;

        // 4. Display Result
        document.getElementById('finalPrompt').value = fullPrompt;
        document.getElementById('outputArea').style.display = 'block';
        
        // Scroll to output
        document.getElementById('outputArea').scrollIntoView({behavior: "smooth"});
    }

    function showCopyFeedback(btn, success){
        const origText = btn.innerHTML;
        const origBg = btn.style.background;
        if(success){
            btn.innerHTML = "✓ कॉपी हो गया!";
            btn.style.background = "#2e7d32";
        } else {
            btn.innerHTML = "✗ कॉपी नहीं हुआ";
            btn.style.background = "#c62828";
        }
        setTimeout(()=>{
            btn.innerHTML = origText;
            btn.style.background = origBg;
        }, 2000);
    }
    function copyToClipboard() {
        const copyText = document.getElementById("finalPrompt");
        const btn = document.getElementById("copyBtn") || event.target;
        const val = copyText.value;
        if(!val){ alert("पहले प्रॉम्प्ट बनाएं!"); return; }
        // Try modern clipboard API first
        if(navigator.clipboard && window.isSecureContext){
            navigator.clipboard.writeText(val).then(()=>{
                showCopyFeedback(btn, true);
            }).catch(()=>{ fallbackCopy(copyText, btn); });
        } else {
            fallbackCopy(copyText, btn);
        }
    }
    function fallbackCopy(el, btn){
        el.focus(); el.select();
        el.setSelectionRange(0, 99999);
        try{
            const ok = document.execCommand('copy');
            showCopyFeedback(btn, ok);
            if(!ok) setTimeout(()=>alert("कॉपी नहीं हुआ - manually select करके copy करें"), 2100);
        }catch(e){
            showCopyFeedback(btn, false);
        }
    }
</script>

</body>
</html>
