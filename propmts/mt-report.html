➤ नवमांश में सप्तमेश ग्रह की युति या दृष्टि किन ग्रहों से हो रही है?
➤ नवमांश में सप्तमेश से युत ग्रह किस नक्षत्र में स्थित है?

➤ नवमांश में लग्नेश ग्रह किस भाव, राशी और नक्षत्र (स्वामी) में स्थित है?

भाग 2: जैमिनी ज्योतिष के अनुसार विवाह:

1] दाराकारक (DK - Darakaraka):

➤ जैमिनी पद्धति से दाराकारक ग्रह कौन-सा है? (सबसे कम अंश वाला ग्रह)

➤ दाराकारक किस नवमांश में स्थित है?

➤ इस पर किन राशियों की जैमिनी राशि दृष्टि है? (चर,स्थिर,द्विस्वभाव)

3] दारापद (Darapada - A7):
➤ A7 (दारापद)  किस राशि और भाव में स्थित है?

4] स्वांश और कारकांश से विवाह का विश्लेषण (आत्मा के दृष्टिकोण से):

A] स्वांश सप्तम भाव (आंतरिक वैवाहिक जीवन):

➤ कारकांश सप्तमेश किन ग्रहों के साथ युति में है?

भाग 3: भृगु नंदी नाड़ी (BNN) के अनुसार जीवनसाथी का विश्लेषण:

1] गुरु (Jupiter) - जीव कारक की स्थिति और संबंध:

➤ गुरु किस राशि में है (और किस डिग्री पर है)?
➤ गुरु किस ग्रह के नक्षत्र में है?
➤ गुरु के साथ युति में ग्रह कौन से हैं?
➤ गुरु से दूसरी और बारहवीं राशि में कौन से ग्रह हैं?
➤ गुरु से त्रिकोण (1-5-9) में कौन से ग्रह हैं?
विश्लेषण: जातक का मूल व्यक्तित्व, स्वभाव, भाग्य और विवाह के प्रति दृष्टिकोण।

2] जीवनसाथी कारक की स्थिति और संबंध (पुरुष के लिए शुक्र, स्त्री के लिए मंगल):

➤ कुंडली के जेंडर के अनुसार जीवनसाथी कारक ग्रह का चयन करें (पुरुष जातक = शुक्र, स्त्री जातक = मंगल)।
➤ यह कारक ग्रह किस राशि में है (और किस डिग्री पर है)?
➤ यह कारक ग्रह किस ग्रह के नक्षत्र में है?
➤ इस कारक ग्रह के साथ युति में ग्रह कौन से हैं?
➤ इस कारक ग्रह से दूसरी और बारहवीं राशि में कौन से ग्रह हैं?
➤ इस कारक ग्रह से त्रिकोण (1-5-9) में कौन से ग्रह हैं?
विश्लेषण: जीवनसाथी की मूल प्रकृति, रंग-रूप, व्यवहार और वैवाहिक सुख की गुणवत्ता।

3] जीव/स्वयं और जीवनसाथी का आपसी संबंध - विवाह का मुख्य सूत्र:

➤ पुरुष की कुंडली में: क्या गुरु (जीव) और शुक्र (पत्नी) युति, 2-12, या 1-5-9 संबंध में हैं?
➤ स्त्री की कुंडली में: क्या शुक्र (स्वयं स्त्री देह) और मंगल (पति) युति, 2-12, या 1-5-9 संबंध में हैं?
➤ यदि युति है, तो उनकी डिग्री में कितनी निकटता है? कोई अन्य आपसी संबंध?
विश्लेषण: विवाह की प्रबलता, पति-पत्नी के बीच आपसी संबंध की प्रकृति और वैवाहिक आनंद।

4] अन्य महत्वपूर्ण ग्रहों का प्रभाव:

➤ शनि (कर्म): शनि का जीवनसाथी कारक ग्रह (पुरुष के लिए शुक्र, स्त्री के लिए मंगल) से क्या संबंध है (युति, 2-12, 1-5-9)?
➤ राहु और केतु: राहु/केतु का जीवनसाथी कारक ग्रह या विवाह सूत्र (गुरु-शुक्र या शुक्र-मंगल) से क्या संबंध है? (यह अलगाव, विजातीय विवाह या बाधाओं को दर्शाता है)।
➤ वक्र ग्रह: क्या जीवनसाथी कारक ग्रह, गुरु, या उन पर प्रभाव डालने वाला कोई ग्रह वक्री (Retrograde) है?

भाग 4: कृष्णमूर्ति पद्धति (KP) के अनुसार विवाह और जीवनसाथी का विश्लेषण:

1] विवाह का वादा (Promise of Marriage):
➤ 7वें भाव का कस्पल सब-लॉर्ड (CSL) कौन है?
➤ यह CSL किन भावों को सिग्निफाई कर रहा है (विशेषकर 2, 7, 11 भावों के संबंध)?
➤ क्या यह CSL विवाह को अस्वीकार करने वाले भावों (जैसे 1, 6, 8, 10, 12 - जो अलगाव या देरी दर्शाते हैं) को भी सिग्निफाई कर रहा है?

2] विवाह में देरी के योग (Delay in & Obstacles in Marriage):

➤ क्या 7th CSL शनि है, या शनि के नक्षत्र में बैठा है?
➤ क्या 7th CSL प्रबल रूप से 8वें भाव (रुकावट, देरी और अचानक बाधा) को सिग्निफाई कर रहा है?
➤ क्या 7th CSL प्रबल रूप से 12वें भाव (विवाह विरक्ति, दूर जाने और एकांत) तथा 1, 6, 10 भावों (विवाह के बाधक भाव) को सिग्निफाई कर रहा है?

3] जीवनसाथी की प्रकृति और वैवाहिक संबंध: (Nature of Spouse & Marital Relations)
➤ 7वें CSL का नक्षत्र स्वामी कौन है और वह कहाँ स्थित है?
➤ 7वें CSL का उप-स्वामी कौन है और वह कहाँ स्थित है?

भाग 1: पराशरी ज्योतिष के अनुसार विवाह के समय का विश्लेषण

3] गोचर विश्लेषण :
➤ सभी संभावित दशा अवधि में गुरु और शनि का संयुक्त प्रभाव: 
उपरोक्त कुंडली डेटा और गोचर विवरणों के आधार पर, अगले 7 वर्षों के लिए गुरु (बृहस्पति) और शनि के संयुक्त प्रभाव (Double Transit) की एक विस्तृत तालिका तैयार करें। यह विश्लेषण पूरी तरह से ग्रहों की दृष्टि और स्थिति (Transit Aspects/Positions) पर आधारित होना चाहिए।

तालिका का प्रारूप और कॉलम:
| समय (अवधि) | गुरु का गोचर प्रभाव (D1+D9) | शनि का गोचर प्रभाव (D1+D9) | संयुक्त प्रभाव (Double Transit) | विवाह की संभावना का अंतिम निष्कर्ष |

जाँच के लिए मुख्य चेकलिस्ट निर्देश:
प्रत्येक गोचर अवधि के लिए, निम्नलिखित बिंदुओं पर गुरु और शनि के प्रभाव (दृष्टि या युति) की सूक्ष्मता से जाँच करें:

1] गोचर के गुरु (Jupiter) के लिए:
- जन्म कुंडली (D1): सप्तम भाव/सप्तमेश, लग्न/लग्नेश, लाभ भाव/लाभेश, परिवार भाव/द्वितीयेश।
- कारक: जन्म शुक्र, जन्म गुरु, चंद्र लग्न (राशि)।
- नवांश (D9): नवांश लग्न और नवांश सप्तम भाव।

2] गोचर के शनि (Saturn) के लिए:
- जन्म कुंडली (D1): लग्न/लग्नेश, सप्तम भाव/सप्तमेश, लाभ भाव/लाभेश, परिवार भाव/द्वितीयेश।
- कारक: जन्म शुक्र, जन्म गुरु, चंद्र लग्न (राशि)।
- नवांश (D9): नवांश लग्न और नवांश सप्तम भाव।

तालिका के नियम:
- प्रभाव कॉलम: केवल उन प्रभावित बिंदुओं के नाम लिखें जिनका संबंध बन रहा है (जैसे: 'सप्तम भाव और जन्म शुक्र पर दृष्टि')।
- संयुक्त प्रभाव: यदि गुरु और शनि दोनों एक साथ किन्हीं विवाह कारकों (विशेषकर लग्न या 7वें भाव) को प्रभावित कर रहे हैं, तो 'सक्रिय (Double Transit Active)' लिखें।
- निष्कर्ष: प्रभाव की तीव्रता और दोहरे गोचर की सक्रियता के आधार पर 'प्रबल', 'औसत' या 'न्यून' लिखें।

➤ क्या गोचर के गुरु और शनि, दोनों एक साथ प्रभावित (दृष्टि या युति द्वारा) कर रहे हैं, ऐसी अवधि है?

विश्लेषण (गोचर): दशा द्वारा पहचानी गई "समय सीमा" के भीतर, दोहरे गोचर का नियम उस विशिष्ट वर्ष को इंगित करता है जब विवाह की घटना घटित होने की सबसे अधिक संभावना है।
----------
उपरोक्त फाइलों और उपलब्ध डेटा के आधार पर, जातक के लिए अगले 7 वर्षों के गुरु (बृहस्पति) के गोचर की एक विस्तृत 'विवाह केंद्रित शक्ति तालिका' तैयार करें।
​तालिका का प्रारूप और कॉलम (अनिवार्य):
| गोचर भाव (L/M) | समय (अवधि) | SAV | BAV | BAL | गुणवत्ता | विवाह पर प्रभाव | विवाह के सहायक भावों पर प्रभाव | विवाह की संभावना का अंतिम निष्कर्ष |
​डेटा प्रोसेसिंग के सख्त नियम:
​शक्ति डेटा (SAV/BAV/BAL): इन मानों को कुंडली के अष्टकवर्ग (Sarva/Bhinna) और भाव-बल (Bhava Bala) खंड से निकालें।
​विवाह पर प्रभाव: गुरु का गोचर में 7वें भाव, सप्तमेश, जन्म शुक्र, या जन्म गुरु से दृष्टि/स्थिति संबंध जाँचे।
​सहायक भावों पर प्रभाव: गुरु का 11वें, 2रे, 9वें भाव या जन्म शनि से दृष्टि/स्थिति संबंध जाँचे।
​गुणवत्ता (Quality) लॉजिक: SAV > 28 और BAL > 500 होने पर 'High', केवल SAV > 28 होने पर 'Medium', अन्यथा 'Low' लिखें।
​अंतिम निष्कर्ष: यदि 'विवाह पर प्रभाव' सक्रिय है और 'गुणवत्ता' High/Medium है, तो 'प्रबल संभावना' लिखें। यदि दोनों कम हैं, तो 'न्यून' लिखें।
----------
SAV/BAV गलत हो गए सभी, मिसमैच हो गए, राशी के अनुसार लो.
----------
4] बल और क्षमता का विश्लेषण (गोचर की पुष्टि के लिए) :
➤ अष्टकवर्ग :
A] सर्वाष्टकवर्ग:

➤ षड्बल-भावबल :
▸ क्या निकाली गयी सभी संभावित टाइम विंडो में दशा स्वामी (MD/AD/PD lords) षड्बल में बलवान हैं?

विश्लेषण (बल): यह पुष्टि करता है कि क्या ग्रह और भाव फल देने में सक्षम हैं। बलवान ग्रह और भाव गोचर के दौरान निश्चित रूप से फल देते हैं।

सभी संभावित टाइम विंडो में कितने कितने % विवाह की संभावना है ?
----------
अंतिम समग्र विश्लेषण (पराशरी):
एक ऐसा समय जब:
➤ विंशोत्तरी दशा (MD-AD-PD) अनुकूल हो।
➤ योगिनी दशा (MD-AD-PD) अनुकूल हो।

3] गोचर विश्लेषण :
➤ सर्व संभाव्य दशा कालावधीत गुरू आणि शनीचा संयुक्त प्रभाव: 
वरील कुंडली डेटा आणि गोचर तपशिलांच्या आधारे, पुढील 7 वर्षांसाठी गुरू (बृहस्पति) आणि शनीच्या संयुक्त प्रभावाची (Double Transit) एक विस्तृत तक्ता तयार करा. हे विश्लेषण पूर्णपणे ग्रहांच्या दृष्टी आणि स्थितीवर (Transit Aspects/Positions) आधारित असले पाहिजे.

तक्त्याचे स्वरूप आणि स्तंभ:
| वेळ (कालावधी) | गुरूचा गोचर प्रभाव (D1+D9) | शनीचा गोचर प्रभाव (D1+D9) | संयुक्त प्रभाव (Double Transit) | विवाहाच्या शक्यतेचा अंतिम निष्कर्ष |

तपासणीसाठी मुख्य चेकलिस्ट सूचना:
प्रत्येक गोचर कालावधीसाठी, खालील बिंदूंवर गुरू आणि शनीच्या प्रभावाची (दृष्टी किंवा युती) सूक्ष्मपणे तपासणी करा:

1] गोचरातील गुरूसाठी (Jupiter):
- जन्म कुंडली (D1): सप्तम भाव/सप्तमेश, लग्न/लग्नेश, लाभ भाव/लाभेश, कुटुंब भाव/द्वितीयेश.
- कारक: जन्म शुक्र, जन्म गुरू, चंद्र लग्न (राशी).
- नवमांश (D9): नवमांश लग्न आणि नवमांश सप्तम भाव.

2] गोचरातील शनीसाठी (Saturn):
- जन्म कुंडली (D1): लग्न/लग्नेश, सप्तम भाव/सप्तमेश, लाभ भाव/लाभेश, कुटुंब भाव/द्वितीयेश.
- कारक: जन्म शुक्र, जन्म गुरू, चंद्र लग्न (राशी).
- नवमांश (D9): नवमांश लग्न आणि नवमांश सप्तम भाव.

तक्त्याचे नियम:
- प्रभाव स्तंभ: फक्त त्या प्रभावित बिंदूंची नावे लिहा ज्यांच्याशी संबंध बनत आहे (जसे: 'सप्तम भाव आणि जन्म शुक्रावर दृष्टी').
- संयुक्त प्रभाव: जर गुरू आणि शनी दोन्ही एकाच वेळी कोणत्याही विवाह कारकांना (विशेषतः लग्न किंवा 7व्या भावाला) प्रभावित करत असतील, तर 'सक्रिय (Double Transit Active)' लिहा.
- निष्कर्ष: प्रभावाच्या तीव्रतेवर आणि दुहेरी गोचराच्या सक्रियतेवर आधारित 'प्रबल', 'मध्यम' किंवा 'न्यून' लिहा.

➤ गोचराचे गुरू आणि शनी, दोन्ही एकाच वेळी प्रभावित (दृष्टी किंवा युतीद्वारे) करत आहेत, असा कालावधी आहे का?

----------

| गोचर भाव (L/M) | वेळ (कालावधी) | SAV | BAV | BAL | गुणवत्ता | विवाहावर प्रभाव | विवाहाच्या सहाय्यक भावांवर प्रभाव | विवाहाच्या शक्यतेचा अंतिम निष्कर्ष |
​डेटा प्रक्रियेचे कठोर नियम:
​शक्ति डेटा (SAV/BAV/BAL): ही मूल्ये कुंडलीच्या अष्टकवर्ग (Sarva/Bhinna) आणि भाव-बल (Bhava Bala) विभागातून काढा.
​विवाहावर प्रभाव: गोचरात गुरूचा 7व्या भावाशी, सप्तमेशाशी, जन्म शुक्राशी किंवा जन्म गुरूशी दृष्टी/स्थिती संबंध तपासा.
​सहाय्यक भावांवर प्रभाव: गुरूचा 11व्या, 2ऱ्या, 9व्या भावाशी किंवा जन्म शनीशी दृष्टी/स्थिती संबंध तपासा.
​गुणवत्ता (Quality) लॉजिक: SAV > 28 आणि BAL > 500 असल्यास 'High', फक्त SAV > 28 असल्यास 'Medium', अन्यथा 'Low' लिहा.
​अंतिम निष्कर्ष: जर 'विवाहावर प्रभाव' सक्रिय असेल आणि 'गुणवत्ता' High/Medium असेल, तर 'प्रबल शक्यता' लिहा. जर दोन्ही कमी असतील, तर 'न्यून' लिहा.

        let currentLang = 'hi';
        function getRawData() {
            if (currentLang === 'en') return rawData_en;
            if (currentLang === 'mr') return rawData_mr;
            return rawData_hi;
        }
        function changeLanguage(lang) {
            currentLang = lang;
            document.getElementById('prompt-container').innerHTML = '';
            processData();
        }

        // सेपरेटर लॉजिक: --- या ___ लाइन्स से अलग करना
        const separatorRegex = /\n-{10,}\n|\n_{10,}\n/g;
        
        function processData() {
            const container = document.getElementById('prompt-container');
            // पहले डैश लाइन्स से तोडें
            let parts = getRawData().split(separatorRegex);

            parts.forEach((part, index) => {
                let cleanText = part.trim();
                
                // फिल्टरिंग लॉजिक
                const lines = cleanText.split('\n');
                const filteredLines = lines.filter(line => {
                    const l = line.trim();
                    // जंक (MMM... RRR... PPPP...) हटाएं
                    if (l.match(/^[M|P|C|H|R]{5,}$/)) return false;
                    // सिर्फ डैश वाली लाइन हटाएं
                    if (l.match(/^-{5,}$/)) return false;
                    return true;
                });
                
                cleanText = filteredLines.join('\n').trim();

                if (cleanText.length > 5) { // खाली या बहुत छोटी स्ट्रिंग न दिखाएं
                    createCard(cleanText, index + 1);
                }
            });
        }

        function createCard(text, id) {
            const container = document.getElementById('prompt-container');
            
            const card = document.createElement('div');
            card.className = 'card';

            const header = document.createElement('div');
            header.className = 'card-header';
            header.innerHTML = `<span>Prompt #${id}</span>`;

            const content = document.createElement('div');
            content.className = 'card-content';
            content.innerText = text;

            const btn = document.createElement('button');
            btn.className = 'btn';
            btn.innerText = 'Copy Prompt';
            btn.onclick = () => copyText(text, btn);

            card.appendChild(header);
            card.appendChild(content);
            card.appendChild(btn);
            container.appendChild(card);
        }

        function showBtnFeedback(btn, success){
            if(!btn) return;
            var origText = btn.innerText;
            var origBg = btn.style.backgroundColor;
            btn.innerText = success ? "\u2713 Copied!" : "\u2717 Failed";
            btn.style.backgroundColor = success ? "#2e7d32" : "#c62828";
            btn.style.color = "#fff";
            setTimeout(function(){ btn.innerText = origText; btn.style.backgroundColor = origBg; }, 2000);
        }
        function copyText(text, btn) {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(() => {
                    showToast();
                    showBtnFeedback(btn, true);
                }).catch(err => {
                    fallbackCopy(text, btn);
                });
            } else {
                fallbackCopy(text, btn);
            }
        }

        function fallbackCopy(text, btn) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed'; // Avoid scrolling to bottom
            document.body.appendChild(textarea);
            textarea.focus();
            textarea.select();
            try {
                var ok = document.execCommand('copy');
                showToast();
                showBtnFeedback(btn, ok);
            } catch (err) {
                console.error('Fallback: Oops, unable to copy', err);
                showBtnFeedback(btn, false);
            }
            document.body.removeChild(textarea);
        }

        function showToast() {
            var x = document.getElementById("snackbar");
            x.className = "toast show";
            setTimeout(function(){ x.className = x.className.replace("show", ""); }, 3000);
        }

        // Initialize
        processData();

    </script>
</body>
</html>
