<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Career Analysis Tool (Final)</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #e1f5fe; /* Light Blue */
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #01579b;
            margin-bottom: 25px;
        }
        .row {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }
        .col {
            flex: 1;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 16px;
        }
        .section-box {
            background: #f1f8e9;
            padding: 15px;
            border: 1px solid #c5e1a5;
            margin-bottom: 15px;
            border-radius: 5px;
        }
        .section-title {
            color: #2e7d32;
            font-weight: bold;
            margin-bottom: 10px;
            border-bottom: 2px solid #2e7d32;
            display: inline-block;
        }
        textarea {
            height: 80px;
            resize: vertical;
        }
        button {
            width: 100%;
            padding: 15px;
            background-color: #01579b;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #0277bd;
        }
        #outputArea {
            margin-top: 30px;
            display: none;
            border-top: 3px solid #01579b;
            padding-top: 20px;
        }
        #finalPrompt {
            height: 350px;
            font-family: monospace;
            background-color: #fff8e1;
        }
        .copy-btn {
            background-color: #2e7d32;
            margin-top: 15px;
        }
        .copy-btn:hover {
            background-color: #1b5e20;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>CR Paste प्रॉम्प्ट जनरेटर</h1>

    <!-- Inputs -->
    <div class="row">
        <div class="col">
            <label>1. नाम (Name):</label>
            <input type="text" id="name" placeholder="उदा. विजय">
        </div>
        <div class="col">
            <label>2. लिंग (Gender):</label>
            <select id="gender">
                <option value="जातक">जातक (Male)</option>
                <option value="जातिका">जातिका (Female)</option>
            </select>
        </div>
    </div>

    <!-- Data Areas -->
    <div class="section-box">
        <div class="section-title">Parashari Data</div>
        <textarea id="dataParashari" placeholder="पराशरी डेटा यहाँ पेस्ट करें..."></textarea>
    </div>

    <div class="section-box">
        <div class="section-title">Jaimini Data</div>
        <textarea id="dataJaimini" placeholder="Jaimini डेटा यहाँ पेस्ट करें..."></textarea>
    </div>

    <div class="section-box">
        <div class="section-title">BNN Data</div>
        <textarea id="dataBNN" placeholder="BNN डेटा यहाँ पेस्ट करें..."></textarea>
    </div>

    <div class="section-box">
        <div class="section-title">KP Data</div>
        <textarea id="dataKP" placeholder="KP डेटा यहाँ पेस्ट करें..."></textarea>
    </div>

    <button onclick="generatePrompt()">Create Prompt (प्रॉम्प्ट बनाएँ)</button>

    <!-- Output -->
    <div id="outputArea">
        <label>आपका प्रॉम्प्ट (Your Prompt):</label>
        <textarea id="finalPrompt" readonly></textarea>
        <button class="copy-btn" onclick="copyToClipboard()">Copy Prompt</button>
    </div>
</div>

<script>
    function generatePrompt() {
        try {
            // 1. Get Values
            var nameRaw = document.getElementById('name').value;
            var name = nameRaw.trim() === "" ? "xyz" : nameRaw.trim();
            var gender = document.getElementById('gender').value;

            var dParashari = document.getElementById('dataParashari').value.trim();
            var dJaimini = document.getElementById('dataJaimini').value.trim();
            var dBNN = document.getElementById('dataBNN').value.trim();
            var dKP = document.getElementById('dataKP').value.trim();

            // 2. Build Strings based on your specific text requests
            
            // Part 1: Intro + Parashari (8 Points Intro)
            var section1 = "निम्मलिखित " + name + " नामक " + gender + " के कुंडली के आधार पर उसके संभावित करियर विश्लेषण रिपोर्ट का गहन और विस्तारपूर्वक विश्लेषण (Detailed Analysis) कीजिए, ध्यान रहे सभी 8 बिंदुओं के साथ-साथ उनके प्रत्येक उपबिन्दुओ का भी विश्लेषण विस्तारपूर्वक होना चाहिए, अंत में प्रत्येक बिंदु का निष्कर्ष (Detailed Conclusion) भी दीजिए।\n\n" + dParashari;

            // Part 2: Parashari Conclusion Header (6 Points) + Jaimini Data
            var section2 = "\n\nविस्तारपूर्वक समग्र पराशरी निष्कर्ष :\n-------------------------------------------\nनिम्मलिखित " + name + " नामक " + gender + " के कुंडली के आधार पर उसके संभावित करियर विश्लेषण रिपोर्ट का गहन और विस्तारपूर्वक विश्लेषण (Detailed Analysis) कीजिए, ध्यान रहे सभी 6 बिंदुओं के साथ-साथ उनके प्रत्येक उपबिन्दुओ का भी विश्लेषण विस्तारपूर्वक होना चाहिए, अंत में प्रत्येक बिंदु का निष्कर्ष (Detailed Conclusion) भी दीजिए।\n\n" + dJaimini;

            // Part 3: Jaimini Conclusion Header (3 Points) + BNN Data
            var section3 = "\n\nविस्तारपूर्वक समग्र जैमिनी निष्कर्ष :\n-------------------------------------------\nनिम्मलिखित " + name + " नामक " + gender + " के कुंडली के आधार पर उसके संभावित करियर विश्लेषण रिपोर्ट का गहन और विस्तारपूर्वक विश्लेषण (Detailed Analysis) कीजिए, ध्यान रहे सभी 3 बिंदुओं के साथ-साथ उनके प्रत्येक उपबिन्दुओ का भी विश्लेषण विस्तारपूर्वक होना चाहिए, अंत में प्रत्येक बिंदु का निष्कर्ष (Detailed Conclusion) भी दीजिए।\n\n" + dBNN;

            // Part 4: BNN Conclusion Header (3 Points) + KP Data
            var section4 = "\n\nविस्तारपूर्वक समग्र BNN निष्कर्ष :\n-------------------------------------------\nनिम्मलिखित " + name + " नामक " + gender + " के कुंडली के आधार पर उसके संभावित करियर विश्लेषण रिपोर्ट का गहन और विस्तारपूर्वक विश्लेषण (Detailed Analysis) कीजिए, ध्यान रहे सभी 3 बिंदुओं के साथ-साथ उनके प्रत्येक उपबिन्दुओ का भी विश्लेषण विस्तारपूर्वक होना चाहिए, अंत में प्रत्येक बिंदु का निष्कर्ष (Detailed Conclusion) भी दीजिए।\n\n" + dKP;

            // Part 5: KP Conclusion Header
            var section5 = "\n\nविस्तारपूर्वक समग्र KP निष्कर्ष :";

            // Combine
            var fullPrompt = section1 + section2 + section3 + section4 + section5;

            // 3. Output
            document.getElementById('finalPrompt').value = fullPrompt;
            document.getElementById('outputArea').style.display = 'block';
            
            // Scroll to output
            document.getElementById('outputArea').scrollIntoView({behavior: 'smooth'});

        } catch (err) {
            alert("Error: " + err.message);
        }
    }

    function copyToClipboard() {
        var copyText = document.getElementById("finalPrompt");
        copyText.select();
        copyText.setSelectionRange(0, 99999);
        navigator.clipboard.writeText(copyText.value);
        alert("Copied!");
    }
</script>

</body>
</html>
