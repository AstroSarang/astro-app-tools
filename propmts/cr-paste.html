<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Career Analysis Tool (Final)</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #e1f5fe; /* Light Blue */
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #01579b;
            margin-bottom: 25px;
        }
        .row {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }
        .col {
            flex: 1;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 16px;
        }
        .section-box {
            background: #f1f8e9;
            padding: 15px;
            border: 1px solid #c5e1a5;
            margin-bottom: 15px;
            border-radius: 5px;
        }
        .section-title {
            color: #2e7d32;
            font-weight: bold;
            margin-bottom: 10px;
            border-bottom: 2px solid #2e7d32;
            display: inline-block;
        }
        textarea {
            height: 80px;
            resize: vertical;
        }
        button {
            width: 100%;
            padding: 15px;
            background-color: #01579b;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #0277bd;
        }
        #outputArea {
            margin-top: 30px;
            display: none;
            border-top: 3px solid #01579b;
            padding-top: 20px;
        }
        #finalPrompt {
            height: 350px;
            font-family: monospace;
            background-color: #fff8e1;
        }
        .copy-btn {
            background-color: #2e7d32;
            margin-top: 15px;
        }
        .copy-btn:hover {
            background-color: #1b5e20;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>CR Paste प्रॉम्प्ट जनरेटर</h1>

    <!-- Inputs -->
    <div class="row">
        <div class="col">
            <label>1. नाम (Name):</label>
            <input type="text" id="name" placeholder="उदा. विजय">
        </div>
        <div class="col">
            <label>2. लिंग (Gender):</label>
            <select id="gender">
                <option value="जातक">जातक (Male)</option>
                <option value="जातिका">जातिका (Female)</option>
            </select>
        </div>
        <div class="col">
            <label>3. भाषा (Language):</label>
            <select id="lang" onchange="if(document.getElementById('finalPrompt').value) generatePrompt();">
                <option value="hi" selected>हिंदी</option>
                <option value="en">English</option>
                <option value="mr">मराठी</option>
            </select>
        </div>
    </div>

    <!-- Data Areas -->
    <div class="section-box">
        <div class="section-title">Parashari Data</div>
        <textarea id="dataParashari" placeholder="पराशरी डेटा यहाँ पेस्ट करें..."></textarea>
    </div>

    <div class="section-box">
        <div class="section-title">Jaimini Data</div>
        <textarea id="dataJaimini" placeholder="Jaimini डेटा यहाँ पेस्ट करें..."></textarea>
    </div>

    <div class="section-box">
        <div class="section-title">BNN Data</div>
        <textarea id="dataBNN" placeholder="BNN डेटा यहाँ पेस्ट करें..."></textarea>
    </div>

    <div class="section-box">
        <div class="section-title">KP Data</div>
        <textarea id="dataKP" placeholder="KP डेटा यहाँ पेस्ट करें..."></textarea>
    </div>

    <button onclick="generatePrompt()">Create Prompt (प्रॉम्प्ट बनाएँ)</button>

    <!-- Output -->
    <div id="outputArea">
        <label>आपका प्रॉम्प्ट (Your Prompt):</label>
        <textarea id="finalPrompt" readonly></textarea>
        <button class="copy-btn" id="copyBtn" onclick="copyToClipboard()">Copy Prompt</button>
    </div>
</div>

<script>
    var T = {
        hi: {
            s1: function(n,g){ return "निम्मलिखित " + n + " नामक " + g + " के कुंडली के आधार पर उसके संभावित करियर विश्लेषण रिपोर्ट का गहन और विस्तारपूर्वक विश्लेषण (Detailed Analysis) कीजिए, ध्यान रहे सभी 8 बिंदुओं के साथ-साथ उनके प्रत्येक उपबिन्दुओ का भी विश्लेषण विस्तारपूर्वक होना चाहिए, अंत में प्रत्येक बिंदु का निष्कर्ष (Detailed Conclusion) भी दीजिए।"; },
            c1: "\n\nविस्तारपूर्वक समग्र पराशरी निष्कर्ष :\n-------------------------------------------",
            s2: function(n,g){ return "निम्मलिखित " + n + " नामक " + g + " के कुंडली के आधार पर उसके संभावित करियर विश्लेषण रिपोर्ट का गहन और विस्तारपूर्वक विश्लेषण (Detailed Analysis) कीजिए, ध्यान रहे सभी 6 बिंदुओं के साथ-साथ उनके प्रत्येक उपबिन्दुओ का भी विश्लेषण विस्तारपूर्वक होना चाहिए, अंत में प्रत्येक बिंदु का निष्कर्ष (Detailed Conclusion) भी दीजिए।"; },
            c2: "\n\nविस्तारपूर्वक समग्र जैमिनी निष्कर्ष :\n-------------------------------------------",
            s3: function(n,g){ return "निम्मलिखित " + n + " नामक " + g + " के कुंडली के आधार पर उसके संभावित करियर विश्लेषण रिपोर्ट का गहन और विस्तारपूर्वक विश्लेषण (Detailed Analysis) कीजिए, ध्यान रहे सभी 3 बिंदुओं के साथ-साथ उनके प्रत्येक उपबिन्दुओ का भी विश्लेषण विस्तारपूर्वक होना चाहिए, अंत में प्रत्येक बिंदु का निष्कर्ष (Detailed Conclusion) भी दीजिए।"; },
            c3: "\n\nविस्तारपूर्वक समग्र BNN निष्कर्ष :\n-------------------------------------------",
            s4: function(n,g){ return "निम्मलिखित " + n + " नामक " + g + " के कुंडली के आधार पर उसके संभावित करियर विश्लेषण रिपोर्ट का गहन और विस्तारपूर्वक विश्लेषण (Detailed Analysis) कीजिए, ध्यान रहे सभी 3 बिंदुओं के साथ-साथ उनके प्रत्येक उपबिन्दुओ का भी विश्लेषण विस्तारपूर्वक होना चाहिए, अंत में प्रत्येक बिंदु का निष्कर्ष (Detailed Conclusion) भी दीजिए।"; },
            c4: "\n\nविस्तारपूर्वक समग्र KP निष्कर्ष :"
        },
        en: {
            s1: function(n,g){ return "Based on the horoscope of " + n + " (" + g + "), provide a deep and detailed analysis of their prospective career analysis report. Ensure all 8 points along with each of their sub-points are analyzed in detail, and provide a detailed conclusion for each point at the end."; },
            c1: "\n\nDetailed Overall Parashari Conclusion:\n-------------------------------------------",
            s2: function(n,g){ return "Based on the horoscope of " + n + " (" + g + "), provide a deep and detailed analysis of their prospective career analysis report. Ensure all 6 points along with each of their sub-points are analyzed in detail, and provide a detailed conclusion for each point at the end."; },
            c2: "\n\nDetailed Overall Jaimini Conclusion:\n-------------------------------------------",
            s3: function(n,g){ return "Based on the horoscope of " + n + " (" + g + "), provide a deep and detailed analysis of their prospective career analysis report. Ensure all 3 points along with each of their sub-points are analyzed in detail, and provide a detailed conclusion for each point at the end."; },
            c3: "\n\nDetailed Overall BNN Conclusion:\n-------------------------------------------",
            s4: function(n,g){ return "Based on the horoscope of " + n + " (" + g + "), provide a deep and detailed analysis of their prospective career analysis report. Ensure all 3 points along with each of their sub-points are analyzed in detail, and provide a detailed conclusion for each point at the end."; },
            c4: "\n\nDetailed Overall KP Conclusion:"
        },
        mr: {
            s1: function(n,g){ return n + " नावाच्या " + g + " च्या कुंडलीच्या आधारे त्याच्या संभाव्य करियर विश्लेषण अहवालाचे सखोल आणि तपशीलवार विश्लेषण (Detailed Analysis) करा, सर्व 8 मुद्दे आणि त्यांच्या प्रत्येक उपमुद्द्यांचे तपशीलवार विश्लेषण झाले पाहिजे याची काळजी घ्या, शेवटी प्रत्येक मुद्द्याचा निष्कर्ष (Detailed Conclusion) द्या."; },
            c1: "\n\nतपशीलवार समग्र पराशरी निष्कर्ष :\n-------------------------------------------",
            s2: function(n,g){ return n + " नावाच्या " + g + " च्या कुंडलीच्या आधारे त्याच्या संभाव्य करियर विश्लेषण अहवालाचे सखोल आणि तपशीलवार विश्लेषण (Detailed Analysis) करा, सर्व 6 मुद्दे आणि त्यांच्या प्रत्येक उपमुद्द्यांचे तपशीलवार विश्लेषण झाले पाहिजे याची काळजी घ्या, शेवटी प्रत्येक मुद्द्याचा निष्कर्ष (Detailed Conclusion) द्या."; },
            c2: "\n\nतपशीलवार समग्र जैमिनी निष्कर्ष :\n-------------------------------------------",
            s3: function(n,g){ return n + " नावाच्या " + g + " च्या कुंडलीच्या आधारे त्याच्या संभाव्य करियर विश्लेषण अहवालाचे सखोल आणि तपशीलवार विश्लेषण (Detailed Analysis) करा, सर्व 3 मुद्दे आणि त्यांच्या प्रत्येक उपमुद्द्यांचे तपशीलवार विश्लेषण झाले पाहिजे याची काळजी घ्या, शेवटी प्रत्येक मुद्द्याचा निष्कर्ष (Detailed Conclusion) द्या."; },
            c3: "\n\nतपशीलवार समग्र BNN निष्कर्ष :\n-------------------------------------------",
            s4: function(n,g){ return n + " नावाच्या " + g + " च्या कुंडलीच्या आधारे त्याच्या संभाव्य करियर विश्लेषण अहवालाचे सखोल आणि तपशीलवार विश्लेषण (Detailed Analysis) करा, सर्व 3 मुद्दे आणि त्यांच्या प्रत्येक उपमुद्द्यांचे तपशीलवार विश्लेषण झाले पाहिजे याची काळजी घ्या, शेवटी प्रत्येक मुद्द्याचा निष्कर्ष (Detailed Conclusion) द्या."; },
            c4: "\n\nतपशीलवार समग्र KP निष्कर्ष :"
        }
    };

    function generatePrompt() {
        try {
            // 1. Get Values
            var nameRaw = document.getElementById('name').value;
            var name = nameRaw.trim() === "" ? "xyz" : nameRaw.trim();
            var gender = document.getElementById('gender').value;

            var dParashari = document.getElementById('dataParashari').value.trim();
            var dJaimini = document.getElementById('dataJaimini').value.trim();
            var dBNN = document.getElementById('dataBNN').value.trim();
            var dKP = document.getElementById('dataKP').value.trim();

            // 2. Build Strings with language templates
            var lang = document.getElementById('lang').value || 'hi';
            var t = T[lang] || T.hi;
            var gLabel = gender;
            if(lang==='en'){ gLabel = (gender==='जातक'?'native (male)':'native (female)'); }
            if(lang==='mr'){ gLabel = (gender==='जातक'?'जातक (पुरुष)':'जातिका (महिला)'); }

            var section1 = t.s1(name, gLabel) + "\n\n" + dParashari;
            var section2 = t.c1 + "\n" + t.s2(name, gLabel) + "\n\n" + dJaimini;
            var section3 = t.c2 + "\n" + t.s3(name, gLabel) + "\n\n" + dBNN;
            var section4 = t.c3 + "\n" + t.s4(name, gLabel) + "\n\n" + dKP;
            var section5 = t.c4;

            // Combine
            var fullPrompt = section1 + section2 + section3 + section4 + section5;

            // 3. Output
            document.getElementById('finalPrompt').value = fullPrompt;
            document.getElementById('outputArea').style.display = 'block';
            
            // Scroll to output
            document.getElementById('outputArea').scrollIntoView({behavior: 'smooth'});

        } catch (err) {
            alert("Error: " + err.message);
        }
    }

    function showCopyFeedback(btn, success){
        var origText = btn.innerHTML;
        var origBg = btn.style.background;
        if(success){
            btn.innerHTML = "✓ कॉपी हो गया!";
            btn.style.background = "#2e7d32";
        } else {
            btn.innerHTML = "✗ कॉपी नहीं हुआ";
            btn.style.background = "#c62828";
        }
        setTimeout(function(){
            btn.innerHTML = origText;
            btn.style.background = origBg;
        }, 2000);
    }
    function copyToClipboard() {
        var copyText = document.getElementById("finalPrompt");
        var btn = document.getElementById("copyBtn");
        var val = copyText.value;
        if(!val){ alert("पहले प्रॉम्प्ट बनाएं!"); return; }
        if(navigator.clipboard && window.isSecureContext){
            navigator.clipboard.writeText(val).then(function(){
                showCopyFeedback(btn, true);
            }).catch(function(){ fallbackCopy(copyText, btn); });
        } else {
            fallbackCopy(copyText, btn);
        }
    }
    function fallbackCopy(el, btn){
        el.focus(); el.select();
        el.setSelectionRange(0, 99999);
        try{
            var ok = document.execCommand('copy');
            showCopyFeedback(btn, ok);
            if(!ok) setTimeout(function(){alert("कॉपी नहीं हुआ - manually select करके copy करें")}, 2100);
        }catch(e){
            showCopyFeedback(btn, false);
        }
    }
</script>

</body>
</html>
