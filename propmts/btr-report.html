जातक का विवरण:

► जन्म चंद्रमा का नक्षत्र और उसका स्वामी ज्ञात करें।
► सुधारे गए जन्म समय का सटीक 'लग्न स्पष्ट' (Ascendant Longitude) राशी और डिग्री (अंश, कला और विकला) ज्ञात करें।

निर्देश (Step-by-Step Calculation):

कृपया एक विशेषज्ञ वैदिक ज्योतिषी की तरह निम्नलिखित चरणों का पालन करते हुए कुंद गुणांक की गणना करें:

निरपेक्ष भोगांश (Absolute Longitude): दिए गए 'लग्न स्पष्ट' को मेष राशि (0°) से गिनते हुए 360 डिग्री के पूर्ण चक्र (Absolute Degrees) में बदलें। (उदाहरण: वृषभ 15° 30' = 30° + 15.5° = 45.5°)।

कुंद गुणांक (Multiply by 81): प्राप्त निरपेक्ष भोगांश को 81 से गुणा करें।

चक्र निष्कासन (Modulo 360): गुणनफल में से 360 के पूर्ण चक्र हटा दें (यानी 360 से भाग दें और केवल शेषफल / Remainder लें)।

कुंद नक्षत्र की प्राप्ति: जो शेषफल (डिग्री) बचा है, उसे वापस राशि और नक्षत्र में बदलें। यह 'कुंद बिंदु' है। इस कुंद बिंदु का नक्षत्र और उस नक्षत्र का स्वामी ग्रह बताएं।

अंतिम सत्यापन (Verification): क्या कुंद बिंदु के नक्षत्र का स्वामी ग्रह, जातक के 'जन्म चंद्रमा के नक्षत्र स्वामी' के समान है या उससे त्रिकोण (1, 10, 19वें नक्षत्र) में है?

            });

            cleanText = filteredLines.join('\n').trim();

            if (cleanText.length > 5) { // खाली या बहुत छोटी स्ट्रिंग न दिखाएं
                createCard(cleanText, index + 1);
            }
        });
    }

    function createCard(text, id) {
        const container = document.getElementById('prompt-container');

        const card = document.createElement('div');
        card.className = 'card';

        const header = document.createElement('div');
        header.className = 'card-header';
        header.innerHTML = `<span>Prompt #${id}</span>`;

        const content = document.createElement('div');
        content.className = 'card-content';
        content.innerText = text;

        const btn = document.createElement('button');
        btn.className = 'btn';
        btn.innerText = 'Copy Prompt';
        btn.onclick = () => copyText(text);

        card.appendChild(header);
        card.appendChild(content);
        card.appendChild(btn);
        container.appendChild(card);
    }

    function copyText(text) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(() => {
                showToast();
            }).catch(err => {
                fallbackCopy(text);
            });
        } else {
            fallbackCopy(text);
        }
    }

    function fallbackCopy(text) {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.style.position = 'fixed'; // Avoid scrolling to bottom
        document.body.appendChild(textarea);
        textarea.focus();
        textarea.select();
        try {
            document.execCommand('copy');
            showToast();
        } catch (err) {
            console.error('Fallback: Oops, unable to copy', err);
        }
        document.body.removeChild(textarea);
    }

    function showToast() {
        var x = document.getElementById("snackbar");
        x.className = "toast show";
        setTimeout(function(){ x.className = x.className.replace("show", ""); }, 3000);
    }

    // Initialize
    processData();

    </script>
</body>
