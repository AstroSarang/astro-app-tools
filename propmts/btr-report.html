विषय: जन्म समय सुधार (BTR) - पराशरीय 'कुंद' (Kunda) गुणांक की गणना और सत्यापन

जातक का विवरण:

► जन्म चंद्रमा का नक्षत्र और उसका स्वामी ज्ञात करें।
► सुधारे गए जन्म समय का सटीक 'लग्न स्पष्ट' (Ascendant Longitude) राशी और डिग्री (अंश, कला और विकला) ज्ञात करें।

निर्देश (Step-by-Step Calculation):

कृपया एक विशेषज्ञ वैदिक ज्योतिषी की तरह निम्नलिखित चरणों का पालन करते हुए कुंद गुणांक की गणना करें:

निरपेक्ष भोगांश (Absolute Longitude): दिए गए 'लग्न स्पष्ट' को मेष राशि (0°) से गिनते हुए 360 डिग्री के पूर्ण चक्र (Absolute Degrees) में बदलें। (उदाहरण: वृषभ 15° 30' = 30° + 15.5° = 45.5°)।

कुंद गुणांक (Multiply by 81): प्राप्त निरपेक्ष भोगांश को 81 से गुणा करें।

चक्र निष्कासन (Modulo 360): गुणनफल में से 360 के पूर्ण चक्र हटा दें (यानी 360 से भाग दें और केवल शेषफल / Remainder लें)।

कुंद नक्षत्र की प्राप्ति: जो शेषफल (डिग्री) बचा है, उसे वापस राशि और नक्षत्र में बदलें। यह 'कुंद बिंदु' है। इस कुंद बिंदु का नक्षत्र और उस नक्षत्र का स्वामी ग्रह बताएं।

अंतिम सत्यापन (Verification): क्या कुंद बिंदु के नक्षत्र का स्वामी ग्रह, जातक के 'जन्म चंद्रमा के नक्षत्र स्वामी' के समान है या उससे त्रिकोण (1, 10, 19वें नक्षत्र) में है?

► निष्कर्ष: स्पष्ट रूप से बताएं कि क्या यह जन्म समय पराशरीय कुंद सिद्धांत के अनुसार 100% सटीक (Verified) है या इसमें कुछ सेकंड/मिनट के सुधार की आवश्यकता है।

(आता तुम्हाला तुमच्या काढलेल्या जन्मवेळेवर अंतिम गणितीय शिक्का मारायचा आहे.)

विषय: जन्मवेळ सुधारणा (BTR) - पराशरीय 'कुंद' (Kunda) गुणांकाची गणना आणि पडताळणी

जातकाचे तपशील:

► जन्म चंद्राचे नक्षत्र आणि त्याचा स्वामी जाणून घ्या.
► सुधारित जन्मवेळेचा अचूक 'लग्न स्पष्ट' (Ascendant Longitude) राशी आणि डिग्री (अंश, कला आणि विकला) जाणून घ्या.

सूचना (Step-by-Step Calculation):

कृपया तज्ज्ञ वैदिक ज्योतिषाप्रमाणे खालील चरणांचे पालन करत कुंद गुणांकाची गणना करा:

निरपेक्ष भोगांश (Absolute Longitude): दिलेल्या 'लग्न स्पष्ट' ला मेष राशीपासून (0°) मोजून 360 डिग्रीच्या पूर्ण चक्रात (Absolute Degrees) बदला. (उदाहरण: वृषभ 15° 30' = 30° + 15.5° = 45.5°).

कुंद गुणांक (Multiply by 81): मिळालेल्या निरपेक्ष भोगांशाला 81 ने गुणा करा.

चक्र निष्कासन (Modulo 360): गुणाकारातून 360 चे पूर्ण चक्र काढून टाका (म्हणजे 360 ने भाग द्या आणि फक्त बाकी / Remainder घ्या).

कुंद नक्षत्राची प्राप्ती: जी बाकी (डिग्री) उरली आहे, तिला परत राशी आणि नक्षत्रात बदला. हा 'कुंद बिंदु' आहे. या कुंद बिंदूचे नक्षत्र आणि त्या नक्षत्राचा स्वामी ग्रह सांगा.

अंतिम पडताळणी (Verification): कुंद बिंदूच्या नक्षत्राचा स्वामी ग्रह, जातकाच्या 'जन्म चंद्राच्या नक्षत्र स्वामी' प्रमाणेच आहे की त्याच्याशी त्रिकोणात (1, 10, 19 वे नक्षत्र) आहे?

निर्देश (Batch Calculation & Reverse Engineering):
मला 60 वेळा वेगवेगळी गणना करायची नाही. तुम्हाला एकाच वेळी पुढील 60 सेकंडांसाठी कुंद गुणांक तपासायचा आहे.
गणितीय नियम: 1 सेकंदाच्या वेळ अंतराळात लग्नाची डिग्री सरासरीने +15 विकला (15 Arc-seconds) पुढे जाते.

प्रक्रिया:
बेस लग्न स्पष्ट (Absolute Degree) ला 81 ने गुणून कुंद बिंदू आणि त्याचा नक्षत्र स्वामी काढा (हा 'सेकंड 0' असेल).
स्वामी ग्रह 'लक्ष्य ग्रहा'शी जुळत नसेल, तर बेस डिग्रीमध्ये +15 विकला मिळवा आणि पुन्हा 81 ने गुणून कुंद नक्षत्र स्वामी काढा (हा 'सेकंड 1' असेल).
कुंद बिंदूच्या नक्षत्राचा स्वामी आपल्या 'लक्ष्य ग्रहा'शी (किंवा त्याच्याशी त्रिकोणातील ग्रहाशी) 100% जुळत नाही तोपर्यंत ही प्रक्रिया (लूप) पुन्हा करा (जास्तीत जास्त 60 वेळा).
तुम्हाला मला पूर्ण 60+ आणि -60 = 120 वेळांची गणना दाखवायची नाही. फक्त एका टेबलमध्ये तो अचूक सेकंड आणि त्याची डिग्री सांगा जिथे हा मॅच यशस्वी झाला आहे.

    // सेपरेटर लॉजिक: --- या ___ लाइन्स से अलग करना
    const separatorRegex = /\n-{10,}\n|\n_{10,}\n/g;

    function processData() {
        const container = document.getElementById('prompt-container');
        // पहले डैश लाइन्स से तोड़ें
        let parts = getRawData().split(separatorRegex);

        parts.forEach((part, index) => {
            let cleanText = part.trim();

            // फिल्टरिंग लॉजिक
            const lines = cleanText.split('\n');
            const filteredLines = lines.filter(line => {
                const l = line.trim();
                // जंक (MMM... RRR... PPPP...) हटाएं
                if (l.match(/^[M|P|C|H|R]{5,}$/)) return false;
                // सिर्फ डैश वाली लाइन हटाएं
                if (l.match(/^-{5,}$/)) return false;
                return true;
            });

            cleanText = filteredLines.join('\n').trim();

            if (cleanText.length > 5) { // खाली या बहुत छोटी स्ट्रिंग न दिखाएं
                createCard(cleanText, index + 1);
            }
        });
    }

    function createCard(text, id) {
        const container = document.getElementById('prompt-container');

        const card = document.createElement('div');
        card.className = 'card';

        const header = document.createElement('div');
        header.className = 'card-header';
        header.innerHTML = `<span>Prompt #${id}</span>`;

        const content = document.createElement('div');
        content.className = 'card-content';
        content.innerText = text;

        const btn = document.createElement('button');
        btn.className = 'btn';
        btn.innerText = 'Copy Prompt';
        btn.onclick = () => copyText(text, btn);

        card.appendChild(header);
        card.appendChild(content);
        card.appendChild(btn);
        container.appendChild(card);
    }

    function showBtnFeedback(btn, success){
        if(!btn) return;
        var origText = btn.innerText;
        var origBg = btn.style.backgroundColor;
        btn.innerText = success ? "\u2713 Copied!" : "\u2717 Failed";
        btn.style.backgroundColor = success ? "#2e7d32" : "#c62828";
        btn.style.color = "#fff";
        setTimeout(function(){ btn.innerText = origText; btn.style.backgroundColor = origBg; }, 2000);
    }
    function copyText(text, btn) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(() => {
                showToast();
                showBtnFeedback(btn, true);
            }).catch(err => {
                fallbackCopy(text, btn);
            });
        } else {
            fallbackCopy(text, btn);
        }
    }

    function fallbackCopy(text, btn) {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.style.position = 'fixed'; // Avoid scrolling to bottom
        document.body.appendChild(textarea);
        textarea.focus();
        textarea.select();
        try {
            var ok = document.execCommand('copy');
            showToast();
            showBtnFeedback(btn, ok);
        } catch (err) {
            console.error('Fallback: Oops, unable to copy', err);
            showBtnFeedback(btn, false);
        }
        document.body.removeChild(textarea);
    }

    function showToast() {
        var x = document.getElementById("snackbar");
        x.className = "toast show";
        setTimeout(function(){ x.className = x.className.replace("show", ""); }, 3000);
    }

    // Initialize
    processData();
