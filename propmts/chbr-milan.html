<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Astro Prompts Copier</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        .card {
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-bottom: 15px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            border-left: 5px solid #007bff;
        }
        .card-content {
            white-space: pre-wrap;
            font-size: 14px;
            color: #555;
            max-height: 150px;
            overflow-y: auto;
            background: #f9f9f9;
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #eee;
            margin-bottom: 10px;
        }
        .card-header {
            font-weight: bold;
            margin-bottom: 5px;
            color: #007bff;
            display: flex;
            justify-content: space-between;
        }
        .btn {
            align-self: flex-end;
            background-color: #28a745;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: background 0.3s;
        }
        .btn:hover {
            background-color: #218838;
        }
        .btn:active {
            transform: scale(0.98);
        }
        .toast {
            visibility: hidden;
            min-width: 250px;
            background-color: #333;
            color: #fff;
            text-align: center;
            border-radius: 2px;
            padding: 16px;
            position: fixed;
            z-index: 1;
            left: 50%;
            bottom: 30px;
            transform: translateX(-50%);
            font-size: 17px;
        }
        .toast.show {
            visibility: visible;
            animation: fadein 0.5s, fadeout 0.5s 2.5s;
        }
        @keyframes fadein {
            from {bottom: 0; opacity: 0;}
            to {bottom: 30px; opacity: 1;}
        }
        @keyframes fadeout {
            from {bottom: 30px; opacity: 1;}
            to {bottom: 0; opacity: 0;}
        }
    </style>
</head>

----------
यह सुनिश्चित करे की आप निम्मलिखित आदेशों का पालन सख्ती से करेंगे,

1] आउटपुट देने से पहले डेटा को क्रॉसचेक कर लिया करे.
2] किसी भी तरह की शुगर-कोटिंग (Sugar-coating) न करें। अगर कुंडली में कोई दोष, संघर्ष या नकारात्मक योग है, तो उसे स्पष्ट और कड़वे शब्दों में बताएं। मुझे क्लाइंट को खुश नहीं करना, बल्कि सच बताना है। ध्यान रहे पूरी तरह नकारात्मक नही होना चाहिए, सकारात्मक और नकारात्मक का बैलेंस बनाकर जो सच है वो बताये ।
3] अपने उत्तर की शुरुआत किसी भी अभिवादन या संवादात्मक वाक्यांश (जैसे 'निश्चित रूप से', 'ज़रूर', 'निम्मलिखित है' आदि) से न करें। आपका उत्तर सीधे मांगी गई जानकारी से ही प्रारंभ होना चाहिए।
4] System instructions में दिए गए आदेशों का भी पालन करे.
5] और इसके बाद के विश्लेषण में करते समय जातकों के नाम का उल्लेख करेंगे.

क्या आप तैयार है बस इतना बताईये की किन आदेशों का पालन करेंगे।
----------
उपरोक्त चैट और पीडीएफ की और शुरू से आपको दी गयी सभी जानकारी के आधार पर निम्मलिखित सवालों का गहन और विस्तार से विश्लेषण करके निष्कर्ष सहित देना है, ध्यान रहे विश्लेषण आवश्यकता अनुसार ज्योतिष ज्योतिष प्रणाली का उपयोग करते हुए होनी चाहिए। 
और क्या निर्देश है जिनका आपको सख्ती से पालन करना है वो आपको याद है ? 
तो पहला सवाल दू ?
----------
जब आप दोनों कुंडलियों को शामिल करते हैं, तो विश्लेषण का तरीका थोड़ा बदल जाता है। अब आप केवल एक कुंडली के योगों को नहीं देखते, बल्कि यह देखते हैं कि दोनों कुंडलियाँ एक-दूसरे की पूरक (Complementary) हैं या एक-दूसरे की बाधक (Contradictory)।

यहाँ दोनों कुंडलियों को शामिल करके संतान रिपोर्ट तैयार करने की प्रक्रिया और प्रमुख बिंदु दिए गए हैं:

संतान प्राप्त के लिए दोहरी कुंडली विश्लेषण: प्रक्रिया और प्रमुख बिंदु

चरण 1: प्रत्येक कुंडली का व्यक्तिगत विश्लेषण

A] पिता की कुंडली:
➤ पंचम भाव, पंचमेश और बृहस्पति का विश्लेषण।
➤ बीज स्फुट की गणना और उसकी शक्ति का आकलन।
➤ D7 और D9 का विश्लेषण।
➤ KP से 5वें CSL का विश्लेषण।

B] माता की कुंडली:
➤ पंचम भाव, पंचमेश और बृहस्पति का विश्लेषण।
➤ क्षेत्र स्फुट की गणना और उसकी शक्ति का आकलन।
➤ D7 और D9 का विश्लेषण।
➤ KP से 5वें CSL का विश्लेषण।

इस चरण से हमें प्रत्येक व्यक्ति की संतान क्षमता और योगों की एक आधारभूत समझ मिलेगी।
----------
चरण 2: दोनों कुंडलियों का तुलनात्मक और संयुक्त विश्लेषण (Crux of the Analysis)

यह सबसे महत्वपूर्ण चरण है। यहाँ हम दोनों कुंडलियों को एक साथ रखकर देखेंगे।

A] योगों की पुष्टि और खंडन (Confirmation and Negation):

➤ सकारात्मक पुष्टि: यदि पिता की कुंडली में संतान का योग मजबूत है (जैसे, पंचमेश बलवान) और माता की कुंडली में भी योग मजबूत है, तो यह संतान होने की "दोहरी पुष्टि" (Double Confirmation) है। परिणाम निश्चित और सहज होगा।

➤ नकारात्मक पुष्टि: यदि पिता की कुंडली में संतान बाधा का योग है (जैसे, पंचमेश पीड़ित) और माता की कुंडली में भी वही बाधा है, तो समस्या गंभीर है और चिकित्सा सहायता या गहन उपायों की आवश्यकता होगी।

➤ संतुलन (Balancing Act): यदि एक कुंडली में योग मजबूत है और दूसरी में कमजोर, तो यह एक संतुलन की स्थिति है। बलवान कुंडली कमजोर कुंडली की कमी को पूरा कर सकती है। इससे संतान प्राप्ति में कुछ देरी या प्रयास के बाद सफलता मिलती है।

दोनों कुंडलियों में संतान प्राप्ति के लिए चल रही विंशोत्तरी और अन्य दशाओं का मिलान करें।

➤ आदर्श समय: वह समय सबसे प्रबल होता है जब माता और पिता दोनों की कुंडली में संतान देने वाले ग्रहों (जैसे, पंचमेश, गुरु, या KP के अनुसार 2, 5, 11 के सिग्निफिकेटर) की दशा या अंतर्दशा एक साथ चल रही हो।

यदि केवल एक की दशा अनुकूल है, तो भी संभावना बनती है, लेकिन जब दोनों की दशाएं सिंक (sync) में होती हैं, तो परिणाम लगभग निश्चित होता है।

➤ बाधक ग्रहों का क्रॉस-चेक:

पिता की कुंडली में बृहस्पति के अगले घर में या त्रिकोण में यदि राहु/केतु (सर्प दोष) है, और माता की कुंडली में भी संतान कारक ग्रह (बृहस्पति या शुक्र) राहु/केतु से पीड़ित है, तो यह 'पितृ दोष' या 'नाग दोष' की पुष्टि करता है। ऐसे में संयुक्त पूजा आवश्यक हो जाती है।

➤ संतान ग्रह का गोचर (Double Transit in BNN): जब गोचर का बृहस्पति, पिता की कुंडली के मंगल (पुरुष कारक) और माता की कुंडली के शुक्र (स्त्री कारक) को एक साथ दृष्टि या युति से सक्रिय करता है, वह समय गर्भधारण का होता है।

H] जैमिनी सूत्र (पुत्रकारक और आरूढ़ का समन्वय):

जैमिनी पद्धति आत्मा के स्तर पर और पदों (Arudhas) के माध्यम से सूक्ष्म विश्लेषण करती है।

➤ पुत्रकारक (PK) का संबंध:

दोनों कुंडलियों में 'पुत्रकारक' (PK - वह ग्रह जिसकी डिग्री दूसरे सबसे कम हो/चर कारक) की पहचान करें।

पिता का PK और माता का PK यदि मित्र राशि में हैं, या एक-दूसरे से केंद्र/त्रिकोण में हैं, तो संतान सुख आसानी से मिलता है। यदि वे परस्पर शत्रु हैं या 6-8-12 में हैं, तो गर्भपात या संतान संबंधी चिंता हो सकती है।

➤ मंत्र पद (A5) का विश्लेषण:

दोनों कुंडलियों में पंचम भाव का आरूढ़ (A5 या मंत्र पद) निकालें।

यदि पिता का A5, माता के लग्न/चंद्रमा से शुभ संबंध बनाता है (या इसके विपरीत), तो संतान परिवार में खुशहाली लाएगी।

यदि दोनों के A5 पीड़ित हैं या 'दारकारक' (DK) से दृष्ट हैं, तो संतान में देरी हो सकती है।

➤ चर दशा का सिंक (Sync): देखें कि क्या दोनों को ऐसी राशियों की चर दशा/अंतर्दशा चल रही है जो PK (पुत्रकारक) या पंचम भाव से जुड़ी हैं।

I] KP ज्योतिष (कस्पल सब लॉर्ड और सिग्निफिकेटर):

KP ज्योतिष घटना के "होने या न होने" (Promise) और "सटीक समय" (Precision) के लिए अंतिम मुहर लगाता है।

➤ 5वें कस्पल सब लॉर्ड (CSL) का संयुक्त निर्णय:

पिता और माता दोनों की कुंडली में 5वें भाव के उप-स्वामी (Sub Lord) की जाँच करें।

यदि पिता का 5वां CSL 2, 5, 11 भावों का कार्येश (Significator) है, और माता का 5वां CSL भी इन्हीं भावों (विशेषकर 5 और 11) को दर्शाता है, तो संतान प्राप्ति सुनिश्चित है।

क्रॉस-निषेध (Cross Negation): यदि पिता का 5वां CSL संतान प्राप्ति (2, 5, 11) दिखा रहा है, लेकिन माता का 5वां CSL पूर्णतः नकार रहा है (जैसे 4, 10, 12 - जो 5वें से 12वां, 6ठा और 8वां है), तो यह दर्शाता है कि पिता सक्षम है लेकिन माता को मेडिकल समस्या (Physical inability) हो सकती है।

➤ दशा-भुक्ति-अंतरा का सूक्ष्म मिलान:

KP में हम "विंशोत्तरी दशा" को ही सूक्ष्म स्तर पर देखते हैं। जब पिता और माता दोनों 'फलदायी ग्रहों' (Fruithful Significators - जो 2, 5, 11 के स्वामी/नक्षत्र स्वामी हों) की संयुक्त अवधि (Conjoined Period) में प्रवेश करते हैं, तभी घटना घटित होती है।

➤ रूलिंग प्लैनेट्स (RP) का सहयोग: विश्लेषण के समय के 'रूलिंग प्लैनेट्स' (RP) का उपयोग यह देखने के लिए करें कि क्या ईश्वर की अनुमति (Divine Will) अभी संतान के पक्ष में है। यदि RP दोनों कुंडलियों के 5वें भाव के स्वामियों के संपर्क में आते हैं, तो समय आ गया है।

सर्वांची माहिती क्रॉस चेक करून खात्री करा की ती बरोबर आहे की काही त्रुटी आहेत? ज्या त्रुटी असतील फक्त त्यांचीच यादी द्या.
----------
वर दिलेल्या कुंडली विश्लेषणासाठी तुम्हाला आतापर्यंत कोणकोणती माहिती मिळाली आहे, त्याची थोडक्यात यादी द्या.
----------
तुम्ही खालील आदेशांचे काटेकोरपणे पालन कराल याची खात्री करा,

1] आउटपुट देण्यापूर्वी डेटा क्रॉसचेक करा.
2] कोणत्याही प्रकारचे शुगर-कोटिंग (Sugar-coating) करू नका. कुंडलीत काही दोष, संघर्ष किंवा नकारात्मक योग असेल तर ते स्पष्ट आणि कडवट शब्दांत सांगा. मला क्लायंटला खूश करायचे नाही, तर खरे सांगायचे आहे. लक्षात ठेवा पूर्णपणे नकारात्मक नसावे; सकारात्मक आणि नकारात्मक यांचा समतोल ठेवून जे खरे आहे ते सांगा.
3] तुमच्या उत्तराची सुरुवात कोणत्याही अभिवादनाने किंवा संवादात्मक वाक्यांशाने (जसे 'निश्चितच', 'नक्की', 'खालीलप्रमाणे आहे' इ.) करू नका. तुमचे उत्तर थेट मागितलेल्या माहितीपासूनच सुरू झाले पाहिजे.
4] System instructions मधील आदेशांचेही पालन करा.
5] आणि यानंतरच्या विश्लेषणात जातकांच्या नावांचा उल्लेख करा.

तुम्ही तयार आहात का? फक्त इतके सांगा की कोणत्या आदेशांचे पालन कराल.
----------
वरील चॅट आणि PDF तसेच सुरुवातीपासून तुम्हाला दिलेल्या सर्व माहितीच्या आधारे खालील प्रश्नांचे सखोल आणि तपशीलवार विश्लेषण निष्कर्षासह द्या; लक्षात ठेवा की विश्लेषण गरजेनुसार ज्योतिष प्रणालीचा वापर करून केले पाहिजे. 
आणि ज्या निर्देशांचे तुम्हाला काटेकोरपणे पालन करायचे आहे ते तुम्हाला आठवतात का? 
तर पहिला प्रश्न देऊ का?
----------
जेव्हा दोन्ही कुंडलींचा समावेश करता, तेव्हा विश्लेषणाची पद्धत थोडी बदलते. आता तुम्ही फक्त एका कुंडलीतील योग पाहत नाही, तर दोन्ही कुंडली एकमेकींच्या पूरक (Complementary) आहेत की एकमेकींच्या बाधक (Contradictory) आहेत हे पाहता.

येथे दोन्ही कुंडलींचा समावेश करून संतान रिपोर्ट तयार करण्याची प्रक्रिया आणि प्रमुख मुद्दे दिले आहेत:

संतान प्राप्तीसाठी दुहेरी कुंडली विश्लेषण: प्रक्रिया आणि प्रमुख मुद्दे

चरण 1: प्रत्येक कुंडलीचे वैयक्तिक विश्लेषण

A] पित्याची कुंडली:
➤ पंचम भाव, पंचमेश आणि बृहस्पति यांचे विश्लेषण.
➤ बीज स्फुटाची गणना आणि त्याच्या शक्तीचे आकलन.
➤ D7 आणि D9 चे विश्लेषण.
➤ KP नुसार 5व्या CSL चे विश्लेषण.

B] मातेची कुंडली:
➤ पंचम भाव, पंचमेश आणि बृहस्पति यांचे विश्लेषण.
➤ क्षेत्र स्फुटाची गणना आणि त्याच्या शक्तीचे आकलन.
➤ D7 आणि D9 चे विश्लेषण.
➤ KP नुसार 5व्या CSL चे विश्लेषण.

या चरणामुळे प्रत्येक व्यक्तीच्या संतान क्षमता आणि योगांची एक मूळभूत समज आपल्याला मिळेल.
----------
चरण 2: दोन्ही कुंडलींचे तुलनात्मक आणि संयुक्त विश्लेषण (Crux of the Analysis)

हे सर्वात महत्त्वाचे चरण आहे. येथे आपण दोन्ही कुंडली एकत्र ठेवून पाहू.

A] योगांची पुष्टी आणि खंडन (Confirmation and Negation):

➤ सकारात्मक पुष्टी: जर पित्याच्या कुंडलीत संतानचा योग मजबूत असेल (उदा., पंचमेश बलवान) आणि मातेच्या कुंडलीतही योग मजबूत असेल, तर हे संतान होण्याची "दुहेरी पुष्टी" (Double Confirmation) आहे. परिणाम निश्चित आणि सहज असेल.

➤ नकारात्मक पुष्टी: जर पित्याच्या कुंडलीत संतान बाधेचा योग असेल (उदा., पंचमेश पीडित) आणि मातेच्या कुंडलीतही तीच बाधा असेल, तर समस्या गंभीर आहे आणि वैद्यकीय सहाय्य किंवा गहन उपायांची आवश्यकता असेल.

➤ संतुलन (Balancing Act): जर एका कुंडलीत योग मजबूत असेल आणि दुसऱ्यात कमजोर, तर ही संतुलनाची स्थिती आहे. बलवान कुंडली कमजोर कुंडलीची कमतरता भरून काढू शकते. यामुळे संतान प्राप्तीत काही उशीर किंवा प्रयत्नांनंतर यश मिळते.

----------
B] वेळेचे निर्धारण मिलान (Timing Synchronization):

दोन्ही कुंडलींत संतान प्राप्तीसाठी चालू असलेल्या विंशोत्तरी आणि इतर दशांचा मिलान करा.

➤ आदर्श वेळ: तो वेळ सर्वात प्रबल असतो जेव्हा माता आणि पिता दोन्हींच्या कुंडलीत संतान देणाऱ्या ग्रहांची (उदा., पंचमेश, गुरु, किंवा KP नुसार 2, 5, 11 चे सैगनिफिकेटर) दशा किंवा अंतर्दशा एकाच वेळी चालू असेल.

जर फक्त एकाची दशा अनुकूल असेल, तरीही शक्यता बनते, पण जेव्हा दोन्हींच्या दशा सिंक (sync) मध्ये असतात, तेव्हा परिणाम जवळजवळ निश्चित असतो.

C] गोचरचा दुहेरी प्रभाव (Dual Transit Effect):

➤ गोचरच्या बृहस्पति आणि शनिचा प्रभाव दोन्ही कुंडलींच्या पंचम भाव, पंचमेश आणि लग्नावर एकत्रितपणे पहा.

➤ जेव्हा गोचरचा बृहस्पति पित्याच्या पंचम भाव/पंचमेशाला सक्रिय करत असेल आणि त्याच वेळी मातेच्या पंचम भाव/पंचमेशालाही सक्रिय करत असेल, तेव्हा तो वेळ गर्भधारणेसाठी अत्यंत शुभ असतो.

➤ पित्याच्या D7 चा लग्नेश मातेच्या D7 च्या लग्नाशी शुभ संबंध निर्माण करत आहे का हे पहा.

E] D60 (षष्ट्यांश) कुंडलीचा सूक्ष्म आणि कर्म आधारित अभ्यास (Karmic Analysis):

➤ कर्म आणि पूर्व जन्माचे ऋण (Karmic Debts): D60 भाग्य आणि मागील जन्माच्या कर्मांचा अंतिम निर्णायक (Ultimate Decider) चार्ट आहे. जर D1 आणि D7 मध्ये संतान योग असूनही उशीर होत असेल, तर दोघांच्या (माता आणि पिता) D60 कुंडलीत पंचम भाव, पंचमेश आणि बृहस्पति यांची सखोल तपासणी करा.
➤ षष्ट्यांश देवतांचा प्रभाव: दोन्ही कुंडलींत संतान कारक ग्रह कोणत्या षष्ट्यांश देवतांत (उदा. अमृत, सुधा, सौम्य) आहेत हे पहा - तर पूर्व जन्माचे कोणतेही बाधक कर्म नाही. जर ते पाप षष्ट्यांशांत (उदा. यम, काल, भृष्ट, दावानल) असतील, तर हे गंभीर 'कर्म दोष' दर्शवते, ज्याच्या निवारणासाठी विशेष शांति किंवा अनुष्ठान अनिवार्य आहे.
➤ कर्मिक ब्लॉक (Karmic Blockages) चा मिलान: जर पित्याच्या D60 मध्ये संतान भाव पीडित असेल, पण मातेच्या D60 मध्ये तो खूप बलवान आणि शुभ षष्ट्यांशात असेल, तर मातेच्या पुण्यांच्या प्रभावाने संतान प्राप्ती शक्य आहे (बैलेंसिंग).
➤ ऋणानुबंध आणि आत्म्याचा स्तर (Soul Connection): पिता आणि मातेच्या D60 चार्टमध्ये पंचमेशाचा परस्पर संबंध पहा. जर हा संबंध शुभ असेल, तर हे दर्शवते की एक उच्च, पुण्यवान आणि भाग्यशाली आत्मा (Soul) या दांपत्याच्या माध्यमातून जन्म घेणार आहे.

G] BNN विश्लेषण (ग्रह कारक आणि युती संबंध):

नाडी ज्योतिष भावांऐवजी ग्रहांवर (कारकांवर) आणि त्यांच्या परस्पर संबंधांवर अधिक लक्ष केंद्रित करते.

➤ जीव कारक (बृहस्पति) यांची जुळणी: BNN मध्ये बृहस्पति (Jupiter) संततीचा मुख्य कारक आहे.

पित्याच्या कुंडलीतील बृहस्पति आणि मातेच्या कुंडलीतील बृहस्पति यांच्यातील संबंध पहा. जर ते एकमेकांपासून त्रिकोणात (1, 5, 9) असतील, तर हे संततीप्राप्तीसाठी अतिशय शुभ संकेत आहे (Soul Connection for lineage).

जर ते एकमेकांपासून 2/12 किंवा 6/8 (षडाष्टक) मध्ये असतील, तर संततीप्राप्तीत बाधा किंवा वैचारिक मतभेद होऊ शकतात.

➤ बाधक ग्रहांचा क्रॉस-चेक:

पित्याच्या कुंडलीत बृहस्पतिच्या पुढच्या घरात किंवा त्रिकोणात राहू/केतू (सर्प दोष) असल्यास, आणि मातेच्या कुंडलीतही संतती कारक ग्रह (बृहस्पति किंवा शुक्र) राहू/केतूंनी पीडित असल्यास, तर हे 'पितृ दोष' किंवा 'नाग दोष' यांची पुष्टी करते. अशा परिस्थितीत संयुक्त पूजा आवश्यक ठरते.

➤ संतती ग्रहाचा गोचर (Double Transit in BNN): जेव्हा गोचरचा बृहस्पति, पित्याच्या कुंडलीतील मंगळ (पुरुष कारक) आणि मातेच्या कुंडलीतील शुक्र (स्त्री कारक) यांना एकाच वेळी दृष्टि किंवा युतीने सक्रिय करतो, तो काळ गर्भधारणेचा असतो.

दोन्ही कुंडल्यांमधील 'पुत्रकारक' (PK - ज्या ग्रहाची डिग्री दुसऱ्या क्रमांकाने सर्वात कमी असेल/चर कारक) ओळखा.

पित्याचा PK आणि मातेचा PK जर मित्र राशींत असतील, किंवा एकमेकांपासून केंद्र/त्रिकोणात असतील, तर संततीसुख सहज मिळते. जर ते परस्पर शत्रू असतील किंवा 6-8-12 मध्ये असतील, तर गर्भपात किंवा संततीसंबंधी चिंता होऊ शकते.

जर दोन्हींचे A5 पीडित असतील किंवा 'दारकारक' (DK) ने दृष्ट असतील, तर संततीला उशीर होऊ शकतो.

➤ चर दशेचा सिंक (Sync): दोघांनाही अशा राशींची चर दशा/अंतर्दशा चालू आहे का ते पहा ज्या PK (पुत्रकारक) किंवा पंचम भावाशी जोडलेल्या आहेत.

I] KP ज्योतिष (कस्पल सब लॉर्ड आणि सैगनिफिकेटर):

KP ज्योतिष घटनेच्या "होण्या किंवा न होण्या" (Promise) आणि "अचूक वेळ" (Precision) साठी अंतिम मोहोर उमटवते.

➤ 5व्या कस्पल सब लॉर्ड (CSL) चा संयुक्त निर्णय:

पिता आणि माता दोघांच्याही कुंडलीत 5व्या भावाच्या उप-स्वामीची (Sub Lord) तपासणी करा.

जर पित्याचा 5वा CSL 2, 5, 11 भावांचा कार्येश (सैगनिफिकेटर) असेल, आणि मातेचा 5वा CSL देखील याच भावांचे (विशेषतः 5 आणि 11) दर्शन देत असेल, तर संततीप्राप्ती निश्चित आहे.

क्रॉस-निषेध (Cross Negation): जर पित्याचा 5वा CSL संततीप्राप्ती (2, 5, 11) दाखवत असेल, पण मातेचा 5वा CSL पूर्णपणे नाकारत असेल (जसे 4, 10, 12 - जे 5व्यापासून 12वे, 6वे आणि 8वे आहेत), तर हे दर्शवते की पिता सक्षम आहे पण मातेला वैद्यकीय समस्या (Physical inability) असू शकते.

➤ दशा-भुक्ति-अंतरा यांचा सूक्ष्म मिलाफ:

KP मध्ये आपण "विंशोत्तरी दशा" स्वतःच सूक्ष्म पातळीवर पाहतो. जेव्हा पिता आणि माता दोघेही 'फलदायी ग्रहां'च्या (Fruitful Significators - जे 2, 5, 11 चे स्वामी/नक्षत्र स्वामी असतील) संयुक्त कालावधीत (Conjoined Period) प्रवेश करतात, तेव्हाच घटना घडते.

➤ रूलिंग प्लॅनेट्स (RP) यांचे सहकार्य: विश्लेषणाच्या वेळेचे 'रूलिंग प्लॅनेट्स' (RP) वापरा हे पाहण्यासाठी की ईश्वराची इच्छा (Divine Will) सध्या संततीच्या बाजूने आहे का. जर RP दोन्ही कुंडल्यांच्या 5व्या भावाच्या स्वामींच्या संपर्कात येत असतील, तर वेळ आली आहे.

चरण 3: संयुक्त विश्लेषण निष्कर्ष (माता आणि पिता) :

या विभागात तुम्ही पुढील उप-बिंदूंवर प्रकाश टाकाल:

➤ संयुक्त शक्तीचे मूल्यांकन: "पित्याच्या कुंडलीत संतती योग (मजबूत/मध्यम/कमजोर) आहे, तर मातेच्या कुंडलीत हा योग (मजबूत/मध्यम/कमजोर) आहे. दोन्ही कुंडल्या एकत्र घेऊन, संततीची एकूण शक्यता (खूप प्रबळ/मध्यम/आव्हानात्मक) दिसते.

➤ आव्हानांचा स्रोत: "संततीप्राप्तीत उशीर होण्याचे मुख्य ज्योतिषीय कारण (पिता/माता/दोन्ही) यांच्या कुंडलीत दिसून येते.

➤ सिंक्रोनाइझ्ड टाइमिंग: "तुम्हा दोघांसाठी संततीप्राप्तीचा सर्वात शुभ काळ [वर्ष] ते [वर्ष] दरम्यान आहे, कारण या काळात तुम्हा दोघांच्या ग्रह दशा आणि गोचर संततीसाठी अनुकूल राहतील."

समग्र निष्कर्ष: "दोन्ही कुंडल्यांचे विश्लेषण केल्यावर असा निष्कर्ष निघतो की...`;
        let currentLang = 'hi';
        function getRawData() {
            if (currentLang === 'en') return rawData_en;
            if (currentLang === 'mr') return rawData_mr;
            return rawData_hi;
        }
        function changeLanguage(lang) {
            currentLang = lang;
            document.getElementById('prompt-container').innerHTML = '';
            processData();
        }

        // सेपरेटर लॉजिक: --- या ___ लाइन्स से अलग करना
        const separatorRegex = /\n-{10,}\n|\n_{10,}\n/g;
        
        function processData() {
            const container = document.getElementById('prompt-container');
            // पहले डैश लाइन्स से तोडें
            let parts = getRawData().split(separatorRegex);

            parts.forEach((part, index) => {
                let cleanText = part.trim();
                
                // फिल्टरिंग लॉजिक
                const lines = cleanText.split('\n');
                const filteredLines = lines.filter(line => {
                    const l = line.trim();
                    // जंक (MMM... RRR... PPPP...) हटाएं
                    if (l.match(/^[M|P|C|H|R]{5,}$/)) return false;
                    // सिर्फ डैश वाली लाइन हटाएं
                    if (l.match(/^-{5,}$/)) return false;
                    return true;
                });
                
                cleanText = filteredLines.join('\n').trim();

                if (cleanText.length > 5) { // खाली या बहुत छोटी स्ट्रिंग न दिखाएं
                    createCard(cleanText, index + 1);
                }
            });
        }

        function createCard(text, id) {
            const container = document.getElementById('prompt-container');
            
            const card = document.createElement('div');
            card.className = 'card';

            const header = document.createElement('div');
            header.className = 'card-header';
            header.innerHTML = `<span>Prompt #${id}</span>`;

            const content = document.createElement('div');
            content.className = 'card-content';
            content.innerText = text;

            const btn = document.createElement('button');
            btn.className = 'btn';
            btn.innerText = 'Copy Prompt';
            btn.onclick = () => copyText(text, btn);

            card.appendChild(header);
            card.appendChild(content);
            card.appendChild(btn);
            container.appendChild(card);
        }

        function showBtnFeedback(btn, success){
            if(!btn) return;
            var origText = btn.innerText;
            var origBg = btn.style.backgroundColor;
            btn.innerText = success ? "\u2713 Copied!" : "\u2717 Failed";
            btn.style.backgroundColor = success ? "#2e7d32" : "#c62828";
            btn.style.color = "#fff";
            setTimeout(function(){ btn.innerText = origText; btn.style.backgroundColor = origBg; }, 2000);
        }
        function copyText(text, btn) {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(() => {
                    showToast();
                    showBtnFeedback(btn, true);
                }).catch(err => {
                    fallbackCopy(text, btn);
                });
            } else {
                fallbackCopy(text, btn);
            }
        }

        function fallbackCopy(text, btn) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed'; // Avoid scrolling to bottom
            document.body.appendChild(textarea);
            textarea.focus();
            textarea.select();
            try {
                var ok = document.execCommand('copy');
                showToast();
                showBtnFeedback(btn, ok);
            } catch (err) {
                console.error('Fallback: Oops, unable to copy', err);
                showBtnFeedback(btn, false);
            }
            document.body.removeChild(textarea);
        }

        function showToast() {
            var x = document.getElementById("snackbar");
            x.className = "toast show";
            setTimeout(function(){ x.className = x.className.replace("show", ""); }, 3000);
        }

        // Initialize
        processData();

    </script>
